name: Build GT7 Live Connector

# Builds the Windows GT7-Live-Connector.exe with PyInstaller, mirroring
# build_connector.bat.
#
#  - Every push that touches the connector uploads the fresh .exe as a
#    downloadable build artifact (so it is always test-built).
#  - A manual run ("Run workflow" on the Actions tab, with a version like
#    v2.1) also publishes it to a GitHub Release, so the site's
#    /releases/latest/download/GT7-Live-Connector.exe link serves the new build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (e.g. v2.1). Leave blank to build without releasing."
        required: false
        default: "v2.1"
  push:
    branches:
      - claude/add-signup-page-pBzI2
      - claude/hello-l02wij
    paths:
      - "gt7_connector.py"
      - "build_connector.bat"
      - "requirements.txt"
      - ".github/workflows/build-connector.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (one-folder)
        # --onedir + zip: a one-folder build zipped up is flagged by Defender
        # far less than a single onefile .exe.
        # --noupx: UPX-packed binaries trip Defender's heuristics; skip it.
        # --version-file: embeds real version metadata (further reduces false positives).
        run: >
          pyinstaller --onedir --noconsole --noupx
          --name "GT7-Live-Connector"
          --icon NONE
          --version-file connector_version.txt
          --collect-all Crypto
          --hidden-import=Crypto.Cipher.Salsa20
          --hidden-import=Crypto.Cipher._Salsa20
          gt7_connector.py

      - name: Zip the connector folder
        shell: pwsh
        run: Compress-Archive -Path dist/GT7-Live-Connector -DestinationPath dist/GT7-Live-Connector.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Live-Connector
          path: dist/GT7-Live-Connector.zip
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_VERSION: "v2.1"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="$DEFAULT_VERSION"
          fi
          NOTES="Automated build of the GT7 Live Connector (one-folder zip; extract and run GT7-Live-Connector.exe inside). Includes the telemetry decryption fix and a self-diagnosing status readout."
          echo "Publishing release $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/GT7-Live-Connector.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/GT7-Live-Connector.zip --repo "$GITHUB_REPOSITORY" --title "GT7 Live Connector $TAG" --notes "$NOTES" --latest
          fi
