name: Build GTEC iOS reporter

# Compiles the iPhone reporter on a macOS runner, which is also how the
# macOS connector is built: a GitHub runner is a Mac for ten minutes at a
# time, and nobody has to have Xcode open to get a build out.
#
# This builds for the simulator with signing switched off, so it needs no
# Apple Developer account and no certificates. It proves the thing
# compiles, which is the only question that can be answered without an
# account.
#
# Putting it on a phone needs three more things, none of them code: the
# Developer Program at ninety-nine pounds a year, a signing certificate and
# provisioning profile stored here as secrets, and an upload step to
# TestFlight. TestFlight takes ten thousand external testers, so a league
# of two hundred installs from a link and updates arrive without a review
# each time.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/add-signup-page-pBzI2
      - claude/hello-l02wij
    paths:
      - 'gtec-reporter-ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Homebrew always installs the current XcodeGen, which writes a project
      # in the current format, so the Xcode reading it has to be at least as
      # new. The default on a runner image is not: macos-14 defaults to 15.4,
      # which refuses the file outright. Rather than name a version that will
      # be stale in six months, take whichever is newest on the image.
      - name: Use the newest Xcode on this runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Show the toolchain
        run: xcodebuild -version && swift --version

      # The project is generated from project.yml rather than checked in,
      # so there is no pbxproj to conflict over.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: gtec-reporter-ios
        run: xcodegen generate

      - name: Build
        working-directory: gtec-reporter-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project GTECReporter.xcodeproj \
            -scheme GTECReporter \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
