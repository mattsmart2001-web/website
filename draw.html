<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Live Driver Draw — The 2026 Gran Turismo Nordschleife 24 Hours</title>
    <link rel="icon" type="image/jpeg" href="sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;900&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060910;
            --bg-2: #0a0e15;
            --text: #ffffff;
            --muted: #94a3b8;
            --accent: #0ea5e9;
            --row-h: 88px;
            --visible-rows: 5;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        body.transparent-bg { background: transparent; }
        body.transparent-bg .draw-bg { display: none; }

        .draw-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at top, rgba(255,154,60,0.12), transparent 60%),
                radial-gradient(ellipse at bottom, rgba(124,58,237,0.16), transparent 60%),
                linear-gradient(180deg, #000 0%, #0a0e15 100%);
            z-index: -1;
        }

        .draw-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
            position: relative;
        }

        .draw-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .draw-header .kicker {
            font-family: 'Anton', sans-serif;
            font-size: clamp(0.7rem, 1.4vw, 0.95rem);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255,210,180,0.7);
            text-indent: 0.5em;
            margin-bottom: 0.5rem;
        }
        .draw-header h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(1.6rem, 3.6vw, 2.6rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(180deg,
                #fff1a8 0%,
                #ffd166 22%,
                #ff9a3c 44%,
                #ff6b6b 66%,
                #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            line-height: 1.05;
        }

        /* The reel */
        .reel-stage {
            perspective: 1400px;
            width: min(720px, 92vw);
            margin: 0 auto;
        }
        .reel-frame {
            position: relative;
            height: calc(var(--row-h) * var(--visible-rows));
            border-radius: 22px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 50%, rgba(255,255,255,0.04) 100%),
                linear-gradient(180deg, #11161f, #0a0e15);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow:
                0 30px 60px -30px rgba(0,0,0,0.6),
                inset 0 0 0 1px rgba(14,165,233,0.08);
            overflow: hidden;
            transform-style: preserve-3d;
            transform: rotateX(8deg);
        }
        .reel-window {
            position: absolute;
            inset: 0;
            overflow: hidden;
            mask-image: linear-gradient(180deg,
                transparent 0%,
                #000 22%,
                #000 78%,
                transparent 100%);
            -webkit-mask-image: linear-gradient(180deg,
                transparent 0%,
                #000 22%,
                #000 78%,
                transparent 100%);
        }
        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            will-change: transform;
        }
        .reel-row {
            height: var(--row-h);
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 1.5rem;
            font-family: 'Orbitron', sans-serif;
            color: rgba(255,255,255,0.75);
        }
        .reel-make {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }
        .reel-make.is-undecided {
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.4);
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-shadow: none;
        }
        .reel-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
        }
        .reel-psn {
            font-family: 'Anton', sans-serif;
            font-size: 1.6rem;
            color: var(--text);
            letter-spacing: 0.03em;
            line-height: 1;
            text-transform: uppercase;
        }
        .reel-car {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Highlight band over the centre row */
        .reel-highlight {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: var(--row-h);
            pointer-events: none;
            border-top: 2px solid rgba(255,154,60,0.55);
            border-bottom: 2px solid rgba(124,58,237,0.55);
            background:
                linear-gradient(180deg,
                    rgba(255,154,60,0.08) 0%,
                    rgba(124,58,237,0.1) 100%);
            box-shadow:
                0 0 30px rgba(255,154,60,0.25),
                inset 0 0 40px rgba(124,58,237,0.18);
            z-index: 2;
        }
        .reel-frame.is-winning .reel-highlight {
            border-top-color: #38bdf8;
            border-bottom-color: #38bdf8;
            box-shadow:
                0 0 40px rgba(14,165,233,0.55),
                inset 0 0 50px rgba(14,165,233,0.3);
            animation: winnerPulse 1.6s ease-in-out infinite;
        }
        @keyframes winnerPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(14,165,233,0.55), inset 0 0 50px rgba(14,165,233,0.3); }
            50%      { box-shadow: 0 0 70px rgba(14,165,233,0.85), inset 0 0 60px rgba(14,165,233,0.45); }
        }

        /* Winner banner */
        .winner-banner {
            margin-top: 1.5rem;
            text-align: center;
            min-height: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s, transform 0.4s;
        }
        .winner-banner.is-shown {
            opacity: 1;
            transform: translateY(0);
        }
        .winner-banner .winner-label {
            font-family: 'Anton', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--accent);
            text-indent: 0.5em;
            margin-bottom: 0.5rem;
        }
        .winner-banner .winner-name {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2rem, 4.5vw, 3.4rem);
            line-height: 1;
            background: linear-gradient(180deg,
                #fff1a8 0%,
                #ffd166 22%,
                #ff9a3c 44%,
                #ff6b6b 66%,
                #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Controls */
        .draw-controls {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.85rem;
        }
        .spin-btn {
            font-family: 'Anton', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 1.05rem 3rem 1rem;
            background: linear-gradient(135deg, #ff9a3c 0%, #ff6b6b 50%, #7c3aed 100%);
            color: #fff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow:
                0 10px 30px -10px rgba(255,107,107,0.55),
                inset 0 1px 0 rgba(255,255,255,0.3);
            transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
            text-indent: 0.25em;
        }
        .spin-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .spin-btn:active { transform: translateY(0); }
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .ghost-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 0.75rem 1.2rem;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .ghost-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.25);
        }
        .draw-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }
        .draw-checkbox input { accent-color: var(--accent); }

        /* Status row */
        .draw-status {
            margin-top: 1.5rem;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .draw-status .accent { color: var(--accent); }

        /* Recent winners */
        .recent-winners {
            margin-top: 1.25rem;
            max-width: 760px;
            margin-inline: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
        }
        .recent-winners .winner-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.3rem 0.7rem 0.3rem 0.4rem;
            background: rgba(14,165,233,0.08);
            border: 1px solid rgba(14,165,233,0.3);
            border-radius: 999px;
            font-size: 0.82rem;
            color: var(--text);
        }
        .recent-winners .winner-chip .seq {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.6em;
            height: 1.6em;
            padding: 0 0.45em;
            border-radius: 999px;
            background: var(--accent);
            color: var(--bg);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
        }

        /* Loading / error */
        .draw-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
            font-style: italic;
        }

        /* OBS overlay mode */
        body.obs-mode .draw-header,
        body.obs-mode .draw-controls,
        body.obs-mode .draw-status,
        body.obs-mode .recent-winners {
            display: none;
        }
        body.obs-mode .draw-page { padding: 1rem; }

        /* Footer hint */
        .footer-hint {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
            line-height: 1.6;
            max-width: 640px;
        }
        .footer-hint kbd {
            display: inline-block;
            padding: 0.1em 0.4em;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78em;
        }
        body.obs-mode .footer-hint { display: none; }
    </style>
</head>
<body>
<div class="draw-bg"></div>

<main class="draw-page">
    <header class="draw-header">
        <div class="kicker">The 2026 Gran Turismo</div>
        <h1>Nordschleife 24 Hours · Live Driver Draw</h1>
    </header>

    <div class="reel-stage">
        <div class="reel-frame" id="reelFrame">
            <div class="reel-window">
                <div class="reel-strip" id="reelStrip">
                    <div class="draw-empty" id="reelEmpty">Loading drivers…</div>
                </div>
            </div>
            <div class="reel-highlight"></div>
        </div>
    </div>

    <div class="winner-banner" id="winnerBanner">
        <div class="winner-label">Selected</div>
        <div class="winner-name" id="winnerName"></div>
    </div>

    <div class="draw-controls">
        <button class="spin-btn" id="spinBtn" disabled>Spin</button>
        <button class="ghost-btn" id="resetBtn">Reset draw</button>
        <label class="draw-checkbox">
            <input type="checkbox" id="removeDrawn" checked>
            Remove drawn drivers
        </label>
    </div>

    <div class="draw-status" id="drawStatus"></div>
    <div class="recent-winners" id="recentWinners"></div>

    <p class="footer-hint">
        Hotkey: <kbd>Space</kbd> to spin · Add <code>?obs=1</code> for an overlay-only view (no chrome) · <code>?bg=transparent</code> for a transparent background suitable for OBS browser sources.
    </p>
</main>

<script>
(function () {
    // ===== URL params =====
    const params = new URLSearchParams(location.search);
    if (params.get('obs') === '1') document.body.classList.add('obs-mode');
    if (params.get('bg') === 'transparent') document.body.classList.add('transparent-bg');

    // ===== DOM refs =====
    const reelFrame   = document.getElementById('reelFrame');
    const reelStrip   = document.getElementById('reelStrip');
    const reelEmpty   = document.getElementById('reelEmpty');
    const winnerBanner= document.getElementById('winnerBanner');
    const winnerName  = document.getElementById('winnerName');
    const spinBtn     = document.getElementById('spinBtn');
    const resetBtn    = document.getElementById('resetBtn');
    const removeChk   = document.getElementById('removeDrawn');
    const statusEl    = document.getElementById('drawStatus');
    const recentEl    = document.getElementById('recentWinners');

    // ===== Constants =====
    const ROW_HEIGHT = 88; // keep in sync with --row-h
    const VISIBLE_ROWS = 5; // keep in sync with --visible-rows
    const STRIP_COPIES = 14; // how many copies of the driver list in the strip — enough for a long spin
    const SPIN_DURATION_MS = 5200;
    const SPIN_EASING = 'cubic-bezier(0.16, 0.86, 0.18, 1)';

    // ===== Manufacturer table (matches signup.html) =====
    const MAKES = {
        'Alfa Romeo':   { short: 'ALFA',  color: '#c8102e' },
        'Aston Martin': { short: 'AST',   color: '#00665e' },
        'Audi':         { short: 'AUDI',  color: '#bb0a30' },
        'BMW':          { short: 'BMW',   color: '#0066b1' },
        'Chevrolet':    { short: 'CHEV',  color: '#c79a3a' },
        'Citroën':      { short: 'CITR',  color: '#c8102e' },
        'Dodge':        { short: 'DODG',  color: '#c40000' },
        'Ferrari':      { short: 'FER',   color: '#d40000' },
        'Ford':         { short: 'FORD',  color: '#003478' },
        'Genesis':      { short: 'GEN',   color: '#1a1a1a' },
        'Honda':        { short: 'HOND',  color: '#c40000' },
        'Hyundai':      { short: 'HYU',   color: '#002c5f' },
        'Jaguar':       { short: 'JAG',   color: '#9e1b32' },
        'Lamborghini':  { short: 'LAMB',  color: '#a37d2b' },
        'Lexus':        { short: 'LEX',   color: '#1a1a1a' },
        'Mazda':        { short: 'MAZ',   color: '#202830' },
        'McLaren':      { short: 'MCL',   color: '#ff8000' },
        'Mercedes':     { short: 'MERC',  color: '#5a5a5a' },
        'Mitsubishi':   { short: 'MITS',  color: '#c40000' },
        'Nissan':       { short: 'NIS',   color: '#c3002f' },
        'Peugeot':      { short: 'PEU',   color: '#1c1c1c' },
        'Porsche':      { short: 'POR',   color: '#b0001a' },
        'Renault':      { short: 'REN',   color: '#1a1a1a' },
        'Subaru':       { short: 'SUB',   color: '#0041aa' },
        'Suzuki':       { short: 'SUZ',   color: '#c40000' },
        'Toyota':       { short: 'TOY',   color: '#c40000' },
        'Volkswagen':   { short: 'VW',    color: '#001e50' },
    };
    function isUndecidedCar(car) { return !car || car.toLowerCase() === 'undecided'; }
    function getMake(car) {
        if (!car) return null;
        const n = car.toLowerCase();
        if (n.startsWith('alfa romeo'))   return MAKES['Alfa Romeo'];
        if (n.startsWith('aston martin')) return MAKES['Aston Martin'];
        if (n.startsWith('mercedes'))     return MAKES['Mercedes'];
        if (n.includes('citroën') || n.includes('citroen')) return MAKES['Citroën'];
        const first = n.split(/\s+/)[0];
        const single = {
            audi:'Audi', bmw:'BMW', chevrolet:'Chevrolet', dodge:'Dodge', ferrari:'Ferrari',
            ford:'Ford', genesis:'Genesis', honda:'Honda', hyundai:'Hyundai', jaguar:'Jaguar',
            lamborghini:'Lamborghini', lexus:'Lexus', mazda:'Mazda', mclaren:'McLaren',
            mitsubishi:'Mitsubishi', nissan:'Nissan', peugeot:'Peugeot', porsche:'Porsche',
            renault:'Renault', subaru:'Subaru', suzuki:'Suzuki', toyota:'Toyota',
            volkswagen:'Volkswagen',
        };
        return MAKES[single[first]] || null;
    }
    function textOn(hex) {
        const h = hex.replace('#','');
        const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
        return ((0.299*r + 0.587*g + 0.114*b) / 255) > 0.6 ? '#0a0e15' : '#fff';
    }
    function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    // ===== State =====
    let allDrivers = [];      // [{psn_id, preferred_car, ...}]
    let activePool = [];      // drivers still eligible to be drawn
    let winners    = [];      // [{psn_id, preferred_car}, ...] in draw order
    let spinning   = false;
    let currentStripOffset = 0;

    // ===== Rendering =====
    function rowHtml(d) {
        const car = (d.preferred_car || '').trim();
        const undecided = isUndecidedCar(car);
        const carText = undecided ? 'Car undecided' : car;
        const make = undecided ? null : getMake(car);
        let badge;
        if (make) {
            badge = `<div class="reel-make" style="background:${make.color};color:${textOn(make.color)}">${esc(make.short)}</div>`;
        } else {
            badge = `<div class="reel-make is-undecided">?</div>`;
        }
        return `
            <div class="reel-row">
                ${badge}
                <div class="reel-info">
                    <span class="reel-psn">${esc(d.psn_id)}</span>
                    <span class="reel-car">${esc(carText)}</span>
                </div>
            </div>
        `;
    }
    function buildStrip(driverList) {
        if (!driverList.length) {
            reelStrip.innerHTML = '<div class="draw-empty">No drivers left to draw.</div>';
            return;
        }
        let html = '';
        for (let copy = 0; copy < STRIP_COPIES; copy++) {
            for (const d of driverList) html += rowHtml(d);
        }
        reelStrip.innerHTML = html;
        // Reset transform to start position
        reelStrip.style.transition = 'none';
        reelStrip.style.transform  = 'translateY(0)';
        currentStripOffset = 0;
        // Force reflow so the next transition takes effect
        void reelStrip.offsetWidth;
    }
    function updateStatus() {
        const total = allDrivers.length;
        const left  = activePool.length;
        const drawn = winners.length;
        if (total === 0) {
            statusEl.textContent = 'No drivers loaded.';
            return;
        }
        statusEl.innerHTML = `Drawn <span class="accent">${drawn}</span> · Remaining <span class="accent">${left}</span> · Total <span class="accent">${total}</span>`;
    }
    function updateRecent() {
        if (!winners.length) {
            recentEl.innerHTML = '';
            return;
        }
        recentEl.innerHTML = winners.map((w, i) =>
            `<span class="winner-chip"><span class="seq">${i + 1}</span>${esc(w.psn_id)}</span>`
        ).join('');
    }

    // ===== Spin =====
    function spin() {
        if (spinning) return;
        if (!activePool.length) return;

        spinning = true;
        spinBtn.disabled = true;
        winnerBanner.classList.remove('is-shown');
        reelFrame.classList.remove('is-winning');

        const winnerIdx = Math.floor(Math.random() * activePool.length);
        const winner = activePool[winnerIdx];

        // Land at a copy near the middle of the strip so it can spin freely
        // in both directions. Centre the chosen row in the highlight band.
        const middleCopyStart = Math.floor(STRIP_COPIES / 2) * activePool.length;
        const targetRowIndex  = middleCopyStart + winnerIdx;
        const centreOffset    = (VISIBLE_ROWS - 1) / 2 * ROW_HEIGHT;
        const finalOffset     = targetRowIndex * ROW_HEIGHT - centreOffset;
        // Add a few extra full-list loops so it visibly spins past many names
        const extraLoops = 4 + Math.random() * 2;  // 4–6 loops
        const totalScroll = finalOffset + extraLoops * activePool.length * ROW_HEIGHT;

        reelStrip.style.transition = `transform ${SPIN_DURATION_MS}ms ${SPIN_EASING}`;
        reelStrip.style.transform  = `translateY(-${totalScroll}px)`;
        currentStripOffset = totalScroll;

        setTimeout(() => {
            // Settle: snap back to the equivalent position modulo one full list
            const settled = finalOffset;
            reelStrip.style.transition = 'none';
            reelStrip.style.transform  = `translateY(-${settled}px)`;
            currentStripOffset = settled;

            // Reveal winner
            winnerName.textContent = winner.psn_id;
            winnerBanner.classList.add('is-shown');
            reelFrame.classList.add('is-winning');

            winners.push(winner);
            if (removeChk.checked) {
                activePool = activePool.filter((_, i) => i !== winnerIdx);
                // Rebuild the strip from the new pool, but keep the winner visible briefly
                setTimeout(() => {
                    if (activePool.length) {
                        buildStrip(activePool);
                    } else {
                        reelStrip.style.transition = 'none';
                        reelStrip.innerHTML = '<div class="draw-empty">All drivers drawn.</div>';
                    }
                    reelFrame.classList.remove('is-winning');
                }, 2200);
            }

            updateStatus();
            updateRecent();
            spinning = false;
            spinBtn.disabled = activePool.length === 0;
        }, SPIN_DURATION_MS + 30);
    }

    function reset() {
        activePool = allDrivers.slice();
        winners = [];
        spinBtn.disabled = activePool.length === 0;
        reelFrame.classList.remove('is-winning');
        winnerBanner.classList.remove('is-shown');
        buildStrip(activePool);
        updateStatus();
        updateRecent();
    }

    // ===== Wire up controls =====
    spinBtn.addEventListener('click', spin);
    resetBtn.addEventListener('click', reset);
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement === document.body) {
            e.preventDefault();
            spin();
        }
    });

    // ===== Load drivers from the Netlify Function =====
    fetch('/.netlify/functions/signups')
        .then((r) => r.ok ? r.json() : Promise.reject(r.status))
        .then(({ drivers }) => {
            if (!drivers || !drivers.length) {
                reelStrip.innerHTML = '<div class="draw-empty">No drivers signed up yet.</div>';
                statusEl.textContent = 'Nothing to draw — yet.';
                return;
            }
            allDrivers = drivers;
            activePool = drivers.slice();
            spinBtn.disabled = false;
            buildStrip(activePool);
            updateStatus();
        })
        .catch(() => {
            reelStrip.innerHTML = '<div class="draw-empty">Couldn’t load the entry list.</div>';
            statusEl.textContent = 'Failed to load drivers.';
        });
})();
</script>

</body>
</html>
