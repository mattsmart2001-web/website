<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Interactive Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <div class="content">
        <h1>Welcome to My Three.js Website</h1>
        <p>Experience interactive 3D graphics in your browser</p>
        <div class="controls">
            <button id="colorBtn">Change Color</button>
            <button id="speedBtn">Toggle Speed</button>
            <button id="shapeBtn">Change Shape</button>
        </div>
    </div>

    <div class="info">
        <p>Move your mouse to interact with the scene</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
