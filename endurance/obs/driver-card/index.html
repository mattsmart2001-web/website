<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GTEC — OBS Driver Card</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-2: #11161f;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --gold: #ffd166;
        --gold-deep: #c79a3a;
        --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }
    /* Widget hugs its own content — size the OBS Browser Source a bit
       larger than needed (e.g. 620x180) and position/crop in OBS. */
    body { display: flex; align-items: flex-end; height: 100vh; padding: 12px; }

    #card {
        display: none;
        position: relative;
        align-items: stretch;
        gap: 0;
        background: linear-gradient(115deg, rgba(12, 16, 23, 0.95), rgba(8, 11, 16, 0.82));
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 34px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,209,102,0.06);
        overflow: hidden;
        opacity: 0;
        transform: translateX(-30px);
        animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #card.ready { display: flex; }
    @keyframes cardIn {
        to { opacity: 1; transform: translateX(0); }
    }

    /* Periodic shine sweep (added via the .flash class every ~45s). */
    #card::after {
        content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
        border-radius: inherit;
        background: linear-gradient(105deg, transparent 34%, rgba(255,255,255,0.16) 47%, rgba(255,209,102,0.12) 50%, transparent 63%);
        transform: translateX(-130%);
    }
    #card.flash::after { animation: shineSweep 1.15s ease-in-out; }
    @keyframes shineSweep { from { transform: translateX(-130%); } to { transform: translateX(130%); } }
    #card.flash .stat-value { animation: statPop 1.1s ease-in-out; }
    @keyframes statPop {
        0%, 100% { transform: scale(1); filter: none; }
        42% { transform: scale(1.13); filter: drop-shadow(0 0 10px rgba(255,209,102,0.55)); }
    }
    #card.flash .mfr-accent { animation: accentPulse 1.15s ease-in-out; }
    @keyframes accentPulse {
        0%, 100% { box-shadow: 0 0 14px -2px var(--mfr-color, var(--gold)); }
        45% { box-shadow: 0 0 22px 1px var(--mfr-color, var(--gold)); }
    }

    .mfr-accent { width: 6px; flex-shrink: 0; background: var(--mfr-color, var(--gold)); box-shadow: 0 0 14px -2px var(--mfr-color, var(--gold)); }

    .avatar-wrap {
        width: 76px; height: 76px; flex-shrink: 0; margin: 10px 0 10px 12px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        overflow: hidden;
        background: var(--bg-2);
        display: flex; align-items: center; justify-content: center;
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-init { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--gold); }

    .info { padding: 10px 18px 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 5px; min-width: 200px; }

    .name-row { display: flex; align-items: baseline; gap: 0.5rem; }
    .name { font-family: 'Anton', sans-serif; font-size: 1.35rem; letter-spacing: 0.02em; color: var(--text); text-transform: uppercase; line-height: 1.05; }
    .car-num { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 800; color: var(--gold); }

    .sub-row { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .sub-row .team-name { color: var(--text); font-weight: 600; }
    .mfr-logo { width: 15px; height: 15px; object-fit: contain; vertical-align: middle; }

    /* Stat panel — Points & ELO as the card's headline figures. */
    .stats { display: flex; align-items: stretch; margin-left: auto; flex-shrink: 0; }
    .stat {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; padding: 8px 20px; min-width: 84px;
        border-left: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.018);
    }
    .stat-label { font-family: 'Orbitron', sans-serif; font-size: 0.54rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .stat-value { font-family: 'Anton', sans-serif; font-size: 2.05rem; line-height: 0.92; color: var(--text); }
    .stat-value.gold {
        background: linear-gradient(180deg, #ffffff 0%, var(--gold) 95%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-tier { margin-top: 4px; transform: scale(0.9); transform-origin: center; }

    .gtec-mark {
        position: absolute; bottom: 4px; right: 8px;
        font-family: 'Orbitron', sans-serif; font-size: 0.5rem; font-weight: 700;
        letter-spacing: 0.25em; color: rgba(255,209,102,0.4); text-transform: uppercase;
    }

    #err { display: none; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 0.85rem; padding: 1rem; }
</style>
</head>
<body>

<div id="card"><div class="mfr-accent"></div><div class="avatar-wrap" id="avatar"></div><div class="info">
    <div class="name-row"><span class="name" id="d-name"></span><span class="car-num" id="d-num"></span></div>
    <div class="sub-row" id="d-sub"></div>
</div><div class="stats" id="d-stats"></div></div>
<div id="err">Add <code>?slug=driver-slug</code> to the URL to pick a driver.</div>

<script src="/endurance/assets/countries.js"></script>
<script src="/endurance/assets/elo-tiers.js?v=3"></script>
<script src="/endurance/assets/gtec-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);

const flagFor = code => (window.GTEC_COUNTRIES || []).find(c => c.code === (code || '').toUpperCase())?.flag || '';
const esc = s => { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
const initials = name => (name || '??').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);

async function render() {
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug');
    if (!slug) { document.getElementById('err').style.display = 'block'; return; }

    const { data: driver } = await sb.from('drivers')
        .select('id, display_name, slug, nationality, career_number, photo_url, teams!current_team_id(name), manufacturers(name, brand_color, logo_url)')
        .eq('slug', slug).maybeSingle();

    if (!driver) { document.getElementById('err').textContent = 'Driver not found.'; document.getElementById('err').style.display = 'block'; return; }

    const { data: season } = await sb.from('seasons').select('id').eq('is_active', true).maybeSingle();
    const [{ data: rating }, { data: standing }, splitRes] = await Promise.all([
        sb.from('driver_current_ratings').select('rating').eq('driver_id', driver.id).maybeSingle(),
        season ? sb.from('driver_standings').select('points').eq('driver_id', driver.id).eq('season_id', season.id).maybeSingle() : Promise.resolve({ data: null }),
        // The driver's split (lobby) for the live/next round of the season —
        // only known once admin has allocated splits for that event.
        season ? sb.from('entry_drivers')
            .select('entries!inner(lobby_number, events!inner(status, starts_at, season_id))')
            .eq('driver_id', driver.id)
            .eq('entries.events.season_id', season.id)
            .in('entries.events.status', ['in_progress', 'scheduled'])
            : Promise.resolve({ data: [] }),
    ]);

    // Prefer an in-progress round, else the soonest upcoming one; only if a
    // split has actually been allocated.
    let splitNumber = null;
    const splitCands = (splitRes.data || []).map(r => r.entries).filter(e => e && e.lobby_number != null);
    if (splitCands.length) {
        splitCands.sort((a, b) => {
            const ai = a.events.status === 'in_progress' ? 0 : 1;
            const bi = b.events.status === 'in_progress' ? 0 : 1;
            return (ai - bi) || (new Date(a.events.starts_at) - new Date(b.events.starts_at));
        });
        splitNumber = splitCands[0].lobby_number;
    }

    const card = document.getElementById('card');
    if (driver.manufacturers?.brand_color) card.style.setProperty('--mfr-color', driver.manufacturers.brand_color);

    const avatar = document.getElementById('avatar');
    avatar.innerHTML = driver.photo_url
        ? `<img src="${esc(driver.photo_url)}" alt="">`
        : `<span class="avatar-init">${initials(driver.display_name)}</span>`;

    document.getElementById('d-name').textContent = driver.display_name || '';
    document.getElementById('d-num').textContent = driver.career_number != null ? `#${driver.career_number}` : '';
    document.title = `${driver.display_name} — GTEC OBS Card`;

    const subParts = [];
    if (driver.teams?.name) {
        const mfrLogo = driver.manufacturers?.logo_url ? `<img class="mfr-logo" src="${esc(driver.manufacturers.logo_url)}" alt="">` : '';
        subParts.push(`${mfrLogo}<span class="team-name">${esc(driver.teams.name)}</span>`);
    } else if (driver.manufacturers?.name) {
        subParts.push(esc(driver.manufacturers.name));
    }
    if (driver.nationality) subParts.push(`${flagFor(driver.nationality)} ${esc(driver.nationality)}`);
    document.getElementById('d-sub').innerHTML = subParts.join(' <span style="opacity:0.4">·</span> ');

    const stats = [];
    if (splitNumber != null) {
        stats.push(`<div class="stat"><div class="stat-label">Split</div><div class="stat-value gold no-count">${splitNumber}</div></div>`);
    }
    if (standing?.points != null) {
        stats.push(`<div class="stat"><div class="stat-label">Points</div><div class="stat-value gold">${Number(standing.points)}</div></div>`);
    }
    if (rating?.rating) {
        const badge = window.eloTierBadge ? window.eloTierBadge(rating.rating) : '';
        stats.push(`<div class="stat"><div class="stat-label">Elo</div><div class="stat-value gold">${Math.round(rating.rating)}</div>${badge ? `<div class="stat-tier">${badge}</div>` : ''}</div>`);
    }
    document.getElementById('d-stats').innerHTML = stats.join('');

    card.classList.add('ready');

    // Count the headline numbers up on entrance so the card feels alive.
    countUpStats();

    // Every ~45s, sweep a shine across the card and pop the stats — a subtle,
    // recurring flourish for a card that lives on screen the whole stream.
    setInterval(() => {
        card.classList.remove('flash');
        void card.offsetWidth;           // restart the animation
        card.classList.add('flash');
    }, 45000);
}

function countUpStats() {
    document.querySelectorAll('#d-stats .stat-value:not(.no-count)').forEach(el => {
        const target = parseInt(el.textContent, 10);
        if (!Number.isFinite(target)) return;
        const dur = 850, start = performance.now();
        const tick = now => {
            const t = Math.min(1, (now - start) / dur);
            el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
            if (t < 1) requestAnimationFrame(tick);
            else el.textContent = target;
        };
        requestAnimationFrame(tick);
    });
}

render();
</script>
</body>
</html>
