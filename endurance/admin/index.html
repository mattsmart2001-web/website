async function saveMessageStatus(id) {
    const d = getFormData('entity-form');
    const reply = (d.admin_reply || '').trim();

    // Look up current reply to see if this is a NEW reply we should stamp
    const { data: existing } = await sb.from('driver_contact_messages')
        .select('admin_reply').eq('id', id).single();

    const payload = {
        status:     d.status,
        admin_note: d.admin_note || null,
        admin_reply: reply || null,
    };
    if (reply && (!existing?.admin_reply || existing.admin_reply !== reply)) {
        const { data: u } = await sb.auth.getUser();
        payload.replied_at = new Date().toISOString();
        payload.replied_by = u.user?.id || null;
        payload.driver_read_reply_at = null;  // reset read state for the new reply
    }

    const { error } = await sb.from('driver_contact_messages').update(payload).eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast(reply ? 'Reply sent to driver.' : 'Message updated.', 'success');
    closeModal();
    await renderMessages();
    await refreshMsgsBadge();
}

async function deleteMessage(id) {
    if (!confirm('Delete this message? This cannot be undone.')) return;
    const { error } = await sb.from('driver_contact_messages').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Deleted.', 'success');
    await renderMessages();
    await refreshMsgsBadge();
}

async function deleteBroadcastGroup(idsCsv, count) {
    if (!confirm(`Delete this broadcast and all ${count} recipient copies? This cannot be undone.`)) return;
    const ids = idsCsv.split(',').filter(Boolean);
    const { error } = await sb.from('driver_contact_messages').delete().in('id', ids);
    if (error) { toast(error.message, 'error'); return; }
    toast(`${count} broadcast copies deleted.`, 'success');
    await renderMessages();
    await refreshMsgsBadge();
}

                <td class="td-muted">${n.published_at ? n.published_at.slice(0,10) : '—'}</td>

                    <button class="btn-icon" onclick="editNews('${n.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteNews('${n.id}','${esc(n.title)}')">Delete</button>

    document.getElementById('content').innerHTML = `

            <table id="news-table"><thead><tr>
                <th>Title / Slug</th><th>Author</th><th>Status</th><th>Published</th><th></th>

function openNewsModal(n = {}) {
    openModal(n.id ? 'Edit Article' : 'New Article', newsForm(n), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveNews('${n.id || ''}')">Save</button>
    `);
}

async function editNews(id) {
    const { data } = await sb.from('news').select('*').eq('id', id).single();
    if (data) openNewsModal(data);
}

async function saveNews(id) {
    const d = getFormData('entity-form');
    if (!d.title || !d.slug) { toast('Title and slug are required.', 'error'); return; }
    const isPublished = !!document.getElementById('news-pub-cb')?.checked;
    const payload = {
        title: d.title,
        slug: d.slug,
        author: d.author || null,
        excerpt: d.excerpt || null,
        cover_url: d.cover_url || null,
        body: d.body || '',
        is_published: isPublished,
        published_at: d.published_at ? new Date(d.published_at).toISOString() : null,
        updated_at: new Date().toISOString(),
    };
    const { error } = id
        ? await sb.from('news').update(payload).eq('id', id)
        : await sb.from('news').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Article updated.' : 'Article created.', 'success');
    closeModal();
    await renderNews();
}

async function deleteNews(id, title) {
    if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
    const { error } = await sb.from('news').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Article deleted.', 'success');
    await renderNews();
}

async function renderMedia() {
    const { data, error } = await sb.from('media_items')
        .select('*, events(name)')
        .order('created_at', { ascending: false });
    if (error) { toast(error.message, 'error'); return; }

    const catLabel = (k) => {
        const m = MEDIA_CATEGORIES.find(c => c.value === k);
        return m ? m.label : k;
    };

    const thumbFor = (m) => {
        // YouTube thumbs are predictable from the video id; everything else
        // falls back to a play-icon tile.
        if (m.embed_provider === 'youtube') {
            const id = ytId(m.url);
            if (id) return `<img src="https://img.youtube.com/vi/${esc(id)}/hqdefault.jpg" alt="${esc(m.title) || 'Video'}" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block">`;
        }
        if (m.embed_provider) {
            return `<div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1300,#0a0a0a);color:var(--gold)">
                        <svg viewBox="0 0 24 24" width="42" height="42" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
                    </div>`;
        }
        return `<img src="${esc(m.url)}" alt="${esc(m.title) || 'Media'}" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block" onerror="this.style.minHeight='80px';this.alt='(load failed)'">`;
    };

    const grid = !data?.length
        ? `<div class="empty-state" style="grid-column:1/-1">No media yet. Add the first item with the Add button.</div>`
        : data.map(m => `
            <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative">
                ${thumbFor(m)}
                ${m.embed_provider ? `<span style="position:absolute;top:0.4rem;left:0.4rem;background:rgba(0,0,0,0.78);padding:0.15rem 0.45rem;border-radius:4px;font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold)">${esc(m.embed_provider)}</span>` : ''}
                <div style="padding:0.55rem 0.75rem">
                    <div style="font-size:0.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.title) || '—'}</div>
                    ${m.caption ? `<div style="font-size:0.7rem;color:var(--muted);margin-top:0.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.caption)}</div>` : ''}
                    ${m.category ? `<div style="font-size:0.65rem;color:var(--muted);margin-top:0.2rem;text-transform:uppercase;letter-spacing:0.1em">${esc(catLabel(m.category))}</div>` : ''}
                    ${m.events?.name ? `<div style="font-size:0.68rem;color:var(--gold);margin-top:0.2rem">${esc(m.events.name)}</div>` : ''}
                </div>
                <button class="btn-icon danger" style="position:absolute;top:0.4rem;right:0.4rem;background:rgba(0,0,0,0.75);border-radius:4px;padding:0.2rem 0.4rem;font-size:0.7rem"
                    onclick="deleteMedia('${m.id}')">✕</button>
            </div>`).join('');

    document.getElementById('content').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem">
            ${grid}
        </div>`;
}

// Pull the YouTube video id out of any common URL shape.
function ytId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
}

const MEDIA_CATEGORIES = [
    { value: 'race_highlights',    label: 'Race Highlights' },
    { value: 'podiums',            label: 'Podiums' },
    { value: 'liveries',           label: 'Liveries' },
    { value: 'onboards',           label: 'Onboards' },
    { value: 'behind_the_scenes',  label: 'Behind the Scenes' },
    { value: 'stewarding',         label: 'Stewarding' },
];

// Detect YouTube / Twitch / Vimeo from a pasted URL so admins don't
// have to pick a provider manually. Returns { provider, normalisedUrl }
// or null if it doesn't look like an embed-friendly video URL.
function detectEmbedProvider(raw) {
    if (!raw) return null;
    const url = raw.trim();
    if (/(?:youtube\.com|youtu\.be)/i.test(url))            return { provider: 'youtube', url };
    if (/(?:twitch\.tv|clips\.twitch\.tv)/i.test(url))      return { provider: 'twitch', url };
    if (/(?:vimeo\.com)/i.test(url))                        return { provider: 'vimeo', url };
    return null;
}

function openMediaModal() {
    const catOpts = '<option value="">— Uncategorised —</option>' +
        MEDIA_CATEGORIES.map(c => `<option value="${c.value}">${c.label}</option>`).join('');
    openModal('Add Media', `
        <form id="entity-form">
            <div class="form-group">
                <label>Type</label>
                <div style="display:flex;gap:1.25rem;align-items:center;font-size:0.84rem">
                    <label style="display:inline-flex;align-items:center;gap:0.35rem;cursor:pointer">
                        <input type="radio" name="media_kind" value="image" checked onchange="onMediaKindChange(this)">
                        Image upload
                    </label>
                    <label style="display:inline-flex;align-items:center;gap:0.35rem;cursor:pointer">
                        <input type="radio" name="media_kind" value="embed" onchange="onMediaKindChange(this)">
                        Video embed (YouTube / Twitch / Vimeo)
                    </label>
                </div>
            </div>
            <div class="form-group" id="media-image-group">
                <label>Image File <span class="required">*</span></label>
                <input type="file" id="media-file" accept="image/*" style="padding:0.4rem 0">
                <div class="form-hint">Uploads to Supabase Storage (gtec-media bucket). Max 50 MB.</div>
            </div>
            <div class="form-group" id="media-embed-group" style="display:none">
                <label>Video URL <span class="required">*</span></label>
                <input type="url" name="embed_url" placeholder="https://youtu.be/… or https://twitch.tv/videos/…">
                <div class="form-hint">YouTube, Twitch and Vimeo links are detected automatically.</div>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category">${catOpts}</select>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Race Start — Round 1">
            </div>
            <div class="form-group">
                <label>Caption</label>
                <input type="text" name="caption" placeholder="Optional short caption">
            </div>
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="saveMedia()">Save</button>`
    );
}

function onMediaKindChange(input) {
    const isEmbed = input.value === 'embed';
    document.getElementById('media-image-group').style.display = isEmbed ? 'none' : '';
    document.getElementById('media-embed-group').style.display = isEmbed ? '' : 'none';
}

async function saveMedia() {
    const d = getFormData('entity-form');
    const kind = document.querySelector('input[name="media_kind"]:checked')?.value || 'image';

    if (kind === 'embed') {
        const detected = detectEmbedProvider(d.embed_url);
        if (!detected) { toast('Paste a YouTube, Twitch or Vimeo URL.', 'error'); return; }
        const { error } = await sb.from('media_items').insert({
            title:    d.title    || null,
            caption:  d.caption  || null,
            url:      detected.url,
            category: d.category || null,
            embed_provider: detected.provider,
        });
        if (error) { toast(error.message, 'error'); return; }
        toast('Video added.', 'success');
        closeModal();
        await renderMedia();
        return;
    }

    const fileInput = document.getElementById('media-file');
    if (!fileInput?.files?.[0]) { toast('Select an image file.', 'error'); return; }
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    toast('Uploading…', 'success');
    const { error: upErr } = await sb.storage.from('gtec-media').upload(path, file);
    if (upErr) { toast(upErr.message, 'error'); return; }
    const { data: { publicUrl } } = sb.storage.from('gtec-media').getPublicUrl(path);
    const { error } = await sb.from('media_items').insert({
        title:    d.title   || null,
        caption:  d.caption || null,
        url:      publicUrl,
        category: d.category || null,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Media uploaded.', 'success');
    closeModal();
    await renderMedia();
}

async function deleteMedia(id) {
    if (!confirm('Delete this media item? The image file in storage will NOT be deleted automatically.')) return;
    const { error } = await sb.from('media_items').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Deleted.', 'success');
    await renderMedia();
}

async function renderPages() {
    const { data, error } = await sb.from('pages').select('*').order('slug');
    if (error) { toast(error.message, 'error'); return; }

    const rows = !data?.length
        ? `<tr><td colspan="4"><div class="empty-state">No pages found. Run the SQL to seed the rules page.</div></td></tr>`
        : data.map(p => `
            <tr>
                <td><strong>${esc(p.title)}</strong></td>
                <td class="td-muted">/endurance/${esc(p.slug)}/</td>
                <td class="td-muted">${p.updated_at ? p.updated_at.slice(0,10) : '—'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editPage('${esc(p.slug)}')">Edit</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <table id="pages-table"><thead><tr>
                <th>Title</th><th>URL</th><th>Last Updated</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function editPage(slug) {
    const { data } = await sb.from('pages').select('*').eq('slug', slug).single();
    if (!data) { toast('Page not found.', 'error'); return; }
    openModal(`Edit Page — ${esc(data.title)}`, `
        <form id="entity-form">
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" name="title" value="${esc(data.title)}" required>
            </div>
            <div class="form-group">
                <label>Body</label>
                <textarea id="page-body-editor" name="body">${esc(data.body)}</textarea>
                <div class="form-hint">Markdown — use the toolbar or type: <code># Heading</code>, <code>**bold**</code>, <code>- list</code>, <code>[link](url)</code></div>
            </div>
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="savePage('${esc(slug)}')">Save</button>`
    );
    // Init EasyMDE after the modal is rendered
    setTimeout(() => {
        if (!window.EasyMDE) { toast('Editor failed to load — check your connection.', 'error'); return; }
        window._pageMDE = new EasyMDE({
            element: document.getElementById('page-body-editor'),
            spellChecker: false,
            autoDownloadFontAwesome: false,
            status: ['lines', 'words'],
            minHeight: '380px',
            toolbar: [
                'bold', 'italic', '|',
                'heading-2', 'heading-3', '|',
                'unordered-list', 'ordered-list', '|',
                'link', 'quote', 'horizontal-rule', 'table', '|',
                'preview', 'side-by-side', 'fullscreen', '|',
                'guide',
            ],
            renderingConfig: { singleLineBreaks: false },
        });
    }, 0);
}

async function savePage(slug) {
    const titleEl = document.querySelector('#entity-form [name="title"]');
    const title = titleEl?.value?.trim();
    if (!title) { toast('Title is required.', 'error'); return; }
    const body = window._pageMDE
        ? window._pageMDE.value()
        : (document.querySelector('#entity-form [name="body"]')?.value || '');
    const { error } = await sb.from('pages').update({
        title,
        body,
        updated_at: new Date().toISOString(),
    }).eq('slug', slug);
    if (error) { toast(error.message, 'error'); return; }
    toast('Page saved.', 'success');
    closeModal();
    await renderPages();
}

// 11d. Admins

async function renderAdmins() {
    const { data, error } = await sb.rpc('list_admins');
    if (error) { toast(error.message, 'error'); return; }

    const rows = !data?.length
        ? `<tr><td colspan="4"><div class="empty-state">No admins found — that shouldn't happen.</div></td></tr>`
        : data.map(a => {
            const isSelf = currentUser && a.admin_user_id === currentUser.id;
            return `<tr>
                <td><strong>${esc(a.admin_email)}</strong>${isSelf ? ' <span class="badge badge-gold">You</span>' : ''}</td>
                <td class="td-muted" style="font-family:monospace;font-size:0.72rem">${esc(a.admin_user_id)}</td>
                <td class="td-muted">${a.granted_at ? a.granted_at.slice(0,10) : '—'}</td>
                <td><div class="row-actions">
                    ${isSelf
                        ? '<span class="td-muted" style="font-size:0.78rem">Cannot revoke self</span>'
                        : `<button class="btn-icon danger" onclick="revokeAdmin('${a.admin_user_id}','${esc(a.admin_email)}')">Revoke</button>`}
                </div></td>
            </tr>`;
        }).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap" style="padding:1.25rem;margin-bottom:1rem">
            <div style="font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:0.75rem">Grant Admin Access</div>
            <form onsubmit="grantAdminFromForm(event)" style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <input type="email" id="grant-email" placeholder="person@example.com" required
                    style="flex:1;min-width:240px;padding:0.6rem 0.8rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.9rem">
                <button class="btn btn-primary" type="submit">Grant Admin</button>
            </form>
            <div style="margin-top:0.75rem;font-size:0.78rem;color:var(--muted);line-height:1.5">
                The person must first create an account in Supabase Auth (or sign up at <code>/endurance/admin/login</code>) — this just adds the admin role to their existing user.
            </div>
        </div>

        <div class="table-wrap">
            <table><thead><tr>
                <th>Email</th><th>User ID</th><th>Granted</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function grantAdminFromForm(e) {
    e.preventDefault();
    const email = document.getElementById('grant-email').value.trim();
    if (!email) return;
    const { data, error } = await sb.rpc('grant_admin', { p_email: email });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not grant admin.', 'error'); return; }
    toast(`Admin granted to ${email}.`, 'success');
    await renderAdmins();
}

async function revokeAdmin(userId, email) {
    if (!confirm(`Revoke admin access for ${email}?`)) return;
    const { data, error } = await sb.rpc('revoke_admin', { p_user_id: userId });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not revoke.', 'error'); return; }
    toast('Admin access revoked.', 'success');
    await renderAdmins();
}


// ============================================================
// 12. Utilities
// ============================================================
function autoSlug(input, sourceName, targetId) {
    const target = document.getElementById(targetId);
    if (!target || target.dataset.edited) return;
    target.value = slugify(input.value);
    target.addEventListener('input', () => target.dataset.edited = '1', { once: true });
}

function filterTable(input, tableId) {
    const q = input.value.toLowerCase();
    document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}
