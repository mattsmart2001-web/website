async function viewEventEntries(eventId, eventName, seasonId) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading entries…</div>';

    const { data, error } = await sb.from('entries')
        .select('*, teams(name), manufacturers(name,brand_color), entry_drivers(id, stint_role, drivers(id,display_name))')
        .eq('event_id', eventId)
        .order('car_number');

    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    const entrStatusBadge = s => {
        const map = { confirmed: 'badge-green', withdrawn: 'badge-muted', dnq: 'badge-muted' };
        return `<span class="badge ${map[s] || 'badge-muted'}">${s}</span>`;
    };

    const rows = data.length === 0 ? `<tr><td colspan="7"><div class="empty-state">No entries yet — add one.</div></td></tr>` :
        data.map(en => {
            const driverTags = (en.entry_drivers || []).map(ed =>
                `<span style="display:inline-flex;align-items:center;gap:0.2rem;background:rgba(255,255,255,0.06);border-radius:4px;padding:0.1rem 0.4rem;font-size:0.75rem;margin:0.1rem">
                    ${esc(ed.drivers?.display_name)}
                    <button onclick="removeEntryDriver('${ed.id}','${eventId}','${esc(eventName)}','${seasonId}')"
                        style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;line-height:1;padding:0 0.1rem">×</button>
                 </span>`).join('');
            return `<tr>
                <td><strong>${en.car_number != null ? '#' + en.car_number : '<span class="td-muted">—</span>'}</strong></td>
                <td>${esc(en.teams?.name) || '—'}</td>
                <td>${en.manufacturers?.brand_color ? `<span class="color-swatch"><span class="swatch" style="background:${esc(en.manufacturers.brand_color)}"></span></span> ` : ''}${esc(en.manufacturers?.name) || '—'}</td>
                <td class="td-muted" style="font-size:0.82rem">${esc(en.car_model)}</td>
                <td><div style="display:flex;flex-wrap:wrap;gap:0.2rem;align-items:center">
                    ${driverTags}
                    ${en.team_id ? `<button class="btn-icon" style="padding:0.15rem 0.5rem;font-size:0.7rem"
                        onclick="openAddDriverModal('${en.id}','${en.team_id}','${en.car_number != null ? '#' + en.car_number + ' ' : ''}${esc(en.teams?.name)}','${eventId}','${esc(eventName)}','${seasonId}')">+ Driver</button>` : '<span style="font-size:0.7rem;color:var(--muted);font-style:italic">Solo</span>'}
                </div></td>
                <td>${entrStatusBadge(en.status)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon danger" onclick="removeEntry('${en.id}','${eventId}','${esc(eventName)}','${seasonId}')">Remove</button>
                </div></td>
            </tr>`;
        }).join('');

    // Compute how many season-registered teams still need an entry on this event
    const { data: ts } = await sb.from('team_seasons')
        .select('team_id, manufacturer_id, teams(name), manufacturers(name)')
        .eq('season_id', seasonId);
    const seasonRegisteredTeamIds = new Set((ts || []).map(r => r.team_id));
    const registeredTeamIds = new Set((data || []).map(en => en.team_id).filter(Boolean));
    const unregisteredTeams = (ts || []).filter(r => !registeredTeamIds.has(r.team_id));

    // Teams that have drivers but aren't yet in team_seasons for this season.
    // Pull them in too so admin doesn't have to detour into the Seasons section.
    const { data: anyDrivers } = await sb.from('drivers')
        .select('current_team_id, teams!current_team_id(id, name, manufacturer_id, manufacturers(name))')
        .not('current_team_id', 'is', null);
    const orphanTeams = [];
    const seenOrphan = new Set();
    (anyDrivers || []).forEach(d => {
        const team = d.teams;
        if (!team || !team.id) return;
        if (seasonRegisteredTeamIds.has(team.id)) return;
        if (registeredTeamIds.has(team.id)) return;
        if (seenOrphan.has(team.id)) return;
        if (!team.manufacturer_id) return;  // can't register without a mfr
        seenOrphan.add(team.id);
        orphanTeams.push({
            team_id:        team.id,
            team_name:      team.name,
            manufacturer_id: team.manufacturer_id,
            manufacturer_name: team.manufacturers?.name,
        });
    });

    // Drivers without a team who aren't already in any entry for this event
    const enteredDriverIds = new Set();
    (data || []).forEach(en => (en.entry_drivers || []).forEach(ed => enteredDriverIds.add(ed.driver_id ?? ed.drivers?.id)));
    const { data: freeAgents } = await sb.from('drivers')
        .select('id, display_name, career_number')
        .is('current_team_id', null)
        .not('user_id', 'is', null);
    const unregisteredFreeAgents = (freeAgents || []).filter(d => !enteredDriverIds.has(d.id));

    // Existing team entries with zero drivers — left from earlier bulk
    // registers when auto-link didn't run yet.
    const emptyTeamEntries = (data || []).filter(en =>
        en.team_id && (en.entry_drivers || []).length === 0
    );

    const totalNewTeams = unregisteredTeams.length + orphanTeams.length;
    const teamsLabel    = totalNewTeams > 0 ? `${totalNewTeams} Team${totalNewTeams === 1 ? '' : 's'}` : '';
    const backfillLabel = emptyTeamEntries.length > 0 ? `Backfill ${emptyTeamEntries.length} Empty Entr${emptyTeamEntries.length === 1 ? 'y' : 'ies'}` : '';
    const soloLabel     = unregisteredFreeAgents.length > 0 ? `${unregisteredFreeAgents.length} Solo Driver${unregisteredFreeAgents.length === 1 ? '' : 's'}` : '';
    const labelParts = [teamsLabel, backfillLabel, soloLabel].filter(Boolean);
    const labelText  = labelParts.length ? labelParts.join(' + ') : '';

    const headerBtn = labelText
        ? `<button class="btn-add" onclick="registerAllSeasonTeams('${eventId}','${esc(eventName)}','${seasonId}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                ${labelText}
            </button>`
        : (!ts || ts.length === 0) && (!freeAgents || freeAgents.length === 0)
            ? `<button class="btn-icon" onclick="navigate('seasons')">No season teams · Open Seasons</button>`
            : `<span style="font-size:0.78rem;color:var(--muted)">All teams and free-agent drivers registered.</span>`;

    const removeAllBtn = data.length > 0
        ? `<button class="btn-icon danger" onclick="removeAllEntries('${eventId}','${esc(eventName)}','${seasonId}',${data.length})">Remove All (${data.length})</button>`
        : '';

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Entries — ${esc(eventName)}</span>
                <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
                    ${removeAllBtn}
                    ${headerBtn}
                </div>
            </div>
            <table><thead><tr>
                <th>#</th><th>Team</th><th>Manufacturer</th><th>Car Model</th><th>Drivers</th><th>Status</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function registerAllSeasonTeams(eventId, eventName, seasonId) {
    const [{ data: ts }, { data: existing }, { data: freeAgents }, { data: entryDrivers }, { data: anyDrivers }, { data: absenceRows }] = await Promise.all([
        sb.from('team_seasons').select('team_id, manufacturer_id, manufacturers(name)').eq('season_id', seasonId),
        sb.from('entries').select('id, team_id, car_number').eq('event_id', eventId),
        sb.from('drivers').select('id, display_name, career_number, current_manufacturer_id, manufacturers(name,car_name)').is('current_team_id', null).not('user_id', 'is', null),
        sb.from('entry_drivers').select('driver_id, entry_id, entries!inner(event_id)').eq('entries.event_id', eventId),
        sb.from('drivers').select('current_team_id, teams!current_team_id(id, name, manufacturer_id, manufacturers(name))').not('current_team_id', 'is', null),
        sb.from('driver_event_absences').select('driver_id').eq('event_id', eventId),
    ]);

    const existingTeamIds  = new Set((existing || []).map(e => e.team_id).filter(Boolean));
    const enteredDriverIds = new Set((entryDrivers || []).map(ed => ed.driver_id));
    const seasonRegisteredTeamIds = new Set((ts || []).map(r => r.team_id));
    const absentDriverIds  = new Set((absenceRows || []).map(r => r.driver_id));

    // Auto-register any team that has drivers but isn't yet in team_seasons,
    // using the team's own manufacturer. Skip teams with no manufacturer set.
    const orphans = [];
    const seenOrphan = new Set();
    (anyDrivers || []).forEach(d => {
        const team = d.teams;
        if (!team?.id || !team.manufacturer_id) return;
        if (seasonRegisteredTeamIds.has(team.id)) return;
        if (existingTeamIds.has(team.id)) return;
        if (seenOrphan.has(team.id)) return;
        seenOrphan.add(team.id);
        orphans.push({
            team_id: team.id,
            manufacturer_id: team.manufacturer_id,
            manufacturer_name: team.manufacturers?.name,
        });
    });

    if (orphans.length) {
        const tsRows = orphans.map(o => ({
            team_id: o.team_id,
            season_id: seasonId,
            manufacturer_id: o.manufacturer_id,
        }));
        const { error: tsErr } = await sb.from('team_seasons').upsert(tsRows, { onConflict: 'team_id,season_id' });
        if (tsErr) { toast(`Auto-register team_seasons failed: ${tsErr.message}`, 'error'); return; }
        // Treat them as registered for the rest of this run.
        orphans.forEach(o => seasonRegisteredTeamIds.add(o.team_id));
        // Append to the ts list so they get entries below.
        orphans.forEach(o => (ts || []).push({
            team_id: o.team_id,
            manufacturer_id: o.manufacturer_id,
            manufacturers: { name: o.manufacturer_name },
        }));
    }

    // Existing team entries that have no drivers yet — left over from a
    // pre-auto-link bulk register or a manually-created empty entry.
    const driversPerEntry = new Map();
    (entryDrivers || []).forEach(ed => {
        driversPerEntry.set(ed.entry_id, (driversPerEntry.get(ed.entry_id) || 0) + 1);
    });
    const emptyTeamEntries = (existing || []).filter(en =>
        en.team_id && (driversPerEntry.get(en.id) || 0) === 0
    );

    const teamsToInsert = (ts || []).filter(r => !existingTeamIds.has(r.team_id)).map(r => ({
        event_id:        eventId,
        team_id:         r.team_id,
        manufacturer_id: r.manufacturer_id,
        car_model:       r.manufacturers?.car_name || r.manufacturers?.name || 'TBC',
        status:          'confirmed',
    }));

    const soloToInsert = (freeAgents || []).filter(d => !enteredDriverIds.has(d.id) && !absentDriverIds.has(d.id));

    if (!teamsToInsert.length && !soloToInsert.length && !emptyTeamEntries.length) {
        toast('All teams and free-agent drivers already registered.', 'success');
        return;
    }

    const msg = [
        teamsToInsert.length ? `${teamsToInsert.length} team${teamsToInsert.length === 1 ? '' : 's'}` : '',
        emptyTeamEntries.length ? `backfill ${emptyTeamEntries.length} existing team entr${emptyTeamEntries.length === 1 ? 'y' : 'ies'}` : '',
        soloToInsert.length  ? `${soloToInsert.length} solo driver${soloToInsert.length === 1 ? '' : 's'}` : '',
    ].filter(Boolean).join(' + ');
    if (!confirm(`Register ${msg} for "${eventName}"?\n\nTeam entries inherit the team's locked manufacturer and auto-link every driver currently assigned to the team (1, 2 or more).\nSolo driver entries are team-less — when the driver later joins a team, the entry auto-updates.`)) return;

    // 1. Insert team entries + auto-link the team's current drivers
    let totalTeamDrivers = 0;
    if (teamsToInsert.length) {
        const { data: createdTeamEntries, error } = await sb.from('entries').insert(teamsToInsert).select('id, team_id');
        if (error) { toast(error.message, 'error'); return; }

        const newTeamIds = (createdTeamEntries || []).map(e => e.team_id).filter(Boolean);
        if (newTeamIds.length) {
            const { data: teamDrivers } = await sb.from('drivers')
                .select('id, current_team_id, career_number')
                .in('current_team_id', newTeamIds);
            const byTeam = new Map();
            (teamDrivers || []).forEach(d => {
                const list = byTeam.get(d.current_team_id) || [];
                list.push(d);
                byTeam.set(d.current_team_id, list);
            });

            const driverLinks = [];
            const carNumberUpdates = [];
            for (const en of createdTeamEntries) {
                const drivers = (byTeam.get(en.team_id) || []).filter(d => !absentDriverIds.has(d.id));
                drivers.forEach(d => {
                    driverLinks.push({ entry_id: en.id, driver_id: d.id, stint_role: 'starting' });
                });
                totalTeamDrivers += drivers.length;
                const firstWithNum = drivers.find(d => d.career_number != null);
                if (firstWithNum) {
                    carNumberUpdates.push({ id: en.id, car_number: firstWithNum.career_number });
                }
            }
            if (driverLinks.length) {
                const { error: linkErr } = await sb.from('entry_drivers').insert(driverLinks);
                if (linkErr) toast(`Team entries inserted, but auto-linking drivers failed: ${linkErr.message}`, 'error');
            }
            for (const u of carNumberUpdates) {
                await sb.from('entries').update({ car_number: u.car_number }).eq('id', u.id);
            }
        }
    }

    // 1b. Backfill drivers on existing team entries that have none yet.
    let backfilledDrivers = 0;
    if (emptyTeamEntries.length) {
        const teamIds = [...new Set(emptyTeamEntries.map(en => en.team_id))];
        const { data: existingTeamDrivers } = await sb.from('drivers')
            .select('id, current_team_id, career_number')
            .in('current_team_id', teamIds);
        const byTeam2 = new Map();
        (existingTeamDrivers || []).forEach(d => {
            const list = byTeam2.get(d.current_team_id) || [];
            list.push(d);
            byTeam2.set(d.current_team_id, list);
        });
        const links2 = [];
        const carUpdates2 = [];
        for (const en of emptyTeamEntries) {
            const drivers = byTeam2.get(en.team_id) || [];
            drivers.forEach(d => links2.push({ entry_id: en.id, driver_id: d.id, stint_role: 'starting' }));
            backfilledDrivers += drivers.length;
            if (en.car_number == null) {
                const firstWithNum = drivers.find(d => d.career_number != null);
                if (firstWithNum) carUpdates2.push({ id: en.id, car_number: firstWithNum.career_number });
            }
        }
        if (links2.length) {
            const { error: linkErr } = await sb.from('entry_drivers').insert(links2);
            if (linkErr) toast(`Backfill failed: ${linkErr.message}`, 'error');
        }
        for (const u of carUpdates2) {
            await sb.from('entries').update({ car_number: u.car_number }).eq('id', u.id);
        }
    }

    // 2. Insert solo entries (one per driver), then link them in entry_drivers
    if (soloToInsert.length) {
        const soloEntries = soloToInsert.map(d => ({
            event_id: eventId,
            team_id:  null,
            status:   'confirmed',
            car_number:      d.career_number || null,
            car_model:       d.manufacturers?.car_name || d.manufacturers?.name || 'TBC',
            manufacturer_id: d.current_manufacturer_id || null,
        }));
        const { data: created, error: soloErr } = await sb.from('entries').insert(soloEntries).select('id');
        if (soloErr) { toast(soloErr.message, 'error'); return; }
        const links = (created || []).map((row, idx) => ({
            entry_id:  row.id,
            driver_id: soloToInsert[idx].id,
            stint_role: 'starting',
        }));
        if (links.length) {
            const { error: linkErr } = await sb.from('entry_drivers').insert(links);
            if (linkErr) { toast(`Solo entries inserted, but linking drivers failed: ${linkErr.message}`, 'error'); return; }
        }
    }

    const summary = [
        teamsToInsert.length ? `${teamsToInsert.length} team${teamsToInsert.length === 1 ? '' : 's'} (${totalTeamDrivers} driver${totalTeamDrivers === 1 ? '' : 's'})` : '',
        backfilledDrivers ? `${backfilledDrivers} backfilled driver${backfilledDrivers === 1 ? '' : 's'}` : '',
        soloToInsert.length  ? `${soloToInsert.length} solo` : '',
    ].filter(Boolean).join(' + ');
    toast(`Registered ${summary}.`, 'success');
    await viewEventEntries(eventId, eventName, seasonId);
}

        </form>`,

         <button class="btn btn-primary" onclick="saveEntry('${eventId}','${esc(eventName)}','${seasonId}')">Add Entry</button>`

function fillEntryMfr(sel) {
    const opt = sel.selectedOptions[0];
    const mfrId      = opt?.dataset.mfrId      || '';
    const mfrName    = opt?.dataset.mfrName    || '';
    const mfrCarName = opt?.dataset.mfrCarName || '';
    const hidden  = document.getElementById('manufacturer_id');
    const display = document.getElementById('entry-mfr-display');
    const carModel = document.querySelector('[name="car_model"]');
    if (hidden)  hidden.value = mfrId;
    if (display) {
        display.textContent = mfrName
            ? mfrName + '  (locked by season registration)'
            : 'Pick a team — manufacturer is locked by the season registration.';
        display.style.color = mfrName ? 'var(--text)' : 'var(--muted)';
    }
    if (carModel && !carModel.value && mfrCarName) carModel.value = mfrCarName;
}

async function saveEntry(eventId, eventName, seasonId) {
    const d = getFormData('entity-form');
    if (!d.entry_team_id || !d.manufacturer_id || !d.car_model) {
        toast('Fill in all required fields.', 'error'); return;
    }
    const { error } = await sb.from('entries').insert({
        event_id: eventId,
        team_id: d.entry_team_id,
        manufacturer_id: d.manufacturer_id,
        car_model: d.car_model,
        status: d.status || 'confirmed',
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Entry added — assign drivers next to set the car number.', 'success');
    closeModal();
    await viewEventEntries(eventId, eventName, seasonId);
}

async function removeEntry(entryId, eventId, eventName, seasonId) {
    if (!confirm('Remove this entry and all its results?')) return;
    const { error } = await sb.from('entries').delete().eq('id', entryId);
    if (error) { toast(error.message, 'error'); return; }
    toast('Entry removed.', 'success');
    await viewEventEntries(eventId, eventName, seasonId);
}

async function removeAllEntries(eventId, eventName, seasonId, count) {
    if (!confirm(`Remove all ${count} entr${count === 1 ? 'y' : 'ies'} for "${eventName}"?\n\nThis also removes every driver assignment and any results already recorded against these entries. This cannot be undone.`)) return;
    const { error } = await sb.from('entries').delete().eq('event_id', eventId);
    if (error) { toast(error.message, 'error'); return; }
    toast('All entries removed.', 'success');
    await viewEventEntries(eventId, eventName, seasonId);
}

    const eligible = _drivers.filter(d =>

                Assign drivers to the team first under <strong>Drivers</strong> or via team join requests in the driver portal.

                    <option value="">— Select Driver —</option>
                    ${driverOptsHTML}
                </select>

            </div>
            <div class="form-group">
                <label>Stint Role</label>
                ${selectHTML('stint_role', roleOpts, 'starting')}

        </form>`,

async function saveEntryDriver(entryId, eventId, eventName, seasonId) {
    const d = getFormData('entity-form');
    if (!d.driver_id) { toast('Select a driver.', 'error'); return; }
    const { error } = await sb.from('entry_drivers').insert({
        entry_id: entryId,
        driver_id: d.driver_id,
        stint_role: d.stint_role || 'starting',
    });
    if (error) { toast(error.message, 'error'); return; }

    // If this is the entry's first driver and the entry has no car number yet,
    // adopt the driver's career number as the car number.
    const { data: entry } = await sb.from('entries').select('car_number').eq('id', entryId).single();
    if (entry && entry.car_number == null) {
        const { data: drv } = await sb.from('drivers').select('career_number').eq('id', d.driver_id).single();
        if (drv?.career_number) {
            await sb.from('entries').update({ car_number: drv.career_number }).eq('id', entryId);
        }
    }

    toast('Driver added to entry.', 'success');
    closeModal();
    await viewEventEntries(eventId, eventName, seasonId);
}

async function removeEntryDriver(entryDriverId, eventId, eventName, seasonId) {
    if (!confirm('Remove this driver from the entry?')) return;
    const { error } = await sb.from('entry_drivers').delete().eq('id', entryDriverId);
    if (error) { toast(error.message, 'error'); return; }
    toast('Driver removed.', 'success');
    await viewEventEntries(eventId, eventName, seasonId);
}

const DR_TO_ELO  = { 'E': 800, 'D': 1100, 'C': 1300, 'B': 1500, 'A': 1700, 'A+': 1850, 'S': 2000 };
const SR_TO_BONUS = { 'E': -75, 'D': -45, 'C': -15, 'B': 15, 'A': 45, 'S': 75 };

function drToElo(letter) {
    return DR_TO_ELO[letter] ?? 1500;
}

// DR is the primary skill signal; SR nudges within a letter so an A/S driver
// ranks above an A/B driver before any race history exists.
function drSrSeed(drLetter, srLetter) {
    return (DR_TO_ELO[drLetter] ?? 1500) + (SR_TO_BONUS[srLetter] ?? 0);
}

async function viewEventLobbies(eventId, eventName, seasonId) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading splits…</div>';

    const { data: entries, error } = await sb.from('entries')
        .select(`
            id, lobby_number, car_number, car_model, status, host_driver_id,
            teams(name),
            manufacturers(name, brand_color),
            entry_drivers(driver_id, drivers(id, display_name, career_number, gt7_dr_rating, gt7_sr_rating))
        `)
        .eq('event_id', eventId);
    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    // Look up the previous round in this season (by round number, which is
    // always set, rather than starts_at which may not be) so we can show
    // whether each driver has been promoted, relegated or stayed put.
    const prevLobbyByDriver = new Map();
    const { data: thisEvent } = await sb.from('events').select('round').eq('id', eventId).maybeSingle();
    if (thisEvent?.round != null) {
        const { data: priorEvents } = await sb.from('events')
            .select('id')
            .eq('season_id', seasonId)
            .lt('round', thisEvent.round)
            .order('round', { ascending: false })
            .limit(1);
        const priorId = priorEvents?.[0]?.id;
        if (priorId) {
            const { data: priorEntries } = await sb.from('entries')
                .select('lobby_number, entry_drivers(driver_id)')
                .eq('event_id', priorId)
                .not('lobby_number', 'is', null);
            (priorEntries || []).forEach(en => {
                (en.entry_drivers || []).forEach(ed => {
                    if (ed.driver_id != null) prevLobbyByDriver.set(ed.driver_id, en.lobby_number);
                });
            });
        }
    }

    // Fetch the actual race-rated drivers (any row in driver_ratings means
    // they've been rated for real). driver_current_ratings.rating defaults to
    // 1500 even when there's no race history, so we can't trust that alone.
    const driverIds = Array.from(new Set((entries || []).flatMap(en => (en.entry_drivers || []).map(ed => ed.driver_id)))).filter(Boolean);
    const ratingMap = new Map();
    const ratedSet  = new Set();
    if (driverIds.length) {
        const [{ data: ratings }, { data: rated }] = await Promise.all([
            sb.from('driver_current_ratings').select('driver_id, rating').in('driver_id', driverIds),
            sb.from('driver_ratings').select('driver_id').in('driver_id', driverIds),
        ]);
        (ratings || []).forEach(r => ratingMap.set(r.driver_id, r.rating));
        (rated   || []).forEach(r => ratedSet.add(r.driver_id));
    }

    // Each driver's "skill" = real Elo if they've been rated, else DR+SR seed.
    const driverSkill = ed => {
        if (ratedSet.has(ed.driver_id)) return ratingMap.get(ed.driver_id) ?? 1500;
        return drSrSeed(ed.drivers?.gt7_dr_rating, ed.drivers?.gt7_sr_rating);
    };

    // Flatten to one row per driver. Two team-mates sharing an entry become
    // two rows in the same lobby (since lobby_number lives on the entry).
    const driverRows = [];
    (entries || []).forEach(en => {
        const eds = (en.entry_drivers || []).filter(ed => ed.drivers);
        if (eds.length === 0) {
            driverRows.push({ entry: en, driver: null, skill: 1500 });
        } else {
            eds.forEach(ed => {
                driverRows.push({ entry: en, driver: ed.drivers, skill: driverSkill(ed) });
            });
        }
    });

    // Group by entry's lobby_number
    const groups = {};
    driverRows.forEach(row => {
        const key = row.entry.lobby_number ?? 0;
        (groups[key] = groups[key] || []).push(row);
    });
    const lobbyNumbers = Object.keys(groups).map(Number).sort((a, b) => {
        if (a === 0) return 1; if (b === 0) return -1; return a - b;
    });

    const totalDrivers = driverRows.length;

    // Render a tiny movement pill that compares a driver's previous split
    // against their current one. Promotion / relegation / unchanged / new.
    const movePill = (driverId, currentLobby) => {
        if (currentLobby === 0 || driverId == null) return '';
        if (!prevLobbyByDriver.has(driverId)) {
            return `<span class="move-pill move-new" title="First event">NEW</span>`;
        }
        const prev = prevLobbyByDriver.get(driverId);
        if (prev > currentLobby)  return `<span class="move-pill move-up"   title="Promoted from Split ${prev}">↑ S${prev}</span>`;
        if (prev < currentLobby)  return `<span class="move-pill move-down" title="Relegated from Split ${prev}">↓ S${prev}</span>`;
        return `<span class="move-pill move-same" title="Same split as last round">–</span>`;
    };

    const renderLobbyCard = (lobbyNum, list) => {
        const title = lobbyNum === 0 ? 'Unassigned' : `Split ${lobbyNum}`;
        const sorted = list.slice().sort((a, b) => b.skill - a.skill);
        const rows = sorted.map(({ entry: en, driver: d }) => {
            const num = d?.career_number ?? en.car_number;
            const driverName = d ? esc(d.display_name) : '<em class="td-muted">No driver</em>';
            const hostBadge  = (en.host_driver_id && d?.id === en.host_driver_id)
                ? `<span class="badge badge-gold" style="font-size:0.6rem;padding:0.1em 0.5em;margin-left:0.4em;vertical-align:middle">HOST</span>`
                : '';
            // Show the real Elo only for drivers who've actually raced. Everyone
            // else gets their DR/SR letters (which is what we're sorting on).
            let skillCell = '<span class="td-muted">—</span>';
            if (d) {
                if (ratedSet.has(d.id)) {
                    const elo = ratingMap.get(d.id);
                    skillCell = `<span style="font-family:'Orbitron',sans-serif">${elo ?? '—'}</span> <span class="td-muted" style="font-size:0.7rem">Elo</span>`;
                } else {
                    const dr = d.gt7_dr_rating || '—';
                    const sr = d.gt7_sr_rating || '—';
                    skillCell = `<span style="font-family:'Orbitron',sans-serif">${esc(dr)}</span> <span class="td-muted">/</span> <span style="font-family:'Orbitron',sans-serif">${esc(sr)}</span> <span class="td-muted" style="font-size:0.7rem">DR/SR</span>`;
                }
            }
            return `<tr>
                <td>${num != null ? '<strong>#' + num + '</strong>' : '<span class="td-muted">—</span>'}</td>
                <td><strong>${driverName}</strong>${hostBadge}</td>
                <td class="td-muted" style="font-size:0.78rem">${esc(en.teams?.name) || '<em>Solo</em>'}</td>
                <td style="font-size:0.78rem">${skillCell}</td>
                <td>${movePill(d?.id, lobbyNum)}</td>
                <td><div class="row-actions" style="gap:0.25rem;justify-content:flex-end">
                    <button class="btn-icon" title="Move entry to a faster split"
                        onclick="moveEntryLobby('${en.id}',-1,'${eventId}','${esc(eventName)}','${seasonId}')">↑</button>
                    <button class="btn-icon" title="Move entry to a slower split"
                        onclick="moveEntryLobby('${en.id}',1,'${eventId}','${esc(eventName)}','${seasonId}')">↓</button>
                    ${lobbyNum !== 0 ? `<button class="btn-icon" title="Unassign entry"
                        onclick="setEntryLobby('${en.id}',null,'${eventId}','${esc(eventName)}','${seasonId}')">×</button>` : ''}
                </div></td>
            </tr>`;
        }).join('');
        return `<div class="section-card" style="margin-bottom:1rem">
            <div class="section-card-header">
                <span class="section-card-title">${title} <span class="td-muted" style="font-weight:normal;font-size:0.78rem">· ${list.length} driver${list.length === 1 ? '' : 's'}</span></span>
            </div>
            <table><thead><tr>
                <th>Car</th><th>Driver</th><th>Team</th><th>Skill</th><th>Move</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
    };

    const lobbyCardsHTML = totalDrivers === 0
        ? `<div class="empty-state">No entries yet — add them in the Entries panel first.</div>`
        : lobbyNumbers.map(n => renderLobbyCard(n, groups[n])).join('');

    panel.innerHTML = `
        <div class="section-card" style="margin-bottom:1rem">
            <div class="section-card-header">
                <span class="section-card-title">Splits — ${esc(eventName)}</span>
            </div>
            <div style="padding:1rem 1.25rem;display:flex;gap:0.85rem;align-items:flex-end;flex-wrap:wrap">
                <div class="form-group" style="margin:0;min-width:130px">
                    <label style="display:block;font-size:0.7rem;font-weight:600;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.35rem">Split size</label>
                    <input type="number" id="lobby-size" value="16" min="2" max="32" style="width:100%;padding:0.55rem 0.75rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.9rem">
                </div>
                <button class="btn btn-primary" onclick="autoAllocateLobbies('${eventId}','${esc(eventName)}','${seasonId}')">Auto-allocate</button>
                <button class="btn btn-ghost" onclick="clearAllLobbies('${eventId}','${esc(eventName)}','${seasonId}')">Clear All</button>
                <button class="btn btn-ghost" onclick="notifyLobbies('${eventId}','${esc(eventName)}','${seasonId}')">Notify Drivers</button>
                <button class="btn-icon danger" onclick="deleteLobbyNotifications('${eventId}','${esc(eventName)}','${seasonId}')">Delete Notifications</button>
                <div style="margin-left:auto;font-size:0.78rem;color:var(--muted)">Split size counts drivers. Sorted by race Elo if available, else by DR / SR.</div>
            </div>
        </div>
        ${lobbyCardsHTML}`;
}

async function autoAllocateLobbies(eventId, eventName, seasonId) {
    const sizeInput = document.getElementById('lobby-size');
    const lobbySize = Math.max(2, Math.min(32, parseInt(sizeInput?.value, 10) || 16));

    const { data: entries } = await sb.from('entries')
        .select(`id, car_number, entry_drivers(driver_id, drivers(id, career_number, gt7_dr_rating, gt7_sr_rating, willing_host, display_name, nationality))`)
        .eq('event_id', eventId)
        .neq('status', 'withdrawn');
    if (!entries?.length) { toast('No entries to allocate.', 'error'); return; }

    // Only treat drivers as "rated" if they actually have a race history row;
    // driver_current_ratings defaults everyone to 1500 otherwise, which would
    // make pre-season DR/SR seeding pointless.
    const driverIds = Array.from(new Set(entries.flatMap(en => (en.entry_drivers || []).map(ed => ed.driver_id)))).filter(Boolean);
    const ratingMap = new Map();
    const ratedSet  = new Set();
    if (driverIds.length) {
        const [{ data: ratings }, { data: rated }] = await Promise.all([
            sb.from('driver_current_ratings').select('driver_id, rating').in('driver_id', driverIds),
            sb.from('driver_ratings').select('driver_id').in('driver_id', driverIds),
        ]);
        (ratings || []).forEach(r => ratingMap.set(r.driver_id, r.rating));
        (rated   || []).forEach(r => ratedSet.add(r.driver_id));
    }

    const skillFor = ed => {
        if (ratedSet.has(ed.driver_id)) return ratingMap.get(ed.driver_id) ?? 1500;
        return drSrSeed(ed.drivers?.gt7_dr_rating, ed.drivers?.gt7_sr_rating);
    };

    // Rank each entry by its strongest driver, not the average. Team-mates
    // travel together (lobby_number is per entry), so averaging would push
    // a team whose star is A+ down behind a solo C if their team-mate is D.
    // Using max keeps the rule "no individual in Lobby N+1 is higher-rated
    // than anyone in Lobby N" — the only exception is the dragged-along
    // team-mate, which is unavoidable.
    entries.forEach(en => {
        const drs = (en.entry_drivers || []).map(skillFor);
        en._skill = drs.length ? Math.max(...drs) : 1500;
    });

    entries.sort((a, b) => b._skill - a._skill);

    // ------------------------------------------------------------------
    // Pack into lobbies, aiming for *even* sizes instead of cap-first.
    //
    // Old behaviour: filled each lobby up to lobbySize, started a new one
    // once the cap was hit. With 50 drivers / 25 teams of 2 / cap 16, that
    // gives 16+16+16+2 — the last lobby is two team-mates racing
    // themselves. Terrible.
    //
    // How many lobbies are actually needed is re-estimated fresh at every
    // bump — Math.ceil(remainingDrivers / lobbySize) — rather than fixed
    // once up front. A one-off upfront estimate goes stale as soon as
    // team-entry rounding drift makes an earlier lobby land over its
    // "even" share: with a frozen estimate, that drift eats into the
    // remaining lobby budget and the last lobby either overflows the cap
    // (if nothing stops it) or the tail end degenerates into a tiny
    // straggler lobby (if only the cap stops it). Recomputing on every
    // bump keeps the even-distribution target honest against reality the
    // whole way through, and the cap is still a hard limit throughout.
    //
    // For 50 drivers in 25 teams of 2 → 12/12/12/14, never 16/16/16/2.
    // ------------------------------------------------------------------
    const totalDriversAll = entries.reduce(
        (sum, en) => sum + Math.max(1, (en.entry_drivers || []).length),
        0,
    );

    let currentLobby      = 1;
    let currentCount      = 0;
    let remainingDrivers  = totalDriversAll;
    let remainingLobbies  = Math.max(1, Math.ceil(remainingDrivers / lobbySize));
    let currentTarget     = Math.ceil(remainingDrivers / remainingLobbies);

    let totalDrivers = 0;
    let failures = 0;
    for (let i = 0; i < entries.length; i++) {
        const en = entries[i];
        const driversInEntry = Math.max(1, (en.entry_drivers || []).length);
        const wouldExceedTarget = currentCount > 0 && currentCount + driversInEntry > currentTarget;
        const wouldExceedCap    = currentCount > 0 && currentCount + driversInEntry > lobbySize;
        if (wouldExceedCap || wouldExceedTarget) {
            remainingDrivers -= currentCount;
            currentLobby++;
            currentCount = 0;
            remainingLobbies = Math.max(1, Math.ceil(remainingDrivers / lobbySize));
            currentTarget = Math.ceil(remainingDrivers / remainingLobbies);
        }
        currentCount += driversInEntry;
        totalDrivers += driversInEntry;
        en._lobby = currentLobby;

        const payload = { lobby_number: currentLobby, host_driver_id: null };
        if (en.car_number == null) {
            const firstDriver = (en.entry_drivers || []).find(ed => ed.drivers?.career_number != null);
            if (firstDriver) payload.car_number = firstDriver.drivers.career_number;
        }
        const { error } = await sb.from('entries').update(payload).eq('id', en.id);
        if (error) failures++;
    }
    const totalLobbiesUsed = currentLobby;

    // Host selection — pick the highest-rated willing driver per lobby.
    // These drivers are always host if present in their lobby, regardless of willing_host flag.
    const DEFAULT_HOSTS = ['SparksTheory', 'l888-1'];
    // Only drivers from these nationalities are eligible to host (connection
    // quality to the lobby region), regardless of willing_host or
    // DEFAULT_HOSTS status. Geographic Europe, including UK/Norway/
    // Switzerland/Iceland. Russia and Türkiye deliberately left out —
    // transcontinental, latency to either can vary a lot; add them here if
    // that turns out fine in practice.
    const HOST_ELIGIBLE_NATIONALITIES = [
        'AD','AT','BE','BG','BY','CH','CY','CZ','DE','DK','EE','ES','FI','FR',
        'GB','GR','HR','HU','IE','IS','IT','LT','LU','LV','MC','MT','NL','NO',
        'PL','PT','RO','RS','SE','SI','SK','SM','UA',
    ];
    const lobbyMap = new Map();
    entries.forEach(en => {
        const ln = en._lobby;
        if (!ln) return;
        (en.entry_drivers || []).forEach(ed => {
            if (!HOST_ELIGIBLE_NATIONALITIES.includes(ed.drivers?.nationality)) return;
            const isDefaultHost = DEFAULT_HOSTS.includes(ed.drivers?.display_name);
            if (!ed.drivers?.willing_host && !isDefaultHost) return;
            const skill = isDefaultHost ? Infinity : skillFor(ed);
            const cur = lobbyMap.get(ln);
            if (!cur || skill > cur.skill) lobbyMap.set(ln, { entryId: en.id, driverId: ed.driver_id, skill });
        });
    });
    await Promise.all(Array.from(lobbyMap.values()).map(({ entryId, driverId }) =>
        sb.from('entries').update({ host_driver_id: driverId }).eq('id', entryId)
    ));

    toast(failures
        ? `Allocated with ${failures} failure(s).`
        : `${totalDrivers} driver${totalDrivers === 1 ? '' : 's'} across ${totalLobbiesUsed} split${totalLobbiesUsed === 1 ? '' : 's'}. ${lobbyMap.size} host${lobbyMap.size === 1 ? '' : 's'} assigned.`, failures ? 'error' : 'success');
    await viewEventLobbies(eventId, eventName, seasonId);
}

async function clearAllLobbies(eventId, eventName, seasonId) {
    if (!confirm('Clear all split assignments for this event?')) return;
    const { error } = await sb.from('entries').update({ lobby_number: null, host_driver_id: null }).eq('event_id', eventId);
    if (error) { toast(error.message, 'error'); return; }
    toast('Split assignments cleared.', 'success');
    await viewEventLobbies(eventId, eventName, seasonId);
}

async function notifyLobbies(eventId, eventName, seasonId) {
    if (!confirm(`Send a split-assignment notification to every driver in "${eventName}"?\n\nEach driver will get a message in their portal inbox, lobby hosts will additionally get hosting instructions in their inbox and by email, and a summary will post to Discord #split-announcements.`)) return;
    const { data, error } = await sb.rpc('notify_lobby_assignments', { p_event_id: eventId });
    if (error)     { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not send.', 'error'); return; }
    const hostNote = data.host_count ? ` (${data.host_count} host${data.host_count === 1 ? '' : 's'} also got hosting instructions in their inbox)` : '';
    toast(`Sent ${data.count} notification${data.count === 1 ? '' : 's'}${hostNote}.`, 'success');
    await refreshMsgsBadge();

    // Email lobby hosts — fetch entries that have a host assigned for this event
    try {
        const { data: { session: hostSession } } = await sb.auth.getSession();
        if (hostSession?.access_token) {
            const { data: ev } = await sb.from('events')
                .select('round, starts_at, tyre_wear, fuel_consumption, time_multiplier, weather, time_of_day, damage_level, slipstream, bop_enabled, quali_same_as_race, quali_notes, equal_conditions_mode, shortcut_penalty, wall_collision_penalty, car_collision_penalty, ghosting, pit_lane_cutting_penalty')
                .eq('id', eventId).maybeSingle();
            const { data: hostEntries } = await sb.from('entries')
                .select('lobby_number, host_driver_id')
                .eq('event_id', eventId)
                .not('host_driver_id', 'is', null);
            if (hostEntries?.length) {
                let hostEmailsSent = 0;
                await Promise.all(hostEntries.map(async en => {
                    try {
                        const res = await fetch('/.netlify/functions/send-lobby-host-email', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${hostSession.access_token}` },
                            body: JSON.stringify({
                                driver_id:    en.host_driver_id,
                                event_name:   eventName,
                                round:        ev?.round ?? null,
                                lobby_number: en.lobby_number,
                                starts_at:    ev?.starts_at ?? null,
                                race_settings: {
                                    tyre_wear:       ev?.tyre_wear       ?? null,
                                    fuel_consumption:ev?.fuel_consumption ?? null,
                                    time_multiplier: ev?.time_multiplier  ?? null,
                                    weather:         ev?.weather          ?? null,
                                    time_of_day:     ev?.time_of_day      ?? null,
                                    damage_level:    ev?.damage_level     ?? null,
                                    slipstream:      ev?.slipstream       ?? null,
                                    bop_enabled:     ev?.bop_enabled      ?? false,
                                    equal_conditions_mode:    ev?.equal_conditions_mode    ?? false,
                                    shortcut_penalty:         ev?.shortcut_penalty         ?? false,
                                    wall_collision_penalty:   ev?.wall_collision_penalty   ?? false,
                                    car_collision_penalty:    ev?.car_collision_penalty    ?? false,
                                    ghosting:                 ev?.ghosting                 ?? false,
                                    pit_lane_cutting_penalty: ev?.pit_lane_cutting_penalty ?? false,
                                },
                                quali_same_as_race: ev?.quali_same_as_race !== false,
                                quali_notes:        ev?.quali_notes        ?? null,
                            }),
                        });
                        if (res.ok) hostEmailsSent++;
                        else console.warn('Host email failed for', en.host_driver_id, res.status, await res.text());
                    } catch (e) { console.warn('Host email error:', e); }
                }));
                if (hostEmailsSent > 0) toast(`Host email${hostEmailsSent === 1 ? '' : 's'} sent to ${hostEmailsSent} driver${hostEmailsSent === 1 ? '' : 's'}.`, 'success');
            }
        }
    } catch (e) { console.warn('Host email dispatch error:', e); }

    // Also post split assignments to Discord #split-announcements (best effort — non-blocking)
    try {
        const { data: { session: discordSession } } = await sb.auth.getSession();
        if (discordSession?.access_token) {
            const { data: ev } = await sb.from('events').select('round').eq('id', eventId).maybeSingle();
            fetch('/.netlify/functions/notify-discord-splits', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${discordSession.access_token}` },
                body: JSON.stringify({ event_id: eventId, event_name: eventName, round: ev?.round ?? null }),
            }).then(async r => {
                if (!r.ok) console.warn('Discord splits post failed:', r.status, await r.text());
                else console.log('Discord splits posted OK');
            }).catch(e => console.warn('Discord splits post error:', e));
        } else {
            console.warn('Discord splits skipped: no active session');
        }
    } catch (e) { console.warn('Discord splits notification error:', e); }
}

async function deleteLobbyNotifications(eventId, eventName, seasonId) {
    if (!confirm(`Delete all split-assignment notifications previously sent for "${eventName}"?\n\nDrivers' inboxes will lose those messages.`)) return;
    const { data, error } = await sb.rpc('delete_lobby_notifications', { p_event_id: eventId });
    if (error)     { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not delete.', 'error'); return; }
    toast(`Deleted ${data.count} notification${data.count === 1 ? '' : 's'}.`, 'success');
    await refreshMsgsBadge();
}

async function moveEntryLobby(entryId, delta, eventId, eventName, seasonId) {
    const { data: en } = await sb.from('entries').select('lobby_number').eq('id', entryId).single();
    const current = en?.lobby_number ?? 1;
    const next = Math.max(1, current + delta);
    await setEntryLobby(entryId, next, eventId, eventName, seasonId);
}

async function setEntryLobby(entryId, lobbyNumber, eventId, eventName, seasonId) {
    const { error } = await sb.from('entries').update({ lobby_number: lobbyNumber }).eq('id', entryId);
    if (error) { toast(error.message, 'error'); return; }
    await viewEventLobbies(eventId, eventName, seasonId);
}

function parseLapTime(s) {
    if (!s) return null;
    s = String(s).trim();
    if (!s) return null;
    const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
    if (!m) return null;
    const min = parseInt(m[1] || '0', 10);
    const sec = parseFloat(m[2]);
    return Math.round((min * 60 + sec) * 1000);
}

function fmtLapTime(ms) {
    if (ms == null || ms === '') return '';
    const totalSec = ms / 1000;
    const min = Math.floor(totalSec / 60);
    const sec = (totalSec - min * 60).toFixed(3).padStart(6, '0');
    return min > 0 ? `${min}:${sec}` : sec;
}

// Build a <option> list for a position dropdown. `max` is the number of
// drivers in the current lobby, `selected` is the current value (string
// or number). Always includes a blank "—" so positions can be cleared.
function buildPositionOptions(max, selected) {
    const sel = String(selected ?? '');
    let html = `<option value="">—</option>`;
    for (let i = 1; i <= max; i++) {
        const isSel = String(i) === sel;
        html += `<option value="${i}"${isSel ? ' selected' : ''}>${i}</option>`;
    }
    return html;
}

// Walk every position dropdown in the table, refresh the option labels
// to show which values are already taken, and flag any duplicates. Taken
// options stay *enabled* so admins can fix a wrong allocation in place
// (onPositionChange auto-swaps with whoever previously had the value).
function refreshPositionAvailability(tableId) {
    const table = document.getElementById(tableId);
    if (!table) return [];
    const selects = table.querySelectorAll('select[data-field="finish_position"], select[data-field="position"]');
    const taken = {};
    selects.forEach(sel => {
        const v = (sel.value || '').trim();
        if (!v || sel.disabled) return;
        taken[v] = (taken[v] || 0) + 1;
    });
    const dupes = [];
    selects.forEach(sel => {
        const myVal = (sel.value || '').trim();
        // First pass through after render → record baseline for swap logic.
        if (sel.dataset.prevValue == null) sel.dataset.prevValue = myVal;
        Array.from(sel.options).forEach(opt => {
            if (!opt.value) { opt.disabled = false; opt.textContent = '—'; return; }
            // Stay selectable even when taken — picking it auto-swaps.
            opt.disabled = false;
            const isTaken = (taken[opt.value] || 0) > 0 && opt.value !== myVal;
            opt.textContent = isTaken ? `${opt.value} (swap)` : opt.value;
        });
        const isDup = myVal && (taken[myVal] || 0) > 1;
        sel.style.borderColor = isDup ? '#ef4444' : '';
        sel.style.boxShadow   = isDup ? '0 0 0 1px #ef4444' : '';
        sel.title             = isDup ? `Position ${myVal} is used by another driver in this split.` : '';
        if (isDup) dupes.push(parseInt(myVal));
    });
    return [...new Set(dupes)];
}

// Track the previous value on each select so onChange knows what to give
// the swap partner when a "taken" position gets picked.
function onPositionChange(selectEl, tableId) {
    const table     = document.getElementById(tableId);
    const newVal    = (selectEl.value || '').trim();
    const prevVal   = selectEl.dataset.prevValue || '';
    if (newVal && newVal !== prevVal) {
        // Find any *other* row in the same table that currently holds the
        // value we just picked, and donate them our previous value (empty
        // if we had none — leaves them blank to refill).
        const peers = table.querySelectorAll('select[data-field="finish_position"], select[data-field="position"]');
        peers.forEach(other => {
            if (other === selectEl) return;
            if ((other.value || '').trim() === newVal) {
                other.value = prevVal;
                other.dataset.prevValue = prevVal;
            }
        });
    }
    selectEl.dataset.prevValue = newVal;
    refreshPositionAvailability(tableId);
}

// Kept as an alias so saveResults / saveQualifying call sites stay
// readable — they care about the dup list, not the refresh side-effect.
function highlightPositionDuplicates(tableId) {
    return refreshPositionAvailability(tableId);
}

function buildLobbyFilter(entries, currentLobby, onChangeFn) {
    const lobbies = [...new Set(entries.map(e => e.lobby_number).filter(n => n != null))].sort((a, b) => a - b);
    const hasUnassigned = entries.some(e => e.lobby_number == null);
    const opts = [];
    opts.push(`<option value="all">All Splits (${entries.length})</option>`);
    lobbies.forEach(n => {
        const count = entries.filter(e => e.lobby_number === n).length;
        opts.push(`<option value="${n}" ${currentLobby == n ? 'selected' : ''}>Split ${n} (${count})</option>`);
    });
    if (hasUnassigned) {
        const count = entries.filter(e => e.lobby_number == null).length;
        opts.push(`<option value="unassigned" ${currentLobby === 'unassigned' ? 'selected' : ''}>Unassigned (${count})</option>`);
    }
    return `<select id="lobby-filter" onchange="${onChangeFn}" style="padding:0.45rem 0.7rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.85rem;font-family:'Orbitron',sans-serif;letter-spacing:0.05em">${opts.join('')}</select>`;
}

function filterEntriesByLobby(entries, lobbyFilter) {
    if (lobbyFilter === 'all' || lobbyFilter == null) return entries;
    if (lobbyFilter === 'unassigned') return entries.filter(e => e.lobby_number == null);
    const n = parseInt(lobbyFilter);
    return entries.filter(e => e.lobby_number === n);
}

function defaultLobbyFilter(entries) {
    const lobbies = [...new Set(entries.map(e => e.lobby_number).filter(n => n != null))].sort((a, b) => a - b);
    if (lobbies.length) return lobbies[0].toString();
    return 'all';
}

async function viewEventQualifying(eventId, eventName, lobbyFilter) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading qualifying…</div>';

    const [entriesRes, quailRes] = await Promise.all([
        sb.from('entries')
            .select('id, car_number, car_model, lobby_number, teams(name), entry_drivers(driver_id, drivers(id, display_name, career_number, psn_id))')
            .eq('event_id', eventId)
            .order('lobby_number')
            .order('car_number'),
        sb.from('qualifying_results').select('*').eq('event_id', eventId),
    ]);
    if (entriesRes.error) { panel.innerHTML = `<div class="loading-state">${esc(entriesRes.error.message)}</div>`; return; }

    const allEntries = entriesRes.data || [];
    const quails     = quailRes.data || [];
    const qKey       = (entryId, driverId) => `${entryId}|${driverId || ''}`;
    const qMap       = Object.fromEntries(quails.map(q => [qKey(q.entry_id, q.driver_id), q]));

    if (allEntries.length === 0) {
        panel.innerHTML = `
            <div class="section-card">
                <div class="section-card-header"><span class="section-card-title">Qualifying — ${esc(eventName)}</span></div>
                <div class="empty-state">Add entries first before recording qualifying.</div>
            </div>`;
        return;
    }

    const currentLobby = lobbyFilter || defaultLobbyFilter(allEntries);
    const entries = filterEntriesByLobby(allEntries, currentLobby);

    const rowSpecs = entries.flatMap(en => {
        const drvs = (en.entry_drivers || []).map(ed => ed.drivers).filter(Boolean);
        if (!drvs.length) return [{ entry: en, driver: null }];
        return drvs.map(d => ({ entry: en, driver: d }));
    });

    const lobbyDriverCount = rowSpecs.filter(s => s.driver).length;

    const rows = rowSpecs.length === 0
        ? `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:2rem">No drivers in this split yet.</td></tr>`
        : rowSpecs.map(({ entry: en, driver: d }) => {
            const q = qMap[qKey(en.id, d?.id)] || {};
            const carLabel = en.car_number != null ? '#' + en.car_number : '—';
            const driverLabel = d
                ? `<strong>${esc(d.display_name)}</strong>${d.career_number ? ` <span class="td-muted">#${d.career_number}</span>` : ''}${d.psn_id ? ` <span class="td-muted" style="font-size:0.75rem">· ${esc(d.psn_id)}</span>` : ''}`
                : '<em class="td-muted">No drivers</em>';
            const dAttr = d ? `data-driver="${esc(d.id)}"` : '';
            return `<tr>
                <td>${driverLabel}<br><span class="td-muted" style="font-size:0.78rem">${carLabel} ${esc(en.teams?.name) || '<em>Solo</em>'}${en.lobby_number != null ? ` · S${en.lobby_number}` : ''}</span></td>
                <td><select data-entry="${en.id}" ${dAttr} data-field="position" data-max="${lobbyDriverCount}" onchange="onPositionChange(this,'qualifying-table')" style="padding:0.4rem 0.5rem;font-size:0.82rem" ${d ? '' : 'disabled'}>${buildPositionOptions(lobbyDriverCount, q.position || '')}</select></td>
                <td><input type="text" placeholder="1:23.456" data-entry="${en.id}" ${dAttr} data-field="best_lap" value="${q.best_lap_ms ? fmtLapTime(q.best_lap_ms) : ''}" style="width:120px;padding:0.4rem 0.5rem;font-family:'Orbitron',sans-serif;font-size:0.82rem" ${d ? '' : 'disabled'}></td>
                <td><input type="text" data-entry="${en.id}" ${dAttr} data-field="notes" value="${esc(q.notes || '')}" placeholder="—" style="padding:0.4rem 0.5rem" ${d ? '' : 'disabled'}></td>
            </tr>`;
        }).join('');

    const filterSelect = buildLobbyFilter(allEntries, currentLobby,
        `viewEventQualifying('${eventId}','${esc(eventName)}', this.value)`);

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Qualifying — ${esc(eventName)}</span>
                <div style="display:flex;gap:0.5rem;align-items:center">
                    ${filterSelect}
                    <button class="btn-add" onclick="saveQualifying('${eventId}','${esc(eventName)}')">Save All</button>
                </div>
            </div>
            <table id="qualifying-table"><thead><tr>
                <th>Driver</th><th>Pos</th><th>Best Lap</th><th>Notes</th>
            </tr></thead><tbody>${rows}</tbody></table>
            <div style="padding:0.85rem 1.25rem;font-size:0.78rem;color:var(--muted);border-top:1px solid var(--border)">
                Pick a split to record qualifying lap by lap. Save All persists the current view.
            </div>
        </div>`;
    refreshPositionAvailability('qualifying-table');
}

async function saveQualifying(eventId, eventName) {
    const dupes = highlightPositionDuplicates('qualifying-table');
    if (dupes.length) {
        toast(`Two drivers can't share the same qualifying position. Fix P${dupes.join(', P')} first.`, 'error');
        return;
    }
    const inputs = document.querySelectorAll('#qualifying-table [data-entry][data-driver]');
    const map = {};
    let bad = false;
    inputs.forEach(inp => {
        const entryId  = inp.dataset.entry;
        const driverId = inp.dataset.driver;
        const key = `${entryId}|${driverId}`;
        map[key] = map[key] || { entry_id: entryId, driver_id: driverId, event_id: eventId };
        const field = inp.dataset.field;
        if (field === 'position') {
            map[key].position = inp.value ? parseInt(inp.value) : null;
        } else if (field === 'best_lap') {
            if (inp.value.trim()) {
                const ms = parseLapTime(inp.value);
                if (ms == null) { toast(`Invalid lap time: "${inp.value}"`, 'error'); bad = true; }
                map[key].best_lap_ms = ms;
            } else {
                map[key].best_lap_ms = null;
            }
        } else if (field === 'notes') {
            map[key].notes = inp.value.trim() || null;
        }
    });
    if (bad) return;

    const rowsToConsider = Object.values(map);
    const toUpsert = rowsToConsider.filter(r => r.position != null || r.best_lap_ms != null || r.notes);
    const toDelete = rowsToConsider.filter(r => r.position == null && r.best_lap_ms == null && !r.notes);

    // Delete cleared rows
    for (const r of toDelete) {
        await sb.from('qualifying_results')
            .delete()
            .eq('event_id', eventId)
            .eq('entry_id', r.entry_id)
            .eq('driver_id', r.driver_id);
    }
    if (toUpsert.length) {
        const { error } = await sb.from('qualifying_results').upsert(toUpsert, { onConflict: 'event_id,entry_id,driver_id' });
        if (error) { toast(error.message, 'error'); return; }
    }
    toast('Qualifying saved.', 'success');
    const currentLobby = document.getElementById('lobby-filter')?.value;
    await viewEventQualifying(eventId, eventName, currentLobby);
}

async function viewEventResults(eventId, eventName, lobbyFilter) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading results…</div>';

    const [entriesRes, resultsRes] = await Promise.all([
        sb.from('entries')
            .select('id, car_number, car_model, lobby_number, teams(name), entry_drivers(driver_id, drivers(id, display_name, career_number, psn_id))')
            .eq('event_id', eventId)
            .order('lobby_number')
            .order('car_number'),
        sb.from('results').select('*').eq('event_id', eventId),
    ]);
    if (entriesRes.error) { panel.innerHTML = `<div class="loading-state">${esc(entriesRes.error.message)}</div>`; return; }

    const allEntries = entriesRes.data || [];
    const results    = resultsRes.data || [];
    const rMap       = Object.fromEntries(results.map(r => [r.entry_id, r]));

    const resultIds = results.map(r => r.id);
    let rdMap = {};
    if (resultIds.length) {
        const { data: rds } = await sb.from('result_drivers')
            .select('result_id, driver_id, finish_position, classified, status, laps_driven, points_awarded, pole_point, fastest_lap_point, fastest_lap_ms')
            .in('result_id', resultIds);
        (rds || []).forEach(rd => { rdMap[`${rd.result_id}|${rd.driver_id}`] = rd; });
    }

    if (allEntries.length === 0) {
        panel.innerHTML = `
            <div class="section-card">
                <div class="section-card-header"><span class="section-card-title">Results — ${esc(eventName)}</span></div>
                <div class="empty-state">Add entries first before recording results.</div>
            </div>`;
        return;
    }

    const currentLobby = lobbyFilter || defaultLobbyFilter(allEntries);
    const entries = filterEntriesByLobby(allEntries, currentLobby);

    const statusOpts = ['classified', 'dnf', 'dsq', 'dns', 'withdrawn'];

    const rowSpecs = entries.flatMap(en => {
        const drvs = (en.entry_drivers || []).map(ed => ed.drivers).filter(Boolean);
        if (!drvs.length) return [{ entry: en, driver: null }];
        return drvs.map(d => ({ entry: en, driver: d }));
    });

    const lobbyDriverCount = rowSpecs.filter(s => s.driver).length;
    const rows = rowSpecs.length === 0
        ? `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:2rem">No drivers in this split.</td></tr>`
        : rowSpecs.map(({ entry: en, driver: d }) => {
            const r  = rMap[en.id] || {};
            const rd = (r.id && d) ? (rdMap[`${r.id}|${d.id}`] || {}) : {};
            const pos     = rd.finish_position ?? '';
            const status  = rd.status || 'classified';
            const laps    = rd.laps_driven ?? '';
            const points  = rd.points_awarded ?? 0;
            const isPole  = !!rd.pole_point;
            const isFL    = !!rd.fastest_lap_point;
            const flTime  = rd.fastest_lap_ms ? fmtLapTime(rd.fastest_lap_ms) : '';
            const statusSel = statusOpts.map(s =>
                `<option value="${s}" ${status === s ? 'selected' : ''}>${s}</option>`).join('');
            const carLabel = en.car_number != null ? '#' + en.car_number : '—';
            const driverLabel = d
                ? `<strong>${esc(d.display_name)}</strong>${d.career_number ? ` <span class="td-muted">#${d.career_number}</span>` : ''}${d.psn_id ? ` <span class="td-muted" style="font-size:0.75rem">· ${esc(d.psn_id)}</span>` : ''}`
                : '<em class="td-muted">No drivers</em>';
            const dAttr = d ? `data-driver="${esc(d.id)}"` : '';
            const dis   = d ? '' : 'disabled';
            const teamCell = en.teams?.name ? esc(en.teams.name) : '<em>Solo</em>';
            const isClassified = status === 'classified';
            return `<tr>
                <td>${driverLabel}<br><span class="td-muted" style="font-size:0.78rem">${carLabel} ${teamCell}${en.lobby_number != null ? ` · S${en.lobby_number}` : ''}</span></td>
                <td><select data-entry="${en.id}" ${dAttr} data-field="finish_position" data-max="${lobbyDriverCount}" onchange="onPositionChange(this,'results-table')" style="padding:0.4rem 0.5rem;font-size:0.82rem" ${dis || !isClassified ? 'disabled' : ''}>${buildPositionOptions(lobbyDriverCount, isClassified ? pos : '')}</select></td>
                <td><input type="number" min="0" data-entry="${en.id}" ${dAttr} data-field="laps_driven" value="${laps}" style="width:65px;padding:0.4rem 0.5rem" ${dis}></td>
                <td><select data-entry="${en.id}" ${dAttr} data-field="status" onchange="onResultStatusChange(this)" style="padding:0.4rem 0.5rem;font-size:0.82rem" ${dis}>${statusSel}</select></td>
                <td style="text-align:center;font-size:0.78rem;${isPole && isClassified ? 'color:var(--gold);font-weight:600' : 'color:var(--muted)'}" title="Auto-set from qualifying P1">${isPole && isClassified ? '★' : '—'}</td>
                <td style="white-space:nowrap">
                    <input type="checkbox" data-entry="${en.id}" ${dAttr} data-field="fastest_lap_point" ${isFL && isClassified ? 'checked' : ''} style="accent-color:var(--gold);width:16px;height:16px;vertical-align:middle" ${dis || !isClassified ? 'disabled' : ''}>
                    <input type="text" placeholder="1:23.456" data-entry="${en.id}" ${dAttr} data-field="fastest_lap_time" value="${isClassified ? flTime : ''}" style="width:100px;padding:0.4rem 0.5rem;font-family:'Orbitron',sans-serif;font-size:0.78rem;margin-left:0.35rem" ${dis || !isClassified ? 'disabled' : ''}>
                </td>
                <td style="text-align:right;color:var(--gold);font-weight:600">${points}</td>
            </tr>`;
        }).join('');

    const filterSelect = buildLobbyFilter(allEntries, currentLobby,
        `viewEventResults('${eventId}','${esc(eventName)}', this.value)`);

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Results — ${esc(eventName)}</span>
                <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
                    ${filterSelect}
                    <button class="btn-icon" onclick="recomputePoints('${eventId}','${esc(eventName)}')">Recompute Points</button>
                    <button class="btn-icon" onclick="computeElo('${eventId}')">Compute Elo</button>
                    <button class="btn-add" onclick="saveResults('${eventId}','${esc(eventName)}')">Save All</button>
                </div>
            </div>
            <table id="results-table"><thead><tr>
                <th>Driver</th><th>Pos</th><th>Laps</th><th>Status</th><th>Pole</th><th>FL · Time</th><th style="text-align:right">Pts</th>
            </tr></thead><tbody>${rows}</tbody></table>
            <div style="padding:0.85rem 1.25rem;font-size:0.78rem;color:var(--muted);border-top:1px solid var(--border)">
                Pick a split to record results split by split. Pole is auto-set from qualifying P1. Points recompute per-driver on save.
            </div>
        </div>`;
    refreshPositionAvailability('results-table');
}

async function saveResults(eventId, eventName) {
    const dupes = highlightPositionDuplicates('results-table');
    if (dupes.length) {
        toast(`Two drivers can't share the same position. Fix P${dupes.join(', P')} first.`, 'error');
        return;
    }
    const rowInputs = document.querySelectorAll('#results-table [data-entry][data-driver]');
    const perDriver = {};
    let badTime = false;
    rowInputs.forEach(inp => {
        const entryId  = inp.dataset.entry;
        const driverId = inp.dataset.driver;
        const key = `${entryId}|${driverId}`;
        perDriver[key] = perDriver[key] || { entry_id: entryId, driver_id: driverId };
        const f = inp.dataset.field;
        if (inp.type === 'checkbox') {
            perDriver[key][f] = inp.checked;
        } else if (f === 'finish_position') {
            perDriver[key][f] = inp.value ? parseInt(inp.value) : null;
        } else if (f === 'laps_driven') {
            perDriver[key][f] = inp.value ? parseInt(inp.value) : 0;
        } else if (f === 'fastest_lap_time') {
            const v = inp.value.trim();
            if (!v) { perDriver[key].fastest_lap_ms = null; }
            else {
                const ms = parseLapTime(v);
                if (ms == null) { toast(`Invalid lap time: "${v}"`, 'error'); badTime = true; }
                perDriver[key].fastest_lap_ms = ms;
            }
        } else {
            perDriver[key][f] = inp.value || null;
        }
    });
    if (badTime) return;

    const driverRows = Object.values(perDriver);

    // FL guard: only one FL per event (pole is now derived from quali)
    const fls = driverRows.filter(r => r.fastest_lap_point);
    if (fls.length > 1) { toast('Only one driver can have the fastest lap point.', 'error'); return; }

    // 1. Ensure each entry has a results row. Use a barebones upsert with
    //    just the keys + sensible defaults so an empty form doesn't violate
    //    NOT NULL constraints. compute_event_points will recompute the rest.
    const entryIds = [...new Set(driverRows.map(d => d.entry_id))];
    const entryStubs = entryIds.map(entry_id => ({ event_id: eventId, entry_id }));
    let resultIdByEntry = {};
    if (entryStubs.length) {
        const { data: upserted, error: upErr } = await sb.from('results')
            .upsert(entryStubs, { onConflict: 'event_id,entry_id', ignoreDuplicates: false })
            .select('id, entry_id');
        if (upErr) { toast(upErr.message, 'error'); return; }
        (upserted || []).forEach(r => { resultIdByEntry[r.entry_id] = r.id; });
    }
    // Pull any result_ids we might have missed (upsert that updated rows
    // already there can return stale data on some Supabase versions).
    if (entryIds.length) {
        const { data: existingResults } = await sb.from('results')
            .select('id, entry_id')
            .eq('event_id', eventId)
            .in('entry_id', entryIds);
        (existingResults || []).forEach(r => { resultIdByEntry[r.entry_id] = r.id; });
    }

    // 2. Roll per-driver data up to the entry-level row (so team standings
    //    still aggregate correctly off results.finish_position etc.)
    const entryGroups = {};
    driverRows.forEach(dr => {
        const g = entryGroups[dr.entry_id] = entryGroups[dr.entry_id] || {
            entry_id: dr.entry_id, positions: [], statuses: [], laps: [], fl: false,
        };
        if (dr.finish_position != null) g.positions.push(dr.finish_position);
        if (dr.status)                  g.statuses.push(dr.status);
        if (dr.laps_driven != null)     g.laps.push(dr.laps_driven);
        if (dr.fastest_lap_point)       g.fl = true;
    });
    const entryUpdates = Object.values(entryGroups).map(g => ({
        event_id: eventId,
        entry_id: g.entry_id,
        finish_position:    g.positions.length ? Math.min(...g.positions) : null,
        classified:         g.statuses.some(s => s === 'classified') || g.statuses.length === 0,
        status:             g.statuses.find(s => s === 'classified') || (g.statuses[0] || 'classified'),
        laps_completed:     g.laps.length ? Math.max(...g.laps) : 0,
        fastest_lap_point:  g.fl,
    }));
    if (entryUpdates.length) {
        const { error } = await sb.from('results').upsert(entryUpdates, { onConflict: 'event_id,entry_id' });
        if (error) { toast(error.message, 'error'); return; }
    }

    // 3. Per-driver upsert
    const driverPayload = driverRows.map(dr => {
        const result_id = resultIdByEntry[dr.entry_id];
        if (!result_id) return null;
        const status = dr.status || 'classified';
        const isClassified = status === 'classified';
        return {
            result_id,
            driver_id:        dr.driver_id,
            // Non-classified rows can't earn positions / pole / FL credit.
            finish_position:  isClassified ? dr.finish_position : null,
            status,
            classified:       isClassified,
            laps_driven:      dr.laps_driven ?? null,
            fastest_lap_point: isClassified && !!dr.fastest_lap_point,
            fastest_lap_ms:   isClassified ? (dr.fastest_lap_ms ?? null) : null,
            // points_share defaults to 1.0; per-driver points come from
            // result_drivers.points_awarded which compute_event_points fills.
        };
    }).filter(Boolean);
    if (driverPayload.length) {
        const { error: rdErr } = await sb.from('result_drivers').upsert(driverPayload, { onConflict: 'result_id,driver_id' });
        if (rdErr) { toast('Per-driver save failed: ' + rdErr.message, 'error'); return; }
    }

    // 4. Recompute points (also derives pole from quali server-side)
    const { data: cp, error: cpErr } = await sb.rpc('compute_event_points', { p_event_id: eventId });
    if (cpErr) { toast('Saved, but points recompute failed: ' + cpErr.message, 'error'); }
    else if (cp?.error) { toast('Saved, but points recompute failed: ' + cp.error, 'error'); }
    else toast('Results saved & points recomputed.', 'success');

    const currentLobby = document.getElementById('lobby-filter')?.value;
    await viewEventResults(eventId, eventName, currentLobby);
}

async function refreshHallOfFame() {
    const { data, error } = await sb.rpc('refresh_hall_of_fame');
    if (error) { toast(error.message, 'error'); return; }
    if (data?.error) { toast(data.error, 'error'); return; }
    toast(`Hall of Fame refreshed — ${data.records_inserted} record${data.records_inserted !== 1 ? 's' : ''}.`, 'success');
}

async function resetEventStats(eventId, eventName) {
    if (!confirm(`Reset ALL stats for "${eventName}"?\n\nThis deletes entries, results, qualifying, ratings, penalties, and steward decisions for this event. The event itself stays.\n\nThis cannot be undone.`)) return;
    const { error } = await sb.rpc('reset_event_stats', { p_event_id: eventId });

}

async function resetAllStats() {
    if (!confirm(`Reset ALL race statistics across every event?\n\nThis deletes entries, results, qualifying, ratings, penalties, steward decisions, and Hall of Fame records.\n\nEvents, drivers, teams, manufacturers, and seasons are kept.\n\nThis cannot be undone.`)) return;

    if (phrase !== 'RESET') { toast('Cancelled — phrase did not match.', 'error'); return; }
    const { error } = await sb.rpc('reset_all_stats');
    if (error) { toast(error.message, 'error'); return; }
    toast('All statistics reset.', 'success');
    await renderDashboard();
}

async function computeElo(eventId) {
    const { data, error } = await sb.rpc('compute_elo_for_event', { p_event_id: eventId });
    if (error) { toast(error.message, 'error'); return; }
    if (data?.error) { toast(data.error, 'error'); return; }
    toast(`Elo computed for ${data.drivers_rated} driver${data.drivers_rated !== 1 ? 's' : ''}.`, 'success');
}

async function recomputePoints(eventId, eventName) {
    const { data, error } = await sb.rpc('compute_event_points', { p_event_id: eventId });
    if (error) { toast(error.message, 'error'); return; }
    if (data?.error) { toast(data.error, 'error'); return; }
    toast('Points recomputed.', 'success');
    const currentLobby = document.getElementById('lobby-filter')?.value;
    await viewEventResults(eventId, eventName, currentLobby);
