<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --bg-3: #171d27;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --cyan: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
            --sidebar-w: 220px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            line-height: 1.5;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 20;
        }
        .sidebar-logo {
            padding: 1.5rem 1.25rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo .brand {
            font-family: 'Anton', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text);
            text-indent: 0.28em;
        }
        .sidebar-logo .brand span { color: var(--gold); }
        .sidebar-logo .brand .brand-logo { height: 18px; width: auto; vertical-align: middle; margin-left: 0.4em; }
        .sidebar-logo .sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.2rem;
            text-indent: 0.35em;
        }
        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }
        .nav-section {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.85rem 1.25rem 0.4rem;
            text-indent: 0.35em;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 1.25rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.15s, background 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: var(--gold); background: rgba(255,209,102,0.08); }
        .nav-link.active svg { color: var(--gold); }
        .nav-badge {
            margin-left: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 1.4rem;
            text-align: center;
            padding: 0.1rem 0.4rem;
            border-radius: 999px;
            background: var(--gold);
            color: #1a1300;
            line-height: 1.3;
        }
        .sidebar-bottom {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
        }
        .user-chip {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-logout {
            width: 100%;
            padding: 0.55rem 0.85rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-logout:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* ===== MAIN ===== */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: rgba(5,6,8,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        /* Centred "GTEC ADMIN PORTAL" badge — pinned dead-middle so it's
           unmissable on a promo video / screen recording. Absolute so it
           doesn't disturb the existing left/right flex layout. */
        .admin-portal-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 1.1rem;
            background: linear-gradient(135deg, rgba(255,209,102,0.18), rgba(255,209,102,0.06));
            border: 1px solid rgba(255,209,102,0.5);
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--gold);
            box-shadow: 0 0 18px rgba(255,209,102,0.18);
            white-space: nowrap;
            pointer-events: none;
        }
        .admin-portal-badge img { height: 18px; width: auto; display: block; transform: translateY(2px); }
        .admin-portal-badge .admin-dot {
            width: 8px; height: 8px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(239,68,68,0.7);
            animation: admin-pulse 1.5s ease-in-out infinite;
        }
        @keyframes admin-pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }
        @media (max-width: 720px) {
            .admin-portal-badge { font-size: 0.6rem; letter-spacing: 0.22em; padding: 0.35rem 0.7rem; }
            .admin-portal-badge img { height: 14px; }
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }
        .admin-nav-toggle {
            display: none;
            width: 38px;
            height: 38px;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            padding: 0;
            flex-shrink: 0;
        }
        .admin-nav-toggle:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .admin-nav-toggle svg { width: 18px; height: 18px; display: block; }
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 15;
        }
        body.sidebar-open .sidebar-backdrop { display: block; }
        .page-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-add:hover { filter: brightness(1.08); }
        .btn-add svg { width: 14px; height: 14px; }
        .content {
            flex: 1;
            padding: 2rem;
        }

        /* ===== STAT CARDS ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .stat-card-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-indent: 0.2em;
        }
        .stat-card-value {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            line-height: 1;
            background: linear-gradient(180deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== TABLE ===== */
        .table-wrap {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }
        .table-search {
            flex: 1;
            max-width: 280px;
            padding: 0.5rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .table-search:focus { border-color: rgba(255,209,102,0.4); }
        .table-search::placeholder { color: var(--muted); opacity: 0.6; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            padding: 0.7rem 1.25rem;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .td-muted { color: var(--muted); font-size: 0.82rem; }
        .color-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-muted { background: rgba(255,255,255,0.06); color: var(--muted); }
        .badge-gold  { background: rgba(255,209,102,0.15); color: var(--gold); }
        .badge-red   { background: rgba(239,68,68,0.12); color: #fca5a5; }
        .row-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }
        .btn-icon {
            padding: 0.35rem 0.65rem;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .btn-icon:hover { color: var(--text); border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
        .btn-icon.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); }

        /* Split-movement pill shown next to each driver in the lobby view. */
        .move-pill {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 0.22rem 0.45rem;
            border-radius: 999px;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .move-pill.move-up   { color: #4ade80; border-color: rgba(74,222,128,0.35); background: rgba(74,222,128,0.08); }
        .move-pill.move-down { color: #f87171; border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.08); }
        .move-pill.move-same { color: var(--muted); border-color: var(--border); background: rgba(255,255,255,0.02); }
        .move-pill.move-new  { color: var(--gold);  border-color: rgba(255,209,102,0.35); background: rgba(255,209,102,0.06); }
        .empty-state {
            padding: 3rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .loading-state {
            padding: 2rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 1.15rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        label .required { color: var(--gold); margin-left: 2px; }
        input[type="text"], input[type="email"], input[type="number"],
        input[type="date"], input[type="color"], input[type="url"],
        select, textarea {
            display: block;
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="color"] { padding: 0.35rem; height: 38px; cursor: pointer; }
        input:focus, select:focus, textarea:focus { border-color: rgba(255,209,102,0.5); }
        input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.6; }
        select option { background: var(--bg-2); }
        textarea { resize: vertical; min-height: 80px; }
        .form-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }

        /* EasyMDE dark-theme overrides — keep editor consistent with admin */
        .EasyMDEContainer .editor-toolbar {
            background: var(--bg-2);
            border-color: var(--border);
            border-top-left-radius: 8px; border-top-right-radius: 8px;
            opacity: 1;
        }
        .EasyMDEContainer .editor-toolbar button {
            color: var(--muted) !important;
            border-color: transparent !important;
        }
        .EasyMDEContainer .editor-toolbar button:hover,
        .EasyMDEContainer .editor-toolbar button.active {
            background: rgba(255,255,255,0.06) !important;
            border-color: var(--border) !important;
            color: var(--text) !important;
        }
        .EasyMDEContainer .editor-toolbar i.separator {
            border-color: var(--border);
        }
        .EasyMDEContainer .CodeMirror {
            background: var(--bg-1) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
            border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
            font-family: 'Inter', 'SF Mono', Menlo, monospace !important;
            font-size: 0.9rem !important;
        }
        .EasyMDEContainer .CodeMirror-cursor { border-color: var(--gold); }
        .EasyMDEContainer .CodeMirror-selected { background: rgba(255,209,102,0.18) !important; }
        .EasyMDEContainer .cm-header { color: var(--gold); }
        .EasyMDEContainer .cm-link, .EasyMDEContainer .cm-url { color: #38bdf8; }
        .EasyMDEContainer .cm-strong { color: var(--text); }
        .EasyMDEContainer .editor-statusbar { color: var(--muted); }
        .EasyMDEContainer .editor-preview, .EasyMDEContainer .editor-preview-side {
            background: var(--bg-1);
            color: var(--text);
            border-color: var(--border) !important;
        }
        .EasyMDEContainer .editor-preview h1,
        .EasyMDEContainer .editor-preview h2,
        .EasyMDEContainer .editor-preview h3 { color: var(--gold); }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }
        .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .form-check span { font-size: 0.88rem; color: var(--text); font-weight: 400; letter-spacing: 0; text-transform: none; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: filter 0.15s, background 0.15s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .btn-danger {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); }

        /* ===== SEASON TEAMS sub-section ===== */
        .section-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 1.5rem;
            overflow: hidden;
        }
        .section-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
        }
        .section-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            text-indent: 0.25em;
        }

        /* ===== TOASTS ===== */
        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            pointer-events: none;
        }
        .toast {
            padding: 0.8rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            max-width: 340px;
            pointer-events: auto;
            animation: toast-in 0.25s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: none; }
        }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .toast.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .toast.info    { background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.3); color: #7dd3fc; }

        /* ===== CONFIRM BANNER ===== */
        .confirm-banner {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .confirm-banner.open { display: block; }
        .confirm-banner p { font-size: 0.85rem; color: #fca5a5; margin-bottom: 0.65rem; }
        .confirm-banner .confirm-btns { display: flex; gap: 0.5rem; }

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/countries.js"></script>
<script src="../assets/gtec-config.js"></script>
<script src="../assets/gtec-badges.js?v=12"></script>
<script>
'use strict';

// ============================================================
// 1. Init
// ============================================================
const { createClient } = window.supabase;
const cfg = window.GTEC_CONFIG;
const sb  = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

let currentUser  = null;
let currentSection = 'dashboard';

// Cached data for dropdowns
let _manufacturers = [];
let _seasons       = [];
let _teams         = [];
let _pointsSystems = [];
let _drivers       = [];


// ============================================================
// 2. Auth guard
// ============================================================
async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        window.location.replace('./login.html');
        return;
    }
    currentUser = session.user;

    const { data: role } = await sb.from('user_roles')
        .select('role')
        .eq('user_id', currentUser.id)
        .eq('role', 'admin')
        .maybeSingle();

    if (!role) {
        await sb.auth.signOut();
        window.location.replace('./login.html');
        return;
    }

    document.getElementById('user-email').textContent = currentUser.email;
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('sidebar').style.transform = '';
    document.getElementById('sidebar').style.display = '';

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.replace('./login.html');
    });

    setupNav();
    await refreshAppsBadge();
    await refreshMsgsBadge();
    setInterval(refreshAppsBadge, 60000);
    setInterval(refreshMsgsBadge, 60000);
    await navigate('dashboard');
}

async function refreshMsgsBadge() {
    const { count } = await sb.from('driver_contact_messages')
        .select('id', { count: 'exact', head: true })
        .eq('status', 'new');
    const el = document.getElementById('msgs-badge');
    if (!el) return;
    if (count && count > 0) {
        el.textContent = count;
        el.style.display = '';
    } else {
        el.style.display = 'none';
    }
}

async function refreshAppsBadge() {
    const { count } = await sb.from('applications')
        .select('id', { count: 'exact', head: true })
        .eq('status', 'pending');
    const el = document.getElementById('apps-badge');
    if (!el) return;
    if (count && count > 0) {
        el.textContent = count;
        el.style.display = '';
    } else {
        el.style.display = 'none';
    }
}


// ============================================================
// 3. Router & nav
// ============================================================
function setupNav() {
    document.querySelectorAll('.nav-link[data-section]').forEach(btn => {
        btn.addEventListener('click', () => {
            navigate(btn.dataset.section);
            document.body.classList.remove('sidebar-open');
        });
    });

    // Mobile sidebar toggle
    document.getElementById('admin-nav-toggle').addEventListener('click', () => {
        document.body.classList.toggle('sidebar-open');
    });
    document.getElementById('sidebar-backdrop').addEventListener('click', () => {
        document.body.classList.remove('sidebar-open');
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.body.classList.remove('sidebar-open');
    });
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) document.body.classList.remove('sidebar-open');
    });

    // Hash routing
    window.addEventListener('hashchange', () => {
        const sec = window.location.hash.replace('#', '') || 'dashboard';
        navigate(sec, false);
    });
    const hash = window.location.hash.replace('#', '');
    if (hash && hash !== 'dashboard') navigate(hash, false);
}

async function navigate(section, pushHash = true) {
    currentSection = section;
    if (pushHash) window.location.hash = section;

    document.querySelectorAll('.nav-link').forEach(b => b.classList.toggle('active', b.dataset.section === section));

    const titles = {
        dashboard: 'Dashboard',
        manufacturers: 'Manufacturers',
        seasons: 'Seasons',
        teams: 'Teams',
        drivers: 'Drivers',
        events: 'Events',
        applications: 'Applications',
        messages: 'Driver Messages',
        news: 'News',
        media: 'Media',
        pages: 'Pages',
        admins: 'Admins',
        activity: 'Activity Log',
    };
    document.getElementById('page-title').textContent = titles[section] || section;

    const addBtn = document.getElementById('btn-add');
    if (section === 'dashboard' || section === 'pages' || section === 'applications' || section === 'admins' || section === 'messages' || section === 'activity') {
        addBtn.style.display = 'none';
    } else {
        addBtn.style.display = '';
        addBtn.onclick = () => openAddModal(section);
    }

    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading-state">Loading…</div>';

    await Promise.all([loadCache()]);

    switch (section) {
        case 'dashboard':    await renderDashboard(); break;
        case 'manufacturers': await renderManufacturers(); break;
        case 'seasons':      await renderSeasons(); break;
        case 'teams':        await renderTeams(); break;
        case 'drivers':      await renderDrivers(); break;
        case 'events':       await renderEvents(); break;
        case 'applications': await renderApplications(); break;
        case 'news':         await renderNews(); break;
        case 'media':        await renderMedia(); break;
        case 'pages':        await renderPages(); break;
        case 'admins':       await renderAdmins(); break;
        case 'messages':     await renderMessages(); break;
        case 'activity':     await renderActivityLog(); break;
    }
}


// ============================================================
// 4. Dropdown caches
// ============================================================
async function loadCache() {
    const [mfr, ps, tm, dr, seas] = await Promise.all([
        sb.from('manufacturers').select('id,name,slug').order('name'),
        sb.from('points_systems').select('id,name').order('name'),
        sb.from('teams').select('id,name,slug,manufacturer_id,max_drivers').order('name'),
        sb.from('drivers').select('id,display_name,slug,career_number,current_team_id').order('display_name'),
        sb.from('seasons').select('id,name,year').order('year', { ascending: false }),
    ]);
    _manufacturers = mfr.data  || [];
    _pointsSystems = ps.data   || [];
    _teams         = tm.data   || [];
    _drivers       = dr.data   || [];
    _seasons       = seas.data || [];
}


// ============================================================
// 5. UI helpers
// ============================================================
function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function openModal(title, bodyHTML, footerHTML) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHTML;
    document.getElementById('modal-footer').innerHTML = footerHTML;
    document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    if (window._pageMDE) { try { window._pageMDE.toTextArea(); } catch {} window._pageMDE = null; }
}
document.getElementById('modal-close').addEventListener('click', closeModal);
// Click-outside-to-close was easy to trigger by accident mid-edit, so we
// only close via the X button (or Cancel / Save in the footer).

function slugify(str) {
    return str.toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
}

function selectHTML(id, options, selected = '', emptyLabel = '— Select —') {
    const opts = options.map(o =>
        `<option value="${esc(o.value)}" ${o.value === selected ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="${id}" name="${id}"><option value="">${emptyLabel}</option>${opts}</select>`;
}

function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getFormData(formId) {
    const form = document.getElementById(formId);
    const data = {};
    form.querySelectorAll('[name]').forEach(el => {
        if (el.type === 'checkbox') data[el.name] = el.checked;
        else data[el.name] = el.value || null;
    });
    return data;
}


// ============================================================
// 6. Dashboard
// ============================================================
async function renderDashboard() {
    const [mfr, seasons, teams, drivers, evts] = await Promise.all([
        sb.from('manufacturers').select('id', { count: 'exact', head: true }),
        sb.from('seasons').select('id', { count: 'exact', head: true }),
        sb.from('teams').select('id', { count: 'exact', head: true }),
        sb.from('drivers').select('id', { count: 'exact', head: true }),
        sb.from('events').select('id', { count: 'exact', head: true }),
    ]);

    const { data: activeSeason } = await sb.from('seasons').select('name,year').eq('is_active', true).maybeSingle();

    document.getElementById('content').innerHTML = `
        <div class="stat-grid">
            <div class="stat-card"><div class="stat-card-label">Manufacturers</div><div class="stat-card-value">${mfr.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Seasons</div><div class="stat-card-value">${seasons.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Teams</div><div class="stat-card-value">${teams.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Drivers</div><div class="stat-card-value">${drivers.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Events</div><div class="stat-card-value">${evts.count ?? 0}</div></div>
        </div>
        <div class="table-wrap" style="padding:1.5rem">
            <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem;font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase">Active Season</div>
            <div style="font-family:'Anton',sans-serif;font-size:1.6rem;letter-spacing:0.04em">${activeSeason ? esc(activeSeason.name) : '<span style="color:var(--muted);font-size:1rem;font-family:Inter,sans-serif">None — create a season and mark it active</span>'}</div>
        </div>
        <div class="table-wrap" style="padding:1.5rem;margin-top:1rem">
            <div style="font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem">Maintenance</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:0.85rem;border-bottom:1px solid var(--border)">
                <div style="font-size:0.85rem;color:var(--muted)">Rebuild Hall of Fame records from current career stats.</div>
                <button class="btn btn-primary" onclick="refreshHallOfFame()">Refresh Hall of Fame</button>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:0.85rem">
                <div style="font-size:0.85rem;color:#fca5a5">Delete all race data — entries, results, qualifying, ratings, penalties, steward decisions, Hall of Fame. Events, drivers, teams, manufacturers and seasons are kept.</div>
                <button class="btn-icon danger" onclick="resetAllStats()">Reset All Statistics</button>
            </div>
        </div>
    `;
}


// ============================================================
// 7. Manufacturers
// ============================================================
async function renderManufacturers() {
    const { data, error } = await sb.from('manufacturers').select('*').order('name');
    if (error) { toast(error.message, 'error'); return; }

    const rows = data.length === 0 ? `<tr><td colspan="6"><div class="empty-state">No manufacturers yet — add one to get started.</div></td></tr>` :
        data.map(m => `
            <tr>
                <td>${m.logo_url
                    ? `<img src="${esc(m.logo_url)}" alt="${esc(m.name)}" style="width:32px;height:32px;object-fit:contain;background:rgba(255,255,255,0.04);border-radius:4px;padding:2px">`
                    : `<div style="width:32px;height:32px;border-radius:4px;background:${esc(m.brand_color || 'rgba(255,255,255,0.05)')};border:1px solid var(--border)"></div>`}</td>
                <td><strong>${esc(m.name)}</strong></td>
                <td class="td-muted">${esc(m.slug)}</td>
                <td class="td-muted">${esc(m.country) || '—'}</td>
                <td>${m.brand_color ? `<div class="color-swatch"><div class="swatch" style="background:${esc(m.brand_color)}"></div>${esc(m.brand_color)}</div>` : '<span class="td-muted">—</span>'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editManufacturer('${m.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteManufacturer('${m.id}','${esc(m.name)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search manufacturers…" oninput="filterTable(this,'mfr-table')">
            </div>
            <table id="mfr-table"><thead><tr>
                <th style="width:60px">Logo</th><th>Name</th><th>Slug</th><th>Country</th><th>Brand Colour</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

function mfrForm(m = {}) {
    return `<form id="entity-form">
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="name" value="${esc(m.name)}" placeholder="BMW" required oninput="autoSlug(this,'name','slug')">
            </div>
            <div class="form-group">
                <label>Slug <span class="required">*</span></label>
                <input type="text" name="slug" id="slug" value="${esc(m.slug)}" placeholder="bmw" required>
                <div class="form-hint">Auto-generated · editable</div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Country</label>
                <select name="country">${window.gtecCountryOptions(m.country)}</select>
            </div>
            <div class="form-group">
                <label>Brand Colour</label>
                <input type="color" name="brand_color" value="${m.brand_color || '#ffffff'}">
            </div>
        </div>
        <div class="form-group">
            <label>Logo</label>
            <div style="display:flex;align-items:center;gap:1rem">
                <div id="mfr-logo-preview" style="width:64px;height:64px;flex-shrink:0;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden">
                    ${m.logo_url ? `<img src="${esc(m.logo_url)}" style="max-width:100%;max-height:100%;object-fit:contain">` : '<span style="font-size:0.7rem;color:var(--muted)">No logo</span>'}

async function renderTeams() {
    const { data, error } = await sb.from('teams')
        .select('*, manufacturers(name,brand_color), leader:drivers!leader_driver_id(id, display_name)')
        .order('name');
    if (error) { toast(error.message, 'error'); return; }

    // Fetch every current-team driver in one go so we can show leader status
    // and offer the leader-picker for teams without one.
    const { data: allDrivers } = await sb.from('drivers')
        .select('id, display_name, current_team_id')
        .not('current_team_id', 'is', null);
    const byTeam = new Map();
    (allDrivers || []).forEach(d => {
        const list = byTeam.get(d.current_team_id) || [];
        list.push(d);
        byTeam.set(d.current_team_id, list);
    });

    const rows = data.length === 0 ? `<tr><td colspan="6"><div class="empty-state">No teams yet.</div></td></tr>` :
        data.map(t => {
            const driversOnTeam = byTeam.get(t.id) || [];
            let leaderCell;
            if (t.leader?.display_name) {
                leaderCell = `<span class="badge badge-gold">★ ${esc(t.leader.display_name)}</span>
                    <button class="btn-icon" style="margin-left:0.4rem" onclick="clearTeamLeader('${t.id}','${esc(t.name)}')">Clear</button>`;
            } else if (driversOnTeam.length === 0) {
                leaderCell = '<span class="td-muted">No drivers yet</span>';
            } else {
                const opts = driversOnTeam
                    .map(d => `<option value="${esc(d.id)}">${esc(d.display_name)}</option>`)
                    .join('');
                leaderCell = `<select id="leader-${t.id}" style="padding:0.35rem 0.55rem;font-size:0.78rem;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;color:var(--text)">
                        <option value="">— pick driver —</option>${opts}
                    </select>
                    <button class="btn-icon" style="margin-left:0.4rem" onclick="setTeamLeader('${t.id}','${esc(t.name)}')">Set Leader</button>`;
            }
            return `
            <tr>
                <td><strong>${esc(t.name)}</strong></td>
                <td class="td-muted">${esc(t.slug)}</td>
                <td>
                    ${t.manufacturers?.brand_color ? `<span class="color-swatch"><span class="swatch" style="background:${esc(t.manufacturers.brand_color)}"></span></span> ` : ''}
                    ${esc(t.manufacturers?.name) || '<span class="td-muted">—</span>'}
                </td>
                <td class="td-muted">${esc(t.home_country) || '—'}</td>
                <td>${leaderCell}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editTeam('${t.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteTeam('${t.id}','${esc(t.name)}')">Delete</button>
                </div></td>
            </tr>`;
        }).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search teams…" oninput="filterTable(this,'teams-table')">
            </div>
            <table id="teams-table"><thead><tr>
                <th>Name</th><th>Slug</th><th>Manufacturer</th><th>Country</th><th>Leader</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

        const cap      = ` · ${used}/${max}${full ? ' · FULL' : ''}`;

// Renders a checkbox grid keyed off window.BADGE_CATEGORIES (loaded
// from gtec-badges.js) so the picker stays in lockstep with whatever
// badges exist on the front-end without manual duplication. Each
// checkbox carries the badge key as its value — saveDriver scoops the
// :checked set straight into a text[] for the manual_badges column.
function manualBadgePicker(granted) {
    const cats = (window.BADGE_CATEGORIES || []);
    if (!cats.length) {
        return '<div style="color:var(--muted);font-size:0.82rem">Badge list unavailable — make sure gtec-badges.js loaded.</div>';
    }
    const set = new Set(granted || []);
    return cats.map(cat => `
        <div style="margin-bottom:0.85rem">
            <div style="font-size:0.6rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:0.35rem">${esc(cat.title)}</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.35rem 0.85rem">
                ${cat.badges.map(b => `
                    <label style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.82rem;cursor:pointer;user-select:none">
                        <input type="checkbox" name="manual_badges" value="${esc(b.key)}" ${set.has(b.key) ? 'checked' : ''} style="accent-color:var(--gold);width:14px;height:14px">
                        <span>${b.icon || ''} ${esc(b.name)}</span>
                    </label>`).join('')}
            </div>
        </div>`).join('');
}

function syncDriverMfrToTeam() {
    const teamSel = document.getElementById('current_team_id');
    const mfrSel  = document.getElementById('current_manufacturer_id');
    const hint    = document.getElementById('mfr-hint');
    if (!teamSel || !mfrSel) return;
    const team = _teams.find(t => t.id === teamSel.value);
    if (team) {
        mfrSel.value = team.manufacturer_id || '';
        mfrSel.disabled = true;
        if (hint) hint.textContent = 'Locked to team manufacturer.';
    } else {
        mfrSel.disabled = false;
        if (hint) hint.textContent = 'Free agents only — set when no team is selected.';
    }
}

function openDriverModal(d = {}) {
    openModal(d.id ? 'Edit Driver' : 'Add Driver', driverForm(d), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDriver('${d.id || ''}')">Save</button>
    `);
}

async function editDriver(id) {
    const { data } = await sb.from('drivers').select('*').eq('id', id).single();
    openDriverModal(data);
}

function nextAvailableCareerNumber(ignoreDriverId) {
    const used = new Set();
    (_drivers || []).forEach(d => {
        if (d.career_number != null && d.id !== ignoreDriverId) used.add(d.career_number);
    });
    for (let n = 1; n <= 999; n++) {
        if (!used.has(n)) return n;
    }
    return null;
}

function onCareerNumberInput(input, ignoreDriverId) {
    const hint = document.getElementById('career-number-hint');
    if (!hint) return;
    const raw = input.value.trim();
    if (!raw) {
        const next = nextAvailableCareerNumber(ignoreDriverId);
        hint.textContent = next ? `Next available: #${next}` : '';
        hint.style.color = 'var(--muted)';
        input.style.borderColor = '';
        return;
    }
    const res = checkCareerNumber(raw, ignoreDriverId || null);
    if (res.ok) {
        hint.textContent = `#${res.value} is available`;
        hint.style.color = '#4ade80';
        input.style.borderColor = 'rgba(34,197,94,0.45)';
    } else {
        hint.textContent = res.error;
        hint.style.color = '#fca5a5';
        input.style.borderColor = 'rgba(239,68,68,0.55)';
    }
}

function checkCareerNumber(raw, ignoreDriverId) {
    if (raw === '' || raw == null) return { ok: true, value: null };
    const n = parseInt(raw, 10);
    if (Number.isNaN(n) || n < 1 || n > 999) {
        return { ok: false, error: 'Career number must be between 1 and 999.' };
    }
    const clash = _drivers.find(d => d.career_number === n && d.id !== ignoreDriverId);
    if (clash) {
        return { ok: false, error: `#${n} is already used by ${clash.display_name}.` };
    }
    return { ok: true, value: n };
}

function checkDriverNameUnique(name, ignoreId) {
    const t = (name || '').trim().toLowerCase();
    if (!t) return null;
    const clash = _drivers.find(d =>
        (d.display_name || '').trim().toLowerCase() === t && d.id !== ignoreId
    );
    return clash ? `Driver name "${name}" is already taken.` : null;
}

function checkTeamNameUnique(name, ignoreId) {
    const t = (name || '').trim().toLowerCase();
    if (!t) return null;
    const clash = _teams.find(team =>
        (team.name || '').trim().toLowerCase() === t && team.id !== ignoreId
    );
    return clash ? `Team name "${name}" is already taken.` : null;
}

function checkPsnUnique(psn, ignoreId) {
    const t = (psn || '').trim().toLowerCase();
    if (!t) return null;
    const clash = _drivers.find(d =>
        (d.psn_id || '').trim().toLowerCase() === t && d.id !== ignoreId
    );
    return clash ? `PSN "${psn}" is already on driver "${clash.display_name}".` : null;
}

async function saveDriver(id) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkDriverNameUnique(d.display_name, id);
    if (dupName) { toast(dupName, 'error'); return; }
    const dupPsn = checkPsnUnique(d.psn_id, id);
    if (dupPsn) { toast(dupPsn, 'error'); return; }
    const num = checkCareerNumber(d.career_number, id);
    if (!num.ok) { toast(num.error, 'error'); return; }
    // Team capacity check (mirrors the DB trigger in migration 39).
    if (d.current_team_id) {
        const team = _teams.find(t => t.id === d.current_team_id);
        const max  = team?.max_drivers ?? 2;
        const used = (_drivers || []).filter(x => x.current_team_id === d.current_team_id && x.id !== id).length;
        if (used >= max) {
            toast(`Team ${team?.name || ''} is already at capacity (${used}/${max} drivers).`, 'error');
            return;
        }
    }
    // Multi-checkbox group: getFormData collapses these to a single
    // boolean, so we read the :checked set straight from the DOM.
    const manualBadges = Array.from(document.querySelectorAll('#entity-form input[name="manual_badges"]:checked')).map(el => el.value);

    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        discord_username: d.discord_username || null,
        nationality: d.nationality, career_number: num.value,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
        gt7_dr_rating: d.gt7_dr_rating || null, gt7_sr_rating: d.gt7_sr_rating || null,
        manual_badges: manualBadges,
    };
    const { error } = id
        ? await sb.from('drivers').update(payload).eq('id', id)
        : await sb.from('drivers').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Driver updated.' : 'Driver added.', 'success');
    closeModal();
    await renderDrivers();
    await loadCache();
}

async function deleteDriver(id, name) {
    // Quick scan so admins know whether they're nuking race history.
    const [{ count: entryCount }, { count: resultCount }] = await Promise.all([
        sb.from('entry_drivers').select('id', { count: 'exact', head: true }).eq('driver_id', id),
        sb.from('result_drivers').select('id', { count: 'exact', head: true }).eq('driver_id', id),
    ]);
    const history = (entryCount || 0) + (resultCount || 0);
    const warn = history > 0
        ? `Delete "${name}"?\n\nThis driver has ${entryCount || 0} event entry row(s) and ${resultCount || 0} result row(s) — these will be removed too. Standings will recompute without them. Entries and results for other drivers in the same team / split stay intact.\n\nThis cannot be undone.`
        : `Delete "${name}"?`;
    if (!confirm(warn)) return;
    const { error } = await sb.from('drivers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Driver deleted.', 'success');
    await renderDrivers();
    await loadCache();
}

async function generateClaimLink(driverId, driverName) {

        </p>

function copyClaimUrl() {

async function renderEvents() {

        .select('*, seasons(name,year)')
        .order('starts_at', { ascending: false });

    const evtStatusBadge = s => {
        const map = { scheduled: 'badge-muted', in_progress: 'badge-gold', completed: 'badge-green', cancelled: 'badge-muted' };
        return `<span class="badge ${map[s] || 'badge-muted'}">${s.replace('_',' ')}</span>`;
    };

    const rows = data.length === 0 ? `<tr><td colspan="7"><div class="empty-state">No events yet — add one to get started.</div></td></tr>` :
        data.map(e => {
            const lockBtn = e.is_locked
                ? `<button class="btn-icon" style="border-color:rgba(248,113,113,0.45);color:#fca5a5"
                       onclick="toggleEventLock('${e.id}','${esc(e.name)}',false)"
                       title="Unlock this event">🔓 Unlock</button>`
                : `<button class="btn-icon" style="border-color:rgba(255,209,102,0.45);color:var(--gold)"
                       onclick="toggleEventLock('${e.id}','${esc(e.name)}',true)"
                       title="Lock this event — no further edits to entries, qualifying, results, penalties or stewards">🔒 Lock</button>`;
            const lockBadge = e.is_locked
                ? `<span class="badge" style="background:rgba(248,113,113,0.15);color:#fca5a5;border:1px solid rgba(248,113,113,0.35);margin-left:0.35rem">🔒 Locked</span>`
                : '';
            return `
            <tr>
                <td><strong>R${e.round}</strong> <span class="td-muted" style="font-size:0.78rem">${esc(e.seasons?.name || '')}</span></td>
                <td><strong>${esc(e.name)}</strong>${lockBadge}</td>
                <td class="td-muted">${esc(e.circuit_name)}${e.circuit_country ? ` (${esc(e.circuit_country)})` : ''}</td>
                <td class="td-muted" style="font-size:0.78rem">${formatDatetime(e.starts_at)}</td>
                <td class="td-muted">${e.duration_hours}h</td>
                <td>${evtStatusBadge(e.status)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="viewEventEntries('${e.id}','${esc(e.name)}','${e.season_id}')">Entries</button>
                    <button class="btn-icon" onclick="viewEventLobbies('${e.id}','${esc(e.name)}','${e.season_id}')">Splits</button>
                    <button class="btn-icon" onclick="viewEventQualifying('${e.id}','${esc(e.name)}')">Qualifying</button>
                    <button class="btn-icon" onclick="viewEventResults('${e.id}','${esc(e.name)}')">Results</button>
                    <button class="btn-icon" onclick="viewEventPenalties('${e.id}','${esc(e.name)}')">Penalties</button>
                    <button class="btn-icon" onclick="viewEventSteward('${e.id}','${esc(e.name)}')">Steward</button>
                    <button class="btn-icon" style="border-color:rgba(255,209,102,0.45);color:var(--gold)" onclick="generateRaceReport('${e.id}','${esc(e.name)}','${e.season_id}')">Race Report</button>
                    ${lockBtn}
                    <button class="btn-icon" onclick="editEvent('${e.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="resetEventStats('${e.id}','${esc(e.name)}')">Reset Stats</button>
                    <button class="btn-icon danger" onclick="deleteEvent('${e.id}','${esc(e.name)}')">Delete</button>
                </div></td>
            </tr>`;
        }).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search events…" oninput="filterTable(this,'events-table')">
            </div>
            <table id="events-table"><thead><tr>
                <th>Round</th><th>Name</th><th>Circuit</th><th>Date</th><th>Duration</th><th>Status</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>
        <div id="event-entries-panel"></div>`;
}

function formatDatetime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function toDatetimeLocal(iso) {
    if (!iso) return '';
    return iso.slice(0, 16);
}

function autoFillEndsAt() {
    const starts = document.getElementById('ev-starts')?.value;
    const hours  = parseFloat(document.getElementById('ev-duration')?.value);
    const endsEl = document.getElementById('ev-ends');
    if (!starts || !hours || !endsEl) return;
    const ms = new Date(starts).getTime() + hours * 3600 * 1000;
    if (!isNaN(ms)) endsEl.value = toDatetimeLocal(new Date(ms).toISOString());
}

                        const compounds = [

                            { code: 'RM', label: 'Racing Medium' },
                            { code: 'RH', label: 'Racing Hard' },
                            { code: 'RI', label: 'Racing Inter' },

function openEventModal(e = {}) {
    openModal(e.id ? 'Edit Event' : 'Add Event', eventForm(e), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEvent('${e.id || ''}')">Save</button>
    `);
}

async function editEvent(id) {
    const { data } = await sb.from('events').select('*').eq('id', id).single();
    openEventModal(data);
}

async function saveEvent(id) {
    const d = getFormData('entity-form');
    // Multi-value checkbox group: getFormData collapses these to a single
    // boolean. Read them directly so we capture every ticked compound.
    const requiredTyres = Array.from(document.querySelectorAll('#entity-form input[name="required_tyres"]:checked')).map(el => el.value);
    if (!d.season_id || !d.round || !d.name || !d.slug || !d.circuit_name || !d.duration_hours || !d.starts_at || !d.ends_at) {
        toast('Fill in all required fields.', 'error'); return;
    }
    const payload = {
        season_id: d.season_id,
        round: parseInt(d.round),
        name: d.name,
        slug: d.slug,
        circuit_name: d.circuit_name,
        circuit_country: d.circuit_country || null,
        circuit_length_km: d.circuit_length_km ? parseFloat(d.circuit_length_km) : null,
        duration_hours: parseFloat(d.duration_hours),
        starts_at: d.starts_at,
        ends_at: d.ends_at,
        status: d.status || 'scheduled',
        replay_url: d.replay_url || null,
        notes: d.notes || null,
        tyre_wear:          d.tyre_wear || null,
        fuel_consumption:   d.fuel_consumption || null,
        weather:            d.weather || null,
        time_of_day:        d.time_of_day || null,
        starting_procedure: d.starting_procedure || null,
        mandatory_pit_stops: d.mandatory_pit_stops ? parseInt(d.mandatory_pit_stops) : null,
        bop_enabled:        !!d.bop_enabled,
        damage_level:       d.damage_level || null,
        refuel_rate_lps:    d.refuel_rate_lps ? parseInt(d.refuel_rate_lps, 10) : null,
        slipstream:         d.slipstream || null,
        required_tyres:     requiredTyres.length ? requiredTyres : null,
        race_details:       d.race_details || null,
    };
    const { error } = id
        ? await sb.from('events').update(payload).eq('id', id)
        : await sb.from('events').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Event updated.' : 'Event created.', 'success');
    closeModal();
    await renderEvents();
}

async function deleteEvent(id, name) {
    if (!confirm(`Delete "${name}"? This will cascade-delete all entries and results.`)) return;
    const { error } = await sb.from('events').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Event deleted.', 'success');
    await renderEvents();
}

async function toggleEventLock(id, name, lock) {
    if (lock) {
        if (!confirm(`Lock "${name}"?\n\nNo entries, qualifying times, results, penalties or steward decisions can be added or changed for this event until you unlock it.`)) return;
    } else {
        if (!confirm(`Unlock "${name}"?\n\nThis event will become editable again. Re-lock it when you're done.`)) return;
    }
    const patch = lock
        ? { is_locked: true,  locked_at: new Date().toISOString() }
        : { is_locked: false, locked_at: null, locked_by: null };
    const { error } = await sb.from('events').update(patch).eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast(lock ? `🔒 "${name}" locked.` : `🔓 "${name}" unlocked.`, 'success');
    await renderEvents();
}

async function viewEventEntries(eventId, eventName, seasonId) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading entries…</div>';

    const { data, error } = await sb.from('entries')
        .select('*, teams(name), manufacturers(name,brand_color), entry_drivers(id, stint_role, drivers(id,display_name))')
        .eq('event_id', eventId)
        .order('car_number');

    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    const entrStatusBadge = s => {
        const map = { confirmed: 'badge-green', withdrawn: 'badge-muted', dnq: 'badge-muted' };
        return `<span class="badge ${map[s] || 'badge-muted'}">${s}</span>`;
    };

    const rows = data.length === 0 ? `<tr><td colspan="7"><div class="empty-state">No entries yet — add one.</div></td></tr>` :
        data.map(en => {
            const driverTags = (en.entry_drivers || []).map(ed =>
                `<span style="display:inline-flex;align-items:center;gap:0.2rem;background:rgba(255,255,255,0.06);border-radius:4px;padding:0.1rem 0.4rem;font-size:0.75rem;margin:0.1rem">
                    ${esc(ed.drivers?.display_name)}
                    <button onclick="removeEntryDriver('${ed.id}','${eventId}','${esc(eventName)}','${seasonId}')"
                        style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;line-height:1;padding:0 0.1rem">×</button>
                 </span>`).join('');
            return `<tr>
                <td><strong>${en.car_number != null ? '#' + en.car_number : '<span class="td-muted">—</span>'}</strong></td>
                <td>${esc(en.teams?.name) || '—'}</td>
                <td>${en.manufacturers?.brand_color ? `<span class="color-swatch"><span class="swatch" style="background:${esc(en.manufacturers.brand_color)}"></span></span> ` : ''}${esc(en.manufacturers?.name) || '—'}</td>
                <td class="td-muted" style="font-size:0.82rem">${esc(en.car_model)}</td>
                <td><div style="display:flex;flex-wrap:wrap;gap:0.2rem;align-items:center">
                    ${driverTags}
                    ${en.team_id ? `<button class="btn-icon" style="padding:0.15rem 0.5rem;font-size:0.7rem"
                        onclick="openAddDriverModal('${en.id}','${en.team_id}','${en.car_number != null ? '#' + en.car_number + ' ' : ''}${esc(en.teams?.name)}','${eventId}','${esc(eventName)}','${seasonId}')">+ Driver</button>` : '<span style="font-size:0.7rem;color:var(--muted);font-style:italic">Solo</span>'}
                </div></td>
                <td>${entrStatusBadge(en.status)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon danger" onclick="removeEntry('${en.id}','${eventId}','${esc(eventName)}','${seasonId}')">Remove</button>
                </div></td>
            </tr>`;
        }).join('');

    // Compute how many season-registered teams still need an entry on this event
    const { data: ts } = await sb.from('team_seasons')
        .select('team_id, manufacturer_id, teams(name), manufacturers(name)')
        .eq('season_id', seasonId);
    const seasonRegisteredTeamIds = new Set((ts || []).map(r => r.team_id));
    const registeredTeamIds = new Set((data || []).map(en => en.team_id).filter(Boolean));
    const unregisteredTeams = (ts || []).filter(r => !registeredTeamIds.has(r.team_id));

    // Teams that have drivers but aren't yet in team_seasons for this season.
    // Pull them in too so admin doesn't have to detour into the Seasons section.
    const { data: anyDrivers } = await sb.from('drivers')
        .select('current_team_id, teams!current_team_id(id, name, manufacturer_id, manufacturers(name))')
        .not('current_team_id', 'is', null);
    const orphanTeams = [];
    const seenOrphan = new Set();
    (anyDrivers || []).forEach(d => {
        const team = d.teams;
        if (!team || !team.id) return;
        if (seasonRegisteredTeamIds.has(team.id)) return;
        if (registeredTeamIds.has(team.id)) return;
        if (seenOrphan.has(team.id)) return;
        if (!team.manufacturer_id) return;  // can't register without a mfr
        seenOrphan.add(team.id);
        orphanTeams.push({
            team_id:        team.id,
            team_name:      team.name,
            manufacturer_id: team.manufacturer_id,
            manufacturer_name: team.manufacturers?.name,
        });
    });

    // Drivers without a team who aren't already in any entry for this event
    const enteredDriverIds = new Set();
    (data || []).forEach(en => (en.entry_drivers || []).forEach(ed => enteredDriverIds.add(ed.driver_id ?? ed.drivers?.id)));
    const { data: freeAgents } = await sb.from('drivers')
        .select('id, display_name, career_number')
        .is('current_team_id', null);
    const unregisteredFreeAgents = (freeAgents || []).filter(d => !enteredDriverIds.has(d.id));

    // Existing team entries with zero drivers — left from earlier bulk
    // registers when auto-link didn't run yet.
    const emptyTeamEntries = (data || []).filter(en =>
        en.team_id && (en.entry_drivers || []).length === 0
    );

    const totalNewTeams = unregisteredTeams.length + orphanTeams.length;
    const teamsLabel    = totalNewTeams > 0 ? `${totalNewTeams} Team${totalNewTeams === 1 ? '' : 's'}` : '';
    const backfillLabel = emptyTeamEntries.length > 0 ? `Backfill ${emptyTeamEntries.length} Empty Entr${emptyTeamEntries.length === 1 ? 'y' : 'ies'}` : '';
    const soloLabel     = unregisteredFreeAgents.length > 0 ? `${unregisteredFreeAgents.length} Solo Driver${unregisteredFreeAgents.length === 1 ? '' : 's'}` : '';
    const labelParts = [teamsLabel, backfillLabel, soloLabel].filter(Boolean);
    const labelText  = labelParts.length ? labelParts.join(' + ') : '';

    const headerBtn = labelText
        ? `<button class="btn-add" onclick="registerAllSeasonTeams('${eventId}','${esc(eventName)}','${seasonId}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                ${labelText}
            </button>`
        : (!ts || ts.length === 0) && (!freeAgents || freeAgents.length === 0)
            ? `<button class="btn-icon" onclick="navigate('seasons')">No season teams · Open Seasons</button>`
            : `<span style="font-size:0.78rem;color:var(--muted)">All teams and free-agent drivers registered.</span>`;

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Entries — ${esc(eventName)}</span>
                ${headerBtn}
            </div>
            <table><thead><tr>
                <th>#</th><th>Team</th><th>Manufacturer</th><th>Car Model</th><th>Drivers</th><th>Status</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function registerAllSeasonTeams(eventId, eventName, seasonId) {
    const [{ data: ts }, { data: existing }, { data: freeAgents }, { data: entryDrivers }, { data: anyDrivers }] = await Promise.all([
        sb.from('team_seasons').select('team_id, manufacturer_id, manufacturers(name)').eq('season_id', seasonId),
        sb.from('entries').select('id, team_id, car_number').eq('event_id', eventId),
        sb.from('drivers').select('id, display_name, career_number, current_manufacturer_id, manufacturers(name)').is('current_team_id', null),
        sb.from('entry_drivers').select('driver_id, entry_id, entries!inner(event_id)').eq('entries.event_id', eventId),
        sb.from('drivers').select('current_team_id, teams!current_team_id(id, name, manufacturer_id, manufacturers(name))').not('current_team_id', 'is', null),
    ]);

    const existingTeamIds  = new Set((existing || []).map(e => e.team_id).filter(Boolean));
    const enteredDriverIds = new Set((entryDrivers || []).map(ed => ed.driver_id));
    const seasonRegisteredTeamIds = new Set((ts || []).map(r => r.team_id));

    // Auto-register any team that has drivers but isn't yet in team_seasons,
    // using the team's own manufacturer. Skip teams with no manufacturer set.
    const orphans = [];
    const seenOrphan = new Set();
    (anyDrivers || []).forEach(d => {
        const team = d.teams;
        if (!team?.id || !team.manufacturer_id) return;
        if (seasonRegisteredTeamIds.has(team.id)) return;
        if (existingTeamIds.has(team.id)) return;
        if (seenOrphan.has(team.id)) return;
        seenOrphan.add(team.id);
        orphans.push({
            team_id: team.id,
            manufacturer_id: team.manufacturer_id,
            manufacturer_name: team.manufacturers?.name,
        });
    });

    if (orphans.length) {
        const tsRows = orphans.map(o => ({
            team_id: o.team_id,
            season_id: seasonId,
            manufacturer_id: o.manufacturer_id,
        }));
        const { error: tsErr } = await sb.from('team_seasons').upsert(tsRows, { onConflict: 'team_id,season_id' });
        if (tsErr) { toast(`Auto-register team_seasons failed: ${tsErr.message}`, 'error'); return; }
        // Treat them as registered for the rest of this run.
        orphans.forEach(o => seasonRegisteredTeamIds.add(o.team_id));
        // Append to the ts list so they get entries below.
        orphans.forEach(o => (ts || []).push({
            team_id: o.team_id,
            manufacturer_id: o.manufacturer_id,
            manufacturers: { name: o.manufacturer_name },
        }));
    }

    // Existing team entries that have no drivers yet — left over from a
    // pre-auto-link bulk register or a manually-created empty entry.
    const driversPerEntry = new Map();
    (entryDrivers || []).forEach(ed => {
        driversPerEntry.set(ed.entry_id, (driversPerEntry.get(ed.entry_id) || 0) + 1);
    });
    const emptyTeamEntries = (existing || []).filter(en =>
        en.team_id && (driversPerEntry.get(en.id) || 0) === 0
    );

    const teamsToInsert = (ts || []).filter(r => !existingTeamIds.has(r.team_id)).map(r => ({
        event_id:        eventId,
        team_id:         r.team_id,
        manufacturer_id: r.manufacturer_id,
        car_model:       r.manufacturers?.name || 'TBC',
        status:          'confirmed',
    }));

    const soloToInsert = (freeAgents || []).filter(d => !enteredDriverIds.has(d.id));

    if (!teamsToInsert.length && !soloToInsert.length && !emptyTeamEntries.length) {
        toast('All teams and free-agent drivers already registered.', 'success');
        return;
    }

    const msg = [
        teamsToInsert.length ? `${teamsToInsert.length} team${teamsToInsert.length === 1 ? '' : 's'}` : '',
        emptyTeamEntries.length ? `backfill ${emptyTeamEntries.length} existing team entr${emptyTeamEntries.length === 1 ? 'y' : 'ies'}` : '',
        soloToInsert.length  ? `${soloToInsert.length} solo driver${soloToInsert.length === 1 ? '' : 's'}` : '',
    ].filter(Boolean).join(' + ');
    if (!confirm(`Register ${msg} for "${eventName}"?\n\nTeam entries inherit the team's locked manufacturer and auto-link every driver currently assigned to the team (1, 2 or more).\nSolo driver entries are team-less — when the driver later joins a team, the entry auto-updates.`)) return;

    // 1. Insert team entries + auto-link the team's current drivers
    let totalTeamDrivers = 0;
    if (teamsToInsert.length) {
        const { data: createdTeamEntries, error } = await sb.from('entries').insert(teamsToInsert).select('id, team_id');
        if (error) { toast(error.message, 'error'); return; }

        const newTeamIds = (createdTeamEntries || []).map(e => e.team_id).filter(Boolean);
        if (newTeamIds.length) {
            const { data: teamDrivers } = await sb.from('drivers')
                .select('id, current_team_id, career_number')
                .in('current_team_id', newTeamIds);
            const byTeam = new Map();
            (teamDrivers || []).forEach(d => {
                const list = byTeam.get(d.current_team_id) || [];
                list.push(d);
                byTeam.set(d.current_team_id, list);
            });

            const driverLinks = [];
            const carNumberUpdates = [];
            for (const en of createdTeamEntries) {
                const drivers = byTeam.get(en.team_id) || [];
                drivers.forEach(d => {
                    driverLinks.push({ entry_id: en.id, driver_id: d.id, stint_role: 'starting' });
                });
                totalTeamDrivers += drivers.length;
                const firstWithNum = drivers.find(d => d.career_number != null);
                if (firstWithNum) {
                    carNumberUpdates.push({ id: en.id, car_number: firstWithNum.career_number });
                }
            }
            if (driverLinks.length) {
                const { error: linkErr } = await sb.from('entry_drivers').insert(driverLinks);
                if (linkErr) toast(`Team entries inserted, but auto-linking drivers failed: ${linkErr.message}`, 'error');
            }
            for (const u of carNumberUpdates) {
                await sb.from('entries').update({ car_number: u.car_number }).eq('id', u.id);
            }
        }
    }

    // 1b. Backfill drivers on existing team entries that have none yet.
    let backfilledDrivers = 0;
    if (emptyTeamEntries.length) {
        const teamIds = [...new Set(emptyTeamEntries.map(en => en.team_id))];
        const { data: existingTeamDrivers } = await sb.from('drivers')
            .select('id, current_team_id, career_number')
            .in('current_team_id', teamIds);
        const byTeam2 = new Map();
        (existingTeamDrivers || []).forEach(d => {
            const list = byTeam2.get(d.current_team_id) || [];
            list.push(d);
            byTeam2.set(d.current_team_id, list);
        });
        const links2 = [];
        const carUpdates2 = [];
        for (const en of emptyTeamEntries) {
            const drivers = byTeam2.get(en.team_id) || [];
            drivers.forEach(d => links2.push({ entry_id: en.id, driver_id: d.id, stint_role: 'starting' }));
            backfilledDrivers += drivers.length;
            if (en.car_number == null) {
                const firstWithNum = drivers.find(d => d.career_number != null);
                if (firstWithNum) carUpdates2.push({ id: en.id, car_number: firstWithNum.career_number });
            }
        }
        if (links2.length) {
            const { error: linkErr } = await sb.from('entry_drivers').insert(links2);
            if (linkErr) toast(`Backfill failed: ${linkErr.message}`, 'error');
        }
        for (const u of carUpdates2) {
            await sb.from('entries').update({ car_number: u.car_number }).eq('id', u.id);
        }
    }

    // 2. Insert solo entries (one per driver), then link them in entry_drivers
    if (soloToInsert.length) {
        const soloEntries = soloToInsert.map(d => ({
            event_id: eventId,
            team_id:  null,
            status:   'confirmed',
            car_number:      d.career_number || null,
            car_model:       d.manufacturers?.name || 'TBC',
            manufacturer_id: d.current_manufacturer_id || null,
        }));
        const { data: created, error: soloErr } = await sb.from('entries').insert(soloEntries).select('id');
        if (soloErr) { toast(soloErr.message, 'error'); return; }
        const links = (created || []).map((row, idx) => ({
            entry_id:  row.id,
            driver_id: soloToInsert[idx].id,
            stint_role: 'starting',
        }));
        if (links.length) {
            const { error: linkErr } = await sb.from('entry_drivers').insert(links);
            if (linkErr) { toast(`Solo entries inserted, but linking drivers failed: ${linkErr.message}`, 'error'); return; }
        }
    }

    const summary = [
        teamsToInsert.length ? `${teamsToInsert.length} team${teamsToInsert.length === 1 ? '' : 's'} (${totalTeamDrivers} driver${totalTeamDrivers === 1 ? '' : 's'})` : '',
        backfilledDrivers ? `${backfilledDrivers} backfilled driver${backfilledDrivers === 1 ? '' : 's'}` : '',
        soloToInsert.length  ? `${soloToInsert.length} solo` : '',
    ].filter(Boolean).join(' + ');
    toast(`Registered ${summary}.`, 'success');
    await viewEventEntries(eventId, eventName, seasonId);
}

async function openAddEntryModal(eventId, eventName, seasonId) {
    const { data: ts } = await sb.from('team_seasons')
        .select('team_id, manufacturer_id, teams(name), manufacturers(name)')
        .eq('season_id', seasonId);

    if (!ts || ts.length === 0) {
        const { count: teamCount } = await sb.from('teams').select('*', { count: 'exact', head: true });
        const msg = teamCount
            ? `You have ${teamCount} team${teamCount === 1 ? '' : 's'}, but none are registered for this season yet.`
            : `No teams exist yet.`;
        openModal(`Add Entry — ${esc(eventName)}`,
            `<div style="padding:0.5rem 0">
                <p style="color:#fca5a5;margin-bottom:0.85rem;font-weight:600">${esc(msg)}</p>
                <p style="color:var(--muted);font-size:0.88rem;line-height:1.5">
                    Each team must be registered to a season with a locked manufacturer before they can be entered into events. To fix this:
                </p>
                <ol style="color:var(--muted);font-size:0.88rem;line-height:1.7;padding-left:1.25rem;margin-top:0.6rem">
                    <li>Open the <strong style="color:var(--text)">Seasons</strong> section.</li>
