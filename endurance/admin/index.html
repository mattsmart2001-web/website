<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --bg-3: #171d27;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --cyan: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
            --sidebar-w: 220px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            line-height: 1.5;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 20;
        }
        .sidebar-logo {
            padding: 1.5rem 1.25rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo .brand {
            font-family: 'Anton', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text);
            text-indent: 0.28em;
        }
        .sidebar-logo .brand span { color: var(--gold); }
        .sidebar-logo .brand .brand-logo { height: 18px; width: auto; vertical-align: middle; margin-left: 0.4em; }
        .sidebar-logo .sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.2rem;
            text-indent: 0.35em;
        }
        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }
        .nav-section {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.85rem 1.25rem 0.4rem;
            text-indent: 0.35em;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 1.25rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.15s, background 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: var(--gold); background: rgba(255,209,102,0.08); }
        .nav-link.active svg { color: var(--gold); }
        .nav-badge {
            margin-left: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 1.4rem;
            text-align: center;
            padding: 0.1rem 0.4rem;
            border-radius: 999px;
            background: var(--gold);
            color: #1a1300;
            line-height: 1.3;
        }
        .sidebar-bottom {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
        }
        .user-chip {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-logout {
            width: 100%;
            padding: 0.55rem 0.85rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-logout:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* ===== MAIN ===== */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: rgba(5,6,8,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }
        .admin-nav-toggle {
            display: none;
            width: 38px;
            height: 38px;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            padding: 0;
            flex-shrink: 0;
        }
        .admin-nav-toggle:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .admin-nav-toggle svg { width: 18px; height: 18px; display: block; }
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 15;
        }
        body.sidebar-open .sidebar-backdrop { display: block; }
        .page-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-add:hover { filter: brightness(1.08); }
        .btn-add svg { width: 14px; height: 14px; }
        .content {
            flex: 1;
            padding: 2rem;
        }

        /* ===== STAT CARDS ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .stat-card-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-indent: 0.2em;
        }
        .stat-card-value {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            line-height: 1;
            background: linear-gradient(180deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== TABLE ===== */
        .table-wrap {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }
        .table-search {
            flex: 1;
            max-width: 280px;
            padding: 0.5rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .table-search:focus { border-color: rgba(255,209,102,0.4); }
        .table-search::placeholder { color: var(--muted); opacity: 0.6; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            padding: 0.7rem 1.25rem;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .td-muted { color: var(--muted); font-size: 0.82rem; }
        .color-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-muted { background: rgba(255,255,255,0.06); color: var(--muted); }
        .badge-gold  { background: rgba(255,209,102,0.15); color: var(--gold); }
        .badge-red   { background: rgba(239,68,68,0.12); color: #fca5a5; }
        .row-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }
        .btn-icon {
            padding: 0.35rem 0.65rem;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .btn-icon:hover { color: var(--text); border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
        .btn-icon.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); }
        .empty-state {
            padding: 3rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .loading-state {
            padding: 2rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 1.15rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        label .required { color: var(--gold); margin-left: 2px; }
        input[type="text"], input[type="email"], input[type="number"],
        input[type="date"], input[type="color"], input[type="url"],
        select, textarea {
            display: block;
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="color"] { padding: 0.35rem; height: 38px; cursor: pointer; }
        input:focus, select:focus, textarea:focus { border-color: rgba(255,209,102,0.5); }
        input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.6; }
        select option { background: var(--bg-2); }
        textarea { resize: vertical; min-height: 80px; }
        .form-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }

        /* EasyMDE dark-theme overrides — keep editor consistent with admin */
        .EasyMDEContainer .editor-toolbar {
            background: var(--bg-2);
            border-color: var(--border);
            border-top-left-radius: 8px; border-top-right-radius: 8px;
            opacity: 1;
        }
        .EasyMDEContainer .editor-toolbar button {
            color: var(--muted) !important;
            border-color: transparent !important;
        }
        .EasyMDEContainer .editor-toolbar button:hover,
        .EasyMDEContainer .editor-toolbar button.active {
            background: rgba(255,255,255,0.06) !important;
            border-color: var(--border) !important;
            color: var(--text) !important;
        }
        .EasyMDEContainer .editor-toolbar i.separator {
            border-color: var(--border);
        }
        .EasyMDEContainer .CodeMirror {
            background: var(--bg-1) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
            border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
            font-family: 'Inter', 'SF Mono', Menlo, monospace !important;
            font-size: 0.9rem !important;
        }
        .EasyMDEContainer .CodeMirror-cursor { border-color: var(--gold); }
        .EasyMDEContainer .CodeMirror-selected { background: rgba(255,209,102,0.18) !important; }
        .EasyMDEContainer .cm-header { color: var(--gold); }
        .EasyMDEContainer .cm-link, .EasyMDEContainer .cm-url { color: #38bdf8; }
        .EasyMDEContainer .cm-strong { color: var(--text); }
        .EasyMDEContainer .editor-statusbar { color: var(--muted); }
        .EasyMDEContainer .editor-preview, .EasyMDEContainer .editor-preview-side {
            background: var(--bg-1);
            color: var(--text);
            border-color: var(--border) !important;
        }
        .EasyMDEContainer .editor-preview h1,
        .EasyMDEContainer .editor-preview h2,
        .EasyMDEContainer .editor-preview h3 { color: var(--gold); }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }
        .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .form-check span { font-size: 0.88rem; color: var(--text); font-weight: 400; letter-spacing: 0; text-transform: none; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: filter 0.15s, background 0.15s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .btn-danger {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); }

        /* ===== SEASON TEAMS sub-section ===== */
        .section-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 1.5rem;
            overflow: hidden;
        }
        .section-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
        }
        .section-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            text-indent: 0.25em;
        }

        /* ===== TOASTS ===== */
        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            pointer-events: none;
        }
        .toast {
            padding: 0.8rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            max-width: 340px;
            pointer-events: auto;
            animation: toast-in 0.25s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: none; }
        }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .toast.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .toast.info    { background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.3); color: #7dd3fc; }

        /* ===== CONFIRM BANNER ===== */
        .confirm-banner {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .confirm-banner.open { display: block; }
        .confirm-banner p { font-size: 0.85rem; color: #fca5a5; margin-bottom: 0.65rem; }
        .confirm-banner .confirm-btns { display: flex; gap: 0.5rem; }

        /* ===== AUTH LOADING ===== */
        #auth-loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--muted);
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.2s ease; }
            body.sidebar-open .sidebar { transform: translateX(0); }
            .main { margin-left: 0; }
            .form-row { grid-template-columns: 1fr; }
            .admin-nav-toggle { display: inline-flex; }
            .topbar { padding: 0.85rem 1rem; }
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js" defer></script>
</head>
<body>

<div id="auth-loading">Authenticating…</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="brand">Gran Turismo<img class="brand-logo" src="/endurance/assets/gtec-logo.png" alt="GTEC"></div>
        <div class="sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">Overview</div>
        <button class="nav-link" data-section="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
        </button>

        <div class="nav-section">Championship</div>
        <button class="nav-link" data-section="manufacturers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
            Manufacturers
        </button>
        <button class="nav-link" data-section="seasons">

<!-- Toasts -->
<div class="toast-container" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/countries.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';

// ============================================================
// 1. Init
// ============================================================
const { createClient } = window.supabase;
const cfg = window.GTEC_CONFIG;
const sb  = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

let currentUser  = null;
let currentSection = 'dashboard';

// Cached data for dropdowns
let _manufacturers = [];
let _seasons       = [];
let _teams         = [];
let _pointsSystems = [];
let _drivers       = [];


// ============================================================
// 2. Auth guard
// ============================================================
async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        window.location.replace('./login.html');
        return;
    }
    currentUser = session.user;

    const { data: role } = await sb.from('user_roles')
        .select('role')
        .eq('user_id', currentUser.id)
        .eq('role', 'admin')
        .maybeSingle();

    if (!role) {
        await sb.auth.signOut();
        window.location.replace('./login.html');
        return;
    }

    document.getElementById('user-email').textContent = currentUser.email;
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('sidebar').style.transform = '';
    document.getElementById('sidebar').style.display = '';

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.replace('./login.html');
    });

    setupNav();
    await refreshAppsBadge();
    await refreshMsgsBadge();
    setInterval(refreshAppsBadge, 60000);
    setInterval(refreshMsgsBadge, 60000);
    await navigate('dashboard');
}

async function refreshMsgsBadge() {
    const { count } = await sb.from('driver_contact_messages')
        .select('id', { count: 'exact', head: true })
        .eq('status', 'new');
    const el = document.getElementById('msgs-badge');
    if (!el) return;
    if (count && count > 0) {
        el.textContent = count;
        el.style.display = '';
    } else {
        el.style.display = 'none';
    }
}

async function refreshAppsBadge() {
    const { count } = await sb.from('applications')
        .select('id', { count: 'exact', head: true })
        .eq('status', 'pending');
    const el = document.getElementById('apps-badge');
    if (!el) return;
    if (count && count > 0) {
        el.textContent = count;
        el.style.display = '';
    } else {
        el.style.display = 'none';
    }
}


// ============================================================
// 3. Router & nav
// ============================================================
function setupNav() {
    document.querySelectorAll('.nav-link[data-section]').forEach(btn => {
        btn.addEventListener('click', () => {
            navigate(btn.dataset.section);
            document.body.classList.remove('sidebar-open');
        });
    });

    // Mobile sidebar toggle
    document.getElementById('admin-nav-toggle').addEventListener('click', () => {
        document.body.classList.toggle('sidebar-open');
    });
    document.getElementById('sidebar-backdrop').addEventListener('click', () => {
        document.body.classList.remove('sidebar-open');
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.body.classList.remove('sidebar-open');
    });
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) document.body.classList.remove('sidebar-open');
    });

    // Hash routing
    window.addEventListener('hashchange', () => {
        const sec = window.location.hash.replace('#', '') || 'dashboard';
        navigate(sec, false);
    });
    const hash = window.location.hash.replace('#', '');
    if (hash && hash !== 'dashboard') navigate(hash, false);
}

async function navigate(section, pushHash = true) {
    currentSection = section;
    if (pushHash) window.location.hash = section;

    document.querySelectorAll('.nav-link').forEach(b => b.classList.toggle('active', b.dataset.section === section));

    const titles = {
        dashboard: 'Dashboard',
        manufacturers: 'Manufacturers',
        seasons: 'Seasons',
        teams: 'Teams',
        drivers: 'Drivers',
        events: 'Events',
        applications: 'Applications',
        messages: 'Driver Messages',
        news: 'News',
        media: 'Media',
        pages: 'Pages',
        admins: 'Admins',
    };
    document.getElementById('page-title').textContent = titles[section] || section;

    const addBtn = document.getElementById('btn-add');
    if (section === 'dashboard' || section === 'pages' || section === 'applications' || section === 'admins' || section === 'messages') {
        addBtn.style.display = 'none';
    } else {
        addBtn.style.display = '';
        addBtn.onclick = () => openAddModal(section);
    }

    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading-state">Loading…</div>';

    await Promise.all([loadCache()]);

    switch (section) {
        case 'dashboard':    await renderDashboard(); break;
        case 'manufacturers': await renderManufacturers(); break;
        case 'seasons':      await renderSeasons(); break;
        case 'teams':        await renderTeams(); break;
        case 'drivers':      await renderDrivers(); break;
        case 'events':       await renderEvents(); break;
        case 'applications': await renderApplications(); break;
        case 'news':         await renderNews(); break;
        case 'media':        await renderMedia(); break;
        case 'pages':        await renderPages(); break;
        case 'admins':       await renderAdmins(); break;
        case 'messages':     await renderMessages(); break;
    }
}


// ============================================================
// 4. Dropdown caches
// ============================================================
async function loadCache() {
    const [mfr, ps, tm, dr, seas] = await Promise.all([
        sb.from('manufacturers').select('id,name,slug').order('name'),
        sb.from('points_systems').select('id,name').order('name'),
        sb.from('teams').select('id,name,slug,manufacturer_id').order('name'),
        sb.from('drivers').select('id,display_name,slug,career_number,current_team_id').order('display_name'),
        sb.from('seasons').select('id,name,year').order('year', { ascending: false }),
    ]);
    _manufacturers = mfr.data  || [];
    _pointsSystems = ps.data   || [];
    _teams         = tm.data   || [];
    _drivers       = dr.data   || [];
    _seasons       = seas.data || [];
}


// ============================================================
// 5. UI helpers
// ============================================================
function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function openModal(title, bodyHTML, footerHTML) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHTML;
    document.getElementById('modal-footer').innerHTML = footerHTML;
    document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    if (window._pageMDE) { try { window._pageMDE.toTextArea(); } catch {} window._pageMDE = null; }
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function slugify(str) {
    return str.toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
}

function selectHTML(id, options, selected = '', emptyLabel = '— Select —') {
    const opts = options.map(o =>
        `<option value="${esc(o.value)}" ${o.value === selected ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="${id}" name="${id}"><option value="">${emptyLabel}</option>${opts}</select>`;
}

function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getFormData(formId) {
    const form = document.getElementById(formId);
    const data = {};
    form.querySelectorAll('[name]').forEach(el => {
        if (el.type === 'checkbox') data[el.name] = el.checked;
        else data[el.name] = el.value || null;
    });
    return data;
}


// ============================================================
// 6. Dashboard
// ============================================================
async function renderDashboard() {
    const [mfr, seasons, teams, drivers, evts] = await Promise.all([
        sb.from('manufacturers').select('id', { count: 'exact', head: true }),
        sb.from('seasons').select('id', { count: 'exact', head: true }),
        sb.from('teams').select('id', { count: 'exact', head: true }),
        sb.from('drivers').select('id', { count: 'exact', head: true }),
        sb.from('events').select('id', { count: 'exact', head: true }),
    ]);

    const { data: activeSeason } = await sb.from('seasons').select('name,year').eq('is_active', true).maybeSingle();

    document.getElementById('content').innerHTML = `
        <div class="stat-grid">
            <div class="stat-card"><div class="stat-card-label">Manufacturers</div><div class="stat-card-value">${mfr.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Seasons</div><div class="stat-card-value">${seasons.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Teams</div><div class="stat-card-value">${teams.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Drivers</div><div class="stat-card-value">${drivers.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Events</div><div class="stat-card-value">${evts.count ?? 0}</div></div>
        </div>
        <div class="table-wrap" style="padding:1.5rem">
            <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem;font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase">Active Season</div>
            <div style="font-family:'Anton',sans-serif;font-size:1.6rem;letter-spacing:0.04em">${activeSeason ? esc(activeSeason.name) : '<span style="color:var(--muted);font-size:1rem;font-family:Inter,sans-serif">None — create a season and mark it active</span>'}</div>
        </div>
        <div class="table-wrap" style="padding:1.5rem;margin-top:1rem">
            <div style="font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem">Maintenance</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:0.85rem;border-bottom:1px solid var(--border)">
                <div style="font-size:0.85rem;color:var(--muted)">Rebuild Hall of Fame records from current career stats.</div>
                <button class="btn btn-primary" onclick="refreshHallOfFame()">Refresh Hall of Fame</button>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:0.85rem">
                <div style="font-size:0.85rem;color:#fca5a5">Delete all race data — entries, results, qualifying, ratings, penalties, steward decisions, Hall of Fame. Events, drivers, teams, manufacturers and seasons are kept.</div>
                <button class="btn-icon danger" onclick="resetAllStats()">Reset All Statistics</button>
            </div>
        </div>
    `;
}


// ============================================================
// 7. Manufacturers
// ============================================================
async function renderManufacturers() {
    const { data, error } = await sb.from('manufacturers').select('*').order('name');
    if (error) { toast(error.message, 'error'); return; }

    const rows = data.length === 0 ? `<tr><td colspan="6"><div class="empty-state">No manufacturers yet — add one to get started.</div></td></tr>` :
        data.map(m => `
            <tr>
                <td>${m.logo_url
                    ? `<img src="${esc(m.logo_url)}" alt="${esc(m.name)}" style="width:32px;height:32px;object-fit:contain;background:rgba(255,255,255,0.04);border-radius:4px;padding:2px">`
                    : `<div style="width:32px;height:32px;border-radius:4px;background:${esc(m.brand_color || 'rgba(255,255,255,0.05)')};border:1px solid var(--border)"></div>`}</td>
                <td><strong>${esc(m.name)}</strong></td>
                <td class="td-muted">${esc(m.slug)}</td>
                <td class="td-muted">${esc(m.country) || '—'}</td>
                <td>${m.brand_color ? `<div class="color-swatch"><div class="swatch" style="background:${esc(m.brand_color)}"></div>${esc(m.brand_color)}</div>` : '<span class="td-muted">—</span>'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editManufacturer('${m.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteManufacturer('${m.id}','${esc(m.name)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search manufacturers…" oninput="filterTable(this,'mfr-table')">
            </div>
            <table id="mfr-table"><thead><tr>
                <th style="width:60px">Logo</th><th>Name</th><th>Slug</th><th>Country</th><th>Brand Colour</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

function mfrForm(m = {}) {
    return `<form id="entity-form">
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="name" value="${esc(m.name)}" placeholder="BMW" required oninput="autoSlug(this,'name','slug')">
            </div>
            <div class="form-group">
                <label>Slug <span class="required">*</span></label>
                <input type="text" name="slug" id="slug" value="${esc(m.slug)}" placeholder="bmw" required>
                <div class="form-hint">Auto-generated · editable</div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Country</label>
                <select name="country">${window.gtecCountryOptions(m.country)}</select>
            </div>
            <div class="form-group">
                <label>Brand Colour</label>
                <input type="color" name="brand_color" value="${m.brand_color || '#ffffff'}">
            </div>
        </div>
        <div class="form-group">
            <label>Logo</label>
            <div style="display:flex;align-items:center;gap:1rem">
                <div id="mfr-logo-preview" style="width:64px;height:64px;flex-shrink:0;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden">
                    ${m.logo_url ? `<img src="${esc(m.logo_url)}" style="max-width:100%;max-height:100%;object-fit:contain">` : '<span style="font-size:0.7rem;color:var(--muted)">No logo</span>'}
                </div>
                <div style="flex:1">
                    <input type="file" id="mfr-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="padding:0.4rem 0">
                    <input type="hidden" name="logo_url" value="${esc(m.logo_url)}">
                    <div class="form-hint">PNG / SVG / WebP recommended. Square transparent works best. Uploads to gtec-manufacturers bucket.</div>
                </div>
            </div>
        </div>
    </form>`;
}

function openAddModal(section) {
    const map = {
        manufacturers: () => openManufacturerModal(),
        seasons:       () => openSeasonModal(),
        teams:         () => openTeamModal(),
        drivers:       () => openDriverModal(),
        events:        () => openEventModal(),
        news:          () => openNewsModal(),
        media:         () => openMediaModal(),
    };
    map[section]?.();
}

function openManufacturerModal(m = {}) {
    openModal(m.id ? 'Edit Manufacturer' : 'Add Manufacturer', mfrForm(m), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveManufacturer('${m.id || ''}')">Save</button>
    `);
}

async function editManufacturer(id) {
    const { data } = await sb.from('manufacturers').select('*').eq('id', id).single();
    openManufacturerModal(data);
}

async function saveManufacturer(id) {
    const d = getFormData('entity-form');
    if (!d.name || !d.slug) { toast('Name and slug are required.', 'error'); return; }

    let logoUrl = d.logo_url || null;
    const fileInput = document.getElementById('mfr-logo-file');
    const file = fileInput?.files?.[0];
    if (file) {
        const ext = file.name.split('.').pop().toLowerCase();
        const path = `${d.slug}-${Date.now()}.${ext}`;
        toast('Uploading logo…', 'success');
        const { error: upErr } = await sb.storage.from('gtec-manufacturers').upload(path, file, { upsert: true });
        if (upErr) { toast(upErr.message, 'error'); return; }
        logoUrl = sb.storage.from('gtec-manufacturers').getPublicUrl(path).data.publicUrl;
    }

    const payload = { name: d.name, slug: d.slug, country: d.country, brand_color: d.brand_color, logo_url: logoUrl };
    const { error } = id
        ? await sb.from('manufacturers').update(payload).eq('id', id)
        : await sb.from('manufacturers').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Manufacturer updated.' : 'Manufacturer added.', 'success');
    closeModal();
    await renderManufacturers();
    await loadCache();
}

async function deleteManufacturer(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    const { error } = await sb.from('manufacturers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Manufacturer deleted.', 'success');
    await renderManufacturers();
    await loadCache();
}


// ============================================================
// 8. Seasons
// ============================================================
async function renderSeasons() {
    const { data, error } = await sb.from('seasons')
        .select('*, points_systems(name)')

    if (error) { toast(error.message, 'error'); return; }

function checkCareerNumber(raw, ignoreDriverId) {
    if (raw === '' || raw == null) return { ok: true, value: null };
    const n = parseInt(raw, 10);
    if (Number.isNaN(n) || n < 1 || n > 999) {
        return { ok: false, error: 'Career number must be between 1 and 999.' };
    }
    const clash = _drivers.find(d => d.career_number === n && d.id !== ignoreDriverId);
    if (clash) {
        return { ok: false, error: `#${n} is already used by ${clash.display_name}.` };
    }
    return { ok: true, value: n };
}

function checkDriverNameUnique(name, ignoreId) {
    const t = (name || '').trim().toLowerCase();
    if (!t) return null;
    const clash = _drivers.find(d =>
        (d.display_name || '').trim().toLowerCase() === t && d.id !== ignoreId
    );
    return clash ? `Driver name "${name}" is already taken.` : null;
}

function checkTeamNameUnique(name, ignoreId) {
    const t = (name || '').trim().toLowerCase();
    if (!t) return null;
    const clash = _teams.find(team =>
        (team.name || '').trim().toLowerCase() === t && team.id !== ignoreId
    );
    return clash ? `Team name "${name}" is already taken.` : null;
}

async function saveDriver(id) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkDriverNameUnique(d.display_name, id);
    if (dupName) { toast(dupName, 'error'); return; }
    const num = checkCareerNumber(d.career_number, id);
    if (!num.ok) { toast(num.error, 'error'); return; }
    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        nationality: d.nationality, career_number: num.value,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
        gt7_dr_rating: d.gt7_dr_rating || null, gt7_sr_rating: d.gt7_sr_rating || null,
    };
    const { error } = id
        ? await sb.from('drivers').update(payload).eq('id', id)
        : await sb.from('drivers').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Driver updated.' : 'Driver added.', 'success');
    closeModal();
    await renderDrivers();
    await loadCache();
}

async function deleteDriver(id, name) {
    if (!confirm(`Delete "${name}"?`)) return;
    const { error } = await sb.from('drivers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }

function formatDatetime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function toDatetimeLocal(iso) {
    if (!iso) return '';
    return iso.slice(0, 16);
}

function autoFillEndsAt() {
    const starts = document.getElementById('ev-starts')?.value;
    const hours  = parseFloat(document.getElementById('ev-duration')?.value);
    const endsEl = document.getElementById('ev-ends');
    if (!starts || !hours || !endsEl) return;
    const ms = new Date(starts).getTime() + hours * 3600 * 1000;
    if (!isNaN(ms)) endsEl.value = toDatetimeLocal(new Date(ms).toISOString());
}

function openEventModal(e = {}) {
    openModal(e.id ? 'Edit Event' : 'Add Event', eventForm(e), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEvent('${e.id || ''}')">Save</button>
    `);
}

async function editEvent(id) {
    const { data } = await sb.from('events').select('*').eq('id', id).single();
    openEventModal(data);
}

async function saveEvent(id) {
    const d = getFormData('entity-form');
    if (!d.season_id || !d.round || !d.name || !d.slug || !d.circuit_name || !d.duration_hours || !d.starts_at || !d.ends_at) {
        toast('Fill in all required fields.', 'error'); return;
    }
    const payload = {
        season_id: d.season_id,
        round: parseInt(d.round),
        name: d.name,
        slug: d.slug,
        circuit_name: d.circuit_name,
        circuit_country: d.circuit_country || null,
        circuit_length_km: d.circuit_length_km ? parseFloat(d.circuit_length_km) : null,
        duration_hours: parseFloat(d.duration_hours),
        starts_at: d.starts_at,
        ends_at: d.ends_at,
        status: d.status || 'scheduled',
        replay_url: d.replay_url || null,
        notes: d.notes || null,
    };
    const { error } = id
        ? await sb.from('events').update(payload).eq('id', id)
        : await sb.from('events').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Event updated.' : 'Event created.', 'success');
    closeModal();
    await renderEvents();
}

async function deleteEvent(id, name) {
    if (!confirm(`Delete "${name}"? This will cascade-delete all entries and results.`)) return;
    const { error } = await sb.from('events').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Event deleted.', 'success');
    await renderEvents();
}

async function viewEventEntries(eventId, eventName, seasonId) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading entries…</div>';

    const { data, error } = await sb.from('entries')
        .select('*, teams(name), manufacturers(name,brand_color), entry_drivers(id, stint_role, drivers(id,display_name))')
        .eq('event_id', eventId)
        .order('car_number');

    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    const entrStatusBadge = s => {
        const map = { confirmed: 'badge-green', withdrawn: 'badge-muted', dnq: 'badge-muted' };
        return `<span class="badge ${map[s] || 'badge-muted'}">${s}</span>`;
    };

    const rows = data.length === 0 ? `<tr><td colspan="7"><div class="empty-state">No entries yet — add one.</div></td></tr>` :
        data.map(en => {
            const driverTags = (en.entry_drivers || []).map(ed =>
                `<span style="display:inline-flex;align-items:center;gap:0.2rem;background:rgba(255,255,255,0.06);border-radius:4px;padding:0.1rem 0.4rem;font-size:0.75rem;margin:0.1rem">
                    ${esc(ed.drivers?.display_name)}
                    <button onclick="removeEntryDriver('${ed.id}','${eventId}','${esc(eventName)}','${seasonId}')"
                        style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;line-height:1;padding:0 0.1rem">×</button>
                 </span>`).join('');
            return `<tr>
                <td><strong>${en.car_number != null ? '#' + en.car_number : '<span class="td-muted">—</span>'}</strong></td>
                <td>${esc(en.teams?.name) || '—'}</td>
                <td>${en.manufacturers?.brand_color ? `<span class="color-swatch"><span class="swatch" style="background:${esc(en.manufacturers.brand_color)}"></span></span> ` : ''}${esc(en.manufacturers?.name) || '—'}</td>
                <td class="td-muted" style="font-size:0.82rem">${esc(en.car_model)}</td>
                <td><div style="display:flex;flex-wrap:wrap;gap:0.2rem;align-items:center">
                    ${driverTags}
                    ${en.team_id ? `<button class="btn-icon" style="padding:0.15rem 0.5rem;font-size:0.7rem"
                        onclick="openAddDriverModal('${en.id}','${en.team_id}','${en.car_number != null ? '#' + en.car_number + ' ' : ''}${esc(en.teams?.name)}','${eventId}','${esc(eventName)}','${seasonId}')">+ Driver</button>` : '<span style="font-size:0.7rem;color:var(--muted);font-style:italic">Solo</span>'}
                </div></td>
                <td>${entrStatusBadge(en.status)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon danger" onclick="removeEntry('${en.id}','${eventId}','${esc(eventName)}','${seasonId}')">Remove</button>
                </div></td>
            </tr>`;
        }).join('');

    // Compute how many season-registered teams still need an entry on this event
    const { data: ts } = await sb.from('team_seasons')
        .select('team_id, manufacturer_id, teams(name), manufacturers(name)')
        .eq('season_id', seasonId);
    const registeredTeamIds = new Set((data || []).map(en => en.team_id).filter(Boolean));
    const unregisteredTeams = (ts || []).filter(r => !registeredTeamIds.has(r.team_id));

    // Drivers without a team who aren't already in any entry for this event
    const enteredDriverIds = new Set();
    (data || []).forEach(en => (en.entry_drivers || []).forEach(ed => enteredDriverIds.add(ed.driver_id ?? ed.drivers?.id)));
    const { data: freeAgents } = await sb.from('drivers')
        .select('id, display_name, career_number')
        .is('current_team_id', null);
    const unregisteredFreeAgents = (freeAgents || []).filter(d => !enteredDriverIds.has(d.id));

    const teamsLabel = unregisteredTeams.length > 0 ? `${unregisteredTeams.length} Team${unregisteredTeams.length === 1 ? '' : 's'}` : '';
    const soloLabel  = unregisteredFreeAgents.length > 0 ? `${unregisteredFreeAgents.length} Solo Driver${unregisteredFreeAgents.length === 1 ? '' : 's'}` : '';
    const labelParts = [teamsLabel, soloLabel].filter(Boolean);
    const labelText  = labelParts.length ? `Register ${labelParts.join(' + ')}` : '';

    const headerBtn = labelText
        ? `<button class="btn-add" onclick="registerAllSeasonTeams('${eventId}','${esc(eventName)}','${seasonId}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                ${labelText}
            </button>`
        : (!ts || ts.length === 0) && (!freeAgents || freeAgents.length === 0)
            ? `<button class="btn-icon" onclick="navigate('seasons')">No season teams · Open Seasons</button>`
            : `<span style="font-size:0.78rem;color:var(--muted)">All teams and free-agent drivers registered.</span>`;

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Entries — ${esc(eventName)}</span>
                ${headerBtn}
            </div>
            <table><thead><tr>
                <th>#</th><th>Team</th><th>Manufacturer</th><th>Car Model</th><th>Drivers</th><th>Status</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function registerAllSeasonTeams(eventId, eventName, seasonId) {
    const [{ data: ts }, { data: existing }, { data: freeAgents }, { data: entryDrivers }] = await Promise.all([
        sb.from('team_seasons').select('team_id, manufacturer_id, manufacturers(name)').eq('season_id', seasonId),
        sb.from('entries').select('id, team_id').eq('event_id', eventId),
        sb.from('drivers').select('id, display_name, career_number, current_manufacturer_id, manufacturers(name)').is('current_team_id', null),
        sb.from('entry_drivers').select('driver_id, entry_id, entries!inner(event_id)').eq('entries.event_id', eventId),
    ]);

    const existingTeamIds  = new Set((existing || []).map(e => e.team_id).filter(Boolean));
    const enteredDriverIds = new Set((entryDrivers || []).map(ed => ed.driver_id));

    const teamsToInsert = (ts || []).filter(r => !existingTeamIds.has(r.team_id)).map(r => ({
        event_id:        eventId,
        team_id:         r.team_id,
        manufacturer_id: r.manufacturer_id,
        car_model:       r.manufacturers?.name || 'TBC',
        status:          'confirmed',
    }));

    const soloToInsert = (freeAgents || []).filter(d => !enteredDriverIds.has(d.id));

    if (!teamsToInsert.length && !soloToInsert.length) {
        toast('All teams and free-agent drivers already registered.', 'success');
        return;
    }

    const msg = [
        teamsToInsert.length ? `${teamsToInsert.length} team${teamsToInsert.length === 1 ? '' : 's'}` : '',
        soloToInsert.length  ? `${soloToInsert.length} solo driver${soloToInsert.length === 1 ? '' : 's'}` : '',
    ].filter(Boolean).join(' + ');
    if (!confirm(`Register ${msg} for "${eventName}"?\n\nTeam entries inherit the team's locked manufacturer.\nSolo driver entries are team-less — when the driver later joins a team, the entry auto-updates.`)) return;

    // 1. Insert team entries
    if (teamsToInsert.length) {
        const { error } = await sb.from('entries').insert(teamsToInsert);
        if (error) { toast(error.message, 'error'); return; }
    }

    // 2. Insert solo entries (one per driver), then link them in entry_drivers
    if (soloToInsert.length) {
        const soloEntries = soloToInsert.map(d => ({
            event_id: eventId,
            team_id:  null,
            status:   'confirmed',
            car_number:      d.career_number || null,
            car_model:       d.manufacturers?.name || 'TBC',
            manufacturer_id: d.current_manufacturer_id || null,
        }));
        const { data: created, error: soloErr } = await sb.from('entries').insert(soloEntries).select('id');
        if (soloErr) { toast(soloErr.message, 'error'); return; }
        const links = (created || []).map((row, idx) => ({
            entry_id:  row.id,
            driver_id: soloToInsert[idx].id,
            stint_role: 'starting',
        }));
        if (links.length) {
            const { error: linkErr } = await sb.from('entry_drivers').insert(links);
            if (linkErr) { toast(`Solo entries inserted, but linking drivers failed: ${linkErr.message}`, 'error'); return; }
        }
    }

    toast(`Registered ${msg}.`, 'success');
    await viewEventEntries(eventId, eventName, seasonId);
}

                <div class="form-group">

        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="saveEntry('${eventId}','${esc(eventName)}','${seasonId}')">Add Entry</button>`
    );
}

function fillEntryMfr(sel) {
    const opt = sel.selectedOptions[0];
    const mfrId   = opt?.dataset.mfrId   || '';
    const mfrName = opt?.dataset.mfrName || '';
    const hidden  = document.getElementById('manufacturer_id');
    const display = document.getElementById('entry-mfr-display');
    if (hidden)  hidden.value = mfrId;
    if (display) {
        display.textContent = mfrName
            ? mfrName + '  (locked by season registration)'
            : 'Pick a team — manufacturer is locked by the season registration.';
        display.style.color = mfrName ? 'var(--text)' : 'var(--muted)';
    }
}

async function saveEntry(eventId, eventName, seasonId) {
    const d = getFormData('entity-form');
    if (!d.entry_team_id || !d.manufacturer_id || !d.car_model) {
        toast('Fill in all required fields.', 'error'); return;
    }
    const { error } = await sb.from('entries').insert({
        event_id: eventId,
        team_id: d.entry_team_id,

const DR_TO_ELO = { 'E': 800, 'D': 1100, 'C': 1300, 'B': 1500, 'A': 1700, 'A+': 1850, 'S': 2000 };

function drToElo(letter) {
    return DR_TO_ELO[letter] ?? 1500;
}

async function viewEventLobbies(eventId, eventName, seasonId) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading lobbies…</div>';

    const { data: entries, error } = await sb.from('entries')
        .select(`
            id, lobby_number, car_number, car_model, status,
            teams(name),
            manufacturers(name, brand_color),
            entry_drivers(driver_id, drivers(id, display_name, career_number, gt7_dr_rating))
        `)
        .eq('event_id', eventId);
    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    // Fetch current Elo for any driver in any entry
    const driverIds = Array.from(new Set((entries || []).flatMap(en => (en.entry_drivers || []).map(ed => ed.driver_id)))).filter(Boolean);
    const ratingMap = new Map();
    if (driverIds.length) {
        const { data: ratings } = await sb.from('driver_current_ratings')
            .select('driver_id, rating')
            .in('driver_id', driverIds);
        (ratings || []).forEach(r => ratingMap.set(r.driver_id, r.rating));
    }

    // Flatten to one row per driver. Two team-mates sharing an entry become
    // two rows in the same lobby (since lobby_number lives on the entry).
    const driverRows = [];
    (entries || []).forEach(en => {
        const drs = (en.entry_drivers || []).map(ed => ed.drivers).filter(Boolean);
        if (drs.length === 0) {
            driverRows.push({ entry: en, driver: null, skill: 1500 });
        } else {
            drs.forEach(d => {
                const skill = ratingMap.get(d.id) ?? drToElo(d.gt7_dr_rating);
                driverRows.push({ entry: en, driver: d, skill });
            });
        }
    });

    // Group by entry's lobby_number
    const groups = {};
    driverRows.forEach(row => {
        const key = row.entry.lobby_number ?? 0;
        (groups[key] = groups[key] || []).push(row);
    });
    const lobbyNumbers = Object.keys(groups).map(Number).sort((a, b) => {
        if (a === 0) return 1; if (b === 0) return -1; return a - b;
    });

    const totalDrivers = driverRows.length;

    const renderLobbyCard = (lobbyNum, list) => {
        const title = lobbyNum === 0 ? 'Unassigned' : `Lobby ${lobbyNum}`;
        const sorted = list.slice().sort((a, b) => b.skill - a.skill);
        const rows = sorted.map(({ entry: en, driver: d, skill }) => {
            const num = d?.career_number ?? en.car_number;
            const driverName = d ? esc(d.display_name) : '<em class="td-muted">No driver</em>';
            return `<tr>
                <td>${num != null ? '<strong>#' + num + '</strong>' : '<span class="td-muted">—</span>'}</td>
                <td><strong>${driverName}</strong></td>
                <td class="td-muted" style="font-size:0.78rem">${esc(en.teams?.name) || '<em>Solo</em>'}</td>
                <td class="td-muted" style="font-family:'Orbitron',sans-serif;font-size:0.78rem">${skill}</td>
                <td><div class="row-actions" style="gap:0.25rem;justify-content:flex-end">
                    <button class="btn-icon" title="Move entry to a lower lobby (faster split)"
                        onclick="moveEntryLobby('${en.id}',-1,'${eventId}','${esc(eventName)}','${seasonId}')">↑</button>
                    <button class="btn-icon" title="Move entry to a higher lobby (slower split)"
                        onclick="moveEntryLobby('${en.id}',1,'${eventId}','${esc(eventName)}','${seasonId}')">↓</button>
                    ${lobbyNum !== 0 ? `<button class="btn-icon" title="Unassign entry"
                        onclick="setEntryLobby('${en.id}',null,'${eventId}','${esc(eventName)}','${seasonId}')">×</button>` : ''}
                </div></td>
            </tr>`;
        }).join('');
        return `<div class="section-card" style="margin-bottom:1rem">
            <div class="section-card-header">
                <span class="section-card-title">${title} <span class="td-muted" style="font-weight:normal;font-size:0.78rem">· ${list.length} driver${list.length === 1 ? '' : 's'}</span></span>
            </div>
            <table><thead><tr>
                <th>Car</th><th>Driver</th><th>Team</th><th>Elo</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
    };

    const lobbyCardsHTML = totalDrivers === 0
        ? `<div class="empty-state">No entries yet — add them in the Entries panel first.</div>`
        : lobbyNumbers.map(n => renderLobbyCard(n, groups[n])).join('');

    panel.innerHTML = `
        <div class="section-card" style="margin-bottom:1rem">
            <div class="section-card-header">
                <span class="section-card-title">Lobbies — ${esc(eventName)}</span>
            </div>
            <div style="padding:1rem 1.25rem;display:flex;gap:0.85rem;align-items:flex-end;flex-wrap:wrap">
                <div class="form-group" style="margin:0;min-width:130px">
                    <label style="display:block;font-size:0.7rem;font-weight:600;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.35rem">Lobby size</label>
                    <input type="number" id="lobby-size" value="16" min="2" max="32" style="width:100%;padding:0.55rem 0.75rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.9rem">
                </div>
                <button class="btn btn-primary" onclick="autoAllocateLobbies('${eventId}','${esc(eventName)}','${seasonId}')">Auto-allocate</button>
                <button class="btn btn-ghost" onclick="clearAllLobbies('${eventId}','${esc(eventName)}','${seasonId}')">Clear All</button>
                <button class="btn btn-ghost" onclick="notifyLobbies('${eventId}','${esc(eventName)}','${seasonId}')">Notify Drivers</button>
                <button class="btn-icon danger" onclick="deleteLobbyNotifications('${eventId}','${esc(eventName)}','${seasonId}')">Delete Notifications</button>
                <div style="margin-left:auto;font-size:0.78rem;color:var(--muted)">Lobby size counts drivers. Sort uses each driver's Elo (DR-seeded if unrated).</div>
            </div>
        </div>
        ${lobbyCardsHTML}`;
}

async function autoAllocateLobbies(eventId, eventName, seasonId) {
    const sizeInput = document.getElementById('lobby-size');
    const lobbySize = Math.max(2, Math.min(32, parseInt(sizeInput?.value, 10) || 16));

    const { data: entries } = await sb.from('entries')
        .select(`id, car_number, entry_drivers(driver_id, drivers(career_number, gt7_dr_rating))`)
        .eq('event_id', eventId)
        .neq('status', 'withdrawn');
    if (!entries?.length) { toast('No entries to allocate.', 'error'); return; }

    const driverIds = Array.from(new Set(entries.flatMap(en => (en.entry_drivers || []).map(ed => ed.driver_id)))).filter(Boolean);
    const ratingMap = new Map();
    if (driverIds.length) {
        const { data: ratings } = await sb.from('driver_current_ratings')
            .select('driver_id, rating')
            .in('driver_id', driverIds);
        (ratings || []).forEach(r => ratingMap.set(r.driver_id, r.rating));
    }

    entries.forEach(en => {
        const drs = (en.entry_drivers || []).map(ed => {
            const e = ratingMap.get(ed.driver_id);
            return (e != null) ? e : drToElo(ed.drivers?.gt7_dr_rating);
        });
        en._skill = drs.length ? drs.reduce((a,b)=>a+b,0) / drs.length : 1500;
    });

    entries.sort((a, b) => b._skill - a._skill);

    // Pack into lobbies by driver count (lobbySize = drivers per lobby).
    // Team-mates always travel together because lobby_number is per entry;
    // if an entry would push the running lobby over capacity, it starts
    // the next lobby instead of splitting the team.
    let currentLobby = 1;
    let currentCount = 0;
    let totalDrivers = 0;
    let failures = 0;
    for (let i = 0; i < entries.length; i++) {
        const en = entries[i];
        const driversInEntry = Math.max(1, (en.entry_drivers || []).length);
        if (currentCount > 0 && currentCount + driversInEntry > lobbySize) {
            currentLobby++;
            currentCount = 0;
        }
        currentCount += driversInEntry;
        totalDrivers += driversInEntry;

        const payload = { lobby_number: currentLobby };
        if (en.car_number == null) {
            const firstDriver = (en.entry_drivers || []).find(ed => ed.drivers?.career_number != null);
            if (firstDriver) payload.car_number = firstDriver.drivers.career_number;
        }
        const { error } = await sb.from('entries').update(payload).eq('id', en.id);
        if (error) failures++;
    }
    const totalLobbies = currentLobby;
    toast(failures
        ? `Allocated with ${failures} failure(s).`
        : `${totalDrivers} driver${totalDrivers === 1 ? '' : 's'} split across ${totalLobbies} lobb${totalLobbies === 1 ? 'y' : 'ies'}.`, failures ? 'error' : 'success');
    await viewEventLobbies(eventId, eventName, seasonId);
}

function parseLapTime(s) {
    if (!s) return null;
    s = String(s).trim();
    if (!s) return null;
    const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
    if (!m) return null;
    const min = parseInt(m[1] || '0', 10);
    const sec = parseFloat(m[2]);
    return Math.round((min * 60 + sec) * 1000);
}

function fmtLapTime(ms) {
    if (ms == null || ms === '') return '';
    const totalSec = ms / 1000;
    const min = Math.floor(totalSec / 60);
    const sec = (totalSec - min * 60).toFixed(3).padStart(6, '0');
    return min > 0 ? `${min}:${sec}` : sec;
}

function buildLobbyFilter(entries, currentLobby, onChangeFn) {
    const lobbies = [...new Set(entries.map(e => e.lobby_number).filter(n => n != null))].sort((a, b) => a - b);
    const hasUnassigned = entries.some(e => e.lobby_number == null);
    const opts = [];
    opts.push(`<option value="all">All Lobbies (${entries.length})</option>`);
    lobbies.forEach(n => {
        const count = entries.filter(e => e.lobby_number === n).length;
        opts.push(`<option value="${n}" ${currentLobby == n ? 'selected' : ''}>Lobby ${n} (${count})</option>`);
    });
    if (hasUnassigned) {
        const count = entries.filter(e => e.lobby_number == null).length;
        opts.push(`<option value="unassigned" ${currentLobby === 'unassigned' ? 'selected' : ''}>Unassigned (${count})</option>`);
    }
    return `<select id="lobby-filter" onchange="${onChangeFn}" style="padding:0.45rem 0.7rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.85rem;font-family:'Orbitron',sans-serif;letter-spacing:0.05em">${opts.join('')}</select>`;
}

function filterEntriesByLobby(entries, lobbyFilter) {
    if (lobbyFilter === 'all' || lobbyFilter == null) return entries;
    if (lobbyFilter === 'unassigned') return entries.filter(e => e.lobby_number == null);
    const n = parseInt(lobbyFilter);
    return entries.filter(e => e.lobby_number === n);
}

function defaultLobbyFilter(entries) {
    const lobbies = [...new Set(entries.map(e => e.lobby_number).filter(n => n != null))].sort((a, b) => a - b);
    if (lobbies.length) return lobbies[0].toString();
    return 'all';
}

async function viewEventQualifying(eventId, eventName, lobbyFilter) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading qualifying…</div>';

    const [entriesRes, quailRes] = await Promise.all([
        sb.from('entries')
            .select('id, car_number, car_model, lobby_number, teams(name), entry_drivers(driver_id, drivers(id, display_name, career_number))')
            .eq('event_id', eventId)
            .order('lobby_number')
            .order('car_number'),
        sb.from('qualifying_results').select('*').eq('event_id', eventId),
    ]);
    if (entriesRes.error) { panel.innerHTML = `<div class="loading-state">${esc(entriesRes.error.message)}</div>`; return; }

    const allEntries = entriesRes.data || [];
    const quails     = quailRes.data || [];
    const qKey       = (entryId, driverId) => `${entryId}|${driverId || ''}`;
    const qMap       = Object.fromEntries(quails.map(q => [qKey(q.entry_id, q.driver_id), q]));

    if (allEntries.length === 0) {
        panel.innerHTML = `
            <div class="section-card">
                <div class="section-card-header"><span class="section-card-title">Qualifying — ${esc(eventName)}</span></div>
                <div class="empty-state">Add entries first before recording qualifying.</div>
            </div>`;
        return;
    }

    const currentLobby = lobbyFilter || defaultLobbyFilter(allEntries);
    const entries = filterEntriesByLobby(allEntries, currentLobby);

    const rowSpecs = entries.flatMap(en => {
        const drvs = (en.entry_drivers || []).map(ed => ed.drivers).filter(Boolean);
        if (!drvs.length) return [{ entry: en, driver: null }];
        return drvs.map(d => ({ entry: en, driver: d }));
    });

    const rows = rowSpecs.length === 0
        ? `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:2rem">No drivers in this lobby yet.</td></tr>`
        : rowSpecs.map(({ entry: en, driver: d }) => {
            const q = qMap[qKey(en.id, d?.id)] || {};
            const carLabel = en.car_number != null ? '#' + en.car_number : '—';
            const driverLabel = d
                ? `<strong>${esc(d.display_name)}</strong>${d.career_number ? ` <span class="td-muted">#${d.career_number}</span>` : ''}`
                : '<em class="td-muted">No drivers</em>';
            const dAttr = d ? `data-driver="${esc(d.id)}"` : '';
            return `<tr>
                <td>${driverLabel}<br><span class="td-muted" style="font-size:0.78rem">${carLabel} ${esc(en.teams?.name) || '<em>Solo</em>'}${en.lobby_number != null ? ` · L${en.lobby_number}` : ''}</span></td>
                <td><input type="number" min="1" max="99" data-entry="${en.id}" ${dAttr} data-field="position" value="${q.position || ''}" style="width:70px;padding:0.4rem 0.5rem" ${d ? '' : 'disabled'}></td>
                <td><input type="text" placeholder="1:23.456" data-entry="${en.id}" ${dAttr} data-field="best_lap" value="${q.best_lap_ms ? fmtLapTime(q.best_lap_ms) : ''}" style="width:120px;padding:0.4rem 0.5rem;font-family:'Orbitron',sans-serif;font-size:0.82rem" ${d ? '' : 'disabled'}></td>
                <td><input type="text" data-entry="${en.id}" ${dAttr} data-field="notes" value="${esc(q.notes || '')}" placeholder="—" style="padding:0.4rem 0.5rem" ${d ? '' : 'disabled'}></td>
            </tr>`;
        }).join('');

    const filterSelect = buildLobbyFilter(allEntries, currentLobby,
        `viewEventQualifying('${eventId}','${esc(eventName)}', this.value)`);

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Qualifying — ${esc(eventName)}</span>
                <div style="display:flex;gap:0.5rem;align-items:center">
                    ${filterSelect}
                    <button class="btn-add" onclick="saveQualifying('${eventId}','${esc(eventName)}')">Save All</button>
                </div>
            </div>
            <table id="qualifying-table"><thead><tr>
                <th>Driver</th><th>Pos</th><th>Best Lap</th><th>Notes</th>
            </tr></thead><tbody>${rows}</tbody></table>
            <div style="padding:0.85rem 1.25rem;font-size:0.78rem;color:var(--muted);border-top:1px solid var(--border)">
                Pick a lobby to record qualifying lap by lap. Save All persists the current view.
            </div>
        </div>`;
}

async function saveQualifying(eventId, eventName) {
    const inputs = document.querySelectorAll('#qualifying-table input[data-entry][data-driver]');
    const map = {};
    let bad = false;
    inputs.forEach(inp => {
        const entryId  = inp.dataset.entry;
        const driverId = inp.dataset.driver;
        const key = `${entryId}|${driverId}`;
        map[key] = map[key] || { entry_id: entryId, driver_id: driverId, event_id: eventId };
        const field = inp.dataset.field;
        if (field === 'position') {
            map[key].position = inp.value ? parseInt(inp.value) : null;
        } else if (field === 'best_lap') {
            if (inp.value.trim()) {
                const ms = parseLapTime(inp.value);
                if (ms == null) { toast(`Invalid lap time: "${inp.value}"`, 'error'); bad = true; }
                map[key].best_lap_ms = ms;
            } else {
                map[key].best_lap_ms = null;
            }
        } else if (field === 'notes') {
            map[key].notes = inp.value.trim() || null;
        }
    });
    if (bad) return;

    const rowsToConsider = Object.values(map);
    const toUpsert = rowsToConsider.filter(r => r.position != null || r.best_lap_ms != null || r.notes);
    const toDelete = rowsToConsider.filter(r => r.position == null && r.best_lap_ms == null && !r.notes);

    // Delete cleared rows
    for (const r of toDelete) {
        await sb.from('qualifying_results')
            .delete()
            .eq('event_id', eventId)
            .eq('entry_id', r.entry_id)
            .eq('driver_id', r.driver_id);
    }
    if (toUpsert.length) {
        const { error } = await sb.from('qualifying_results').upsert(toUpsert, { onConflict: 'event_id,entry_id,driver_id' });
        if (error) { toast(error.message, 'error'); return; }
    }
    toast('Qualifying saved.', 'success');
    const currentLobby = document.getElementById('lobby-filter')?.value;
    await viewEventQualifying(eventId, eventName, currentLobby);
