<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --bg-3: #171d27;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --cyan: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
            --sidebar-w: 220px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            line-height: 1.5;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 20;
        }
        .sidebar-logo {
            padding: 1.5rem 1.25rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo .brand {
            font-family: 'Anton', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text);
            text-indent: 0.28em;
        }
        .sidebar-logo .brand span { color: var(--gold); }
        .sidebar-logo .sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.2rem;
            text-indent: 0.35em;
        }
        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }
        .nav-section {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.85rem 1.25rem 0.4rem;
            text-indent: 0.35em;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 1.25rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.15s, background 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: var(--gold); background: rgba(255,209,102,0.08); }
        .nav-link.active svg { color: var(--gold); }
        .sidebar-bottom {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
        }
        .user-chip {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-logout {
            width: 100%;
            padding: 0.55rem 0.85rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-logout:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* ===== MAIN ===== */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(5,6,8,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        .page-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-add:hover { filter: brightness(1.08); }
        .btn-add svg { width: 14px; height: 14px; }
        .content {
            flex: 1;
            padding: 2rem;
        }

        /* ===== STAT CARDS ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .stat-card-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-indent: 0.2em;
        }
        .stat-card-value {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            line-height: 1;
            background: linear-gradient(180deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== TABLE ===== */
        .table-wrap {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }
        .table-search {
            flex: 1;
            max-width: 280px;
            padding: 0.5rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .table-search:focus { border-color: rgba(255,209,102,0.4); }
        .table-search::placeholder { color: var(--muted); opacity: 0.6; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            padding: 0.7rem 1.25rem;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .td-muted { color: var(--muted); font-size: 0.82rem; }
        .color-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-muted { background: rgba(255,255,255,0.06); color: var(--muted); }
        .badge-gold  { background: rgba(255,209,102,0.15); color: var(--gold); }
        .row-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }
        .btn-icon {
            padding: 0.35rem 0.65rem;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .btn-icon:hover { color: var(--text); border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
        .btn-icon.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); }
        .empty-state {
            padding: 3rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .loading-state {
            padding: 2rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 1.15rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        label .required { color: var(--gold); margin-left: 2px; }
        input[type="text"], input[type="email"], input[type="number"],
        input[type="date"], input[type="color"], input[type="url"],
        select, textarea {
            display: block;
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="color"] { padding: 0.35rem; height: 38px; cursor: pointer; }
        input:focus, select:focus, textarea:focus { border-color: rgba(255,209,102,0.5); }
        input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.6; }
        select option { background: var(--bg-2); }
        textarea { resize: vertical; min-height: 80px; }
        .form-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }
        .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .form-check span { font-size: 0.88rem; color: var(--text); font-weight: 400; letter-spacing: 0; text-transform: none; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: filter 0.15s, background 0.15s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .btn-danger {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); }

        /* ===== SEASON TEAMS sub-section ===== */
        .section-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 1.5rem;
            overflow: hidden;
        }
        .section-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
        }
        .section-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            text-indent: 0.25em;
        }

        /* ===== TOASTS ===== */
        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            pointer-events: none;
        }
        .toast {
            padding: 0.8rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            max-width: 340px;
            pointer-events: auto;
            animation: toast-in 0.25s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: none; }
        }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .toast.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .toast.info    { background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.3); color: #7dd3fc; }

        /* ===== CONFIRM BANNER ===== */
        .confirm-banner {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .confirm-banner.open { display: block; }
        .confirm-banner p { font-size: 0.85rem; color: #fca5a5; margin-bottom: 0.65rem; }
        .confirm-banner .confirm-btns { display: flex; gap: 0.5rem; }

        /* ===== AUTH LOADING ===== */
        #auth-loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--muted);
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main { margin-left: 0; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="auth-loading">Authenticating…</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="brand">Gran Turismo<span> GTEC</span></div>
        <div class="sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">Overview</div>
        <button class="nav-link" data-section="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard

        <div class="nav-section">Championship</div>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>

        </button>

            News
        </button>
        <button class="nav-link" data-section="media">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>

        </button>
        <button class="nav-link" data-section="pages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Pages
        </button>
    </nav>
    <div class="sidebar-bottom">
        <div class="user-chip" id="user-email">—</div>
        <button class="btn-logout" id="btn-logout">Sign out</button>
    </div>
</aside>

<!-- Main -->
<div class="main">
    <header class="topbar">
        <div class="page-title" id="page-title">Dashboard</div>
        <button class="btn-add" id="btn-add" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add
        </button>
    </header>
    <div class="content" id="content">
        <!-- dynamic -->
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
        <div class="modal-header">
            <div class="modal-title" id="modal-title"></div>
            <button class="modal-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
    </div>
</div>

<!-- Toasts -->
<div class="toast-container" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';

// ============================================================
// 1. Init
// ============================================================
const { createClient } = window.supabase;
const cfg = window.GTEC_CONFIG;
const sb  = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

let currentUser  = null;
let currentSection = 'dashboard';

// Cached data for dropdowns
let _manufacturers = [];
let _seasons       = [];
let _teams         = [];
let _pointsSystems = [];
let _drivers       = [];


// ============================================================
// 2. Auth guard
// ============================================================
async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        window.location.replace('./login.html');
        return;
    }
    currentUser = session.user;

    const { data: role } = await sb.from('user_roles')
        .select('role')
        .eq('user_id', currentUser.id)
        .eq('role', 'admin')
        .maybeSingle();

    if (!role) {
        await sb.auth.signOut();
        window.location.replace('./login.html');
        return;
    }

    document.getElementById('user-email').textContent = currentUser.email;
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('sidebar').style.transform = '';
    document.getElementById('sidebar').style.display = '';

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.replace('./login.html');
    });

    setupNav();
    await navigate('dashboard');
}


// ============================================================
// 3. Router & nav
// ============================================================
function setupNav() {
    document.querySelectorAll('.nav-link[data-section]').forEach(btn => {
        btn.addEventListener('click', () => navigate(btn.dataset.section));
    });

    // Hash routing
    window.addEventListener('hashchange', () => {
        const sec = window.location.hash.replace('#', '') || 'dashboard';
        navigate(sec, false);
    });
    const hash = window.location.hash.replace('#', '');
    if (hash && hash !== 'dashboard') navigate(hash, false);
}

async function navigate(section, pushHash = true) {
    currentSection = section;
    if (pushHash) window.location.hash = section;

    document.querySelectorAll('.nav-link').forEach(b => b.classList.toggle('active', b.dataset.section === section));

    const titles = {
        dashboard: 'Dashboard',
        manufacturers: 'Manufacturers',
        seasons: 'Seasons',
        teams: 'Teams',
        drivers: 'Drivers',
        events: 'Events',
        news: 'News',
        media: 'Media',
        pages: 'Pages',
    };
    document.getElementById('page-title').textContent = titles[section] || section;

    const addBtn = document.getElementById('btn-add');
    if (section === 'dashboard' || section === 'pages') {
        addBtn.style.display = 'none';
    } else {
        addBtn.style.display = '';
        addBtn.onclick = () => openAddModal(section);
    }

    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading-state">Loading…</div>';

    await Promise.all([loadCache()]);

    switch (section) {
        case 'dashboard':    await renderDashboard(); break;
        case 'manufacturers': await renderManufacturers(); break;
        case 'seasons':      await renderSeasons(); break;
        case 'teams':        await renderTeams(); break;
        case 'drivers':      await renderDrivers(); break;
        case 'events':       await renderEvents(); break;
        case 'news':         await renderNews(); break;
        case 'media':        await renderMedia(); break;
        case 'pages':        await renderPages(); break;
    }
}


// ============================================================
// 4. Dropdown caches
// ============================================================
async function loadCache() {
    const [mfr, ps, tm, dr, seas] = await Promise.all([
        sb.from('manufacturers').select('id,name,slug').order('name'),
        sb.from('points_systems').select('id,name').order('name'),
        sb.from('teams').select('id,name,slug').order('name'),
        sb.from('drivers').select('id,display_name,slug').order('display_name'),
        sb.from('seasons').select('id,name,year').order('year', { ascending: false }),
    ]);
    _manufacturers = mfr.data  || [];
    _pointsSystems = ps.data   || [];
    _teams         = tm.data   || [];
    _drivers       = dr.data   || [];
    _seasons       = seas.data || [];
}


// ============================================================
// 5. UI helpers
// ============================================================
function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function openModal(title, bodyHTML, footerHTML) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHTML;
    document.getElementById('modal-footer').innerHTML = footerHTML;
    document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function slugify(str) {
    return str.toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
}

function selectHTML(id, options, selected = '', emptyLabel = '— Select —') {
    const opts = options.map(o =>
        `<option value="${esc(o.value)}" ${o.value === selected ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="${id}" name="${id}"><option value="">${emptyLabel}</option>${opts}</select>`;
}

function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getFormData(formId) {
    const form = document.getElementById(formId);
    const data = {};
    form.querySelectorAll('[name]').forEach(el => {
        if (el.type === 'checkbox') data[el.name] = el.checked;
        else data[el.name] = el.value || null;
    });
    return data;
}

// 7. Manufacturers
// ============================================================
async function renderManufacturers() {
    const { data, error } = await sb.from('manufacturers').select('*').order('name');
    if (error) { toast(error.message, 'error'); return; }

    const rows = data.length === 0 ? `<tr><td colspan="5"><div class="empty-state">No manufacturers yet — add one to get started.</div></td></tr>` :
        data.map(m => `
            <tr>
                <td><strong>${esc(m.name)}</strong></td>
                <td class="td-muted">${esc(m.slug)}</td>
                <td class="td-muted">${esc(m.country) || '—'}</td>
                <td>${m.brand_color ? `<div class="color-swatch"><div class="swatch" style="background:${esc(m.brand_color)}"></div>${esc(m.brand_color)}</div>` : '<span class="td-muted">—</span>'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editManufacturer('${m.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteManufacturer('${m.id}','${esc(m.name)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search manufacturers…" oninput="filterTable(this,'mfr-table')">
            </div>
            <table id="mfr-table"><thead><tr>
                <th>Name</th><th>Slug</th><th>Country</th><th>Brand Colour</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

function mfrForm(m = {}) {
    return `<form id="entity-form">
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="name" value="${esc(m.name)}" placeholder="BMW" required oninput="autoSlug(this,'name','slug')">
            </div>
            <div class="form-group">
                <label>Slug <span class="required">*</span></label>
                <input type="text" name="slug" id="slug" value="${esc(m.slug)}" placeholder="bmw" required>
                <div class="form-hint">Auto-generated · editable</div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Country</label>
                <input type="text" name="country" value="${esc(m.country)}" placeholder="Germany">
            </div>
            <div class="form-group">
                <label>Brand Colour</label>
                <input type="color" name="brand_color" value="${m.brand_color || '#ffffff'}">
            </div>
        </div>
        <div class="form-group">
            <label>Logo URL</label>
            <input type="url" name="logo_url" value="${esc(m.logo_url)}" placeholder="https://…">
            <div class="form-hint">Supabase Storage URL — optional for now</div>
        </div>
    </form>`;
}

function openAddModal(section) {
    const map = {
        manufacturers: () => openManufacturerModal(),
        seasons:       () => openSeasonModal(),
        teams:         () => openTeamModal(),
        drivers:       () => openDriverModal(),
        events:        () => openEventModal(),
        news:          () => openNewsModal(),
        media:         () => openMediaModal(),
    };
    map[section]?.();
}

function openManufacturerModal(m = {}) {
    openModal(m.id ? 'Edit Manufacturer' : 'Add Manufacturer', mfrForm(m), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveManufacturer('${m.id || ''}')">Save</button>
    `);
}

async function editManufacturer(id) {
    const { data } = await sb.from('manufacturers').select('*').eq('id', id).single();
    openManufacturerModal(data);
}

async function saveManufacturer(id) {
    const d = getFormData('entity-form');
    if (!d.name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const payload = { name: d.name, slug: d.slug, country: d.country, brand_color: d.brand_color, logo_url: d.logo_url };
    const { error } = id
        ? await sb.from('manufacturers').update(payload).eq('id', id)
        : await sb.from('manufacturers').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Manufacturer updated.' : 'Manufacturer added.', 'success');
    closeModal();
    await renderManufacturers();
    await loadCache();
}

async function deleteManufacturer(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    const { error } = await sb.from('manufacturers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Manufacturer deleted.', 'success');
    await renderManufacturers();
    await loadCache();
}

        </div>

function openSeasonModal(s = {}) {
    openModal(s.id ? 'Edit Season' : 'Add Season', seasonForm(s), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveSeason('${s.id || ''}')">Save</button>
    `);
}

async function editSeason(id) {
    const { data } = await sb.from('seasons').select('*').eq('id', id).single();
    openSeasonModal(data);
}

async function saveSeason(id) {
    const d = getFormData('entity-form');
    if (!d.year || !d.name || !d.slug || !d.points_system_id || !d.starts_on || !d.ends_on) {
        toast('Fill in all required fields.', 'error'); return;
    }
    const payload = {
        year: parseInt(d.year), name: d.name, slug: d.slug,
        starts_on: d.starts_on, ends_on: d.ends_on,
        points_system_id: d.points_system_id,
        is_active: !!d.is_active,
        description: d.description,
    };
    const { error } = id
        ? await sb.from('seasons').update(payload).eq('id', id)
        : await sb.from('seasons').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Season updated.' : 'Season created.', 'success');
    closeModal();
    await renderSeasons();
    await loadCache();
}

async function deleteSeason(id, name) {
    if (!confirm(`Delete "${name}"? This will cascade-delete all related events, entries, and results.`)) return;
    const { error } = await sb.from('seasons').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Season deleted.', 'success');
    await renderSeasons();
    await loadCache();
}

// ---- Season → Team registrations (team_seasons) ----
async function viewSeasonTeams(seasonId, seasonName) {
    const panel = document.getElementById('season-teams-panel');
    panel.innerHTML = '<div class="loading-state">Loading registrations…</div>';

    const { data, error } = await sb.from('team_seasons')
        .select('*, teams(name), manufacturers(name,brand_color)')
        .eq('season_id', seasonId)
        .order('registered_at');

    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    const rows = data.length === 0 ? `<tr><td colspan="4"><div class="empty-state">No teams registered for this season yet.</div></td></tr>` :
        data.map(ts => `
            <tr>
                <td><strong>${esc(ts.teams?.name)}</strong></td>
                <td>
                    ${ts.manufacturers?.brand_color ? `<div class="color-swatch"><div class="swatch" style="background:${esc(ts.manufacturers.brand_color)}"></div></div>` : ''}
                    ${esc(ts.manufacturers?.name) || '—'}
                </td>
                <td class="td-muted">${ts.registered_at ? ts.registered_at.slice(0,10) : '—'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon danger" onclick="removeTeamSeason('${ts.id}')">Remove</button>
                </div></td>
            </tr>`).join('');

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Team Registrations — ${esc(seasonName)}</span>
                <button class="btn-add" onclick="openRegisterTeamModal('${seasonId}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Register Team
                </button>
            </div>
            <table><thead><tr>
                <th>Team</th><th>Manufacturer (locked)</th><th>Registered</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

function openRegisterTeamModal(seasonId) {
    const teamOpts = _teams.map(t => ({ value: t.id, label: t.name }));
    const mfrOpts  = _manufacturers.map(m => ({ value: m.id, label: m.name }));
    openModal('Register Team for Season',
        `<form id="entity-form">
            <div class="form-group">
                <label>Team <span class="required">*</span></label>
                ${selectHTML('team_id', teamOpts)}
            </div>
            <div class="form-group">
                <label>Manufacturer (season-locked) <span class="required">*</span></label>
                ${selectHTML('manufacturer_id', mfrOpts)}
                <div class="form-hint">This locks the team to this manufacturer for the entire season.</div>
            </div>
            <input type="hidden" name="season_id" value="${seasonId}">
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="registerTeamForSeason('${seasonId}')">Register</button>`
    );
}

async function registerTeamForSeason(seasonId) {
    const d = getFormData('entity-form');
    if (!d.team_id || !d.manufacturer_id) { toast('Select a team and manufacturer.', 'error'); return; }
    const { error } = await sb.from('team_seasons').insert({
        team_id: d.team_id, season_id: seasonId, manufacturer_id: d.manufacturer_id
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Team registered for season.', 'success');
    closeModal();
    const { data: s } = await sb.from('seasons').select('name').eq('id', seasonId).single();
    await viewSeasonTeams(seasonId, s?.name || '');
}

async function removeTeamSeason(id) {
    if (!confirm('Remove this team from the season?')) return;
    const { error } = await sb.from('team_seasons').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Registration removed.', 'success');
    // Re-render the panel — find the season_id from the existing panel context
    const btn = document.querySelector(`[onclick="removeTeamSeason('${id}')"]`);
    const panel = document.getElementById('season-teams-panel');
    const headerTitle = panel.querySelector('.section-card-title')?.textContent || '';
    const seasonName = headerTitle.replace('Team Registrations — ', '');
    // Re-fetch to re-render
    const { data } = await sb.from('seasons').select('id').eq('name', seasonName).maybeSingle();
    if (data) await viewSeasonTeams(data.id, seasonName);
}

function formatDatetime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function toDatetimeLocal(iso) {
    if (!iso) return '';
    return iso.slice(0, 16);
}

function autoFillEndsAt() {
    const starts = document.getElementById('ev-starts')?.value;
    const hours  = parseFloat(document.getElementById('ev-duration')?.value);
    const endsEl = document.getElementById('ev-ends');
    if (!starts || !hours || !endsEl) return;
    const ms = new Date(starts).getTime() + hours * 3600 * 1000;
    if (!isNaN(ms)) endsEl.value = toDatetimeLocal(new Date(ms).toISOString());
}

function parseLapTime(s) {
    if (!s) return null;
    s = String(s).trim();
    if (!s) return null;
    const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
    if (!m) return null;
    const min = parseInt(m[1] || '0', 10);
    const sec = parseFloat(m[2]);
    return Math.round((min * 60 + sec) * 1000);
}

function fmtLapTime(ms) {
    if (ms == null || ms === '') return '';
    const totalSec = ms / 1000;
    const min = Math.floor(totalSec / 60);
    const sec = (totalSec - min * 60).toFixed(3).padStart(6, '0');
    return min > 0 ? `${min}:${sec}` : sec;
}

            <td><input type="text" data-entry="${en.id}" data-field="notes" value="${esc(q.notes || '')}" placeholder="—" style="padding:0.4rem 0.5rem"></td>

        </div>`;

async function saveQualifying(eventId, eventName) {
    const inputs = document.querySelectorAll('#qualifying-table input[data-entry]');
    const map = {};
    let bad = false;
    inputs.forEach(inp => {
        const id = inp.dataset.entry;
        map[id] = map[id] || { entry_id: id, event_id: eventId };
        const field = inp.dataset.field;
        if (field === 'position') {
            map[id].position = inp.value ? parseInt(inp.value) : null;
        } else if (field === 'best_lap') {
            if (inp.value.trim()) {
                const ms = parseLapTime(inp.value);
                if (ms == null) { toast(`Invalid lap time: "${inp.value}"`, 'error'); bad = true; }
                map[id].best_lap_ms = ms;
            } else {
                map[id].best_lap_ms = null;
            }
        } else if (field === 'notes') {
            map[id].notes = inp.value.trim() || null;
        }
    });
    if (bad) return;

    const toUpsert = Object.values(map).filter(r => r.position != null || r.best_lap_ms != null || r.notes);
    const toDelete = Object.values(map).filter(r => r.position == null && r.best_lap_ms == null && !r.notes);

    // Delete cleared rows
    for (const r of toDelete) {
        await sb.from('qualifying_results').delete().eq('event_id', eventId).eq('entry_id', r.entry_id);
    }
    if (toUpsert.length) {
        const { error } = await sb.from('qualifying_results').upsert(toUpsert, { onConflict: 'event_id,entry_id' });
        if (error) { toast(error.message, 'error'); return; }
    }
    toast('Qualifying saved.', 'success');
    await viewEventQualifying(eventId, eventName);
}

            <div style="padding:0.85rem 1.25rem;font-size:0.78rem;color:var(--muted);border-top:1px solid var(--border)">
                Points are auto-recomputed on save from the season's points system. Pole/FL bonuses apply only to ticked entries.
            </div>
        </div>`;
}

async function saveResults(eventId, eventName) {
    const rowInputs = document.querySelectorAll('#results-table [data-entry]');
    const map = {};
    rowInputs.forEach(inp => {
        const id = inp.dataset.entry;
        map[id] = map[id] || { entry_id: id, event_id: eventId };
        const f = inp.dataset.field;
        if (inp.type === 'checkbox') {
            map[id][f] = inp.checked;
        } else if (f === 'finish_position') {
            map[id][f] = inp.value ? parseInt(inp.value) : null;
        } else if (f === 'laps_completed') {
            map[id][f] = inp.value ? parseInt(inp.value) : 0;
        } else if (f === 'dnf_reason') {
            map[id][f] = inp.value.trim() || null;
        } else {
            map[id][f] = inp.value || null;
        }
    });

    // Pole guard: only one pole per event
    const poles = Object.values(map).filter(r => r.pole_point);
    if (poles.length > 1) { toast('Only one entry can have the pole point.', 'error'); return; }
    const fls = Object.values(map).filter(r => r.fastest_lap_point);
    if (fls.length > 1) { toast('Only one entry can have the fastest lap point.', 'error'); return; }

    const rows = Object.values(map);
    const { error } = await sb.from('results').upsert(rows, { onConflict: 'event_id,entry_id' });
    if (error) { toast(error.message, 'error'); return; }

    // Recompute points
    const { data: cp, error: cpErr } = await sb.rpc('compute_event_points', { p_event_id: eventId });
    if (cpErr) { toast('Saved, but points recompute failed: ' + cpErr.message, 'error'); }
    else if (cp?.error) { toast('Saved, but points recompute failed: ' + cp.error, 'error'); }
    else toast('Results saved & points recomputed.', 'success');

    await viewEventResults(eventId, eventName);
}

async function savePenalty(eventId, eventName) {
    const d = getFormData('entity-form');
    if (!d.entry_id || !d.penalty_type || !d.reason) {
        toast('Entry, type and reason are required.', 'error'); return;
    }
    const { error } = await sb.from('penalties').insert({
        event_id: eventId,
        entry_id: d.entry_id,
        driver_id: d.driver_id || null,
        penalty_type: d.penalty_type,
        penalty_value: d.penalty_value || null,
        reason: d.reason,
        issued_by: currentUser.id,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Penalty added.', 'success');
    closeModal();
    await viewEventPenalties(eventId, eventName);
}

async function deletePenalty(id, eventId, eventName) {
    if (!confirm('Delete this penalty?')) return;
    const { error } = await sb.from('penalties').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Penalty deleted.', 'success');
    await viewEventPenalties(eventId, eventName);
}


// ============================================================
// 11b. News
// ============================================================
async function renderNews() {
    const { data, error } = await sb.from('news')
        .select('id, title, slug, author, is_published, published_at, created_at')
        .order('created_at', { ascending: false });
    if (error) { toast(error.message, 'error'); return; }

    const rows = !data?.length
        ? `<tr><td colspan="5"><div class="empty-state">No articles yet. Use the Add button to write the first one.</div></td></tr>`
        : data.map(n => `
            <tr>
                <td>
                    <strong>${esc(n.title)}</strong>
                    <br><small class="td-muted">/endurance/news/?slug=${esc(n.slug)}</small>
                </td>
                <td class="td-muted">${esc(n.author) || '—'}</td>
                <td><span class="badge ${n.is_published ? 'badge-green' : 'badge-muted'}">${n.is_published ? 'Published' : 'Draft'}</span></td>
                <td class="td-muted">${n.published_at ? n.published_at.slice(0,10) : '—'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editNews('${n.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteNews('${n.id}','${esc(n.title)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search articles…" oninput="filterTable(this,'news-table')">
            </div>
            <table id="news-table"><thead><tr>
                <th>Title / Slug</th><th>Author</th><th>Status</th><th>Published</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

function newsForm(n = {}) {
    return `<form id="entity-form">
        <div class="form-group">
            <label>Title <span class="required">*</span></label>
            <input type="text" name="title" id="news-title" value="${esc(n.title)}" placeholder="Race Report: Round 1" required
                oninput="autoSlug(this,'title','news-slug')">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Slug <span class="required">*</span></label>
                <input type="text" name="slug" id="news-slug" value="${esc(n.slug)}" placeholder="race-report-round-1" required>
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" name="author" value="${esc(n.author)}" placeholder="GTEC Admin">
            </div>
        </div>
        <div class="form-group">
            <label>Excerpt</label>
            <input type="text" name="excerpt" value="${esc(n.excerpt)}" placeholder="Short teaser shown in article listings…">
        </div>
        <div class="form-group">
            <label>Cover Image URL</label>
            <input type="url" name="cover_url" value="${esc(n.cover_url)}" placeholder="https://…">
        </div>
        <div class="form-group">
            <label>Body <span class="required">*</span></label>
            <textarea name="body" rows="12" placeholder="Article content — HTML supported (&lt;p&gt;, &lt;h2&gt;, &lt;strong&gt;, &lt;ul&gt;, etc.)" style="font-family:monospace;font-size:0.78rem">${esc(n.body)}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Publish Date</label>
                <input type="datetime-local" name="published_at" value="${n.published_at ? n.published_at.slice(0,16) : ''}">
            </div>
            <div class="form-group" style="align-self:flex-end;padding-bottom:0.6rem">
                <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer">
                    <input type="checkbox" name="is_published" id="news-pub-cb" ${n.is_published ? 'checked' : ''} style="width:auto;margin:0">
                    Published (visible on site)
                </label>
            </div>
        </div>
    </form>`;
}

function openNewsModal(n = {}) {
    openModal(n.id ? 'Edit Article' : 'New Article', newsForm(n), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveNews('${n.id || ''}')">Save</button>
    `);
}

async function editNews(id) {
    const { data } = await sb.from('news').select('*').eq('id', id).single();
    if (data) openNewsModal(data);
}

async function saveNews(id) {
    const d = getFormData('entity-form');
    if (!d.title || !d.slug) { toast('Title and slug are required.', 'error'); return; }
    const isPublished = !!document.getElementById('news-pub-cb')?.checked;
    const payload = {
        title: d.title,
        slug: d.slug,
        author: d.author || null,
        excerpt: d.excerpt || null,
        cover_url: d.cover_url || null,
        body: d.body || '',
        is_published: isPublished,
        published_at: d.published_at ? new Date(d.published_at).toISOString() : null,
        updated_at: new Date().toISOString(),
    };
    const { error } = id
        ? await sb.from('news').update(payload).eq('id', id)
        : await sb.from('news').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Article updated.' : 'Article created.', 'success');
    closeModal();
    await renderNews();
}

async function deleteNews(id, title) {
    if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
    const { error } = await sb.from('news').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Article deleted.', 'success');
    await renderNews();
}


// ============================================================
// 11c. Media
// ============================================================
async function renderMedia() {
    const { data, error } = await sb.from('media_items')
        .select('*, events(name)')
        .order('created_at', { ascending: false });
    if (error) { toast(error.message, 'error'); return; }

    const grid = !data?.length
        ? `<div class="empty-state" style="grid-column:1/-1">No media yet. Upload the first image with the Add button.</div>`
        : data.map(m => `
            <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative">
                <img src="${esc(m.url)}" alt="${esc(m.title) || 'Media'}"
                    style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block"
                    onerror="this.style.minHeight='80px';this.alt='(load failed)'">
                <div style="padding:0.55rem 0.75rem">
                    <div style="font-size:0.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.title) || '—'}</div>
                    ${m.caption ? `<div style="font-size:0.7rem;color:var(--muted);margin-top:0.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.caption)}</div>` : ''}
                    ${m.events?.name ? `<div style="font-size:0.68rem;color:var(--gold);margin-top:0.2rem">${esc(m.events.name)}</div>` : ''}
                </div>
                <button class="btn-icon danger" style="position:absolute;top:0.4rem;right:0.4rem;background:rgba(0,0,0,0.75);border-radius:4px;padding:0.2rem 0.4rem;font-size:0.7rem"
                    onclick="deleteMedia('${m.id}')">✕</button>
            </div>`).join('');

    document.getElementById('content').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem">
            ${grid}
        </div>`;
}

function openMediaModal() {
    const evtOpts = '<option value="">— No event —</option>' +
        _seasons.map(s => `<option disabled style="color:var(--muted)">── ${esc(s.name)} ──</option>`).join('');
    openModal('Upload Media', `
        <form id="entity-form">
            <div class="form-group">
                <label>Image File <span class="required">*</span></label>
                <input type="file" id="media-file" accept="image/*" required style="padding:0.4rem 0">
                <div class="form-hint">Uploads to Supabase Storage (gtec-media bucket). Max 50 MB.</div>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Race Start — Round 1">
            </div>
            <div class="form-group">
                <label>Caption</label>
                <input type="text" name="caption" placeholder="Optional short caption">
            </div>
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="saveMedia()">Upload</button>`
    );
}

async function saveMedia() {
    const fileInput = document.getElementById('media-file');
    const d = getFormData('entity-form');
    if (!fileInput?.files?.[0]) { toast('Select an image file.', 'error'); return; }
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    toast('Uploading…', 'success');
    const { error: upErr } = await sb.storage.from('gtec-media').upload(path, file);
    if (upErr) { toast(upErr.message, 'error'); return; }
    const { data: { publicUrl } } = sb.storage.from('gtec-media').getPublicUrl(path);
    const { error } = await sb.from('media_items').insert({
        title:   d.title   || null,
        caption: d.caption || null,
        url:     publicUrl,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Media uploaded.', 'success');
    closeModal();
    await renderMedia();
}

async function deleteMedia(id) {
    if (!confirm('Delete this media item? The image file in storage will NOT be deleted automatically.')) return;
    const { error } = await sb.from('media_items').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Deleted.', 'success');
    await renderMedia();
}


// ============================================================
// 11d. Pages
// ============================================================
async function renderPages() {
    const { data, error } = await sb.from('pages').select('*').order('slug');
    if (error) { toast(error.message, 'error'); return; }

    const rows = !data?.length
        ? `<tr><td colspan="4"><div class="empty-state">No pages found. Run the SQL to seed the rules page.</div></td></tr>`
        : data.map(p => `
            <tr>
                <td><strong>${esc(p.title)}</strong></td>
                <td class="td-muted">/endurance/${esc(p.slug)}/</td>
                <td class="td-muted">${p.updated_at ? p.updated_at.slice(0,10) : '—'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editPage('${esc(p.slug)}')">Edit</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <table id="pages-table"><thead><tr>
                <th>Title</th><th>URL</th><th>Last Updated</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function editPage(slug) {
    const { data } = await sb.from('pages').select('*').eq('slug', slug).single();
    if (!data) { toast('Page not found.', 'error'); return; }
    openModal(`Edit Page — ${esc(data.title)}`, `
        <form id="entity-form">
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" name="title" value="${esc(data.title)}" required>
            </div>
            <div class="form-group">
                <label>Body <span class="required">*</span></label>
                <textarea name="body" rows="14" placeholder="HTML content…" style="font-family:monospace;font-size:0.78rem">${esc(data.body)}</textarea>
                <div class="form-hint">HTML is supported: &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;li&gt;, &lt;strong&gt;, &lt;a href=""&gt;, etc.</div>
            </div>
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="savePage('${esc(slug)}')">Save</button>`
    );
}

async function savePage(slug) {
    const d = getFormData('entity-form');
    if (!d.title) { toast('Title is required.', 'error'); return; }
    const { error } = await sb.from('pages').update({
        title:      d.title,
        body:       d.body || '',
        updated_at: new Date().toISOString(),
    }).eq('slug', slug);
    if (error) { toast(error.message, 'error'); return; }
    toast('Page saved.', 'success');
    closeModal();
    await renderPages();
}


// ============================================================
// 12. Utilities
// ============================================================
function autoSlug(input, sourceName, targetId) {
    const target = document.getElementById(targetId);
    if (!target || target.dataset.edited) return;
    target.value = slugify(input.value);
    target.addEventListener('input', () => target.dataset.edited = '1', { once: true });
}

function filterTable(input, tableId) {
    const q = input.value.toLowerCase();
    document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}
