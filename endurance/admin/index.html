<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --bg-3: #171d27;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --cyan: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
            --sidebar-w: 220px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            line-height: 1.5;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 20;
        }
        .sidebar-logo {
            padding: 1.5rem 1.25rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo .brand {
            font-family: 'Anton', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text);
            text-indent: 0.28em;
        }
        .sidebar-logo .brand span { color: var(--gold); }
        .sidebar-logo .sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.2rem;
            text-indent: 0.35em;
        }
        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }
        .nav-section {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.85rem 1.25rem 0.4rem;
            text-indent: 0.35em;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 1.25rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.15s, background 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: var(--gold); background: rgba(255,209,102,0.08); }
        .nav-link.active svg { color: var(--gold); }
        .sidebar-bottom {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
        }
        .user-chip {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-logout {
            width: 100%;
            padding: 0.55rem 0.85rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-logout:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* ===== MAIN ===== */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(5,6,8,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        .page-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-add:hover { filter: brightness(1.08); }
        .btn-add svg { width: 14px; height: 14px; }
        .content {
            flex: 1;
            padding: 2rem;
        }

        /* ===== STAT CARDS ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .stat-card-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-indent: 0.2em;
        }
        .stat-card-value {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            line-height: 1;
            background: linear-gradient(180deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== TABLE ===== */
        .table-wrap {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }
        .table-search {
            flex: 1;
            max-width: 280px;
            padding: 0.5rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .table-search:focus { border-color: rgba(255,209,102,0.4); }
        .table-search::placeholder { color: var(--muted); opacity: 0.6; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            padding: 0.7rem 1.25rem;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .td-muted { color: var(--muted); font-size: 0.82rem; }
        .color-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-muted { background: rgba(255,255,255,0.06); color: var(--muted); }
        .badge-gold  { background: rgba(255,209,102,0.15); color: var(--gold); }
        .row-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }
        .btn-icon {
            padding: 0.35rem 0.65rem;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .btn-icon:hover { color: var(--text); border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
        .btn-icon.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); }
        .empty-state {
            padding: 3rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .loading-state {
            padding: 2rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 1.15rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        label .required { color: var(--gold); margin-left: 2px; }
        input[type="text"], input[type="email"], input[type="number"],
        input[type="date"], input[type="color"], input[type="url"],
        select, textarea {
            display: block;
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="color"] { padding: 0.35rem; height: 38px; cursor: pointer; }
        input:focus, select:focus, textarea:focus { border-color: rgba(255,209,102,0.5); }
        input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.6; }
        select option { background: var(--bg-2); }
        textarea { resize: vertical; min-height: 80px; }
        .form-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }
        .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .form-check span { font-size: 0.88rem; color: var(--text); font-weight: 400; letter-spacing: 0; text-transform: none; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: filter 0.15s, background 0.15s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .btn-danger {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); }

        /* ===== SEASON TEAMS sub-section ===== */
        .section-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 1.5rem;
            overflow: hidden;
        }
        .section-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
        }
        .section-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            text-indent: 0.25em;
        }

        /* ===== TOASTS ===== */
        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            pointer-events: none;
        }
        .toast {
            padding: 0.8rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            max-width: 340px;
            pointer-events: auto;
            animation: toast-in 0.25s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: none; }
        }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .toast.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .toast.info    { background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.3); color: #7dd3fc; }

        /* ===== CONFIRM BANNER ===== */
        .confirm-banner {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .confirm-banner.open { display: block; }
        .confirm-banner p { font-size: 0.85rem; color: #fca5a5; margin-bottom: 0.65rem; }
        .confirm-banner .confirm-btns { display: flex; gap: 0.5rem; }

        /* ===== AUTH LOADING ===== */
        #auth-loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--muted);
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main { margin-left: 0; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="auth-loading">Authenticating…</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="brand">Gran Turismo<span> GTEC</span></div>
        <div class="sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">Overview</div>
        <button class="nav-link" data-section="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
        </button>

        <div class="nav-section">Championship</div>
        <button class="nav-link" data-section="manufacturers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
            Manufacturers
        </button>
        <button class="nav-link" data-section="seasons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Seasons
        </button>
        <button class="nav-link" data-section="teams">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Teams
        </button>
        <button class="nav-link" data-section="drivers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
            Drivers
        </button>

    <div class="sidebar-bottom">
        <div class="user-chip" id="user-email">—</div>
        <button class="btn-logout" id="btn-logout">Sign out</button>
    </div>
</aside>

<!-- Main -->
<div class="main">
    <header class="topbar">
        <div class="page-title" id="page-title">Dashboard</div>
        <button class="btn-add" id="btn-add" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add
        </button>
    </header>
    <div class="content" id="content">
        <!-- dynamic -->
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
        <div class="modal-header">
            <div class="modal-title" id="modal-title"></div>
            <button class="modal-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
    </div>
</div>

<!-- Toasts -->
<div class="toast-container" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';

// ============================================================
// 1. Init
// ============================================================
const { createClient } = window.supabase;
const cfg = window.GTEC_CONFIG;
const sb  = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

let currentUser  = null;
let currentSection = 'dashboard';

// Cached data for dropdowns
let _manufacturers = [];
let _seasons       = [];
let _teams         = [];
let _pointsSystems = [];
let _drivers       = [];


// ============================================================
// 2. Auth guard
// ============================================================
async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        window.location.replace('./login.html');
        return;
    }
    currentUser = session.user;

    const { data: role } = await sb.from('user_roles')
        .select('role')
        .eq('user_id', currentUser.id)
        .eq('role', 'admin')
        .maybeSingle();

    if (!role) {
        await sb.auth.signOut();
        window.location.replace('./login.html');
        return;
    }

    document.getElementById('user-email').textContent = currentUser.email;
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('sidebar').style.transform = '';
    document.getElementById('sidebar').style.display = '';

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.replace('./login.html');
    });

    setupNav();
    await navigate('dashboard');
}


// ============================================================
// 3. Router & nav
// ============================================================
function setupNav() {
    document.querySelectorAll('.nav-link[data-section]').forEach(btn => {
        btn.addEventListener('click', () => navigate(btn.dataset.section));
    });

    // Hash routing
    window.addEventListener('hashchange', () => {
        const sec = window.location.hash.replace('#', '') || 'dashboard';
        navigate(sec, false);
    });
    const hash = window.location.hash.replace('#', '');
    if (hash && hash !== 'dashboard') navigate(hash, false);
}

async function navigate(section, pushHash = true) {
    currentSection = section;
    if (pushHash) window.location.hash = section;

    document.querySelectorAll('.nav-link').forEach(b => b.classList.toggle('active', b.dataset.section === section));

    const titles = {
        dashboard: 'Dashboard',
        manufacturers: 'Manufacturers',
        seasons: 'Seasons',
        teams: 'Teams',
        drivers: 'Drivers',
    };
    document.getElementById('page-title').textContent = titles[section] || section;

    const addBtn = document.getElementById('btn-add');
    if (section === 'dashboard') {
        addBtn.style.display = 'none';
    } else {
        addBtn.style.display = '';
        addBtn.onclick = () => openAddModal(section);
    }

    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading-state">Loading…</div>';

    await Promise.all([loadCache()]);

    switch (section) {
        case 'dashboard':    await renderDashboard(); break;
        case 'manufacturers': await renderManufacturers(); break;
        case 'seasons':      await renderSeasons(); break;
        case 'teams':        await renderTeams(); break;
        case 'drivers':      await renderDrivers(); break;
    }
}

// ============================================================
// 5. UI helpers
// ============================================================
function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function openModal(title, bodyHTML, footerHTML) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHTML;
    document.getElementById('modal-footer').innerHTML = footerHTML;
    document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function slugify(str) {
    return str.toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
}

function selectHTML(id, options, selected = '', emptyLabel = '— Select —') {
    const opts = options.map(o =>
        `<option value="${esc(o.value)}" ${o.value === selected ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="${id}" name="${id}"><option value="">${emptyLabel}</option>${opts}</select>`;
}

function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getFormData(formId) {
    const form = document.getElementById(formId);
    const data = {};
    form.querySelectorAll('[name]').forEach(el => {
        if (el.type === 'checkbox') data[el.name] = el.checked;
        else data[el.name] = el.value || null;
    });
    return data;
}

    toast('Registration removed.', 'success');

    const btn = document.querySelector(`[onclick="removeTeamSeason('${id}')"]`);
    const panel = document.getElementById('season-teams-panel');

        : await sb.from('teams').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Team updated.' : 'Team added.', 'success');
    closeModal();
    await renderTeams();
    await loadCache();
}

async function deleteTeam(id, name) {
    if (!confirm(`Delete "${name}"?`)) return;
    const { error } = await sb.from('teams').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Team deleted.', 'success');
    await renderTeams();
    await loadCache();
}


// ============================================================
// 10. Drivers
// ============================================================
async function renderDrivers() {
    const { data, error } = await sb.from('drivers')
        .select('*, teams(name), manufacturers(name)')
        .order('display_name');
    if (error) { toast(error.message, 'error'); return; }

    const rows = data.length === 0 ? `<tr><td colspan="6"><div class="empty-state">No drivers yet.</div></td></tr>` :
        data.map(d => `
            <tr>
                <td><strong>${esc(d.display_name)}</strong>${d.career_number ? ` <span class="badge badge-gold">#${d.career_number}</span>` : ''}</td>
                <td class="td-muted">${esc(d.psn_id) || '—'}</td>
                <td class="td-muted">${esc(d.nationality) || '—'}</td>
                <td class="td-muted">${esc(d.teams?.name) || '—'}</td>
                <td class="td-muted">${esc(d.manufacturers?.name) || '—'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editDriver('${d.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteDriver('${d.id}','${esc(d.display_name)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search drivers…" oninput="filterTable(this,'drivers-table')">
            </div>
            <table id="drivers-table"><thead><tr>
                <th>Name</th><th>PSN ID</th><th>Nationality</th><th>Team</th><th>Manufacturer</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

function driverForm(d = {}) {
    const teamOpts = _teams.map(t => ({ value: t.id, label: t.name }));
    const mfrOpts  = _manufacturers.map(m => ({ value: m.id, label: m.name }));
    return `<form id="entity-form">
        <div class="form-row">
            <div class="form-group">
                <label>Display Name <span class="required">*</span></label>
                <input type="text" name="display_name" value="${esc(d.display_name)}" placeholder="Max Verstappen" required oninput="autoSlug(this,'display_name','slug')">
            </div>
            <div class="form-group">
                <label>Slug <span class="required">*</span></label>
                <input type="text" name="slug" id="slug" value="${esc(d.slug)}" placeholder="max-verstappen" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>PSN ID</label>
                <input type="text" name="psn_id" value="${esc(d.psn_id)}" placeholder="PSN_Username">
            </div>
            <div class="form-group">
                <label>Career Number</label>
                <input type="number" name="career_number" value="${d.career_number || ''}" placeholder="44" min="1" max="999">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Nationality</label>
                <input type="text" name="nationality" value="${esc(d.nationality)}" placeholder="GB">
            </div>
            <div class="form-group">
                <label>Joined At</label>
                <input type="date" name="joined_at" value="${d.joined_at ? d.joined_at.slice(0,10) : ''}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Current Team</label>
                ${selectHTML('current_team_id', teamOpts, d.current_team_id || '')}
            </div>
            <div class="form-group">
                <label>Current Manufacturer</label>
                ${selectHTML('current_manufacturer_id', mfrOpts, d.current_manufacturer_id || '')}
            </div>
        </div>
        <div class="form-group">
            <label>Bio</label>
            <textarea name="bio" placeholder="Driver bio…">${esc(d.bio)}</textarea>
        </div>
    </form>`;
}

function openDriverModal(d = {}) {
    openModal(d.id ? 'Edit Driver' : 'Add Driver', driverForm(d), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDriver('${d.id || ''}')">Save</button>
    `);
}

async function editDriver(id) {
    const { data } = await sb.from('drivers').select('*').eq('id', id).single();
    openDriverModal(data);
}

async function saveDriver(id) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        nationality: d.nationality, career_number: d.career_number ? parseInt(d.career_number) : null,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
    };
    const { error } = id
        ? await sb.from('drivers').update(payload).eq('id', id)
        : await sb.from('drivers').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Driver updated.' : 'Driver added.', 'success');
    closeModal();
    await renderDrivers();
    await loadCache();
}

async function deleteDriver(id, name) {
    if (!confirm(`Delete "${name}"?`)) return;
    const { error } = await sb.from('drivers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Driver deleted.', 'success');
    await renderDrivers();
    await loadCache();
}


// ============================================================
// 11. Utilities
// ============================================================
function autoSlug(input, sourceName, targetId) {
    const target = document.getElementById(targetId);
    if (!target || target.dataset.edited) return;
    target.value = slugify(input.value);
    target.addEventListener('input', () => target.dataset.edited = '1', { once: true });
}

function filterTable(input, tableId) {
    const q = input.value.toLowerCase();
    document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}
