// 14d. Race Report generator
// Pulls qualifying, race + per-driver results, championship before
// and after this event, then templates an HTML article ready to drop
// into the news table. Reads, no writes, until admin hits Publish.
// ============================================================
async function generateRaceReport(eventId, eventName, seasonId) {
    openModal(`Race Report — ${esc(eventName)}`,
        '<div class="loading-state">Building report from results…</div>',
        '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'
    );

    try {
        const data = await fetchRaceReportData(eventId, seasonId);
        if (!data.results.length) {
            document.querySelector('.modal-body').innerHTML =
                `<div class="empty-state">No results recorded for this event yet. Enter race results first.</div>`;
            return;
        }
        const draft = buildRaceReport(data);
        openReportEditor(eventId, eventName, draft, data);
    } catch (err) {
        document.querySelector('.modal-body').innerHTML =
            `<div class="empty-state">Could not build report: ${esc(err.message || String(err))}</div>`;
    }
}

async function fetchRaceReportData(eventId, seasonId) {
    const [evRes, qualiRes, resultsRes, rdRes, allEvRes, allRdRes, teamStRes, teamPriorRes] = await Promise.all([
        sb.from('events').select('*, seasons(name, year)').eq('id', eventId).single(),
        sb.from('qualifying_results').select('entry_id, driver_id, position, best_lap_ms, drivers(display_name, slug, career_number), entries(car_number, lobby_number, teams(name))').eq('event_id', eventId),
        sb.from('results').select('id, entry_id, finish_position, entries(car_number, lobby_number, teams(name, slug), manufacturers(name))').eq('event_id', eventId),
        // Per-driver rows for the event we're reporting on
        sb.from('result_drivers').select('result_id, driver_id, finish_position, status, classified, points_awarded, pole_point, fastest_lap_point, fastest_lap_ms, drivers(display_name, slug, career_number)').in('result_id', []), // backfilled below
        // Every event in this season + every result_drivers points awarded
        // so we can compute "championship before this round".
        sb.from('events').select('id, starts_at').eq('season_id', seasonId),
        sb.from('result_drivers').select('driver_id, points_awarded, results!inner(event_id, entries!inner(team_id))'),
        sb.from('team_standings').select('team_id, team_name, points, races, wins, podiums').eq('season_id', seasonId),
        // Team prior points: same source but grouped by team
        sb.from('result_drivers').select('points_awarded, results!inner(event_id, entries!inner(team_id))'),
    ]);
    if (evRes.error)      throw new Error(evRes.error.message);
    if (resultsRes.error) throw new Error(resultsRes.error.message);

    const event   = evRes.data;
    const results = resultsRes.data || [];
    const resultIds = results.map(r => r.id);

    // Now load the per-driver rows for the specific result ids.
    const { data: perDriver = [] } = await sb.from('result_drivers')
        .select('result_id, driver_id, finish_position, status, classified, points_awarded, pole_point, fastest_lap_point, fastest_lap_ms, drivers(display_name, slug, career_number)')
        .in('result_id', resultIds.length ? resultIds : ['00000000-0000-0000-0000-000000000000']);

    // Championship before this event: every other event in the same
    // season with starts_at earlier than this one.
    const priorEventIds = (allEvRes.data || [])
        .filter(e => e.id !== eventId && e.starts_at && event.starts_at && e.starts_at < event.starts_at)
        .map(e => e.id);
    const priorByDriver = new Map();
    const priorByTeam   = new Map();
    (allRdRes.data || []).forEach(r => {
        if (!priorEventIds.includes(r.results?.event_id)) return;
        const pts = Number(r.points_awarded || 0);
        priorByDriver.set(r.driver_id, (priorByDriver.get(r.driver_id) || 0) + pts);
        const teamId = r.results?.entries?.team_id;
        if (teamId) priorByTeam.set(teamId, (priorByTeam.get(teamId) || 0) + pts);
    });

    // Current driver standings for this season. Sort with the same
    // comparator the public standings page uses so the article's order
    // matches what visitors see on /endurance/standings/.
    const { data: standingsRaw = [] } = await sb.from('driver_standings')
        .select('driver_id, driver_name, driver_slug, points, wins, podiums, team_name')
        .eq('season_id', seasonId);
    const standingsCmp = (a, b) => (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums);
    const standingsNow = (standingsRaw || []).slice().sort(standingsCmp);
    const teamStandingsNow = (teamStRes.data || []).slice().sort(standingsCmp);

    return {
        event,
        quali: qualiRes.data || [],
        results,
        perDriver,
        standingsNow,
        teamStandingsNow,
        priorByDriver,
        priorByTeam,
    };
}

function fmtLap(ms) {
    if (ms == null) return '';
    const totalSec = ms / 1000;
    const min = Math.floor(totalSec / 60);
    const sec = (totalSec - min * 60).toFixed(3).padStart(6, '0');
    return min > 0 ? `${min}:${sec}` : sec;
}

function fmtPoints(n) {
    const v = Number(n || 0);
    return v % 1 === 0 ? String(v) : v.toFixed(1);
}

function pickOne(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function buildRaceReport(d) {
    const { event, quali, results, perDriver, standingsNow, teamStandingsNow, priorByDriver, priorByTeam } = d;

    // Group everything by split (lobby_number). 0 = unassigned.
    const splits = {};
    results.forEach(r => {
        const lobby = r.entries?.lobby_number ?? 0;
        (splits[lobby] = splits[lobby] || { lobby, entries: [], drivers: [], qualis: [] }).entries.push(r);
    });
    perDriver.forEach(rd => {
        const res = results.find(r => r.id === rd.result_id);
        const lobby = res?.entries?.lobby_number ?? 0;
        if (splits[lobby]) splits[lobby].drivers.push({ ...rd, _entry: res?.entries });
    });
    quali.forEach(q => {
        const lobby = q.entries?.lobby_number ?? 0;
        (splits[lobby] = splits[lobby] || { lobby, entries: [], drivers: [], qualis: [] }).qualis.push(q);
    });
    const splitKeys = Object.keys(splits).map(Number).sort((a, b) => {
        if (a === 0) return 1; if (b === 0) return -1; return a - b;
    });
    const multiSplit = splitKeys.filter(k => k !== 0).length > 1;
    const splitLabel = (n) => n === 0 ? 'Unassigned' : (multiSplit ? `Split ${n}` : 'the race');

    const classified  = (rd) => (rd.status || 'classified') === 'classified';
    const driverName  = (rd) => rd.drivers?.display_name || 'Unknown';
    const teamOf      = (rd) => rd._entry?.teams?.name;
    const teamSlugOf  = (rd) => rd._entry?.teams?.slug;

    const splitStories = splitKeys.map(k => {
        const split = splits[k];
        const qs = (split.qualis || []).filter(q => q.position != null).sort((a, b) => a.position - b.position);
        const finishers = (split.drivers || [])
            .filter(rd => classified(rd) && rd.finish_position != null)
            .sort((a, b) => a.finish_position - b.finish_position);
        const qualiPosByDriver = new Map();
        qs.forEach(q => qualiPosByDriver.set(q.driver_id, q.position));
        finishers.forEach(rd => {
            const qp = qualiPosByDriver.get(rd.driver_id);
            if (qp != null) { rd._qualiPos = qp; rd._gained = qp - rd.finish_position; }
        });
        const pole   = qs[0];
        const poleGap = (qs[1] && qs[1].best_lap_ms && pole?.best_lap_ms)
            ? (qs[1].best_lap_ms - pole.best_lap_ms) / 1000 : null;
        const winner = finishers[0];
        const p2     = finishers[1];
        const p3     = finishers[2];
        const flWinner   = (split.drivers || []).find(rd => rd.fastest_lap_point && classified(rd));
        const poleToFlag = winner && pole && winner.driver_id === pole.driver_id;
        const grandSlam  = poleToFlag && flWinner && flWinner.driver_id === winner.driver_id;
        const teamOneTwo = !!(p2 && teamSlugOf(winner) && teamSlugOf(winner) === teamSlugOf(p2));
        // All meaningful climbers (positions gained ≥ 3, classified, top half-ish).
        const climbers = finishers
            .filter(rd => rd._gained != null && rd._gained >= 3 && rd.finish_position <= 10 && rd.driver_id !== winner?.driver_id)
            .sort((a, b) => b._gained - a._gained);
        const driveOfRace  = climbers[0];
        const secondClimber = climbers[1];
        // Headline faller — someone who qualified inside the top 5 and slipped
        // well outside it without retiring. The pole sitter losing the lead is
        // already covered by the opener, so skip them.
        const bigFaller = finishers
            .filter(rd => rd._gained != null && rd._gained <= -3 && rd._qualiPos <= 6 && rd.driver_id !== (pole?.driver_id))
            .sort((a, b) => a._gained - b._gained)[0];
        // Positions 4 → 7: the rest of the points payers behind the podium.
        const pointsPack = finishers.slice(3, 7);
        // Winner came from way back — a separate story to "drive of the day"
        // (which is by definition not the winner).
        const comebackWin = !!(winner && winner._gained != null && winner._gained >= 3 && winner._qualiPos > 1);
        // Named DNFs / DSQs rather than bare counts.
        const dnfDrivers = (split.drivers || []).filter(rd => rd.status === 'dnf');
        const dsqDrivers = (split.drivers || []).filter(rd => rd.status === 'dsq');
        const dnf = dnfDrivers.length;
        const dsq = dsqDrivers.length;
        // How chaotic was the race? Average absolute position change among
        // classified runners who started. Used for one of the closing beats.
        const movers = finishers.filter(rd => rd._gained != null);
        const chaosScore = movers.length
            ? movers.reduce((s, rd) => s + Math.abs(rd._gained), 0) / movers.length
            : 0;
        return { key: k, label: splitLabel(k), qs, pole, poleGap, finishers, winner, p2, p3,
                 flWinner, poleToFlag, grandSlam, teamOneTwo,
                 driveOfRace, secondClimber, bigFaller, pointsPack,
                 comebackWin, dnf, dsq, dnfDrivers, dsqDrivers, chaosScore,
                 allDrivers: split.drivers || [] };
    }).filter(s => s.winner);

    const leaderNow = standingsNow[0];
    const priorSorted = Array.from(priorByDriver.entries())
        .map(([id, pts]) => ({ id, pts }))
        .sort((a, b) => b.pts - a.pts);
    const priorLeaderRow  = priorSorted[0];
    const priorLeaderName = priorLeaderRow
        ? (standingsNow.find(s => s.driver_id === priorLeaderRow.id)?.driver_name || 'the previous leader')
        : null;
    const leadChanged  = !!(leaderNow && priorLeaderRow && priorLeaderRow.id !== leaderNow.driver_id);
    const isFirstRound = priorSorted.length === 0;

    const reportTitle = `Round ${event.round}: ${event.name}`;
    const seasonLabel = event.seasons?.name || `${event.seasons?.year || ''} Season`.trim();
    const circuit     = event.circuit_name || 'the circuit';
    const heroSplit   = splitStories[0] || null;

    function fmtDateline(iso) {
        if (!iso) return '';
        const dt = new Date(iso);
        const day = String(dt.getDate()).padStart(2, '0');
        const month = dt.toLocaleString('en-GB', { month: 'short' }).toUpperCase().replace(/\./g, '');
        return `${day} ${month} ${dt.getFullYear()}`;
    }
    function ledeWithDropcap(text) {
        let inTag = false, head = '';
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (c === '<') { inTag = true; head += c; continue; }
            if (c === '>') { inTag = false; head += c; continue; }
            if (inTag)    { head += c; continue; }
            if (/[A-Za-z]/.test(c)) return `${head}<span class="dropcap">${c}</span>${text.slice(i + 1)}`;
            head += c;
        }
        return text;
    }
    // Per-article variant tracker so two splits never roll the same
    // sentence twice. Once a key's pool is exhausted it resets.
    const _usedVariants = new Map();
    function freshPick(key, arr) {
        let used = _usedVariants.get(key);
        if (!used) { used = new Set(); _usedVariants.set(key, used); }
        let pool = arr.map((_, i) => i).filter(i => !used.has(i));
        if (!pool.length) { used.clear(); pool = arr.map((_, i) => i); }
        const idx = pool[Math.floor(Math.random() * pool.length)];
        used.add(idx);
        return arr[idx];
    }

    // ---- Hero lede: single biggest story of the round ----
    let lede;
    if (leadChanged && leaderNow) {
        lede = pickOne([
            `<strong>${esc(leaderNow.driver_name)}</strong> walks out of ${esc(circuit)} as the new championship leader of ${esc(seasonLabel)}, ending ${esc(priorLeaderName || 'the incumbent')}'s grip on the top of the table after a pivotal Round ${event.round}.`,
            `For the first time this season, the ${esc(seasonLabel)} championship has a new name at the top. <strong>${esc(leaderNow.driver_name)}</strong> wrested the lead from ${esc(priorLeaderName || 'the previous leader')} at ${esc(circuit)}, turning Round ${event.round} into the day the title race flipped on its head.`,
            `Round ${event.round} reshaped ${esc(seasonLabel)}. <strong>${esc(leaderNow.driver_name)}</strong> leaves ${esc(circuit)} as the new points leader, the kind of turning point seasons hinge on, with ${esc(priorLeaderName || 'the previous leader')} now playing chase.`,
        ]);
    } else if (heroSplit?.grandSlam) {
        lede = pickOne([
            `Pole, fastest lap, the race win. <strong>${esc(driverName(heroSplit.winner))}</strong> did everything that could be done at ${esc(circuit)}, the kind of weekend drivers chase a whole season for and rarely find.`,
            `<strong>${esc(driverName(heroSplit.winner))}</strong> rewrote the ${esc(circuit)} record card on race day, taking pole position, fastest lap and the chequered flag inside a single afternoon and never looking troubled doing it.`,
            `Some days the result book runs out of ways to credit a driver. <strong>${esc(driverName(heroSplit.winner))}</strong>'s afternoon at ${esc(circuit)} was one of them: pole, fastest lap, victory, and not much room for argument in between.`,
        ]);
    } else if (heroSplit?.poleToFlag) {
        lede = pickOne([
            `<strong>${esc(driverName(heroSplit.winner))}</strong> ran the lap board at ${esc(circuit)} from pole to chequer, controlling the front of the race with the kind of patience that wins championships.`,
            `It was a controlled, almost serene afternoon for <strong>${esc(driverName(heroSplit.winner))}</strong> at ${esc(circuit)}. Pole position turned into a race lead that was never seriously questioned, and Round ${event.round} ended exactly the way it began.`,
            `Pole to flag, and never any closer to losing it than he wanted to be. <strong>${esc(driverName(heroSplit.winner))}</strong> commanded ${esc(circuit)} from the moment the lights went out, the result settled long before the chequer fell.`,
        ]);
    } else if (heroSplit?.comebackWin) {
        const w = heroSplit.winner;
        lede = pickOne([
            `<strong>${esc(driverName(w))}</strong> turned Round ${event.round} into a comeback story at ${esc(circuit)}, charging from P${w._qualiPos} on the grid to take the win, ${w._gained} places gained in a single afternoon.`,
            `Forget the grid. <strong>${esc(driverName(w))}</strong> started P${w._qualiPos} at ${esc(circuit)} and finished it on top of the rostrum, a ${w._gained}-place climb that produced one of the headline drives of ${esc(seasonLabel)} so far.`,
            `Some races are decided in qualifying. Not this one. <strong>${esc(driverName(w))}</strong> lined up P${w._qualiPos} at ${esc(circuit)} and converted it into a Round ${event.round} race win, the kind of comeback drive that lingers in the season's memory.`,
        ]);
    } else if (heroSplit?.driveOfRace) {
        const dor = heroSplit.driveOfRace;
        lede = pickOne([
            `If Round ${event.round} had a heart, it beat in the cockpit of <strong>${esc(driverName(dor))}</strong>, who climbed ${dor._gained} places from P${dor._qualiPos} on the grid to P${dor.finish_position} at the flag and stole the headlines from the man who actually won.`,
            `<strong>${esc(driverName(dor))}</strong> may not have crossed the line first at ${esc(circuit)}, but a P${dor._qualiPos} to P${dor.finish_position} charge was the kind of drive that wins a driver a following, and it left the paddock talking about him as much as the race winner.`,
            `Round ${event.round} at ${esc(circuit)} produced one of those drives the cameras struggle to track. <strong>${esc(driverName(dor))}</strong> gained ${dor._gained} places in a single afternoon, climbing from P${dor._qualiPos} on the grid to P${dor.finish_position} at the chequered flag.`,
        ]);
    } else if (heroSplit) {
        const winN = driverName(heroSplit.winner);
        const team = teamOf(heroSplit.winner);
        lede = pickOne([
            `<strong>${esc(winN)}</strong>${team ? ` of ${esc(team)}` : ''} took Round ${event.round} of ${esc(seasonLabel)} at ${esc(circuit)}, the kind of clean result the championship picture has been waiting for.`,
            `Round ${event.round} at ${esc(circuit)} belonged to <strong>${esc(winN)}</strong>${team ? `, a result that puts ${esc(team)} firmly back in the conversation` : ''}.`,
            `The chequered flag at ${esc(circuit)} fell first for <strong>${esc(winN)}</strong>${team ? `, leading ${esc(team)} home in Round ${event.round} of ${esc(seasonLabel)}` : ` in Round ${event.round} of ${esc(seasonLabel)}`}.`,
        ]);
    } else {
        lede = `Round ${event.round} of ${esc(seasonLabel)} was contested at ${esc(circuit)}.`;
    }

    // ---- Stat card: headline fact ----
    let statCard = '';
    if (leadChanged && leaderNow) {
        statCard = `<div class="stat-card">
            <div class="stat-card-label">New Championship Leader</div>
            <div class="stat-card-value">${esc(leaderNow.driver_name)}</div>
            <div class="stat-card-detail">Takes the ${esc(seasonLabel)} lead from ${esc(priorLeaderName || 'the previous leader')} on ${fmtPoints(leaderNow.points)} points after Round ${event.round}.</div>
        </div>`;
    } else if (heroSplit?.grandSlam) {
        statCard = `<div class="stat-card">
            <div class="stat-card-label">Grand Slam</div>
            <div class="stat-card-value">${esc(driverName(heroSplit.winner))}</div>
            <div class="stat-card-detail">Pole position. Fastest lap. Race win. The clean sweep at ${esc(circuit)}.</div>
        </div>`;
    } else if (heroSplit?.poleToFlag) {
        statCard = `<div class="stat-card">
            <div class="stat-card-label">Pole to Flag</div>
            <div class="stat-card-value">${esc(driverName(heroSplit.winner))}</div>
            <div class="stat-card-detail">${teamOf(heroSplit.winner) ? `${esc(teamOf(heroSplit.winner))}. ` : ''}Led from green light to chequer at ${esc(circuit)}.</div>
        </div>`;
    } else if (heroSplit?.comebackWin) {
        const w = heroSplit.winner;
        statCard = `<div class="stat-card">
            <div class="stat-card-label">Comeback Win</div>
            <div class="stat-card-value">${esc(driverName(w))}</div>
            <div class="stat-card-detail">${teamOf(w) ? `${esc(teamOf(w))}. ` : ''}From P${w._qualiPos} on the grid to the chequered flag at ${esc(circuit)}, ${w._gained} places gained.</div>
        </div>`;
    } else if (heroSplit?.driveOfRace) {
        const dor = heroSplit.driveOfRace;
        statCard = `<div class="stat-card">
            <div class="stat-card-label">Drive of the Day</div>
            <div class="stat-card-value">${esc(driverName(dor))}</div>
            <div class="stat-card-detail">From P${dor._qualiPos} on the grid to P${dor.finish_position} at the flag, ${dor._gained} places gained at ${esc(circuit)}.</div>
        </div>`;
    } else if (heroSplit) {
        statCard = `<div class="stat-card">
            <div class="stat-card-label">Race Winner</div>
            <div class="stat-card-value">${esc(driverName(heroSplit.winner))}</div>
            <div class="stat-card-detail">${teamOf(heroSplit.winner) ? `${esc(teamOf(heroSplit.winner))}. ` : ''}Round ${event.round} of ${esc(seasonLabel)} at ${esc(circuit)}.</div>
        </div>`;
    }

    // ---- Assemble body ----
    const html = [];

    const dlBits = [];
    if (circuit) dlBits.push(esc(circuit.toUpperCase()));
    if (event.starts_at) dlBits.push(fmtDateline(event.starts_at));
    dlBits.push('GTEC EDITORIAL');
    html.push(`<p class="dateline">${dlBits.join(' · ')}</p>`);

    html.push(`<p class="lede">${ledeWithDropcap(lede)}</p>`);
    if (statCard) html.push(statCard);

    // Nut graf
    const nut = [];
    if (multiSplit && splitStories.length > 1) {
        nut.push(pickOne([
            `The round split into ${splitStories.length} separate races across the GTEC grid, and each one wrote its own headlines.`,
            `Across ${splitStories.length} splits, the field produced ${splitStories.length === 2 ? 'a pair of contrasting' : 'a clutch of contrasting'} race narratives for the championship to make sense of.`,
            `${splitStories.length} splits, ${splitStories.length} separate stories. Round ${event.round} delivered a little of everything across the grid.`,
        ]));
    }
    if (leaderNow && !leadChanged && !isFirstRound) {
        nut.push(pickOne([
            `${esc(leaderNow.driver_name)} retains the championship lead for another round, but on this evidence the picture behind has not gone quiet.`,
            `${esc(leaderNow.driver_name)} stays at the top of the table, with the rest of the contenders making certain the title race is far from settled.`,
            `${esc(leaderNow.driver_name)}'s name remains the one to beat, though the gap behind reads a touch different than it did a round ago.`,
        ]));
    }
    if (isFirstRound && leaderNow) {
        nut.push(pickOne([
            `With the opening round in the books, ${esc(leaderNow.driver_name)} is the first name on the ${esc(seasonLabel)} championship board.`,
            `${esc(leaderNow.driver_name)} writes the first chapter of the ${esc(seasonLabel)} title fight, taking the inaugural points lead out of ${esc(circuit)}.`,
            `Every season needs a starting point. ${esc(seasonLabel)} found its early leader in ${esc(leaderNow.driver_name)}, with ${esc(circuit)} setting the tone.`,
        ]));
    }
    if (nut.length) html.push(`<p>${nut.join(' ')}</p>`);

    // ---- Qualifying ----
    if (splitStories.some(s => s.qs.length)) {
        html.push(`<div class="kicker">Qualifying</div><h2>On the Front Row</h2>`);
        splitStories.forEach(s => {
            const { qs, pole, poleGap, label } = s;
            if (!qs.length || !pole) return;
            const poleN  = esc(pole.drivers?.display_name || 'pole sitter');
            const teamN  = pole.entries?.teams?.name ? esc(pole.entries.teams.name) : null;
            const lap    = pole.best_lap_ms ? fmtLap(pole.best_lap_ms) : null;
            const second = qs[1];
            const secondN = second?.drivers?.display_name ? esc(second.drivers.display_name) : null;
            const gapStr = poleGap != null ? poleGap.toFixed(3) : null;

            let para;
            if (poleGap == null || !secondN) {
                para = freshPick('qual-noGap', [
                    `${poleN} starts ${esc(label)} on pole${lap ? ` after a <strong>${lap}</strong> effort` : ''}${teamN ? ` for ${teamN}` : ''}.`,
                    `Pole in ${esc(label)} belongs to ${poleN}${teamN ? ` of ${teamN}` : ''}${lap ? `, banked at <strong>${lap}</strong>` : ''}.`,
                    `${esc(label)} sees ${poleN}${teamN ? ` (${teamN})` : ''} on the front of the grid${lap ? ` with a <strong>${lap}</strong> on the board` : ''}.`,
                ]);
            } else if (poleGap < 0.1) {
                para = freshPick('qual-knife', [
                    `Pole in ${esc(label)} came down to the last possible hundredth. ${poleN}'s ${lap ? `<strong>${lap}</strong>` : 'best lap'} pipped ${secondN} by just ${gapStr}s${teamN ? `, ${teamN} clinging to the front` : ''}, the kind of margin that doesn't sleep easy.`,
                    `${poleN} stole pole in ${esc(label)}, ${gapStr}s standing between ${lap ? `a <strong>${lap}</strong>` : 'his best effort'} and ${secondN}'s when the timing screens settled${teamN ? `; ${teamN} take the top slot for now` : ''}.`,
                    `Nothing separates the front row of ${esc(label)}. ${poleN}${teamN ? ` (${teamN})` : ''} edges ${secondN} by ${gapStr}s, pole settled by a sigh${lap ? ` on a <strong>${lap}</strong>` : ''}.`,
                    `${esc(label)}'s pole shoot-out went the distance. ${poleN}${lap ? ` on a <strong>${lap}</strong>` : ''} took it by ${gapStr}s from ${secondN}, a margin you could fit on a napkin.`,
                    `A blink would have missed it. ${secondN} fell ${gapStr}s short of ${poleN}${lap ? ` and the <strong>${lap}</strong>` : ''} that took ${esc(label)} pole${teamN ? ` for ${teamN}` : ''}.`,
                ]);
            } else if (poleGap < 0.35) {
                para = freshPick('qual-tight', [
                    `${poleN} takes ${esc(label)} pole by ${gapStr}s over ${secondN}${lap ? `, a <strong>${lap}</strong> the benchmark` : ''}${teamN ? `, and ${teamN} stamp themselves on the front row` : ''}.`,
                    `Pole in ${esc(label)} goes to ${poleN}${teamN ? ` of ${teamN}` : ''}, ${gapStr}s clear of ${secondN}${lap ? ` with a <strong>${lap}</strong>` : ''}. Comfortable enough, but no further.`,
                    `In ${esc(label)}, ${poleN} clears ${secondN} by ${gapStr}s for pole${lap ? `, a <strong>${lap}</strong>` : ''}${teamN ? `, the lift ${teamN} needed` : ''}.`,
                    `${poleN}${teamN ? ` (${teamN})` : ''} got the better of ${secondN} when it mattered in ${esc(label)} qualifying, ${gapStr}s the margin${lap ? `, a <strong>${lap}</strong> the headline figure` : ''}.`,
                    `${gapStr}s. That was the difference at the top of ${esc(label)}, with ${poleN}${lap ? `'s <strong>${lap}</strong>` : "'s best"} edging ${secondN}${teamN ? ` and putting ${teamN} on the front` : ''}.`,
                ]);
            } else if (poleGap < 0.7) {
                para = freshPick('qual-comfy', [
                    `${poleN} stamps authority on ${esc(label)} qualifying${lap ? `, a <strong>${lap}</strong>` : ''} landing ${gapStr}s clear of ${secondN}${teamN ? ` for ${teamN}` : ''}.`,
                    `${esc(label)}'s pole was rarely in doubt. ${poleN}${teamN ? ` (${teamN})` : ''} laid down ${lap ? `a <strong>${lap}</strong>` : 'the benchmark'} and walked away ${gapStr}s clear of ${secondN}.`,
                    `A pole worth shouting about in ${esc(label)}: ${poleN}${lap ? ` on a <strong>${lap}</strong>` : ''} put ${gapStr}s into ${secondN}${teamN ? `, ${teamN} the side reaping it` : ''}.`,
                    `Make it look easy. ${poleN}${teamN ? `, ${teamN}'s man,` : ''} fired in ${lap ? `a <strong>${lap}</strong>` : 'a session-best'} that left ${secondN} ${gapStr}s adrift in ${esc(label)}.`,
                    `${secondN} did everything he could in ${esc(label)} qualifying and still ended ${gapStr}s back. ${poleN}${lap ? ` on a <strong>${lap}</strong>` : ''} simply found more${teamN ? `, ${teamN} the side smiling` : ''}.`,
                ]);
            } else {
                para = freshPick('qual-dominant', [
                    `${poleN} put pole in ${esc(label)} out of reach${lap ? `, a <strong>${lap}</strong>` : ''} that finished ${gapStr}s clear of ${secondN}${teamN ? `, a statement weekend for ${teamN}` : ''}.`,
                    `Qualifying in ${esc(label)} was over before it began. ${poleN}${lap ? `'s <strong>${lap}</strong>` : "'s best lap"} dropped ${gapStr}s on ${secondN}, a margin nobody else got close to bridging.`,
                    `Pole in ${esc(label)} was a class apart. ${poleN}${teamN ? ` of ${teamN}` : ''} cleared ${secondN} by ${gapStr}s${lap ? ` with a <strong>${lap}</strong>` : ''}, and the grid behind looked like spectators.`,
                    `Demolition job at the top of ${esc(label)}. ${poleN}${lap ? ` posted a <strong>${lap}</strong>` : ''} that nobody could go near, ${secondN} the closest at ${gapStr}s back${teamN ? `, ${teamN} taking the spoils` : ''}.`,
                ]);
            }
            const p3 = qs[2];
            if (p3 && p3.drivers?.display_name) {
                para += ' ' + freshPick('qual-p3', [
                    `${esc(p3.drivers.display_name)} lines up third.`,
                    `${esc(p3.drivers.display_name)} completes the top three on the grid.`,
                    `Third on the grid: ${esc(p3.drivers.display_name)}.`,
                    `${esc(p3.drivers.display_name)} takes P3 on the grid.`,
                ]);
            }
            html.push(`<p>${para}</p>`);
        });
    }

    // ---- The Race ----
    html.push(`<div class="kicker">Race Day</div><h2>The Race</h2>`);
    splitStories.forEach(s => {
        const { winner, p2, p3, flWinner, poleToFlag, grandSlam, teamOneTwo,
                driveOfRace, secondClimber, bigFaller, pointsPack,
                dnf, dsq, dnfDrivers, dsqDrivers, chaosScore,
                label, qs, finishers, allDrivers } = s;
        // headLines = opening paragraph (winner + podium + team result)
        // bodyLines = follow-up paragraph (behind the podium, movers, FL, casualties)
        const headLines = [];
        const bodyLines = [];
        const winN = esc(driverName(winner));
        const team = teamOf(winner) ? esc(teamOf(winner)) : null;
        const p2N = p2 ? esc(driverName(p2)) : null;
        const p3N = p3 ? esc(driverName(p3)) : null;
        const podiumTail = p2N && p3N ? `, ${p2N} second and ${p3N} third` : p2N ? `, ${p2N} a step behind` : '';
        // p2/p3 team context (for the opener flesh-out)
        const p2Team = p2 && teamOf(p2) ? esc(teamOf(p2)) : null;
        const p3Team = p3 && teamOf(p3) ? esc(teamOf(p3)) : null;

        if (grandSlam) {
            headLines.push(freshPick('race-grandSlam', [
                `${winN} did everything that could be done in ${esc(label)}${team ? ` for ${team}` : ''}: pole, fastest lap, the win${podiumTail}.`,
                `It was the full set in ${esc(label)} for ${winN}${team ? ` (${team})` : ''}. Pole became a race lead, the race lead became a race win, and the fastest lap arrived for good measure${podiumTail}.`,
                `Pole, fastest lap, race win${team ? `, ${team} sweeping the lot` : ''}. ${winN} made ${esc(label)} his own${podiumTail}.`,
                `Nothing left on the table. ${winN}${team ? `, flying ${team} colours,` : ''} took pole, the win and the fastest lap in ${esc(label)}${podiumTail}.`,
            ]));
        } else if (poleToFlag) {
            headLines.push(freshPick('race-poleToFlag', [
                `${winN}${team ? ` of ${team}` : ''} converted ${esc(label)} pole into the chequered flag, the race controlled from green light to checker${podiumTail}.`,
                `Never headed. ${winN} ran ${esc(label)} from pole to the flag${team ? `, ${team} taking the spoils` : ''}${podiumTail}.`,
                `${winN} did the simple job in ${esc(label)}: led from pole, never lost it${team ? `, handed ${team} a clean win` : ''}${podiumTail}.`,
                `Lights out, race over. ${winN}${team ? ` (${team})` : ''} took ${esc(label)} from pole and never gave it back${podiumTail}.`,
            ]));
        } else {
            const polesitter = qs[0];
            const psBeaten = polesitter && polesitter.driver_id !== winner.driver_id;
            const psFinish = psBeaten ? finishers.find(rd => rd.driver_id === polesitter.driver_id) : null;
            // Pull the pole sitter's actual race-day status row so we can
            // tell DSQ apart from DNF (both are "not classified" but they
            // deserve very different prose).
            const psResultRow = psBeaten
                ? allDrivers.find(rd => rd.driver_id === polesitter.driver_id)
                : null;
            const psStatus = psResultRow?.status;
            const psName = polesitter?.drivers?.display_name ? esc(polesitter.drivers.display_name) : null;
            if (psBeaten && psName && psFinish) {
                headLines.push(freshPick('race-psFinish', [
                    `${esc(label)}'s race did not honour the grid. ${winN}${team ? ` (${team})` : ''} won it, with pole sitter ${psName} slipping to P${psFinish.finish_position}${podiumTail}.`,
                    `Pole did not pay in ${esc(label)}. ${winN} got the better of ${psName}${team ? ` and put ${team} top of the result sheet` : ''}, the pole sitter settling for P${psFinish.finish_position}${podiumTail}.`,
                    `${winN} reeled in the pole sitter in ${esc(label)}. ${psName} dropped to P${psFinish.finish_position} by the flag while ${winN}${team ? `, in ${team} colours,` : ''} took the win${podiumTail}.`,
                    `An upset in ${esc(label)}. ${winN}${team ? ` of ${team}` : ''} crossed the line first ahead of ${psName}, who started from pole and ended the day in P${psFinish.finish_position}${podiumTail}.`,
                    `${winN} flipped the script in ${esc(label)}${team ? ` for ${team}` : ''}, overhauling ${psName} en route to the win and shoving the pole sitter back to P${psFinish.finish_position}${podiumTail}.`,
                    `Pole sitter ${psName} could not hold on in ${esc(label)}; ${winN}${team ? ` (${team})` : ''} ran him down and took the chequered flag, leaving him in P${psFinish.finish_position}${podiumTail}.`,
                ]));
            } else if (psBeaten && psName && psStatus === 'dsq') {
                headLines.push(freshPick('race-psDsq', [
                    `Pole sitter ${psName} was disqualified from ${esc(label)}, handing the win to ${winN}${team ? ` of ${team}` : ''}${podiumTail}.`,
                    `${esc(label)}'s headline went to the stewards' office. Pole sitter ${psName} was stripped of the result and ${winN}${team ? ` (${team})` : ''} took the chequered flag${podiumTail}.`,
                    `${psName} put it on pole, then lost it after the flag. A disqualification removed the pole sitter from the result of ${esc(label)} and gifted ${winN}${team ? ` of ${team}` : ''} the win${podiumTail}.`,
                    `Stewards stripped pole sitter ${psName} of the result in ${esc(label)}, and ${winN}${team ? ` (${team})` : ''} took the chequered flag as classified winner${podiumTail}.`,
                    `Disqualification for the pole sitter. ${psName} was thrown out of the ${esc(label)} result, leaving ${winN}${team ? ` (${team})` : ''} to take the win${podiumTail}.`,
                ]));
            } else if (psBeaten && psName) {
                headLines.push(freshPick('race-psNoFinish', [
                    `Pole sitter ${psName} retired from ${esc(label)}, leaving ${winN}${team ? ` (${team})` : ''} to take the win${podiumTail}.`,
                    `${psName} did not see the chequered flag in ${esc(label)} after starting from pole, and ${winN}${team ? ` of ${team}` : ''} took the win${podiumTail}.`,
                    `${winN}${team ? ` (${team})` : ''} inherited the lead when pole sitter ${psName} retired in ${esc(label)}, and saw the job through${podiumTail}.`,
                    `${esc(label)}'s pole sitter ${psName} dropped out of the race, handing ${winN}${team ? ` of ${team}` : ''} the win${podiumTail}.`,
                ]));
            } else {
                headLines.push(freshPick('race-default', [
                    `${winN}${team ? ` of ${team}` : ''} took the win in ${esc(label)}${podiumTail}.`,
                    `In ${esc(label)}, ${winN}${team ? ` (${team})` : ''} crossed the line first${podiumTail}.`,
                    `${esc(label)}'s win went to ${winN}${team ? `, ${team}'s man on the day` : ''}${podiumTail}.`,
                ]));
            }
        }

        if (teamOneTwo && team && !grandSlam) {
            headLines.push(freshPick('race-teamOneTwo', [
                `${team} couldn't have asked for more, locking out the top two with a one-two finish.`,
                `A team-perfect day for ${team}, who put both cars on the front of the result sheet.`,
                `A one-two for ${team}, a result the season wasn't necessarily promising them.`,
                `${team} got both cars home at the sharp end, a one-two the spreadsheet will remember.`,
            ]));
        }

        if (flWinner) {
            const sameAsWinner = flWinner.driver_id === winner.driver_id;
            if (sameAsWinner && !grandSlam) {
                headLines.push(freshPick('race-flSame', [
                    `Fastest lap${flWinner.fastest_lap_ms ? ` of <strong>${fmtLap(flWinner.fastest_lap_ms)}</strong>` : ''} to ${esc(driverName(flWinner))}, just so the point couldn't be missed.`,
                    `${esc(driverName(flWinner))} stamped the fastest lap${flWinner.fastest_lap_ms ? `, <strong>${fmtLap(flWinner.fastest_lap_ms)}</strong>,` : ''} on top of the win.`,
                    `One more for the winner: the fastest lap${flWinner.fastest_lap_ms ? ` at <strong>${fmtLap(flWinner.fastest_lap_ms)}</strong>` : ''} fell ${esc(driverName(flWinner))}'s way too.`,
                ]));
            } else if (!sameAsWinner) {
                const flTeam = teamOf(flWinner) ? esc(teamOf(flWinner)) : null;
                bodyLines.push(freshPick('race-flElse', [
                    `Fastest lap went elsewhere: ${esc(driverName(flWinner))}${flTeam ? `, in ${flTeam} colours,` : ''} took it${flWinner.fastest_lap_ms ? ` at <strong>${fmtLap(flWinner.fastest_lap_ms)}</strong>` : ''}, a small consolation on a day the win sat out of reach.`,
                    `${esc(driverName(flWinner))}${flTeam ? ` (${flTeam})` : ''} grabbed the fastest lap point${flWinner.fastest_lap_ms ? ` on a <strong>${fmtLap(flWinner.fastest_lap_ms)}</strong>` : ''}, something to take home from a race that didn't deliver the bigger prize.`,
                    `The fastest tour of the lap chart belonged to ${esc(driverName(flWinner))}${flTeam ? ` of ${flTeam}` : ''}${flWinner.fastest_lap_ms ? `, <strong>${fmtLap(flWinner.fastest_lap_ms)}</strong> on the screens` : ''}, a single point earned on a result sheet otherwise written by someone else.`,
                    `${flTeam ? `${flTeam}'s ${esc(driverName(flWinner))}` : esc(driverName(flWinner))} ${flWinner.fastest_lap_ms ? `posted a <strong>${fmtLap(flWinner.fastest_lap_ms)}</strong> to bag the fastest lap` : 'took fastest lap honours'} and at least made one column of the result sheet his own.`,
                ]));
            }
        }

        // ---- Behind the podium: name the rest of the points-paying finishers ----
        if (pointsPack && pointsPack.length) {
            const packBits = pointsPack.map(rd => {
                const nm = esc(driverName(rd));
                const tn = teamOf(rd) ? ` (${esc(teamOf(rd))})` : '';
                return `${nm}${tn} in P${rd.finish_position}`;
            });
            if (packBits.length === 1) {
                bodyLines.push(freshPick('race-pack-1', [
                    `${packBits[0]} led the chasing pack home.`,
                    `Closest to the podium party: ${packBits[0]}.`,
                    `${packBits[0]} headed the rest of the points scorers.`,
                ]));
            } else {
                const last = packBits.pop();
                bodyLines.push(freshPick('race-pack-many', [
                    `Behind the podium, ${packBits.join(', ')} and ${last} filled out the points-paying positions.`,
                    `${packBits.join(', ')} and ${last} took the remaining points home.`,
                    `The rest of the top runners: ${packBits.join(', ')} and ${last}.`,
                ]));
            }
        }

        // ---- Big faller: someone who qualified well and slipped out of the front ----
        if (bigFaller && bigFaller.driver_id !== winner.driver_id) {
            const fnm = esc(driverName(bigFaller));
            const ftm = teamOf(bigFaller) ? esc(teamOf(bigFaller)) : null;
            bodyLines.push(freshPick('race-faller', [
                `Tough afternoon for <strong>${fnm}</strong>${ftm ? ` of ${ftm}` : ''}, who started P${bigFaller._qualiPos} but slipped to P${bigFaller.finish_position} by the flag, ${Math.abs(bigFaller._gained)} places shed.`,
                `<strong>${fnm}</strong>${ftm ? ` (${ftm})` : ''} went the other way: a P${bigFaller._qualiPos} grid slot turned into P${bigFaller.finish_position}, losing ${Math.abs(bigFaller._gained)} places in the process.`,
                `Spare a thought for <strong>${fnm}</strong>${ftm ? ` of ${ftm}` : ''}, who dropped from P${bigFaller._qualiPos} on the grid to P${bigFaller.finish_position} at the flag — ${Math.abs(bigFaller._gained)} positions surrendered.`,
            ]));
        }

        if (driveOfRace && driveOfRace.driver_id !== winner.driver_id) {
            bodyLines.push(freshPick('race-dor', [
                `The drive of the day, though, belonged to <strong>${esc(driverName(driveOfRace))}</strong>: P${driveOfRace._qualiPos} on the grid, P${driveOfRace.finish_position} at the flag, ${driveOfRace._gained} places gained.`,
                `<strong>${esc(driverName(driveOfRace))}</strong> stole the eye in ${esc(label)}, climbing from P${driveOfRace._qualiPos} on the grid to P${driveOfRace.finish_position} at the chequered flag.`,
                `Save a thought for <strong>${esc(driverName(driveOfRace))}</strong>, who turned a P${driveOfRace._qualiPos} grid slot into a P${driveOfRace.finish_position} finish, ${driveOfRace._gained} places gained.`,
                `Buried at P${driveOfRace._qualiPos} on the grid, <strong>${esc(driverName(driveOfRace))}</strong> punched his way up to P${driveOfRace.finish_position} by the chequered flag, the kind of recovery that wins midfield hearts.`,
                `If anyone walked out of ${esc(label)} with something to show the cameras, it was <strong>${esc(driverName(driveOfRace))}</strong>: ${driveOfRace._gained} places clawed back, P${driveOfRace._qualiPos} on the grid turned into P${driveOfRace.finish_position} at the flag.`,
            ]));
        }

        // ---- Second-best climber: another mover worth a one-liner ----
        if (secondClimber && secondClimber.driver_id !== winner.driver_id
                          && driveOfRace && secondClimber.driver_id !== driveOfRace.driver_id) {
            const sc = secondClimber;
            const scTeam = teamOf(sc) ? esc(teamOf(sc)) : null;
            bodyLines.push(freshPick('race-second-climber', [
                `Not far behind in the recovery stakes, ${esc(driverName(sc))}${scTeam ? ` of ${scTeam}` : ''} hauled in ${sc._gained} places of his own to finish P${sc.finish_position}.`,
                `${esc(driverName(sc))}${scTeam ? ` (${scTeam})` : ''} matched the mood, climbing ${sc._gained} spots from P${sc._qualiPos} to P${sc.finish_position}.`,
                `${esc(driverName(sc))}${scTeam ? ` of ${scTeam}` : ''} added another comeback story, P${sc._qualiPos} to P${sc.finish_position} for ${sc._gained} places gained.`,
            ]));
        }

        // ---- Casualties: now with names rather than bare counts ----
        if (dnf || dsq) {
            const nameOf = (rd) => {
                const nm = esc(driverName(rd));
                const tn = teamOf(rd) ? ` (${esc(teamOf(rd))})` : '';
                return `${nm}${tn}`;
            };
            const joinList = (arr) => {
                if (arr.length === 0) return '';
                if (arr.length === 1) return arr[0];
                const last = arr[arr.length - 1];
                return arr.slice(0, -1).join(', ') + ' and ' + last;
            };
            const dnfNames = dnfDrivers.map(nameOf);
            const dsqNames = dsqDrivers.map(nameOf);
            if (dnfNames.length && dsqNames.length) {
                bodyLines.push(freshPick('race-cas-both', [
                    `The race claimed its scalps too: ${joinList(dnfNames)} did not see the flag, while ${joinList(dsqNames)} ${dsqNames.length === 1 ? 'was' : 'were'} ruled out of the result by the stewards.`,
                    `Casualty list: ${joinList(dnfNames)} retired and ${joinList(dsqNames)} ${dsqNames.length === 1 ? 'was' : 'were'} disqualified.`,
                ]));
            } else if (dnfNames.length) {
                const fmt = joinList(dnfNames);
                bodyLines.push(freshPick('race-cas-dnf', [
                    `${dnfNames.length === 1 ? 'Retirement' : 'Retirements'} for ${fmt} thinned the field.`,
                    `Not everyone saw the chequered flag: ${fmt} ${dnfNames.length === 1 ? 'retired' : 'all retired'}.`,
                    `${fmt} ${dnfNames.length === 1 ? "didn't" : "didn't all"} make the finish.`,
                    `The race took its toll: ${fmt} ${dnfNames.length === 1 ? 'pulled' : 'all pulled'} out before the flag.`,
                ]));
            } else if (dsqNames.length) {
                const fmt = joinList(dsqNames);
                bodyLines.push(freshPick('race-cas-dsq', [
                    `Stewards' room afterwards: ${fmt} ${dsqNames.length === 1 ? 'was' : 'were'} stripped of the result.`,
                    `${dsqNames.length === 1 ? 'Disqualification' : 'Disqualifications'} for ${fmt} reshaped the back end of the order.`,
                    `${fmt} ${dsqNames.length === 1 ? 'was' : 'were'} thrown out of the result post-race.`,
                ]));
            }
        }

        // ---- Closing beat: how the race felt overall (orderly vs chaotic) ----
        const significantMovers = finishers.filter(rd => rd._gained != null && Math.abs(rd._gained) >= 3).length;
        if (chaosScore >= 2.5 && finishers.length >= 5) {
            bodyLines.push(freshPick('race-close-chaos', [
                `The grid bore little resemblance to the result; ${significantMovers} drivers moved three places or more across the race.`,
                `Whatever the grid promised, the race delivered something else: ${significantMovers} drivers finished three or more places from where they started.`,
                `Few drivers ended where they began. The order shuffled all afternoon, with ${significantMovers} significant movers in the classification.`,
            ]));
        } else if (chaosScore <= 0.9 && finishers.length >= 5) {
            bodyLines.push(freshPick('race-close-orderly', [
                `Up and down the order, most drivers held station — qualifying form was largely the result.`,
                `An orderly race in that respect: the grid was a strong predictor of the flag.`,
                `Few real surprises through the field. Most drivers came home roughly where the grid suggested.`,
            ]));
        }

        // Two paragraphs per split: headline result, then the deeper read.
        if (headLines.length) html.push(`<p>${headLines.join(' ')}</p>`);
        if (bodyLines.length) html.push(`<p>${bodyLines.join(' ')}</p>`);
    });

    // ---- Pull quote: the line worth pulling out ----
    let pullQuote = null;
    if (heroSplit?.grandSlam) {
        pullQuote = `Pole, fastest lap, the win. The full set for ${esc(driverName(heroSplit.winner))} at ${esc(circuit)}.`;
    } else if (leadChanged && leaderNow) {
        pullQuote = `There is a new name at the top.`;
    } else if (heroSplit?.poleToFlag) {
        pullQuote = `Pole to flag. ${esc(driverName(heroSplit.winner))} ran ${esc(circuit)} on his terms.`;
    } else if (heroSplit?.comebackWin) {
        const w = heroSplit.winner;
        pullQuote = `From P${w._qualiPos} to P1. ${esc(driverName(w))} won ${esc(circuit)} the hard way.`;
    } else if (heroSplit?.driveOfRace) {
        const dor = heroSplit.driveOfRace;
        pullQuote = `From P${dor._qualiPos} to P${dor.finish_position}. ${esc(driverName(dor))} stole a headline he hadn't earned at lights-out.`;
    }
    if (pullQuote) html.push(`<blockquote class="pull-quote">${pullQuote}</blockquote>`);

    // ---- Championship ----
    if (standingsNow.length) {
        html.push(`<div class="kicker">The Title Race</div><h2>Championship Standings</h2>`);
        const second = standingsNow[1];
        const gap = second ? (Number(leaderNow.points) - Number(second.points)) : 0;
        let openLine;
        if (isFirstRound) {
            openLine = pickOne([
                `Round one is in the books, and <strong>${esc(leaderNow.driver_name)}</strong> sets the early benchmark on <strong>${fmtPoints(leaderNow.points)}</strong> points${second ? `, ${fmtPoints(gap)} clear of ${esc(second.driver_name)}` : ''}.`,
                `The first championship table of ${esc(seasonLabel)} reads <strong>${esc(leaderNow.driver_name)}</strong>${second ? ` from ${esc(second.driver_name)}` : ''}, the opening round handing <strong>${fmtPoints(leaderNow.points)}</strong> points to the new leader.`,
                `A title fight needs a first leader, and ${esc(seasonLabel)} found one in <strong>${esc(leaderNow.driver_name)}</strong>, ${fmtPoints(leaderNow.points)} points on the board after the opener${second ? `, ${fmtPoints(gap)} ahead of ${esc(second.driver_name)}` : ''}.`,
            ]);
        } else if (leadChanged) {
            openLine = pickOne([
                `There is a new name at the top of ${esc(seasonLabel)}. <strong>${esc(leaderNow.driver_name)}</strong> takes the lead from ${esc(priorLeaderName || 'the previous leader')}, moving to <strong>${fmtPoints(leaderNow.points)}</strong> points${second && second.driver_id !== leaderNow.driver_id ? `; ${esc(second.driver_name)} now sits second on ${fmtPoints(second.points)}` : ''}.`,
                `The title picture has been rewritten. <strong>${esc(leaderNow.driver_name)}</strong> overhauls ${esc(priorLeaderName || 'the previous leader')} at the top of ${esc(seasonLabel)}, the new leader on <strong>${fmtPoints(leaderNow.points)}</strong> points after Round ${event.round}.`,
                `${esc(priorLeaderName || 'The previous leader')} is no longer the man to beat in ${esc(seasonLabel)}. <strong>${esc(leaderNow.driver_name)}</strong> takes the championship lead on <strong>${fmtPoints(leaderNow.points)}</strong> points, the title race officially flipped.`,
            ]);
        } else {
            const priorGap = (() => {
                if (!second) return null;
                const lp = priorByDriver.get(leaderNow.driver_id) || 0;
                const sp = priorByDriver.get(second.driver_id) || 0;
                return lp - sp;
            })();
            const widened = priorGap != null && second && gap > priorGap + 1;
            const narrowed = priorGap != null && second && gap < priorGap - 1;
            if (widened) {
                openLine = pickOne([
                    `<strong>${esc(leaderNow.driver_name)}</strong> stretches the championship lead to <strong>${fmtPoints(leaderNow.points)}</strong> points, the gap to ${esc(second.driver_name)} now ${fmtPoints(gap)} after Round ${event.round}.`,
                    `The leader pulls clear. <strong>${esc(leaderNow.driver_name)}</strong> heads ${esc(seasonLabel)} on <strong>${fmtPoints(leaderNow.points)}</strong> points, ${fmtPoints(gap)} ahead of ${esc(second.driver_name)}, the buffer growing.`,
                    `<strong>${esc(leaderNow.driver_name)}</strong> extends his cushion. <strong>${fmtPoints(leaderNow.points)}</strong> points at the top of the table, ${fmtPoints(gap)} clear of ${esc(second.driver_name)}.`,
                ]);
            } else if (narrowed) {
                openLine = pickOne([
                    `<strong>${esc(leaderNow.driver_name)}</strong> holds the championship lead on <strong>${fmtPoints(leaderNow.points)}</strong> points, but the gap to ${esc(second.driver_name)} has shrunk to ${fmtPoints(gap)} and the chase is on.`,
                    `The points lead is no longer comfortable. <strong>${esc(leaderNow.driver_name)}</strong> stays at the top on <strong>${fmtPoints(leaderNow.points)}</strong>, with ${esc(second.driver_name)} closing to within ${fmtPoints(gap)}.`,
                    `<strong>${esc(leaderNow.driver_name)}</strong> keeps the lead, but only just. ${esc(second.driver_name)} has clawed it back to ${fmtPoints(gap)} points, and ${esc(seasonLabel)} suddenly looks live.`,
                ]);
            } else {
                openLine = pickOne([
                    `<strong>${esc(leaderNow.driver_name)}</strong> keeps the championship lead on <strong>${fmtPoints(leaderNow.points)}</strong> points${second ? `, ${fmtPoints(gap)} ahead of ${esc(second.driver_name)}` : ''}.`,
                    `Status quo at the top of ${esc(seasonLabel)}: <strong>${esc(leaderNow.driver_name)}</strong> on <strong>${fmtPoints(leaderNow.points)}</strong> points${second ? `, ${fmtPoints(gap)} clear of ${esc(second.driver_name)}` : ''}.`,
                    `<strong>${esc(leaderNow.driver_name)}</strong> sleeps on the championship lead again, the table reading <strong>${fmtPoints(leaderNow.points)}</strong> at the top${second ? ` and ${esc(second.driver_name)} ${fmtPoints(gap)} back` : ''}.`,
                ]);
            }
        }
        html.push(`<p>${openLine}</p>`);

        const top5 = standingsNow.slice(0, 5);
        html.push(`<table>
            <thead><tr><th>#</th><th>Driver</th><th>Team</th><th style="text-align:right">Pts</th></tr></thead>
            <tbody>
            ${top5.map((sRow, i) => `<tr>
                <td>${i + 1}</td>
                <td>${esc(sRow.driver_name)}</td>
                <td style="color:rgba(255,255,255,0.55)">${esc(sRow.team_name || '')}</td>
                <td style="text-align:right;font-weight:700">${fmtPoints(sRow.points)}</td>
            </tr>`).join('')}
            </tbody>
        </table>`);
    }

    // ---- Constructors ----
    if (teamStandingsNow.length) {
        html.push(`<div class="kicker">Constructors</div><h2>The Team Battle</h2>`);
        // teamStandingsNow is already sorted with the standings page's comparator.
        const teamSorted = teamStandingsNow.slice();
        const teamLeader = teamSorted[0];
        const teamSecond = teamSorted[1];
        if (teamLeader) {
            const teamPriorTop = Array.from(priorByTeam.entries()).sort((a, b) => b[1] - a[1])[0];
            const stayed = teamPriorTop && teamLeader.team_id === teamPriorTop[0];
            let teamLine;
            if (!teamPriorTop) {
                teamLine = pickOne([
                    `<strong>${esc(teamLeader.team_name)}</strong> set the early benchmark in the constructors' race on <strong>${fmtPoints(teamLeader.points)}</strong> points${teamSecond ? `, with ${esc(teamSecond.team_name)} in close pursuit on ${fmtPoints(teamSecond.points)}` : ''}.`,
                    `The first constructors' lead of ${esc(seasonLabel)} belongs to <strong>${esc(teamLeader.team_name)}</strong>, ${fmtPoints(teamLeader.points)} points on the board after the opener${teamSecond ? ` and ${esc(teamSecond.team_name)} the first challenger` : ''}.`,
                ]);
            } else if (stayed) {
                teamLine = pickOne([
                    `<strong>${esc(teamLeader.team_name)}</strong> keep the constructors' lead on <strong>${fmtPoints(teamLeader.points)}</strong> points${teamSecond ? `, ${fmtPoints(Number(teamLeader.points) - Number(teamSecond.points))} ahead of ${esc(teamSecond.team_name)}` : ''}.`,
                    `Up and down the constructors' table, the top line stays the same. <strong>${esc(teamLeader.team_name)}</strong> head it on <strong>${fmtPoints(teamLeader.points)}</strong> points${teamSecond ? ` from ${esc(teamSecond.team_name)}` : ''}.`,
                    `<strong>${esc(teamLeader.team_name)}</strong> retain the constructors' lead, ${fmtPoints(teamLeader.points)} points the figure to match.`,
                ]);
            } else {
                const priorName = teamSorted.find(t => t.team_id === teamPriorTop[0])?.team_name || 'the previous leader';
                teamLine = pickOne([
                    `<strong>${esc(teamLeader.team_name)}</strong> climb above ${esc(priorName)} in the constructors' fight, the round ending with them on <strong>${fmtPoints(teamLeader.points)}</strong> points.`,
                    `There is a new top of the constructors' table too. <strong>${esc(teamLeader.team_name)}</strong> overhaul ${esc(priorName)} on <strong>${fmtPoints(teamLeader.points)}</strong> points after Round ${event.round}.`,
                    `<strong>${esc(teamLeader.team_name)}</strong> leapfrog ${esc(priorName)} at the top of the constructors' table, the team title race suddenly louder than it was.`,
                ]);
            }
            html.push(`<p>${teamLine}</p>`);
        }
        const teamTop5 = teamSorted.slice(0, 5);
        html.push(`<table>
            <thead><tr><th>#</th><th>Team</th><th style="text-align:right">Wins</th><th style="text-align:right">Pts</th></tr></thead>
            <tbody>
            ${teamTop5.map((t, i) => `<tr>
                <td>${i + 1}</td>
                <td>${esc(t.team_name)}</td>
                <td style="text-align:right">${t.wins || 0}</td>
                <td style="text-align:right;font-weight:700">${fmtPoints(t.points)}</td>
            </tr>`).join('')}
            </tbody>
        </table>`);
    }

    // ---- Closer ----
    html.push(`<div class="kicker">Looking Ahead</div><h2>Onwards</h2>`);
    const closerOpts = [
        `Round ${event.round} is in the book. The paddock packs up, the data goes home, and ${esc(seasonLabel)} rolls on with a story slightly rewritten.`,
        leaderNow ? `${esc(leaderNow.driver_name)} carries the points lead into the next round, but on the evidence of ${esc(circuit)}, nobody at the top is sleeping easy.` : `The series moves on, and the fight does with it.`,
        `Plenty to take away from ${esc(circuit)}. Plenty more to come, with the championship far from settled.`,
        `One round closer to crowning a champion. On the evidence of this one, the rest of ${esc(seasonLabel)} will not lack for drama.`,
        `The lights go out again before long. Until then, the results from ${esc(circuit)} will keep the paddock arguing about them.`,
    ];
    html.push(`<p class="closer"><em>${pickOne(closerOpts)}</em></p>`);

    // Excerpt: a tight single sentence keyed to the headline
    let excerpt;
    if (heroSplit?.grandSlam) {
        excerpt = `${driverName(heroSplit.winner)} sweeps pole, fastest lap and the win at ${circuit} as Round ${event.round} of ${seasonLabel} delivers a near-perfect afternoon.`;
    } else if (leadChanged && leaderNow) {
        excerpt = `${leaderNow.driver_name} takes over the ${seasonLabel} championship lead after a pivotal Round ${event.round} at ${circuit}.`;
    } else if (heroSplit?.poleToFlag) {
        excerpt = `${driverName(heroSplit.winner)} converts pole to chequered flag at ${circuit} as Round ${event.round} unfolds in commanding fashion.`;
    } else if (heroSplit?.comebackWin) {
        const w = heroSplit.winner;
        excerpt = `${driverName(w)} charges from P${w._qualiPos} on the grid to win Round ${event.round} at ${circuit}, the comeback story of ${seasonLabel}.`;
    } else if (heroSplit?.driveOfRace) {
        excerpt = `${driverName(heroSplit.driveOfRace)} climbs ${heroSplit.driveOfRace._gained} places at ${circuit} to steal the headlines from Round ${event.round} of ${seasonLabel}.`;
    } else if (heroSplit) {
        excerpt = `${driverName(heroSplit.winner)} takes Round ${event.round} honours at ${circuit}${leaderNow ? `, with ${leaderNow.driver_name} leading the championship on ${fmtPoints(leaderNow.points)} points` : ''}.`;
    } else {
        excerpt = `Round ${event.round} of ${seasonLabel} from ${circuit}.`;
    }

    const slugBase = (event.slug || `round-${event.round}-${event.name}`).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return {
        title: reportTitle,
        slug:  `report-${slugBase}`,
        excerpt,
        body:  html.join('\n'),
    };
}

function openReportEditor(eventId, eventName, draft, data) {
    const body = `
        <p style="color:var(--muted);font-size:0.84rem;margin-bottom:0.85rem">Edit anything you like before publishing. Saves into the News section tagged as a Race Report.</p>
        <form id="entity-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" name="title" value="${esc(draft.title)}" required>
                </div>
                <div class="form-group">
                    <label>Slug <span class="required">*</span></label>
                    <input type="text" name="slug" value="${esc(draft.slug)}" required>
                </div>
            </div>
            <div class="form-group">
                <label>Excerpt</label>
                <textarea name="excerpt" rows="2">${esc(draft.excerpt)}</textarea>
            </div>
            <div class="form-group">
                <label>Cover Image URL <span style="color:var(--muted);font-weight:normal;font-size:0.72rem">(leave blank to use the GTEC mark)</span></label>
                <input type="url" name="cover_url" placeholder="https://…">
            </div>

async function saveRaceReport(publishNow) {
    const d = getFormData('entity-form');
    if (!d.title || !d.slug) { toast('Title and slug are required.', 'error'); return; }
    const payload = {
        title:        d.title,
        slug:         d.slug,
        author:       d.author || 'GTEC Editorial',
        excerpt:      d.excerpt || null,
        cover_url:    d.cover_url || null,
        body:         d.body || '',
        tags:         ['race-report'],
        is_published: !!publishNow,
        published_at: publishNow ? new Date().toISOString() : null,
        updated_at:   new Date().toISOString(),
    };
    const { error } = await sb.from('news').insert(payload);
    if (error) {
        // Likely a slug clash — append a timestamp suffix.
        if (String(error.message).includes('duplicate')) {
            payload.slug = `${payload.slug}-${Date.now().toString(36).slice(-5)}`;
            const retry = await sb.from('news').insert(payload);
            if (retry.error) { toast(retry.error.message, 'error'); return; }
        } else {
            toast(error.message, 'error');
            return;
        }
    }
    toast(publishNow ? 'Race report published to News.' : 'Draft saved.', 'success');
    closeModal();
}

function loadEntryDriversForSteward(sel) {
    const driverSel = document.getElementById('sd-driver');
    driverSel.innerHTML = '<option value="">— Whole team / N/A —</option>';
    const entry = (window._stewardEntries || []).find(e => e.id === sel.value);
    if (!entry) return;
    (entry.entry_drivers || []).forEach(ed => {
        if (!ed.drivers) return;
        const opt = document.createElement('option');
        opt.value = ed.driver_id;
        opt.textContent = ed.drivers.display_name;
        driverSel.appendChild(opt);
    });

async function sendApplicationEmail(applicationId, emailType) {
    if (!confirm(`Send the ${emailType} email to this applicant?`)) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { toast('Not signed in.', 'error'); return; }

    toast('Sending…', 'success');
    try {
        const res = await fetch('/.netlify/functions/send-application-email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ application_id: applicationId, email_type: emailType }),
        });
        const text = await res.text();
        let payload = {};
        try { payload = JSON.parse(text); } catch {}
        if (!res.ok) {
            toast(`Email failed: ${payload.error || text || res.status}`, 'error');
            return;
        }
        toast(`${emailType.charAt(0).toUpperCase()+emailType.slice(1)} email sent.`, 'success');
        await viewApplication(applicationId);
    } catch (err) {
        toast(`Email failed: ${err.message}`, 'error');
    }
}

async function saveDriverFromApplication(appId) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkDriverNameUnique(d.display_name, null);
    if (dupName) { toast(dupName, 'error'); return; }
    const num = checkCareerNumber(d.career_number, null);
    if (!num.ok) { toast(num.error, 'error'); return; }

    // If a driver with this PSN already exists, link the application to
    // them instead of creating a duplicate. PSN match is case-insensitive,
    // trimmed — same as the DB unique index in migration 43.
    const psnKey = (d.psn_id || '').trim().toLowerCase();
    if (psnKey) {
        const { data: existing } = await sb.from('drivers')
            .select('id, display_name')
            .ilike('psn_id', d.psn_id.trim())
            .maybeSingle();
        if (existing) {
            await sb.from('applications').update({ linked_driver_id: existing.id }).eq('id', appId);
            toast(`PSN "${d.psn_id}" already belongs to ${existing.display_name} — linked to them instead.`, 'success');
            closeModal();
            await loadCache();
            await renderApplications();
            return;
        }
    }

    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        discord_username: d.discord_username || null,
        nationality: d.nationality, career_number: num.value,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
        gt7_dr_rating: d.gt7_dr_rating || null, gt7_sr_rating: d.gt7_sr_rating || null,
    };
    const { data: created, error } = await sb.from('drivers').insert(payload).select('id').single();
    if (error) { toast(error.message, 'error'); return; }
    const { error: linkErr } = await sb.from('applications')
        .update({ linked_driver_id: created.id })
        .eq('id', appId);
    if (linkErr) { toast(`Driver created, but link failed: ${linkErr.message}`, 'error'); }
    else { toast('Driver added and linked to application.', 'success'); }
    closeModal();
    await loadCache();
    await renderApplications();
}

async function saveTeamFromApplication(appId) {
    const d = getFormData('entity-form');
    if (!d.name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkTeamNameUnique(d.name, null);
    if (dupName) { toast(dupName, 'error'); return; }

    // Load the application — we'll spin up the applicant as the team leader.
    const { data: app } = await sb.from('applications').select('*').eq('id', appId).single();

    // 1. Create the team
    const teamPayload = { name: d.name, slug: d.slug, manufacturer_id: d.manufacturer_id || null, home_country: d.home_country, founded_on: d.founded_on, bio: d.bio };
    const { data: createdTeam, error: teamErr } = await sb.from('teams').insert(teamPayload).select('id').single();
    if (teamErr) { toast(teamErr.message, 'error'); return; }

    // 2. Try to make the applicant the team leader. If they already exist
    //    as a driver (matched by PSN, case-insensitive), reuse them rather
    //    than creating a duplicate — the DB unique index in migration 43
    //    would reject it anyway, and we want the existing user account /
    //    career number / history to stay intact.
    let leaderDriverId = null;
    let leaderReused   = false;
    if (app?.name) {
        if (app.psn_id && app.psn_id.trim()) {
            const { data: existing } = await sb.from('drivers')
                .select('id, current_team_id')
                .ilike('psn_id', app.psn_id.trim())
                .maybeSingle();
            if (existing) {
                leaderDriverId = existing.id;
                leaderReused   = true;
                // They applied as a team, so they want to be on this team —
                // move them regardless of where they were before. The trigger
                // from migration 42 cleans up any pending join requests, and
                // migration 39's capacity trigger lets us through since the
                // brand-new team has zero drivers.
                await sb.from('drivers').update({ current_team_id: createdTeam.id }).eq('id', existing.id);
                await sb.from('teams').update({ leader_driver_id: leaderDriverId }).eq('id', createdTeam.id);
                await sb.from('applications').update({ linked_driver_id: leaderDriverId }).eq('id', appId);
            }
        }
        if (!leaderDriverId) {
            const slugify = s => (s || '').toLowerCase().trim()
                .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            const driverPayload = {
                display_name: app.name,
                slug: slugify(app.name),
                psn_id: app.psn_id || null,
                discord_username: app.discord_username || null,
                nationality: app.nationality || null,
                gt7_dr_rating: app.gt7_dr_rating || null,
                gt7_sr_rating: app.gt7_sr_rating || null,
                current_team_id: createdTeam.id,
                joined_at: new Date().toISOString().slice(0, 10),
            };
            const { data: createdDriver, error: drvErr } = await sb.from('drivers').insert(driverPayload).select('id').single();
            if (!drvErr && createdDriver) {
                leaderDriverId = createdDriver.id;
                await sb.from('teams').update({ leader_driver_id: leaderDriverId }).eq('id', createdTeam.id);
                await sb.from('applications').update({ linked_driver_id: leaderDriverId }).eq('id', appId);
            } else if (drvErr) {
                console.warn('Driver creation skipped:', drvErr.message);
            }
        }
    }

    // 3. Link the team to the application
    const { error: linkErr } = await sb.from('applications')
        .update({ linked_team_id: createdTeam.id })
        .eq('id', appId);
    if (linkErr) { toast(`Team created, but link failed: ${linkErr.message}`, 'error'); }
    else {
        const msg = !leaderDriverId          ? 'Team created.'
                   : leaderReused             ? 'Team created — existing driver set as team leader.'
                                              : 'Team created — applicant added as team leader.';
        toast(msg, 'success');
    }
    closeModal();
    await loadCache();
    await renderApplications();
}

async function renderMessages() {
    const { data, error } = await sb.from('driver_contact_messages')
        .select('*, drivers(id, display_name, slug, psn_id)')
        .order('created_at', { ascending: false });
    if (error) { toast(error.message, 'error'); return; }

    const statusBadge = {
        new:         '<span class="badge badge-yellow">New</span>',
        in_progress: '<span class="badge badge-gold">In Progress</span>',
        resolved:    '<span class="badge badge-green">Resolved</span>',
        dismissed:   '<span class="badge badge-muted">Dismissed</span>',
    };
    const counts = { new:0, in_progress:0, resolved:0, dismissed:0 };
    (data || []).forEach(m => counts[m.status] = (counts[m.status]||0) + 1);

    const fmtWhen = iso => iso ? new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

    // Collapse broadcasts: one row per (broadcast_by, created_at second, subject)
    // — otherwise a single "Message All Drivers" send fills the list with one
    // row per recipient and reads as if those drivers were the senders.
    const broadcastGroups = {};
    const visibleRows = [];
    (data || []).forEach(m => {
        if (m.is_broadcast) {
            const key = `${m.broadcast_by || ''}|${(m.created_at || '').slice(0, 19)}|${m.subject || ''}`;
            (broadcastGroups[key] = broadcastGroups[key] || []).push(m);
        } else {
            visibleRows.push(m);
        }
    });
    const broadcastRowKeys = Object.keys(broadcastGroups).sort((a, b) => {
        const ta = broadcastGroups[a][0].created_at;
        const tb = broadcastGroups[b][0].created_at;
        return tb.localeCompare(ta);
    });

    const broadcastTableRows = broadcastRowKeys.map(k => {
        const groupRows = broadcastGroups[k];
        const m = groupRows[0];
        const ids = groupRows.map(g => g.id).join(',');
        return `
            <tr>
                <td><span class="badge badge-gold" style="margin-right:0.35rem">Broadcast</span><strong>${groupRows.length} driver${groupRows.length === 1 ? '' : 's'}</strong></td>
                <td class="td-muted" style="font-size:0.84rem">${esc(m.subject) || '<em>No subject</em>'}</td>
                <td class="td-muted" style="font-size:0.82rem;max-width:340px">${esc((m.message || '').slice(0, 120))}${(m.message || '').length > 120 ? '…' : ''}</td>
                <td><span class="badge badge-gold">Broadcast</span></td>
                <td class="td-muted" style="font-size:0.78rem;white-space:nowrap">${fmtWhen(m.created_at)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="viewMessage('${m.id}')">View</button>
                    <button class="btn-icon danger" onclick="deleteBroadcastGroup('${ids}', ${groupRows.length})">Delete All</button>
                </div></td>
            </tr>`;
    }).join('');

    const otherRows = visibleRows.map(m => {
        const kindBadge = m.is_direct
            ? '<span class="badge badge-gold" style="margin-right:0.35rem">Admin → Driver</span>'
            : '';
        const replyChip = m.driver_reply
            ? ' <span class="badge" style="background:rgba(56,189,248,0.15);color:#38bdf8;margin-left:0.35rem">Reply</span>'
            : '';
        return `
            <tr>
                <td>${kindBadge}<strong>${esc(m.drivers?.display_name) || '—'}</strong>${replyChip}${m.drivers?.psn_id ? `<br><small class="td-muted">${esc(m.drivers.psn_id)}</small>` : ''}</td>
                <td class="td-muted" style="font-size:0.84rem">${esc(m.subject) || '<em>No subject</em>'}</td>
                <td class="td-muted" style="font-size:0.82rem;max-width:340px">${esc((m.message || '').slice(0, 120))}${(m.message || '').length > 120 ? '…' : ''}</td>
                <td>${statusBadge[m.status] || esc(m.status)}</td>
                <td class="td-muted" style="font-size:0.78rem;white-space:nowrap">${fmtWhen(m.created_at)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="viewMessage('${m.id}')">View</button>
                    <button class="btn-icon danger" onclick="deleteMessage('${m.id}')">Delete</button>
                </div></td>
            </tr>`;
    }).join('');

    const rows = (broadcastTableRows + otherRows) || `<tr><td colspan="6"><div class="empty-state">No messages from drivers yet.</div></td></tr>`;

    document.getElementById('content').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:0.75rem;flex-wrap:wrap">
            <div style="font-size:0.85rem;color:var(--muted)">Drivers can write to admins from their portal; replies show in their inbox. Message one driver or broadcast to all.</div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <button class="btn btn-ghost" onclick="openDirectMessageModal()">Message Driver</button>
                <button class="btn btn-primary" onclick="openBroadcastModal()">Message All Drivers</button>
            </div>
        </div>
        <div class="stat-grid" style="margin-bottom:1.5rem">
            <div class="stat-card${counts.new > 0 ? ' stat-card-alert' : ''}"><div class="stat-card-label">New</div><div class="stat-card-value">${counts.new}</div></div>
            <div class="stat-card"><div class="stat-card-label">In Progress</div><div class="stat-card-value">${counts.in_progress}</div></div>
            <div class="stat-card"><div class="stat-card-label">Resolved</div><div class="stat-card-value">${counts.resolved}</div></div>
            <div class="stat-card"><div class="stat-card-label">Dismissed</div><div class="stat-card-value">${counts.dismissed}</div></div>
        </div>
        <div class="table-wrap" style="max-height:62vh;overflow-y:auto">
            <table><thead style="position:sticky;top:0;background:var(--bg-1);z-index:2"><tr>
                <th>Driver</th><th>Subject</th><th>Message</th><th>Status</th><th>Sent</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

    if (phrase !== 'SEND') { toast('Cancelled — phrase did not match.', 'error'); return; }
    const { data, error } = await sb.rpc('broadcast_message_to_drivers', {
        p_subject: d.subject || null,
        p_message: d.message,
    });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not send.', 'error'); return; }
    toast(`Broadcast sent to ${data.count} driver${data.count === 1 ? '' : 's'}.`, 'success');
