async function viewEventPenalties(eventId, eventName) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading penalties…</div>';

    const { data, error } = await sb.from('penalties')
        .select('*, entries(car_number, teams(name)), drivers(display_name)')
        .eq('event_id', eventId)
        .order('created_at');
    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    const rows = (data || []).length === 0
        ? `<tr><td colspan="6"><div class="empty-state">No penalties recorded for this event.</div></td></tr>`
        : data.map(p => `<tr>
            <td>${p.entries ? `${p.entries.car_number != null ? '<strong>#' + p.entries.car_number + '</strong> ' : ''}${esc(p.entries.teams?.name || '')}` : '—'}</td>
            <td class="td-muted">${esc(p.drivers?.display_name) || '—'}</td>
            <td><span class="badge badge-gold">${esc(p.penalty_type.replace('_',' '))}</span></td>
            <td class="td-muted">${esc(p.penalty_value) || '—'}</td>
            <td class="td-muted" style="max-width:280px">${esc(p.reason)}</td>
            <td><div class="row-actions">
                <button class="btn-icon danger" onclick="deletePenalty('${p.id}','${eventId}','${esc(eventName)}')">Delete</button>
            </div></td>
        </tr>`).join('');

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Penalties — ${esc(eventName)}</span>
                <button class="btn-add" onclick="openAddPenaltyModal('${eventId}','${esc(eventName)}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Penalty
                </button>
            </div>
            <table><thead><tr>
                <th>Entry</th><th>Driver</th><th>Type</th><th>Value</th><th>Reason</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function openAddPenaltyModal(eventId, eventName) {
    const { data: entries } = await sb.from('entries')
        .select('id, car_number, teams(name), entry_drivers(driver_id, drivers(display_name))')
        .eq('event_id', eventId)
        .order('car_number');

    const entryOpts = (entries || []).map(en => {
        const driverNames = (en.entry_drivers || []).map(ed => ed.drivers?.display_name).filter(Boolean).join(' / ');
        const label = en.teams?.name || driverNames || 'Unnamed entry';
        return `<option value="${esc(en.id)}">${en.car_number != null ? '#' + en.car_number + ' — ' : ''}${esc(label)}</option>`;
    }).join('');

    const penaltyTypes = [
        { value: 'time_add',         label: 'Time Added' },
        { value: 'points_deduction', label: 'Points Deduction' },
        { value: 'dsq',              label: 'DSQ' },
        { value: 'warning',          label: 'Warning' },
        { value: 'reprimand',        label: 'Reprimand' },
    ];

    openModal(`Add Penalty — ${esc(eventName)}`,
        `<form id="entity-form">
            <div class="form-group">
                <label>Entry <span class="required">*</span></label>
                <select id="pen-entry" name="entry_id" required onchange="loadEntryDriversForPenalty(this)">
                    <option value="">— Select Entry —</option>
                    ${entryOpts}
                </select>
            </div>
            <div class="form-group">
                <label>Driver (optional)</label>
                <select name="driver_id" id="pen-driver">
                    <option value="">— Whole team / unspecified —</option>
                </select>
                <div class="form-hint">Select an entry first to populate drivers.</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Type <span class="required">*</span></label>
                    <select name="penalty_type" id="pen-type" onchange="onPenaltyTypeChange(this)">
                        ${penaltyTypes.map(p => `<option value="${esc(p.value)}" ${p.value === 'time_add' ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group" id="pen-value-row">
                    <label>Value</label>
                    <input type="text" name="penalty_value" id="pen-value" placeholder="+10s, 3 places, etc.">
                </div>
            </div>
            <div class="form-group" id="pen-amount-row" style="display:none">
                <label>Points to deduct <span class="required">*</span></label>
                <input type="number" name="points_amount" id="pen-amount" min="1" max="999" placeholder="e.g. 5">
                <div class="form-hint">Subtracted from the driver's season points (and the team's, if the entry has a team).</div>
            </div>
            <div id="pen-dsq-note" style="display:none;padding:0.6rem 0.85rem;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:6px;font-size:0.82rem;color:#fca5a5;margin-bottom:0.85rem">
                DSQ auto-zeroes the driver's points for this round and marks their result as DSQ — no value needed.
            </div>
            <div class="form-group">
                <label>Reason <span class="required">*</span></label>
                <textarea name="reason" placeholder="Causing a collision at turn 3…" required></textarea>
            </div>
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="savePenalty('${eventId}','${esc(eventName)}')">Add Penalty</button>`
    );

    // Cache entries for driver loading
    window._penaltyEntries = entries || [];
}

function loadEntryDriversForPenalty(sel) {
    const entryId = sel.value;
    const driverSel = document.getElementById('pen-driver');
    driverSel.innerHTML = '<option value="">— Whole team / unspecified —</option>';
    const entry = (window._penaltyEntries || []).find(e => e.id === entryId);
    if (!entry) return;
    (entry.entry_drivers || []).forEach(ed => {
        if (!ed.drivers) return;
        const opt = document.createElement('option');
        opt.value = ed.driver_id;
        opt.textContent = ed.drivers.display_name;
        driverSel.appendChild(opt);
    });
}

function onResultStatusChange(sel) {
    const row = sel.closest('tr');
    if (!row) return;
    const classified = sel.value === 'classified';
    row.querySelectorAll('[data-field="finish_position"], [data-field="fastest_lap_point"], [data-field="fastest_lap_time"]').forEach(el => {
        if (classified) {
            el.disabled = false;
        } else {
            if (el.type === 'checkbox') el.checked = false;
            else el.value = '';
            el.disabled = true;
        }
    });
}

function onPenaltyTypeChange(sel) {
    const amountRow = document.getElementById('pen-amount-row');
    const valueRow  = document.getElementById('pen-value-row');
    const dsqNote   = document.getElementById('pen-dsq-note');
    if (amountRow) amountRow.style.display = sel.value === 'points_deduction' ? '' : 'none';
    if (valueRow)  valueRow.style.display  = sel.value === 'dsq' ? 'none' : '';
    if (dsqNote)   dsqNote.style.display   = sel.value === 'dsq' ? '' : 'none';
}

async function savePenalty(eventId, eventName) {
    const d = getFormData('entity-form');
    if (!d.entry_id || !d.penalty_type || !d.reason) {
        toast('Entry, type and reason are required.', 'error'); return;
    }
    let pointsAmount = null;
    if (d.penalty_type === 'points_deduction') {
        const raw = parseInt(d.points_amount, 10);
        if (!raw || raw < 1) {
            toast('Enter the number of points to deduct.', 'error'); return;
        }
        pointsAmount = raw;
    }
    const { error } = await sb.from('penalties').insert({
        event_id: eventId,
        entry_id: d.entry_id,
        driver_id: d.driver_id || null,
        penalty_type: d.penalty_type,
        penalty_value: d.penalty_value || (pointsAmount ? `-${pointsAmount} pts` : null),
        points_amount: pointsAmount,
        reason: d.reason,
        issued_by: currentUser.id,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Penalty added.', 'success');
    closeModal();
    await viewEventPenalties(eventId, eventName);
}

async function deletePenalty(id, eventId, eventName) {
    if (!confirm('Delete this penalty?')) return;
    const { error } = await sb.from('penalties').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Penalty deleted.', 'success');
    await viewEventPenalties(eventId, eventName);
}

async function viewEventSteward(eventId, eventName) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading steward decisions…</div>';

    const { data, error } = await sb.from('steward_decisions')
        .select('*, entries(car_number, teams(name)), drivers(display_name)')
        .eq('event_id', eventId)
        .order('issued_at', { ascending: false });
    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    const rulingBadge = {
        no_action: '<span class="badge badge-muted">No Action</span>',
        reprimand: '<span class="badge badge-gold">Reprimand</span>',
        penalty:   '<span class="badge badge-red">Penalty</span>',
        dsq:       '<span class="badge badge-red">DSQ</span>',
    };

    const rows = !(data || []).length
        ? `<tr><td colspan="6"><div class="empty-state">No steward decisions for this event.</div></td></tr>`
        : data.map(d => `<tr>
            <td class="td-muted">${esc(d.decision_no) || '—'}</td>
            <td><strong>${esc(d.title)}</strong></td>
            <td class="td-muted">${d.entries ? `${d.entries.car_number != null ? '#' + d.entries.car_number + ' ' : ''}${esc(d.entries.teams?.name)}` : '—'}</td>
            <td class="td-muted">${esc(d.drivers?.display_name) || '—'}</td>
            <td>${rulingBadge[d.ruling] || esc(d.ruling)}</td>
            <td><div class="row-actions">
                <button class="btn-icon" onclick="openStewardModal('${eventId}','${esc(eventName)}','${d.id}')">Edit</button>
                <button class="btn-icon danger" onclick="deleteStewardDecision('${d.id}','${eventId}','${esc(eventName)}')">Delete</button>
            </div></td>
        </tr>`).join('');

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Steward Decisions — ${esc(eventName)}</span>
                <button class="btn-add" onclick="openStewardModal('${eventId}','${esc(eventName)}','')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New Decision
                </button>
            </div>
            <table><thead><tr>
                <th>No.</th><th>Title</th><th>Entry</th><th>Driver</th><th>Ruling</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}


// ============================================================
// 14d. Race Report generator
// Pulls qualifying, race + per-driver results, championship before
// and after this event, then templates an HTML article ready to drop
// into the news table. Reads, no writes, until admin hits Publish.
// ============================================================
async function generateRaceReport(eventId, eventName, seasonId) {
    openModal(`Race Report: ${esc(eventName)}`,
        '<div class="loading-state">Building report from results…</div>',
        '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'
    );

    try {
        const data = await fetchRaceReportData(eventId, seasonId);
        if (!data.results.length) {
            document.querySelector('.modal-body').innerHTML =
                `<div class="empty-state">No results recorded for this event yet. Enter race results first.</div>`;
            return;
        }
        const draft = buildRaceReport(data);
        openReportEditor(eventId, eventName, draft, data);
    } catch (err) {
        document.querySelector('.modal-body').innerHTML =
            `<div class="empty-state">Could not build report: ${esc(err.message || String(err))}</div>`;
    }
}

    { keys:['goodwood'], name:'Goodwood Motor Circuit', flag:'🇬🇧', loc:'Chichester, West Sussex, UK', km:'3.860',
      intros:['Goodwood is old England in asphalt form: no chicanes, no unnecessary corners, just a flowing lap through the West Sussex countryside that rewards smoothness above everything else.','The Motor Circuit at Goodwood has barely changed since the 1950s. In GT7 that purity translates into a test of mechanical sympathy and consistent rhythm rather than setup aggression.','Soft walls, smooth surfaces and flowing rhythms. Goodwood is the antidote to modern circuit design. Its narrow track and close barriers make it trickier than its reputation suggests.'],

function _detectCircuit(name) {
    if (!name) return null;
    const l = name.toLowerCase();
    return _PRESEASON_CIRCUITS.find(c => c.keys.some(k => l.includes(k))) || null;
}
function _psPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function _psDateStr(iso) { return iso ? new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : 'TBC'; }
function _psSlug(str) { return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function _psToday() { return new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }

function openPreSeasonModal(seasonId, seasonName) {
    const types = [
        { key:'grid',       icon:'🏁', title:'Grid Reveal',      desc:'Full confirmed driver and team lineup' },
        { key:'calendar',   icon:'📅', title:'Calendar Drop',    desc:'Season schedule with all rounds and circuits' },
        { key:'circuit',    icon:'🗺️', title:'Circuit Guide',   desc:'Detailed GT7 track preview for an event' },
        { key:'contenders', icon:'🏆', title:'Title Contenders', desc:'Five drivers to watch based on GT7 DR and SR rating' },
        { key:'preview',    icon:'📰', title:'Season Preview',   desc:'Full editorial combining calendar, grid and picks' },
    ];
    openModal(`Pre-Season: ${esc(seasonName)}`,
        `<p style="color:var(--muted);font-size:0.84rem;margin-bottom:1.1rem">Generate an article to publish before racing begins.</p>
        <div class="preseason-grid">
            ${types.map(t => `<div class="preseason-card" onclick="generatePreSeasonContent('${t.key}','${seasonId}','${esc(seasonName)}')">
                <div class="preseason-card-icon">${t.icon}</div>
                <div class="preseason-card-title">${esc(t.title)}</div>
                <div class="preseason-card-desc">${esc(t.desc)}</div>
            </div>`).join('')}
        </div>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`
    );
}

async function generatePreSeasonContent(type, seasonId, seasonName) {
    document.querySelector('.modal-body').innerHTML = '<div class="loading-state">Building article…</div>';
    try {
        const data = await _fetchPreSeasonData(seasonId, seasonName);
        if (type === 'circuit') { _openCircuitPicker(data, seasonId, seasonName); return; }
        const map = { grid: _buildGridReveal, calendar: _buildCalendarDrop, contenders: _buildTitleContenders, preview: _buildSeasonPreview };
        const draft = map[type]?.(data);
        if (!draft) throw new Error('Could not build this article type — ensure the season has events and drivers.');
        _openArticleEditor(`Pre-Season: ${esc(seasonName)}`, draft);
    } catch (err) {
        document.querySelector('.modal-body').innerHTML = `<div class="empty-state">Could not build article: ${esc(err.message || String(err))}</div>`;
    }
}

async function _fetchPreSeasonData(seasonId, seasonName) {
    const [seasonRes, eventsRes, teamSeasonsRes] = await Promise.all([
        sb.from('seasons').select('*').eq('id', seasonId).single(),
        sb.from('events').select('id,name,round,circuit_name,starts_at,duration_hours').eq('season_id', seasonId).order('round'),
        sb.from('team_seasons').select('team_id, teams(id,name,manufacturers(name,brand_color))').eq('season_id', seasonId).order('registered_at'),
    ]);
    const season = seasonRes.data || {};
    const events = eventsRes.data || [];
    const teamSeasonRows = teamSeasonsRes.data || [];
    let drivers = [], teams = [], driverRatings = new Map();
    const dMap = new Map(), tMap = new Map();

    // Primary: pull from event entries (works once entries have been created)
    const eventIds = events.map(e => e.id);
    if (eventIds.length) {
        const { data: entries } = await sb.from('entries')
            .select('id,teams(id,name,manufacturers(name,brand_color)),entry_drivers(drivers(id,display_name,career_number,gt7_dr_rating,gt7_sr_rating,bio))')
            .in('event_id', eventIds);
        (entries || []).forEach(en => {
            if (en.teams?.id) tMap.set(en.teams.id, en.teams);
            (en.entry_drivers || []).forEach(ed => { if (ed.drivers?.id) dMap.set(ed.drivers.id, { ...ed.drivers, team: en.teams }); });
        });
    }

    // Fallback: if no entries yet, fetch all drivers + their current team (includes solos)
    if (dMap.size === 0) {
        // Seed tMap from team_seasons so registered teams always appear
        teamSeasonRows.forEach(ts => { if (ts.teams?.id) tMap.set(ts.teams.id, ts.teams); });
        const { data: allDrivers } = await sb.from('drivers')
            .select('id,display_name,career_number,gt7_dr_rating,gt7_sr_rating,bio,current_team_id,teams!current_team_id(id,name,manufacturers(name,brand_color))')
            .order('display_name');
        (allDrivers || []).forEach(d => {
            if (!d.display_name) return; // skip unclaimed slots
            dMap.set(d.id, { ...d, team: d.teams || null });
            if (d.teams?.id) tMap.set(d.teams.id, d.teams);
        });
    }

    drivers = Array.from(dMap.values());
    teams   = Array.from(tMap.values());
    const dIds = drivers.map(d => d.id).filter(Boolean);
    if (dIds.length) {
        const { data: ratings } = await sb.from('driver_current_ratings').select('driver_id,rating').in('driver_id', dIds);
        (ratings || []).forEach(r => driverRatings.set(r.driver_id, r.rating));
    }
    return { season, seasonName, events, drivers, teams, driverRatings };
}

        </form>
        <div style="margin-top:0.85rem;padding:0.85rem 1rem;background:var(--bg-2);border:1px solid var(--border);border-radius:8px">
            <div style="font-size:0.7rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem">Preview</div>
            <div style="max-height:240px;overflow-y:auto;font-size:0.85rem;line-height:1.65">${draft.body}</div>
        </div>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-ghost" onclick="saveRaceReport(false)">Save as Draft</button>
         <button class="btn btn-primary" onclick="saveRaceReport(true)">Publish to News</button>`
    );
}

function _openCircuitPicker(data, seasonId, seasonName) {
    const { events } = data;
    if (!events.length) { document.querySelector('.modal-body').innerHTML = '<div class="empty-state">No events found for this season. Add events first.</div>'; return; }
    document.querySelector('.modal-body').innerHTML = `
        <p style="color:var(--muted);font-size:0.84rem;margin-bottom:1rem">Choose a circuit to generate a guide for:</p>
        <div style="display:flex;flex-direction:column;gap:0.5rem">
            ${events.map(e => `
                <button class="btn btn-ghost" style="text-align:left;justify-content:flex-start;gap:0.75rem"
                    onclick="generateCircuitGuide('${e.id}','${esc(e.circuit_name||e.name)}','${seasonId}','${esc(seasonName)}',${e.round||0})">
                    <span style="color:var(--gold);font-family:'Orbitron',sans-serif;font-size:0.75rem;min-width:2rem">R${e.round}</span>
                    <span style="flex:1">${esc(e.circuit_name||e.name)}</span>
                    <span style="color:var(--muted);font-size:0.78rem">${_psDateStr(e.starts_at)}</span>
                </button>`).join('')}
        </div>`;
}

async function generateCircuitGuide(eventId, circuitName, seasonId, seasonName, round) {
    document.querySelector('.modal-body').innerHTML = '<div class="loading-state">Building circuit guide…</div>';
    try {
        const { data: ev } = await sb.from('events')
            .select('id,name,circuit_name,round,starts_at,duration_hours,weather,time_of_day,time_multiplier,tyre_wear,fuel_consumption,mandatory_pit_stops,required_tyres,bop_enabled,damage_level,slipstream,starting_procedure,refuel_rate_lps,notes,equal_conditions_mode,shortcut_penalty,wall_collision_penalty,car_collision_penalty,ghosting,pit_lane_cutting_penalty')
            .eq('id', eventId).maybeSingle();
        const draft = _buildCircuitGuide(ev || { id:eventId, circuit_name:circuitName, round, starts_at:null, duration_hours:null }, seasonName);
        _openArticleEditor(`Circuit Guide: ${esc(circuitName)}`, draft);
    } catch (err) {
        document.querySelector('.modal-body').innerHTML = `<div class="empty-state">Could not build guide: ${esc(err.message||String(err))}</div>`;
    }
}

function _buildGridReveal({ season, seasonName, drivers, teams }) {
    const dCount = drivers.length, tCount = teams.length;
    if (!dCount) throw new Error('No drivers confirmed yet — add entries to this season\'s events first.');
    const intro = _psPick([
        `The ${seasonName} grid is officially confirmed. ${dCount} driver${dCount===1?'':'s'} across ${tCount} outfit${tCount===1?'':'s'} have locked in their seats for what promises to be the most competitive season in GTEC history.`,
        `After weeks of applications and deliberation, the ${seasonName} lineup is set. ${dCount} racer${dCount===1?'':'s'} will carry their colours into the new season, and the field is stronger than it has ever been.`,
        `The waiting is over. ${dCount} driver${dCount===1?'':'s'} confirmed for ${seasonName}, representing ${tCount} team${tCount===1?'':'s'} in a grid that spans every tier of the ranking from promising newcomers to proven frontrunners.`,
    ]);
    const byTeam = new Map();
    drivers.forEach(d => {
        const k = d.team?.name || '__solo__';
        if (!byTeam.has(k)) byTeam.set(k, { team:d.team, drivers:[] });
        byTeam.get(k).drivers.push(d);
    });
    const sections = Array.from(byTeam.entries()).map(([k, { team, drivers:drvs }]) => {
        const mfr = team?.manufacturers?.name ? ` <span style="color:var(--muted);font-size:0.8rem">· ${esc(team.manufacturers.name)}</span>` : '';
        const hdr = k === '__solo__'
            ? `<div class="stat-card" style="margin:1rem 0 0.5rem"><strong>Independent Entries</strong></div>`
            : `<div class="stat-card" style="margin:1rem 0 0.5rem"><strong>${esc(team.name)}</strong>${mfr}</div>`;
        return hdr + drvs.map(d =>
            `<div style="padding:0.3rem 0 0.3rem 1rem;border-left:2px solid rgba(255,255,255,0.08)">${d.career_number?`<span style="color:var(--gold);font-family:'Orbitron',sans-serif;font-size:0.75rem;margin-right:0.4rem">#${d.career_number}</span>`:''}<strong>${esc(d.display_name)}</strong></div>`
        ).join('');
    }).join('');
    const closer = _psPick([
        'The season begins soon. Every driver on this list has earned their place. Now they have to prove it on track.',
        `Full circuit guides, split previews and race coverage to follow as ${seasonName} builds.`,
        'The grid is set. The countdown has started. See you on track.',
    ]);
    const title = `${seasonName} Grid Confirmed: ${dCount} Driver${dCount===1?'':'s'} Set for the Season`;
    return { title, slug:_psSlug(title), excerpt:intro,
        body:`<p class="kicker">Season Announcement</p>\n<p class="dropcap">${esc(intro)}</p>\n<p class="dateline">GTEC HQ · ${_psToday()}</p>\n${sections}\n<p class="closer">${esc(closer)}</p>` };
}

function _buildCircuitGuide(ev, seasonName) {
    const circuitName = ev.circuit_name || ev.name || 'the venue';
    const c = _detectCircuit(circuitName);
    const displayName = c?.name || circuitName;

    const intro = c
        ? _psPick(c.intros)
        : `${circuitName} is the venue for Round ${ev.round||'?'} of ${seasonName}, a circuit that will test every facet of a driver\'s ability from the opening lap to the last.`;

    const metaLine = c
        ? `<p class="dateline">${c.flag} ${esc(displayName)} · ${esc(c.loc)} · ${c.km} km · ${ev.starts_at ? _psDateStr(ev.starts_at) : 'TBC'}</p>`
        : `<p class="dateline">🏁 ${esc(displayName)} · ${ev.starts_at ? _psDateStr(ev.starts_at) : 'TBC'}</p>`;

    // Race format grid
    const fmtItems = [];
    if (ev.duration_hours) fmtItems.push(`<strong>Duration:</strong> ${ev.duration_hours}h`);
    if (ev.weather)            fmtItems.push(`<strong>Weather:</strong> ${esc(_hcWeather(ev.weather))}`);
    if (ev.time_of_day)        fmtItems.push(`<strong>Start time:</strong> ${esc(_hcTimeOfDay(ev.time_of_day))}${ev.time_multiplier && ev.time_multiplier !== '1x' ? ` <span style="color:var(--muted)">(${esc(ev.time_multiplier)} progression)</span>` : ''}`);
    if (ev.starting_procedure) fmtItems.push(`<strong>Start:</strong> ${esc(_hcStartProc(ev.starting_procedure))}`);
    if (ev.tyre_wear)          fmtItems.push(`<strong>Tyre wear:</strong> ${esc(ev.tyre_wear)}`);
    if (ev.fuel_consumption)   fmtItems.push(`<strong>Fuel:</strong> ${esc(ev.fuel_consumption)}`);
    if (ev.mandatory_pit_stops != null && ev.mandatory_pit_stops > 0) fmtItems.push(`<strong>Mandatory stops:</strong> ${ev.mandatory_pit_stops}`);
    if (ev.slipstream)         fmtItems.push(`<strong>Slipstream:</strong> ${esc(_hcSlipstream(ev.slipstream))}`);
    if (ev.damage_level)       fmtItems.push(`<strong>Damage:</strong> ${esc(_hcDamage(ev.damage_level))}`);
    if (ev.bop_enabled != null) fmtItems.push(`<strong>BoP:</strong> ${ev.bop_enabled ? 'On' : 'Off'}`);
    if (ev.refuel_rate_lps)    fmtItems.push(`<strong>Refuel rate:</strong> ${ev.refuel_rate_lps} L/s`);
    if (ev.required_tyres?.length) fmtItems.push(`<strong>Required tyres:</strong> ${ev.required_tyres.map(esc).join(', ')}`);
    if (ev.equal_conditions_mode != null)   fmtItems.push(`<strong>Equal Conditions Mode:</strong> ${ev.equal_conditions_mode ? 'On' : 'Off'}`);
    if (ev.shortcut_penalty != null)        fmtItems.push(`<strong>Shortcut Penalty:</strong> ${ev.shortcut_penalty ? 'On - Weak' : 'Off'}`);
    if (ev.wall_collision_penalty != null)  fmtItems.push(`<strong>Wall Collision Penalty:</strong> ${ev.wall_collision_penalty ? 'On - Weak' : 'Off'}`);
    if (ev.car_collision_penalty != null)   fmtItems.push(`<strong>Car Collision Penalty:</strong> ${ev.car_collision_penalty ? 'On - Weak' : 'Off'}`);
    if (ev.ghosting != null)                fmtItems.push(`<strong>Ghosting:</strong> ${ev.ghosting ? 'On' : 'Off'}`);
    if (ev.pit_lane_cutting_penalty != null) fmtItems.push(`<strong>Pit Lane Cutting Penalty:</strong> ${ev.pit_lane_cutting_penalty ? 'On' : 'Off'}`);

    const raceFormatHtml = fmtItems.length ? `
        <div style="margin:1.4rem 0">
            <p style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:0.6rem">Race Format</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.35rem 1rem">
                ${fmtItems.map(i => `<div style="font-size:0.875rem;padding:0.3rem 0;border-bottom:1px solid rgba(255,255,255,0.06)">${i}</div>`).join('')}
            </div>
        </div>` : '';

    // Key corners
    const cornersHtml = (c?.corners || []).length ? `
        <div style="margin:1.4rem 0">
            <p style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:0.5rem">Key Corners</p>
            ${c.corners.map(k => `<div style="padding:0.3rem 0 0.3rem 1rem;border-left:2px solid rgba(255,209,102,0.4)">${esc(k)}</div>`).join('')}
        </div>` : '';

    // Sector breakdown
    const sectorsHtml = c?.sectors?.length ? `
        <div style="margin:1.4rem 0">
            <p style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:0.6rem">Sector Breakdown</p>
            ${c.sectors.map((s, i) => `<div class="stat-card" style="margin:0.5rem 0"><p style="margin:0 0 0.2rem;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;color:var(--gold)">SECTOR ${i+1}</p><p style="margin:0;font-size:0.88rem">${esc(s)}</p></div>`).join('')}
        </div>` : '';

    // Overtaking
    const otHtml = c?.ot ? `<p><strong>Overtaking opportunities:</strong> ${esc(c.ot)}.</p>` : '';

    // Setup
    const setupHtml = c?.setup ? `<p><strong>Setup focus:</strong> ${esc(c.setup)}</p>` : '';

    // Qualifying key
    const qualHtml = c?.qualifying ? `<p><strong>Qualifying key:</strong> ${esc(c.qualifying)}</p>` : '';

    // Strategy section (combines circuit tyre data + event settings)
    const stratHtml = _buildCircuitStrategySection(ev, c);

    // Conditions section (weather, night, day-night transitions)
    const condHtml = _buildCircuitConditionsSection(ev, c);

    // Admin notes (free text from event)
    const notesHtml = ev.notes ? `<p style="color:var(--muted);font-size:0.88rem;font-style:italic"><strong>Race director notes:</strong> ${esc(ev.notes)}</p>` : '';

    // Watch moment pull quote
    const watchHtml = c?.watch ? `<p class="pull-quote">${esc(c.watch)}</p>` : '';

    const body = [
        `<p class="kicker">Circuit Guide · Round ${ev.round || '?'}</p>`,
        `<p class="dropcap">${esc(intro)}</p>`,
        metaLine,
        ev.duration_hours ? `<p>Round ${ev.round||'?'} of ${esc(seasonName)} visits ${esc(displayName)} for a ${ev.duration_hours}-hour race. Here is everything you need to know.</p>` : '',
        raceFormatHtml,
        cornersHtml,
        sectorsHtml,
        otHtml,
        setupHtml,
        qualHtml,
        stratHtml,
        condHtml,
        notesHtml,
        watchHtml,
    ].filter(Boolean).join('\n');

    const title = `Track Guide: ${displayName}, ${seasonName} Round ${ev.round || '?'}`;
    return {
        title,
        slug: _psSlug(title),
        excerpt: `Race format, strategy and circuit breakdown ahead of the ${esc(seasonName)} round at ${esc(displayName)}.`,
        body,
    };
}

function _hcWeather(w) {
    const map = { clear:'Clear', sunny:'Clear skies', cloudy:'Cloudy', overcast:'Overcast', light_rain:'Light rain', rain:'Rain', heavy_rain:'Heavy rain', variable:'Variable', mixed:'Mixed conditions', dynamic:'Dynamic' };
    return map[(w||'').toLowerCase().replace(/[\s-]+/g,'_')] || w;
}
function _hcTimeOfDay(t) {
    const map = { day:'Daytime', morning:'Morning', afternoon:'Afternoon', evening:'Evening', dusk:'Dusk', night:'Night', dawn:'Dawn', midnight:'Midnight' };
    return map[(t||'').toLowerCase()] || t;
}
function _hcStartProc(s) {
    const map = { rolling:'Rolling start', standing:'Standing start', rolling_start:'Rolling start', standing_start:'Standing start' };
    return map[(s||'').toLowerCase().replace(/[\s-]+/g,'_')] || s;
}
function _hcDamage(d) {
    const map = { none:'Off', light:'Light', heavy:'Heavy', simulation:'Simulation' };
    return map[(d||'').toLowerCase()] || d;
}
function _hcSlipstream(s) {
    const map = { weak:'Weak', real:'Real', normal:'Normal', strong:'Strong', reduced:'Reduced' };
    return map[(s||'').toLowerCase()] || s;
}

function _buildCircuitStrategySection(ev, c) {
    const lines = [];
    const wearNum = parseFloat((ev.tyre_wear || '').replace(/[xX]/g,'')) || 0;
    const fuelNum = parseFloat((ev.fuel_consumption || '').replace(/[xX]/g,'')) || 0;
    const stops = parseInt(ev.mandatory_pit_stops) || 0;

    if (wearNum > 0 && c?.tyre) {
        let wearCtx;
        if (wearNum <= 1)      wearCtx = `At real-rate tyre wear, rubber management is a long-game concern. The circuit's natural degradation characteristics still apply — the tyre note above holds — but aggressive driving in the opening stints is sustainable.`;
        else if (wearNum <= 2) wearCtx = `At ${ev.tyre_wear} wear rate, degradation is noticeable. A single pit stop should cover most strategies across this race distance, but how hard you push in the opening stint will determine whether a two-stopper is forced on you late.`;
        else if (wearNum <= 4) wearCtx = `At ${ev.tyre_wear} wear rate, tyre management is the primary concern from lap one. Drivers who overdrive in the early stint will pay heavily in the closing phase — the pace is there in fresh rubber but it will not last.`;
        else                   wearCtx = `At ${ev.tyre_wear} wear rate, tyres are a critical resource throughout the race. Multi-stop strategies are likely; tyre saving in the early phase is worth giving up lap time to achieve, and the pit window will be busy.`;
        lines.push(wearCtx);
        lines.push(c.tyre);
    } else if (c?.tyre) {
        lines.push(c.tyre);
    }

    if (stops > 0) {
        lines.push(stops === 1
            ? `One mandatory pit stop is required. Timing the obligatory stop around a safety car period — or splitting the strategy from the cars around you — can gain a lap's worth of track position without any pace advantage.`
            : `${stops} mandatory pit stops are required. With multiple compulsory stops, undercut strategy becomes central. Watch for the first driver to pit and assess whether responding or extending is the right call based on tyre condition at that moment.`);
    }

    if (ev.required_tyres?.length > 1) {
        lines.push(`Multiple required tyre compounds open the strategy window significantly. The order in which you run each compound can gain or cost time depending on conditions and degradation rate — teams that get the sequence right will find themselves ahead of the pace on corrected time.`);
    } else if (ev.required_tyres?.length === 1) {
        lines.push(`A single tyre compound is mandated, removing one variable from the strategy equation. The focus shifts entirely to timing: when you pit and how hard you push between stops.`);
    }

    if (fuelNum >= 2) {
        lines.push(`Fuel consumption at ${ev.fuel_consumption} means fuel load is a significant strategic factor. A heavy opening fuel load slows lap times but gives more flexibility later; leaning aggressively on the fuel map early risks running short before the stop window.`);
    }

    if (!lines.length) return '';
    return `<div style="margin:1.4rem 0">
        <p style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:0.6rem">Strategy</p>
        ${lines.map(l => `<p>${esc(l)}</p>`).join('')}
    </div>`;
}

function _buildCircuitConditionsSection(ev, c) {
    const lines = [];
    const weather = (ev.weather || '').toLowerCase();
    const tod = (ev.time_of_day || '').toLowerCase();
    const tmNum = parseFloat((ev.time_multiplier || '1').replace(/[xX]/g,'')) || 1;

    if (weather.includes('rain') || weather.includes('variable') || weather.includes('mixed') || weather.includes('dynamic')) {
        lines.push(c?.wet || 'Wet conditions are a factor for this race. Tyre selection at the pit window will define positions — reading the track surface accurately is worth more than raw pace in the dry.');
    }
    if (tod.includes('night') || tod.includes('midnight')) {
        lines.push(c?.night || 'Night racing adds a layer of complexity. Braking reference visibility changes under artificial light, traffic judgement is harder, and the circuit surface can drop in temperature mid-race. Allow a lap to recalibrate before pushing the limit in the dark.');
    }
    if (tmNum >= 5 && ev.duration_hours >= 2) {
        const transition = tod.includes('dusk') || tod.includes('evening') ? 'day into night' : tod.includes('dawn') || tod.includes('morning') ? 'night into day' : 'light into dark';
        lines.push(`With time progression at ${ev.time_multiplier}, the race will run from ${esc(_hcTimeOfDay(tod))} through changing light conditions. Grip levels and tyre temperatures shift as track temperature drops; adjusting driving style through the transition rather than fighting the car is the fastest approach.`);
    }

    if (!lines.length) return '';
    return `<div style="margin:1.4rem 0">
        <p style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:0.6rem">Conditions</p>
        ${lines.map(l => `<p>${esc(l)}</p>`).join('')}
    </div>`;
}

function _bioSnippet(bio) {
    if (!bio) return null;
    const clean = bio.replace(/\s+/g, ' ').trim();
    if (clean.length < 20) return null;
    const sentences = clean.match(/[^.!?]+[.!?]+/g) || [];
    if (sentences.length) {
        const s = sentences.slice(0, 2).join(' ').trim();
        return s.length > 220 ? s.slice(0, 220).trimEnd() + '…' : s;
    }
    return clean.length > 220 ? clean.slice(0, 220).trimEnd() + '…' : clean;
}

function _buildTitleContenders({ seasonName, drivers, driverRatings }) {
    if (!drivers.length) throw new Error('No drivers confirmed yet. Add entries to this season\'s events first.');
    const ranked = drivers.map(d => {
        const elo  = driverRatings.get(d.id);
        const seed = drSrSeed(d.gt7_dr_rating, d.gt7_sr_rating);
        // elo === 1500 is the uninitialised default, treat as unrated
        const hasElo = !!elo && elo !== 1500;
        return { ...d, skill: hasElo ? elo : seed, hasElo };
    }).sort((a,b) => b.skill - a.skill);

    const dCount = ranked.length;
    const intros = [
        `${seasonName} is shaping up to be the most competitive season in GTEC history. Every driver on the grid has earned their place, and here is the full breakdown: ${dCount} drivers, ranked, rated, and assessed before a single wheel has turned in anger.`,
        `The ${seasonName} grid is confirmed. ${dCount} drivers, every seat filled, and a championship that nobody can call from the outside. This is the complete pre-season driver verdict, from the frontrunner to the outside bet and everyone in between.`,
        `Championships are not decided in preview articles, but the grid is set and assessments have to be made. Here is every ${seasonName} driver rated by GT7 credentials, with a verdict on what to expect from each of them across the season.`,
    ];
    const intro = _psPick(intros);

    const slotFrames = [
        // slot 0: the favourite
        {
            labels: ['The Favourite','The Benchmark','The One to Beat'],
            openers: [
                (n,t) => `${n} arrives in ${seasonName} as the name at the top of every prediction list${t ? ` and ${t} will be hoping that translates into results` : ''}. The rating numbers back up the hype, but this is motorsport, and reputations count for nothing once the lights go out.`,
                (n,t) => `If you had to pick one driver to back before a wheel has turned in ${seasonName}, most people would put their money on ${n}${t ? ` of ${t}` : ''}. That kind of expectation is either fuel or pressure, depending on the driver. The next few months will reveal which it is for this one.`,
                (n,t) => `${n} comes into this season with the strongest credentials on the grid${t ? `, representing ${t}` : ''}. The target on the back of that car is bigger than any other, and that is exactly the kind of challenge that separates the contenders from the champions.`,
            ],
            bodies: [
                (dr,sr) => `Carrying a GT7 rating of ${dr ? `DR-${dr}` : 'top tier'}${sr ? ` and SR-${sr}` : ''}, the raw pace is not in question. What ${seasonName} will test is consistency across a full calendar, managing pressure when the results matter most, and handling a grid that will not make things easy.`,
                (dr,sr) => `The ${dr ? `DR-${dr}` : 'elite'} rating${sr ? ` and SR-${sr} sportsmanship score` : ''} tell one part of the story. The other part gets written across eight rounds of racing. Pace without points is just noise, and this driver will know that better than most.`,
                (dr,sr) => `With a ${dr ? `DR-${dr}` : 'high'} pace rating${sr ? ` and SR-${sr}` : ''} to their name, the talent is undeniable. But endurance racing rewards more than raw speed. Race management, tyre conservation, consistent lap times under pressure: all of it matters, and all of it will be tested.`,
            ],
            closers: [
                'The favourite rarely wins as easily as the predictions suggest. But they win often enough to be worth watching.',
                'Frontrunners fall. But they fall less often than everyone hopes. Watch this number all season.',
                'The pressure of being the driver to beat is real. Some thrive under it. The season will tell us which category this driver falls into.',
            ],
        },
        // slot 1: the challenger
        {
            labels: ['The Challenger','The Closest Rival','The Pressure'],
