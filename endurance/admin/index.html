<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --bg-3: #171d27;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --cyan: #0ea5e9;
            --red: #ef4444;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
            --sidebar-w: 220px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            line-height: 1.5;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 20;
        }
        .sidebar-logo {
            padding: 1.5rem 1.25rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo .brand {
            font-family: 'Anton', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text);
            text-indent: 0.28em;
        }
        .sidebar-logo .brand span { color: var(--gold); }
        .sidebar-logo .brand .brand-logo { height: 18px; width: auto; vertical-align: middle; margin-left: 0.4em; }
        .sidebar-logo .sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.2rem;
            text-indent: 0.35em;
        }
        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }
        .nav-section {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.85rem 1.25rem 0.4rem;
            text-indent: 0.35em;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 1.25rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.15s, background 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: var(--gold); background: rgba(255,209,102,0.08); }
        .nav-link.active svg { color: var(--gold); }
        .nav-badge {
            margin-left: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 1.4rem;
            text-align: center;
            padding: 0.1rem 0.4rem;
            border-radius: 999px;
            background: var(--gold);
            color: #1a1300;
            line-height: 1.3;
        }
        .sidebar-bottom {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
        }
        .user-chip {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-logout {
            width: 100%;
            padding: 0.55rem 0.85rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-logout:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* ===== MAIN ===== */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: rgba(5,6,8,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            min-height: 60px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }
        .admin-nav-toggle {
            display: none;
            width: 38px;
            height: 38px;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            padding: 0;
            flex-shrink: 0;
        }
        .admin-nav-toggle:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .admin-nav-toggle svg { width: 18px; height: 18px; display: block; }
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 15;
        }
        body.sidebar-open .sidebar-backdrop { display: block; }
        .page-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-add:hover { filter: brightness(1.08); }
        .btn-add svg { width: 14px; height: 14px; }
        .content {
            flex: 1;
            padding: 2rem;
        }

        /* ===== STAT CARDS ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .stat-card-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-indent: 0.2em;
        }
        .stat-card-value {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            line-height: 1;
            background: linear-gradient(180deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== TABLE ===== */
        .table-wrap {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }
        .table-search {
            flex: 1;
            max-width: 280px;
            padding: 0.5rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .table-search:focus { border-color: rgba(255,209,102,0.4); }
        .table-search::placeholder { color: var(--muted); opacity: 0.6; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            padding: 0.7rem 1.25rem;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .td-muted { color: var(--muted); font-size: 0.82rem; }
        .color-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-muted { background: rgba(255,255,255,0.06); color: var(--muted); }
        .badge-gold  { background: rgba(255,209,102,0.15); color: var(--gold); }
        .badge-red   { background: rgba(239,68,68,0.12); color: #fca5a5; }
        .row-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }
        .btn-icon {
            padding: 0.35rem 0.65rem;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .btn-icon:hover { color: var(--text); border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
        .btn-icon.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); }
        .empty-state {
            padding: 3rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .loading-state {
            padding: 2rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 1.15rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        label .required { color: var(--gold); margin-left: 2px; }
        input[type="text"], input[type="email"], input[type="number"],
        input[type="date"], input[type="color"], input[type="url"],
        select, textarea {
            display: block;
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="color"] { padding: 0.35rem; height: 38px; cursor: pointer; }
        input:focus, select:focus, textarea:focus { border-color: rgba(255,209,102,0.5); }
        input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.6; }
        select option { background: var(--bg-2); }
        textarea { resize: vertical; min-height: 80px; }
        .form-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }

        /* EasyMDE dark-theme overrides — keep editor consistent with admin */
        .EasyMDEContainer .editor-toolbar {
            background: var(--bg-2);
            border-color: var(--border);
            border-top-left-radius: 8px; border-top-right-radius: 8px;
            opacity: 1;
        }
        .EasyMDEContainer .editor-toolbar button {
            color: var(--muted) !important;
            border-color: transparent !important;
        }
        .EasyMDEContainer .editor-toolbar button:hover,
        .EasyMDEContainer .editor-toolbar button.active {
            background: rgba(255,255,255,0.06) !important;
            border-color: var(--border) !important;
            color: var(--text) !important;
        }
        .EasyMDEContainer .editor-toolbar i.separator {
            border-color: var(--border);
        }
        .EasyMDEContainer .CodeMirror {
            background: var(--bg-1) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
            border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
            font-family: 'Inter', 'SF Mono', Menlo, monospace !important;
            font-size: 0.9rem !important;
        }
        .EasyMDEContainer .CodeMirror-cursor { border-color: var(--gold); }
        .EasyMDEContainer .CodeMirror-selected { background: rgba(255,209,102,0.18) !important; }
        .EasyMDEContainer .cm-header { color: var(--gold); }
        .EasyMDEContainer .cm-link, .EasyMDEContainer .cm-url { color: #38bdf8; }
        .EasyMDEContainer .cm-strong { color: var(--text); }
        .EasyMDEContainer .editor-statusbar { color: var(--muted); }
        .EasyMDEContainer .editor-preview, .EasyMDEContainer .editor-preview-side {
            background: var(--bg-1);
            color: var(--text);
            border-color: var(--border) !important;
        }
        .EasyMDEContainer .editor-preview h1,
        .EasyMDEContainer .editor-preview h2,
        .EasyMDEContainer .editor-preview h3 { color: var(--gold); }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }
        .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .form-check span { font-size: 0.88rem; color: var(--text); font-weight: 400; letter-spacing: 0; text-transform: none; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: filter 0.15s, background 0.15s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .btn-danger {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); }

        /* ===== SEASON TEAMS sub-section ===== */
        .section-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 1.5rem;
            overflow: hidden;
        }
        .section-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-2);
        }
        .section-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            text-indent: 0.25em;
        }

        /* ===== TOASTS ===== */
        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            pointer-events: none;
        }
        .toast {
            padding: 0.8rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            max-width: 340px;
            pointer-events: auto;
            animation: toast-in 0.25s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: none; }
        }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .toast.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .toast.info    { background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.3); color: #7dd3fc; }

        /* ===== CONFIRM BANNER ===== */
        .confirm-banner {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .confirm-banner.open { display: block; }
        .confirm-banner p { font-size: 0.85rem; color: #fca5a5; margin-bottom: 0.65rem; }
        .confirm-banner .confirm-btns { display: flex; gap: 0.5rem; }

        /* ===== AUTH LOADING ===== */
        #auth-loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--muted);
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.2s ease; }
            body.sidebar-open .sidebar { transform: translateX(0); }
            .main { margin-left: 0; }
            .form-row { grid-template-columns: 1fr; }
            .admin-nav-toggle { display: inline-flex; }
            .topbar { padding: 0.85rem 1rem; }
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js" defer></script>
</head>
<body>

<div id="auth-loading">Authenticating…</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="brand">Gran Turismo<img class="brand-logo" src="/endurance/assets/gtec-logo.png" alt="GTEC"></div>
        <div class="sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">Overview</div>
        <button class="nav-link" data-section="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
        </button>

        <div class="nav-section">Championship</div>
        <button class="nav-link" data-section="manufacturers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
            Manufacturers
        </button>
        <button class="nav-link" data-section="seasons">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/countries.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';

// ============================================================
// 1. Init
// ============================================================
const { createClient } = window.supabase;
const cfg = window.GTEC_CONFIG;
const sb  = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

let currentUser  = null;
let currentSection = 'dashboard';

// Cached data for dropdowns
let _manufacturers = [];
let _seasons       = [];
let _teams         = [];
let _pointsSystems = [];
let _drivers       = [];


// ============================================================
// 2. Auth guard
// ============================================================
async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        window.location.replace('./login.html');
        return;
    }
    currentUser = session.user;

    const { data: role } = await sb.from('user_roles')
        .select('role')
        .eq('user_id', currentUser.id)
        .eq('role', 'admin')
        .maybeSingle();

    if (!role) {
        await sb.auth.signOut();
        window.location.replace('./login.html');
        return;
    }

    document.getElementById('user-email').textContent = currentUser.email;
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('sidebar').style.transform = '';
    document.getElementById('sidebar').style.display = '';

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.replace('./login.html');
    });

    setupNav();
    await refreshAppsBadge();
    setInterval(refreshAppsBadge, 60000);
    await navigate('dashboard');
}

async function refreshAppsBadge() {
    const { count } = await sb.from('applications')
        .select('id', { count: 'exact', head: true })
        .eq('status', 'pending');
    const el = document.getElementById('apps-badge');
    if (!el) return;
    if (count && count > 0) {
        el.textContent = count;
        el.style.display = '';
    } else {
        el.style.display = 'none';
    }
}


// ============================================================
// 3. Router & nav
// ============================================================
function setupNav() {
    document.querySelectorAll('.nav-link[data-section]').forEach(btn => {
        btn.addEventListener('click', () => {
            navigate(btn.dataset.section);
            document.body.classList.remove('sidebar-open');
        });
    });

    // Mobile sidebar toggle
    document.getElementById('admin-nav-toggle').addEventListener('click', () => {
        document.body.classList.toggle('sidebar-open');
    });
    document.getElementById('sidebar-backdrop').addEventListener('click', () => {
        document.body.classList.remove('sidebar-open');
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.body.classList.remove('sidebar-open');
    });
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) document.body.classList.remove('sidebar-open');
    });

    // Hash routing
    window.addEventListener('hashchange', () => {
        const sec = window.location.hash.replace('#', '') || 'dashboard';
        navigate(sec, false);
    });
    const hash = window.location.hash.replace('#', '');
    if (hash && hash !== 'dashboard') navigate(hash, false);
}

async function navigate(section, pushHash = true) {
    currentSection = section;
    if (pushHash) window.location.hash = section;

    document.querySelectorAll('.nav-link').forEach(b => b.classList.toggle('active', b.dataset.section === section));

    const titles = {
        dashboard: 'Dashboard',
        manufacturers: 'Manufacturers',
        seasons: 'Seasons',
        teams: 'Teams',
        drivers: 'Drivers',
        events: 'Events',
        applications: 'Applications',
        news: 'News',
        media: 'Media',
        pages: 'Pages',
        admins: 'Admins',
    };
    document.getElementById('page-title').textContent = titles[section] || section;

    const addBtn = document.getElementById('btn-add');
    if (section === 'dashboard' || section === 'pages' || section === 'applications' || section === 'admins') {
        addBtn.style.display = 'none';
    } else {
        addBtn.style.display = '';
        addBtn.onclick = () => openAddModal(section);
    }

    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading-state">Loading…</div>';

    await Promise.all([loadCache()]);

    switch (section) {
        case 'dashboard':    await renderDashboard(); break;
        case 'manufacturers': await renderManufacturers(); break;
        case 'seasons':      await renderSeasons(); break;
        case 'teams':        await renderTeams(); break;
        case 'drivers':      await renderDrivers(); break;
        case 'events':       await renderEvents(); break;
        case 'applications': await renderApplications(); break;
        case 'news':         await renderNews(); break;
        case 'media':        await renderMedia(); break;
        case 'pages':        await renderPages(); break;
        case 'admins':       await renderAdmins(); break;
    }
}


// ============================================================
// 4. Dropdown caches
// ============================================================
async function loadCache() {
    const [mfr, ps, tm, dr, seas] = await Promise.all([
        sb.from('manufacturers').select('id,name,slug').order('name'),
        sb.from('points_systems').select('id,name').order('name'),
        sb.from('teams').select('id,name,slug,manufacturer_id').order('name'),
        sb.from('drivers').select('id,display_name,slug,career_number').order('display_name'),
        sb.from('seasons').select('id,name,year').order('year', { ascending: false }),
    ]);
    _manufacturers = mfr.data  || [];
    _pointsSystems = ps.data   || [];
    _teams         = tm.data   || [];
    _drivers       = dr.data   || [];
    _seasons       = seas.data || [];
}


// ============================================================
// 5. UI helpers
// ============================================================
function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function openModal(title, bodyHTML, footerHTML) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHTML;
    document.getElementById('modal-footer').innerHTML = footerHTML;
    document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    if (window._pageMDE) { try { window._pageMDE.toTextArea(); } catch {} window._pageMDE = null; }
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function slugify(str) {
    return str.toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
}

function selectHTML(id, options, selected = '', emptyLabel = '— Select —') {
    const opts = options.map(o =>
        `<option value="${esc(o.value)}" ${o.value === selected ? 'selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    return `<select id="${id}" name="${id}"><option value="">${emptyLabel}</option>${opts}</select>`;
}

function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getFormData(formId) {
    const form = document.getElementById(formId);
    const data = {};
    form.querySelectorAll('[name]').forEach(el => {
        if (el.type === 'checkbox') data[el.name] = el.checked;
        else data[el.name] = el.value || null;
    });
    return data;
}


// ============================================================
// 6. Dashboard
// ============================================================
async function renderDashboard() {
    const [mfr, seasons, teams, drivers, evts] = await Promise.all([
        sb.from('manufacturers').select('id', { count: 'exact', head: true }),
        sb.from('seasons').select('id', { count: 'exact', head: true }),
        sb.from('teams').select('id', { count: 'exact', head: true }),
        sb.from('drivers').select('id', { count: 'exact', head: true }),
        sb.from('events').select('id', { count: 'exact', head: true }),
    ]);

    const { data: activeSeason } = await sb.from('seasons').select('name,year').eq('is_active', true).maybeSingle();

    document.getElementById('content').innerHTML = `
        <div class="stat-grid">
            <div class="stat-card"><div class="stat-card-label">Manufacturers</div><div class="stat-card-value">${mfr.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Seasons</div><div class="stat-card-value">${seasons.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Teams</div><div class="stat-card-value">${teams.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Drivers</div><div class="stat-card-value">${drivers.count ?? 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Events</div><div class="stat-card-value">${evts.count ?? 0}</div></div>
        </div>
        <div class="table-wrap" style="padding:1.5rem">
            <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem;font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase">Active Season</div>
            <div style="font-family:'Anton',sans-serif;font-size:1.6rem;letter-spacing:0.04em">${activeSeason ? esc(activeSeason.name) : '<span style="color:var(--muted);font-size:1rem;font-family:Inter,sans-serif">None — create a season and mark it active</span>'}</div>
        </div>
        <div class="table-wrap" style="padding:1.5rem;margin-top:1rem">
            <div style="font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem">Maintenance</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
                <div style="font-size:0.85rem;color:var(--muted)">Rebuild Hall of Fame records from current career stats.</div>
                <button class="btn btn-primary" onclick="refreshHallOfFame()">Refresh Hall of Fame</button>
            </div>
        </div>
    `;
}


// ============================================================
// 7. Manufacturers
// ============================================================
async function renderManufacturers() {
    const { data, error } = await sb.from('manufacturers').select('*').order('name');
    if (error) { toast(error.message, 'error'); return; }

    const rows = data.length === 0 ? `<tr><td colspan="6"><div class="empty-state">No manufacturers yet — add one to get started.</div></td></tr>` :
        data.map(m => `
            <tr>
                <td>${m.logo_url
                    ? `<img src="${esc(m.logo_url)}" alt="${esc(m.name)}" style="width:32px;height:32px;object-fit:contain;background:rgba(255,255,255,0.04);border-radius:4px;padding:2px">`
                    : `<div style="width:32px;height:32px;border-radius:4px;background:${esc(m.brand_color || 'rgba(255,255,255,0.05)')};border:1px solid var(--border)"></div>`}</td>
                <td><strong>${esc(m.name)}</strong></td>
                <td class="td-muted">${esc(m.slug)}</td>
                <td class="td-muted">${esc(m.country) || '—'}</td>
                <td>${m.brand_color ? `<div class="color-swatch"><div class="swatch" style="background:${esc(m.brand_color)}"></div>${esc(m.brand_color)}</div>` : '<span class="td-muted">—</span>'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="editManufacturer('${m.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteManufacturer('${m.id}','${esc(m.name)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search manufacturers…" oninput="filterTable(this,'mfr-table')">
            </div>
            <table id="mfr-table"><thead><tr>
                <th style="width:60px">Logo</th><th>Name</th><th>Slug</th><th>Country</th><th>Brand Colour</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

function mfrForm(m = {}) {
    return `<form id="entity-form">
        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="name" value="${esc(m.name)}" placeholder="BMW" required oninput="autoSlug(this,'name','slug')">
            </div>
            <div class="form-group">
                <label>Slug <span class="required">*</span></label>
                <input type="text" name="slug" id="slug" value="${esc(m.slug)}" placeholder="bmw" required>
                <div class="form-hint">Auto-generated · editable</div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Country</label>
                <select name="country">${window.gtecCountryOptions(m.country)}</select>
            </div>
            <div class="form-group">
                <label>Brand Colour</label>
                <input type="color" name="brand_color" value="${m.brand_color || '#ffffff'}">
            </div>
        </div>
        <div class="form-group">
            <label>Logo</label>
            <div style="display:flex;align-items:center;gap:1rem">
                <div id="mfr-logo-preview" style="width:64px;height:64px;flex-shrink:0;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden">
                    ${m.logo_url ? `<img src="${esc(m.logo_url)}" style="max-width:100%;max-height:100%;object-fit:contain">` : '<span style="font-size:0.7rem;color:var(--muted)">No logo</span>'}
                </div>
                <div style="flex:1">
                    <input type="file" id="mfr-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="padding:0.4rem 0">
                    <input type="hidden" name="logo_url" value="${esc(m.logo_url)}">
                    <div class="form-hint">PNG / SVG / WebP recommended. Square transparent works best. Uploads to gtec-manufacturers bucket.</div>
                </div>
            </div>
        </div>
    </form>`;
}

function openAddModal(section) {
    const map = {
        manufacturers: () => openManufacturerModal(),
        seasons:       () => openSeasonModal(),
        teams:         () => openTeamModal(),
        drivers:       () => openDriverModal(),
        events:        () => openEventModal(),
        news:          () => openNewsModal(),
        media:         () => openMediaModal(),
    };
    map[section]?.();
}

function openManufacturerModal(m = {}) {
    openModal(m.id ? 'Edit Manufacturer' : 'Add Manufacturer', mfrForm(m), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveManufacturer('${m.id || ''}')">Save</button>
    `);
}

async function editManufacturer(id) {
    const { data } = await sb.from('manufacturers').select('*').eq('id', id).single();
    openManufacturerModal(data);
}

async function saveManufacturer(id) {
    const d = getFormData('entity-form');
    if (!d.name || !d.slug) { toast('Name and slug are required.', 'error'); return; }

    let logoUrl = d.logo_url || null;
    const fileInput = document.getElementById('mfr-logo-file');
    const file = fileInput?.files?.[0];
    if (file) {
        const ext = file.name.split('.').pop().toLowerCase();
        const path = `${d.slug}-${Date.now()}.${ext}`;
        toast('Uploading logo…', 'success');
        const { error: upErr } = await sb.storage.from('gtec-manufacturers').upload(path, file, { upsert: true });
        if (upErr) { toast(upErr.message, 'error'); return; }
        logoUrl = sb.storage.from('gtec-manufacturers').getPublicUrl(path).data.publicUrl;
    }

    const payload = { name: d.name, slug: d.slug, country: d.country, brand_color: d.brand_color, logo_url: logoUrl };
    const { error } = id
        ? await sb.from('manufacturers').update(payload).eq('id', id)
        : await sb.from('manufacturers').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Manufacturer updated.' : 'Manufacturer added.', 'success');
    closeModal();
    await renderManufacturers();
    await loadCache();
}

async function deleteManufacturer(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    const { error } = await sb.from('manufacturers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Manufacturer deleted.', 'success');
    await renderManufacturers();
    await loadCache();
}


// ============================================================
// 8. Seasons
// ============================================================
async function renderSeasons() {
    const { data, error } = await sb.from('seasons')
        .select('*, points_systems(name)')
        .order('year', { ascending: false });
    if (error) { toast(error.message, 'error'); return; }

    const rows = data.length === 0 ? `<tr><td colspan="6"><div class="empty-state">No seasons yet.</div></td></tr>` :
        data.map(s => `
            <tr>
                <td><strong>${esc(s.name)}</strong></td>
                <td class="td-muted">${s.year}</td>
                <td class="td-muted">${s.starts_on ? s.starts_on.slice(0,10) : '—'} → ${s.ends_on ? s.ends_on.slice(0,10) : '—'}</td>
                <td class="td-muted" style="font-size:0.78rem">${esc(s.points_systems?.name) || '—'}</td>
                <td>${s.is_active ? '<span class="badge badge-green">Active</span>' : '<span class="badge badge-muted">Inactive</span>'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="viewSeasonTeams('${s.id}','${esc(s.name)}')">Teams</button>
                    <button class="btn-icon" onclick="editSeason('${s.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteSeason('${s.id}','${esc(s.name)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search seasons…" oninput="filterTable(this,'seasons-table')">
            </div>
            <table id="seasons-table"><thead><tr>
                <th>Name</th><th>Year</th><th>Dates</th><th>Points System</th><th>Status</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>
        <div id="season-teams-panel"></div>`;
}

function seasonForm(s = {}) {
    const psOpts = _pointsSystems.map(p => ({ value: p.id, label: p.name }));

async function viewSeasonTeams(seasonId, seasonName) {

        .select('*, teams(name), manufacturers(name,brand_color)')

    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    const rows = data.length === 0 ? `<tr><td colspan="4"><div class="empty-state">No teams registered for this season yet.</div></td></tr>` :
        data.map(ts => `
            <tr>
                <td><strong>${esc(ts.teams?.name)}</strong></td>

function openRegisterTeamModal(seasonId) {
    const teamOpts = _teams.map(t => ({ value: t.id, label: t.name }));
    const mfrOpts  = _manufacturers.map(m => ({ value: m.id, label: m.name }));
    openModal('Register Team for Season',

async function registerTeamForSeason(seasonId) {
    const d = getFormData('entity-form');
    if (!d.team_id || !d.manufacturer_id) { toast('Select a team and manufacturer.', 'error'); return; }
    const { error } = await sb.from('team_seasons').insert({
        team_id: d.team_id, season_id: seasonId, manufacturer_id: d.manufacturer_id
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Team registered for season.', 'success');
    closeModal();
    const { data: s } = await sb.from('seasons').select('name').eq('id', seasonId).single();

async function removeTeamSeason(id) {
    if (!confirm('Remove this team from the season?')) return;
    const { error } = await sb.from('team_seasons').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Registration removed.', 'success');
    // Re-render the panel — find the season_id from the existing panel context
    const btn = document.querySelector(`[onclick="removeTeamSeason('${id}')"]`);
    const panel = document.getElementById('season-teams-panel');
    const headerTitle = panel.querySelector('.section-card-title')?.textContent || '';
    const seasonName = headerTitle.replace('Team Registrations — ', '');
    // Re-fetch to re-render
    const { data } = await sb.from('seasons').select('id').eq('name', seasonName).maybeSingle();
    if (data) await viewSeasonTeams(data.id, seasonName);
}

function syncDriverMfrToTeam() {
    const teamSel = document.getElementById('current_team_id');
    const mfrSel  = document.getElementById('current_manufacturer_id');
    const hint    = document.getElementById('mfr-hint');
    if (!teamSel || !mfrSel) return;
    const team = _teams.find(t => t.id === teamSel.value);
    if (team) {
        mfrSel.value = team.manufacturer_id || '';
        mfrSel.disabled = true;
        if (hint) hint.textContent = 'Locked to team manufacturer.';
    } else {
        mfrSel.disabled = false;
        if (hint) hint.textContent = 'Free agents only — set when no team is selected.';
    }
}

    `);

async function editDriver(id) {
    const { data } = await sb.from('drivers').select('*').eq('id', id).single();
    openDriverModal(data);
}

function checkCareerNumber(raw, ignoreDriverId) {
    if (raw === '' || raw == null) return { ok: true, value: null };
    const n = parseInt(raw, 10);
    if (Number.isNaN(n) || n < 1 || n > 999) {
        return { ok: false, error: 'Career number must be between 1 and 999.' };
    }
    const clash = _drivers.find(d => d.career_number === n && d.id !== ignoreDriverId);
    if (clash) {
        return { ok: false, error: `#${n} is already used by ${clash.display_name}.` };
    }
    return { ok: true, value: n };
}

function checkDriverNameUnique(name, ignoreId) {
    const t = (name || '').trim().toLowerCase();
    if (!t) return null;
    const clash = _drivers.find(d =>
        (d.display_name || '').trim().toLowerCase() === t && d.id !== ignoreId
    );
    return clash ? `Driver name "${name}" is already taken.` : null;
}

function checkTeamNameUnique(name, ignoreId) {
    const t = (name || '').trim().toLowerCase();
    if (!t) return null;
    const clash = _teams.find(team =>
        (team.name || '').trim().toLowerCase() === t && team.id !== ignoreId
    );
    return clash ? `Team name "${name}" is already taken.` : null;
}

async function saveDriver(id) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkDriverNameUnique(d.display_name, id);
    if (dupName) { toast(dupName, 'error'); return; }
    const num = checkCareerNumber(d.career_number, id);
    if (!num.ok) { toast(num.error, 'error'); return; }
    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        nationality: d.nationality, career_number: num.value,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
        gt7_dr_rating: d.gt7_dr_rating || null, gt7_sr_rating: d.gt7_sr_rating || null,
    };
    const { error } = id
        ? await sb.from('drivers').update(payload).eq('id', id)
        : await sb.from('drivers').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Driver updated.' : 'Driver added.', 'success');
    closeModal();
    await renderDrivers();
    await loadCache();
}

async function deleteDriver(id, name) {
    if (!confirm(`Delete "${name}"?`)) return;
    const { error } = await sb.from('drivers').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Driver deleted.', 'success');
    await renderDrivers();
    await loadCache();
}

async function generateClaimLink(driverId, driverName) {
    const { data, error } = await sb.from('driver_claim_tokens')
        .insert({ driver_id: driverId })
        .select('token')
        .single();
    if (error) { toast(error.message, 'error'); return; }

    const url = `${location.origin}/endurance/profile/claim/?token=${data.token}`;
    openModal(`Claim Link — ${driverName}`,
        `<p style="color:var(--muted);font-size:0.85rem;margin-bottom:1rem">
            Share this link with <strong style="color:var(--text)">${esc(driverName)}</strong>.
            It expires in <strong style="color:var(--text)">24 hours</strong> and can only be used once.
        </p>
        <div style="display:flex;gap:0.5rem;align-items:center">
            <input type="text" id="claim-url" value="${esc(url)}" readonly
                style="flex:1;font-size:0.78rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;padding:0.6rem 0.85rem;color:var(--muted)">
            <button class="btn btn-primary" onclick="copyClaimUrl()">Copy</button>
        </div>
        <p style="color:var(--muted);font-size:0.75rem;margin-top:0.75rem">
            The driver visits this link, creates an account, and their profile is linked automatically.
        </p>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`
    );
}

function copyClaimUrl() {
    const input = document.getElementById('claim-url');
    navigator.clipboard.writeText(input.value).then(() => toast('Link copied to clipboard.', 'success'));
}

        .order('starts_at', { ascending: false });

    const evtStatusBadge = s => {

    const rows = data.length === 0 ? `<tr><td colspan="7"><div class="empty-state">No events yet — add one to get started.</div></td></tr>` :

                <td><strong>${esc(e.name)}</strong></td>
                <td class="td-muted">${esc(e.circuit_name)}${e.circuit_country ? ` (${esc(e.circuit_country)})` : ''}</td>
                <td class="td-muted" style="font-size:0.78rem">${formatDatetime(e.starts_at)}</td>

                    <button class="btn-icon" onclick="viewEventQualifying('${e.id}','${esc(e.name)}')">Qualifying</button>
                    <button class="btn-icon" onclick="viewEventResults('${e.id}','${esc(e.name)}')">Results</button>
                    <button class="btn-icon" onclick="viewEventPenalties('${e.id}','${esc(e.name)}')">Penalties</button>
                    <button class="btn-icon" onclick="viewEventSteward('${e.id}','${esc(e.name)}')">Steward</button>
                    <button class="btn-icon" onclick="editEvent('${e.id}')">Edit</button>
                    <button class="btn-icon danger" onclick="deleteEvent('${e.id}','${esc(e.name)}')">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div class="table-wrap">
            <div class="table-toolbar">
                <input class="table-search" type="search" placeholder="Search events…" oninput="filterTable(this,'events-table')">
            </div>
            <table id="events-table"><thead><tr>
                <th>Round</th><th>Name</th><th>Circuit</th><th>Date</th><th>Duration</th><th>Status</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>
        <div id="event-entries-panel"></div>`;
}

function formatDatetime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function toDatetimeLocal(iso) {
    if (!iso) return '';
    return iso.slice(0, 16);
}

function autoFillEndsAt() {
    const starts = document.getElementById('ev-starts')?.value;
    const hours  = parseFloat(document.getElementById('ev-duration')?.value);
    const endsEl = document.getElementById('ev-ends');
    if (!starts || !hours || !endsEl) return;
    const ms = new Date(starts).getTime() + hours * 3600 * 1000;
    if (!isNaN(ms)) endsEl.value = toDatetimeLocal(new Date(ms).toISOString());
}

        <div class="form-row">

function openEventModal(e = {}) {
    openModal(e.id ? 'Edit Event' : 'Add Event', eventForm(e), `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEvent('${e.id || ''}')">Save</button>
    `);
}

async function editEvent(id) {
    const { data } = await sb.from('events').select('*').eq('id', id).single();
    openEventModal(data);
}

async function saveEvent(id) {
    const d = getFormData('entity-form');
    if (!d.season_id || !d.round || !d.name || !d.slug || !d.circuit_name || !d.duration_hours || !d.starts_at || !d.ends_at) {
        toast('Fill in all required fields.', 'error'); return;
    }
    const payload = {
        season_id: d.season_id,
        round: parseInt(d.round),
        name: d.name,
        slug: d.slug,
        circuit_name: d.circuit_name,
        circuit_country: d.circuit_country || null,
        circuit_length_km: d.circuit_length_km ? parseFloat(d.circuit_length_km) : null,
        duration_hours: parseFloat(d.duration_hours),
        starts_at: d.starts_at,
        ends_at: d.ends_at,
        status: d.status || 'scheduled',
        replay_url: d.replay_url || null,
        notes: d.notes || null,
    };
    const { error } = id
        ? await sb.from('events').update(payload).eq('id', id)
        : await sb.from('events').insert(payload);
    if (error) { toast(error.message, 'error'); return; }
    toast(id ? 'Event updated.' : 'Event created.', 'success');
    closeModal();
    await renderEvents();
}

async function deleteEvent(id, name) {
    if (!confirm(`Delete "${name}"? This will cascade-delete all entries and results.`)) return;
    const { error } = await sb.from('events').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Event deleted.', 'success');
    await renderEvents();
}

function fillEntryMfr(sel) {
    const opt = sel.selectedOptions[0];
    const mfrId   = opt?.dataset.mfrId   || '';

    const display = document.getElementById('entry-mfr-display');
    if (hidden)  hidden.value = mfrId;
    if (display) {
        display.textContent = mfrName
            ? mfrName + '  (locked by season registration)'
            : 'Pick a team — manufacturer is locked by the season registration.';
        display.style.color = mfrName ? 'var(--text)' : 'var(--muted)';
    }

async function saveEntryDriver(entryId, eventId, eventName, seasonId) {
    const d = getFormData('entity-form');
    if (!d.driver_id) { toast('Select a driver.', 'error'); return; }
    const { error } = await sb.from('entry_drivers').insert({
        entry_id: entryId,
        driver_id: d.driver_id,
        stint_role: d.stint_role || 'starting',
    });
    if (error) { toast(error.message, 'error'); return; }

    // If this is the entry's first driver and the entry has no car number yet,
    // adopt the driver's career number as the car number.
    const { data: entry } = await sb.from('entries').select('car_number').eq('id', entryId).single();
    if (entry && entry.car_number == null) {
        const { data: drv } = await sb.from('drivers').select('career_number').eq('id', d.driver_id).single();
        if (drv?.career_number) {
            await sb.from('entries').update({ car_number: drv.career_number }).eq('id', entryId);
        }

    toast('Driver added to entry.', 'success');
    closeModal();
    await viewEventEntries(eventId, eventName, seasonId);

}

const DR_TO_ELO = { 'E': 800, 'D': 1100, 'C': 1300, 'B': 1500, 'A': 1700, 'A+': 1850, 'S': 2000 };

function drToElo(letter) {
    return DR_TO_ELO[letter] ?? 1500;
}

async function viewEventLobbies(eventId, eventName, seasonId) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading lobbies…</div>';

    const { data: entries, error } = await sb.from('entries')
        .select(`
            id, lobby_number, car_number, car_model, status,
            teams(name),
            manufacturers(name, brand_color),
            entry_drivers(driver_id, drivers(id, display_name, career_number, gt7_dr_rating))
        `)
        .eq('event_id', eventId);
    if (error) { panel.innerHTML = `<div class="loading-state">${esc(error.message)}</div>`; return; }

    // Fetch current Elo for any driver in any entry
    const driverIds = Array.from(new Set((entries || []).flatMap(en => (en.entry_drivers || []).map(ed => ed.driver_id)))).filter(Boolean);
    const ratingMap = new Map();
    if (driverIds.length) {
        const { data: ratings } = await sb.from('driver_current_ratings')
            .select('driver_id, rating')
            .in('driver_id', driverIds);
        (ratings || []).forEach(r => ratingMap.set(r.driver_id, r.rating));
    }

    // Attach team skill (avg of drivers' Elo, falling back to DR-based seed)
    (entries || []).forEach(en => {
        const drs = (en.entry_drivers || []).map(ed => {
            const e = ratingMap.get(ed.driver_id);
            return (e != null) ? e : drToElo(ed.drivers?.gt7_dr_rating);
        });
        en._skill = drs.length ? Math.round(drs.reduce((a,b)=>a+b,0) / drs.length) : 1500;
        en._driverNames = (en.entry_drivers || []).map(ed => ed.drivers?.display_name).filter(Boolean).join(' / ');
    });

    // Group by lobby
    const groups = {};
    (entries || []).forEach(en => {
        const key = en.lobby_number ?? 0;  // 0 = unassigned
        (groups[key] = groups[key] || []).push(en);
    });
    const lobbyNumbers = Object.keys(groups).map(Number).sort((a, b) => {
        if (a === 0) return 1; if (b === 0) return -1; return a - b;
    });

    const totalEntries = (entries || []).length;

    const renderLobbyCard = (lobbyNum, list) => {
        const title = lobbyNum === 0 ? 'Unassigned' : `Lobby ${lobbyNum}`;
        const sorted = list.sort((a, b) => b._skill - a._skill);
        const rows = sorted.map(en => `<tr>
            <td>${en.car_number != null ? '<strong>#' + en.car_number + '</strong>' : '<span class="td-muted">—</span>'}</td>
            <td>${esc(en.teams?.name) || '—'}</td>
            <td class="td-muted" style="font-size:0.78rem">${esc(en._driverNames) || '—'}</td>
            <td class="td-muted" style="font-family:'Orbitron',sans-serif;font-size:0.78rem">${en._skill}</td>
            <td><div class="row-actions" style="gap:0.25rem;justify-content:flex-end">
                <button class="btn-icon" title="Move to a lower lobby (faster split)"
                    onclick="moveEntryLobby('${en.id}',-1,'${eventId}','${esc(eventName)}','${seasonId}')">↑</button>
                <button class="btn-icon" title="Move to a higher lobby (slower split)"
                    onclick="moveEntryLobby('${en.id}',1,'${eventId}','${esc(eventName)}','${seasonId}')">↓</button>

async function autoAllocateLobbies(eventId, eventName, seasonId) {
    const sizeInput = document.getElementById('lobby-size');
    const lobbySize = Math.max(2, Math.min(32, parseInt(sizeInput?.value, 10) || 16));

    const { data: entries } = await sb.from('entries')
        .select(`id, entry_drivers(driver_id, drivers(gt7_dr_rating))`)
        .eq('event_id', eventId)
        .neq('status', 'withdrawn');
    if (!entries?.length) { toast('No entries to allocate.', 'error'); return; }

    const driverIds = Array.from(new Set(entries.flatMap(en => (en.entry_drivers || []).map(ed => ed.driver_id)))).filter(Boolean);
    const ratingMap = new Map();
    if (driverIds.length) {
        const { data: ratings } = await sb.from('driver_current_ratings')
            .select('driver_id, rating')
            .in('driver_id', driverIds);
        (ratings || []).forEach(r => ratingMap.set(r.driver_id, r.rating));
    }

    entries.forEach(en => {
        const drs = (en.entry_drivers || []).map(ed => {
            const e = ratingMap.get(ed.driver_id);
            return (e != null) ? e : drToElo(ed.drivers?.gt7_dr_rating);
        });
        en._skill = drs.length ? drs.reduce((a,b)=>a+b,0) / drs.length : 1500;
    });

    entries.sort((a, b) => b._skill - a._skill);

    // Bulk-update each entry's lobby_number sequentially (small N — fine)
    let failures = 0;
    for (let i = 0; i < entries.length; i++) {
        const lobby = Math.floor(i / lobbySize) + 1;
        const { error } = await sb.from('entries').update({ lobby_number: lobby }).eq('id', entries[i].id);
        if (error) failures++;
    }
    const totalLobbies = Math.ceil(entries.length / lobbySize);
    toast(failures
        ? `Allocated with ${failures} failure(s).`
        : `${entries.length} entries split across ${totalLobbies} lobb${totalLobbies === 1 ? 'y' : 'ies'}.`, failures ? 'error' : 'success');
    await viewEventLobbies(eventId, eventName, seasonId);
}

async function clearAllLobbies(eventId, eventName, seasonId) {
    if (!confirm('Clear all lobby assignments for this event?')) return;
    const { error } = await sb.from('entries').update({ lobby_number: null }).eq('event_id', eventId);
    if (error) { toast(error.message, 'error'); return; }
    toast('Lobby assignments cleared.', 'success');

}

async function moveEntryLobby(entryId, delta, eventId, eventName, seasonId) {
    const { data: en } = await sb.from('entries').select('lobby_number').eq('id', entryId).single();
    const current = en?.lobby_number ?? 1;
    const next = Math.max(1, current + delta);
    await setEntryLobby(entryId, next, eventId, eventName, seasonId);
}

async function setEntryLobby(entryId, lobbyNumber, eventId, eventName, seasonId) {

}

function parseLapTime(s) {
    if (!s) return null;
    s = String(s).trim();
    if (!s) return null;
    const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
    if (!m) return null;
    const min = parseInt(m[1] || '0', 10);
    const sec = parseFloat(m[2]);
    return Math.round((min * 60 + sec) * 1000);
}

function fmtLapTime(ms) {
    if (ms == null || ms === '') return '';
    const totalSec = ms / 1000;
    const min = Math.floor(totalSec / 60);
    const sec = (totalSec - min * 60).toFixed(3).padStart(6, '0');
    return min > 0 ? `${min}:${sec}` : sec;
}

async function saveQualifying(eventId, eventName) {
    const inputs = document.querySelectorAll('#qualifying-table input[data-entry]');
    const map = {};
    let bad = false;
    inputs.forEach(inp => {
        const id = inp.dataset.entry;
        map[id] = map[id] || { entry_id: id, event_id: eventId };
        const field = inp.dataset.field;
        if (field === 'position') {
            map[id].position = inp.value ? parseInt(inp.value) : null;
        } else if (field === 'best_lap') {
            if (inp.value.trim()) {
                const ms = parseLapTime(inp.value);
                if (ms == null) { toast(`Invalid lap time: "${inp.value}"`, 'error'); bad = true; }
                map[id].best_lap_ms = ms;
            } else {
                map[id].best_lap_ms = null;
            }
        } else if (field === 'notes') {
            map[id].notes = inp.value.trim() || null;
        }
    });
    if (bad) return;

    const toUpsert = Object.values(map).filter(r => r.position != null || r.best_lap_ms != null || r.notes);
    const toDelete = Object.values(map).filter(r => r.position == null && r.best_lap_ms == null && !r.notes);

    // Delete cleared rows
    for (const r of toDelete) {
        await sb.from('qualifying_results').delete().eq('event_id', eventId).eq('entry_id', r.entry_id);
    }
    if (toUpsert.length) {
        const { error } = await sb.from('qualifying_results').upsert(toUpsert, { onConflict: 'event_id,entry_id' });
        if (error) { toast(error.message, 'error'); return; }
    }
    toast('Qualifying saved.', 'success');
    await viewEventQualifying(eventId, eventName);
}

async function saveResults(eventId, eventName) {
    const rowInputs = document.querySelectorAll('#results-table [data-entry]');
    const map = {};
    rowInputs.forEach(inp => {
        const id = inp.dataset.entry;
        map[id] = map[id] || { entry_id: id, event_id: eventId };
        const f = inp.dataset.field;
        if (inp.type === 'checkbox') {
            map[id][f] = inp.checked;
        } else if (f === 'finish_position') {
            map[id][f] = inp.value ? parseInt(inp.value) : null;
        } else if (f === 'laps_completed') {
            map[id][f] = inp.value ? parseInt(inp.value) : 0;
        } else if (f === 'dnf_reason') {
            map[id][f] = inp.value.trim() || null;
        } else {
            map[id][f] = inp.value || null;
        }
    });

    // Pole guard: only one pole per event
    const poles = Object.values(map).filter(r => r.pole_point);
    if (poles.length > 1) { toast('Only one entry can have the pole point.', 'error'); return; }
    const fls = Object.values(map).filter(r => r.fastest_lap_point);
    if (fls.length > 1) { toast('Only one entry can have the fastest lap point.', 'error'); return; }

    const rows = Object.values(map);
    const { error } = await sb.from('results').upsert(rows, { onConflict: 'event_id,entry_id' });
    if (error) { toast(error.message, 'error'); return; }

    // Recompute points
    const { data: cp, error: cpErr } = await sb.rpc('compute_event_points', { p_event_id: eventId });
    if (cpErr) { toast('Saved, but points recompute failed: ' + cpErr.message, 'error'); }
    else if (cp?.error) { toast('Saved, but points recompute failed: ' + cp.error, 'error'); }
    else toast('Results saved & points recomputed.', 'success');

    await viewEventResults(eventId, eventName);
}

async function openStewardModal(eventId, eventName, decisionId) {
    let existing = {};
    if (decisionId) {
        const { data } = await sb.from('steward_decisions').select('*').eq('id', decisionId).single();
        if (data) existing = data;
    }

    const { data: entries } = await sb.from('entries')
        .select('id, car_number, teams(name), entry_drivers(driver_id, drivers(display_name))')
        .eq('event_id', eventId)
        .order('car_number');

    const entryOpts = '<option value="">— No entry / general —</option>' +
        (entries || []).map(en => `<option value="${esc(en.id)}" ${en.id===existing.entry_id?'selected':''}>${en.car_number != null ? '#' + en.car_number + ' — ' : ''}${esc(en.teams?.name)}</option>`).join('');

    const rulings = [
        { value: 'no_action', label: 'No Action' },
        { value: 'reprimand', label: 'Reprimand' },
        { value: 'penalty',   label: 'Penalty' },
        { value: 'dsq',       label: 'DSQ' },
    ];

    window._stewardEntries = entries || [];

    openModal(decisionId ? `Edit Decision — ${esc(eventName)}` : `New Decision — ${esc(eventName)}`,
        `<form id="entity-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Decision No.</label>
                    <input type="text" name="decision_no" value="${esc(existing.decision_no)}" placeholder="01, 02…">
                </div>
                <div class="form-group">
                    <label>Ruling <span class="required">*</span></label>
                    ${selectHTML('ruling', rulings, existing.ruling || 'no_action')}
                </div>
            </div>
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" name="title" value="${esc(existing.title)}" placeholder="Contact at Turn 3, Lap 12" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Entry (optional)</label>
                    <select id="sd-entry" name="entry_id" onchange="loadEntryDriversForSteward(this)">
                        ${entryOpts}
                    </select>
                </div>
                <div class="form-group">
                    <label>Driver (optional)</label>
                    <select name="driver_id" id="sd-driver">
                        <option value="">— Whole team / N/A —</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Decision Content <span class="required">*</span></label>
                <textarea name="content" rows="8" placeholder="Investigation, finding, ruling rationale…" required>${esc(existing.content)}</textarea>
                <div class="form-hint">Shown verbatim on the public results page.</div>
            </div>
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="saveStewardDecision('${eventId}','${esc(eventName)}','${decisionId}')">Save Decision</button>`
    );

    // If editing, pre-load driver options for the existing entry
    if (existing.entry_id) {
        const sel = document.getElementById('sd-entry');
        loadEntryDriversForSteward(sel);
        const driverSel = document.getElementById('sd-driver');
        if (existing.driver_id && driverSel) driverSel.value = existing.driver_id;
    }
}

function loadEntryDriversForSteward(sel) {
    const driverSel = document.getElementById('sd-driver');
    driverSel.innerHTML = '<option value="">— Whole team / N/A —</option>';
    const entry = (window._stewardEntries || []).find(e => e.id === sel.value);
    if (!entry) return;
    (entry.entry_drivers || []).forEach(ed => {
        if (!ed.drivers) return;
        const opt = document.createElement('option');
        opt.value = ed.driver_id;
        opt.textContent = ed.drivers.display_name;
        driverSel.appendChild(opt);
    });
}

async function saveStewardDecision(eventId, eventName, decisionId) {
    const d = getFormData('entity-form');
    if (!d.title || !d.content) { toast('Title and content are required.', 'error'); return; }
    const payload = {
        event_id:    eventId,
        decision_no: d.decision_no || null,
        title:       d.title,
        content:     d.content,
        ruling:      d.ruling || 'no_action',
        entry_id:    d.entry_id  || null,
        driver_id:   d.driver_id || null,
    };
    const { error } = decisionId
        ? await sb.from('steward_decisions').update(payload).eq('id', decisionId)
        : await sb.from('steward_decisions').insert({ ...payload, issued_by: currentUser.id });
    if (error) { toast(error.message, 'error'); return; }
    toast(decisionId ? 'Decision updated.' : 'Decision recorded.', 'success');
    closeModal();
    await viewEventSteward(eventId, eventName);
}

async function deleteStewardDecision(id, eventId, eventName) {
    if (!confirm('Delete this steward decision?')) return;
    const { error } = await sb.from('steward_decisions').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Decision deleted.', 'success');
    await viewEventSteward(eventId, eventName);
}

async function sendApplicationEmail(applicationId, emailType) {
    if (!confirm(`Send the ${emailType} email to this applicant?`)) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { toast('Not signed in.', 'error'); return; }

    toast('Sending…', 'success');
    try {
        const res = await fetch('/.netlify/functions/send-application-email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ application_id: applicationId, email_type: emailType }),
        });
        const text = await res.text();
        let payload = {};
        try { payload = JSON.parse(text); } catch {}
        if (!res.ok) {
            toast(`Email failed: ${payload.error || text || res.status}`, 'error');
            return;
        }
        toast(`${emailType.charAt(0).toUpperCase()+emailType.slice(1)} email sent.`, 'success');
        await viewApplication(applicationId);
    } catch (err) {
        toast(`Email failed: ${err.message}`, 'error');
    }
}

async function saveDriverFromApplication(appId) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkDriverNameUnique(d.display_name, null);
    if (dupName) { toast(dupName, 'error'); return; }
    const num = checkCareerNumber(d.career_number, null);
    if (!num.ok) { toast(num.error, 'error'); return; }
    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        nationality: d.nationality, career_number: num.value,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
        gt7_dr_rating: d.gt7_dr_rating || null, gt7_sr_rating: d.gt7_sr_rating || null,
    };
    const { data: created, error } = await sb.from('drivers').insert(payload).select('id').single();
    if (error) { toast(error.message, 'error'); return; }
    const { error: linkErr } = await sb.from('applications')
        .update({ linked_driver_id: created.id })
        .eq('id', appId);
    if (linkErr) { toast(`Driver created, but link failed: ${linkErr.message}`, 'error'); }
    else { toast('Driver added and linked to application.', 'success'); }
    closeModal();
    await loadCache();
    await renderApplications();
}
