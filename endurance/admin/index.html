async function saveDriverFromApplication(appId) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkDriverNameUnique(d.display_name, null);
    if (dupName) { toast(dupName, 'error'); return; }
    const num = checkCareerNumber(d.career_number, null);
    if (!num.ok) { toast(num.error, 'error'); return; }

    // If a driver with this PSN already exists, link the application to
    // them instead of creating a duplicate. PSN match is case-insensitive,
    // trimmed — same as the DB unique index in migration 43.
    const psnKey = (d.psn_id || '').trim().toLowerCase();
    if (psnKey) {
        const { data: existing } = await sb.from('drivers')
            .select('id, display_name')
            .ilike('psn_id', d.psn_id.trim())
            .maybeSingle();
        if (existing) {
            await sb.from('applications').update({ linked_driver_id: existing.id }).eq('id', appId);
            toast(`PSN "${d.psn_id}" already belongs to ${existing.display_name} — linked to them instead.`, 'success');
            closeModal();
            await loadCache();
            await renderApplications();
            return;
        }
    }

    // Carry over willing_host from the original application
    const { data: srcApp } = await sb.from('applications').select('willing_host').eq('id', appId).maybeSingle();

    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        discord_username: d.discord_username || null,
        nationality: d.nationality, career_number: num.value,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
        gt7_dr_rating: d.gt7_dr_rating || null, gt7_sr_rating: d.gt7_sr_rating || null,
        willing_host: srcApp?.willing_host ?? false,
    };
    const { data: created, error } = await sb.from('drivers').insert(payload).select('id').single();
    if (error) { toast(error.message, 'error'); return; }
    const { error: linkErr } = await sb.from('applications')
        .update({ linked_driver_id: created.id })
        .eq('id', appId);
    if (linkErr) { toast(`Driver created, but link failed: ${linkErr.message}`, 'error'); }
    else { toast('Driver added and linked to application.', 'success'); }
    closeModal();
    await loadCache();
    await renderApplications();
}

async function saveTeamFromApplication(appId) {
    const d = getFormData('entity-form');
    if (!d.name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    if (!d.manufacturer_id) { toast('A manufacturer must be assigned before saving a team.', 'error'); return; }
    const dupName = checkTeamNameUnique(d.name, null);
    if (dupName) { toast(dupName, 'error'); return; }
    d.slug = uniqueTeamSlug(d.slug);

    // Load the application — we'll spin up the applicant as the team leader.
    const { data: app } = await sb.from('applications').select('*').eq('id', appId).single();

    // 1. Create the team
    const teamPayload = { name: d.name, slug: d.slug, manufacturer_id: d.manufacturer_id || null, home_country: d.home_country, founded_on: d.founded_on, bio: d.bio };
    const { data: createdTeam, error: teamErr } = await sb.from('teams').insert(teamPayload).select('id').single();
    if (teamErr) { toast(teamErr.message, 'error'); return; }

    // 2. Try to make the applicant the team leader. If they already exist
    //    as a driver (matched by PSN, case-insensitive), reuse them rather
    //    than creating a duplicate — the DB unique index in migration 43
    //    would reject it anyway, and we want the existing user account /
    //    career number / history to stay intact.
    let leaderDriverId = null;
    let leaderReused   = false;
    if (app?.name) {
        if (app.psn_id && app.psn_id.trim()) {
            const { data: existing } = await sb.from('drivers')
                .select('id, current_team_id')
                .ilike('psn_id', app.psn_id.trim())
                .maybeSingle();
            if (existing) {
                leaderDriverId = existing.id;
                leaderReused   = true;
                // They applied as a team, so they want to be on this team —
                // move them regardless of where they were before. The trigger
                // from migration 42 cleans up any pending join requests, and
                // migration 39's capacity trigger lets us through since the
                // brand-new team has zero drivers.
                await sb.from('drivers').update({ current_team_id: createdTeam.id }).eq('id', existing.id);
                await sb.from('teams').update({ leader_driver_id: leaderDriverId }).eq('id', createdTeam.id);
                await sb.from('applications').update({ linked_driver_id: leaderDriverId }).eq('id', appId);
            }
        }
        if (!leaderDriverId) {
            const slugify = s => (s || '').toLowerCase().trim()
                .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            const driverPayload = {
                display_name: app.name,
                slug: slugify(app.name),
                psn_id: app.psn_id || null,
                discord_username: app.discord_username || null,
                nationality: app.nationality || null,
                gt7_dr_rating: app.gt7_dr_rating || null,
                gt7_sr_rating: app.gt7_sr_rating || null,
                current_team_id: createdTeam.id,
                joined_at: new Date().toISOString().slice(0, 10),
            };
            const { data: createdDriver, error: drvErr } = await sb.from('drivers').insert(driverPayload).select('id').single();
            if (!drvErr && createdDriver) {
                leaderDriverId = createdDriver.id;
                await sb.from('teams').update({ leader_driver_id: leaderDriverId }).eq('id', createdTeam.id);
                await sb.from('applications').update({ linked_driver_id: leaderDriverId }).eq('id', appId);
            } else if (drvErr) {
                console.warn('Driver creation skipped:', drvErr.message);
            }
        }
    }

    // 3. Link the team to the application
    const { error: linkErr } = await sb.from('applications')
        .update({ linked_team_id: createdTeam.id })
        .eq('id', appId);
    if (linkErr) { toast(`Team created, but link failed: ${linkErr.message}`, 'error'); }
    else {
        const msg = !leaderDriverId          ? 'Team created.'
                   : leaderReused             ? 'Team created — existing driver set as team leader.'
                                              : 'Team created — applicant added as team leader.';
        toast(msg, 'success');
    }
    closeModal();
    await loadCache();
    await renderApplications();
}

async function confirmLinkApplicationToExisting(appId) {
    const driverId = document.getElementById('link-existing-driver-select')?.value;
    if (!driverId) { toast('Please select a driver.', 'error'); return; }
    const { error } = await sb.from('applications').update({ linked_driver_id: driverId }).eq('id', appId);
    if (error) { toast(error.message, 'error'); return; }
    toast('Application linked to existing driver.', 'success');
    closeModal();
    await renderApplications();
}

async function saveApplicationStatus(id) {
    const d = getFormData('entity-form');
    const { error } = await sb.from('applications').update({
        status: d.status,
        reviewer_note: d.reviewer_note || null,
        reviewed_at: new Date().toISOString(),
    }).eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Status updated.', 'success');
    closeModal();
    await renderApplications();
    await refreshAppsBadge();
}

async function deleteApplication(id, name) {
    if (!confirm(`Delete application from "${name}"?`)) return;
    const { error } = await sb.from('applications').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Deleted.', 'success');
    await renderApplications();
    await refreshAppsBadge();
}


// ============================================================
// 11d. Admin Activity Log
// ============================================================
async function renderActivityLog() {
    const { data, error } = await sb.from('admin_activity_log')
        .select('id, admin_email, table_name, operation, entity_id, summary, created_at')
        .order('created_at', { ascending: false })
        .limit(500);
    if (error) { toast(error.message, 'error'); return; }

    const fmtWhen = iso => iso ? new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
    const opBadge = op => {
        const cls = op === 'INSERT' ? 'badge-green' : op === 'DELETE' ? 'badge-muted' : 'badge-gold';
        const label = op === 'INSERT' ? 'Added' : op === 'DELETE' ? 'Deleted' : 'Updated';
        return `<span class="badge ${cls}">${label}</span>`;
    };
    const friendly = {
        drivers: 'Driver', teams: 'Team', manufacturers: 'Manufacturer',
        events: 'Event', seasons: 'Season', applications: 'Application',
        penalties: 'Penalty', driver_contact_messages: 'Message',
        news_articles: 'News', media_items: 'Media', rules_pages: 'Rules page',
        entries: 'Entry', results: 'Result', result_drivers: 'Driver result',
        user_roles: 'Role',
    };

    const rows = !data?.length
        ? `<tr><td colspan="6"><div class="empty-state">No activity yet — admin actions will appear here.</div></td></tr>`
        : data.map(a => `
            <tr>
                <td class="td-muted" style="font-size:0.78rem;white-space:nowrap">${fmtWhen(a.created_at)}</td>
                <td><strong>${esc(a.admin_email) || '<em>—</em>'}</strong></td>
                <td>${opBadge(a.operation)} <span class="td-muted" style="font-size:0.82rem">${esc(friendly[a.table_name] || a.table_name)}</span></td>
                <td class="td-muted" style="font-size:0.84rem;max-width:340px">${esc(a.summary) || '<em>—</em>'}</td>
                <td><div class="row-actions">
                    <button class="btn-icon danger" onclick="deleteActivityRow(${a.id})">Delete</button>
                </div></td>
            </tr>`).join('');

    document.getElementById('content').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:0.75rem;flex-wrap:wrap">
            <div style="font-size:0.85rem;color:var(--muted)">Everything admins create, edit, or delete is logged here. Showing the most recent 500.</div>
            <button class="btn btn-ghost" onclick="clearActivityLog()">Clear All</button>
        </div>
        <div class="table-wrap">
            <table><thead><tr>
                <th>When</th><th>Admin</th><th>Action</th><th>Summary</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function deleteActivityRow(id) {
    if (!confirm('Delete this log entry?')) return;
    const { error } = await sb.from('admin_activity_log').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Deleted.', 'success');
    await renderActivityLog();
}

async function clearActivityLog() {
    if (!confirm('Clear the entire admin activity log? This cannot be undone.')) return;
    const { data, error } = await sb.rpc('clear_admin_activity_log');
    if (error)     { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not clear.', 'error'); return; }
    toast('Activity log cleared.', 'success');
    await renderActivityLog();
}

async function renderMessages() {
    const { data, error } = await sb.from('driver_contact_messages')
        .select('*, drivers(id, display_name, slug, psn_id)')
        .order('created_at', { ascending: false });
    if (error) { toast(error.message, 'error'); return; }

    const statusBadge = {
        new:         '<span class="badge badge-yellow">New</span>',
        in_progress: '<span class="badge badge-gold">In Progress</span>',
        resolved:    '<span class="badge badge-green">Resolved</span>',
        dismissed:   '<span class="badge badge-muted">Dismissed</span>',
    };
    const counts = { new:0, in_progress:0, resolved:0, dismissed:0 };
    (data || []).forEach(m => counts[m.status] = (counts[m.status]||0) + 1);

    const fmtWhen = iso => iso ? new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

    // Collapse broadcasts: one row per (broadcast_by, created_at second, subject)
    // — otherwise a single "Message All Drivers" send fills the list with one
    // row per recipient and reads as if those drivers were the senders.
    const broadcastGroups = {};
    const visibleRows = [];
    (data || []).forEach(m => {
        if (m.is_broadcast) {
            const key = `${m.broadcast_by || ''}|${(m.created_at || '').slice(0, 19)}|${m.subject || ''}`;
            (broadcastGroups[key] = broadcastGroups[key] || []).push(m);
        } else {
            visibleRows.push(m);
        }
    });
    const broadcastRowKeys = Object.keys(broadcastGroups).sort((a, b) => {
        const ta = broadcastGroups[a][0].created_at;
        const tb = broadcastGroups[b][0].created_at;
        return tb.localeCompare(ta);
    });

    const broadcastTableRows = broadcastRowKeys.map(k => {
        const groupRows = broadcastGroups[k];
        const m = groupRows[0];
        const ids = groupRows.map(g => g.id).join(',');
        return `
            <tr>
                <td><span class="badge badge-gold" style="margin-right:0.35rem">Broadcast</span><strong>${groupRows.length} driver${groupRows.length === 1 ? '' : 's'}</strong></td>
                <td class="td-muted" style="font-size:0.84rem">${esc(m.subject) || '<em>No subject</em>'}</td>
                <td class="td-muted" style="font-size:0.82rem;max-width:340px">${esc((m.message || '').slice(0, 120))}${(m.message || '').length > 120 ? '…' : ''}</td>
                <td><span class="badge badge-gold">Broadcast</span></td>
                <td class="td-muted" style="font-size:0.78rem;white-space:nowrap">${fmtWhen(m.created_at)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="viewMessage('${m.id}')">View</button>
                    <button class="btn-icon danger" onclick="deleteBroadcastGroup('${ids}', ${groupRows.length})">Delete All</button>
                </div></td>
            </tr>`;
    }).join('');

    const otherRows = visibleRows.map(m => {
        const kindBadge = m.is_direct
            ? '<span class="badge badge-gold" style="margin-right:0.35rem">Admin → Driver</span>'
            : '';
        const replyChip = m.driver_reply
            ? ' <span class="badge" style="background:rgba(56,189,248,0.15);color:#38bdf8;margin-left:0.35rem">Reply</span>'
            : '';
        return `
            <tr>
                <td>${kindBadge}<strong>${esc(m.drivers?.display_name) || '—'}</strong>${replyChip}${m.drivers?.psn_id ? `<br><small class="td-muted">${esc(m.drivers.psn_id)}</small>` : ''}</td>
                <td class="td-muted" style="font-size:0.84rem">${esc(m.subject) || '<em>No subject</em>'}</td>
                <td class="td-muted" style="font-size:0.82rem;max-width:340px">${esc((m.message || '').slice(0, 120))}${(m.message || '').length > 120 ? '…' : ''}</td>
                <td>${statusBadge[m.status] || esc(m.status)}</td>
                <td class="td-muted" style="font-size:0.78rem;white-space:nowrap">${fmtWhen(m.created_at)}</td>
                <td><div class="row-actions">
                    <button class="btn-icon" onclick="viewMessage('${m.id}')">View</button>
                    <button class="btn-icon danger" onclick="deleteMessage('${m.id}')">Delete</button>
                </div></td>
            </tr>`;
    }).join('');

    const rows = (broadcastTableRows + otherRows) || `<tr><td colspan="6"><div class="empty-state">No messages from drivers yet.</div></td></tr>`;

    document.getElementById('content').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:0.75rem;flex-wrap:wrap">
            <div style="font-size:0.85rem;color:var(--muted)">Drivers can write to admins from their portal; replies show in their inbox. Message one driver or broadcast to all.</div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <button class="btn btn-ghost" onclick="openDirectMessageModal()">Message Driver</button>
                <button class="btn btn-ghost" onclick="openLobbyHostsModal()">Message Lobby Hosts</button>
                <button class="btn btn-ghost" onclick="openSoloDriversModal()">Message Solo Drivers</button>
                <button class="btn btn-ghost" onclick="openNoManufacturerModal()">Message No Manufacturer</button>
                <button class="btn btn-ghost" onclick="openTeamLeadersModal()">Message Team Leaders</button>
                <button class="btn btn-primary" onclick="openBroadcastModal()">Message All Drivers</button>
            </div>
        </div>
        <div class="stat-grid" style="margin-bottom:1.5rem">
            <div class="stat-card${counts.new > 0 ? ' stat-card-alert' : ''}"><div class="stat-card-label">New</div><div class="stat-card-value">${counts.new}</div></div>
            <div class="stat-card"><div class="stat-card-label">In Progress</div><div class="stat-card-value">${counts.in_progress}</div></div>
            <div class="stat-card"><div class="stat-card-label">Resolved</div><div class="stat-card-value">${counts.resolved}</div></div>
            <div class="stat-card"><div class="stat-card-label">Dismissed</div><div class="stat-card-value">${counts.dismissed}</div></div>
        </div>
        <div class="table-wrap" style="max-height:62vh;overflow-y:auto">
            <table><thead style="position:sticky;top:0;background:var(--bg-1);z-index:2"><tr>
                <th>Driver</th><th>Subject</th><th>Message</th><th>Status</th><th>Sent</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function sendBroadcast() {
    const d = getFormData('entity-form');
    if (!d.message) { toast('Message body is required.', 'error'); return; }
    const phrase = prompt('Type SEND to confirm broadcasting this message to every driver:');
    if (phrase !== 'SEND') { toast('Cancelled — phrase did not match.', 'error'); return; }
    const { data, error } = await sb.rpc('broadcast_message_to_drivers', {
        p_subject: d.subject || null,
        p_message: d.message,
    });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not send.', 'error'); return; }
    toast(`Broadcast sent to ${data.count} driver${data.count === 1 ? '' : 's'}.`, 'success');
    closeModal();
    await renderMessages();
    await refreshMsgsBadge();
}

async function viewMessage(id) {
    const { data: m } = await sb.from('driver_contact_messages')
        .select('*, drivers(display_name, slug, psn_id)')
        .eq('id', id).single();
    if (!m) { toast('Message not found.', 'error'); return; }

    const fmtWhen = iso => iso ? new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';

    const statusOpts = ['new','in_progress','resolved','dismissed']
        .map(s => `<option value="${s}" ${m.status===s?'selected':''}>${s.replace('_',' ').replace(/^./, c => c.toUpperCase())}</option>`)
        .join('');

    const profileLink = m.drivers?.slug
        ? `<a href="/endurance/drivers/?slug=${esc(m.drivers.slug)}" target="_blank" style="color:var(--gold);text-decoration:none">View profile →</a>`
        : '';

    const incidentLink = m.incident_url
        ? `<div style="font-size:0.82rem;margin-bottom:0.75rem">
              <span style="color:var(--muted)">Incident link</span><br>

        : '';

    // For all non-broadcast messages, fetch and render thread posts
    let conversationSection = '';
    if (!m.is_broadcast) {
        const { data: posts } = await sb.from('message_thread_posts')
            .select('id, sender_type, content, created_at')
            .eq('message_id', id)
            .order('created_at', { ascending: true });

        const postsHtml = (posts || []).length
            ? (posts || []).map(p => {
                const isAdmin = p.sender_type === 'admin';
                return `<div style="display:flex;flex-direction:column;align-items:${isAdmin ? 'flex-start' : 'flex-end'}">
                    <div style="max-width:85%;padding:0.55rem 0.8rem;border-radius:6px;${isAdmin
                        ? 'background:rgba(255,209,102,0.07);border:1px solid rgba(255,209,102,0.2);border-left:3px solid var(--gold)'

                    </div>
                </div>`;
            }).join('')
            : '<div style="font-size:0.8rem;color:var(--muted);font-style:italic">No posts yet.</div>';

        conversationSection = `
            <div style="font-size:0.72rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem">Conversation</div>
            <div style="display:flex;flex-direction:column;gap:0.5rem;max-height:260px;overflow-y:auto;padding:0.65rem;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;margin-bottom:1rem">
                ${postsHtml}
            </div>`;
    } else {
        const replyHistory = m.admin_reply
            ? `<div style="margin-bottom:1rem;padding:0.85rem 1rem;background:rgba(255,209,102,0.06);border:1px solid rgba(255,209,102,0.2);border-radius:6px">

async function saveMessageStatus(id, isDirect = false) {
    const d = getFormData('entity-form');

    if (isDirect) {
        const reply = (d.thread_reply || '').trim();
        if (reply) {
            const { data, error } = await sb.rpc('admin_reply_to_thread', {
                p_message_id: id,
                p_content:    reply,
            });
            if (error)     { toast(error.message, 'error'); return; }
            if (!data?.ok) { toast(data?.error || 'Could not send reply.', 'error'); return; }
        }
        const { error } = await sb.from('driver_contact_messages')
            .update({ status: d.status, admin_note: d.admin_note || null })
            .eq('id', id);
        if (error) { toast(error.message, 'error'); return; }
        toast(reply ? 'Reply sent.' : 'Updated.', 'success');
    } else {
        const reply = (d.admin_reply || '').trim();
        const { data: existing } = await sb.from('driver_contact_messages')
            .select('admin_reply').eq('id', id).single();
        const payload = {
            status:      d.status,
            admin_note:  d.admin_note || null,
            admin_reply: reply || null,
        };
        if (reply && (!existing?.admin_reply || existing.admin_reply !== reply)) {
            const { data: u } = await sb.auth.getUser();
            payload.replied_at           = new Date().toISOString();
            payload.replied_by           = u.user?.id || null;
            payload.driver_read_reply_at = null;
        }
        const { error } = await sb.from('driver_contact_messages').update(payload).eq('id', id);
        if (error) { toast(error.message, 'error'); return; }
        toast(reply ? 'Reply sent to driver.' : 'Message updated.', 'success');
    }

    closeModal();
    await renderMessages();
    await refreshMsgsBadge();
}

// Pull the YouTube video id out of any common URL shape.
function ytId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
}

const MEDIA_CATEGORIES = [
    { value: 'race_highlights',    label: 'Race Highlights' },
    { value: 'podiums',            label: 'Podiums' },
    { value: 'liveries',           label: 'Liveries' },
    { value: 'onboards',           label: 'Onboards' },
    { value: 'behind_the_scenes',  label: 'Behind the Scenes' },
    { value: 'stewarding',         label: 'Stewarding' },
];

// Detect YouTube / Twitch / Vimeo from a pasted URL so admins don't
// have to pick a provider manually. Returns { provider, normalisedUrl }
// or null if it doesn't look like an embed-friendly video URL.
function detectEmbedProvider(raw) {
    if (!raw) return null;
    const url = raw.trim();
    if (/(?:youtube\.com|youtu\.be)/i.test(url))            return { provider: 'youtube', url };
    if (/(?:twitch\.tv|clips\.twitch\.tv)/i.test(url))      return { provider: 'twitch', url };
    if (/(?:vimeo\.com)/i.test(url))                        return { provider: 'vimeo', url };
    return null;
}

            </div>

                <label>Video URL <span class="required">*</span></label>
                <input type="url" name="embed_url" placeholder="https://youtu.be/… or https://twitch.tv/videos/…">

    const isEmbed = input.value === 'embed';
    document.getElementById('media-image-group').style.display = isEmbed ? 'none' : '';

}

async function saveMedia() {
    const d = getFormData('entity-form');
    const kind = document.querySelector('input[name="media_kind"]:checked')?.value || 'image';

    if (kind === 'embed') {
        const detected = detectEmbedProvider(d.embed_url);
        if (!detected) { toast('Paste a YouTube, Twitch or Vimeo URL.', 'error'); return; }
        const { error } = await sb.from('media_items').insert({
            title:    d.title    || null,
            caption:  d.caption  || null,
            url:      detected.url,
            category: d.category || null,
            embed_provider: detected.provider,
        });
        if (error) { toast(error.message, 'error'); return; }
        toast('Video added.', 'success');
        closeModal();
        await renderMedia();
        return;
    }

    const fileInput = document.getElementById('media-file');
    if (!fileInput?.files?.[0]) { toast('Select an image file.', 'error'); return; }
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    toast('Uploading…', 'success');
    const { error: upErr } = await sb.storage.from('gtec-media').upload(path, file);
    if (upErr) { toast(upErr.message, 'error'); return; }
    const { data: { publicUrl } } = sb.storage.from('gtec-media').getPublicUrl(path);
    const { error } = await sb.from('media_items').insert({
        title:    d.title   || null,
        caption:  d.caption || null,
        url:      publicUrl,
        category: d.category || null,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Media uploaded.', 'success');
    closeModal();
    await renderMedia();
}

    const { error } = await sb.from('pages').update({

async function grantAdminFromForm(e) {
    e.preventDefault();

    toast(`Admin granted to ${email}.`, 'success');

async function revokeAdmin(userId, email) {
    if (!confirm(`Revoke admin access for ${email}?`)) return;
    const { data, error } = await sb.rpc('revoke_admin', { p_user_id: userId });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not revoke.', 'error'); return; }
    toast('Admin access revoked.', 'success');
    await renderAdmins();
}

function autoSlug(input, sourceName, targetId) {
    const target = document.getElementById(targetId);
    if (!target || target.dataset.edited) return;
    target.value = slugify(input.value);
    target.addEventListener('input', () => target.dataset.edited = '1', { once: true });
}

function filterTable(input, tableId) {
    const q = input.value.toLowerCase();
    document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}

const _thSortState = {};
function thSort(th, tableId) {
    const ths = Array.from(th.closest('thead').querySelectorAll('th'));
    const col = ths.indexOf(th);
    const state = _thSortState[tableId] || { col: -1, dir: 'asc' };
    const dir = (state.col === col && state.dir === 'asc') ? 'desc' : 'asc';
    _thSortState[tableId] = { col, dir };
    ths.forEach((t, i) => {
        t.classList.remove('sort-asc', 'sort-desc');
        if (i === col) t.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
    });
    const tbody = document.querySelector(`#${tableId} tbody`);
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const mult = dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
        const at = (a.cells[col]?.textContent || '').trim().replace(/\s+/g, ' ');
        const bt = (b.cells[col]?.textContent || '').trim().replace(/\s+/g, ' ');
        if (!at || at === '—') return 1;
        if (!bt || bt === '—') return -1;
        return mult * at.localeCompare(bt, undefined, { sensitivity: 'base' });
    });
    rows.forEach(r => tbody.appendChild(r));
}

function _hcActiveToken(tokens) {
    if (!tokens || !tokens.length) return null;
    return tokens
        .filter(t => !t.used_at)
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
}

function _hcFmtDate(iso) {
    const d = new Date(iso);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const pad = n => String(n).padStart(2, '0');
    return `${d.getUTCDate()} ${months[d.getUTCMonth()]} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`;
}

function _hcExpiryBadge(token) {
    if (!token) return `<span class="badge badge-muted hc-expiry-badge" style="flex-shrink:0">No link sent</span>`;
    const msLeft = new Date(token.expires_at).getTime() - Date.now();
    if (msLeft <= 0) {
        return `<span class="badge hc-expiry-badge" style="background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25);flex-shrink:0">Link expired</span>`;
    }
    const h = Math.floor(msLeft / 3600000);
    const m = Math.floor((msLeft % 3600000) / 60000);
    const style = msLeft < 3600000
        ? 'background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25)'
        : msLeft < 14400000
        ? 'background:rgba(251,146,60,0.12);color:#fb923c;border:1px solid rgba(251,146,60,0.25)'
        : 'background:rgba(255,209,102,0.1);color:#ffd166;border:1px solid rgba(255,209,102,0.2)';
    return `<span class="badge hc-expiry-badge" data-expires="${esc(token.expires_at)}" style="${style};flex-shrink:0">Expires in ${h}h ${m}m</span>`;
}

function hcStartCountdown() {
    _hcTimer = setInterval(() => {
        document.querySelectorAll('.hc-expiry-badge[data-expires]').forEach(el => {
            const msLeft = new Date(el.dataset.expires).getTime() - Date.now();
            if (msLeft <= 0) {
                el.textContent = 'Link expired';
                el.style.cssText = 'background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25);flex-shrink:0';
                el.removeAttribute('data-expires');
            } else {
                const h = Math.floor(msLeft / 3600000);
                const m = Math.floor((msLeft % 3600000) / 60000);
                el.textContent = `Expires in ${h}h ${m}m`;
                if (msLeft < 3600000) el.style.color = '#f87171';
                else if (msLeft < 14400000) el.style.color = '#fb923c';
            }
        });
    }, 30000);
}

async function renderHealthCheck() {
    const content = document.getElementById('content');

    // Fetch solo drivers (claimed, no team)
    const { data: soloDrivers, error: e1 } = await sb.from('drivers')
        .select('id, display_name, psn_id, user_id')
        .is('current_team_id', null)
        .not('user_id', 'is', null)
        .order('display_name');

    // Fetch all drivers on teams to compute per-team counts
    const { data: allDriversOnTeams, error: e2 } = await sb.from('drivers')
        .select('id, current_team_id')
        .not('current_team_id', 'is', null);

    const { data: teams, error: e3 } = await sb.from('teams')
        .select('id, name, manufacturer_id, max_drivers, leader_driver_id, manufacturers(name)')
        .order('name');

    // Fetch pending applications to show in-flight counts
    const { data: pending, error: e4 } = await sb.from('team_join_requests')
        .select('driver_id, team_id, teams(name)')
        .eq('status', 'pending');

    // Unclaimed drivers (no user_id — profile exists but not yet claimed)
    const { data: unclaimedDrivers, error: e5 } = await sb.from('drivers')
        .select('id, display_name, psn_id, discord_username, current_team_id, teams!current_team_id(name), driver_claim_tokens(expires_at, used_at, created_at)')
        .is('user_id', null)
        .order('display_name');

    if (e1 || e2 || e3 || e4 || e5) {
        const err = e1 || e2 || e3 || e4 || e5;
        content.innerHTML = `<div class="empty-state">Failed to load health check data: ${esc(err.message)}</div>`;
        console.error('Health check errors:', { e1, e2, e3, e4, e5 });
        return;
    }

    const driverCountByTeam = new Map();
    (allDriversOnTeams || []).forEach(d => {
        driverCountByTeam.set(d.current_team_id, (driverCountByTeam.get(d.current_team_id) || 0) + 1);
    });

    const pendingDriversForTeam = new Map();
    const pendingTeamNamesForDriver = new Map();
    (pending || []).forEach(p => {
        const td = pendingDriversForTeam.get(p.team_id) || new Set();
        td.add(p.driver_id);
        pendingDriversForTeam.set(p.team_id, td);
        const names = pendingTeamNamesForDriver.get(p.driver_id) || [];
        names.push(p.teams?.name || 'Unknown team');
        pendingTeamNamesForDriver.set(p.driver_id, names);
    });

    const openTeams = (teams || []).filter(t => {
        const filled = driverCountByTeam.get(t.id) || 0;
        return filled < (t.max_drivers || 2);
    });

    // Filter pills based on manufacturers of open teams only
    const mfrMap = new Map();
    openTeams.forEach(t => { if (t.manufacturer_id && t.manufacturers) mfrMap.set(t.manufacturer_id, t.manufacturers.name); });
    const mfrList = Array.from(mfrMap.entries()).sort((a, b) => a[1].localeCompare(b[1]));

    const soloCount = (soloDrivers || []).length;
    const openCount = openTeams.length;

    const soloRows = !soloCount
        ? `<div class="empty-state" style="padding:2rem 1rem">All drivers are in teams.</div>`
        : (soloDrivers || []).map(d => {
            const appliedTeams = pendingTeamNamesForDriver.get(d.id) || [];
            return `
            <div class="hc-driver-card">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
                    <div>
                        <div style="font-weight:600">${esc(d.display_name)}</div>
                        <div style="font-size:0.8rem;color:var(--muted)">${esc(d.psn_id) || '—'}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">
                        ${appliedTeams.map(name => `<span class="badge badge-gold">Applied to ${esc(name)}</span>`).join('')}
                        <button class="btn-icon" onclick="openDirectMessageModal('${d.id}','${esc(d.display_name)}')">Message</button>
                    </div>
                </div>
            </div>`;
        }).join('');

    const teamRows = !openCount
        ? `<div class="empty-state" style="padding:2rem 1rem">All teams are full.</div>`
        : openTeams.map(t => {
            const filled = driverCountByTeam.get(t.id) || 0;
            const max = t.max_drivers || 2;
            const open = max - filled;
            const mfr = t.manufacturers?.name || '—';
            const mfrId = t.manufacturer_id || '';
            const inbound = pendingDriversForTeam.get(t.id)?.size || 0;
            return `
            <div class="hc-team-card" data-mfr="${esc(mfrId)}">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
                    <div>
                        <div style="font-weight:600">${esc(t.name)}</div>
                        <div style="font-size:0.8rem;color:var(--muted)">${esc(mfr)} &middot; ${filled}/${max} driver${max > 1 ? 's' : ''}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">
                        ${inbound ? `<span class="badge badge-green">${inbound} pending</span>` : ''}
                        <span class="badge badge-muted">${open} seat${open > 1 ? 's' : ''} open</span>
                    </div>
                </div>
            </div>`;
        }).join('');

    const pillsHtml = mfrList.length > 1 ? `
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.25rem">
            <button class="btn btn-ghost hc-pill active" data-mfr="" onclick="hcFilter('')">All teams</button>
            ${mfrList.map(([id, name]) => `<button class="btn btn-ghost hc-pill" data-mfr="${esc(id)}" onclick="hcFilter('${esc(id)}')">${esc(name)}</button>`).join('')}
        </div>` : '';

    // Teams without a leader
    const leaderlessTeams = (teams || []).filter(t => !t.leader_driver_id);
    const leaderlessCount = leaderlessTeams.length;
    const leaderlessRows = !leaderlessCount
        ? `<div class="empty-state" style="padding:2rem 1rem">All teams have a leader assigned.</div>`
        : leaderlessTeams.map(t => {
            const filled = driverCountByTeam.get(t.id) || 0;
            return `
            <div class="hc-driver-card" style="border-color:rgba(239,68,68,0.4)">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
                    <div>
                        <div style="font-weight:600">${esc(t.name)}</div>
                        <div style="font-size:0.8rem;color:var(--muted)">${esc(t.manufacturers?.name || '—')} &middot; ${filled} driver${filled !== 1 ? 's' : ''}</div>
                    </div>
                    <span class="badge" style="background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);flex-shrink:0">No leader</span>
                </div>
            </div>`;
        }).join('');

    // Unclaimed drivers
    const unclaimedCount = (unclaimedDrivers || []).length;
    const unclaimedRows = !unclaimedCount
        ? `<div class="empty-state" style="padding:2rem 1rem">All drivers have claimed their profile.</div>`
        : (unclaimedDrivers || []).map(d => {
            const token = _hcActiveToken(d.driver_claim_tokens);
            const expiryBadge = _hcExpiryBadge(token);
            const hasActive = token && new Date(token.expires_at).getTime() > Date.now();
            const expiryDate = hasActive
                ? `<div style="font-size:0.72rem;color:var(--muted);margin-top:2px">Expires ${_hcFmtDate(token.expires_at)}</div>`
                : '';
            return `
            <div class="hc-driver-card">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
                    <div style="min-width:0">
                        <div style="font-weight:600">${esc(d.display_name)}</div>
                        <div style="font-size:0.8rem;color:var(--muted)">${d.teams?.name ? esc(d.teams.name) : 'No team'} &middot; ${esc(d.psn_id || '—')}${d.discord_username ? ` &middot; ${esc(d.discord_username)}` : ''}</div>
                        ${expiryDate}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">
                        ${expiryBadge}
                        <button class="btn-icon" onclick="generateClaimLink('${d.id}','${esc(d.display_name)}')">New link</button>
                    </div>
                </div>
            </div>`;
        }).join('');

    // Drivers who flagged themselves unable to attend upcoming scheduled events
    const { data: activeSeason } = await sb.from('seasons').select('id').eq('is_active', true).maybeSingle();
    let absentPanelRows = '';
    let absentTotalCount = 0;
    if (activeSeason) {
        const { data: upcomingEvs } = await sb.from('events')
            .select('id, name, round, starts_at')
            .eq('season_id', activeSeason.id)
            .eq('status', 'scheduled')
            .gte('starts_at', new Date().toISOString())
            .order('starts_at');
        if (upcomingEvs?.length) {
            const { data: absRows } = await sb.from('driver_event_absences')
                .select('driver_id, event_id, drivers(display_name, psn_id, current_team_id, teams!current_team_id(name))')
                .in('event_id', upcomingEvs.map(e => e.id));
            const byEvent = new Map();
            (absRows || []).forEach(r => {
                const list = byEvent.get(r.event_id) || [];
                list.push(r);
                byEvent.set(r.event_id, list);
            });
            absentTotalCount = (absRows || []).length;
            const eventSections = upcomingEvs.map(ev => {
                const drivers = byEvent.get(ev.id) || [];
                if (!drivers.length) return '';
                const driverCards = drivers.map(r => {
                    const d = r.drivers;
                    return `<div class="hc-driver-card" style="border-color:rgba(239,68,68,0.3)">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
                            <div>
                                <div style="font-weight:600">${esc(d?.display_name || '—')}</div>
                                <div style="font-size:0.8rem;color:var(--muted)">${esc(d?.teams?.name || 'No team')} &middot; ${esc(d?.psn_id || '—')}</div>
                            </div>
                            <button class="btn-icon" onclick="openDirectMessageModal('${r.driver_id}','${esc(d?.display_name || '')}')">Message</button>
                        </div>
                    </div>`;
                }).join('');
                return `<div style="margin-bottom:1rem">
                    <div style="font-size:0.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem">R${ev.round} — ${esc(ev.name)} <span style="font-weight:400">(${new Date(ev.starts_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })})</span></div>
                    <div style="display:flex;flex-direction:column;gap:0.5rem">${driverCards}</div>
                </div>`;
            }).filter(Boolean).join('');
            absentPanelRows = eventSections || `<div class="empty-state" style="padding:2rem 1rem">No drivers have flagged themselves as unable to attend.</div>`;
        } else {
            absentPanelRows = `<div class="empty-state" style="padding:2rem 1rem">No upcoming events in the active season.</div>`;
        }
    } else {
        absentPanelRows = `<div class="empty-state" style="padding:2rem 1rem">No active season.</div>`;
    }

    // No-show watch
    const { data: noShows } = await sb.rpc('driver_no_show_watch', { p_lookback: 5 });
    const noShowCount = (noShows || []).length;
    const noShowRows = !noShowCount
        ? `<div class="empty-state" style="padding:2rem 1rem">No drivers have missed 2 or more of the last 5 races.</div>`
        : (noShows || []).map(d => `
            <div class="hc-driver-card" style="${d.no_shows >= 4 ? 'border-color:rgba(239,68,68,0.4)' : 'border-color:rgba(251,146,60,0.3)'}">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
                    <div>
                        <div style="font-weight:600">${esc(d.display_name)}</div>
                        <div style="font-size:0.8rem;color:var(--muted)">${d.team_name ? esc(d.team_name) : 'No team'} &middot; ${esc(d.psn_id || '—')}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">
                        <span class="badge" style="background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)">${d.no_shows} missed / ${d.events_entered}</span>
                        <button class="btn-icon" onclick="openDirectMessageModal('${d.driver_id}','${esc(d.display_name)}')">Message</button>
                    </div>
                </div>
            </div>`).join('');

    // Dead wood — only meaningful once at least one event has been completed
    const { data: completedEvents, count: completedCount } = await sb.from('events')
        .select('id', { count: 'exact', head: true })
        .eq('status', 'completed');
    const seasonHasStarted = (completedCount || 0) > 0;
    const { data: activity } = seasonHasStarted ? await sb.rpc('driver_activity_report') : { data: [] };
    const inactiveDrivers = (activity || []).filter(d => d.is_claimed && (d.total_entered === 0 || !d.last_raced_at));
    const inactiveCount = inactiveDrivers.length;
    const inactiveRows = !seasonHasStarted
        ? `<div class="empty-state" style="padding:2rem 1rem">No completed races yet — this panel activates after Round 1.</div>`
        : !inactiveCount
        ? `<div class="empty-state" style="padding:2rem 1rem">All drivers have at least one race entry.</div>`
        : inactiveDrivers.map(d => `
            <div class="hc-driver-card">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
                    <div>
                        <div style="font-weight:600">${esc(d.display_name)}</div>

            <div class="hc-section-header">
                <div style="flex:1;min-width:0">
                    <div class="hc-section-title">${title}</div>
                    <div class="hc-section-desc">${desc}</div>
                </div>
                ${extraHeader}
                <span class="hc-section-badge hc-section-badge--${variant}">${count}</span>
            </div>
            <div class="hc-section-body">${bodyHtml}</div>
        </div>`;

    const pillsInline = mfrList.length > 1 ? `
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.5rem">
            <button class="btn btn-ghost hc-pill active" style="padding:0.2rem 0.6rem;font-size:0.72rem" data-mfr="" onclick="hcFilter('')">All</button>
            ${mfrList.map(([id, name]) => `<button class="btn btn-ghost hc-pill" style="padding:0.2rem 0.6rem;font-size:0.72rem" data-mfr="${esc(id)}" onclick="hcFilter('${esc(id)}')">${esc(name)}</button>`).join('')}
        </div>` : '';

    content.innerHTML = `
        <div class="hc-root">

            <div class="hc-stats-row">
                <div class="hc-stat hc-stat--neutral">
                    <span class="hc-stat-num">${soloCount}</span>
                    <span class="hc-stat-label">Solo Drivers</span>
                </div>
                <div class="hc-stat hc-stat--neutral">
                    <span class="hc-stat-num">${openCount}</span>
                    <span class="hc-stat-label">Open Seats</span>
                </div>
                <div class="hc-stat ${unclaimedCount ? 'hc-stat--warn' : 'hc-stat--ok'}">
                    <span class="hc-stat-num">${unclaimedCount}</span>
                    <span class="hc-stat-label">Unclaimed</span>
                </div>
                <div class="hc-stat ${leaderlessCount ? 'hc-stat--critical' : 'hc-stat--ok'}">
                    <span class="hc-stat-num">${leaderlessCount}</span>
                    <span class="hc-stat-label">No Leader</span>
                </div>
                <div class="hc-stat ${noShowCount ? 'hc-stat--warn' : 'hc-stat--ok'}">
                    <span class="hc-stat-num">${noShowCount}</span>
                    <span class="hc-stat-label">No-Show Watch</span>
                </div>
                <div class="hc-stat ${inactiveCount ? 'hc-stat--critical' : 'hc-stat--ok'}">
                    <span class="hc-stat-num">${inactiveCount}</span>
                    <span class="hc-stat-label">Never Raced</span>
                </div>
                <div class="hc-stat ${absentTotalCount ? 'hc-stat--warn' : 'hc-stat--ok'}">
                    <span class="hc-stat-num">${absentTotalCount}</span>
                    <span class="hc-stat-label">Unable to Attend</span>
                </div>
            </div>

            <div class="hc-grid-2">
                ${hcSection('neutral', 'Solo Drivers', 'Registered drivers not currently in a team', soloCount, soloRows)}
                ${hcSection('neutral', 'Teams with Open Seats', 'Teams with capacity for more drivers', openCount, `${pillsInline}<div id="hc-team-list" style="display:flex;flex-direction:column;gap:0.5rem">${teamRows}</div>`)}
            </div>

            <div class="hc-grid-2">
                ${hcSection('warn', 'Unclaimed Profiles', 'Driver records with no linked account', unclaimedCount, unclaimedRows)}
                ${hcSection('critical', 'Teams Without a Leader', 'Teams with no leader driver assigned', leaderlessCount, leaderlessRows)}
            </div>

            <div class="hc-grid-2">
                ${hcSection('warn', 'No-Show Watch', 'Missed 2 or more of the last 5 completed races', noShowCount, noShowRows)}
                ${hcSection('warn', 'Unable to Attend', 'Self-declared unavailability for upcoming events', absentTotalCount, absentPanelRows)}
            </div>

            ${hcSection('critical', 'Never Raced', 'On the roster but no race entries yet', inactiveCount, inactiveRows)}

        </div>
        <style>
            .hc-root { max-width: 1100px; }
            .hc-stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.75rem; margin-bottom: 1.75rem; }
            .hc-stat { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 0.75rem; text-align: center; overflow: hidden; }
            .hc-stat::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
            .hc-stat--neutral::before { background: var(--border); }
            .hc-stat--ok::before     { background: #4ade80; }
            .hc-stat--warn::before   { background: #fb923c; }
            .hc-stat--critical::before { background: #f87171; }
            .hc-stat-num { font-size: 2rem; font-weight: 700; line-height: 1; }
            .hc-stat--warn .hc-stat-num     { color: #fb923c; }
            .hc-stat--critical .hc-stat-num { color: #f87171; }
            .hc-stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; }

            .hc-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; align-items: start; }

            .hc-section { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
            .hc-section-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; background: var(--bg-2); border-bottom: 1px solid var(--border); border-left: 3px solid transparent; }
            .hc-section--neutral .hc-section-header { border-left-color: var(--border); }
            .hc-section--warn .hc-section-header    { border-left-color: #fb923c; }
            .hc-section--critical .hc-section-header { border-left-color: #f87171; }
            .hc-section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text); }
            .hc-section--warn .hc-section-title     { color: #fb923c; }
            .hc-section--critical .hc-section-title { color: #f87171; }
            .hc-section-desc { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
            .hc-section-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 6px; font-size: 0.9rem; font-weight: 700; padding: 0 0.4rem; flex-shrink: 0; }
            .hc-section-badge--neutral  { background: rgba(255,255,255,0.06); color: var(--muted); }
            .hc-section-badge--warn     { background: rgba(251,146,60,0.15); color: #fb923c; }
            .hc-section-badge--critical { background: rgba(239,68,68,0.15); color: #f87171; }
            .hc-section-body { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }

            .hc-driver-card, .hc-team-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.9rem; transition: border-color 0.15s; }
            .hc-driver-card:hover { border-color: var(--accent); }
            .hc-team-card:hover   { border-color: var(--accent); }
            .hc-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
            .hc-hidden { display: none !important; }
        </style>`;

    if (unclaimedCount) hcStartCountdown();
}

function hcFilter(mfrId) {
    document.querySelectorAll('.hc-pill').forEach(p => p.classList.toggle('active', p.dataset.mfr === mfrId));
    document.querySelectorAll('.hc-driver-card, .hc-team-card').forEach(card => {
        card.classList.toggle('hc-hidden', mfrId !== '' && card.dataset.mfr !== mfrId);
    });
}


// ============================================================
// 12. Bootstrap
// ============================================================
initAuth();
</script>
</body>
</html>
