async function viewEventResults(eventId, eventName, lobbyFilter) {
    const panel = document.getElementById('event-entries-panel');
    panel.innerHTML = '<div class="loading-state">Loading results…</div>';

    const [entriesRes, resultsRes] = await Promise.all([
        sb.from('entries')
            .select('id, car_number, car_model, lobby_number, teams(name), entry_drivers(driver_id, drivers(id, display_name, career_number))')
            .eq('event_id', eventId)
            .order('lobby_number')
            .order('car_number'),
        sb.from('results').select('*').eq('event_id', eventId),
    ]);
    if (entriesRes.error) { panel.innerHTML = `<div class="loading-state">${esc(entriesRes.error.message)}</div>`; return; }

    const allEntries = entriesRes.data || [];
    const results    = resultsRes.data || [];
    const rMap       = Object.fromEntries(results.map(r => [r.entry_id, r]));

    const resultIds = results.map(r => r.id);
    let rdMap = {};
    if (resultIds.length) {
        const { data: rds } = await sb.from('result_drivers')
            .select('result_id, driver_id, finish_position, classified, status, laps_driven, points_awarded, pole_point, fastest_lap_point')
            .in('result_id', resultIds);
        (rds || []).forEach(rd => { rdMap[`${rd.result_id}|${rd.driver_id}`] = rd; });
    }

    if (allEntries.length === 0) {
        panel.innerHTML = `
            <div class="section-card">
                <div class="section-card-header"><span class="section-card-title">Results — ${esc(eventName)}</span></div>
                <div class="empty-state">Add entries first before recording results.</div>
            </div>`;
        return;
    }

    const currentLobby = lobbyFilter || defaultLobbyFilter(allEntries);
    const entries = filterEntriesByLobby(allEntries, currentLobby);

    const statusOpts = ['classified', 'dnf', 'dsq', 'dns', 'withdrawn'];

    const rowSpecs = entries.flatMap(en => {
        const drvs = (en.entry_drivers || []).map(ed => ed.drivers).filter(Boolean);
        if (!drvs.length) return [{ entry: en, driver: null }];
        return drvs.map(d => ({ entry: en, driver: d }));
    });

    const rows = rowSpecs.length === 0
        ? `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:2rem">No drivers in this lobby.</td></tr>`
        : rowSpecs.map(({ entry: en, driver: d }) => {
            const r  = rMap[en.id] || {};
            const rd = (r.id && d) ? (rdMap[`${r.id}|${d.id}`] || {}) : {};
            const pos     = rd.finish_position ?? '';
            const status  = rd.status || 'classified';
            const laps    = rd.laps_driven ?? '';
            const points  = rd.points_awarded ?? 0;
            const isPole  = !!rd.pole_point;
            const isFL    = !!rd.fastest_lap_point;
            const statusSel = statusOpts.map(s =>
                `<option value="${s}" ${status === s ? 'selected' : ''}>${s}</option>`).join('');
            const carLabel = en.car_number != null ? '#' + en.car_number : '—';
            const driverLabel = d
                ? `<strong>${esc(d.display_name)}</strong>${d.career_number ? ` <span class="td-muted">#${d.career_number}</span>` : ''}`
                : '<em class="td-muted">No drivers</em>';
            const dAttr = d ? `data-driver="${esc(d.id)}"` : '';
            const dis   = d ? '' : 'disabled';
            const teamCell = en.teams?.name ? esc(en.teams.name) : '<em>Solo</em>';
            return `<tr>
                <td>${driverLabel}<br><span class="td-muted" style="font-size:0.78rem">${carLabel} ${teamCell}${en.lobby_number != null ? ` · L${en.lobby_number}` : ''}</span></td>
                <td><input type="number" min="1" max="99" data-entry="${en.id}" ${dAttr} data-field="finish_position" value="${pos}" style="width:60px;padding:0.4rem 0.5rem" ${dis}></td>
                <td><input type="number" min="0" data-entry="${en.id}" ${dAttr} data-field="laps_driven" value="${laps}" style="width:65px;padding:0.4rem 0.5rem" ${dis}></td>
                <td><select data-entry="${en.id}" ${dAttr} data-field="status" style="padding:0.4rem 0.5rem;font-size:0.82rem" ${dis}>${statusSel}</select></td>
                <td style="text-align:center;font-size:0.78rem;${isPole ? 'color:var(--gold);font-weight:600' : 'color:var(--muted)'}" title="Auto-set from qualifying P1">${isPole ? '★' : '—'}</td>
                <td style="text-align:center"><input type="checkbox" data-entry="${en.id}" ${dAttr} data-field="fastest_lap_point" ${isFL ? 'checked' : ''} style="accent-color:var(--gold);width:16px;height:16px" ${dis}></td>
                <td style="text-align:right;color:var(--gold);font-weight:600">${points}</td>
            </tr>`;
        }).join('');

    const filterSelect = buildLobbyFilter(allEntries, currentLobby,
        `viewEventResults('${eventId}','${esc(eventName)}', this.value)`);

    panel.innerHTML = `
        <div class="section-card">
            <div class="section-card-header">
                <span class="section-card-title">Results — ${esc(eventName)}</span>
                <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
                    ${filterSelect}
                    <button class="btn-icon" onclick="recomputePoints('${eventId}','${esc(eventName)}')">Recompute Points</button>
                    <button class="btn-icon" onclick="computeElo('${eventId}')">Compute Elo</button>
                    <button class="btn-add" onclick="saveResults('${eventId}','${esc(eventName)}')">Save All</button>
                </div>
            </div>
            <table id="results-table"><thead><tr>
                <th>Driver</th><th>Pos</th><th>Laps</th><th>Status</th><th>Pole</th><th>FL</th><th style="text-align:right">Pts</th>
            </tr></thead><tbody>${rows}</tbody></table>
            <div style="padding:0.85rem 1.25rem;font-size:0.78rem;color:var(--muted);border-top:1px solid var(--border)">
                Pick a lobby to record results lobby by lobby. Pole is auto-set from qualifying P1. Points recompute per-driver on save.
            </div>
        </div>`;
}

async function saveResults(eventId, eventName) {
    const rowInputs = document.querySelectorAll('#results-table [data-entry][data-driver]');
    const perDriver = {};
    rowInputs.forEach(inp => {
        const entryId  = inp.dataset.entry;
        const driverId = inp.dataset.driver;
        const key = `${entryId}|${driverId}`;
        perDriver[key] = perDriver[key] || { entry_id: entryId, driver_id: driverId };
        const f = inp.dataset.field;
        if (inp.type === 'checkbox') {
            perDriver[key][f] = inp.checked;
        } else if (f === 'finish_position') {
            perDriver[key][f] = inp.value ? parseInt(inp.value) : null;
        } else if (f === 'laps_driven') {
            perDriver[key][f] = inp.value ? parseInt(inp.value) : 0;
        } else {
            perDriver[key][f] = inp.value || null;
        }
    });

    const driverRows = Object.values(perDriver);

    // FL guard: only one FL per event (pole is now derived from quali)
    const fls = driverRows.filter(r => r.fastest_lap_point);
    if (fls.length > 1) { toast('Only one driver can have the fastest lap point.', 'error'); return; }

    // 1. Ensure each entry has a results row. Use a barebones upsert with
    //    just the keys + sensible defaults so an empty form doesn't violate
    //    NOT NULL constraints. compute_event_points will recompute the rest.
    const entryIds = [...new Set(driverRows.map(d => d.entry_id))];
    const entryStubs = entryIds.map(entry_id => ({ event_id: eventId, entry_id }));
    let resultIdByEntry = {};
    if (entryStubs.length) {
        const { data: upserted, error: upErr } = await sb.from('results')
            .upsert(entryStubs, { onConflict: 'event_id,entry_id', ignoreDuplicates: false })
            .select('id, entry_id');
        if (upErr) { toast(upErr.message, 'error'); return; }
        (upserted || []).forEach(r => { resultIdByEntry[r.entry_id] = r.id; });
    }
    // Pull any result_ids we might have missed (upsert that updated rows
    // already there can return stale data on some Supabase versions).
    if (entryIds.length) {
        const { data: existingResults } = await sb.from('results')
            .select('id, entry_id')
            .eq('event_id', eventId)
            .in('entry_id', entryIds);
        (existingResults || []).forEach(r => { resultIdByEntry[r.entry_id] = r.id; });
    }

    // 2. Roll per-driver data up to the entry-level row (so team standings
    //    still aggregate correctly off results.finish_position etc.)
    const entryGroups = {};
    driverRows.forEach(dr => {
        const g = entryGroups[dr.entry_id] = entryGroups[dr.entry_id] || {
            entry_id: dr.entry_id, positions: [], statuses: [], laps: [], fl: false,
        };
        if (dr.finish_position != null) g.positions.push(dr.finish_position);
        if (dr.status)                  g.statuses.push(dr.status);
        if (dr.laps_driven != null)     g.laps.push(dr.laps_driven);
        if (dr.fastest_lap_point)       g.fl = true;
    });
    const entryUpdates = Object.values(entryGroups).map(g => ({
        event_id: eventId,
        entry_id: g.entry_id,
        finish_position:    g.positions.length ? Math.min(...g.positions) : null,
        classified:         g.statuses.some(s => s === 'classified') || g.statuses.length === 0,
        status:             g.statuses.find(s => s === 'classified') || (g.statuses[0] || 'classified'),
        laps_completed:     g.laps.length ? Math.max(...g.laps) : 0,
        fastest_lap_point:  g.fl,
    }));
    if (entryUpdates.length) {
        const { error } = await sb.from('results').upsert(entryUpdates, { onConflict: 'event_id,entry_id' });
        if (error) { toast(error.message, 'error'); return; }
    }

    // 3. Per-driver upsert
    const driverPayload = driverRows.map(dr => {
        const result_id = resultIdByEntry[dr.entry_id];
        if (!result_id) return null;
        return {
            result_id,
            driver_id:        dr.driver_id,
            finish_position:  dr.finish_position,
            status:           dr.status || 'classified',
            classified:       (dr.status || 'classified') === 'classified',
            laps_driven:      dr.laps_driven ?? null,
            fastest_lap_point: !!dr.fastest_lap_point,
            // points_share defaults to 1.0; per-driver points come from
            // result_drivers.points_awarded which compute_event_points fills.
        };
    }).filter(Boolean);
    if (driverPayload.length) {
        const { error: rdErr } = await sb.from('result_drivers').upsert(driverPayload, { onConflict: 'result_id,driver_id' });
        if (rdErr) { toast('Per-driver save failed: ' + rdErr.message, 'error'); return; }
    }

    // 4. Recompute points (also derives pole from quali server-side)
    const { data: cp, error: cpErr } = await sb.rpc('compute_event_points', { p_event_id: eventId });
    if (cpErr) { toast('Saved, but points recompute failed: ' + cpErr.message, 'error'); }
    else if (cp?.error) { toast('Saved, but points recompute failed: ' + cp.error, 'error'); }
    else toast('Results saved & points recomputed.', 'success');

    const currentLobby = document.getElementById('lobby-filter')?.value;
    await viewEventResults(eventId, eventName, currentLobby);
}

async function recomputePoints(eventId, eventName) {

async function openAddPenaltyModal(eventId, eventName) {
    const { data: entries } = await sb.from('entries')
        .select('id, car_number, teams(name), entry_drivers(driver_id, drivers(display_name))')
        .eq('event_id', eventId)
        .order('car_number');

    const entryOpts = (entries || []).map(en =>
        `<option value="${esc(en.id)}">${en.car_number != null ? '#' + en.car_number + ' — ' : ''}${esc(en.teams?.name)}</option>`).join('');

    const penaltyTypes = [
        { value: 'time_add',         label: 'Time Added' },
        { value: 'points_deduction', label: 'Points Deduction' },
        { value: 'dsq',              label: 'DSQ' },
        { value: 'warning',          label: 'Warning' },
        { value: 'reprimand',        label: 'Reprimand' },
    ];

    openModal(`Add Penalty — ${esc(eventName)}`,
        `<form id="entity-form">
            <div class="form-group">
                <label>Entry <span class="required">*</span></label>
                <select id="pen-entry" name="entry_id" required onchange="loadEntryDriversForPenalty(this)">
                    <option value="">— Select Entry —</option>
                    ${entryOpts}
                </select>
            </div>
            <div class="form-group">
                <label>Driver (optional)</label>
                <select name="driver_id" id="pen-driver">
                    <option value="">— Whole team / unspecified —</option>
                </select>
                <div class="form-hint">Select an entry first to populate drivers.</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Type <span class="required">*</span></label>
                    <select name="penalty_type" id="pen-type" onchange="onPenaltyTypeChange(this)">
                        ${penaltyTypes.map(p => `<option value="${esc(p.value)}" ${p.value === 'time_add' ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group" id="pen-value-row">
                    <label>Value</label>
                    <input type="text" name="penalty_value" id="pen-value" placeholder="+10s, 3 places, etc.">
                </div>
            </div>
            <div class="form-group" id="pen-amount-row" style="display:none">
                <label>Points to deduct <span class="required">*</span></label>
                <input type="number" name="points_amount" id="pen-amount" min="1" max="999" placeholder="e.g. 5">
                <div class="form-hint">Subtracted from the driver's season points (and the team's, if the entry has a team).</div>
            </div>
            <div id="pen-dsq-note" style="display:none;padding:0.6rem 0.85rem;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:6px;font-size:0.82rem;color:#fca5a5;margin-bottom:0.85rem">
                DSQ auto-zeroes the driver's points for this round and marks their result as DSQ — no value needed.
            </div>
            <div class="form-group">
                <label>Reason <span class="required">*</span></label>
                <textarea name="reason" placeholder="Causing a collision at turn 3…" required></textarea>
            </div>
        </form>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-primary" onclick="savePenalty('${eventId}','${esc(eventName)}')">Add Penalty</button>`
    );

    // Cache entries for driver loading
    window._penaltyEntries = entries || [];
}

function loadEntryDriversForPenalty(sel) {
    const entryId = sel.value;
    const driverSel = document.getElementById('pen-driver');
    driverSel.innerHTML = '<option value="">— Whole team / unspecified —</option>';
    const entry = (window._penaltyEntries || []).find(e => e.id === entryId);
    if (!entry) return;
    (entry.entry_drivers || []).forEach(ed => {
        if (!ed.drivers) return;
        const opt = document.createElement('option');
        opt.value = ed.driver_id;
        opt.textContent = ed.drivers.display_name;
        driverSel.appendChild(opt);
    });
}

function onPenaltyTypeChange(sel) {
    const amountRow = document.getElementById('pen-amount-row');
    const valueRow  = document.getElementById('pen-value-row');
    const dsqNote   = document.getElementById('pen-dsq-note');
    if (amountRow) amountRow.style.display = sel.value === 'points_deduction' ? '' : 'none';
    if (valueRow)  valueRow.style.display  = sel.value === 'dsq' ? 'none' : '';
    if (dsqNote)   dsqNote.style.display   = sel.value === 'dsq' ? '' : 'none';
}

async function savePenalty(eventId, eventName) {
    const d = getFormData('entity-form');
    if (!d.entry_id || !d.penalty_type || !d.reason) {
        toast('Entry, type and reason are required.', 'error'); return;
    }
    let pointsAmount = null;
    if (d.penalty_type === 'points_deduction') {
        const raw = parseInt(d.points_amount, 10);
        if (!raw || raw < 1) {
            toast('Enter the number of points to deduct.', 'error'); return;
        }
        pointsAmount = raw;
    }
    const { error } = await sb.from('penalties').insert({
        event_id: eventId,
        entry_id: d.entry_id,
        driver_id: d.driver_id || null,
        penalty_type: d.penalty_type,
        penalty_value: d.penalty_value || (pointsAmount ? `-${pointsAmount} pts` : null),
        points_amount: pointsAmount,
        reason: d.reason,
        issued_by: currentUser.id,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Penalty added.', 'success');
    closeModal();
    await viewEventPenalties(eventId, eventName);
}

async function deletePenalty(id, eventId, eventName) {
    if (!confirm('Delete this penalty?')) return;
    const { error } = await sb.from('penalties').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Penalty deleted.', 'success');
    await viewEventPenalties(eventId, eventName);
}

async function openStewardModal(eventId, eventName, decisionId) {
    let existing = {};
    if (decisionId) {
        const { data } = await sb.from('steward_decisions').select('*').eq('id', decisionId).single();
        if (data) existing = data;
    }

    const { data: entries } = await sb.from('entries')
        .select('id, car_number, teams(name), entry_drivers(driver_id, drivers(display_name))')
        .eq('event_id', eventId)
        .order('car_number');

    const entryOpts = '<option value="">— No entry / general —</option>' +
        (entries || []).map(en => `<option value="${esc(en.id)}" ${en.id===existing.entry_id?'selected':''}>${en.car_number != null ? '#' + en.car_number + ' — ' : ''}${esc(en.teams?.name)}</option>`).join('');

    const rulings = [
        { value: 'no_action', label: 'No Action' },
        { value: 'reprimand', label: 'Reprimand' },
        { value: 'penalty',   label: 'Penalty' },
        { value: 'dsq',       label: 'DSQ' },

    openModal(decisionId ? `Edit Decision — ${esc(eventName)}` : `New Decision — ${esc(eventName)}`,

                    <input type="text" name="decision_no" value="${esc(existing.decision_no)}" placeholder="01, 02…">
                </div>
                <div class="form-group">
                    <label>Ruling <span class="required">*</span></label>

            </div>
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" name="title" value="${esc(existing.title)}" placeholder="Contact at Turn 3, Lap 12" required>
            </div>
            <div class="form-row">
                <div class="form-group">

                <textarea name="content" rows="8" placeholder="Investigation, finding, ruling rationale…" required>${esc(existing.content)}</textarea>

function loadEntryDriversForSteward(sel) {
    const driverSel = document.getElementById('sd-driver');
    driverSel.innerHTML = '<option value="">— Whole team / N/A —</option>';
    const entry = (window._stewardEntries || []).find(e => e.id === sel.value);
    if (!entry) return;
    (entry.entry_drivers || []).forEach(ed => {
        if (!ed.drivers) return;
        const opt = document.createElement('option');
        opt.value = ed.driver_id;
        opt.textContent = ed.drivers.display_name;
        driverSel.appendChild(opt);
    });
}

async function saveStewardDecision(eventId, eventName, decisionId) {
    const d = getFormData('entity-form');
    if (!d.title || !d.content) { toast('Title and content are required.', 'error'); return; }
    const payload = {
        event_id:    eventId,
        decision_no: d.decision_no || null,
        title:       d.title,
        content:     d.content,
        ruling:      d.ruling || 'no_action',
        entry_id:    d.entry_id  || null,
        driver_id:   d.driver_id || null,
    };
    const { error } = decisionId
        ? await sb.from('steward_decisions').update(payload).eq('id', decisionId)
        : await sb.from('steward_decisions').insert({ ...payload, issued_by: currentUser.id });
    if (error) { toast(error.message, 'error'); return; }
    toast(decisionId ? 'Decision updated.' : 'Decision recorded.', 'success');
    closeModal();
    await viewEventSteward(eventId, eventName);
}

async function deleteStewardDecision(id, eventId, eventName) {

    const { error } = await sb.from('steward_decisions').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Decision deleted.', 'success');
    await viewEventSteward(eventId, eventName);
}

async function sendApplicationEmail(applicationId, emailType) {
    if (!confirm(`Send the ${emailType} email to this applicant?`)) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { toast('Not signed in.', 'error'); return; }

    toast('Sending…', 'success');
    try {
        const res = await fetch('/.netlify/functions/send-application-email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ application_id: applicationId, email_type: emailType }),
        });
        const text = await res.text();
        let payload = {};
        try { payload = JSON.parse(text); } catch {}
        if (!res.ok) {
            toast(`Email failed: ${payload.error || text || res.status}`, 'error');
            return;
        }
        toast(`${emailType.charAt(0).toUpperCase()+emailType.slice(1)} email sent.`, 'success');
        await viewApplication(applicationId);
    } catch (err) {
        toast(`Email failed: ${err.message}`, 'error');
    }
}

async function saveDriverFromApplication(appId) {
    const d = getFormData('entity-form');
    if (!d.display_name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkDriverNameUnique(d.display_name, null);
    if (dupName) { toast(dupName, 'error'); return; }
    const num = checkCareerNumber(d.career_number, null);
    if (!num.ok) { toast(num.error, 'error'); return; }
    const payload = {
        display_name: d.display_name, slug: d.slug, psn_id: d.psn_id,
        nationality: d.nationality, career_number: num.value,
        current_team_id: d.current_team_id || null, current_manufacturer_id: d.current_manufacturer_id || null,
        joined_at: d.joined_at || null, bio: d.bio,
        gt7_dr_rating: d.gt7_dr_rating || null, gt7_sr_rating: d.gt7_sr_rating || null,
    };
    const { data: created, error } = await sb.from('drivers').insert(payload).select('id').single();
    if (error) { toast(error.message, 'error'); return; }
    const { error: linkErr } = await sb.from('applications')
        .update({ linked_driver_id: created.id })
        .eq('id', appId);
    if (linkErr) { toast(`Driver created, but link failed: ${linkErr.message}`, 'error'); }
    else { toast('Driver added and linked to application.', 'success'); }
    closeModal();
    await loadCache();
    await renderApplications();
}

async function saveTeamFromApplication(appId) {
    const d = getFormData('entity-form');
    if (!d.name || !d.slug) { toast('Name and slug are required.', 'error'); return; }
    const dupName = checkTeamNameUnique(d.name, null);
    if (dupName) { toast(dupName, 'error'); return; }

    // Load the application — we'll spin up the applicant as the team leader.
    const { data: app } = await sb.from('applications').select('*').eq('id', appId).single();

    // 1. Create the team
    const teamPayload = { name: d.name, slug: d.slug, manufacturer_id: d.manufacturer_id || null, home_country: d.home_country, founded_on: d.founded_on, bio: d.bio };
    const { data: createdTeam, error: teamErr } = await sb.from('teams').insert(teamPayload).select('id').single();
    if (teamErr) { toast(teamErr.message, 'error'); return; }

    // 2. Try to create the team leader driver from the application's PSN/name
    let leaderDriverId = null;
    if (app?.name) {
        const slugify = s => (s || '').toLowerCase().trim()
            .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        const driverPayload = {
            display_name: app.name,
            slug: slugify(app.name),
            psn_id: app.psn_id || null,
            nationality: app.nationality || null,
            gt7_dr_rating: app.gt7_dr_rating || null,
            gt7_sr_rating: app.gt7_sr_rating || null,
            current_team_id: createdTeam.id,
            joined_at: new Date().toISOString().slice(0, 10),
        };
        const { data: createdDriver, error: drvErr } = await sb.from('drivers').insert(driverPayload).select('id').single();
        if (!drvErr && createdDriver) {
            leaderDriverId = createdDriver.id;
            await sb.from('teams').update({ leader_driver_id: leaderDriverId }).eq('id', createdTeam.id);
            await sb.from('applications').update({ linked_driver_id: leaderDriverId }).eq('id', appId);
        } else if (drvErr) {
            console.warn('Driver creation skipped:', drvErr.message);
        }
    }

    // 3. Link the team to the application
    const { error: linkErr } = await sb.from('applications')
        .update({ linked_team_id: createdTeam.id })
        .eq('id', appId);
    if (linkErr) { toast(`Team created, but link failed: ${linkErr.message}`, 'error'); }
    else { toast(leaderDriverId ? 'Team created — applicant added as team leader.' : 'Team created.', 'success'); }
    closeModal();
    await loadCache();
    await renderApplications();
}

async function sendBroadcast() {
    const d = getFormData('entity-form');
    if (!d.message) { toast('Message body is required.', 'error'); return; }
    const phrase = prompt('Type SEND to confirm broadcasting this message to every driver:');
    if (phrase !== 'SEND') { toast('Cancelled — phrase did not match.', 'error'); return; }
    const { data, error } = await sb.rpc('broadcast_message_to_drivers', {
        p_subject: d.subject || null,
        p_message: d.message,
    });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not send.', 'error'); return; }
    toast(`Broadcast sent to ${data.count} driver${data.count === 1 ? '' : 's'}.`, 'success');
    closeModal();
    await renderMessages();
    await refreshMsgsBadge();
}

        ? `<a href="/endurance/drivers/?slug=${esc(m.drivers.slug)}" target="_blank" style="color:var(--gold);text-decoration:none">View profile →</a>`

    const incidentLink = m.incident_url
        ? `<div style="font-size:0.82rem;margin-bottom:0.75rem">

    const replyHistory = m.admin_reply

            <div><span style="color:var(--muted)">Driver</span><br><strong>${esc(m.drivers?.display_name) || '—'}</strong> ${profileLink}</div>
            <div><span style="color:var(--muted)">PSN ID</span><br><strong>${esc(m.drivers?.psn_id) || '—'}</strong></div>
            <div><span style="color:var(--muted)">Subject</span><br><strong>${esc(m.subject) || '<em>(none)</em>'}</strong></div>
            <div><span style="color:var(--muted)">Sent</span><br><strong>${m.created_at ? new Date(m.created_at).toLocaleString('en-GB') : '—'}</strong></div>
        </div>
        <div style="font-size:0.88rem;margin-bottom:1rem;padding:0.85rem 1rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;white-space:pre-wrap;line-height:1.55">${esc(m.message)}</div>

                <textarea name="admin_reply" rows="5" placeholder="${m.admin_reply ? 'Update your reply…' : 'Write a reply…'}">${esc(m.admin_reply)}</textarea>

                    <label>Status</label>

                </div>
            </div>

        `<button class="btn btn-ghost" onclick="closeModal()">Close</button>
         <button class="btn btn-primary" onclick="saveMessageStatus('${m.id}')">Save</button>`

async function saveMessageStatus(id) {
    const d = getFormData('entity-form');
    const reply = (d.admin_reply || '').trim();

    // Look up current reply to see if this is a NEW reply we should stamp
    const { data: existing } = await sb.from('driver_contact_messages')
        .select('admin_reply').eq('id', id).single();

    const payload = {
        status:     d.status,
        admin_note: d.admin_note || null,
        admin_reply: reply || null,
    };
    if (reply && (!existing?.admin_reply || existing.admin_reply !== reply)) {
        const { data: u } = await sb.auth.getUser();
        payload.replied_at = new Date().toISOString();
        payload.replied_by = u.user?.id || null;
        payload.driver_read_reply_at = null;  // reset read state for the new reply
    }

    const { error } = await sb.from('driver_contact_messages').update(payload).eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast(reply ? 'Reply sent to driver.' : 'Message updated.', 'success');
    closeModal();
    await renderMessages();
    await refreshMsgsBadge();
}

async function deleteMessage(id) {
    if (!confirm('Delete this message? This cannot be undone.')) return;
    const { error } = await sb.from('driver_contact_messages').delete().eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Deleted.', 'success');
    await renderMessages();
    await refreshMsgsBadge();
}

function openMediaModal() {
    const evtOpts = '<option value="">— No event —</option>' +
        _seasons.map(s => `<option disabled style="color:var(--muted)">── ${esc(s.name)} ──</option>`).join('');
    openModal('Upload Media', `
        <form id="entity-form">

                <input type="file" id="media-file" accept="image/*" required style="padding:0.4rem 0">

async function saveMedia() {
    const fileInput = document.getElementById('media-file');
    const d = getFormData('entity-form');
    if (!fileInput?.files?.[0]) { toast('Select an image file.', 'error'); return; }
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    toast('Uploading…', 'success');
    const { error: upErr } = await sb.storage.from('gtec-media').upload(path, file);
    if (upErr) { toast(upErr.message, 'error'); return; }
    const { data: { publicUrl } } = sb.storage.from('gtec-media').getPublicUrl(path);
    const { error } = await sb.from('media_items').insert({
        title:   d.title   || null,
        caption: d.caption || null,
        url:     publicUrl,
    });
    if (error) { toast(error.message, 'error'); return; }
    toast('Media uploaded.', 'success');
    closeModal();
    await renderMedia();
}

async function deleteMedia(id) {

    toast('Deleted.', 'success');
    await renderMedia();
}

    const { error } = await sb.from('pages').update({
        title,
        body,
        updated_at: new Date().toISOString(),

    toast('Page saved.', 'success');

}

            <form onsubmit="grantAdminFromForm(event)" style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <input type="email" id="grant-email" placeholder="person@example.com" required
                    style="flex:1;min-width:240px;padding:0.6rem 0.8rem;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.9rem">
                <button class="btn btn-primary" type="submit">Grant Admin</button>
            </form>
            <div style="margin-top:0.75rem;font-size:0.78rem;color:var(--muted);line-height:1.5">
                The person must first create an account in Supabase Auth (or sign up at <code>/endurance/admin/login</code>) — this just adds the admin role to their existing user.
            </div>
        </div>

        <div class="table-wrap">
            <table><thead><tr>
                <th>Email</th><th>User ID</th><th>Granted</th><th></th>
            </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
}

async function grantAdminFromForm(e) {
    e.preventDefault();
    const email = document.getElementById('grant-email').value.trim();
    if (!email) return;
    const { data, error } = await sb.rpc('grant_admin', { p_email: email });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not grant admin.', 'error'); return; }
    toast(`Admin granted to ${email}.`, 'success');
    await renderAdmins();
}

async function revokeAdmin(userId, email) {
    if (!confirm(`Revoke admin access for ${email}?`)) return;
    const { data, error } = await sb.rpc('revoke_admin', { p_user_id: userId });
    if (error) { toast(error.message, 'error'); return; }
    if (!data?.ok) { toast(data?.error || 'Could not revoke.', 'error'); return; }
    toast('Admin access revoked.', 'success');
    await renderAdmins();
}


// ============================================================
// 12. Utilities
// ============================================================
function autoSlug(input, sourceName, targetId) {
    const target = document.getElementById(targetId);
    if (!target || target.dataset.edited) return;
    target.value = slugify(input.value);
    target.addEventListener('input', () => target.dataset.edited = '1', { once: true });
}

function filterTable(input, tableId) {
    const q = input.value.toLowerCase();
    document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}


// ============================================================
// 12. Bootstrap
// ============================================================
initAuth();
</script>
