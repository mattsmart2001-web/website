// ============================================================
// FORM — "who's hot right now": the last few rounds only, ranked by
// points scored in the window or by ELO gained over it. Built entirely
// from the per-round series the battle chart already computes.
// ============================================================
let _formMetric = 'points';   // 'points' | 'elo'
function setFormMetric(m) { m = m === 'elo' ? 'elo' : 'points'; if (m === _formMetric) return; _formMetric = m; renderForm(document.getElementById('panel')); }

function _formWindow() { return Math.min(3, _btLastIdx + 1); }
function _cumAt(id, i) { if (i < 0) return 0; const c = _btPts[id] || []; return c[i] == null ? 0 : c[i]; }
function _recentPts(id, k) { return _cumAt(id, _btLastIdx) - _cumAt(id, _btLastIdx - k); }
function _eloAt(id, i) { const s = _btEloPts[id] || []; for (let j = Math.min(i, s.length - 1); j >= 0; j--) { if (s[j] != null) return s[j]; } return null; }
// Momentum baseline: the driver's ELO k rounds ago — but if that reaches
// before their first race (or before round 1), fall back to their DR/SR seed,
// so a driver's whole climb from where they started is counted.
function _eloMomentum(id, k) {
    const now = _eloAt(id, _btLastIdx);
    const bi = _btLastIdx - k;
    const then = (bi >= 0 ? _eloAt(id, bi) : null) ?? _btEloSeed[id] ?? null;
    return (now != null && then != null) ? now - then : null;
}
function _lastRoundPts(id, n) { const start = Math.max(0, _btLastIdx - n + 1), a = []; for (let i = start; i <= _btLastIdx; i++) a.push(_cumAt(id, i) - _cumAt(id, i - 1)); return a; }
// ELO spark: the rating trajectory, anchored on the DR/SR seed so the very
// first round's move (seed → after R1) is visible even at one round in. Keeps
// the last n points, so the seed naturally drops off once the season is long.
function _eloSpark(id, n) {
    const s = _btEloPts[id] || [], series = [];
    if (_btEloSeed[id] != null) series.push(_btEloSeed[id]);
    for (let i = 0; i <= _btLastIdx; i++) if (s[i] != null) series.push(s[i]);
    return series.slice(-n);
}

// Little inline sparkline: bars for round-by-round points, a line for ELO.
// scaleMax = a shared points ceiling across the whole table, so bar heights are
// comparable driver-to-driver (a 25-point round towers over an 8-point one).
// Bar width is capped and the group centred, so a single round reads as a neat
// bar rather than one cell-wide block.
function sparkBars(vals, scaleMax) {
    const w = 78, h = 28, n = Math.max(1, vals.length), gap = 3;
    const bw = Math.min(13, (w - (n - 1) * gap) / n);
    const x0 = (w - (n * bw + (n - 1) * gap)) / 2;   // centre the group
    const max = (scaleMax && scaleMax > 0) ? scaleMax : Math.max(1, ...vals);
    const bars = vals.map((v, i) => {
        const bh = Math.max(2, (Math.min(v, max) / max) * (h - 3)), x = x0 + i * (bw + gap), y = h - bh, last = i === vals.length - 1;
        const fill = v <= 0 ? 'rgba(255,255,255,0.14)' : (last ? '#ffd166' : 'rgba(255,209,102,0.55)');
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${fill}"/>`;
    }).join('');
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${bars}</svg>`;
}
// scaleMax = a shared vertical span (ELO units) across the whole table, so the
// line's angle encodes the real amount gained/lost — a bigger swing draws a
// steeper line. Each series is centred in the cell so none clip. Without a
// shared scale it falls back to filling the cell (per-series normalisation).
function sparkLine(vals, scaleMax) {
    const w = 78, h = 28, n = Math.max(1, vals.length), pad = 3;
    const pts = vals.map((v, i) => ({ v, i })).filter(p => p.v != null);
    if (!pts.length) return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"></svg>`;
    const nums = pts.map(p => p.v), min = Math.min(...nums), max = Math.max(...nums), mid = (min + max) / 2;
    const range = (scaleMax && scaleMax > 0) ? scaleMax : ((max - min) || 1);
    const X = i => n <= 1 ? w / 2 : i / (n - 1) * (w - 4) + 2;
    const Y = v => (h / 2) - (v - mid) * ((h - pad * 2) / range);
    const col = nums[nums.length - 1] >= nums[0] ? '#4ade80' : '#f87171';
    const d = pts.map((p, k) => `${k ? 'L' : 'M'}${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const dots = pts.map(p => `<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="1.7" fill="${col}"/>`).join('');
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>${dots}</svg>`;
}

function renderForm(panel) {
    if (_btLastIdx < 0 || !_drivers.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Form Yet</h3><p>The form guide fills in once a round or two has been raced.</p></div>`;
        return;
    }
    const K = _formWindow();
    // Points need two rounds to trend; ELO already has the pre-R1 seed, so a
    // seed → after-R1 line is drawable from the very first round.
    const eloHasData = _drivers.some(d => _btEloSeed[d.driver_id] != null || (_btEloPts[d.driver_id] || []).some(v => v != null));
    // Points bars share a scale now, so even one round is a meaningful (and
    // comparable) bar rather than the old cell-wide "yellow box".
    const showSpark = _formMetric === 'elo' ? (_btLastIdx >= 0 && eloHasData) : (_btLastIdx >= 0);
    const champPos = {}; _drivers.forEach((d, i) => { champPos[d.driver_id] = i + 1; });

    // One shared vertical scale per metric so sparklines are comparable across
    // drivers — the biggest ELO swing draws the steepest line, and the biggest
    // single-round points haul draws the tallest bar.
    let eloScaleMax = 0, ptsScaleMax = 0;
    if (_formMetric === 'elo') {
        _drivers.forEach(d => { const s = _eloSpark(d.driver_id, 6).filter(v => v != null); if (s.length > 1) { const r = Math.max(...s) - Math.min(...s); if (r > eloScaleMax) eloScaleMax = r; } });
    } else {
        _drivers.forEach(d => { const s = _lastRoundPts(d.driver_id, 5); const m = Math.max(0, ...s); if (m > ptsScaleMax) ptsScaleMax = m; });
    }

    let rows = _drivers.map(d => ({ d, id: d.driver_id, recent: _recentPts(d.driver_id, K), mom: _eloMomentum(d.driver_id, K), champ: champPos[d.driver_id] }));
    if (_formMetric === 'points') {
        rows.sort((a, b) => (b.recent - a.recent) || ((Number(b.d.points) || 0) - (Number(a.d.points) || 0)) || (a.d.driver_name || '').localeCompare(b.d.driver_name || ''));
    } else {
        const key = r => r.mom == null ? -1e9 : r.mom;
        rows.sort((a, b) => (key(b) - key(a)) || ((_ratingByDriver[b.id]?.rating || 0) - (_ratingByDriver[a.id]?.rating || 0)) || (a.d.driver_name || '').localeCompare(b.d.driver_name || ''));
    }

    const body = rows.map((r, i) => {
        const pos = i + 1, d = r.d, id = r.id, _rInfo = _ratingByDriver[id];
        const num = d.career_number ? `<span class="career-num">#${d.career_number}</span>` : '';
        const soloMfrName = d.manufacturer_name || _rInfo?.manufacturerName;
        const teamLine = d.team_name
            ? `<div class="meta-line">${mfrBadge(d.manufacturer_logo_url, d.brand_color, d.manufacturer_name)}${d.team_slug ? `<a href="/endurance/teams/?slug=${esc(d.team_slug)}" style="color:inherit;text-decoration:none">${esc(d.team_name)}</a>` : esc(d.team_name)}</div>`
            : (soloMfrName ? `<div class="meta-line">${mfrBadge(_rInfo?.manufacturerLogoUrl, _rInfo?.brandColor, soloMfrName)}<em style="opacity:0.75">Solo</em></div>` : '');
        const spark = _formMetric === 'points' ? sparkBars(_lastRoundPts(id, 5), ptsScaleMax) : sparkLine(_eloSpark(id, 6), eloScaleMax);
        // The ranked figure, plus a "vs championship position" line so a
        // low-standing driver on a tear stands out.
        let figure, sub;
        if (_formMetric === 'points') {
            figure = `<span class="points">${r.recent > 0 ? '+' : ''}${r.recent % 1 === 0 ? r.recent : r.recent.toFixed(1)}</span>`;
            sub = `<div class="form-sub">${(Number(d.points) || 0)} pts total · P${r.champ} overall</div>`;
        } else {
            figure = r.mom == null ? `<span class="lighter">—</span>` : `<span class="points" style="color:${r.mom >= 0 ? '#4ade80' : '#f87171'}">${r.mom >= 0 ? '+' : ''}${r.mom}</span>`;
            const cur = _rInfo?.rating != null ? Math.round(_rInfo.rating) + ' ELO' : '';
            sub = `<div class="form-sub">${cur ? cur + ' · ' : ''}P${r.champ} overall</div>`;
        }
        const hotVal = _formMetric === 'points' ? r.recent : (r.mom || 0);
        const flame = (pos === 1 && hotVal > 0) ? ' <span title="Hottest right now">🔥</span>' : '';
        return `<tr class="${rankCls(pos)}">
            <td class="${posCls(pos)}">${pos}</td>
            <td>
                <div class="driver-cell">
                    ${driverAvatar(_rInfo?.photo, d.driver_name)}
                    <div class="driver-cell-text">
                        <div class="name">${num}${d.nationality ? `<span class="driver-flag" title="${esc(d.nationality)}">${flag(d.nationality)}</span> ` : ''}<a href="/endurance/drivers/?slug=${esc(d.driver_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(d.driver_name)}</a>${flame}</div>
                        ${teamLine}
                    </div>
                </div>
            </td>
            ${showSpark ? `<td class="center hide-mob">${spark}</td>` : ''}
            <td class="right">${figure}${sub}</td>
        </tr>`;
    }).join('');

    const metricLabel = _formMetric === 'points' ? `Points won` : `ELO gained`;
    panel.innerHTML = `
        <div class="form-toolbar">
            <div class="form-caption">Who's hot over the last ${K} round${K === 1 ? '' : 's'}.</div>
            <span class="bt-metric" style="display:inline-flex">
                <button class="bt-mbtn ${_formMetric === 'points' ? 'active' : ''}" onclick="setFormMetric('points')">Points form</button>
                <button class="bt-mbtn ${_formMetric === 'elo' ? 'active' : ''}" onclick="setFormMetric('elo')">ELO momentum</button>
            </span>
        </div>
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:50px">#</th>
                    <th>Driver</th>
                    ${showSpark ? `<th class="center hide-mob">${_formMetric === 'elo' ? 'ELO trend' : 'Last ' + Math.min(5, _btLastIdx + 1)}</th>` : ''}
                    <th class="right">${metricLabel}</th>
                </tr></thead>
                <tbody>${body}</tbody>
            </table>
        </div>
        <p style="font-size:0.72rem;color:var(--muted);margin-top:0.85rem;padding:0 0.25rem">Form = ${_formMetric === 'points' ? `net points scored over the last ${K} completed round${K === 1 ? '' : 's'}. The bars show each of the last ${Math.min(5, _btLastIdx + 1)} round${Math.min(5, _btLastIdx + 1) === 1 ? '' : 's'} on one shared scale, so taller means more.` : `change in ELO across the last ${K} completed round${K === 1 ? '' : 's'}, from the DR/SR seed onward. Steeper lines mean a bigger swing; every line shares the same scale.`}</p>`;
}

async function load() {
    const { data: season } = await sb.from('seasons')
        .select('id, name, year, points_systems(points, pole_points, fastest_lap_points)')
        .eq('is_active', true)
        .maybeSingle();

    if (!season) {
        document.getElementById('season-sub').textContent = 'No active season.';
        document.getElementById('panel').innerHTML =
            `<div class="state-msg"><h3>Coming Soon</h3><p>Standings will appear here once the season is set up.</p></div>`;
        return;
    }
    _season = season;
    document.getElementById('season-title').textContent = season.name;
    document.getElementById('season-sub').textContent = `${season.year} Championship · Live standings`;

    const [d, t, ratings, perEvent, remainingRes, driverMfrs, deds, seasonEvents, myUser] = await Promise.all([
        sb.from('driver_standings').select('*').eq('season_id', season.id),
        sb.from('team_standings').select('*').eq('season_id', season.id),
        sb.from('driver_current_ratings').select('driver_id, rating, last_rated_at'),
        // Per-event, per-driver points so we can derive "rank before the last
        // event" and show championship movement arrows.
        sb.from('result_drivers')
            .select('driver_id, points_awarded, finish_position, status, results!inner(event_id, entries(team_id), events!inner(season_id, starts_at))'),
        // Remaining rounds — feeds Live Battles' "still catchable" ceiling,
        // same Split-1-forever assumption as Season Stakes on the profile pages.
        sb.from('events').select('id', { count: 'exact', head: true })
            .eq('season_id', season.id).in('status', ['scheduled', 'in_progress']),
        // Each driver's own manufacturer (their profile lock) — the source
        // for showing a manufacturer on solo drivers, who have no team.
        sb.from('drivers').select('id, photo_url, manufacturers(id, name, brand_color, logo_url)'),
        // Points-deduction penalties this season, with reason — so the
        // standings can show why points were docked, and from whom.
        sb.from('penalties')
            .select('penalty_type, points_amount, reason, driver_id, entry_id, event_id, entries(team_id, entry_drivers(driver_id)), events!inner(season_id)')
            .in('penalty_type', ['points_deduction', 'points_bonus'])
            .eq('events.season_id', season.id),
        // Events for this season (for the Championship Battle chart's round axis).
        sb.from('events').select('id, round, name, starts_at').eq('season_id', season.id).order('round'),
        // The signed-in user's own driver, if any — powers the "Compare me" preset.
        sb.auth.getUser(),
    ]);

    _remaining = remainingRes.count || 0;
    const ps = season.points_systems;
    if (ps && _remaining) {
        const maxPos = Math.max(0, ...(ps.points || []).map(p => Number(p.points) || 0));
        _ceiling = _remaining * (maxPos + Number(ps.pole_points || 0) + Number(ps.fastest_lap_points || 0));
    } else {
        _ceiling = null;
    }

    // Index ratings by driver for quick lookup during render.
    _ratingByDriver = {};
    (ratings.data || []).forEach(r => {
        _ratingByDriver[r.driver_id] = { rating: r.rating, rated: !!r.last_rated_at };
    });
    // Merge each driver's own photo + manufacturer in. The manufacturer is
    // the fallback source for solo drivers (no team to source it from) and
    // for the Manufacturers championship below.
    (driverMfrs.data || []).forEach(r => {
        const e = _ratingByDriver[r.id] || (_ratingByDriver[r.id] = {});
        e.photo = r.photo_url || null;
        const m = r.manufacturers;
        if (m) {
            e.manufacturerId = m.id;
            e.manufacturerName = m.name;
            e.brandColor = m.brand_color;
            e.manufacturerLogoUrl = m.logo_url;
        }
    });

    // Points-deduction penalties → per-driver and per-team, with reasons.
    // Mirrors the results page: a driver-specific penalty hits that driver;
    // a whole-team penalty (no driver_id) hits every driver on the entry.
    // The team always takes the hit via the entry's team.
    _dedByDriver = {};
    _dedByTeam = {};
    _bonByDriver = {};
    _bonByTeam = {};
    const _addAdj = (map, key, amount, reason) => {
        if (!key) return;
        const e = map[key] || (map[key] = { amount: 0, reasons: [] });
        e.amount += amount;
        const r = (reason || '').trim();
        if (r && !e.reasons.includes(r)) e.reasons.push(r);
    };
    (deds.data || []).forEach(p => {
        if (!p.points_amount) return;
        // Bonuses and deductions cascade identically; only which map they land
        // in differs, so the standings can show "−X" and "+X" notes separately.
        const bonus = p.penalty_type === 'points_bonus';
        const dMap = bonus ? _bonByDriver : _dedByDriver;
        const tMap = bonus ? _bonByTeam : _dedByTeam;
        if (p.driver_id) {
            _addAdj(dMap, p.driver_id, p.points_amount, p.reason);
            _addAdj(tMap, p.entries?.team_id, p.points_amount, p.reason);
        } else {
            const eds = p.entries?.entry_drivers || [];
            eds.forEach(ed => _addAdj(dMap, ed.driver_id, p.points_amount, p.reason));
            _addAdj(tMap, p.entries?.team_id, p.points_amount * (eds.length || 1), p.reason);
        }
    });

    // Compute previous-round positions. The "current" league is the view
    // we just fetched; the "previous" league is the same minus the most
    // recent event's points. Then rank both and diff.
    _prevDriverRank = computePrevRank(perEvent.data || [], season.id, d.data || []);

    // Per-driver season tiebreak: best classified finishing position (+ a
    // fallback status rank). Lets 0-point drivers who actually finished
    // (e.g. P11/P12, just outside the points) sort above DNF/DNS drivers,
    // instead of everyone on 0 landing in an arbitrary order.
    const STATUS_RANK = { classified: 0, dnf: 1, dsq: 2, withdrawn: 3, dns: 4 };
    const _tie = {};
    (perEvent.data || []).forEach(r => {
        if (r.results?.events?.season_id !== season.id) return;
        const st = r.status || 'classified';
        const t = _tie[r.driver_id] || (_tie[r.driver_id] = { bestFinish: Infinity, bestStatus: 9 });
        if (st === 'classified' && r.finish_position != null) t.bestFinish = Math.min(t.bestFinish, r.finish_position);
        t.bestStatus = Math.min(t.bestStatus, STATUS_RANK[st] ?? 9);
    });
    const tieCompare = (a, b) => {
        const ta = _tie[a.driver_id] || { bestFinish: Infinity, bestStatus: 9 };
        const tb = _tie[b.driver_id] || { bestFinish: Infinity, bestStatus: 9 };
        const aHas = ta.bestFinish !== Infinity, bHas = tb.bestFinish !== Infinity;
        if (aHas !== bHas) return aHas ? -1 : 1;                              // any classified finish beats none
        if (aHas && ta.bestFinish !== tb.bestFinish) return ta.bestFinish - tb.bestFinish; // better finish first
        return ta.bestStatus - tb.bestStatus;                                // else DNF above DSQ above DNS
    };

    _drivers = (d.data || []).sort((a, b) =>
        (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums) || tieCompare(a, b));
    _teams   = (t.data || []).sort((a, b) => (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums));

    // Form guide — each driver's last few rounds (chronological), from the
    // same per-event rows used for movement arrows.
    _formByDriver = {};
    const _evByDriver = {};
    (perEvent.data || []).forEach(r => {
        if (r.results?.events?.season_id !== season.id) return;
        (_evByDriver[r.driver_id] = _evByDriver[r.driver_id] || []).push({
            at: r.results.events.starts_at, pos: r.finish_position, status: r.status,
        });
    });
    Object.keys(_evByDriver).forEach(id => {
        _formByDriver[id] = _evByDriver[id]
            .sort((a, b) => new Date(a.at) - new Date(b.at))
            .slice(-5);
    });

    // Manufacturer championship — sum each driver's points under their
    // manufacturer (the team lock, or the driver's own for solo entries).
    const _mMap = {};
    _drivers.forEach(dr => {
        const info = _ratingByDriver[dr.driver_id] || {};
        const id   = dr.manufacturer_id || info.manufacturerId;
        if (!id) return;
        const m = _mMap[id] || (_mMap[id] = {
            id,
            name:  dr.manufacturer_name     || info.manufacturerName || 'Unknown',
            logo:  dr.manufacturer_logo_url || info.manufacturerLogoUrl,
            color: dr.brand_color           || info.brandColor,
            points: 0, wins: 0, podiums: 0, poles: 0, fl: 0, drivers: 0,
        });
        m.points  += Number(dr.points)       || 0;
        m.wins    += Number(dr.wins)         || 0;
        m.podiums += Number(dr.podiums)      || 0;
        m.poles   += Number(dr.poles)        || 0;
        m.fl      += Number(dr.fastest_laps) || 0;
        m.drivers += 1;
    });
    Object.values(_mMap).forEach(m => { m.slug = String(m.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); });
    _manufacturers = Object.values(_mMap).sort((a, b) => (b.points - a.points) || (b.wins - a.wins));

    // Nations Cup — group every driver by nationality (ISO alpha-2) and rank
    // by AVERAGE points per driver, so a small nation with strong drivers
    // isn't buried under a big one. Total + counts shown for context.
    const _cty = {};
    (window.GTEC_COUNTRIES || []).forEach(c => { _cty[c.code] = c; });
    const _nMap = {};
    let _noNation = 0;
    _drivers.forEach(dr => {
        const code = (dr.nationality || '').toUpperCase();
        if (!code) { _noNation += 1; return; }
        const n = _nMap[code] || (_nMap[code] = {
            code,
            name: _cty[code]?.name || code,
            flag: _cty[code]?.flag || '',
            points: 0, drivers: 0, wins: 0, podiums: 0,
            topName: null, topSlug: null, topPoints: -Infinity,
        });
        const pts = Number(dr.points) || 0;
        n.points  += pts;
        n.drivers += 1;
        n.wins    += Number(dr.wins)    || 0;
        n.podiums += Number(dr.podiums) || 0;
        if (pts > n.topPoints) { n.topPoints = pts; n.topName = dr.driver_name; n.topSlug = dr.driver_slug; }
    });
    _nations = Object.values(_nMap).map(n => ({ ...n, avg: n.drivers ? n.points / n.drivers : 0 }))
        .sort((a, b) => (b.avg - a.avg) || (b.points - a.points) || (b.drivers - a.drivers));
    _nationsNoCountry = _noNation;

    await buildBattle(perEvent.data || [], deds.data || [], seasonEvents.data || [], myUser);

    // Deep-link support: ?tab=… and ?mfr=<manufacturer-slug> open the right
    // tab (and a manufacturer's driver board) straight from a shared link.
    const params = new URLSearchParams(location.search);
    const wantMfr = params.get('mfr');
    const mfrMatch = wantMfr ? _manufacturers.find(x => x.slug === wantMfr) : null;
    const wantNat = (params.get('nat') || '').toUpperCase();
    const natMatch = wantNat ? _nations.find(x => x.code === wantNat) : null;
    const wantTab = params.get('tab');
    if (mfrMatch) { await setTab('manufacturers'); openMfr(mfrMatch.id); }
    else if (natMatch) { await setTab('nations'); openNat(natMatch.code); }
    else if (wantTab && ['drivers', 'teams', 'manufacturers', 'nations', 'ratings'].includes(wantTab)) { await setTab(wantTab); }
    else render();
}

// ===== Championship Battle chart =====
// Built entirely client-side from data already loaded: per-event points
// (net of that event's deductions, so cumulative ends at the standings
// total) over the season's completed rounds.
let _btEvents = [];          // [{id, round, name}] every round in the season, in order
let _btLastIdx = -1;         // index of the last completed round in _btEvents
let _btPts    = {};          // driver_id -> cumulative points (null for rounds not yet raced)
let _btDrivers = [];         // [{id, name, slug, pos, total}] ranked, for search/presets
let _btMyId   = null;        // signed-in user's driver_id, if racing this season
let _btTeamPts = {};         // team_id -> cumulative points, same shape as _btPts
let _btTeams   = [];         // [{id, name, slug, pos, total}] ranked teams
let _btMyTeamId = null;      // signed-in driver's current team, if any
let _btMfrPts = {};          // manufacturer_id -> cumulative points
let _btMfrs   = [];          // [{id, name, slug, pos, total, drivers}] ranked marques
let _btMetric = 'total';     // 'total' | 'avg' — metric for the manufacturers chart
let _btEloPts = {};          // driver_id -> ELO rating after each round (carried forward; null before first rated round)
let _btEloSeed = {};         // driver_id -> DR/SR-based rating going INTO round 1 (rating_before of first rated round)
let _btElo    = [];          // [{id, name, slug, pos, total}] drivers ranked by current ELO
let _btMode   = 'drivers';   // which championship the chart is showing ('drivers' | 'teams' | 'manufacturers' | 'ratings')

async function buildBattle(perEvent, deds, seasonEvents, myUser) {
    const inSeason = perEvent.filter(r => r.results?.events?.season_id === _season.id);

    // gross points per driver per event
    const gross = {};
    const scored = new Set();
    inSeason.forEach(r => {
        const ev = r.results?.event_id; if (!ev) return;
        scored.add(ev);
        (gross[r.driver_id] = gross[r.driver_id] || {})[ev] =
            (gross[r.driver_id]?.[ev] || 0) + Number(r.points_awarded || 0);
    });

    // deductions per driver per event (driver-specific, or spread across an
    // entry's drivers when the penalty is team-wide) — mirrors the standings.
    const ded = {};
    const addDed = (drv, ev, amt) => { if (!drv || !ev) return; (ded[drv] = ded[drv] || {})[ev] = (ded[drv]?.[ev] || 0) + amt; };
    deds.forEach(p => {
        if (!p.points_amount || !p.event_id) return;
        if (p.driver_id) addDed(p.driver_id, p.event_id, Number(p.points_amount));
        else (p.entries?.entry_drivers || []).forEach(edn => addDed(edn.driver_id, p.event_id, Number(p.points_amount)));
    });

    // Full season on the axis (every round), so R1..Rn always show and the
    // lines simply grow to the right as rounds are completed.
    _btEvents = (seasonEvents || []).map(e => ({ id: e.id, round: e.round, name: e.name }));
    _btLastIdx = _btEvents.reduce((m, e, i) => scored.has(e.id) ? i : m, -1);
    if (_btLastIdx < 0 || !_btEvents.length) { document.getElementById('battle').style.display = 'none'; return; }

    const cumulative = (id, grossMap, dedMap) => {
        let running = 0;
        return _btEvents.map(e => {
            if (!scored.has(e.id)) return null;   // round not raced yet → no point
            running += (grossMap[id]?.[e.id] || 0) - (dedMap[id]?.[e.id] || 0);
            return running;
        });
    };

    _btPts = {};
    _drivers.forEach(d => { _btPts[d.driver_id] = cumulative(d.driver_id, gross, ded); });
    _btDrivers = _drivers.map((d, i) => ({ id: d.driver_id, name: d.driver_name, slug: d.driver_slug, pos: i + 1, total: Number(d.points) || 0 }));

    // ----- Teams: a team's points per event is the sum of its drivers'
    // points on the team's entry, less any team penalty that round. -----
    const tGross = {}, tDed = {};
    const tAdd = (map, tid, ev, amt) => { if (!tid || !ev) return; (map[tid] = map[tid] || {})[ev] = (map[tid]?.[ev] || 0) + amt; };
    inSeason.forEach(r => tAdd(tGross, r.results?.entries?.team_id, r.results?.event_id, Number(r.points_awarded || 0)));
    deds.forEach(p => {
        if (!p.points_amount || !p.event_id) return;
        // Driver-specific → team loses it once; whole-team → once per
        // driver on the entry, so the team line matches the sum of its
        // drivers (mirrors team_standings and the per-driver ded above).
        const mult = p.driver_id ? 1 : ((p.entries?.entry_drivers || []).length || 1);
        tAdd(tDed, p.entries?.team_id, p.event_id, Number(p.points_amount) * mult);
    });
    _btTeamPts = {};
    _teams.forEach(t => { _btTeamPts[t.team_id] = cumulative(t.team_id, tGross, tDed); });
    _btTeams = _teams.map((t, i) => ({ id: t.team_id, name: t.team_name, slug: t.team_slug, pos: i + 1, total: Number(t.points) || 0 }));

    // ----- Manufacturers: sum each driver's per-event net points under their
    // manufacturer, so a marque's line matches the manufacturers standings. -----
    const driverMfr = {};
    _drivers.forEach(d => {
        const info = _ratingByDriver[d.driver_id] || {};
        const mid = d.manufacturer_id || info.manufacturerId;
        if (mid) driverMfr[d.driver_id] = mid;
    });
    const mGross = {}, mDed = {};
    inSeason.forEach(r => {
        const mid = driverMfr[r.driver_id], ev = r.results?.event_id;
        if (!mid || !ev) return;
        (mGross[mid] = mGross[mid] || {})[ev] = (mGross[mid]?.[ev] || 0) + Number(r.points_awarded || 0);
    });
    Object.keys(ded).forEach(drv => {
        const mid = driverMfr[drv]; if (!mid) return;
        Object.entries(ded[drv]).forEach(([ev, amt]) => { (mDed[mid] = mDed[mid] || {})[ev] = (mDed[mid]?.[ev] || 0) + amt; });
    });
    _btMfrPts = {};
    _manufacturers.forEach(m => { _btMfrPts[m.id] = cumulative(m.id, mGross, mDed); });
    _btMfrs = _manufacturers.map((m, i) => ({ id: m.id, name: m.name, slug: m.slug, pos: i + 1, total: Number(m.points) || 0, drivers: Number(m.drivers) || 1 }));

    // ----- ELO battle: each driver's rating *after* every round, carried
    // forward across rounds they sat out, so the line traces their rating
    // trajectory rather than a cumulative total. -----
    await buildEloBattle();

    // Signed-in driver → "Compare me" (their line) and "My team".
    _btMyId = null; _btMyTeamId = null;
    const uid = myUser?.data?.user?.id;
    if (uid) {
        const { data: mine } = await sb.from('drivers').select('id, current_team_id').eq('user_id', uid).maybeSingle();
        if (mine && _btPts[mine.id]) _btMyId = mine.id;
        if (mine?.current_team_id && _btTeamPts[mine.current_team_id]) _btMyTeamId = mine.current_team_id;
    }

    renderBattle();
}

// Pull the per-round ELO history (driver_ratings.rating_after) for this
// season and turn it into one carried-forward series per driver, aligned to
// the same round axis as the points chart.
async function buildEloBattle() {
    _btEloPts = {}; _btElo = []; _btEloSeed = {};
    const evIds = _btEvents.map(e => e.id);
    if (!evIds.length) return;
    let rows = [];
    try {
        const { data } = await sb.from('driver_ratings')
            .select('driver_id, event_id, rating_after, rating_before')
            .in('event_id', evIds);
        rows = data || [];
    } catch (e) { rows = []; }

    // driver_id -> { event_id -> rating_after }, plus the set of rounds that
    // have been rated at all, so lines stop at the last completed round rather
    // than carrying flat into rounds that haven't happened yet.
    const evIndex = {}; _btEvents.forEach((e, i) => { evIndex[e.id] = i; });
    const byDrv = {}, ratedEv = new Set(), seedIdx = {};
    rows.forEach(r => {
        const i = evIndex[r.event_id]; if (i == null) return;
        (byDrv[r.driver_id] = byDrv[r.driver_id] || {})[r.event_id] = Number(r.rating_after);
        ratedEv.add(r.event_id);
        // Seed = the DR/SR-based rating the driver carried INTO their first
        // rated round (rating_before of their earliest event), so ELO momentum
        // can measure from where they actually started, not from round 1's result.
        if (seedIdx[r.driver_id] == null || i < seedIdx[r.driver_id]) {
            seedIdx[r.driver_id] = i;
            _btEloSeed[r.driver_id] = Number(r.rating_before);
        }
    });
    let lastRatedIdx = -1;
    _btEvents.forEach((e, i) => { if (ratedEv.has(e.id)) lastRatedIdx = i; });

    // Carry each rating forward across rounds the driver skipped; leave null
    // before their first rated round (line starts at their debut) and after the
    // last completed round (no flat tail into un-raced rounds).
    Object.keys(byDrv).forEach(id => {
        let cur = null;
        _btEloPts[id] = _btEvents.map((e, i) => {
            if (byDrv[id][e.id] != null) cur = byDrv[id][e.id];
            return i <= lastRatedIdx ? cur : null;   // null until debut, then last-known, null past the final rated round
        });
    });

    // Rank the picker list by current rating (last known point on each line),
    // richest first, so "Top 8" loads the strongest drivers.
    _btElo = _drivers
        .filter(d => _btEloPts[d.driver_id] && _btEloPts[d.driver_id].some(v => v != null))
        .map(d => {
            const s = _btEloPts[d.driver_id];
            let last = 0; for (let i = s.length - 1; i >= 0; i--) { if (s[i] != null) { last = s[i]; break; } }
            return { id: d.driver_id, name: d.driver_name, slug: d.driver_slug, total: Math.round(last) };
        })
        .sort((a, b) => b.total - a.total)
        .map((d, i) => ({ ...d, pos: i + 1 }));
}

// Mode-aware accessors so the same picker/chart drives every championship.
function _btList()   { return _btMode === 'teams' ? _btTeams : _btMode === 'manufacturers' ? _btMfrs : _btMode === 'ratings' ? _btElo : _btDrivers; }
function _btSeries(id) {
    if (_btMode === 'ratings') return _btEloPts[id];
    if (_btMode === 'manufacturers') {
        const s = _btMfrPts[id]; if (!s) return s;
        if (_btMetric === 'avg') { const n = _btById(id)?.drivers || 1; return s.map(v => v == null ? v : v / n); }
        return s;
    }
    return (_btMode === 'teams' ? _btTeamPts : _btPts)[id];
}
function _btMine()   { return _btMode === 'teams' ? _btMyTeamId : (_btMode === 'manufacturers' || _btMode === 'ratings') ? null : _btMyId; }
// Singular/plural noun for the current mode, for hints and empty states.
function _btNoun(pl) { const s = _btMode === 'teams' ? 'team' : _btMode === 'manufacturers' ? 'manufacturer' : 'driver'; return pl ? s + 's' : s; }
// Unit suffix on end-labels / count-ups: points everywhere except the ELO chart.
function _btUnit() { return _btMode === 'ratings' ? 'ELO' : 'pts'; }

const BT_PALETTE = ['#ffd166', '#38bdf8', '#34d399', '#c084fc', '#f87171', '#fb923c', '#818cf8', '#f472b6'];
let _btSlots = BT_PALETTE.map(c => ({ color: c, id: null }));
const _btActive = () => _btSlots.filter(s => s.id && _btById(s.id)).map(s => ({ d: _btById(s.id), color: s.color }));
const _btById = id => _btList().find(x => x.id === id);
const _btOn = id => _btSlots.some(s => s.id === id);
function _btAdd(id) { if (_btOn(id)) return true; const slot = _btSlots.find(s => !s.id); if (!slot) return false; slot.id = id; return true; }
function btRemove(id) { const s = _btSlots.find(x => x.id === id); if (s) s.id = null; btRefresh(); btSave(); }
function btTop() { _btSlots.forEach(s => s.id = null); _btList().slice(0, 8).forEach(x => _btAdd(x.id)); btRefresh('full'); }
function btMe() { _btSlots.forEach(s => s.id = null); if (_btMine()) _btAdd(_btMine()); _btList().slice(0, 3).forEach(x => _btAdd(x.id)); btRefresh('full'); }
function btClear() { _btSlots.forEach(s => s.id = null); btRefresh(); }

// Switch the chart between the drivers' and constructors' championships.
function btSetMode(mode) {
    _btMode = mode;
    _btSlots.forEach(s => s.id = null);
    const sub = document.querySelector('#bt-acc .bt-sub');
    const inp = document.getElementById('bt-search');
    const cmp = document.getElementById('bt-compare');
    const subs = {
        teams: "See how the constructors' fight unfolded. Search any team, or load the top 8.",
        manufacturers: 'See how each marque built its haul. Search any manufacturer, or load the top 8.',
        ratings: 'See how driver ELO climbed and fell round by round. Search any driver, or load the top 8.',
        drivers: 'See how the title fight unfolded. Search any driver, or load the top 8.'
    };
    if (sub) sub.textContent = subs[mode] || subs.drivers;
    const ttl = document.querySelector('#bt-acc .bt-title');
    if (ttl) ttl.textContent = mode === 'ratings' ? 'ELO Battle' : 'Championship Battle';
    if (inp) { inp.placeholder = `🔍  Add a ${_btNoun(false)} by name…`; inp.value = ''; }
    const res = document.getElementById('bt-results'); if (res) res.classList.remove('open');
    if (cmp) {
        if (_btMine()) { cmp.style.display = ''; cmp.textContent = mode === 'teams' ? 'My team' : 'Compare me'; }
        else cmp.style.display = 'none';
    }
    // The Total / Avg toggle only makes sense for the manufacturers chart.
    const met = document.getElementById('bt-metric');
    if (met) met.style.display = mode === 'manufacturers' ? '' : 'none';
    _btUpdateMetricButtons();
    // Restore the viewer's last selection for this mode; else default to Top 8.
    if (btRestore(mode)) btRefresh('full'); else btTop();
}

// Manufacturers chart: swap between marque totals and points-per-driver.
function btSetMetric(m) {
    if (m !== 'avg') m = 'total';
    if (_btMetric === m) return;
    _btMetric = m;
    _btUpdateMetricButtons();
    btRefresh('full');
}
function _btUpdateMetricButtons() {
    const t = document.getElementById('bt-m-total'), a = document.getElementById('bt-m-avg');
    if (t) t.classList.toggle('active', _btMetric === 'total');
    if (a) a.classList.toggle('active', _btMetric === 'avg');
}

// Remember the chart selection across refreshes, per mode, in localStorage.
function btStorageKey(m) { return 'gtec_battle_' + m; }
function btSave() { try { localStorage.setItem(btStorageKey(_btMode), JSON.stringify(_btSlots.filter(s => s.id).map(s => s.id))); } catch (e) {} }
function btRestore(mode) {
    let raw; try { raw = localStorage.getItem(btStorageKey(mode)); } catch (e) { return false; }
    if (raw == null) return false;
    let ids; try { ids = JSON.parse(raw); } catch (e) { return false; }
    if (!Array.isArray(ids)) return false;
    const valid = ids.filter(id => _btById(id));
    if (ids.length > 0 && valid.length === 0) return false;   // all stale (e.g. new season) → default
    _btSlots.forEach(s => s.id = null);
    valid.slice(0, _btSlots.length).forEach(id => _btAdd(id));
    return true;
}

function renderBattle() {

    btGrid();

}

function btSearch() {
    const q = document.getElementById('bt-search').value.trim().toLowerCase();
    const box = document.getElementById('bt-results');
    const meLabel = _btMode === 'teams' ? 'MINE' : 'YOU';
    let list = _btList();
    if (q) list = list.filter(d => (d.name || '').toLowerCase().includes(q));
    list = list.slice(0, 8);
    if (!list.length) { box.innerHTML = `<div class="bt-none">No ${_btNoun(false)} found.</div>`; box.classList.add('open'); return; }
    box.innerHTML = list.map(d => {
        const on = _btOn(d.id);
        const me = d.id === _btMine() ? ` <span class="me" style="font-size:.6rem">${meLabel}</span>` : '';
        return `<div class="bt-res ${on ? 'added' : ''}" ${on ? '' : `onclick="btPick('${d.id}')"`}>
          <span class="bt-res-pos">P${d.pos}</span>
          <span class="bt-res-name">${esc(d.name)}${me}</span>
          <span class="bt-res-pts">${on ? '✓ added' : d.total + ' ' + _btUnit()}</span></div>`;
    }).join('');
    box.classList.add('open');
}
function btPick(id) {
    if (_btAdd(id) === false) { btFlash(`That\'s 8. Remove one to add another.`); return; }
    document.getElementById('bt-search').value = '';
    document.getElementById('bt-results').classList.remove('open');
    btRefresh('grow');
    btSave();
}
document.addEventListener('click', e => {
    if (!e.target.closest('.bt-search-wrap')) { const r = document.getElementById('bt-results'); if (r) r.classList.remove('open'); }
});

let _btHintTimer;
function btFlash(msg) { const h = document.getElementById('bt-hint'); if (!h) return; h.textContent = msg; h.style.color = '#fca5a5'; clearTimeout(_btHintTimer); _btHintTimer = setTimeout(btHint, 1800); }
function btHint() { const h = document.getElementById('bt-hint'); if (!h) return; const n = _btActive().length; const noun = _btNoun(true); h.style.color = '#5b6472';
    h.textContent = n ? `${n} of 8 lines · search ${_btList().length} ${noun} or use a preset` : `Nothing selected. Search a ${_btNoun(false)} or hit a preset.`; }
function btSelected() {
    const wrap = document.getElementById('bt-selected'); if (!wrap) return;
    const meLabel = _btMode === 'teams' ? 'MINE' : 'YOU';
    wrap.innerHTML = _btActive().map(a => {
        const me = a.d.id === _btMine() ? `<span class="me">${meLabel}</span>` : '';
        return `<span class="bt-chip"><span class="cdot" style="background:${a.color}"></span>${esc(a.d.name)}${me}<button class="bt-x" onclick="btRemove('${a.d.id}')">✕</button></span>`;
    }).join('');
}

// chart geometry
const BT_W = 760, BT_H = 400, BT_PL = 46, BT_PR = 150, BT_PT = 18, BT_PB = 38;
const _btPW = BT_W - BT_PL - BT_PR, _btPH = BT_H - BT_PT - BT_PB;
const _btNS = 'http://www.w3.org/2000/svg';
const _btEl = (n, a) => { const e = document.createElementNS(_btNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
function _btX(i) { return _btEvents.length <= 1 ? BT_PL : BT_PL + i / (_btEvents.length - 1) * _btPW; }
// A round-ish axis step scaled to the data — so an Avg/driver chart (values
// in the single/low-double digits) isn't squashed against a 50-unit grid.
function _btNiceStep(m) { for (const s of [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500]) { if (m / s <= 5) return s; } return Math.ceil(m / 5 / 500) * 500; }
// The ELO chart floats its baseline (ratings sit in a high, narrow band, so a
// 0-based axis would flatten every line); points charts always start at 0.
function _btYMin() {
    if (_btMode !== 'ratings') return 0;
    let lo = Infinity; _btActive().forEach(a => { (_btSeries(a.d.id) || []).forEach(v => { if (v != null && v < lo) lo = v; }); });
    if (!isFinite(lo)) return 0;
    let hi = 0; _btActive().forEach(a => { (_btSeries(a.d.id) || []).forEach(v => { if (v != null && v > hi) hi = v; }); });
    const step = _btNiceStep(Math.max(hi - lo, 20) * 1.25);
    return Math.max(800, Math.floor((lo - step * 0.5) / step) * step);   // pad below, floor to a gridline, never under the ELO floor
}
function _btYMax(min) {
    min = min || 0;
    let m = min; _btActive().forEach(a => { (_btSeries(a.d.id) || []).forEach(v => { if (v != null && v > m) m = v; }); });
    const range = Math.max(m - min, 10), step = _btNiceStep(range);
    return min + Math.max(step, Math.ceil(range / step) * step);
}
function _btY(v, max) { const min = _btYMinCache; return BT_PT + _btPH - ((v - min) / (max - min)) * _btPH; }

let _btSvg, _btSeriesG, _btGuide, _btYCache = 200, _btYMinCache = 0;
function btGrid() {
    _btSvg = document.getElementById('bt-chart'); _btSvg.innerHTML = '';
    _btGridG = _btEl('g', {}); _btSvg.appendChild(_btGridG);
    _btAttachHover();
}
let _btGridG;
function btDrawGrid(max, min) {
    _btGridG.innerHTML = '';
    min = min || 0;
    for (let v = min; v <= max + 0.5; v += _btNiceStep(max - min)) {
        _btGridG.appendChild(_btEl('line', { class: 'bt-grid', x1: BT_PL, y1: _btY(v, max), x2: BT_PL + _btPW, y2: _btY(v, max) }));
        const t = _btEl('text', { class: 'bt-yax', x: BT_PL - 10, y: _btY(v, max) + 3, 'text-anchor': 'end' }); t.textContent = v; _btGridG.appendChild(t);
    }
    _btEvents.forEach((e, i) => { const t = _btEl('text', { class: 'bt-axis', x: _btX(i), y: BT_H - BT_PB + 20, 'text-anchor': 'middle' }); t.textContent = 'R' + e.round; _btGridG.appendChild(t); });
}
// ---- animation ------------------------------------------------------------
const BT_DUR = 1500, BT_STAG = 140;   // staggered "draw the season", mid-speed
let _btRaf = [], _btDrawnIds = [];
function _btClearRaf() { _btRaf.forEach(id => cancelAnimationFrame(id)); _btRaf = []; }
function _btExpanded() { const a = document.getElementById('bt-acc'); return !!a && !a.classList.contains('collapsed'); }
function _btReduceMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function btToggle() { const a = document.getElementById('bt-acc'); if (!a) return; a.classList.toggle('collapsed'); if (!a.classList.contains('collapsed')) btDraw('full'); }

// Animate one series: draw its line left→right, pop dots as the draw passes,
// count its points up, and fade the name/leader in at the finish.
function _btAnimateSeries(h, delay) {
    const len = h.path.getTotalLength();
    h.path.style.strokeDasharray = len; h.path.style.strokeDashoffset = len;
    h.dots.forEach(c => { c.style.opacity = 0; c.style.transform = 'scale(0)'; });
    [h.nm, h.pt, h.leader].forEach(n => { if (n) n.style.opacity = 0; });
    const nP = h.dots.length, t0 = performance.now() + delay;
    const step = now => {
        const t = Math.max(0, Math.min(1, (now - t0) / BT_DUR)), e = 1 - Math.pow(1 - t, 3);
        h.path.style.strokeDashoffset = len * (1 - e);
        h.dots.forEach((c, i) => { const f = nP <= 1 ? 0 : i / (nP - 1); if (e >= f) { c.style.transition = 'opacity .18s, transform .18s'; c.style.opacity = 1; c.style.transform = 'scale(1)'; } });
        h.pt.textContent = Math.round(h.last * e) + ' ' + h.unit;
        if (t >= 1) { [h.nm, h.pt, h.leader].forEach(n => { if (n) { n.style.transition = 'opacity .3s'; n.style.opacity = ''; } }); h.pt.textContent = Math.round(h.last) + ' ' + h.unit; return; }
        _btRaf.push(requestAnimationFrame(step));
    };
    _btRaf.push(requestAnimationFrame(step));
}

function btDraw(anim) {
    _btClearRaf();
    if (_btSeriesG) _btSeriesG.remove();
    const min = _btYMin(); _btYMinCache = min;
    const max = _btYMax(min); _btYCache = max; btDrawGrid(max, min);
    _btSeriesG = _btEl('g', {}); _btSvg.appendChild(_btSeriesG);
    const active = _btActive();
    if (!active.length) { const t = _btEl('text', { class: 'bt-empty', x: BT_PL + _btPW / 2, y: BT_PT + _btPH / 2, 'text-anchor': 'middle' }); t.textContent = `Pick a ${_btNoun(false)} to start comparing.`; _btSeriesG.appendChild(t); _btDrawnIds = []; return; }

    // Compute end-label positions (de-collide; centre the stack when the
    // field is bunched, else keep labels by their line heights, clamped).
    const lastX = _btX(_btLastIdx), labelX = BT_PL + _btPW + 12;
    const labels = active.map(a => { const v = (_btSeries(a.d.id) || [])[_btLastIdx]; const last = v == null ? 0 : v; return { a, last, y: _btY(last, max) }; }).sort((x, y) => x.y - y.y);
    const GAP = 30, topLimit = BT_PT + 12, botLimit = BT_PT + _btPH - 6;
    const n = labels.length, blockH = (n - 1) * GAP, avail = botLimit - topLimit;
    for (let i = 1; i < n; i++) if (labels[i].y - labels[i - 1].y < GAP) labels[i].y = labels[i - 1].y + GAP;
    const saturated = n > 1 && (labels[n - 1].y - labels[0].y) <= blockH + 0.5;
    if (saturated && blockH < avail) { const start = topLimit + (avail - blockH) / 2; labels.forEach((L, i) => { L.y = start + i * GAP; }); }
    else { const over = labels[n - 1].y - botLimit; if (over > 0) labels.forEach(L => { L.y -= over; }); const under = topLimit - labels[0].y; if (under > 0) labels.forEach(L => { L.y += under; }); }
    const labY = new Map(labels.map(L => [L.a.d.id, { y: L.y, last: L.last }]));

    const canAnim = anim && anim !== 'none' && _btExpanded() && !_btReduceMotion();

    active.forEach((a, idx) => {
        const pts = [];
        (_btSeries(a.d.id) || []).forEach((v, i) => { if (v != null) pts.push({ i, v }); });
        if (!pts.length) return;
        const dstr = pts.map((p, k) => `${k ? 'L' : 'M'}${_btX(p.i)},${_btY(p.v, max)}`).join(' ');
        const path = _btEl('path', { class: 'bt-line', d: dstr, stroke: a.color }); _btSeriesG.appendChild(path);
        const dots = pts.map(p => { const c = _btEl('circle', { class: 'bt-dot', cx: _btX(p.i), cy: _btY(p.v, max), r: 3.4, fill: a.color }); _btSeriesG.appendChild(c); return c; });
        const L = labY.get(a.d.id) || { y: _btY(_btYMinCache, max), last: _btYMinCache };
        let leader = null;
        const anchorY = _btY(L.last, max);
        if (lastX < labelX - 20 || Math.abs(L.y - anchorY) > 3) { leader = _btEl('line', { x1: lastX + 4, y1: anchorY, x2: labelX - 4, y2: L.y - 4, stroke: a.color, 'stroke-width': 1, opacity: 0.4 }); _btSeriesG.appendChild(leader); }
        const nm = _btEl('text', { class: 'bt-end', x: labelX, y: L.y - 4, fill: a.color }); nm.textContent = a.d.name; _btSeriesG.appendChild(nm);
        const pt = _btEl('text', { class: 'bt-endpts', x: labelX, y: L.y + 8 }); pt.textContent = Math.round(L.last) + ' ' + _btUnit(); _btSeriesG.appendChild(pt);

        const isNew = _btDrawnIds.indexOf(a.d.id) === -1;
        const animateThis = canAnim && (anim === 'full' || (anim === 'grow' && isNew));
        if (animateThis) _btAnimateSeries({ path, dots, nm, pt, leader, last: L.last, unit: _btUnit() }, anim === 'full' ? idx * BT_STAG : 0);
    });

    _btGuide = _btEl('line', { class: 'bt-guide', x1: 0, y1: BT_PT, x2: 0, y2: BT_PT + _btPH, opacity: 0 }); _btSeriesG.appendChild(_btGuide);
    _btDrawnIds = active.map(a => a.d.id);
}
function _btAttachHover() {
    _btSvg.addEventListener('mousemove', e => {
        const active = _btActive(); if (!active.length || !_btGuide) return;
        const rect = _btSvg.getBoundingClientRect(), sx = (e.clientX - rect.left) / rect.width * BT_W;
        let i = _btEvents.length <= 1 ? 0 : Math.round((sx - BT_PL) / _btPW * (_btEvents.length - 1));
        i = Math.max(0, Math.min(_btLastIdx, i));   // only completed rounds carry data
        _btGuide.setAttribute('x1', _btX(i)); _btGuide.setAttribute('x2', _btX(i)); _btGuide.setAttribute('opacity', 1);
        const rows = active.map(a => ({ name: a.d.name, color: a.color, v: Math.round((_btSeries(a.d.id) || [])[i] || 0) })).sort((x, y) => y.v - x.v);
        const tt = document.getElementById('bt-tt');
        tt.innerHTML = `<div class="bt-tt-round">Round ${_btEvents[i].round}</div>` + rows.map(x => `<div class="bt-tt-row"><span class="bt-tt-dot" style="background:${x.color}"></span><span class="bt-tt-name">${esc(x.name)}</span><span class="bt-tt-val" style="color:${x.color}">${x.v}</span></div>`).join('');
        tt.style.opacity = 1; const px = _btX(i) / BT_W * rect.width; tt.style.left = Math.min(px + 16, rect.width - 168) + 'px'; tt.style.top = '8px';
    });
    _btSvg.addEventListener('mouseleave', () => { const tt = document.getElementById('bt-tt'); if (tt) tt.style.opacity = 0; if (_btGuide) _btGuide.setAttribute('opacity', 0); });
}
function btRefresh(anim) { btSelected(); btHint(); btDraw(anim || 'none'); }

// Strip out the latest event's points-contribution per driver, re-rank,
// and return a map of driver_id → previous position (1-based) so we can
// show ▲ / ▼ / – movement arrows.
function computePrevRank(perEvent, seasonId, currentDrivers) {
    const inSeason = perEvent.filter(r => r.results?.events?.season_id === seasonId);
    if (!inSeason.length) return {};
    const lastTs = inSeason
        .map(r => r.results.events.starts_at)
        .filter(Boolean)
        .sort()
        .pop();
    if (!lastTs) return {};

    // Driver → points awarded before the latest event.
    const prev = {};
    currentDrivers.forEach(d => { prev[d.driver_id] = 0; });
    inSeason.forEach(r => {
        if (r.results.events.starts_at === lastTs) return;
        prev[r.driver_id] = (prev[r.driver_id] || 0) + Number(r.points_awarded || 0);
    });

    // Drivers who hadn't scored at all before the last event stay unranked
    // so we can show a "NEW" indicator instead of fake movement.
    const sorted = Object.entries(prev)
        .filter(([, p]) => p > 0)
        .sort((a, b) => b[1] - a[1]);
    const rankMap = {};
    sorted.forEach(([id], i) => { rankMap[id] = i + 1; });
    return rankMap;
}

let _ratingByDriver = {};
let _prevDriverRank = {};
let _formByDriver   = {};
let _manufacturers  = [];
let _dedByDriver    = {};
let _dedByTeam      = {};
let _bonByDriver    = {};
let _bonByTeam      = {};

// Small red "points docked" note with the reason(s), e.g. "−2 · bump drafting".
function deductionHtml(info) {
    if (!info || !info.amount) return '';
    const why = (info.reasons || []).join(', ');
    return `<div class="pts-deduct" title="${esc(why ? why + ' ' : '')}(−${info.amount} pts)">−${info.amount}${why ? ` · ${esc(why)}` : ''}</div>`;
}

// Small green "points awarded" note with the reason(s), e.g. "+1 · original pole".
function bonusHtml(info) {
    if (!info || !info.amount) return '';
    const why = (info.reasons || []).join(', ');
    return `<div class="pts-bonus" title="${esc(why ? why + ' ' : '')}(+${info.amount} pts)">+${info.amount}${why ? ` · ${esc(why)}` : ''}</div>`;
}
