<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings — GTEC Gran Turismo 7 Endurance Championship</title>
    <meta name="description" content="Live championship standings for GTEC, the Gran Turismo 7 endurance championship. Driver and team points, wins, podiums, ELO ratings, updated after every round.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://sparkstheory.co.uk/endurance/standings/">
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="manifest" href="/endurance/assets/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/endurance/assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTEC">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Open Graph / Twitter card -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="GTEC">
    <meta property="og:title"       content="GTEC Standings">
    <meta property="og:description" content="Live driver and team standings for the GTEC endurance championship.">
    <meta property="og:image"       content="https://sparkstheory.co.uk/endurance/assets/og-card.png">
    <meta property="og:url"         content="https://sparkstheory.co.uk/endurance/standings/">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="GTEC Standings">
    <meta name="twitter:description" content="Live driver and team standings for the GTEC endurance championship.">
    <meta name="twitter:image"       content="https://sparkstheory.co.uk/endurance/assets/og-card.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --silver: #cbd5e1;
            --bronze: #cd7f32;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Nav */
        .gtec-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(5,6,8,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .gtec-nav .brand {
            font-family: 'Anton', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            text-indent: 0.32em;
        }
        .gtec-nav .brand .accent { color: var(--gold); }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .gtec-nav .nav-links a {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #111; background: var(--gold); text-decoration: none; padding: 0.5rem 1rem; border-radius: 999px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 2px 10px rgba(255,209,102,0.35); }
        .gtec-nav .apply:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,209,102,0.5); }
        .gtec-nav .back {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: color 0.2s, border-color 0.2s;
        }
        .gtec-nav .back:hover {
            color: var(--text);
            border-color: rgba(255,255,255,0.25);
        }

        /* Hero */
        .hero {
            padding: 3rem 2rem 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .hero-eyebrow {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.75rem;
            text-indent: 0.45em;
        }
        .hero-title {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .hero-sub { color: var(--muted); font-size: 0.88rem; }

        /* Tabs */
        .tab-bar {
            display: flex;
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 0.9rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

        /* Content */
        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
        }

        /* Force every link in the standings to inherit the row's colour,
           overriding the browser's :visited purple. */
        .standings a,
        .standings a:link,
        .standings a:visited,
        .standings a:active { color: inherit; text-decoration: none; }
        .standings a:hover { text-decoration: underline; }

        /* Live-battle flag — a quiet inline cue next to the points-gap
           number when this row could still catch the row above it,
           rather than a separate section competing with the table. */
        .battle-flag {
            display: inline-block;
            margin-left: 0.3rem;
            font-size: 0.72rem;
            cursor: help;
        }

        /* Standings table */
        .standings {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            padding: 0.85rem 1.25rem;
            text-align: left;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        thead th.right { text-align: right; }
        thead th.center { text-align: center; }

        tbody td {
            padding: 0.95rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            position: relative;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.right { text-align: right; }
        td.center { text-align: center; }
        td.muted { color: var(--muted); font-size: 0.85rem; }

        /* Subtle gradient sweep on every row — adds depth without shouting. */
        tbody tr td {
            background-image: linear-gradient(90deg, rgba(255,255,255,0.012) 0%, rgba(255,255,255,0) 60%);
        }

        /* Podium rows get a metallic-tinted gradient + left accent stripe.
           Box-shadow inset on the first cell paints the stripe without
           breaking the row's flexible width. */
        tbody tr.rank-1 td {
            background-image: linear-gradient(90deg, rgba(255,209,102,0.16) 0%, rgba(255,209,102,0.05) 55%, rgba(255,255,255,0) 100%);
        }
        tbody tr.rank-1 td:first-child {
            /* 6px gold stripe + a soft inner glow so P1 sits "on top" of
               the table. */
            box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18);
        }
        tbody tr.rank-1 td { box-shadow: inset 0 0 0 0 transparent, 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1 td:first-child { box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18), 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1:hover td { background-color: rgba(255,209,102,0.07); }

        tbody tr.rank-2 td { background-image: linear-gradient(90deg, rgba(199,201,201,0.08) 0%, rgba(199,201,201,0.02) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-2 td:first-child { box-shadow: inset 4px 0 0 0 var(--silver); }
        tbody tr.rank-2:hover td { background-color: rgba(199,201,201,0.035); }

        tbody tr.rank-3 td { background-image: linear-gradient(90deg, rgba(205,127,50,0.09) 0%, rgba(205,127,50,0.025) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-3 td:first-child { box-shadow: inset 4px 0 0 0 var(--bronze); }
        tbody tr.rank-3:hover td { background-color: rgba(205,127,50,0.035); }

        /* "Lighter" stats — small numeric columns get less visual weight
           so the driver / team name + points are the loudest cells, but
           still big and bright enough to read at a glance. */
        td.lighter { color: rgba(203,213,225,0.85); font-size: 1.05rem; font-weight: 600; }

        /* Leader pip + gap below the points number. */
        .leader-pip {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem; font-weight: 700; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--gold);
        }
        .points-gap {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            color: rgba(148,163,184,0.85);
        }
        .pts-deduct {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
            color: #f87171; text-transform: uppercase;
        }

        /* "★ Leader" badge inline with the name. */
        .leader-tag {
            display: inline-block;
            margin-left: 0.55rem;
            padding: 0.12rem 0.55rem;
            background: rgba(255,209,102,0.18);
            border: 1px solid rgba(255,209,102,0.45);
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            vertical-align: middle;
        }

        /* Position cell stacks number + movement chip vertically. */
        .pos-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; }
        .move {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
            padding: 0.08rem 0.4rem; border-radius: 4px;
        }
        .move-up   { background: rgba(34,197,94,0.15);  color: #4ade80; }
        .move-down { background: rgba(239,68,68,0.15);  color: #f87171; }
        .move-flat { background: rgba(148,163,184,0.12); color: #94a3b8; }
        .move-new  { background: rgba(255,209,102,0.15); color: var(--gold); }

        /* Driver / team name — slightly larger across the board now. */
        .name { font-size: 1rem; }
        .driver-row .name { font-size: 1.08rem; }

        /* Elo cell on drivers tab. */
        .elo-cell { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
        .elo-num { font-family: 'Anton', sans-serif; font-size: 1rem; color: var(--gold); letter-spacing: 0.02em; line-height: 1; }
        .elo-cell .elo-tier { margin-left: 0 !important; }

        /* Manufacturer badge — bumped up so it's recognisable, not a dot. */
        .meta-line img { width: 20px !important; height: 20px !important; }

        /* Position cell */
        .pos {
            font-family: 'Anton', sans-serif;
            font-size: 1.2rem;
            width: 50px;
            color: var(--muted);
        }
        .pos.p1 { color: var(--gold); }
        .pos.p2 { color: var(--silver); }
        .pos.p3 { color: var(--bronze); }

        /* Name + meta */
        .name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.92rem;
        }
        .driver-row .name { font-family: 'Anton', sans-serif; font-size: 1rem; letter-spacing: 0.03em; }
        .meta-line {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .mfr-logo {
            display: inline-block;
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
            vertical-align: middle;
        }
        .career-num {
            display: inline-block;
            background: rgba(255,209,102,0.12);
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.1rem 0.45rem;
            border-radius: 3px;
            margin-right: 0.45rem;
        }
        .driver-flag { font-size: 1.05em; line-height: 1; vertical-align: baseline; }

        /* Row cell with avatar to the left of name + meta */
        .driver-cell { display: flex; align-items: center; gap: 0.6rem; }
        .driver-cell-text { min-width: 0; }
        .std-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            object-fit: cover; flex-shrink: 0; background: var(--bg-2);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .std-avatar-init { font-family: 'Anton', sans-serif; font-size: 0.95rem; color: var(--muted); opacity: 0.7; }
        .mfr-badge-lg { display: inline-flex; align-items: center; justify-content: center; width: 34px; flex-shrink: 0; }
        .mfr-badge-lg .mfr-logo { width: 26px; height: 26px; object-fit: contain; }

        /* Recent-form pills */
        .form-strip { display: inline-flex; gap: 3px; }
        .form-pill {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 24px; padding: 2px 5px; border-radius: 4px;
            font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700;
            background: rgba(255,255,255,0.06); color: var(--muted);
        }
        .form-pill.form-win    { background: rgba(255,209,102,0.18); color: var(--gold); }
        .form-pill.form-podium { background: rgba(148,163,184,0.20); color: #e2e8f0; }
        .form-pill.form-dnf    { background: rgba(248,113,113,0.15); color: #f87171; }
        .form-empty { color: var(--muted); opacity: 0.5; }

        /* Top-3 rostrum */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 0.75rem; margin: 0.25rem 0 1.75rem; }
        .podium-spot { display: flex; flex-direction: column; align-items: center; width: 32%; max-width: 190px; }
        .podium-driver { text-decoration: none; color: var(--text); text-align: center; display: block; margin-bottom: 0.55rem; transition: transform 0.15s; }
        .podium-driver:hover { transform: translateY(-3px); }
        .pod-av-wrap { display: flex; justify-content: center; margin-bottom: 0.5rem; }
        .pod-av { border-radius: 50%; object-fit: cover; background: var(--bg-2); display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--border); }
        .pod-av-init { font-family: 'Anton', sans-serif; color: var(--muted); }
        .podium-name { font-family: 'Anton', sans-serif; font-size: 0.95rem; letter-spacing: 0.02em; line-height: 1.1; }
        .podium-pts { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
        .podium-step { width: 100%; border-radius: 10px 10px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 0.5rem; border: 1px solid var(--border); border-bottom: none; }
        .podium-rank { font-family: 'Anton', sans-serif; line-height: 1; }
        .spot-1 .pod-av { width: 88px; height: 88px; border-color: rgba(255,209,102,0.6); }
        .spot-2 .pod-av, .spot-3 .pod-av { width: 66px; height: 66px; }
        .spot-1 .pod-av-init { font-size: 2rem; }
        .spot-2 .pod-av-init, .spot-3 .pod-av-init { font-size: 1.4rem; }
        .spot-1 .podium-name { font-size: 1.1rem; }
        .step-1 { height: 120px; background: linear-gradient(180deg, rgba(255,209,102,0.22), rgba(255,209,102,0.05)); }
        .step-2 { height: 92px;  background: linear-gradient(180deg, rgba(203,213,225,0.20), rgba(203,213,225,0.04)); }
        .step-3 { height: 72px;  background: linear-gradient(180deg, rgba(209,154,102,0.20), rgba(209,154,102,0.04)); }
        .step-1 .podium-rank { color: var(--gold); font-size: 2rem; }
        .step-2 .podium-rank { color: #cbd5e1; font-size: 1.6rem; }
        .step-3 .podium-rank { color: #d19a66; font-size: 1.6rem; }
        @media (max-width: 520px) {
            .podium { gap: 0.4rem; }
            .podium-name { font-size: 0.78rem; }
            .spot-1 .podium-name { font-size: 0.9rem; }
            .spot-1 .pod-av { width: 62px; height: 62px; }
            .spot-2 .pod-av, .spot-3 .pod-av { width: 48px; height: 48px; }
        }

        /* Points cell */
        .points {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 0.02em;
        }

        .state-msg {
            text-align: center;
            padding: 4rem 2rem;
        }
        .state-msg h3 {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .state-msg p { color: var(--muted); font-size: 0.88rem; }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
        }

        @media (max-width: 700px) {
            .nav { padding: 1rem; }
            .hero { padding: 2rem 1rem 1rem; }
            .tab-bar { padding: 0 1rem; }
            .content { padding: 1rem 0.5rem 3rem; }
            .standings { border-radius: 8px; border-left: none; border-right: none; }
            thead th, tbody td { padding: 0.7rem 0.6rem; }
            .pos { width: 36px; font-size: 1rem; }
            .points { font-size: 1.05rem; }
            .hide-mob { display: none; }
        }

        /* ===== Championship Battle chart ===== */
        .battle { margin-bottom: 1.25rem; }
        .bt-acc { background: var(--bg-1); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .bt-head { display: flex; align-items: center; gap: 0.85rem; padding: 1rem 1.1rem; cursor: pointer; user-select: none; }
        .bt-head:hover { background: rgba(255,255,255,0.02); }
        .bt-ic { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,209,102,0.12); border: 1px solid rgba(255,209,102,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .bt-titles { flex: 1; min-width: 0; }
        .bt-title { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
        .bt-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
        .bt-chev { transition: transform 0.2s; color: var(--muted); flex-shrink: 0; width: 16px; height: 16px; }
        .bt-acc.collapsed .bt-chev { transform: rotate(-90deg); }
        .bt-acc.collapsed .bt-body { display: none; }
        .bt-body { padding: 0.9rem 1.2rem 1.3rem; border-top: 1px solid var(--border); }
        .bt-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .bt-search-wrap { position: relative; flex: 1; min-width: 190px; }
        .bt-search { width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.85rem; padding: 0.55rem 0.8rem; }
        .bt-search::placeholder { color: #5b6472; }
        .bt-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg-2); border: 1px solid var(--border); border-radius: 9px; max-height: 230px; overflow-y: auto; z-index: 8; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.55); }
        .bt-results.open { display: block; }
        .bt-res { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.7rem; cursor: pointer; font-size: 0.83rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .bt-res:hover { background: rgba(255,255,255,0.05); }
        .bt-res-pos { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; color: var(--muted); min-width: 36px; }
        .bt-res-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bt-res-pts { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
        .bt-res.added { color: #5b6472; cursor: default; }
        .bt-res.added:hover { background: none; }
        .bt-none { padding: 0.6rem 0.7rem; color: #5b6472; font-size: 0.8rem; }

        .bt-tt-round { font-family: 'Orbitron', sans-serif; font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.4rem; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script src="/endurance/assets/elo-tiers.js?v=3"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data.session) { if (portal) portal.style.display = ''; }
    else              { if (signin) signin.style.display = ''; }
});

let _drivers = [];
let _teams   = [];
let _ratings = null; // loaded lazily
let _season  = null;
let _tab     = 'drivers';
let _ceiling  = null; // max points still available across all remaining rounds (Split-1 ceiling), for Live Battles
let _remaining = 0;

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Flag emoji from any 2-letter ISO country code (regional indicators).
function flag(c) {
    const cc = (c || '').trim().toUpperCase();
    if (!/^[A-Z]{2}$/.test(cc)) return '';
    return String.fromCodePoint(...[...cc].map(ch => 127397 + ch.charCodeAt(0)));
}

function posCls(p) {
    if (p === 1) return 'pos p1';
    if (p === 2) return 'pos p2';
    if (p === 3) return 'pos p3';
    return 'pos';
}
function rankCls(p) {
    if (p === 1) return 'rank-1';
    if (p === 2) return 'rank-2';
    if (p === 3) return 'rank-3';
    return '';
}

// Render the small movement chip next to the position. Returns ▲N green,
// ▼N red, – grey, or "NEW" gold for drivers who weren't ranked before
// the most recent event.
function movementHTML(currentPos, prevPos) {
    if (prevPos == null) return `<span class="move move-new">NEW</span>`;
    const delta = prevPos - currentPos;  // positive = moved up
    if (delta > 0)  return `<span class="move move-up">▲${delta}</span>`;
    if (delta < 0)  return `<span class="move move-down">▼${-delta}</span>`;
    return `<span class="move move-flat">–</span>`;
}

// Manufacturer logo (preferred) or coloured swatch fallback
function mfrBadge(logoUrl, brandColor, name) {
    if (logoUrl) return `<img class="mfr-logo" src="${esc(logoUrl)}" alt="${esc(name || '')}" loading="lazy">`;
    if (brandColor) return `<span class="swatch" style="background:${esc(brandColor)}"></span>`;
    return '';
}

// Small round driver avatar (photo, else initial).
function driverAvatar(photo, name) {
    if (photo) return `<img class="std-avatar" src="${esc(photo)}" alt="" loading="lazy">`;
    const init = (name || '?').trim().charAt(0).toUpperCase();
    return `<span class="std-avatar std-avatar-init">${esc(init)}</span>`;
}

// Recent-form strip: last few rounds as compact, colour-coded pills.
function formStrip(form) {
    if (!form || !form.length) return '<span class="form-empty">—</span>';
    return `<span class="form-strip">` + form.map(f => {
        const st = f.status || 'classified';
        let cls = 'form-pill', label, title;
        if (st !== 'classified') {
            cls += ' form-dnf';
            label = st === 'dnf' ? 'DNF' : st === 'dsq' ? 'DSQ' : st === 'dns' ? 'DNS' : st === 'withdrawn' ? 'WD' : '—';
            title = label;
        } else if (f.pos === 1) {
            cls += ' form-win'; label = 'P1'; title = 'Win';
        } else if (f.pos != null && f.pos <= 3) {
            cls += ' form-podium'; label = 'P' + f.pos; title = 'Podium';
        } else {
            label = f.pos != null ? 'P' + f.pos : '—'; title = label;
        }
        return `<span class="${cls}" title="${esc(title)}">${label}</span>`;
    }).join('') + `</span>`;
}

// Top-3 rostrum above the driver standings — P2 · P1 · P3, tallest in the
// middle. Only shown once there's a genuine top three.
function podiumSpot(d, place) {
    if (!d) return '';
    const info = _ratingByDriver[d.driver_id] || {};
    const pts  = Number(d.points) || 0;
    const av = info.photo
        ? `<img class="pod-av" src="${esc(info.photo)}" alt="" loading="lazy">`
        : `<span class="pod-av pod-av-init">${esc((d.driver_name || '?').trim().charAt(0).toUpperCase())}</span>`;
    const flg = d.nationality ? `<span class="driver-flag">${flag(d.nationality)}</span> ` : '';
    return `<div class="podium-spot spot-${place}">
        <a class="podium-driver" href="/endurance/drivers/?slug=${esc(d.driver_slug)}">
            <div class="pod-av-wrap">${av}</div>
            <div class="podium-name">${flg}${esc(d.driver_name)}</div>
            <div class="podium-pts">${pts.toFixed(pts % 1 === 0 ? 0 : 1)} pts</div>
        </a>
        <div class="podium-step step-${place}"><span class="podium-rank">${place}</span></div>
    </div>`;
}
function renderPodium(list) {
    if (!list || list.length < 3) return '';
    const [p1, p2, p3] = list;
    return `<div class="podium">${podiumSpot(p2, 2)}${podiumSpot(p1, 1)}${podiumSpot(p3, 3)}</div>`;
}

async function setTab(t) {
    _tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    // The Championship Battle chart belongs to the Drivers championship only.
    const battle = document.getElementById('battle');
    if (battle) battle.style.display = (t === 'drivers' && _btEvents.length) ? '' : 'none';
    if (t === 'ratings' && _ratings === null) {
        await loadRatings();
    } else {
        render();
    }
}

function render() {
    const panel = document.getElementById('panel');
    if (_tab === 'drivers')  renderDrivers(panel);
    else if (_tab === 'teams') renderTeams(panel);
    else if (_tab === 'manufacturers') renderManufacturers(panel);
    else renderRatings(panel);
}

async function loadRatings() {
    const panel = document.getElementById('panel');
    panel.innerHTML = '<div class="loading">Loading ratings…</div>';
    const { data, error } = await sb.from('driver_current_ratings')
        .select('*')
        .not('last_rated_at', 'is', null)
        .order('rating', { ascending: false });
    if (error) { panel.innerHTML = `<div class="state-msg"><p>${esc(error.message)}</p></div>`; return; }
    _ratings = data || [];
    renderRatings(panel);
}

// Live-battle flag — a quiet inline cue instead of a separate section.
// Returns a small icon for the gap cell when THIS row could still catch
// the row directly above it (their ceiling reaches or passes the row
// above's current points); empty string when that gap is already
// mathematically settled, or for the leader row (nothing above to chase).
function battleFlag(rowPoints, aboveRow) {
    if (_ceiling == null || !aboveRow) return '';
    const abovePoints = Number(aboveRow.points) || 0;
    if (rowPoints + _ceiling < abovePoints) return '';
    const gap = abovePoints - rowPoints;
    const title = `Still catchable — ${gap.toFixed(gap % 1 === 0 ? 0 : 1)} pt${gap === 1 ? '' : 's'} back, ${_remaining} round${_remaining === 1 ? '' : 's'} left`;
    return `<span class="battle-flag" title="${esc(title)}">🔥</span>`;
}

function renderDrivers(panel) {
    if (!_drivers.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Results Yet</h3><p>Standings will appear here once race results are recorded.</p></div>`;
        return;
    }
    const leaderPoints = Number(_drivers[0].points) || 0;
    const rows = _drivers.map((d, i) => {
        const pos = i + 1;
        const num = d.career_number ? `<span class="career-num">#${d.career_number}</span>` : '';
        // Solo drivers have no team_name (and the view derives manufacturer
        // via team_seasons, so it's null for them) — fall back to the
        // driver's own manufacturer from driver_current_ratings so solo
        // entries still show a manufacturer, like team drivers do.
        const _rInfo = _ratingByDriver[d.driver_id];
        const soloMfrName  = d.manufacturer_name     || _rInfo?.manufacturerName;
        const soloMfrLogo  = d.manufacturer_logo_url || _rInfo?.manufacturerLogoUrl;
        const soloMfrColor = d.brand_color           || _rInfo?.brandColor;
        const teamLine = d.team_name
            ? `<div class="meta-line">${mfrBadge(d.manufacturer_logo_url, d.brand_color, d.manufacturer_name, { size: 'lg' })}${d.team_slug ? `<a href="/endurance/teams/?slug=${esc(d.team_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='inherit'">${esc(d.team_name)}</a>` : esc(d.team_name)}${d.manufacturer_name ? ` · ${esc(d.manufacturer_name)}` : ''}</div>`
            : (soloMfrName ? `<div class="meta-line">${mfrBadge(soloMfrLogo, soloMfrColor, soloMfrName)}<em style="opacity:0.75">Solo</em> · ${esc(soloMfrName)}</div>` : '');
        const movement = movementHTML(pos, _prevDriverRank[d.driver_id]);
        const leaderTag = pos === 1
            ? `<span class="leader-tag">★ Leader</span>`
            : '';
        const ratingInfo = _ratingByDriver[d.driver_id];
        const eloHTML = ratingInfo
            ? `<div class="elo-cell">
                   <span class="elo-num">${Math.round(ratingInfo.rating)}</span>
                   ${window.eloTierBadge ? window.eloTierBadge(ratingInfo.rating, { provisional: !ratingInfo.rated }) : ''}
               </div>`
            : '';
        const points = Number(d.points) || 0;
        const gap = pos === 1
            ? `<span class="leader-pip">LEADER</span>`
            : `<span class="points-gap">−${(leaderPoints - points).toFixed(points % 1 === 0 && leaderPoints % 1 === 0 ? 0 : 1)}</span>${battleFlag(points, _drivers[i - 1])}`;
        return `<tr class="driver-row ${rankCls(pos)}">
            <td class="${posCls(pos)}" style="${d.brand_color ? `border-left:3px solid ${esc(d.brand_color)}` : 'border-left:3px solid transparent'}">
                <div class="pos-stack">
                    <span>${pos}</span>
                    ${movement}
                </div>
            </td>
            <td>
                <div class="driver-cell">
                    ${driverAvatar(_rInfo?.photo, d.driver_name)}
                    <div class="driver-cell-text">
                        <div class="name">${num}${d.nationality ? `<span class="driver-flag" title="${esc(d.nationality)}">${flag(d.nationality)}</span> ` : ''}<a href="/endurance/drivers/?slug=${esc(d.driver_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(d.driver_name)}</a>${leaderTag}</div>
                        ${teamLine}
                    </div>
                </div>
            </td>
            <td class="hide-mob center">${eloHTML}</td>
            <td class="lighter center hide-mob">${d.races}</td>
            <td class="lighter center hide-mob">${d.wins}</td>
            <td class="lighter center hide-mob">${d.podiums}</td>
            <td class="lighter center hide-mob">${d.poles}</td>
            <td class="lighter center hide-mob">${d.fastest_laps}</td>
            <td class="hide-mob center">${formStrip(_formByDriver[d.driver_id])}</td>
            <td class="right">
                <div class="points">${points.toFixed(points % 1 === 0 ? 0 : 1)}</div>
                ${deductionHtml(_dedByDriver[d.driver_id])}
                ${gap}
            </td>
        </tr>`;
    }).join('');

    panel.innerHTML = `
        ${renderPodium(_drivers)}
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:64px">#</th>
                    <th>Driver</th>
                    <th class="center hide-mob">Elo</th>
                    <th class="center hide-mob">Races</th>
                    <th class="center hide-mob">Wins</th>
                    <th class="center hide-mob">Pod</th>
                    <th class="center hide-mob">Pole</th>
                    <th class="center hide-mob">FL</th>
                    <th class="center hide-mob">Form</th>
                    <th class="right">Points</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

function renderTeams(panel) {
    if (!_teams.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Results Yet</h3><p>Standings will appear here once race results are recorded.</p></div>`;
        return;
    }
    const leaderPoints = Number(_teams[0].points) || 0;
    const rows = _teams.map((t, i) => {
        const pos = i + 1;
        const mfrLine = t.manufacturer_name
            ? `<div class="meta-line">${mfrBadge(t.manufacturer_logo_url, t.brand_color, t.manufacturer_name, { size: 'lg' })}${esc(t.manufacturer_name)}</div>`
            : '';
        const leaderTag = pos === 1 ? `<span class="leader-tag">★ Leader</span>` : '';
        const points = Number(t.points) || 0;
        const gap = pos === 1
            ? `<span class="leader-pip">LEADER</span>`
            : `<span class="points-gap">−${(leaderPoints - points).toFixed(points % 1 === 0 && leaderPoints % 1 === 0 ? 0 : 1)}</span>${battleFlag(points, _teams[i - 1])}`;
        return `<tr class="${rankCls(pos)}">
            <td class="${posCls(pos)}" style="${t.brand_color ? `border-left:3px solid ${esc(t.brand_color)}` : 'border-left:3px solid transparent'}">
                <div class="pos-stack"><span>${pos}</span></div>
            </td>
            <td>
                <div class="name"><a href="/endurance/teams/?slug=${esc(t.team_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(t.team_name)}</a>${leaderTag}</div>
                ${mfrLine}
            </td>
            <td class="lighter center hide-mob">${t.races}</td>
            <td class="lighter center hide-mob">${t.wins}</td>
            <td class="lighter center hide-mob">${t.podiums}</td>
            <td class="lighter center hide-mob">${t.poles}</td>
            <td class="lighter center hide-mob">${t.fastest_laps}</td>
            <td class="right">
                <div class="points">${points}</div>
                ${deductionHtml(_dedByTeam[t.team_id])}
                ${gap}
            </td>
        </tr>`;
    }).join('');

    panel.innerHTML = `
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:50px">#</th>
                    <th>Team</th>
                    <th class="center hide-mob">Races</th>
                    <th class="center hide-mob">Wins</th>
                    <th class="center hide-mob">Pod</th>
                    <th class="center hide-mob">Pole</th>
                    <th class="center hide-mob">FL</th>
                    <th class="right">Points</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

function renderManufacturers(panel) {
    if (!_manufacturers.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Results Yet</h3><p>Manufacturer standings appear once race results are recorded.</p></div>`;
        return;
    }
    const leaderPoints = Number(_manufacturers[0].points) || 0;
    const rows = _manufacturers.map((m, i) => {
        const pos = i + 1;
        const points = Number(m.points) || 0;
        const gap = pos === 1
            ? `<span class="leader-pip">LEADER</span>`
            : `<span class="points-gap">−${(leaderPoints - points).toFixed(points % 1 === 0 && leaderPoints % 1 === 0 ? 0 : 1)}</span>`;
        return `<tr class="${rankCls(pos)}">
            <td class="${posCls(pos)}" style="${m.color ? `border-left:3px solid ${esc(m.color)}` : 'border-left:3px solid transparent'}">${pos}</td>
            <td>
                <div class="driver-cell">
                    <span class="mfr-badge-lg">${mfrBadge(m.logo, m.color, m.name)}</span>
                    <div class="name">${esc(m.name)}</div>
                </div>
            </td>
            <td class="lighter center hide-mob">${m.drivers}</td>
            <td class="lighter center hide-mob">${m.wins}</td>
            <td class="lighter center hide-mob">${m.podiums}</td>
            <td class="lighter center hide-mob">${m.poles}</td>
            <td class="lighter center hide-mob">${m.fl}</td>
            <td class="right">
                <div class="points">${points.toFixed(points % 1 === 0 ? 0 : 1)}</div>
                ${gap}
            </td>
        </tr>`;
    }).join('');

    panel.innerHTML = `
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:64px">#</th>
                    <th>Manufacturer</th>
                    <th class="center hide-mob">Drivers</th>
                    <th class="center hide-mob">Wins</th>
                    <th class="center hide-mob">Pod</th>
                    <th class="center hide-mob">Pole</th>
                    <th class="center hide-mob">FL</th>
                    <th class="right">Points</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

function renderRatings(panel) {
    if (!_ratings?.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Ratings Yet</h3><p>Ratings appear here after running Compute Elo on a completed event.</p></div>`;
        return;
    }
    const rows = _ratings.map((d, i) => {
        const pos = i + 1;
        const delta = d.last_delta;
        const deltaHTML = delta != null
            ? `<span style="font-size:0.78rem;font-weight:600;color:${delta >= 0 ? '#4ade80' : '#f87171'}">${delta >= 0 ? '+' : ''}${delta}</span>`
            : '—';
        const teamLine = d.team_name
            ? `<div class="meta-line">${mfrBadge(d.manufacturer_logo_url, d.brand_color, d.manufacturer_name)}${d.team_slug ? `<a href="/endurance/teams/?slug=${esc(d.team_slug)}" style="color:inherit;text-decoration:none">${esc(d.team_name)}</a>` : esc(d.team_name)}</div>`
            : '';
        return `<tr class="${rankCls(pos)}">
            <td class="${posCls(pos)}">${pos}</td>
            <td>
                <div class="name"><a href="/endurance/drivers/?slug=${esc(d.driver_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(d.driver_name)}</a></div>
                ${teamLine}
            </td>
            <td class="right"><span class="points">${d.rating}</span>${window.eloTierBadge ? window.eloTierBadge(d.rating) : ''}</td>
            <td class="right">${deltaHTML}</td>
            <td class="right hide-mob" style="color:var(--muted);font-size:0.85rem">${d.peak_rating}</td>
        </tr>`;
    }).join('');

    panel.innerHTML = `
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:50px">#</th>
                    <th>Driver</th>
                    <th class="right">Rating</th>
                    <th class="right">Last</th>
                    <th class="right hide-mob">Peak</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <p style="font-size:0.72rem;color:var(--muted);margin-top:0.85rem;padding:0 0.25rem">Pairwise Elo per split (K=20, seeded from GT7 DR/SR until raced). Clamped to [800–3000].</p>`;
}

async function load() {
    const { data: season } = await sb.from('seasons')
        .select('id, name, year, points_systems(points, pole_points, fastest_lap_points)')
        .eq('is_active', true)
        .maybeSingle();

    if (!season) {
        document.getElementById('season-sub').textContent = 'No active season.';
        document.getElementById('panel').innerHTML =
            `<div class="state-msg"><h3>Coming Soon</h3><p>Standings will appear here once the season is set up.</p></div>`;
        return;
    }
    _season = season;
    document.getElementById('season-title').textContent = season.name;
    document.getElementById('season-sub').textContent = `${season.year} Championship · Live standings`;

    const [d, t, ratings, perEvent, remainingRes, driverMfrs, deds, seasonEvents, myUser] = await Promise.all([
        sb.from('driver_standings').select('*').eq('season_id', season.id),
        sb.from('team_standings').select('*').eq('season_id', season.id),
        sb.from('driver_current_ratings').select('driver_id, rating, last_rated_at'),
        // Per-event, per-driver points so we can derive "rank before the last
        // event" and show championship movement arrows.
        sb.from('result_drivers')
            .select('driver_id, points_awarded, finish_position, status, results!inner(event_id, events!inner(season_id, starts_at))'),
        // Remaining rounds — feeds Live Battles' "still catchable" ceiling,
        // same Split-1-forever assumption as Season Stakes on the profile pages.
        sb.from('events').select('id', { count: 'exact', head: true })
            .eq('season_id', season.id).in('status', ['scheduled', 'in_progress']),
        // Each driver's own manufacturer (their profile lock) — the source
        // for showing a manufacturer on solo drivers, who have no team.
        sb.from('drivers').select('id, photo_url, manufacturers(id, name, brand_color, logo_url)'),
        // Points-deduction penalties this season, with reason — so the
        // standings can show why points were docked, and from whom.
        sb.from('penalties')
            .select('points_amount, reason, driver_id, entry_id, event_id, entries(team_id, entry_drivers(driver_id)), events!inner(season_id)')
            .eq('penalty_type', 'points_deduction')
            .eq('events.season_id', season.id),
        // Events for this season (for the Championship Battle chart's round axis).
        sb.from('events').select('id, round, name, starts_at').eq('season_id', season.id).order('round'),
        // The signed-in user's own driver, if any — powers the "Compare me" preset.
        sb.auth.getUser(),
    ]);

    _remaining = remainingRes.count || 0;
    const ps = season.points_systems;
    if (ps && _remaining) {
        const maxPos = Math.max(0, ...(ps.points || []).map(p => Number(p.points) || 0));
        _ceiling = _remaining * (maxPos + Number(ps.pole_points || 0) + Number(ps.fastest_lap_points || 0));
    } else {
        _ceiling = null;
    }

    // Index ratings by driver for quick lookup during render.
    _ratingByDriver = {};
    (ratings.data || []).forEach(r => {
        _ratingByDriver[r.driver_id] = { rating: r.rating, rated: !!r.last_rated_at };
    });
    // Merge each driver's own photo + manufacturer in. The manufacturer is
    // the fallback source for solo drivers (no team to source it from) and
    // for the Manufacturers championship below.
    (driverMfrs.data || []).forEach(r => {
        const e = _ratingByDriver[r.id] || (_ratingByDriver[r.id] = {});
        e.photo = r.photo_url || null;
        const m = r.manufacturers;
        if (m) {
            e.manufacturerId = m.id;
            e.manufacturerName = m.name;
            e.brandColor = m.brand_color;
            e.manufacturerLogoUrl = m.logo_url;
        }
    });

    // Points-deduction penalties → per-driver and per-team, with reasons.
    // Mirrors the results page: a driver-specific penalty hits that driver;
    // a whole-team penalty (no driver_id) hits every driver on the entry.
    // The team always takes the hit via the entry's team.
    _dedByDriver = {};
    _dedByTeam = {};
    const _addDed = (map, key, amount, reason) => {
        if (!key) return;
        const e = map[key] || (map[key] = { amount: 0, reasons: [] });
        e.amount += amount;
        const r = (reason || '').trim();
        if (r && !e.reasons.includes(r)) e.reasons.push(r);
    };
    (deds.data || []).forEach(p => {
        if (!p.points_amount) return;
        _addDed(_dedByTeam, p.entries?.team_id, p.points_amount, p.reason);
        if (p.driver_id) {
            _addDed(_dedByDriver, p.driver_id, p.points_amount, p.reason);
        } else {
            (p.entries?.entry_drivers || []).forEach(ed => _addDed(_dedByDriver, ed.driver_id, p.points_amount, p.reason));
        }
    });

    // Compute previous-round positions. The "current" league is the view
    // we just fetched; the "previous" league is the same minus the most
    // recent event's points. Then rank both and diff.
    _prevDriverRank = computePrevRank(perEvent.data || [], season.id, d.data || []);

    // Per-driver season tiebreak: best classified finishing position (+ a
    // fallback status rank). Lets 0-point drivers who actually finished
    // (e.g. P11/P12, just outside the points) sort above DNF/DNS drivers,
    // instead of everyone on 0 landing in an arbitrary order.
    const STATUS_RANK = { classified: 0, dnf: 1, dsq: 2, withdrawn: 3, dns: 4 };
    const _tie = {};
    (perEvent.data || []).forEach(r => {
        if (r.results?.events?.season_id !== season.id) return;
        const st = r.status || 'classified';
        const t = _tie[r.driver_id] || (_tie[r.driver_id] = { bestFinish: Infinity, bestStatus: 9 });
        if (st === 'classified' && r.finish_position != null) t.bestFinish = Math.min(t.bestFinish, r.finish_position);
        t.bestStatus = Math.min(t.bestStatus, STATUS_RANK[st] ?? 9);
    });
    const tieCompare = (a, b) => {
        const ta = _tie[a.driver_id] || { bestFinish: Infinity, bestStatus: 9 };
        const tb = _tie[b.driver_id] || { bestFinish: Infinity, bestStatus: 9 };
        const aHas = ta.bestFinish !== Infinity, bHas = tb.bestFinish !== Infinity;
        if (aHas !== bHas) return aHas ? -1 : 1;                              // any classified finish beats none
        if (aHas && ta.bestFinish !== tb.bestFinish) return ta.bestFinish - tb.bestFinish; // better finish first
        return ta.bestStatus - tb.bestStatus;                                // else DNF above DSQ above DNS
    };

    _drivers = (d.data || []).sort((a, b) =>
        (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums) || tieCompare(a, b));
    _teams   = (t.data || []).sort((a, b) => (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums));

    // Form guide — each driver's last few rounds (chronological), from the
    // same per-event rows used for movement arrows.
    _formByDriver = {};
    const _evByDriver = {};
    (perEvent.data || []).forEach(r => {
        if (r.results?.events?.season_id !== season.id) return;
        (_evByDriver[r.driver_id] = _evByDriver[r.driver_id] || []).push({
            at: r.results.events.starts_at, pos: r.finish_position, status: r.status,
        });
    });
    Object.keys(_evByDriver).forEach(id => {
        _formByDriver[id] = _evByDriver[id]
            .sort((a, b) => new Date(a.at) - new Date(b.at))
            .slice(-5);
    });

    // Manufacturer championship — sum each driver's points under their
    // manufacturer (the team lock, or the driver's own for solo entries).
    const _mMap = {};
    _drivers.forEach(dr => {
        const info = _ratingByDriver[dr.driver_id] || {};
        const id   = dr.manufacturer_id || info.manufacturerId;
        if (!id) return;
        const m = _mMap[id] || (_mMap[id] = {
            id,
            name:  dr.manufacturer_name     || info.manufacturerName || 'Unknown',
            logo:  dr.manufacturer_logo_url || info.manufacturerLogoUrl,
            color: dr.brand_color           || info.brandColor,
            points: 0, wins: 0, podiums: 0, poles: 0, fl: 0, drivers: 0,
        });
        m.points  += Number(dr.points)       || 0;
        m.wins    += Number(dr.wins)         || 0;
        m.podiums += Number(dr.podiums)      || 0;
        m.poles   += Number(dr.poles)        || 0;
        m.fl      += Number(dr.fastest_laps) || 0;
        m.drivers += 1;
    });
    _manufacturers = Object.values(_mMap).sort((a, b) => (b.points - a.points) || (b.wins - a.wins));

    await buildBattle(perEvent.data || [], deds.data || [], seasonEvents.data || [], myUser);
    render();
}

// ===== Championship Battle chart =====
// Built entirely client-side from data already loaded: per-event points
// (net of that event's deductions, so cumulative ends at the standings
// total) over the season's completed rounds.
let _btEvents = [];          // [{id, round, name}] completed rounds, in order
let _btPts    = {};          // driver_id -> cumulative points array (aligned to _btEvents)
let _btDrivers = [];         // [{id, name, slug, pos, total}] ranked, for search/presets
let _btMyId   = null;        // signed-in user's driver_id, if racing this season

async function buildBattle(perEvent, deds, seasonEvents, myUser) {
    const inSeason = perEvent.filter(r => r.results?.events?.season_id === _season.id);

    // gross points per driver per event
    const gross = {};
    const scored = new Set();
    inSeason.forEach(r => {
        const ev = r.results?.event_id; if (!ev) return;
        scored.add(ev);
        (gross[r.driver_id] = gross[r.driver_id] || {})[ev] =
            (gross[r.driver_id]?.[ev] || 0) + Number(r.points_awarded || 0);
    });

    // deductions per driver per event (driver-specific, or spread across an
    // entry's drivers when the penalty is team-wide) — mirrors the standings.
    const ded = {};
    const addDed = (drv, ev, amt) => { if (!drv || !ev) return; (ded[drv] = ded[drv] || {})[ev] = (ded[drv]?.[ev] || 0) + amt; };
    deds.forEach(p => {
        if (!p.points_amount || !p.event_id) return;
        if (p.driver_id) addDed(p.driver_id, p.event_id, Number(p.points_amount));
        else (p.entries?.entry_drivers || []).forEach(edn => addDed(edn.driver_id, p.event_id, Number(p.points_amount)));
    });

    _btEvents = (seasonEvents || []).filter(e => scored.has(e.id))
        .map(e => ({ id: e.id, round: e.round, name: e.name }));
    if (!_btEvents.length) { document.getElementById('battle').style.display = 'none'; return; }

    _btPts = {};
    _drivers.forEach(d => {
        let running = 0;
        _btPts[d.driver_id] = _btEvents.map(e =>
            (running += (gross[d.driver_id]?.[e.id] || 0) - (ded[d.driver_id]?.[e.id] || 0)));
    });
    _btDrivers = _drivers.map((d, i) => ({ id: d.driver_id, name: d.driver_name, slug: d.driver_slug, pos: i + 1, total: Number(d.points) || 0 }));

    // Signed-in driver → "Compare me"
    _btMyId = null;
    const uid = myUser?.data?.user?.id;
    if (uid) {
        const { data: mine } = await sb.from('drivers').select('id').eq('user_id', uid).maybeSingle();
        if (mine && _btPts[mine.id]) _btMyId = mine.id;
    }

    renderBattle();
}

const BT_PALETTE = ['#ffd166', '#38bdf8', '#34d399', '#c084fc', '#f87171', '#fb923c', '#818cf8', '#f472b6'];
let _btSlots = BT_PALETTE.map(c => ({ color: c, id: null }));
const _btActive = () => _btSlots.filter(s => s.id && _btById(s.id)).map(s => ({ d: _btById(s.id), color: s.color }));
const _btById = id => _btDrivers.find(x => x.id === id);
const _btOn = id => _btSlots.some(s => s.id === id);
function _btAdd(id) { if (_btOn(id)) return true; const slot = _btSlots.find(s => !s.id); if (!slot) return false; slot.id = id; return true; }
function btRemove(id) { const s = _btSlots.find(x => x.id === id); if (s) s.id = null; btRefresh(); }
function btTop() { _btSlots.forEach(s => s.id = null); _btDrivers.slice(0, 8).forEach(d => _btAdd(d.id)); btRefresh(); }
function btMe() { _btSlots.forEach(s => s.id = null); if (_btMyId) _btAdd(_btMyId); _btDrivers.slice(0, 3).forEach(d => _btAdd(d.id)); btRefresh(); }
function btClear() { _btSlots.forEach(s => s.id = null); btRefresh(); }

function renderBattle() {
    const host = document.getElementById('battle');
    const meBtn = _btMyId ? `<button class="bt-preset" onclick="btMe()">Compare me</button>` : '';
    host.innerHTML = `
      <div class="bt-acc collapsed" id="bt-acc">

          <div class="bt-ic">📈</div>
          <div class="bt-titles">
            <div class="bt-title">Championship Battle</div>
            <div class="bt-sub">See how the title fight unfolded — search any driver, or load the top 8.</div>
          </div>
          <svg class="bt-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="bt-body">
          <div class="bt-toolbar">
            <div class="bt-search-wrap">

              <div class="bt-results" id="bt-results"></div>

            ${meBtn}
            <button class="bt-preset" onclick="btClear()">Clear</button>

function btSearch() {

    box.innerHTML = list.map(d => {
        const on = _btOn(d.id);

          <span class="bt-res-pos">P${d.pos}</span>
          <span class="bt-res-name">${esc(d.name)}${me}</span>

function btPick(id) {

document.addEventListener('click', e => {

});

let _btHintTimer;
function btFlash(msg) { const h = document.getElementById('bt-hint'); if (!h) return; h.textContent = msg; h.style.color = '#fca5a5'; clearTimeout(_btHintTimer); _btHintTimer = setTimeout(btHint, 1800); }
function btHint() { const h = document.getElementById('bt-hint'); if (!h) return; const n = _btActive().length; h.style.color = '#5b6472';
    h.textContent = n ? `${n} of 8 lines · search ${_btDrivers.length} drivers or use a preset` : 'Nobody selected — search a driver or hit a preset.'; }
function btSelected() {
    const wrap = document.getElementById('bt-selected'); if (!wrap) return;
    wrap.innerHTML = _btActive().map(a => {
        const me = a.d.id === _btMyId ? '<span class="me">YOU</span>' : '';
        return `<span class="bt-chip"><span class="cdot" style="background:${a.color}"></span>${esc(a.d.name)}${me}<button class="bt-x" onclick="btRemove('${a.d.id}')">✕</button></span>`;
    }).join('');
}

// chart geometry
const BT_W = 760, BT_H = 400, BT_PL = 46, BT_PR = 150, BT_PT = 18, BT_PB = 38;
const _btPW = BT_W - BT_PL - BT_PR, _btPH = BT_H - BT_PT - BT_PB;
const _btNS = 'http://www.w3.org/2000/svg';
const _btEl = (n, a) => { const e = document.createElementNS(_btNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
function _btX(i) { return _btEvents.length <= 1 ? BT_PL : BT_PL + i / (_btEvents.length - 1) * _btPW; }
function _btYMax() { let m = 10; _btActive().forEach(a => { const arr = _btPts[a.d.id] || []; arr.forEach(v => { if (v > m) m = v; }); }); return Math.ceil(m / 50) * 50 || 50; }
function _btY(v, max) { return BT_PT + _btPH - (v / max) * _btPH; }

let _btSvg, _btSeriesG, _btGuide, _btYCache = 200;
function btGrid() {
    _btSvg = document.getElementById('bt-chart'); _btSvg.innerHTML = '';
    _btGridG = _btEl('g', {}); _btSvg.appendChild(_btGridG);
    _btAttachHover();
}
let _btGridG;
function btDrawGrid(max) {
    _btGridG.innerHTML = '';
    for (let v = 0; v <= max; v += Math.max(50, Math.round(max / 4 / 50) * 50)) {
        _btGridG.appendChild(_btEl('line', { class: 'bt-grid', x1: BT_PL, y1: _btY(v, max), x2: BT_PL + _btPW, y2: _btY(v, max) }));
        const t = _btEl('text', { class: 'bt-yax', x: BT_PL - 10, y: _btY(v, max) + 3, 'text-anchor': 'end' }); t.textContent = v; _btGridG.appendChild(t);
    }
    _btEvents.forEach((e, i) => { const t = _btEl('text', { class: 'bt-axis', x: _btX(i), y: BT_H - BT_PB + 20, 'text-anchor': 'middle' }); t.textContent = 'R' + e.round; _btGridG.appendChild(t); });
}
function btDraw() {
    if (_btSeriesG) _btSeriesG.remove();
    const max = _btYMax(); _btYCache = max; btDrawGrid(max);
    _btSeriesG = _btEl('g', {}); _btSvg.appendChild(_btSeriesG);
    const active = _btActive();
    if (!active.length) { const t = _btEl('text', { class: 'bt-empty', x: BT_PL + _btPW / 2, y: BT_PT + _btPH / 2, 'text-anchor': 'middle' }); t.textContent = 'Pick a driver to start comparing.'; _btSeriesG.appendChild(t); return; }
    active.forEach(a => {
        const arr = _btPts[a.d.id] || [];
        const dstr = arr.map((v, i) => `${i ? 'L' : 'M'}${_btX(i)},${_btY(v, max)}`).join(' ');
        _btSeriesG.appendChild(_btEl('path', { class: 'bt-line', d: dstr, stroke: a.color }));
        arr.forEach((v, i) => _btSeriesG.appendChild(_btEl('circle', { class: 'bt-dot', cx: _btX(i), cy: _btY(v, max), r: 3.4, fill: a.color })));
    });
    // End-labels sit just past the last plotted point — which is the right
    // edge in a full season, but hugs R1 early on so labels stay next to the
    // data instead of floating at the far right.
    const lastX = _btX(_btEvents.length - 1);
    const labels = active.map(a => { const arr = _btPts[a.d.id] || []; const last = arr[arr.length - 1] || 0; return { a, last, y: _btY(last, max) }; }).sort((x, y) => x.y - y.y);
    const GAP = 30;
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < GAP) labels[i].y = labels[i - 1].y + GAP;
    labels.forEach(L => {
        const anchorY = _btY(L.last, max), lx = lastX + 12;
        if (Math.abs(L.y - anchorY) > 3) _btSeriesG.appendChild(_btEl('line', { x1: lastX + 4, y1: anchorY, x2: lx - 2, y2: L.y - 4, stroke: L.a.color, 'stroke-width': 1, opacity: 0.4 }));
        const nm = _btEl('text', { class: 'bt-end', x: lx, y: L.y - 4, fill: L.a.color }); nm.textContent = L.a.d.name; _btSeriesG.appendChild(nm);
        const pt = _btEl('text', { class: 'bt-endpts', x: lx, y: L.y + 8 }); pt.textContent = Math.round(L.last) + ' pts'; _btSeriesG.appendChild(pt);
    });
    _btGuide = _btEl('line', { class: 'bt-guide', x1: 0, y1: BT_PT, x2: 0, y2: BT_PT + _btPH, opacity: 0 }); _btSeriesG.appendChild(_btGuide);
}
function _btAttachHover() {
    _btSvg.addEventListener('mousemove', e => {
        const active = _btActive(); if (!active.length || !_btGuide) return;
        const rect = _btSvg.getBoundingClientRect(), sx = (e.clientX - rect.left) / rect.width * BT_W;
        let i = _btEvents.length <= 1 ? 0 : Math.round((sx - BT_PL) / _btPW * (_btEvents.length - 1));
        i = Math.max(0, Math.min(_btEvents.length - 1, i));
        _btGuide.setAttribute('x1', _btX(i)); _btGuide.setAttribute('x2', _btX(i)); _btGuide.setAttribute('opacity', 1);
        const rows = active.map(a => ({ name: a.d.name, color: a.color, v: Math.round((_btPts[a.d.id] || [])[i] || 0) })).sort((x, y) => y.v - x.v);
        const tt = document.getElementById('bt-tt');
        tt.innerHTML = `<div class="bt-tt-round">Round ${_btEvents[i].round}</div>` + rows.map(x => `<div class="bt-tt-row"><span class="bt-tt-dot" style="background:${x.color}"></span><span class="bt-tt-name">${esc(x.name)}</span><span class="bt-tt-val" style="color:${x.color}">${x.v}</span></div>`).join('');
        tt.style.opacity = 1; const px = _btX(i) / BT_W * rect.width; tt.style.left = Math.min(px + 16, rect.width - 168) + 'px'; tt.style.top = '8px';
    });
    _btSvg.addEventListener('mouseleave', () => { const tt = document.getElementById('bt-tt'); if (tt) tt.style.opacity = 0; if (_btGuide) _btGuide.setAttribute('opacity', 0); });
}
function btRefresh() { btSelected(); btHint(); btDraw(); }

// Strip out the latest event's points-contribution per driver, re-rank,
// and return a map of driver_id → previous position (1-based) so we can
// show ▲ / ▼ / – movement arrows.
function computePrevRank(perEvent, seasonId, currentDrivers) {
    const inSeason = perEvent.filter(r => r.results?.events?.season_id === seasonId);
    if (!inSeason.length) return {};
    const lastTs = inSeason
        .map(r => r.results.events.starts_at)
        .filter(Boolean)
        .sort()
        .pop();
    if (!lastTs) return {};

    // Driver → points awarded before the latest event.
    const prev = {};
    currentDrivers.forEach(d => { prev[d.driver_id] = 0; });
    inSeason.forEach(r => {
        if (r.results.events.starts_at === lastTs) return;
        prev[r.driver_id] = (prev[r.driver_id] || 0) + Number(r.points_awarded || 0);
    });

    // Drivers who hadn't scored at all before the last event stay unranked
    // so we can show a "NEW" indicator instead of fake movement.
    const sorted = Object.entries(prev)
        .filter(([, p]) => p > 0)
        .sort((a, b) => b[1] - a[1]);
    const rankMap = {};
    sorted.forEach(([id], i) => { rankMap[id] = i + 1; });
    return rankMap;
}

// Small red "points docked" note with the reason(s), e.g. "−2 · bump drafting".
function deductionHtml(info) {
    if (!info || !info.amount) return '';
    const why = (info.reasons || []).join(', ');
    return `<div class="pts-deduct" title="${esc(why ? why + ' ' : '')}(−${info.amount} pts)">−${info.amount}${why ? ` · ${esc(why)}` : ''}</div>`;
}
