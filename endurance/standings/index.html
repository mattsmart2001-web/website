<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Live championship standings for GTEC, the Gran Turismo 7 endurance championship. Driver and team points, wins, podiums, ELO ratings, updated after every round.">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">

    <link rel="apple-touch-icon" sizes="180x180" href="/endurance/assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Open Graph / Twitter card -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="GTEC">

    <meta property="og:image"       content="https://sparkstheory.co.uk/endurance/assets/og-card.png">
    <meta property="og:url"         content="https://sparkstheory.co.uk/endurance/standings/">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="GTEC Standings">
    <meta name="twitter:description" content="Live driver and team standings for the GTEC endurance championship.">
    <meta name="twitter:image"       content="https://sparkstheory.co.uk/endurance/assets/og-card.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --silver: #cbd5e1;
            --bronze: #cd7f32;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Nav */
        .gtec-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(5,6,8,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .gtec-nav .brand {
            font-family: 'Anton', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            text-indent: 0.32em;
        }
        .gtec-nav .brand .accent { color: var(--gold); }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .gtec-nav .nav-links a {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #111; background: var(--gold); text-decoration: none; padding: 0.5rem 1rem; border-radius: 999px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 2px 10px rgba(255,209,102,0.35); }
        .gtec-nav .apply:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,209,102,0.5); }
        .gtec-nav .back {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: color 0.2s, border-color 0.2s;
        }
        .gtec-nav .back:hover {
            color: var(--text);
            border-color: rgba(255,255,255,0.25);
        }

        /* Hero */
        .hero {
            padding: 3rem 2rem 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .hero-eyebrow {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.75rem;
            text-indent: 0.45em;
        }
        .hero-title {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .hero-sub { color: var(--muted); font-size: 0.88rem; }

        /* Tabs */
        .tab-bar {
            display: flex;
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 0.9rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

        /* Content */
        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
        }

        /* Force every link in the standings to inherit the row's colour,
           overriding the browser's :visited purple. */
        .standings a,
        .standings a:link,
        .standings a:visited,
        .standings a:active { color: inherit; text-decoration: none; }
        .standings a:hover { text-decoration: underline; }

        /* Live-battle flag — a quiet inline cue next to the points-gap
           number when this row could still catch the row above it,
           rather than a separate section competing with the table. */
        .battle-flag {
            display: inline-block;
            margin-left: 0.3rem;
            font-size: 0.72rem;
            cursor: help;
        }

        /* Standings table */
        .standings {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            /* Scroll the wide driver table inside the card instead of clipping
               its last column; keeps the rounded corners tidy on both axes. */
            overflow-x: auto;
            overflow-y: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            padding: 0.85rem 0.7rem;
            text-align: left;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        /* A touch more breathing room on the first (rank) and driver cells. */
        thead th:first-child, tbody td:first-child { padding-left: 1.1rem; }
        thead th.right { text-align: right; }
        thead th.center { text-align: center; }

        tbody td {
            padding: 0.95rem 0.7rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            position: relative;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.right { text-align: right; }
        td.center { text-align: center; }
        td.muted { color: var(--muted); font-size: 0.85rem; }

        /* Subtle gradient sweep on every row — adds depth without shouting. */
        tbody tr td {
            background-image: linear-gradient(90deg, rgba(255,255,255,0.012) 0%, rgba(255,255,255,0) 60%);
        }

        /* Podium rows get a metallic-tinted gradient + left accent stripe.
           Box-shadow inset on the first cell paints the stripe without
           breaking the row's flexible width. */
        tbody tr.rank-1 td {
            background-image: linear-gradient(90deg, rgba(255,209,102,0.16) 0%, rgba(255,209,102,0.05) 55%, rgba(255,255,255,0) 100%);
        }
        tbody tr.rank-1 td:first-child {
            /* 6px gold stripe + a soft inner glow so P1 sits "on top" of
               the table. */
            box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18);
        }
        tbody tr.rank-1 td { box-shadow: inset 0 0 0 0 transparent, 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1 td:first-child { box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18), 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1:hover td { background-color: rgba(255,209,102,0.07); }

        tbody tr.rank-2 td { background-image: linear-gradient(90deg, rgba(199,201,201,0.08) 0%, rgba(199,201,201,0.02) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-2 td:first-child { box-shadow: inset 4px 0 0 0 var(--silver); }
        tbody tr.rank-2:hover td { background-color: rgba(199,201,201,0.035); }

        tbody tr.rank-3 td { background-image: linear-gradient(90deg, rgba(205,127,50,0.09) 0%, rgba(205,127,50,0.025) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-3 td:first-child { box-shadow: inset 4px 0 0 0 var(--bronze); }
        tbody tr.rank-3:hover td { background-color: rgba(205,127,50,0.035); }

        /* "Lighter" stats — small numeric columns get less visual weight
           so the driver / team name + points are the loudest cells, but
           still big and bright enough to read at a glance. */
        td.lighter { color: rgba(203,213,225,0.85); font-size: 1.05rem; font-weight: 600; }

        /* Leader pip + gap below the points number. */
        .leader-pip {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem; font-weight: 700; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--gold);
        }
        .points-gap {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            color: rgba(148,163,184,0.85);
        }
        .pts-deduct {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
            color: #f87171; text-transform: uppercase;
        }
        .pts-bonus {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
            color: #4ade80; text-transform: uppercase;
        }

        /* "★ Leader" badge inline with the name. */
        .leader-tag {
            display: inline-block;
            margin-left: 0.55rem;
            padding: 0.12rem 0.55rem;
            background: rgba(255,209,102,0.18);
            border: 1px solid rgba(255,209,102,0.45);
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            vertical-align: middle;
        }

        /* Position cell stacks number + movement chip vertically. */
        .pos-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; }
        .move {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
            padding: 0.08rem 0.4rem; border-radius: 4px;
        }
        .move-up   { background: rgba(34,197,94,0.15);  color: #4ade80; }
        .move-down { background: rgba(239,68,68,0.15);  color: #f87171; }
        .move-flat { background: rgba(148,163,184,0.12); color: #94a3b8; }
        .move-new  { background: rgba(255,209,102,0.15); color: var(--gold); }

        /* Driver / team name — slightly larger across the board now. */
        .name { font-size: 1rem; }
        .driver-row .name { font-size: 1.08rem; }

        /* Elo cell on drivers tab. */
        .elo-cell { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
        .elo-num { font-family: 'Anton', sans-serif; font-size: 1rem; color: var(--gold); letter-spacing: 0.02em; line-height: 1; }
        .elo-cell .elo-tier { margin-left: 0 !important; }

        /* Manufacturer badge — bumped up so it's recognisable, not a dot. */
        .meta-line img { width: 20px !important; height: 20px !important; }

        /* Position cell */
        .pos {
            font-family: 'Anton', sans-serif;
            font-size: 1.2rem;
            width: 50px;
            color: var(--muted);
        }
        .pos.p1 { color: var(--gold); }
        .pos.p2 { color: var(--silver); }
        .pos.p3 { color: var(--bronze); }

        /* Name + meta */
        .name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.92rem;
        }
        .driver-row .name { font-family: 'Anton', sans-serif; font-size: 1rem; letter-spacing: 0.03em; }
        .meta-line {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        /* Keep team name + manufacturer as one flowing text run so the
           manufacturer sits right after the team rather than floating right. */
        .meta-line .meta-team { min-width: 0; }
        .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .mfr-logo {
            display: inline-block;
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
            vertical-align: middle;
        }
        .career-num {
            display: inline-block;
            background: rgba(255,209,102,0.12);
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.1rem 0.45rem;
            border-radius: 3px;
            margin-right: 0.45rem;
        }
        .driver-flag { font-size: 1.05em; line-height: 1; vertical-align: baseline; }

        /* Row cell with avatar to the left of name + meta */
        .driver-cell { display: flex; align-items: center; gap: 0.6rem; }
        .driver-cell-text { min-width: 0; }
        .std-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            object-fit: cover; flex-shrink: 0; background: var(--bg-2);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .std-avatar-init { font-family: 'Anton', sans-serif; font-size: 0.95rem; color: var(--muted); opacity: 0.7; }
        .mfr-badge-lg { display: inline-flex; align-items: center; justify-content: center; width: 34px; flex-shrink: 0; }
        .mfr-badge-lg .mfr-logo { width: 26px; height: 26px; object-fit: contain; }
        .nat-flag { font-size: 1.7rem; line-height: 1; width: 34px; text-align: center; flex-shrink: 0; }
        .nat-note { color: var(--muted); font-size: 0.8rem; padding: 0.9rem 1.25rem 0; }
        /* Manufacturer drill-in */
        tr.mfr-row { cursor: pointer; }
        tr.mfr-row:hover td { background: rgba(255,255,255,0.03); }
        .mfr-go { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 0.06em; color: var(--gold); opacity: 0; transition: opacity 0.15s ease; margin-left: 0.4rem; }
        tr.mfr-row:hover .mfr-go { opacity: 0.85; }
        .mfr-detail-head { padding: 0.2rem 0 1.1rem; }
        .mfr-back { background: none; border: none; color: var(--muted); font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; padding: 0.3rem 0; transition: color 0.15s ease; }
        .mfr-back:hover { color: var(--gold); }
        .mfr-title { display: flex; align-items: center; gap: 0.9rem; margin-top: 0.7rem; }
        .mfr-title .mfr-name { font-family: 'Anton', sans-serif; font-size: 1.7rem; line-height: 1; letter-spacing: 0.01em; }
        .mfr-title .mfr-totals { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; }
        th.mfr-sort { cursor: pointer; user-select: none; white-space: nowrap; }
        th.mfr-sort:hover { color: var(--gold); }
        .sort-arr { color: var(--gold); margin-left: 0.15em; font-size: 0.8em; }
        td.pos-num { font-family: 'Orbitron', sans-serif; color: var(--muted); text-align: center; font-size: 0.85rem; }
        tr.nat-hi td { animation: natHi 1.8s ease; }
        @keyframes natHi { 0%,30% { background: rgba(255,209,102,0.16); } 100% { background: transparent; } }
        /* World map (Nations tab, collapsible) */
        .wm-shell { position: relative; }
        .gtec-worldmap { width: 100%; height: auto; display: block; }
        .wm-countries path { fill: #171d29; stroke: #0a0e14; stroke-width: 0.4; vector-effect: non-scaling-stroke; }
        .wm-countries path.wm-data { cursor: pointer; transition: fill 0.15s ease, filter 0.15s ease; }
        .wm-countries path.wm-data:hover { filter: brightness(1.25); }
        .wm-tt { position: absolute; z-index: 12; pointer-events: none; display: none; background: var(--bg-2); border: 1px solid var(--border); border-radius: 9px; padding: 0.5rem 0.7rem; box-shadow: 0 10px 30px rgba(0,0,0,0.55); font-size: 0.8rem; min-width: 150px; }
        .wm-tt .wm-tt-h { display: flex; align-items: center; gap: 0.45rem; font-weight: 700; color: var(--text); }
        .wm-tt .wm-tt-flag { font-size: 1.1rem; }
        .wm-tt .wm-tt-r { display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); margin-top: 0.25rem; }
        .wm-tt .wm-tt-r b { color: var(--gold); font-family: 'Orbitron', sans-serif; }
        .wm-legend { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.9rem; font-size: 0.72rem; color: var(--muted); }
        .wm-legend .wm-sw { display: inline-block; width: 22px; height: 12px; border-radius: 3px; }
        .wm-legend .wm-lg-lo { letter-spacing: 0.02em; }
        .wm-toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
        .wm-tb-lbl { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-right: 0.15rem; }
        .wm-loading { padding: 2rem; text-align: center; color: var(--muted); font-size: 0.85rem; }

        /* Recent-form pills */
        .form-strip { display: inline-flex; gap: 3px; }
        .form-pill {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 24px; padding: 2px 5px; border-radius: 4px;
            font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700;
            background: rgba(255,255,255,0.06); color: var(--muted);
        }
        .form-pill.form-win    { background: rgba(255,209,102,0.18); color: var(--gold); }
        .form-pill.form-podium { background: rgba(148,163,184,0.20); color: #e2e8f0; }
        .form-pill.form-dnf    { background: rgba(248,113,113,0.15); color: #f87171; }
        .form-empty { color: var(--muted); opacity: 0.5; }

        /* Top-3 rostrum */
        .podium { position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 0.75rem; margin: 0.25rem 0 1.75rem; }
        .podium::after { content: ''; position: absolute; left: 8%; right: 8%; bottom: 0; height: 34px; background: radial-gradient(ellipse at center, rgba(255,209,102,0.10), transparent 72%); filter: blur(3px); pointer-events: none; z-index: 0; }
        .podium-spot { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 32%; max-width: 190px; }
        .podium-driver { text-decoration: none; color: var(--text); text-align: center; display: block; margin-bottom: 0.55rem; transition: transform 0.15s; }
        .podium-driver:hover { transform: translateY(-3px); }
        .pod-av-wrap { position: relative; display: flex; justify-content: center; margin-bottom: 0.5rem; }
        .pod-av { position: relative; z-index: 1; border-radius: 50%; object-fit: cover; background: var(--bg-2); display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--border); }
        /* Soft gold halo behind the leader's photo. */
        .pod-halo { display: none; }
        .spot-1 .pod-halo { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 150%; height: 150%; border-radius: 50%; background: radial-gradient(circle, rgba(255,209,102,0.30), transparent 62%); filter: blur(7px); z-index: 0; pointer-events: none; }
        .pod-crown { position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: 1.15rem; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.55)); }
        /* Tiered rings: gold / silver / bronze, each with a matching glow. */
        .spot-1 .pod-av { border-color: rgba(255,209,102,0.9); box-shadow: 0 0 0 3px rgba(255,209,102,0.14), 0 6px 20px rgba(0,0,0,0.5); }
        .spot-2 .pod-av { border-color: rgba(226,232,240,0.85); box-shadow: 0 0 0 3px rgba(226,232,240,0.10), 0 6px 16px rgba(0,0,0,0.5); }
        .spot-3 .pod-av { border-color: rgba(224,165,110,0.85); box-shadow: 0 0 0 3px rgba(224,165,110,0.10), 0 6px 16px rgba(0,0,0,0.5); }
        .podium-gap { font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.08em; margin-top: 0.35rem; display: inline-block; padding: 0.14rem 0.55rem; border-radius: 999px; color: var(--muted); background: rgba(255,255,255,0.05); border: 1px solid var(--border); }

        /* Classy staggered reveal: plinths rise from the floor, drivers fade in. */

        #bt-chart { display: block; width: 100%; height: auto; overflow: visible; }

<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data.session) { if (portal) portal.style.display = ''; }
    else              { if (signin) signin.style.display = ''; }
});

let _drivers = [];
let _teams   = [];
let _nations = [];   // aggregated by driver nationality (avg points per driver)
let _nationsNoCountry = 0; // drivers with no nationality set (shown as a footnote)
let _wmSvg = null;   // cached world SVG text (fetched once, lazily)
let _wmOpen = false; // world-map accordion open state (persisted)
let _wmMetric = 'avg'; // 'avg' | 'total' | 'drivers' — what the map shades by
try { _wmOpen = localStorage.getItem('gtec_nations_map') === '1'; } catch (e) {}
try { const m = localStorage.getItem('gtec_nations_metric'); if (m) _wmMetric = m; } catch (e) {}
let _ratings = null; // loaded lazily
let _season  = null;
let _tab     = 'drivers';
let _mfrDetail = null;                       // manufacturer id being drilled into (null = overview)
let _mfrSort   = { key: 'points', dir: -1 }; // sort for the manufacturer driver board
let _natDetail = null;                       // nation code being drilled into (null = overview)
let _natSort   = { key: 'points', dir: -1 }; // sort for the nation driver board
let _ceiling  = null; // max points still available across all remaining rounds (Split-1 ceiling), for Live Battles
let _remaining = 0;

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Flag emoji from any 2-letter ISO country code (regional indicators).
function flag(c) {
    const cc = (c || '').trim().toUpperCase();
    if (!/^[A-Z]{2}$/.test(cc)) return '';
    return String.fromCodePoint(...[...cc].map(ch => 127397 + ch.charCodeAt(0)));
}

function posCls(p) {
    if (p === 1) return 'pos p1';
    if (p === 2) return 'pos p2';
    if (p === 3) return 'pos p3';
    return 'pos';
}
function rankCls(p) {
    if (p === 1) return 'rank-1';
    if (p === 2) return 'rank-2';
    if (p === 3) return 'rank-3';
    return '';
}

// Render the small movement chip next to the position. Returns ▲N green,
// ▼N red, – grey, or "NEW" gold for drivers who weren't ranked before
// the most recent event.
function movementHTML(currentPos, prevPos) {
    if (prevPos == null) return `<span class="move move-new">NEW</span>`;
    const delta = prevPos - currentPos;  // positive = moved up
    if (delta > 0)  return `<span class="move move-up">▲${delta}</span>`;
    if (delta < 0)  return `<span class="move move-down">▼${-delta}</span>`;
    return `<span class="move move-flat">–</span>`;
}

// Manufacturer logo (preferred) or coloured swatch fallback
function mfrBadge(logoUrl, brandColor, name) {
    if (logoUrl) return `<img class="mfr-logo" src="${esc(logoUrl)}" alt="${esc(name || '')}" loading="lazy">`;
    if (brandColor) return `<span class="swatch" style="background:${esc(brandColor)}"></span>`;
    return '';
}

// Small round driver avatar (photo, else initial).
function driverAvatar(photo, name) {
    if (photo) return `<img class="std-avatar" src="${esc(photo)}" alt="" loading="lazy">`;
    const init = (name || '?').trim().charAt(0).toUpperCase();
    return `<span class="std-avatar std-avatar-init">${esc(init)}</span>`;
}

// Recent-form strip: last few rounds as compact, colour-coded pills.
function formStrip(form) {
    if (!form || !form.length) return '<span class="form-empty">—</span>';
    return `<span class="form-strip">` + form.map(f => {
        const st = f.status || 'classified';
        let cls = 'form-pill', label, title;
        if (st !== 'classified') {
            cls += ' form-dnf';
            label = st === 'dnf' ? 'DNF' : st === 'dsq' ? 'DSQ' : st === 'dns' ? 'DNS' : st === 'withdrawn' ? 'WD' : '—';
            title = label;
        } else if (f.pos === 1) {
            cls += ' form-win'; label = 'P1'; title = 'Win';
        } else if (f.pos != null && f.pos <= 3) {
            cls += ' form-podium'; label = 'P' + f.pos; title = 'Podium';
        } else {
            label = f.pos != null ? 'P' + f.pos : '—'; title = label;
        }
        return `<span class="${cls}" title="${esc(title)}">${label}</span>`;
    }).join('') + `</span>`;
}

// Top-3 rostrum above the driver standings — P2 · P1 · P3, tallest in the
// middle. Only shown once there's a genuine top three.
function podiumSpot(d, place, leaderPts) {
    if (!d) return '';
    const info = _ratingByDriver[d.driver_id] || {};
    const pts  = Number(d.points) || 0;
    const av = info.photo
        ? `<img class="pod-av" src="${esc(info.photo)}" alt="" loading="lazy">`
        : `<span class="pod-av pod-av-init">${esc((d.driver_name || '?').trim().charAt(0).toUpperCase())}</span>`;
    const flg = d.nationality ? `<span class="driver-flag">${flag(d.nationality)}</span> ` : '';
    const crown = place === 1 ? '<div class="pod-crown">👑</div>' : '';
    const gapNum = leaderPts - pts;
    const gap = place === 1
        ? '<div class="podium-gap leader">★ Leader</div>'
        : `<div class="podium-gap">−${gapNum.toFixed(gapNum % 1 === 0 ? 0 : 1)}</div>`;
    return `<div class="podium-spot spot-${place}">
        <a class="podium-driver" href="/endurance/drivers/?slug=${esc(d.driver_slug)}">
            <div class="pod-av-wrap">${crown}<span class="pod-halo"></span>${av}</div>
            <div class="podium-name">${flg}${esc(d.driver_name)}</div>
            <div class="podium-pts"><span class="pod-pts-num" data-pts="${pts}">${pts.toFixed(pts % 1 === 0 ? 0 : 1)}</span> pts</div>
            ${gap}
        </a>
        <div class="podium-step step-${place}"><span class="podium-rank">${place}</span></div>
    </div>`;
}
function renderPodium(list) {
    if (!list || list.length < 3) return '';
    const [p1, p2, p3] = list;
    const leaderPts = Number(p1.points) || 0;
    return `<div class="podium">${podiumSpot(p2, 2, leaderPts)}${podiumSpot(p1, 1, leaderPts)}${podiumSpot(p3, 3, leaderPts)}</div>`;
}

// Count the podium points up on render (skipped when reduced motion is on).
function animatePodium() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.pod-pts-num[data-pts]').forEach(el => {
        const target = Number(el.dataset.pts) || 0;
        const dec = target % 1 === 0 ? 0 : 1;
        const dur = 850, start = performance.now();
        const tick = now => {
            const t = Math.min(1, (now - start) / dur);
            el.textContent = (target * (1 - Math.pow(1 - t, 3))).toFixed(dec);
            if (t < 1) requestAnimationFrame(tick); else el.textContent = target.toFixed(dec);
        };
        requestAnimationFrame(tick);
    });
}

// Constructors rostrum — same design as the drivers podium, but the avatar
// is the team's manufacturer logo (or a monogram) rather than a photo.
function teamPodiumSpot(t, place, leaderPts) {
    if (!t) return '';
    const pts = Number(t.points) || 0;
    const av = t.manufacturer_logo_url
        ? `<img class="pod-av pod-av-logo" src="${esc(t.manufacturer_logo_url)}" alt="" loading="lazy">`
        : `<span class="pod-av pod-av-init">${esc((t.team_name || '?').trim().charAt(0).toUpperCase())}</span>`;
    const crown = place === 1 ? '<div class="pod-crown">👑</div>' : '';
    const gapNum = leaderPts - pts;
    const gap = place === 1
        ? '<div class="podium-gap leader">★ Leader</div>'
        : `<div class="podium-gap">−${gapNum.toFixed(gapNum % 1 === 0 ? 0 : 1)}</div>`;
    const sub = t.manufacturer_name ? `<div class="podium-sub">${esc(t.manufacturer_name)}</div>` : '';
    return `<div class="podium-spot spot-${place}">
        <a class="podium-driver" href="/endurance/teams/?slug=${esc(t.team_slug)}">
            <div class="pod-av-wrap">${crown}<span class="pod-halo"></span>${av}</div>
            <div class="podium-name">${esc(t.team_name)}</div>
            ${sub}
            <div class="podium-pts"><span class="pod-pts-num" data-pts="${pts}">${pts.toFixed(pts % 1 === 0 ? 0 : 1)}</span> pts</div>
            ${gap}
        </a>
        <div class="podium-step step-${place}"><span class="podium-rank">${place}</span></div>
    </div>`;
}
function renderTeamPodium(list) {
    if (!list || list.length < 3) return '';
    const [p1, p2, p3] = list;
    const leaderPts = Number(p1.points) || 0;
    return `<div class="podium">${teamPodiumSpot(p2, 2, leaderPts)}${teamPodiumSpot(p1, 1, leaderPts)}${teamPodiumSpot(p3, 3, leaderPts)}</div>`;
}

async function setTab(t) {
    _tab = t;
    // Switching tabs always returns the Manufacturers view to its overview
    // (rather than a previously drilled-in manufacturer), and clears the
    // deep-link param so the URL matches what's shown.
    if (_mfrDetail || _natDetail) {
        _mfrDetail = null;
        _natDetail = null;
        try { const url = new URL(location.href); url.searchParams.delete('mfr'); url.searchParams.delete('nat'); history.replaceState(null, '', url); } catch (e) {}
    }
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    // The battle chart runs on the Drivers, Teams, Manufacturers and Ratings
    // tabs, switching which contest it plots (points, or ELO on Ratings).
    const battle = document.getElementById('battle');
    const showBattle = (t === 'drivers' || t === 'teams' || t === 'manufacturers' || t === 'ratings') && _btLastIdx >= 0;
    if (battle) battle.style.display = showBattle ? '' : 'none';
    if (showBattle && document.getElementById('bt-acc') && _btMode !== t) btSetMode(t);
    if (t === 'ratings' && _ratings === null) {
        await loadRatings();
    } else {
        render();
    }
}

function render() {
    const panel = document.getElementById('panel');
    if (_tab === 'drivers')  renderDrivers(panel);
    else if (_tab === 'form') renderForm(panel);
    else if (_tab === 'teams') renderTeams(panel);
    else if (_tab === 'manufacturers') renderManufacturers(panel);
    else if (_tab === 'nations') renderNations(panel);
    else renderRatings(panel);
}

async function loadRatings() {
    const panel = document.getElementById('panel');
    panel.innerHTML = '<div class="loading">Loading ratings…</div>';
    const { data, error } = await sb.from('driver_current_ratings')
        .select('*')
        .not('last_rated_at', 'is', null)
        .order('rating', { ascending: false });
    if (error) { panel.innerHTML = `<div class="state-msg"><p>${esc(error.message)}</p></div>`; return; }
    _ratings = data || [];
    renderRatings(panel);
}

// Live-battle flag — a quiet inline cue instead of a separate section.
// Returns a small icon for the gap cell when THIS row could still catch
// the row directly above it (their ceiling reaches or passes the row
// above's current points); empty string when that gap is already
// mathematically settled, or for the leader row (nothing above to chase).
function battleFlag(rowPoints, aboveRow) {
    if (_ceiling == null || !aboveRow) return '';
    const abovePoints = Number(aboveRow.points) || 0;
    if (rowPoints + _ceiling < abovePoints) return '';
    const gap = abovePoints - rowPoints;
    const title = `Still catchable — ${gap.toFixed(gap % 1 === 0 ? 0 : 1)} pt${gap === 1 ? '' : 's'} back, ${_remaining} round${_remaining === 1 ? '' : 's'} left`;
    return `<span class="battle-flag" title="${esc(title)}">🔥</span>`;
}

function _driverRowsFor(predicate) {
    return _drivers.filter(predicate).map(d => {
        const r = _ratingByDriver[d.driver_id] || {};
        return {
            driver_id: d.driver_id, name: d.driver_name, slug: d.driver_slug,
            nationality: d.nationality, career_number: d.career_number,
            team_name: d.team_name, team_slug: d.team_slug, photo: r.photo,
            points: Number(d.points) || 0,
            elo: r.rating != null ? Number(r.rating) : null, rated: !!r.rated,
            wins: Number(d.wins) || 0, podiums: Number(d.podiums) || 0,
            poles: Number(d.poles) || 0, fl: Number(d.fastest_laps) || 0,
            races: Number(d.races) || 0,
        };
    });
}

function _driverBoardTable(list, sort, sortFn) {
    const { key, dir } = sort;
    const val = (o) => key === 'name' ? (o.name || '').toLowerCase()
        : key === 'elo' ? (o.elo == null ? -Infinity : o.elo) : (o[key] ?? 0);
    list.sort((a, b) => {
        const av = val(a), bv = val(b);
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return (b.points - a.points) || (a.name || '').localeCompare(b.name || '');
    });
    const arrow = k => key === k ? `<span class="sort-arr">${dir < 0 ? '▾' : '▴'}</span>` : '';
    const th = (k, label, cls) => `<th class="${cls || ''} mfr-sort" onclick="${sortFn}('${k}')">${label}${arrow(k)}</th>`;
    const rows = list.map((d, i) => {
        const num = d.career_number ? `<span class="career-num">#${d.career_number}</span>` : '';
        const teamLine = d.team_name
            ? `<div class="meta-line">${d.team_slug ? `<a href="/endurance/teams/?slug=${esc(d.team_slug)}" style="color:inherit;text-decoration:none">${esc(d.team_name)}</a>` : esc(d.team_name)}</div>`
            : `<div class="meta-line"><em style="opacity:0.75">Solo</em></div>`;
        const eloHTML = d.elo != null
            ? `<span class="elo-num">${Math.round(d.elo)}</span>${window.eloTierBadge ? window.eloTierBadge(d.elo, { provisional: !d.rated }) : ''}`
            : '<span class="lighter">—</span>';
        return `<tr class="driver-row">
            <td class="pos-num">${i + 1}</td>
            <td>
                <div class="driver-cell">
                    ${driverAvatar(d.photo, d.name)}
                    <div class="driver-cell-text">
                        <div class="name">${num}${d.nationality ? `<span class="driver-flag" title="${esc(d.nationality)}">${flag(d.nationality)}</span> ` : ''}<a href="/endurance/drivers/?slug=${esc(d.slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(d.name)}</a></div>
                        ${teamLine}
                    </div>
                </div>
            </td>
            <td class="center hide-mob"><div class="elo-cell">${eloHTML}</div></td>
            <td class="lighter center hide-mob">${d.races}</td>
            <td class="lighter center hide-mob">${d.wins}</td>
            <td class="lighter center hide-mob">${d.podiums}</td>
            <td class="lighter center hide-mob">${d.poles}</td>
            <td class="lighter center hide-mob">${d.fl}</td>
            <td class="right"><div class="points">${d.points.toFixed(d.points % 1 === 0 ? 0 : 1)}</div></td>
        </tr>`;
    }).join('');
    return `
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:52px">#</th>
                    ${th('name', 'Driver')}
                    ${th('elo', 'ELO', 'center hide-mob')}
                    ${th('races', 'Rac', 'center hide-mob')}
                    ${th('wins', 'Wins', 'center hide-mob')}
                    ${th('podiums', 'Pod', 'center hide-mob')}
                    ${th('poles', 'Pole', 'center hide-mob')}
                    ${th('fl', 'FL', 'center hide-mob')}
                    ${th('points', 'Points', 'right')}
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

const WM_RAMP = ['#4a3d1a', '#7a6320', '#a8842a', '#d8ab38', '#ffd166']; // low → high avg

function mapToggle() {
    const a = document.getElementById('map-acc');
    if (!a) return;
    a.classList.toggle('collapsed');
    _wmOpen = !a.classList.contains('collapsed');
    try { localStorage.setItem('gtec_nations_map', _wmOpen ? '1' : '0'); } catch (e) {}
    if (_wmOpen) mapEnsureLoaded();
}

async function mapEnsureLoaded() {
    const host = document.getElementById('wm-host');
    if (!host) return;
    if (_wmSvg === null) {
        try {
            const r = await fetch('/endurance/assets/world-110m.svg');
            _wmSvg = await r.text();
        } catch (e) {
            host.innerHTML = '<div class="wm-loading">Map unavailable.</div>';
            return;
        }
    }
    // Inject once per render (host is rebuilt each renderNations).
    if (!host.querySelector('svg')) {
        host.innerHTML = _wmSvg;

}

function wmMetricVal(nat) {
    return _wmMetric === 'total' ? nat.points : _wmMetric === 'drivers' ? nat.drivers : nat.avg;
}
function wmMetricLabel() {
    return _wmMetric === 'total' ? 'Total points' : _wmMetric === 'drivers' ? 'Drivers' : 'Avg points / driver';
}

function applyMapColors() {
    const svg = document.querySelector('#wm-host svg');
    if (!svg) return;
    const n = _nations.length;
    // Rank countries by the selected metric so the shading always shows
    // contrast (even when values are bunched); brightest = highest.
    const rankByCode = {};
    [..._nations].sort((a, b) => wmMetricVal(b) - wmMetricVal(a))
        .forEach((nat, i) => { rankByCode[nat.code] = i; });

    svg.querySelectorAll('path').forEach(p => {
        const rank = rankByCode[p.id];
        if (rank === undefined) { p.classList.remove('wm-data'); p.style.fill = ''; return; }
        const tier = n <= 1 ? WM_RAMP.length - 1
            : Math.round((1 - rank / (n - 1)) * (WM_RAMP.length - 1));
        p.style.fill = WM_RAMP[tier];
        p.classList.add('wm-data');
        p.addEventListener('mousemove', wmMove);
        p.addEventListener('mouseleave', wmLeave);
        p.addEventListener('click', () => wmClick(p.id));
    });

    const lg = document.getElementById('wm-legend');
    if (lg) {
        lg.innerHTML =
            `<span class="wm-lg-lo">${wmMetricLabel()}:</span> <span>lower</span>` +
            WM_RAMP.map(c => `<span class="wm-sw" style="background:${c}"></span>`).join('') +
            `<span>higher</span>` +
            `<span style="margin-left:0.6rem"><span class="wm-sw" style="background:#171d29;border:1px solid var(--border)"></span> no entrants</span>`;
    }
}

function mapSetMetric(m) {

    document.querySelectorAll('.wm-toolbar .bt-preset').forEach(b => {
        b.classList.toggle('gold', b.getAttribute('onclick') === `mapSetMetric('${m}')`);

function wmMove(e) {
    const tt = document.getElementById('wm-tt');

    const fmt = v => (Number(v) % 1 === 0 ? Number(v).toFixed(0) : Number(v).toFixed(1));
    tt.innerHTML =
        `<div class="wm-tt-h"><span class="wm-tt-flag">${rec.flag || ''}</span>${esc(rec.name)}</div>

         ${rec.topName ? `<div class="wm-tt-r"><span>Top</span><span>${esc(rec.topName)}</span></div>` : ''}`;
