<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Live championship standings for GTEC, the Gran Turismo 7 endurance championship. Driver and team points, wins, podiums, ELO ratings, updated after every round.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://sparkstheory.co.uk/endurance/standings/">
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="manifest" href="/endurance/assets/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/endurance/assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTEC">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Open Graph / Twitter card -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="GTEC">
    <meta property="og:title"       content="GTEC Standings">
    <meta property="og:description" content="Live driver and team standings for the GTEC endurance championship.">
    <meta property="og:image"       content="https://sparkstheory.co.uk/endurance/assets/og-card.png">
    <meta property="og:url"         content="https://sparkstheory.co.uk/endurance/standings/">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="GTEC Standings">
    <meta name="twitter:description" content="Live driver and team standings for the GTEC endurance championship.">
    <meta name="twitter:image"       content="https://sparkstheory.co.uk/endurance/assets/og-card.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --silver: #cbd5e1;
            --bronze: #cd7f32;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Nav */
        .gtec-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(5,6,8,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .gtec-nav .brand {
            font-family: 'Anton', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            text-indent: 0.32em;
        }
        .gtec-nav .brand .accent { color: var(--gold); }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .gtec-nav .nav-links a {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #111; background: var(--gold); text-decoration: none; padding: 0.5rem 1rem; border-radius: 999px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 2px 10px rgba(255,209,102,0.35); }
        .gtec-nav .apply:hover { transform: scale(1.04); box-shadow: 0 4px 18px rgba(255,209,102,0.5); }
        .gtec-nav .back {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: color 0.2s, border-color 0.2s;
        }
        .gtec-nav .back:hover {
            color: var(--text);
            border-color: rgba(255,255,255,0.25);
        }

        /* Hero */
        .hero {
            padding: 3rem 2rem 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .hero-eyebrow {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.75rem;
            text-indent: 0.45em;
        }
        .hero-title {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .hero-sub { color: var(--muted); font-size: 0.88rem; }

        /* Tabs */
        .tab-bar {
            display: flex;
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 0.9rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

        /* Content */
        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
        }

        /* Force every link in the standings to inherit the row's colour,
           overriding the browser's :visited purple. */
        .standings a,
        .standings a:link,
        .standings a:visited,
        .standings a:active { color: inherit; text-decoration: none; }
        .standings a:hover { text-decoration: underline; }

        /* Live-battle flag — a quiet inline cue next to the points-gap
           number when this row could still catch the row above it,
           rather than a separate section competing with the table. */
        .battle-flag {
            display: inline-block;
            margin-left: 0.3rem;
            font-size: 0.72rem;
            cursor: help;
        }

        /* Standings table */
        .standings {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            padding: 0.85rem 1.25rem;
            text-align: left;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        thead th.right { text-align: right; }
        thead th.center { text-align: center; }

        tbody td {
            padding: 0.95rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            position: relative;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.right { text-align: right; }
        td.center { text-align: center; }
        td.muted { color: var(--muted); font-size: 0.85rem; }

        /* Subtle gradient sweep on every row — adds depth without shouting. */
        tbody tr td {
            background-image: linear-gradient(90deg, rgba(255,255,255,0.012) 0%, rgba(255,255,255,0) 60%);
        }

        /* Podium rows get a metallic-tinted gradient + left accent stripe.
           Box-shadow inset on the first cell paints the stripe without
           breaking the row's flexible width. */
        tbody tr.rank-1 td {
            background-image: linear-gradient(90deg, rgba(255,209,102,0.16) 0%, rgba(255,209,102,0.05) 55%, rgba(255,255,255,0) 100%);
        }
        tbody tr.rank-1 td:first-child {
            /* 6px gold stripe + a soft inner glow so P1 sits "on top" of
               the table. */
            box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18);
        }
        tbody tr.rank-1 td { box-shadow: inset 0 0 0 0 transparent, 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1 td:first-child { box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18), 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1:hover td { background-color: rgba(255,209,102,0.07); }

        tbody tr.rank-2 td { background-image: linear-gradient(90deg, rgba(199,201,201,0.08) 0%, rgba(199,201,201,0.02) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-2 td:first-child { box-shadow: inset 4px 0 0 0 var(--silver); }
        tbody tr.rank-2:hover td { background-color: rgba(199,201,201,0.035); }

        tbody tr.rank-3 td { background-image: linear-gradient(90deg, rgba(205,127,50,0.09) 0%, rgba(205,127,50,0.025) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-3 td:first-child { box-shadow: inset 4px 0 0 0 var(--bronze); }
        tbody tr.rank-3:hover td { background-color: rgba(205,127,50,0.035); }

        /* "Lighter" stats — small numeric columns get less visual weight
           so the driver / team name + points are the loudest cells, but
           still big and bright enough to read at a glance. */
        td.lighter { color: rgba(203,213,225,0.85); font-size: 1.05rem; font-weight: 600; }

        /* Leader pip + gap below the points number. */
        .leader-pip {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem; font-weight: 700; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--gold);
        }
        .points-gap {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            color: rgba(148,163,184,0.85);
        }

        /* "★ Leader" badge inline with the name. */
        .leader-tag {
            display: inline-block;
            margin-left: 0.55rem;
            padding: 0.12rem 0.55rem;
            background: rgba(255,209,102,0.18);
            border: 1px solid rgba(255,209,102,0.45);
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            vertical-align: middle;
        }

        /* Position cell stacks number + movement chip vertically. */
        .pos-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; }
        .move {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
            padding: 0.08rem 0.4rem; border-radius: 4px;
        }
        .move-up   { background: rgba(34,197,94,0.15);  color: #4ade80; }
        .move-down { background: rgba(239,68,68,0.15);  color: #f87171; }
        .move-flat { background: rgba(148,163,184,0.12); color: #94a3b8; }
        .move-new  { background: rgba(255,209,102,0.15); color: var(--gold); }

        /* Driver / team name — slightly larger across the board now. */
        .name { font-size: 1rem; }
        .driver-row .name { font-size: 1.08rem; }

        /* Elo cell on drivers tab. */
        .elo-cell { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
        .elo-num { font-family: 'Anton', sans-serif; font-size: 1rem; color: var(--gold); letter-spacing: 0.02em; line-height: 1; }
        .elo-cell .elo-tier { margin-left: 0 !important; }

        /* Manufacturer badge — bumped up so it's recognisable, not a dot. */
        .meta-line img { width: 20px !important; height: 20px !important; }

        /* Position cell */
        .pos {
            font-family: 'Anton', sans-serif;
            font-size: 1.2rem;
            width: 50px;
            color: var(--muted);
        }
        .pos.p1 { color: var(--gold); }
        .pos.p2 { color: var(--silver); }
        .pos.p3 { color: var(--bronze); }

        /* Name + meta */
        .name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.92rem;
        }
        .driver-row .name { font-family: 'Anton', sans-serif; font-size: 1rem; letter-spacing: 0.03em; }
        .meta-line {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .mfr-logo {
            display: inline-block;
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
            vertical-align: middle;
        }
        .career-num {
            display: inline-block;
            background: rgba(255,209,102,0.12);
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.1rem 0.45rem;
            border-radius: 3px;
            margin-right: 0.45rem;
        }
        .driver-flag { font-size: 1.05em; line-height: 1; vertical-align: baseline; }

        /* Row cell with avatar to the left of name + meta */
        .driver-cell { display: flex; align-items: center; gap: 0.6rem; }
        .driver-cell-text { min-width: 0; }
        .std-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            object-fit: cover; flex-shrink: 0; background: var(--bg-2);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .std-avatar-init { font-family: 'Anton', sans-serif; font-size: 0.95rem; color: var(--muted); opacity: 0.7; }
        .mfr-badge-lg { display: inline-flex; align-items: center; justify-content: center; width: 34px; flex-shrink: 0; }
        .mfr-badge-lg .mfr-logo { width: 26px; height: 26px; object-fit: contain; }

        /* Recent-form pills */
        .form-strip { display: inline-flex; gap: 3px; }
        .form-pill {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 24px; padding: 2px 5px; border-radius: 4px;
            font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700;
            background: rgba(255,255,255,0.06); color: var(--muted);
        }
        .form-pill.form-win    { background: rgba(255,209,102,0.18); color: var(--gold); }
        .form-pill.form-podium { background: rgba(148,163,184,0.20); color: #e2e8f0; }
        .form-pill.form-dnf    { background: rgba(248,113,113,0.15); color: #f87171; }
        .form-empty { color: var(--muted); opacity: 0.5; }

        /* Top-3 rostrum */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 0.75rem; margin: 0.25rem 0 1.75rem; }
        .podium-spot { display: flex; flex-direction: column; align-items: center; width: 32%; max-width: 190px; }
        .podium-driver { text-decoration: none; color: var(--text); text-align: center; display: block; margin-bottom: 0.55rem; transition: transform 0.15s; }
        .podium-driver:hover { transform: translateY(-3px); }
        .pod-av-wrap { display: flex; justify-content: center; margin-bottom: 0.5rem; }
        .pod-av { border-radius: 50%; object-fit: cover; background: var(--bg-2); display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--border); }
        .pod-av-init { font-family: 'Anton', sans-serif; color: var(--muted); }
        .podium-name { font-family: 'Anton', sans-serif; font-size: 0.95rem; letter-spacing: 0.02em; line-height: 1.1; }
        .podium-pts { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
        .podium-step { width: 100%; border-radius: 10px 10px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 0.5rem; border: 1px solid var(--border); border-bottom: none; }
        .podium-rank { font-family: 'Anton', sans-serif; line-height: 1; }
        .spot-1 .pod-av { width: 88px; height: 88px; border-color: rgba(255,209,102,0.6); }
        .spot-2 .pod-av, .spot-3 .pod-av { width: 66px; height: 66px; }
        .spot-1 .pod-av-init { font-size: 2rem; }
        .spot-2 .pod-av-init, .spot-3 .pod-av-init { font-size: 1.4rem; }
        .spot-1 .podium-name { font-size: 1.1rem; }
        .step-1 { height: 120px; background: linear-gradient(180deg, rgba(255,209,102,0.22), rgba(255,209,102,0.05)); }
        .step-2 { height: 92px;  background: linear-gradient(180deg, rgba(203,213,225,0.20), rgba(203,213,225,0.04)); }
        .step-3 { height: 72px;  background: linear-gradient(180deg, rgba(209,154,102,0.20), rgba(209,154,102,0.04)); }
        .step-1 .podium-rank { color: var(--gold); font-size: 2rem; }
        .step-2 .podium-rank { color: #cbd5e1; font-size: 1.6rem; }
        .step-3 .podium-rank { color: #d19a66; font-size: 1.6rem; }
        @media (max-width: 520px) {
            .podium { gap: 0.4rem; }
            .podium-name { font-size: 0.78rem; }
            .spot-1 .podium-name { font-size: 0.9rem; }
            .spot-1 .pod-av { width: 62px; height: 62px; }
            .spot-2 .pod-av, .spot-3 .pod-av { width: 48px; height: 48px; }
        }

        /* Points cell */
        .points {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 0.02em;
        }

        .state-msg {
            text-align: center;
            padding: 4rem 2rem;
        }
        .state-msg h3 {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .state-msg p { color: var(--muted); font-size: 0.88rem; }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
        }

        @media (max-width: 700px) {
            .nav { padding: 1rem; }
            .hero { padding: 2rem 1rem 1rem; }
            .tab-bar { padding: 0 1rem; }
            .content { padding: 1rem 0.5rem 3rem; }
            .standings { border-radius: 8px; border-left: none; border-right: none; }
            thead th, tbody td { padding: 0.7rem 0.6rem; }
            .pos { width: 36px; font-size: 1rem; }
            .points { font-size: 1.05rem; }
            .hide-mob { display: none; }
        }
    </style>
    <link rel="stylesheet" href="/endurance/assets/gtec-nav.css">
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script src="/endurance/assets/elo-tiers.js?v=3"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data.session) { if (portal) portal.style.display = ''; }
    else              { if (signin) signin.style.display = ''; }
});

let _drivers = [];
let _teams   = [];
let _ratings = null; // loaded lazily
let _season  = null;
let _tab     = 'drivers';
let _ceiling  = null; // max points still available across all remaining rounds (Split-1 ceiling), for Live Battles
let _remaining = 0;

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Flag emoji from any 2-letter ISO country code (regional indicators).
function flag(c) {
    const cc = (c || '').trim().toUpperCase();
    if (!/^[A-Z]{2}$/.test(cc)) return '';
    return String.fromCodePoint(...[...cc].map(ch => 127397 + ch.charCodeAt(0)));
}

function posCls(p) {
    if (p === 1) return 'pos p1';
    if (p === 2) return 'pos p2';
    if (p === 3) return 'pos p3';
    return 'pos';
}
function rankCls(p) {
    if (p === 1) return 'rank-1';
    if (p === 2) return 'rank-2';
    if (p === 3) return 'rank-3';
    return '';
}

// Render the small movement chip next to the position. Returns ▲N green,
// ▼N red, – grey, or "NEW" gold for drivers who weren't ranked before
// the most recent event.
function movementHTML(currentPos, prevPos) {
    if (prevPos == null) return `<span class="move move-new">NEW</span>`;
    const delta = prevPos - currentPos;  // positive = moved up
    if (delta > 0)  return `<span class="move move-up">▲${delta}</span>`;
    if (delta < 0)  return `<span class="move move-down">▼${-delta}</span>`;
    return `<span class="move move-flat">–</span>`;
}

// Manufacturer logo (preferred) or coloured swatch fallback
function mfrBadge(logoUrl, brandColor, name) {
    if (logoUrl) return `<img class="mfr-logo" src="${esc(logoUrl)}" alt="${esc(name || '')}" loading="lazy">`;
    if (brandColor) return `<span class="swatch" style="background:${esc(brandColor)}"></span>`;
    return '';
}

// Small round driver avatar (photo, else initial).
function driverAvatar(photo, name) {
    if (photo) return `<img class="std-avatar" src="${esc(photo)}" alt="" loading="lazy">`;
    const init = (name || '?').trim().charAt(0).toUpperCase();
    return `<span class="std-avatar std-avatar-init">${esc(init)}</span>`;
}

// Recent-form strip: last few rounds as compact, colour-coded pills.
function formStrip(form) {
    if (!form || !form.length) return '<span class="form-empty">—</span>';
    return `<span class="form-strip">` + form.map(f => {
        const st = f.status || 'classified';
        let cls = 'form-pill', label, title;
        if (st !== 'classified') {
            cls += ' form-dnf';
            label = st === 'dnf' ? 'DNF' : st === 'dsq' ? 'DSQ' : st === 'dns' ? 'DNS' : st === 'withdrawn' ? 'WD' : '—';
            title = label;
        } else if (f.pos === 1) {
            cls += ' form-win'; label = 'P1'; title = 'Win';
        } else if (f.pos != null && f.pos <= 3) {
            cls += ' form-podium'; label = 'P' + f.pos; title = 'Podium';
        } else {
            label = f.pos != null ? 'P' + f.pos : '—'; title = label;
        }
        return `<span class="${cls}" title="${esc(title)}">${label}</span>`;
    }).join('') + `</span>`;
}

// Top-3 rostrum above the driver standings — P2 · P1 · P3, tallest in the
// middle. Only shown once there's a genuine top three.
function podiumSpot(d, place) {
    if (!d) return '';
    const info = _ratingByDriver[d.driver_id] || {};
    const pts  = Number(d.points) || 0;
    const av = info.photo
        ? `<img class="pod-av" src="${esc(info.photo)}" alt="" loading="lazy">`
        : `<span class="pod-av pod-av-init">${esc((d.driver_name || '?').trim().charAt(0).toUpperCase())}</span>`;
    const flg = d.nationality ? `<span class="driver-flag">${flag(d.nationality)}</span> ` : '';
    return `<div class="podium-spot spot-${place}">
        <a class="podium-driver" href="/endurance/drivers/?slug=${esc(d.driver_slug)}">
            <div class="pod-av-wrap">${av}</div>
            <div class="podium-name">${flg}${esc(d.driver_name)}</div>
            <div class="podium-pts">${pts.toFixed(pts % 1 === 0 ? 0 : 1)} pts</div>
        </a>
        <div class="podium-step step-${place}"><span class="podium-rank">${place}</span></div>
    </div>`;
}
function renderPodium(list) {
    if (!list || list.length < 3) return '';
    const [p1, p2, p3] = list;
    return `<div class="podium">${podiumSpot(p2, 2)}${podiumSpot(p1, 1)}${podiumSpot(p3, 3)}</div>`;
}

async function setTab(t) {
    _tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    if (t === 'ratings' && _ratings === null) {
        await loadRatings();
    } else {
        render();
    }
}

function render() {
    const panel = document.getElementById('panel');
    if (_tab === 'drivers')  renderDrivers(panel);
    else if (_tab === 'teams') renderTeams(panel);
    else if (_tab === 'manufacturers') renderManufacturers(panel);
    else renderRatings(panel);
}

async function loadRatings() {
    const panel = document.getElementById('panel');
    panel.innerHTML = '<div class="loading">Loading ratings…</div>';
    const { data, error } = await sb.from('driver_current_ratings')
        .select('*')
        .not('last_rated_at', 'is', null)
        .order('rating', { ascending: false });
    if (error) { panel.innerHTML = `<div class="state-msg"><p>${esc(error.message)}</p></div>`; return; }
    _ratings = data || [];
    renderRatings(panel);
}

// Live-battle flag — a quiet inline cue instead of a separate section.
// Returns a small icon for the gap cell when THIS row could still catch
// the row directly above it (their ceiling reaches or passes the row
// above's current points); empty string when that gap is already
// mathematically settled, or for the leader row (nothing above to chase).
function battleFlag(rowPoints, aboveRow) {
    if (_ceiling == null || !aboveRow) return '';
    const abovePoints = Number(aboveRow.points) || 0;
    if (rowPoints + _ceiling < abovePoints) return '';
    const gap = abovePoints - rowPoints;
    const title = `Still catchable — ${gap.toFixed(gap % 1 === 0 ? 0 : 1)} pt${gap === 1 ? '' : 's'} back, ${_remaining} round${_remaining === 1 ? '' : 's'} left`;
    return `<span class="battle-flag" title="${esc(title)}">🔥</span>`;
}

        return `<tr class="driver-row ${rankCls(pos)}">

            <td>

                    ${driverAvatar(_rInfo?.photo, d.driver_name)}

                        <div class="name">${num}${d.nationality ? `<span class="driver-flag" title="${esc(d.nationality)}">${flag(d.nationality)}</span> ` : ''}<a href="/endurance/drivers/?slug=${esc(d.driver_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(d.driver_name)}</a>${leaderTag}</div>

                <div class="points">${points.toFixed(points % 1 === 0 ? 0 : 1)}</div>
                ${gap}
            </td>

    }).join('');

    panel.innerHTML = `
        ${renderPodium(_drivers)}
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:64px">#</th>
                    <th>Driver</th>
                    <th class="center hide-mob">Elo</th>
                    <th class="center hide-mob">Races</th>
                    <th class="center hide-mob">Wins</th>

async function load() {
    const { data: season } = await sb.from('seasons')
        .select('id, name, year, points_systems(points, pole_points, fastest_lap_points)')
        .eq('is_active', true)
        .maybeSingle();

    if (!season) {
        document.getElementById('season-sub').textContent = 'No active season.';
        document.getElementById('panel').innerHTML =
            `<div class="state-msg"><h3>Coming Soon</h3><p>Standings will appear here once the season is set up.</p></div>`;
        return;
    }
    _season = season;
    document.getElementById('season-title').textContent = season.name;
    document.getElementById('season-sub').textContent = `${season.year} Championship · Live standings`;

    const [d, t, ratings, perEvent, remainingRes, driverMfrs] = await Promise.all([
        sb.from('driver_standings').select('*').eq('season_id', season.id),
        sb.from('team_standings').select('*').eq('season_id', season.id),
        sb.from('driver_current_ratings').select('driver_id, rating, last_rated_at'),
        // Per-event, per-driver points so we can derive "rank before the last
        // event" and show championship movement arrows.
        sb.from('result_drivers')
            .select('driver_id, points_awarded, finish_position, status, results!inner(event_id, events!inner(season_id, starts_at))'),
        // Remaining rounds — feeds Live Battles' "still catchable" ceiling,
        // same Split-1-forever assumption as Season Stakes on the profile pages.
        sb.from('events').select('id', { count: 'exact', head: true })
            .eq('season_id', season.id).in('status', ['scheduled', 'in_progress']),
        // Each driver's own manufacturer (their profile lock) — the source
        // for showing a manufacturer on solo drivers, who have no team.
        sb.from('drivers').select('id, photo_url, manufacturers(id, name, brand_color, logo_url)'),
    ]);

    _remaining = remainingRes.count || 0;
    const ps = season.points_systems;
    if (ps && _remaining) {
        const maxPos = Math.max(0, ...(ps.points || []).map(p => Number(p.points) || 0));
        _ceiling = _remaining * (maxPos + Number(ps.pole_points || 0) + Number(ps.fastest_lap_points || 0));
    } else {
        _ceiling = null;
    }

    // Index ratings by driver for quick lookup during render.
    _ratingByDriver = {};
    (ratings.data || []).forEach(r => {
        _ratingByDriver[r.driver_id] = { rating: r.rating, rated: !!r.last_rated_at };
    });
    // Merge each driver's own photo + manufacturer in. The manufacturer is
    // the fallback source for solo drivers (no team to source it from) and
    // for the Manufacturers championship below.
    (driverMfrs.data || []).forEach(r => {
        const e = _ratingByDriver[r.id] || (_ratingByDriver[r.id] = {});
        e.photo = r.photo_url || null;
        const m = r.manufacturers;
        if (m) {
            e.manufacturerId = m.id;
            e.manufacturerName = m.name;
            e.brandColor = m.brand_color;
            e.manufacturerLogoUrl = m.logo_url;
        }
    });

    // Compute previous-round positions. The "current" league is the view
    // we just fetched; the "previous" league is the same minus the most
    // recent event's points. Then rank both and diff.
    _prevDriverRank = computePrevRank(perEvent.data || [], season.id, d.data || []);

    // Per-driver season tiebreak: best classified finishing position (+ a
    // fallback status rank). Lets 0-point drivers who actually finished
    // (e.g. P11/P12, just outside the points) sort above DNF/DNS drivers,
    // instead of everyone on 0 landing in an arbitrary order.
    const STATUS_RANK = { classified: 0, dnf: 1, dsq: 2, withdrawn: 3, dns: 4 };
    const _tie = {};
    (perEvent.data || []).forEach(r => {
        if (r.results?.events?.season_id !== season.id) return;
        const st = r.status || 'classified';
        const t = _tie[r.driver_id] || (_tie[r.driver_id] = { bestFinish: Infinity, bestStatus: 9 });
        if (st === 'classified' && r.finish_position != null) t.bestFinish = Math.min(t.bestFinish, r.finish_position);
        t.bestStatus = Math.min(t.bestStatus, STATUS_RANK[st] ?? 9);
    });
    const tieCompare = (a, b) => {
        const ta = _tie[a.driver_id] || { bestFinish: Infinity, bestStatus: 9 };
        const tb = _tie[b.driver_id] || { bestFinish: Infinity, bestStatus: 9 };
        const aHas = ta.bestFinish !== Infinity, bHas = tb.bestFinish !== Infinity;
        if (aHas !== bHas) return aHas ? -1 : 1;                              // any classified finish beats none
        if (aHas && ta.bestFinish !== tb.bestFinish) return ta.bestFinish - tb.bestFinish; // better finish first
        return ta.bestStatus - tb.bestStatus;                                // else DNF above DSQ above DNS
    };

    _drivers = (d.data || []).sort((a, b) =>
        (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums) || tieCompare(a, b));
    _teams   = (t.data || []).sort((a, b) => (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums));

    // Form guide — each driver's last few rounds (chronological), from the
    // same per-event rows used for movement arrows.
    _formByDriver = {};
    const _evByDriver = {};
    (perEvent.data || []).forEach(r => {
        if (r.results?.events?.season_id !== season.id) return;
        (_evByDriver[r.driver_id] = _evByDriver[r.driver_id] || []).push({
            at: r.results.events.starts_at, pos: r.finish_position, status: r.status,
        });
    });
    Object.keys(_evByDriver).forEach(id => {
        _formByDriver[id] = _evByDriver[id]
            .sort((a, b) => new Date(a.at) - new Date(b.at))
            .slice(-5);
    });

    // Manufacturer championship — sum each driver's points under their
    // manufacturer (the team lock, or the driver's own for solo entries).
    const _mMap = {};
    _drivers.forEach(dr => {
        const info = _ratingByDriver[dr.driver_id] || {};
        const id   = dr.manufacturer_id || info.manufacturerId;
        if (!id) return;
        const m = _mMap[id] || (_mMap[id] = {
            id,
            name:  dr.manufacturer_name     || info.manufacturerName || 'Unknown',
            logo:  dr.manufacturer_logo_url || info.manufacturerLogoUrl,
            color: dr.brand_color           || info.brandColor,
            points: 0, wins: 0, podiums: 0, poles: 0, fl: 0, drivers: 0,
        });
        m.points  += Number(dr.points)       || 0;
        m.wins    += Number(dr.wins)         || 0;
        m.podiums += Number(dr.podiums)      || 0;
        m.poles   += Number(dr.poles)        || 0;
        m.fl      += Number(dr.fastest_laps) || 0;
        m.drivers += 1;
    });
    _manufacturers = Object.values(_mMap).sort((a, b) => (b.points - a.points) || (b.wins - a.wins));

    render();
}

// Strip out the latest event's points-contribution per driver, re-rank,
// and return a map of driver_id → previous position (1-based) so we can
// show ▲ / ▼ / – movement arrows.
function computePrevRank(perEvent, seasonId, currentDrivers) {
    const inSeason = perEvent.filter(r => r.results?.events?.season_id === seasonId);
    if (!inSeason.length) return {};
    const lastTs = inSeason
        .map(r => r.results.events.starts_at)
        .filter(Boolean)
        .sort()
        .pop();
    if (!lastTs) return {};

    // Driver → points awarded before the latest event.
    const prev = {};
    currentDrivers.forEach(d => { prev[d.driver_id] = 0; });
    inSeason.forEach(r => {
        if (r.results.events.starts_at === lastTs) return;
        prev[r.driver_id] = (prev[r.driver_id] || 0) + Number(r.points_awarded || 0);
    });

    // Drivers who hadn't scored at all before the last event stay unranked
    // so we can show a "NEW" indicator instead of fake movement.
    const sorted = Object.entries(prev)
        .filter(([, p]) => p > 0)
        .sort((a, b) => b[1] - a[1]);
    const rankMap = {};
    sorted.forEach(([id], i) => { rankMap[id] = i + 1; });
    return rankMap;
}

let _ratingByDriver = {};
let _prevDriverRank = {};
let _formByDriver   = {};
let _manufacturers  = [];

load();
