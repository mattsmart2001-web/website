<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Standings — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --silver: #cbd5e1;
            --bronze: #cd7f32;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Nav */
        .gtec-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(5,6,8,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .gtec-nav .brand {
            font-family: 'Anton', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            text-indent: 0.32em;
        }
        .gtec-nav .brand .accent { color: var(--gold); }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .gtec-nav .nav-links a {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bg); background: var(--gold); text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 999px; transition: opacity 0.2s; }
        .gtec-nav .apply:hover { opacity: 0.85; }
        .gtec-nav .back {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: color 0.2s, border-color 0.2s;
        }
        .gtec-nav .back:hover {
            color: var(--text);
            border-color: rgba(255,255,255,0.25);
        }

        /* Hero */
        .hero {
            padding: 3rem 2rem 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .hero-eyebrow {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.75rem;
            text-indent: 0.45em;
        }
        .hero-title {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .hero-sub { color: var(--muted); font-size: 0.88rem; }

        /* Tabs */
        .tab-bar {
            display: flex;
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 0.9rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

        /* Content */
        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
        }

        /* Force every link in the standings to inherit the row's colour,
           overriding the browser's :visited purple. */
        .standings a,
        .standings a:link,
        .standings a:visited,
        .standings a:active { color: inherit; text-decoration: none; }
        .standings a:hover { text-decoration: underline; }

        /* Standings table */
        .standings {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            padding: 0.85rem 1.25rem;
            text-align: left;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        thead th.right { text-align: right; }
        thead th.center { text-align: center; }

        tbody td {
            padding: 0.95rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            position: relative;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.025); }
        td.right { text-align: right; }
        td.center { text-align: center; }
        td.muted { color: var(--muted); font-size: 0.85rem; }

        /* Subtle gradient sweep on every row — adds depth without shouting. */
        tbody tr td {
            background-image: linear-gradient(90deg, rgba(255,255,255,0.012) 0%, rgba(255,255,255,0) 60%);
        }

        /* Podium rows get a metallic-tinted gradient + left accent stripe.
           Box-shadow inset on the first cell paints the stripe without
           breaking the row's flexible width. */
        tbody tr.rank-1 td {
            background-image: linear-gradient(90deg, rgba(255,209,102,0.16) 0%, rgba(255,209,102,0.05) 55%, rgba(255,255,255,0) 100%);
        }
        tbody tr.rank-1 td:first-child {
            /* 6px gold stripe + a soft inner glow so P1 sits "on top" of
               the table. */
            box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18);
        }
        tbody tr.rank-1 td { box-shadow: inset 0 0 0 0 transparent, 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1 td:first-child { box-shadow: inset 6px 0 0 0 var(--gold), inset 0 0 0 1px rgba(255,209,102,0.18), 0 4px 16px rgba(255,209,102,0.06); }
        tbody tr.rank-1:hover td { background-color: rgba(255,209,102,0.07); }

        tbody tr.rank-2 td { background-image: linear-gradient(90deg, rgba(199,201,201,0.08) 0%, rgba(199,201,201,0.02) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-2 td:first-child { box-shadow: inset 4px 0 0 0 var(--silver); }
        tbody tr.rank-2:hover td { background-color: rgba(199,201,201,0.035); }

        tbody tr.rank-3 td { background-image: linear-gradient(90deg, rgba(205,127,50,0.09) 0%, rgba(205,127,50,0.025) 45%, rgba(255,255,255,0) 100%); }
        tbody tr.rank-3 td:first-child { box-shadow: inset 4px 0 0 0 var(--bronze); }
        tbody tr.rank-3:hover td { background-color: rgba(205,127,50,0.035); }

        /* "Lighter" stats — small numeric columns get less visual weight
           so the driver / team name + points are the loudest cells. */
        td.lighter { color: rgba(148,163,184,0.55); font-size: 0.84rem; font-weight: 500; }

        /* Leader pip + gap below the points number. */
        .leader-pip {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem; font-weight: 700; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--gold);
        }
        .points-gap {
            display: block; margin-top: 0.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            color: rgba(148,163,184,0.85);
        }

        /* "★ Leader" badge inline with the name. */
        .leader-tag {
            display: inline-block;
            margin-left: 0.55rem;
            padding: 0.12rem 0.55rem;
            background: rgba(255,209,102,0.18);
            border: 1px solid rgba(255,209,102,0.45);
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            vertical-align: middle;
        }

        /* Position cell stacks number + movement chip vertically. */
        .pos-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; }
        .move {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
            padding: 0.08rem 0.4rem; border-radius: 4px;
        }
        .move-up   { background: rgba(34,197,94,0.15);  color: #4ade80; }
        .move-down { background: rgba(239,68,68,0.15);  color: #f87171; }
        .move-flat { background: rgba(148,163,184,0.12); color: #94a3b8; }
        .move-new  { background: rgba(255,209,102,0.15); color: var(--gold); }

        /* Driver / team name — slightly larger across the board now. */
        .name { font-size: 1rem; }
        .driver-row .name { font-size: 1.08rem; }

        /* Elo cell on drivers tab. */
        .elo-cell { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
        .elo-num { font-family: 'Anton', sans-serif; font-size: 1rem; color: var(--gold); letter-spacing: 0.02em; line-height: 1; }
        .elo-cell .elo-tier { margin-left: 0 !important; }

        /* Manufacturer badge — bumped up so it's recognisable, not a dot. */
        .meta-line img { width: 20px !important; height: 20px !important; }

        /* Position cell */
        .pos {
            font-family: 'Anton', sans-serif;
            font-size: 1.2rem;
            width: 50px;
            color: var(--muted);
        }
        .pos.p1 { color: var(--gold); }
        .pos.p2 { color: var(--silver); }
        .pos.p3 { color: var(--bronze); }

        /* Name + meta */
        .name {
            font-weight: 600;
            color: var(--text);
            font-size: 0.92rem;
        }
        .driver-row .name { font-family: 'Anton', sans-serif; font-size: 1rem; letter-spacing: 0.03em; }
        .meta-line {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .mfr-logo {
            display: inline-block;
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
            vertical-align: middle;
        }
        .career-num {
            display: inline-block;
            background: rgba(255,209,102,0.12);
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.1rem 0.45rem;
            border-radius: 3px;
            margin-right: 0.45rem;
        }

        /* Points cell */
        .points {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 0.02em;
        }

        .state-msg {
            text-align: center;
            padding: 4rem 2rem;
        }
        .state-msg h3 {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .state-msg p { color: var(--muted); font-size: 0.88rem; }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
        }

        @media (max-width: 700px) {
            .nav { padding: 1rem; }
            .hero { padding: 2rem 1rem 1rem; }
            .tab-bar { padding: 0 1rem; }
            .content { padding: 1rem 0.5rem 3rem; }
            .standings { border-radius: 8px; border-left: none; border-right: none; }
            thead th, tbody td { padding: 0.7rem 0.6rem; }
            .pos { width: 36px; font-size: 1rem; }
            .points { font-size: 1.05rem; }
            .hide-mob { display: none; }
        }
    </style>
    <link rel="stylesheet" href="/endurance/assets/gtec-nav.css">
</head>
<body>

<nav class="gtec-nav">
    <a class="brand" href="/endurance/">Gran Turismo<img class="brand-logo" src="/endurance/assets/gtec-logo.png" alt="GTEC"></a>
    <button class="gtec-nav-toggle" aria-label="Toggle menu" type="button">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
    <div class="nav-links">
        <a href="/endurance/calendar/">Calendar</a>
        <a href="/endurance/news/">News</a>
        <a href="/endurance/media/">Media</a>
        <a href="/endurance/standings/" class="active">Standings</a>
        <a href="/endurance/results/">Results</a>
        <a href="/endurance/drivers/">Drivers</a>
        <a href="/endurance/teams/">Teams</a>
        <a href="/endurance/stats/">Stats</a>
        <a href="/endurance/rules/">Rules</a>
        <a href="/endurance/profile/login/" id="nav-signin" style="display:none">Sign In</a>
        <a href="/endurance/profile/" id="nav-portal" style="display:none">My Profile<span id="nav-portal-badge" class="nav-badge" aria-label="Unread messages"></span></a>
        <a class="apply" href="/endurance/apply/">Apply</a>
        <a class="back" href="/">← SparksTheory</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-eyebrow">Championship</div>
    <div class="hero-title" id="season-title">Standings</div>
    <div class="hero-sub" id="season-sub">&nbsp;</div>
</div>

<div class="tab-bar">
    <button class="tab active" data-tab="drivers" onclick="setTab('drivers')">Drivers</button>
    <button class="tab" data-tab="teams" onclick="setTab('teams')">Teams</button>
    <button class="tab" data-tab="ratings" onclick="setTab('ratings')">Ratings</button>
</div>

<div class="content">
    <div id="panel">
        <div class="loading">Loading…</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script src="/endurance/assets/elo-tiers.js?v=3"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data.session) { if (portal) portal.style.display = ''; }
    else              { if (signin) signin.style.display = ''; }
});

let _drivers = [];
let _teams   = [];
let _ratings = null; // loaded lazily
let _season  = null;
let _tab     = 'drivers';

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function posCls(p) {
    if (p === 1) return 'pos p1';
    if (p === 2) return 'pos p2';
    if (p === 3) return 'pos p3';
    return 'pos';
}
function rankCls(p) {
    if (p === 1) return 'rank-1';
    if (p === 2) return 'rank-2';
    if (p === 3) return 'rank-3';
    return '';
}

// Render the small movement chip next to the position. Returns ▲N green,
// ▼N red, – grey, or "NEW" gold for drivers who weren't ranked before
// the most recent event.
function movementHTML(currentPos, prevPos) {
    if (prevPos == null) return `<span class="move move-new">NEW</span>`;
    const delta = prevPos - currentPos;  // positive = moved up
    if (delta > 0)  return `<span class="move move-up">▲${delta}</span>`;
    if (delta < 0)  return `<span class="move move-down">▼${-delta}</span>`;
    return `<span class="move move-flat">–</span>`;
}

// Manufacturer logo (preferred) or coloured swatch fallback
function mfrBadge(logoUrl, brandColor, name) {
    if (logoUrl) return `<img class="mfr-logo" src="${esc(logoUrl)}" alt="${esc(name || '')}" loading="lazy">`;
    if (brandColor) return `<span class="swatch" style="background:${esc(brandColor)}"></span>`;
    return '';
}

async function setTab(t) {
    _tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    if (t === 'ratings' && _ratings === null) {
        await loadRatings();
    } else {
        render();
    }
}

function render() {
    const panel = document.getElementById('panel');
    if (_tab === 'drivers')  renderDrivers(panel);
    else if (_tab === 'teams') renderTeams(panel);
    else renderRatings(panel);
}

async function loadRatings() {
    const panel = document.getElementById('panel');
    panel.innerHTML = '<div class="loading">Loading ratings…</div>';
    const { data, error } = await sb.from('driver_current_ratings')
        .select('*')
        .not('last_rated_at', 'is', null)
        .order('rating', { ascending: false });
    if (error) { panel.innerHTML = `<div class="state-msg"><p>${esc(error.message)}</p></div>`; return; }
    _ratings = data || [];
    renderRatings(panel);
}

function renderDrivers(panel) {
    if (!_drivers.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Results Yet</h3><p>Standings will appear here once race results are recorded.</p></div>`;
        return;
    }
    const leaderPoints = Number(_drivers[0].points) || 0;
    const rows = _drivers.map((d, i) => {
        const pos = i + 1;
        const num = d.career_number ? `<span class="career-num">#${d.career_number}</span>` : '';
        const teamLine = d.team_name
            ? `<div class="meta-line">${mfrBadge(d.manufacturer_logo_url, d.brand_color, d.manufacturer_name, { size: 'lg' })}${d.team_slug ? `<a href="/endurance/teams/?slug=${esc(d.team_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='inherit'">${esc(d.team_name)}</a>` : esc(d.team_name)}${d.manufacturer_name ? ` · ${esc(d.manufacturer_name)}` : ''}</div>`
            : '';
        const movement = movementHTML(pos, _prevDriverRank[d.driver_id]);
        const leaderTag = pos === 1
            ? `<span class="leader-tag">★ Leader</span>`
            : '';
        const ratingInfo = _ratingByDriver[d.driver_id];
        const eloHTML = ratingInfo
            ? `<div class="elo-cell">
                   <span class="elo-num">${Math.round(ratingInfo.rating)}</span>
                   ${window.eloTierBadge ? window.eloTierBadge(ratingInfo.rating, { provisional: !ratingInfo.rated }) : ''}
               </div>`
            : '';
        const points = Number(d.points) || 0;
        const gap = pos === 1
            ? `<span class="leader-pip">LEADER</span>`
            : `<span class="points-gap">−${(leaderPoints - points).toFixed(points % 1 === 0 && leaderPoints % 1 === 0 ? 0 : 1)}</span>`;
        return `<tr class="driver-row ${rankCls(pos)}">
            <td class="${posCls(pos)}">
                <div class="pos-stack">
                    <span>${pos}</span>
                    ${movement}
                </div>
            </td>
            <td>
                <div class="name">${num}<a href="/endurance/drivers/?slug=${esc(d.driver_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(d.driver_name)}</a>${leaderTag}</div>
                ${teamLine}
            </td>
            <td class="hide-mob center">${eloHTML}</td>
            <td class="lighter center hide-mob">${d.races}</td>
            <td class="lighter center hide-mob">${d.wins}</td>
            <td class="lighter center hide-mob">${d.podiums}</td>
            <td class="lighter center hide-mob">${d.poles}</td>
            <td class="lighter center hide-mob">${d.fastest_laps}</td>
            <td class="right">
                <div class="points">${points.toFixed(points % 1 === 0 ? 0 : 1)}</div>
                ${gap}
            </td>
        </tr>`;
    }).join('');

    panel.innerHTML = `
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:64px">#</th>
                    <th>Driver</th>
                    <th class="center hide-mob">Elo</th>
                    <th class="center hide-mob">Races</th>
                    <th class="center hide-mob">Wins</th>
                    <th class="center hide-mob">Pod</th>
                    <th class="center hide-mob">Pole</th>
                    <th class="center hide-mob">FL</th>
                    <th class="right">Points</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

function renderTeams(panel) {
    if (!_teams.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Results Yet</h3><p>Standings will appear here once race results are recorded.</p></div>`;
        return;
    }
    const leaderPoints = Number(_teams[0].points) || 0;
    const rows = _teams.map((t, i) => {
        const pos = i + 1;
        const mfrLine = t.manufacturer_name
            ? `<div class="meta-line">${mfrBadge(t.manufacturer_logo_url, t.brand_color, t.manufacturer_name, { size: 'lg' })}${esc(t.manufacturer_name)}</div>`
            : '';
        const leaderTag = pos === 1 ? `<span class="leader-tag">★ Leader</span>` : '';
        const points = Number(t.points) || 0;
        const gap = pos === 1
            ? `<span class="leader-pip">LEADER</span>`
            : `<span class="points-gap">−${(leaderPoints - points).toFixed(points % 1 === 0 && leaderPoints % 1 === 0 ? 0 : 1)}</span>`;
        return `<tr class="${rankCls(pos)}">
            <td class="${posCls(pos)}">
                <div class="pos-stack"><span>${pos}</span></div>
            </td>
            <td>
                <div class="name"><a href="/endurance/teams/?slug=${esc(t.team_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(t.team_name)}</a>${leaderTag}</div>
                ${mfrLine}
            </td>
            <td class="lighter center hide-mob">${t.races}</td>
            <td class="lighter center hide-mob">${t.wins}</td>
            <td class="lighter center hide-mob">${t.podiums}</td>
            <td class="lighter center hide-mob">${t.poles}</td>
            <td class="lighter center hide-mob">${t.fastest_laps}</td>
            <td class="right">
                <div class="points">${points}</div>
                ${gap}
            </td>
        </tr>`;
    }).join('');

    panel.innerHTML = `
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:50px">#</th>
                    <th>Team</th>
                    <th class="center hide-mob">Races</th>
                    <th class="center hide-mob">Wins</th>
                    <th class="center hide-mob">Pod</th>
                    <th class="center hide-mob">Pole</th>
                    <th class="center hide-mob">FL</th>
                    <th class="right">Points</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

function renderRatings(panel) {
    if (!_ratings?.length) {
        panel.innerHTML = `<div class="state-msg"><h3>No Ratings Yet</h3><p>Ratings appear here after running Compute Elo on a completed event.</p></div>`;
        return;
    }
    const rows = _ratings.map((d, i) => {
        const pos = i + 1;
        const delta = d.last_delta;
        const deltaHTML = delta != null
            ? `<span style="font-size:0.78rem;font-weight:600;color:${delta >= 0 ? '#4ade80' : '#f87171'}">${delta >= 0 ? '+' : ''}${delta}</span>`
            : '—';
        const teamLine = d.team_name
            ? `<div class="meta-line">${mfrBadge(d.manufacturer_logo_url, d.brand_color, d.manufacturer_name)}${d.team_slug ? `<a href="/endurance/teams/?slug=${esc(d.team_slug)}" style="color:inherit;text-decoration:none">${esc(d.team_name)}</a>` : esc(d.team_name)}</div>`
            : '';
        return `<tr class="${rankCls(pos)}">
            <td class="${posCls(pos)}">${pos}</td>
            <td>
                <div class="name"><a href="/endurance/drivers/?slug=${esc(d.driver_slug)}" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(d.driver_name)}</a></div>
                ${teamLine}
            </td>
            <td class="right"><span class="points">${d.rating}</span>${window.eloTierBadge ? window.eloTierBadge(d.rating) : ''}</td>
            <td class="right">${deltaHTML}</td>
            <td class="right hide-mob" style="color:var(--muted);font-size:0.85rem">${d.peak_rating}</td>
        </tr>`;
    }).join('');

    panel.innerHTML = `
        <div class="standings">
            <table>
                <thead><tr>
                    <th style="width:50px">#</th>
                    <th>Driver</th>
                    <th class="right">Rating</th>
                    <th class="right">Last</th>
                    <th class="right hide-mob">Peak</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <p style="font-size:0.72rem;color:var(--muted);margin-top:0.85rem;padding:0 0.25rem">Pairwise Elo (K=32, base 1500). Clamped to [800–3000].</p>`;
}

async function load() {
    const { data: season } = await sb.from('seasons')
        .select('id, name, year')
        .eq('is_active', true)
        .maybeSingle();

    if (!season) {
        document.getElementById('season-sub').textContent = 'No active season.';
        document.getElementById('panel').innerHTML =
            `<div class="state-msg"><h3>Coming Soon</h3><p>Standings will appear here once the season is set up.</p></div>`;
        return;
    }
    _season = season;
    document.getElementById('season-title').textContent = season.name;
    document.getElementById('season-sub').textContent = `${season.year} Championship · Live standings`;

    const [d, t, ratings, perEvent] = await Promise.all([
        sb.from('driver_standings').select('*').eq('season_id', season.id),
        sb.from('team_standings').select('*').eq('season_id', season.id),
        sb.from('driver_current_ratings').select('driver_id, rating, last_rated_at'),
        // Per-event, per-driver points so we can derive "rank before the last
        // event" and show championship movement arrows.
        sb.from('result_drivers')
            .select('driver_id, points_awarded, results!inner(event_id, events!inner(season_id, starts_at))'),
    ]);

    // Index ratings by driver for quick lookup during render.
    _ratingByDriver = {};
    (ratings.data || []).forEach(r => {
        _ratingByDriver[r.driver_id] = { rating: r.rating, rated: !!r.last_rated_at };
    });

    // Compute previous-round positions. The "current" league is the view
    // we just fetched; the "previous" league is the same minus the most
    // recent event's points. Then rank both and diff.
    _prevDriverRank = computePrevRank(perEvent.data || [], season.id, d.data || []);

    _drivers = (d.data || []).sort((a, b) => (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums));
    _teams   = (t.data || []).sort((a, b) => (b.points - a.points) || (b.wins - a.wins) || (b.podiums - a.podiums));
    render();
}

// Strip out the latest event's points-contribution per driver, re-rank,
// and return a map of driver_id → previous position (1-based) so we can
// show ▲ / ▼ / – movement arrows.
function computePrevRank(perEvent, seasonId, currentDrivers) {
    const inSeason = perEvent.filter(r => r.results?.events?.season_id === seasonId);
    if (!inSeason.length) return {};
    const lastTs = inSeason
        .map(r => r.results.events.starts_at)
        .filter(Boolean)
        .sort()
        .pop();
    if (!lastTs) return {};

    // Driver → points awarded before the latest event.
    const prev = {};
    currentDrivers.forEach(d => { prev[d.driver_id] = 0; });
    inSeason.forEach(r => {
        if (r.results.events.starts_at === lastTs) return;
        prev[r.driver_id] = (prev[r.driver_id] || 0) + Number(r.points_awarded || 0);
    });

    // Drivers who hadn't scored at all before the last event stay unranked
    // so we can show a "NEW" indicator instead of fake movement.
    const sorted = Object.entries(prev)
        .filter(([, p]) => p > 0)
        .sort((a, b) => b[1] - a[1]);
    const rankMap = {};
    sorted.forEach(([id], i) => { rankMap[id] = i + 1; });
    return rankMap;
}

let _ratingByDriver = {};
let _prevDriverRank = {};

load();
</script>

<script src="/endurance/assets/gtec-nav.js" defer></script>
