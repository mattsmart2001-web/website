            // tilted. Panning is given up for it rather than hidden behind a
            // modifier nobody would find: zoom still frames what you want,
            // and Fit is one press away.
            mapWasTurned();
            yaw += (p[0] - lastPt[0]) * 0.008;
            tilt = Math.min(TILT_MAX, Math.max(TILT_MIN, tilt - (p[1] - lastPt[1]) * 0.005));
        } else {
            view.x += p[0] - lastPt[0];
            view.y += p[1] - lastPt[1];
        }
        lastPt = p;
        syncZoomButtons();
        if (lastRows) drawTrack(lastRows);
    });
    const endDrag = e => {
        if (!dragging) return;
        dragging = false;
        cv.classList.remove('grabbing');
        try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);

    // Touch: two fingers pinch and pan together. One finger is left alone so
    // the page still scrolls, which matters more than one-finger panning on
    // a map sat halfway down a long page.
    let pinch = null;
    const spread = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const mid = t => {
        const r = cv.getBoundingClientRect();
        return [(t[0].clientX + t[1].clientX) / 2 - r.left,
                (t[0].clientY + t[1].clientY) / 2 - r.top];
    };
    cv.addEventListener('touchstart', e => {
        if (e.touches.length !== 2) { pinch = null; return; }
        pinch = { d: spread(e.touches), m: mid(e.touches) };
    }, { passive: true });
    cv.addEventListener('touchmove', e => {
        if (e.touches.length !== 2 || !pinch) return;
        e.preventDefault();
        const d = spread(e.touches), m = mid(e.touches);
        view.x += m[0] - pinch.m[0];
        view.y += m[1] - pinch.m[1];
        if (pinch.d > 0) zoomAt(m[0], m[1], d / pinch.d);
        else { syncZoomButtons(); if (lastRows) drawTrack(lastRows); }
        pinch = { d, m };
        mapWasTurned();   // on a touchscreen this is the gesture the hint asks for
    }, { passive: false });
    cv.addEventListener('touchend', () => { pinch = null; }, { passive: true });

    // Double click or double tap to fit, the usual way out of a lost view.
    cv.addEventListener('dblclick', e => { e.preventDefault(); resetView(); });

    document.getElementById('zoom-in')?.addEventListener('click',
        () => { endIntro(); zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.6); });
    document.getElementById('zoom-out')?.addEventListener('click',
        () => { endIntro(); zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1 / 1.6); });
    document.getElementById('zoom-reset')?.addEventListener('click', resetView);
    document.getElementById('view-3d')?.addEventListener('click',
        () => { endIntro(); setView3d(!view3d); });

    syncZoomButtons();
}

/** How to turn the map, shown over it until the viewer has done it once.
 *
 *  Worded by what the device can actually do, which is not the same thing on
 *  both. A mouse drag turns and tips the circuit; one finger is deliberately
 *  left to the page so a map halfway down a long page does not trap the
 *  scroll, so on a touchscreen there is no rotating at all and telling
 *  somebody to drag would be a lie. Only the flat map is on offer there,
 *  pinched and panned with two fingers. */
let hintState = null;
function setMapHint() {
    const el = document.getElementById('map-hint');
    if (!el) return;
    const show = view3d && !mapTurned;
    // Called from the poll, so it must not rewrite the DOM twice a second for
    // no reason.
    if (hintState === show) return;
    hintState = show;
    if (!show) {
        // Faded rather than cut, then taken out of the layout once it is
        // invisible, so the first drag does not make it blink out.
        if (!el.hidden) {
            el.classList.add('gone');
            setTimeout(() => { if (el.classList.contains('gone')) el.hidden = true; }, 550);
        }
        return;
    }
    const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    el.innerHTML = touch
        ? 'Pinch with two fingers to zoom &middot; <kbd>2D</kbd> for the flat map'
        : '<kbd>Drag</kbd> to turn and tip &middot; <kbd>Scroll</kbd> to zoom';
    el.hidden = false;
    el.classList.remove('gone');
}

/** They have turned it, so stop telling them how. Remembered per viewer: a
 *  regular who learned this in practice should not be told again on race day. */
function mapWasTurned() {
    if (mapTurned) return;
    mapTurned = true;
    saveSplitPrefs();
    setMapHint();
}

// How wide a car's number is. Measured once per number rather than once per
// car per redraw: measureText is not free, the font is set once and never
// changes, and a full grid only ever has a few dozen distinct numbers.
const badgeWidths = new Map();
// Measured against whatever font is active at the time, and Inter arrives
// from Google Fonts after the first redraw on a slow connection. Thrown away
// once the real font is in, so the badges are not sized to the fallback for
// the rest of the session.
if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => badgeWidths.clear()).catch(() => {});
}
function badgeHalfWidth(g, label) {
    if (!label) return 0;
    let w = badgeWidths.get(label);
    if (w == null) { w = g.measureText(label).width / 2; badgeWidths.set(label, w); }
    return w;
}

// A capsule, which is a circle when the half-width is no more than the radius
// and a rounded bar when the number needs the room. Built by hand rather than
// with roundRect, which Safari only learned in 16 and some drivers are on
// older phones than that.
function pillPath(g, x, y, half, r) {
    const dx = Math.max(0, half - r);
    g.beginPath();
    g.moveTo(x - dx, y - r);
    g.lineTo(x + dx, y - r);
    g.arc(x + dx, y, r, -Math.PI / 2, Math.PI / 2);
    g.lineTo(x - dx, y + r);
    g.arc(x - dx, y, r, Math.PI / 2, Math.PI * 1.5);
    g.closePath();
}

function drawTrack(rows) {
    const cv = document.getElementById('track');
    if (!cv) return;
    bindMapControls();
    const note = document.getElementById('map-note');

    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
    }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    // Once the outline exists it IS the circuit, and the cars' own histories
    // add nothing to it but work. Drawing every car's full trail as track cost
    // one stroke per segment per car: fine at three cars, roughly 240,000
    // strokes per redraw at sixty, which no canvas survives. Before an outline
    // has been captured the cars are still the only map there is, so they draw
    // it then.
    const allPaths = baseLoop.length ? [baseLoop] : [...carPaths.values()];
    // How many positions the picture is made of, which is also what the note
    // beside the title reports. With an outline that is the outline: the cars'
    // own histories are no longer drawn, so counting them in would inflate the
    // figure by whatever each car happened to be holding.
    const total = basePath.length || allPaths.reduce((n, p) => n + p.length, 0);

    if (total < 2) {
        // Nothing to say yet, and the cycle must not paint over it.
        if (factTimer) { clearInterval(factTimer); factTimer = null; }
        factList = [];
        if (note) { note.classList.remove('fading'); note.textContent = 'Waiting for positions'; note.title = ''; }
        g.fillStyle = '#94a3b8';
        g.font = "11px 'Inter', system-ui, sans-serif";
        g.textAlign = 'center';
        g.fillText('The circuit draws itself as cars report their position.', w / 2, h / 2);
        return;
    }

    // The first draw with a finished outline under it is the moment there is
    // something worth tipping. Before that the map is a part-traced squiggle
    // and the move would be about nothing. Safe to call from inside the draw:
    // it only sets the angles and books a frame, and refuses a second time.
    if (baseLoop.length) startIntro();

    // Fit whatever has been seen, keeping the aspect ratio so the shape of
    // the circuit is true rather than stretched to the box.
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    let minY = Infinity, maxY = -Infinity;
    for (const path of [...allPaths, ...(basePath.length ? carPaths.values() : [])])
    for (const pt of path) {
        if (pt[0] < minX) minX = pt[0]; if (pt[0] > maxX) maxX = pt[0];
        if (pt[1] < minZ) minZ = pt[1]; if (pt[1] > maxZ) maxZ = pt[1];
        if (pt[2] != null) {
            if (pt[2] < minY) minY = pt[2];
            if (pt[2] > maxY) maxY = pt[2];
        }
    }
    // Turning the circuit and tipping it away from the viewer. Flat is the
    // identity, so everything below this is the same code for both views.
    //
    // Rotation about the middle of the circuit rather than the origin, since
    // GT7's coordinates are centred on nothing in particular and spinning
    // about a point off the edge of the map is not a rotation anyone wants.
    const midX = (minX + maxX) / 2, midZ = (minZ + maxZ) / 2;
    const spanXw = Math.max(1, maxX - minX), spanZw = Math.max(1, maxZ - minZ);
    const yRef = Number.isFinite(minY) ? minY : 0;
    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    // Returns [across, down, depth]. Depth is how near the viewer a point is,
    // and is what decides which bit of track is drawn over which.
    const eye = EYE_DISTANCE * Math.max(spanXw, spanZw);
    const world = view3d
        ? (x, z, y) => {
            const dx = x - midX, dz = z - midZ;
            const xr = dx * cosY - dz * sinY;
            const zr = dx * sinY + dz * cosY;
            const hy = ((y == null ? yRef : y) - yRef) * HEIGHT_EXAGGERATION;
            // Tipped away from the viewer: up the screen, and toward them.
            const up   = zr * cosT - hy * sinT;
            const near = zr * sinT + hy * cosT;
            // The divide. Nearer is bigger, which is the whole point, and
            // the eye is far enough back that the far side of a circuit is
            // about three quarters the size of the near side rather than a
            // vanishing speck.
            const k = eye / Math.max(eye * 0.25, eye - near);
            return [xr * k, up * k, near];
        }
        : (x, z) => [x, z, 0];

    // The fit has to be measured on the projected shape, or turning the
    // circuit would push it out of frame. Flat does not pay for that: there
    // the projection is the identity, so the extents are the ones the pass
    // above already found, and walking every point twice to rediscover them
    // cost a flat redraw seventy per cent for a feature it is not using.
    let minU = minX, maxU = maxX, minV = minZ, maxV = maxZ;
    if (view3d) {
        minU = minV = Infinity; maxU = maxV = -Infinity;
        for (const path of [...allPaths, ...(basePath.length ? carPaths.values() : [])])
        for (const pt of path) {
            const q = world(pt[0], pt[1], pt[2]);
            if (q[0] < minU) minU = q[0]; if (q[0] > maxU) maxU = q[0];
            if (q[1] < minV) minV = q[1]; if (q[1] > maxV) maxV = q[1];
        }
    }

    const pad = 26;
    const spanX = Math.max(1, maxU - minU), spanZ = Math.max(1, maxV - minV);
    const scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanZ);
    const offX = (w - spanX * scale) / 2, offZ = (h - spanZ * scale) / 2;

    // The fitted projection above is the baseline; the reader's zoom and pan
    // ride on top of it, about the middle of the canvas. Keeping the fit
    // separate means the view survives the 1.5s redraw and the circuit still
    // reframes itself as more of it is traced.
    clampView(w, h, spanX * scale, spanZ * scale);
    const vs = view.scale, cx = w / 2, cy = h / 2;
    const px = u => cx + (offX + (u - minU) * scale - cx) * vs + view.x;
    const pz = v => cy + (offZ + (v - minV) * scale - cy) * vs + view.y;
    // One point, from the circuit to the screen. Everything that draws goes
    // through this, so flat and tilted cannot drift apart.
    const S = (x, z, y) => { const q = world(x, z, y); return [px(q[0]), pz(q[1])]; };
    // Line weights and markers are drawn in screen pixels, so they would
    // bloat with the zoom. Held roughly constant instead, which is what a
    // map should do, while still thickening a little so it does not look
    // spindly when zoomed right in.
    const zw = Math.max(0.6, Math.min(1.8, Math.pow(vs, 0.35)));

    // Only shade when there is a real climb to show. A circuit with ten
    // metres of elevation would otherwise be painted as dramatically as the
    // Nordschleife, which says something untrue about it.
    const relief = (maxY - minY) >= 15;

    g.lineJoin = 'round';
    g.lineCap = 'round';

    // The ground, before anything else and faintly, so the circuit sits on a
    // landscape rather than in a void. Only when tilted: on the flat map the
    // contours would be a second set of lines competing with the track for
    // attention and telling a reader nothing they can use.
    //
    // Deliberately NOT part of the fit above. The contours reach a couple of
    // kilometres past the circuit on every side, so framing them would shrink
    // the track to a scribble to show hills nobody is racing on. They are
    // drawn where they fall, and the ones off the edge are dropped.
    // The ground between the lines, shaded, under the contours that describe
    // it. Drawn as one quad per cell of a coarse height grid, lit the same way
    // the contours are and from the same direction, so the two agree.
    //
    // Opaque, deliberately. Semi-transparent neighbours sharing an edge blend
    // twice along it where both are antialiased, and a grid of them shows
    // every seam; the tone is taken most of the way to the background colour
    // instead, which looks the same and has no seams. Being opaque also means
    // the draw order settles what is in front of what, which matters once the
    // ground has hills in it that can hide the ground behind them.
    // Most of the landscape is off the edge of the canvas at any one moment,
    // and there is no point shading ground nobody can see. The margin is
    // generous so that something entering the frame is already being drawn by
    // the time its first corner arrives. Shared by the surface and the lines.
    const offW0 = -80, offE0 = w + 80, offN0 = -80, offS0 = h + 80;

    if (view3d && terrain && terrain.relief && terrain.relief.h) {
        const R = terrain.relief;
        const tc0 = terrain.centre || [0, 0];
        const tr0 = terrain.radius_m || 0;
        const dSpan0 = Math.max(1, maxV - minV);
        const hSpan = Math.max(1, maxY - minY);
        // Keyed by depth first and tone second, so the fills can go back to
        // front while still being batched: ten depths by twelve tones is at
        // worst a hundred and twenty fills for the whole landscape, against
        // one per cell, which would be thousands.
        const DEPTHS = 10, TONES = 16;
        const cells = new Map();
        const hAt = (i, j) => R.h[j * R.nx + i];
        for (let j = 0; j < R.nz - 1; j++) {
            for (let i = 0; i < R.nx - 1; i++) {
                const h00 = hAt(i, j), h10 = hAt(i + 1, j),
                      h01 = hAt(i, j + 1), h11 = hAt(i + 1, j + 1);
                if (h00 == null || h10 == null || h01 == null || h11 == null) continue;
                const x = R.x0 + i * R.step, z = R.z0 + j * R.step;
                const xm = x + R.step / 2, zm = z + R.step / 2;
                // Outside the disc, where the file's own contours stop.
                let edge = 1;
                if (tr0) {
                    const r = Math.hypot(xm - tc0[0], zm - tc0[1]) / tr0;
                    if (r >= 1) continue;
                    edge = Math.max(0, Math.min(1, (1 - r) / 0.34));
                }
                const p00 = S(x, z, h00), p10 = S(x + R.step, z, h10);
                const p11 = S(x + R.step, z + R.step, h11), p01 = S(x, z + R.step, h01);
                if ((p00[0] < offW0 && p10[0] < offW0 && p11[0] < offW0 && p01[0] < offW0)
                 || (p00[0] > offE0 && p10[0] > offE0 && p11[0] > offE0 && p01[0] > offE0)
                 || (p00[1] < offN0 && p10[1] < offN0 && p11[1] < offN0 && p01[1] < offN0)
                 || (p00[1] > offS0 && p10[1] > offS0 && p11[1] > offS0 && p01[1] > offS0)) continue;
                // The cell's own slope, straight from its four corners, which
                // is cheaper and smoother than anything stored per point.
                const dzdx = (h10 + h11 - h00 - h01) / 2;
                const dzdz = (h01 + h11 - h00 - h10) / 2;
                // Gentle ground gets gentle shading, but "gentle" has to be
                // measured against the ground there actually is. The first
                // figure here saturated at a 22% slope, which left the median
                // Eifel cell at half shading and the landscape nearly flat;
                // measured, half the cells change by 16 m across 150 and a
                // tenth by 36, so saturating at 18 m puts the middle of the
                // range at full strength while leaving the drop into the
                // Adenau valley somewhere to go.
                const sh = (dzdx === 0 && dzdz === 0) ? 0.5
                    : 0.5 + 0.5 * Math.cos(Math.atan2(dzdz, dzdx) - LIGHT_FROM)
                          * Math.min(1, Math.hypot(dzdx, dzdz) / (R.step * 0.12));
                const t = Math.max(0, Math.min(1,
                    ((h00 + h10 + h01 + h11) / 4 - minY) / hSpan));
                const q = world(xm, zm, (h00 + h10 + h01 + h11) / 4);
                const depth = Math.max(0, Math.min(1, (q[2] - minV) / dSpan0));
                const dk = Math.min(DEPTHS - 1, Math.floor(depth * DEPTHS));
                // Height, light and both fades in one number, so that none of
                // them costs a fill.
                //
                // Height carries more of it than the flat floor it replaced.
                // A constant floor lit every valley as brightly as the ridge
                // above it, which is the one thing that stops a relief
                // reading as relief: low ground should go towards the dark
                // whatever the light is doing to it, so the eye reads depth
                // from the altitude as well as from the shading.
                const tone = Math.min(TONES - 1, Math.max(0, Math.floor(
                    (0.03 + 0.42 * t + 0.55 * sh) * edge * (0.45 + 0.55 * depth) * TONES)));
                const key = dk * TONES + tone;
                let bucket = cells.get(key);
                if (!bucket) cells.set(key, bucket = []);
                bucket.push(p00, p10, p11, p01);
            }
        }
        for (const key of [...cells.keys()].sort((a, b) => a - b)) {
            const b = ((key % TONES) + 0.5) / TONES;
            // Dark, and never far from the background: this is ground to read
            // the circuit against, not scenery to look at instead of it. A
            // first attempt ran to a mid grey and the landscape took the page
            // over, which is the opposite of what shading it was meant to do.
            // The span matters as much as the top of it. Dimming the peak and
            // darkening the valleys at the same time squeezed the whole
            // landscape into sixteen greys above the background and the lit
            // ridges lost their punch, so the top goes back up while the
            // altitude weighting above keeps the average down where it
            // belongs. Turning the mass down is not the same as flattening it.
            const col = `rgb(${Math.round(9 + 30 * b)},${Math.round(12 + 34 * b)},`
                      + `${Math.round(17 + 43 * b)})`;
            g.fillStyle = col;
            g.strokeStyle = col;
            g.lineWidth = 1;
            g.beginPath();
            const quads = cells.get(key);
            for (let i = 0; i < quads.length; i += 4) {
                g.moveTo(quads[i][0], quads[i][1]);
                g.lineTo(quads[i + 1][0], quads[i + 1][1]);
                g.lineTo(quads[i + 2][0], quads[i + 2][1]);
                g.lineTo(quads[i + 3][0], quads[i + 3][1]);
                g.closePath();
            }
            g.fill();
            // The same path stroked in its own colour, which covers the
            // hairline the antialiasing leaves between neighbours.
            g.stroke();
        }
    }

    if (view3d && terrain) {
        // Faded three ways, so the landscape has no edge to find. The file is
        // a disc rather than a square, which removes the corners; this takes
        // the rim of that disc down to nothing, so there is no line where the
        // ground stops however far you turn it.
        //
        // Drawn segment by segment rather than as one path per contour,
        // because the fade varies along a contour: a line that runs from the
        // near side to the far side of the circuit is nearly invisible at one
        // end and clear at the other, which is what distance looks like.
        const tc = terrain.centre || [0, 0];
        const tr = terrain.radius_m || 0;
        const dSpan = Math.max(1, maxV - minV);
        const fade = new Map();
        const offW = offW0, offE = offE0, offN = offN0, offS = offS0;
        for (const line of terrain.lines) {
            const pts = line.p;
            if (pts.length < 2) continue;
            // The whole contour off one edge of the frame: four corners
            // instead of two hundred points. Perspective keeps a box convex,
            // so a box entirely past one edge has nothing inside the frame.
            if (line.b) {
                const [x0, z0, x1, z1] = line.b;
                let bw = Infinity, be = -Infinity, bn = Infinity, bs = -Infinity;
                for (const c of [[x0, z0], [x1, z0], [x0, z1], [x1, z1]]) {
                    const s = S(c[0], c[1], line.h);
                    if (s[0] < bw) bw = s[0]; if (s[0] > be) be = s[0];
                    if (s[1] < bn) bn = s[1]; if (s[1] > bs) bs = s[1];
                }
                if (be < offW || bw > offE || bs < offN || bn > offS) continue;
            }
            // Higher ground a little brighter, the same idea as the track's
            // own shading, so the eye reads the landscape as rising.
            const t = Math.max(0, Math.min(1, (line.h - minY) / Math.max(1, maxY - minY)));
            const asp = line.a;
            let prev = S(pts[0][0], pts[0][1], line.h);
            let prevW = pts[0];
            for (let i = 1; i < pts.length; i++) {
                const cur = S(pts[i][0], pts[i][1], line.h);
                const wp = pts[i];
                const a0 = prev, prevPt = prevW;
                prev = cur; prevW = wp;
                if ((a0[0] < offW && cur[0] < offW) || (a0[0] > offE && cur[0] > offE)
                 || (a0[1] < offN && cur[1] < offN) || (a0[1] > offS && cur[1] > offS)) continue;
                // How near the rim this bit of ground is. The outer third of
                // the disc fades out.
                let edge = 1;
                if (tr) {
                    const r = Math.hypot((wp[0] + prevPt[0]) / 2 - tc[0],
                                         (wp[1] + prevPt[1]) / 2 - tc[1]) / tr;
                    edge = Math.max(0, Math.min(1, (1 - r) / 0.34));
                }
                // And how far from the viewer, which is the haze. Measured
                // the same way the track's own depth fade is, so the ground
                // and the circuit on it recede together.
                const q = world(wp[0], wp[1], line.h);
                const depth = Math.max(0, Math.min(1, (q[2] - minV) / dSpan));
                const alpha = 0.40 * edge * (0.25 + 0.75 * depth);
                if (alpha > 0.012) {
                    // Lit from one side, which is what turns a tangle of
                    // hairlines into hills. Tanaka's trick, and the reason it
                    // works on lines rather than a filled surface: a contour
                    // running across a slope that faces the light is drawn
                    // bright, one on the slope behind it is drawn dark, and
                    // the eye assembles the ridge between them by itself.
                    //
                    // The file says which way is uphill at each point, since
                    // the geometry cannot: marching squares emits a cell's two
                    // ends in whatever order its case table gives.
                    const sh = asp ? 0.5 + 0.5 * Math.cos(
                        (asp[i] / ASPECT_STEPS) * Math.PI * 2 - LIGHT_FROM) : 0.5;
                    // Height and light together, as one brightness, so that
                    // shading costs no extra strokes. Keying on tone rather
                    // than on a colour per contour level actually costs fewer:
                    // six tones against seventeen levels.
                    const tone = Math.min(TONE_STEPS - 1, Math.max(0, Math.floor(
                        (0.18 + 0.38 * t + 0.62 * sh) * TONE_STEPS)));
                    // Collected into a few steps rather than stroked one at a
                    // time. A stroke per segment came to 3,727 of them and
                    // 5.7 ms, which a drag would feel; eight steps of fade are
                    // invisible on a hairline and cost a stroke each.
                    const step = Math.min(FADE_STEPS - 1, Math.floor(alpha / 0.40 * FADE_STEPS));
                    const key = tone + '|' + step;
                    let bucket = fade.get(key);
                    if (!bucket) fade.set(key, bucket = []);
                    bucket.push(a0[0], a0[1], cur[0], cur[1]);
                }
            }
        }
        for (const [key, segs] of fade) {
            const [toneS, step] = key.split('|');
            const k = (Number(step) + 0.5) / FADE_STEPS;
            const b = (Number(toneS) + 0.5) / TONE_STEPS;
            // Cool and nearly black where the slope turns away, near white
            // where it faces the light. One ramp, so the landscape reads as
            // one material rather than as coloured bands.
            //
            // The light works on the opacity as well as the colour, and that
            // is what makes it read at all. A contour capped at 0.40 alpha
            // over a near-black ground has so little range left that a
            // brightness ramp inside it is almost invisible; letting the
            // shaded side fade towards the background as well as darken gives
            // four times the contrast for nothing, since both are set once
            // per bucket either way.
            const op = Math.min(0.78, 0.40 * k * (0.35 + 1.10 * b));
            g.strokeStyle = `rgba(${Math.round(48 + 174 * b)},`
                + `${Math.round(60 + 170 * b)},${Math.round(80 + 150 * b)},`
                + `${op.toFixed(3)})`;
            // Lit contours are drawn a shade heavier as well as brighter,
            // which is the other half of the same trick.
            g.lineWidth = (0.6 + 0.7 * k) * (0.78 + 0.44 * b);
            g.beginPath();
            for (let i = 0; i < segs.length; i += 4) {
                g.moveTo(segs[i], segs[i + 1]);
                g.lineTo(segs[i + 2], segs[i + 3]);
            }
            g.stroke();
        }
    }

    // A dark edge under the circuit, so it sits ON the landscape instead of
    // being tangled in it. Without it the gold line and the contours are two
    // sets of lines at the same depth and the eye has to work out which is
    // which; a couple of pixels of near-black either side and the track reads
    // as the nearer object immediately. Drawn in one pass over the whole
    // outline, so it costs a single stroke, and only when there is terrain
    // under it to be separated from.
    if (view3d && terrain) {
        g.strokeStyle = 'rgba(5,6,8,0.85)';
        g.lineWidth = 2.5 * zw + 3.5;
        g.beginPath();
        for (const path of allPaths) {
            let started = false;
            for (let i = 0; i < path.length - 1; i++) {
                const a = path[i], b = path[i + 1];
                if (b[3] || Math.hypot(b[0] - a[0], b[1] - a[1]) > MAX_SEGMENT_M) {
                    started = false; continue;
                }
                const p1 = S(a[0], a[1], a[2]);
                if (!started) { g.moveTo(p1[0], p1[1]); started = true; }
                const p2 = S(b[0], b[1], b[2]);
                g.lineTo(p2[0], p2[1]);
            }
        }
        g.stroke();
    }

    // The track itself: every car's whole path, joined into lines, in one
    // colour.
    //
    // It used to be coloured by height, cool and dark at the bottom of the
    // circuit and warm and bright at the top, which was the only way the map
    // had of showing elevation at all. The landscape shows it now, and far
    // better, so that colouring was doing a job already done and charging
    // legibility for it: the low sections came out a dark blue sitting in
    // almost the same place as the shaded ground, and the circuit vanished
    // into the terrain exactly where the terrain was darkest.
    //
    // So: the circuit is gold, all of it, and the ground underneath says how
    // high each part of it is.
    g.lineWidth = 2.5 * zw;
    if (view3d) {
        // Still grouped by depth, which is not about colour. A bit of track in
        // front of another has to be drawn after it: at the Nordschleife that
        // is not a nicety, since the circuit passes under itself at
        // Breidscheid and in path order the bridge goes beneath the road it
        // crosses. Sixteen depths, where this used to be sixteen depths times
        // twelve height bands, so dropping the colour took 192 strokes down to
        // 16.
        const buckets = DEPTH_BUCKETS;
        const bands = Array.from({ length: buckets }, () => []);
        const dSpan = Math.max(1, maxV - minV);
        for (const path of allPaths) {
            for (let i = 0; i < path.length - 1; i++) {
                const a = path[i], b = path[i + 1];
                if (b[3] || Math.hypot(b[0] - a[0], b[1] - a[1]) > MAX_SEGMENT_M) continue;
                const qa = world(a[0], a[1], a[2]), qb = world(b[0], b[1], b[2]);
                const d = ((qa[2] + qb[2]) / 2 - minV) / dSpan;
                bands[Math.min(buckets - 1, Math.max(0, Math.floor(d * buckets)))].push(a, b);
            }
        }
        bands.forEach((segs, key) => {
            if (!segs.length) return;
            // Far track fainter and finer than near, which is the depth cue
            // the height colouring was never giving. The grouping needed for
            // draw order already knows how far away each segment is, so this
            // costs nothing.
            const depth = buckets > 1 ? key / (buckets - 1) : 1;
            const a = 0.78 + 0.22 * depth;
            g.lineWidth = 2.5 * zw * (DEPTH_WIDTH[0] + (DEPTH_WIDTH[1] - DEPTH_WIDTH[0]) * depth);
            g.strokeStyle = `rgba(255,209,102,${a.toFixed(3)})`;
            g.beginPath();
            for (let i = 0; i < segs.length; i += 2) {
                const p1 = S(segs[i][0], segs[i][1], segs[i][2]);
                const p2 = S(segs[i + 1][0], segs[i + 1][1], segs[i + 1][2]);
                g.moveTo(p1[0], p1[1]);
                g.lineTo(p2[0], p2[1]);
            }
            g.stroke();
        });
    } else {
        g.strokeStyle = 'rgba(255,209,102,0.85)';
        for (const path of allPaths) strokePath(g, path, S, 0, path.length - 1);
    }

    // Each car: its badge, then its number. A focused split dims the rest
    // rather than removing them, so you can still see where the others are
    // relative to the ones you are watching.
    g.font = "bold 10px 'Inter', system-ui, sans-serif";
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    // Nearest last, so a car in front of another covers it rather than the
    // other way about. Only worth the sort when there is a depth to sort by.
    const order = view3d
        ? [...rows].sort((a, b) => (world(a.x, a.z, a.y)[2]) - (world(b.x, b.z, b.y)[2]))
        : rows;
    order.forEach(r => {
        if (r.x == null || r.z == null) return;
        // At a different circuit entirely: listed in the table, but drawing
        // it here would put a marker in the middle of nowhere and drag the
        // frame out to reach it.
        if (strays.has(r.driver_id)) return;
        const stale = (r.age_ms ?? 0) > 30000;
        if (stale) return;
        // Hovering a row in the list picks that car out of the field. The
        // others dim rather than disappear, so you can still see where the
        // one you are looking at sits among them.
        const hot = hoveredDriver === r.driver_id;
        const dim = (focusedSplit !== null && String(r.lobby_number ?? 0) !== focusedSplit)
                 || (hoveredDriver !== null && !hot);
        const col = carColour(r);
        // No tail behind the car any more. It was never decoration: before a
        // circuit had a traced outline, the accumulated car paths WERE the
        // map, and the bright end of each one was simply the live part of it.
        // With an outline and terrain under it the tail is a leftover from
        // the version of this page that had neither, and it brought its own
        // failure modes with it: a line drawn across the infield to the pit
        // box, and a tail left stranded on the circuit by a driver who quit.
        //
        // carPaths stays. On a circuit nobody has traced yet it is still the
        // whole map, which is what `allPaths` falls back to.
        g.globalAlpha = dim ? 0.3 : (r.on_track ? 1 : 0.35);
        // A ring round the hovered car, drawn under its dot. Wide and pale
        // in the car's own colour, so it reads against the gold line and
        // against the dark infield without needing a second colour.
        const car = S(r.x, r.z, r.y);
        const num = carNumber(r, rows[0]?.mode);
        const label = num == null ? '' : String(num);
        // The badge grows to fit the number rather than the number shrinking
        // to fit the badge. A fixed circle held two digits and no more, so a
        // three-figure car number ran off both sides of it and was the one
        // thing on the map you could not read. One and two digits still get a
        // circle, since the pill is only as wide as it has to be.
        const rad = hot ? 9 : 7;
        const half = Math.max(rad, badgeHalfWidth(g, label) + 3.5);
        if (hot) {
            g.globalAlpha = 0.35;
            g.strokeStyle = col;
            g.lineWidth = 5;
            pillPath(g, car[0], car[1], half + 6, rad + 6);
            g.stroke();
            g.globalAlpha = r.on_track ? 1 : 0.35;
        }
        g.fillStyle = col;
        pillPath(g, car[0], car[1], half, rad);
        g.fill();
        if (label) {
            // Font and alignment are set once before the loop: assigning them
            // per car forces a style recalculation each time, sixty times a
            // redraw, and they never change.
            g.fillStyle = '#050608';
            g.fillText(label, car[0], car[1] + 0.5);
        }
        g.globalAlpha = 1;
    });

    if (note) {
        const km = (Math.max(maxX - minX, maxZ - minZ) / 1000).toFixed(1);
        // The old readout was a diagnostic, useful while building this and
        // not interesting to a spectator. Kept on hover, where it costs
        // nobody anything and still answers "is the outline saved".
        note.title = `${total.toLocaleString()} positions`
            + `${basePath.length ? ' (outline saved)' : ''} · about ${km} km across`
            + (relief ? ` · ${Math.round(maxY - minY)} m of climb` : '')
            + (view3d ? ` · height exaggerated ${HEIGHT_EXAGGERATION}x` : '');
        setFacts(buildFacts(rows, { km, relief, climb: Math.round(maxY - minY), total }));
    }
}

// ---------------------------------------------------------------
// The line beside Track Map, cycling through things worth knowing.
//
// Everything here is either measured from the outline the cars have just
// drawn, or taken from GTEC's own history. Nothing is hand-written per
// circuit, so a track nobody has raced before still has something to say
// the first time a car goes round it.
// ---------------------------------------------------------------
let factList = [];
let factIndex = 0;
let factTimer = null;
let circuitRecord = null;      // { best_lap_ms, driver_name, event_name }
let circuitAsked = null;       // event id we already looked the record up for

function buildFacts(rows, geo) {
    const f = [];

    // Which split is on the map used to be a fact here, and it was the wrong
    // place for it: the notes rotate, and a viewer needs to know which split
    // they are watching at any moment rather than every twentieth second. It
    // is in the map's title now, which holds still.

    // The point most people miss: this is not a stock graphic. The drivers
    // drew it, tonight, by driving round it.
    if (geo.total > 2) {
        f.push(`Nobody drew this map. The cars traced it themselves, ${geo.total.toLocaleString()} positions so far`);
    }
    if (geo.relief && geo.climb >= 15) {
        // Said plainly now. The track used to be shaded by height and this
        // line pointed at that; the landscape under it carries the elevation
        // instead, and the circuit is one colour.
        f.push(`${geo.climb} m between its highest and lowest points`);
    }
    if (Number(geo.km) > 0) f.push(`About ${geo.km} km from end to end`);

    // GTEC's own record at this circuit, which GT7 has no way of knowing.
    if (circuitRecord && circuitRecord.best_lap_ms) {
        f.push(`GTEC lap record here: ${lapTime(circuitRecord.best_lap_ms)}`
            + (circuitRecord.driver_name ? ` by ${esc(circuitRecord.driver_name)}` : ''));
    }

    // Best of whoever is actually out, and how it stands against the record.
    const bests = rows.map(bestLap).filter(v => v != null && v > 0);
    if (bests.length) {
        const best = Math.min(...bests);
        const who = rows.find(r => bestLap(r) === best);
        // One line, not two: a standalone "that is 3.3s off the record" can
        // surface on its own in the cycle, with nothing to say what "that" was.
        const delta = circuitRecord?.best_lap_ms ? best - circuitRecord.best_lap_ms : null;
        f.push(`Best out there right now: ${lapTime(best)}`
            + (who?.display_name ? ` by ${esc(who.display_name)}` : '')
            + (delta === null ? ''
               : delta > 0 ? `, ${(delta / 1000).toFixed(1)}s off the GTEC record`
                           : `, under the GTEC record`));
    }

    return f;
}

function setFacts(list) {
    // Rebuilt on every poll, so only restart the cycle when the content
    // actually changed. Otherwise a 1.5s poll would reset the fade forever
    // and nothing would ever be readable.
    if (list.join('|') === factList.join('|')) return;
    factList = list;
    if (factIndex >= list.length) factIndex = 0;
    paintFact();
    if (factTimer) clearInterval(factTimer);
    if (list.length > 1) factTimer = setInterval(nextFact, 7000);
}

function paintFact() {
    const note = document.getElementById('map-note');
    if (!note) return;
    note.innerHTML = factList[factIndex] || '';
}

function nextFact() {
    const note = document.getElementById('map-note');
    if (!note || factList.length < 2) return;
    factIndex = (factIndex + 1) % factList.length;
    note.classList.add('fading');
    // Swap while invisible, then fade back in.
    setTimeout(() => { paintFact(); note.classList.remove('fading'); }, 450);
}

// Contour lines for the ground around a circuit, baked once per circuit by
// tools/terrain_contours.py and shipped as a static file. Keyed by the
// circuit's name because that is what the events table holds; a circuit with
// no file simply gets no terrain.
//
// The heights in the file are in GT7's own vertical frame, already matching
// live_track_path.y, so nothing here has to know about sea level.
// Matched on words rather than on the whole string. An exact match meant one
// different dash, or an umlaut encoded another way, silently produced no
// terrain at all and nothing to show for it, which is exactly what happened
// the first time this went live.
const TERRAIN = [
    { slug: 'nurburgring-24h', needs: ['nordschleife', '24'] },
];

function terrainSlug(name) {
    const n = (name || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // umlauts and friends
        .replace(/[^a-z0-9]+/g, ' ').trim();
    for (const t of TERRAIN) {
        if (t.needs.every(w => n.includes(w))) return t.slug;
    }
    return null;
}

let terrain = null, terrainAsked = null;

async function loadTerrain(circuitName) {
    const slug = terrainSlug(circuitName);
    if (!slug || terrainAsked === slug) return;
    terrainAsked = slug;
    try {
        const r = await fetch(`/endurance/assets/terrain/${slug}.json`);
        if (!r.ok) return;
        const d = await r.json();
        if (Array.isArray(d.lines)) {
            // A box round each contour, worked out once. Most of the landscape
            // is off the edge of the canvas at any one angle, and four corners
            // is a far cheaper way to find that out than projecting the two
            // hundred points of a contour that is nowhere near the frame.
            for (const line of d.lines) {
                let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
                for (const p of line.p) {
                    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
                    if (p[1] < z0) z0 = p[1]; if (p[1] > z1) z1 = p[1];
                }
                line.b = [x0, z0, x1, z1];
            }
            terrain = d;
            // Credit where it is due, and only while it is on screen.
            const c = document.getElementById('terrain-credit');
            if (c) c.hidden = false;
            if (lastRows) drawTrack(lastRows);
        }
    } catch (_) {
        // No terrain is a missing backdrop, not a broken map.
    }
}

/** The circuit's GTEC record and this season's form, looked up once per
 *  round. Both are public views, so this needs no migration and no sign-in. */
async function loadCircuitRecord(eventId) {
    if (!eventId || circuitAsked === eventId) return;
    circuitAsked = eventId;
    try {
        const { data: ev } = await sb.from('events')
            .select('circuit_name, season_id').eq('id', eventId).maybeSingle();
        if (ev?.circuit_name) {
            const { data: rec } = await sb.from('circuit_records')
                .select('best_lap_ms, driver_name, event_name')
                .eq('circuit_name', ev.circuit_name)
                .maybeSingle();
            if (rec) circuitRecord = rec;
        }
        if (ev?.circuit_name) loadTerrain(ev.circuit_name);
        if (ev?.season_id) await loadDriverCards(ev.season_id);
    } catch (_) {
        // A missing record is not worth a broken map.
    }
}

// ---------------------------------------------------------------
// Driver card on hover.
//
// What the timing table cannot show without becoming a spreadsheet: where
// this driver stands in the championship, what their rating is, and how
// their season has gone. All of it from public views, fetched once per round
// rather than per hover, so pointing at a name costs nothing.
// ---------------------------------------------------------------
const driverCards = new Map();   // driver_id -> facts

async function loadDriverCards(seasonId) {
    // The whole season's standings, because a championship position is a
    // rank among everyone, not a property of one driver.
    const [stand, rate] = await Promise.all([
        sb.from('driver_standings')
          .select('driver_id, points, races, wins, podiums, poles, fastest_laps, team_name, manufacturer_name, brand_color, career_number')
          .eq('season_id', seasonId),
        sb.from('driver_current_ratings')
          .select('driver_id, rating, peak_rating, last_delta, nationality, team_name, manufacturer_name, brand_color, career_number'),
    ]);

    const rows = (stand.data || []).slice()
        .sort((a, b) => Number(b.points ?? 0) - Number(a.points ?? 0));
    const leader = rows.length ? Number(rows[0].points ?? 0) : null;

    driverCards.clear();
    rows.forEach((r, i) => driverCards.set(r.driver_id, {
        pos: i + 1,
        of: rows.length,
        points: Number(r.points ?? 0),
        behind: leader == null ? null : leader - Number(r.points ?? 0),
        races: r.races, wins: r.wins, podiums: r.podiums,
        poles: r.poles, fastest_laps: r.fastest_laps,
        team_name: r.team_name, manufacturer_name: r.manufacturer_name,
        brand_color: r.brand_color, career_number: r.career_number,
    }));

    (rate.data || []).forEach(r => {
        const e = driverCards.get(r.driver_id) || {};
        // A driver with a rating but no points yet still deserves a card.
        driverCards.set(r.driver_id, Object.assign(e, {
            rating: r.rating == null ? null : Math.round(r.rating),
            peak: r.peak_rating == null ? null : Math.round(r.peak_rating),
            delta: r.last_delta == null ? null : Math.round(r.last_delta),
            nationality: r.nationality,
            team_name: e.team_name || r.team_name,
            manufacturer_name: e.manufacturer_name || r.manufacturer_name,
            brand_color: e.brand_color || r.brand_color,
            career_number: e.career_number ?? r.career_number,
        }));
    });
}

function cardHtml(row) {
    const c = driverCards.get(row.driver_id);
    const num = row.car_number ?? c?.career_number;
    const line = [c?.team_name, c?.manufacturer_name].filter(Boolean).join(' · ');

    // Nothing loaded yet, or a driver with no season history at all. Say so
    // rather than showing a card full of dashes.
    if (!c || (c.points == null && c.rating == null)) {
        return `<div class="dc-top"><span class="dc-name">${esc(row.display_name)}</span>
            ${num != null ? `<span class="dc-num">#${num}</span>` : ''}</div>
            ${line ? `<div class="dc-team">${esc(line)}</div>` : ''}
            <div class="dc-foot"><span>No championship record yet</span></div>`;
    }

    const d = c.delta;
    const deltaHtml = d == null || d === 0 ? ''
        : `<small class="${d > 0 ? 'dc-up' : 'dc-down'}">${d > 0 ? '+' : ''}${d}</small>`;

    const cells = [];
    if (c.points != null) {
        cells.push(['Championship', `P${c.pos}<small>of ${c.of}</small>`]);
        // "86 -18" reads as a subtraction. Spelled out instead, and left off
        // entirely for whoever is leading.
        cells.push(['Points', `${c.points}${c.behind ? `<small>${c.behind} behind</small>` : ''}`]);
    }
    if (c.rating != null) {
        cells.push(['Elo', `${c.rating}${deltaHtml}`]);
        if (c.peak != null && c.peak > c.rating) cells.push(['Peak', `${c.peak}`]);
    }

    const season = [
        c.races ? `${c.races} race${c.races === 1 ? '' : 's'}` : null,
        c.wins ? `${c.wins} win${c.wins === 1 ? '' : 's'}` : null,
        c.podiums ? `${c.podiums} podium${c.podiums === 1 ? '' : 's'}` : null,
    ].filter(Boolean).join(' · ');

    return `<div class="dc-top">
            <span class="dc-name">${esc(row.display_name)}</span>
            ${num != null ? `<span class="dc-num">#${num}</span>` : ''}
        </div>
        ${line ? `<div class="dc-team">${esc(line)}</div>` : ''}
        <div class="dc-grid">${cells.map(([k, v]) =>
            `<div><div class="dc-k">${k}</div><div class="dc-v">${v}</div></div>`).join('')}</div>
        <div class="dc-foot">
            <span>${season || 'No races yet'}</span>
            ${c.nationality ? `<span>${esc(c.nationality)}</span>` : ''}
        </div>`;
}

let cardEl = null;
function showCard(target, driverId) {
    if (!cardEl) return;
    const row = (lastRows || []).find(r => r.driver_id === driverId);
    if (!row) return;
    cardEl.innerHTML = cardHtml(row);

    const c = driverCards.get(driverId);
    // Borrow the manufacturer's colour for the accent, so a card for a Porsche
    // driver does not look identical to one for a Ferrari driver.
    cardEl.querySelector('.dc-top').style.borderLeftColor = c?.brand_color || 'var(--gold)';

    // Measure after filling: the card's height depends on how many cells it has.
    cardEl.classList.add('on');
    const r = target.getBoundingClientRect();
    const box = cardEl.getBoundingClientRect();
    const gap = 10;
    let left = r.left;
    let top = r.bottom + gap;
    if (left + box.width > window.innerWidth - 12) left = window.innerWidth - box.width - 12;
    if (left < 12) left = 12;
    // Flip above when there is no room below.
    if (top + box.height > window.innerHeight - 12) top = Math.max(12, r.top - box.height - gap);
    cardEl.style.left = left + 'px';
    cardEl.style.top = top + 'px';
}

function hideCard() { if (cardEl) cardEl.classList.remove('on'); }

function bindDriverCards() {
    const shell = document.getElementById('live-shell');
    const splits = document.getElementById('live-splits');
    if (!shell || !splits || splits.dataset.carded) return;
    splits.dataset.carded = '1';

    if (!cardEl) {
        cardEl = document.createElement('div');
        cardEl.className = 'dcard';
        cardEl.setAttribute('role', 'tooltip');
        shell.appendChild(cardEl);
    }

    // Delegated, so it survives the tables being rewritten every poll.
    const nameAt = e => e.target.closest?.('.who[data-driver]');
    const rowAt  = e => e.target.closest?.('tr[data-driver]');

    // Redrawn at once rather than at the next poll, or the highlight would
    // arrive up to a second and a half after the pointer did.
    const hover = (id) => {
        if (hoveredDriver === id) return;
        hoveredDriver = id;
        if (lastRows) drawTrack(lastRows);
    };
    splits.addEventListener('mouseover', e => {
        const row = rowAt(e);
        if (row) hover(row.dataset.driver);
    });
    splits.addEventListener('mouseleave', () => hover(null));
    splits.addEventListener('focusin',  e => {
        const row = rowAt(e);
        if (row) hover(row.dataset.driver);
    });
    splits.addEventListener('focusout', () => hover(null));
    splits.addEventListener('mouseover', e => {
        const el = nameAt(e);
        if (el) showCard(el, el.dataset.driver);
    });
    splits.addEventListener('mouseout', e => {
        const el = nameAt(e);
        if (el && !el.contains(e.relatedTarget)) hideCard();
    });
    splits.addEventListener('focusin', e => {
        const el = nameAt(e);
        if (el) showCard(el, el.dataset.driver);
    });
    splits.addEventListener('focusout', hideCard);

    // Touch: a tap opens the card without following anything, and the next
    // tap anywhere closes it.
    splits.addEventListener('click', e => {
        const el = nameAt(e);
        if (!el) return;
        e.stopPropagation();
        if (cardEl.classList.contains('on') && cardEl.dataset.for === el.dataset.driver) { hideCard(); return; }
        cardEl.dataset.for = el.dataset.driver;
        showCard(el, el.dataset.driver);
    });
    document.addEventListener('click', hideCard);
    window.addEventListener('scroll', hideCard, { passive: true });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });
}

let failures = 0;
let lastRows = null;       // so a click redraws at once rather than at the next poll

// ---------------------------------------------------------------
// Lap times, while they are happening.
//
// The whole log of a round is a separate page, which is where a finished
// race belongs. A race that is running wants its pace on the same screen as
// the map: who is holding it, who is dropping away, and where the stops
// went. The table above says what each car is doing now; this says what it
// has been doing for the last hour.
//
// Fetched from a marker rather than refetched. live_lap_feed returns the
// laps recorded after the highest id already held, which is nothing at all
// on most polls and one row when somebody crosses the line, so this costs
// about as much as asking whether anything happened.
// ---------------------------------------------------------------
/** A lap time for an axis label, where thousandths are only clutter. */
function axisTime(ms) {
    const t = Math.max(0, Math.round(ms / 100) / 10);
    const m = Math.floor(t / 60);
    return m > 0 ? `${m}:${(t - m * 60).toFixed(1).padStart(4, '0')}` : t.toFixed(1);
}

const LAP_FEED_MS  = 10000;   // laps take minutes; this is still immediate
const LAP_MAX_LINES = 10;     // beyond this the chart is a ball of wool

let lapRows = [], lapAfterId = null, lapKey = null, lapAt = 0, lapBusy = false;
let lapScopeKey = null;
const lapOff = new Set();     // cars the viewer has switched off

async function loadLaps(ev) {
    // A different round, or the same round in a different session, is a
    // different log: the race's laps are not a continuation of qualifying's.
    const key = `${ev.event_id}|${ev.mode}`;
    if (key !== lapKey) {
        lapKey = key; lapRows = []; lapAfterId = null; lapAt = 0;
        lapScopeKey = null; lapOff.clear();
    } else if (lapBusy || Date.now() - lapAt < LAP_FEED_MS) {
        return;
    }
    lapBusy = true;
    try {
        const { data, error } = await sb.rpc('live_lap_feed', {
            p_event_id: ev.event_id, p_mode: ev.mode, p_after_id: lapAfterId });
        lapAt = Date.now();
        if (error || !data || !data.length) return;
        lapRows = lapRows.concat(data);
        lapAfterId = data[data.length - 1].id;   // the feed is ordered by it
        drawLapChart();
    } finally { lapBusy = false; }
}

/** The chart follows the map: a focused split shows that split alone. */
function lapCars() {
    const scope = focusedSplit === null ? lapRows
        : lapRows.filter(l => String(l.lobby_number ?? 0) === focusedSplit);
    const by = new Map();
    for (const l of scope) {
        let c = by.get(l.driver_id);
        if (!c) by.set(l.driver_id, c = {
            driver_id: l.driver_id, name: l.display_name,
            number: l.car_number, lobby: l.lobby_number, pts: [], best: Infinity });
        c.pts.push(l);
        if (l.lap_ms < c.best) c.best = l.lap_ms;
    }
    return [...by.values()].sort((a, b) => a.best - b.best);
}

/** The colour this car is on the map, so the two agree at a glance. */
function lapColour(c) {
    const r = (lastRows || []).find(x => x.driver_id === c.driver_id);
    return r ? carColour(r) : splitColour(c.lobby);
}

function drawLapChart() {
    const cv = document.getElementById('lap-chart');
    if (!cv) return;
    const cars = lapCars();
    const empty = document.getElementById('lap-empty');
    const note  = document.getElementById('lap-note');
    const chips = document.getElementById('lap-cars');

    // Which split this is about, said the same way the map says it, because
    // the two are showing the same cars and sit one above the other.
    const title = document.getElementById('lap-title');
    if (title) {
        const name = focusedSplit === null ? null
            : focusedSplit === '0' ? 'Unassigned' : 'Split ' + focusedSplit;
        title.innerHTML = name
            ? `Lap Times <span class="map-only">&middot; ${esc(name)}</span>`
            : 'Lap Times';
    }

    // Opening on sixteen lines on top of each other reads as noise, so the
    // quickest are drawn and the rest are one click away. Worked out when
    // the set of cars in view changes, not on every redraw, or a viewer's
    // own choices would be undone by the next lap anybody completed.
    // Not before there is anything to choose between: the card is drawn once
    // on the first poll, before the log has arrived, and settling the default
    // against an empty list left every car switched on for the rest of the
    // session however many of them turned up.
    const scopeKey = focusedSplit ?? 'all';
    if (cars.length && scopeKey !== lapScopeKey) {
        lapScopeKey = scopeKey;
        lapOff.clear();
        cars.slice(LAP_MAX_LINES).forEach(c => lapOff.add(c.driver_id));
    }

    if (!cars.length) {
        cv.hidden = true; chips.hidden = true; empty.hidden = false;
        empty.innerHTML = `Lap times appear here as cars cross the line.<br>
            A car's first lap is never kept: a lap only counts once it has been
            watched from one crossing of the line to the next.`;
        if (note) note.textContent = '';
        return;
    }
    cv.hidden = false; chips.hidden = false; empty.hidden = true;

    // With the count, because a car can have laps in the log and almost
    // nothing on the chart: a lap above the scale is a ring at the ceiling
    // and breaks the line either side of it, so a car with two laps, one of
    // them an out-lap, is drawn as a single dot. That looks like a car we
    // missed. The number says what was actually recorded.
    chips.innerHTML = cars.map(c => `<button type="button"
        class="chart-chip${lapOff.has(c.driver_id) ? ' off' : ''}"
        style="color:${lapColour(c)}" data-driver="${c.driver_id}"
        title="${c.pts.length} lap${c.pts.length === 1 ? '' : 's'} recorded, best ${esc(lapTime(c.best))}">
        <span class="dot"></span>${esc(c.name)}
        <span class="chip-n">${c.pts.length}</span></button>`).join('');
    chips.onclick = e => {
        const chip = e.target.closest('.chart-chip');
        if (!chip) return;
        const id = chip.dataset.driver;
        if (lapOff.has(id)) lapOff.delete(id); else lapOff.add(id);
        drawLapChart();
    };

    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    const drawn = cars.filter(c => !lapOff.has(c.driver_id));
    if (!drawn.length) {
        g.fillStyle = '#94a3b8';
        g.font = "12px 'Inter', system-ui, sans-serif";
        g.textAlign = 'center';
        g.fillText('Pick a car below.', w / 2, h / 2);
        if (note) note.textContent = '';
        return;
    }

    // Against the lap number rather than each car's own count of laps, so a
    // car that joined on lap 30 sits at lap 30 instead of being drawn from
    // the left edge alongside somebody else's opening laps.
    let x0 = Infinity, x1 = -Infinity, lo = Infinity, hi = -Infinity;
    for (const c of drawn) for (const l of c.pts) {
        if (l.lap < x0) x0 = l.lap;
        if (l.lap > x1) x1 = l.lap;
        if (l.lap_ms < lo) lo = l.lap_ms;
        if (l.lap_ms > hi) hi = l.lap_ms;
    }

    // The scale stops at the slowest lap still within 107% of its own
    // driver's best. Above that is a stop, an off or a lift for traffic, and
    // those are a minute clear of the racing: scaled to include them, the
    // pace the chart exists to show is squashed into the bottom third. They
    // are still drawn, off the top, so the chart does not pretend they did
    // not happen.
    let ceiling = -Infinity;
    for (const c of drawn) for (const l of c.pts) {
        if (l.lap_ms <= c.best * 1.07 && l.lap_ms > ceiling) ceiling = l.lap_ms;
    }
    if (Number.isFinite(ceiling) && ceiling < hi) hi = ceiling;
    const pad = Math.max(500, (hi - lo) * 0.08);
    lo -= pad; hi += pad;
    const clipped = drawn.reduce((n, c) => n + c.pts.filter(l => l.lap_ms > hi).length, 0);

    const padL = 58, padR = 14, padT = 14, padB = 28;
    const px = lap => padL + (x1 === x0 ? 0 : ((lap - x0) / (x1 - x0)) * (w - padL - padR));
    const py = v   => padT + (1 - (v - lo) / Math.max(1, hi - lo)) * (h - padT - padB);

    g.strokeStyle = 'rgba(255,255,255,0.06)';
    g.lineWidth = 1;
    g.fillStyle = '#94a3b8';
    g.font = "10px 'Inter', system-ui, sans-serif";
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (let k = 0; k <= 4; k++) {
        const v = lo + (hi - lo) * k / 4;
        const y = Math.round(py(v)) + 0.5;
        g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
        g.fillText(axisTime(v), padL - 8, y);
    }
    g.textAlign = 'center';
    g.textBaseline = 'top';
    const step = Math.max(1, Math.ceil((x1 - x0 + 1) / 12));
    for (let lap = x0; lap <= x1; lap += step) g.fillText(String(lap), px(lap), h - padB + 7);
    g.fillText('lap', w / 2, h - padB + 19);

    for (const c of drawn) {
        const col = lapColour(c);
        g.strokeStyle = col;
        g.lineWidth = 2;
        // Every lap joined to the next, including the ones that run off the
        // top. A driver reads their own run as one line, and a break in it
        // looks like laps that were never recorded, which is the one thing a
        // log must never suggest. A lap above the scale is drawn at the
        // ceiling and the segments reaching it are faded, so the line stays
        // continuous while being plain that the real time is higher than the
        // chart goes: a stop and a spin both end up at the top, and the
        // faded run up to it is the chart saying "this one left the scale"
        // rather than "this one was 9:01".
        const yAt = l => l.lap_ms > hi ? padT + 3 : py(l.lap_ms);
        for (let i = 1; i < c.pts.length; i++) {
            const a = c.pts[i - 1], b = c.pts[i];
            g.globalAlpha = (a.lap_ms > hi || b.lap_ms > hi) ? 0.33 : 1;
            g.beginPath();
            g.moveTo(px(a.lap), yAt(a));
            g.lineTo(px(b.lap), yAt(b));
            g.stroke();
        }
        g.globalAlpha = 1;
        // A dot per lap, or a car with one lap to its name draws nothing.
        // Laps off the top keep a hollow mark at the ceiling: something
        // happened on that lap, and it is not being hidden.
        for (let i = 0; i < c.pts.length; i++) {
            const l = c.pts[i];
            if (l.lap_ms > hi) {
                g.beginPath();
                g.arc(px(l.lap), padT + 3, 2.2, 0, Math.PI * 2);
                g.lineWidth = 1.2; g.stroke(); g.lineWidth = 2;
                continue;
            }
            // The only lap this car has to its name, with no line anywhere.
            // Ringed, so it reads as one lap standing alone rather than as a
            // speck of something unfinished.
            const lone = c.pts.length === 1;
            const x = px(l.lap), y = py(l.lap_ms);
            g.fillStyle = col;
            g.beginPath(); g.arc(x, y, lone ? 3.2 : 2.5, 0, Math.PI * 2); g.fill();
            if (lone) {
                g.globalAlpha = 0.45; g.lineWidth = 1.2;
                g.beginPath(); g.arc(x, y, 6.5, 0, Math.PI * 2); g.stroke();
                g.globalAlpha = 1; g.lineWidth = 2;
            }
        }
    }

    // What the laps off the top actually were.
    //
    // Their height cannot say it. Every one of them sits on the ceiling, so
    // an 11:03 and a 9:10 are the same mark, and a car with four of them
    // reads as having driven the same lap four times, joined by a flat line
    // at a time nobody set. The figure goes beside the mark instead, which
    // is the only place left to put it.
    //
    // Two rows, and a label that cannot find room in either is dropped: the
    // note beside the heading already says how many went past the top, and a
    // pile of overlapping numbers would say less than the count does.
    if (clipped) {
        g.font = "9px 'Inter', system-ui, sans-serif";
        g.textAlign = 'center';
        g.textBaseline = 'top';
        const placed = [];
        for (const c of drawn) {
            g.fillStyle = lapColour(c);
            for (const l of c.pts) {
                if (l.lap_ms <= hi) continue;
                const text = axisTime(l.lap_ms);
                const tw = g.measureText(text).width;
                // Kept inside the plot, or a lap 1 label hangs over the
                // times running down the left hand edge.
                const x = Math.min(Math.max(px(l.lap), padL + tw / 2),
                                   w - padR - tw / 2);
                let y = null;
                for (let row = 0; row < 2; row++) {
                    const ry = padT + 10 + row * 11;
                    const clash = placed.some(p => p.y === ry
                        && Math.abs(p.x - x) < (p.w + tw) / 2 + 5);
                    if (!clash) { y = ry; break; }
                }
                if (y == null) continue;
                placed.push({ x, y, w: tw });
                g.fillText(text, x, y);
            }
        }
    }

    if (note) {
        const n = drawn.reduce((t, c) => t + c.pts.length, 0);
        note.textContent = clipped
            ? `${n} laps · ${clipped} ran past the top of the scale and sit on it: in-laps, out-laps and offs.`
            : `${n} lap${n === 1 ? '' : 's'} recorded this session.`;
    }
}

addEventListener('resize', () => drawLapChart());

async function tick() {
    // Asked together, in one round trip's worth of waiting. The outline state
    // is three numbers; fetching it every poll is what lets the map notice an
    // outline being cleared or restarted straight away.
    const [{ data, error }, trackState] = await Promise.all([
        sb.rpc('live_field'),
        sb.rpc('live_track_state'),
    ]);

    if (error) {
        // Two consecutive failures before saying anything: one dropped poll
        // on a phone changing cell is not worth replacing the page over.
        if (++failures >= 2 && !document.querySelector('.split')) {
            app.innerHTML = `<div class="page-wrap"><div class="state">
                <h3>Can't reach live timing</h3>
                <p>${esc(error.message)}</p></div></div>`;
        }
        return;
    }

    failures = 0;
    if (!data || data.length === 0) { await renderIdle(); return; }
    await loadBasePath(trackState?.error ? null : trackState?.data);
    loadCoverage(data[0].event_id);        // cached, not awaited
    loadCircuitRecord(data[0].event_id);   // once per round, not awaited
    loadLaps(data[0]);                     // throttled to its own cadence
    lastRows = data;
    // Worked out before anything uses it: the table labels these cars, the
    // map leaves them out, and their trails are not kept.
    strays = findStrays(data);
    assignTeamColours(data);
    recordPositions(data);
    renderField(data);
    drawTrack(data);
}

// Polling rather than Realtime: the table is a handful of rows, there is no
// connection ceiling, and a dropped poll is invisible where a dropped socket
// needs reconnection logic. Worth revisiting once the field is much larger.
tick();
setInterval(tick, 1500);
</script>
