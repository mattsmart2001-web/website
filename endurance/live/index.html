    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --green: #22c55e;
            --red: #ef4444;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

        /* Nav — shared with every other GTEC page */
        .gtec-nav { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; background: rgba(5,6,8,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .gtec-nav .brand { font-family: 'Anton', sans-serif; font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); text-decoration: none; text-indent: 0.32em; }
        .gtec-nav .brand-logo { height: 26px; width: auto; display: block; }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
        .gtec-nav .nav-links a { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #111; background: var(--gold); text-decoration: none; padding: 0.5rem 1rem; border-radius: 999px; box-shadow: 0 2px 10px rgba(255,209,102,0.35); }
        .gtec-nav .back { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 0.45rem 0.85rem; border: 1px solid var(--border); border-radius: 999px; }
        .gtec-nav-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; }
        .gtec-nav-toggle svg { width: 24px; height: 24px; }
        .nav-badge { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: 0.3rem; vertical-align: top; }

        .page-wrap { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

        .eyebrow { font-family: 'Orbitron', sans-serif; font-size: 0.55rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.6rem; }
        .title { font-family: 'Anton', sans-serif; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: 0.04em; text-transform: uppercase; }
        .subtitle { color: var(--muted); font-size: 0.88rem; margin-top: 0.5rem; }

        /* The pulsing dot is the only moving thing on the page when nothing
           is happening, which is what tells a viewer it is still connected. */
        .live-pill { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.3rem 0.75rem; border-radius: 999px; font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        /* A test must never be mistakeable for a race, so it loses the
           pulsing dot and the red entirely. */
        .test-pill { background: rgba(251,146,60,0.12); color: #fdba74; border-color: rgba(251,146,60,0.35); }
        /* An open practice evening is a real session, not a warning, so it
           reads as green rather than borrowing the amber of a test. */
        .practice-pill { background: rgba(34,197,94,0.12); color: #86efac; border-color: rgba(34,197,94,0.35); }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

        /* Track map. No circuit artwork anywhere: the cars' own positions
           trace the lap, so this works on any track from the first beacon
           without calibration. */
        .map-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; margin-top: 2rem; overflow: hidden; }
        .map-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 0.9rem 1.1rem; background: var(--bg-2); border-bottom: 1px solid var(--border); }
        .map-title { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
        /* The note rotates through facts, so it fades rather than snapping.
           Width is reserved by the flex row, not by the text, so a longer
           fact cannot shuffle the title next to it. */
        .map-note { font-size: 0.7rem; color: var(--muted); transition: opacity 0.45s ease; text-align: right; }
        .map-note.fading { opacity: 0; }
        @media (prefers-reduced-motion: reduce) {
            .map-note { transition: none; }
            .map-note.fading { opacity: 1; }
        }
        /* pan-y leaves one-finger vertical scrolling to the page, so the map
           cannot trap a reader halfway down it. Two fingers come to us. */
        #track { display: block; width: 100%; height: 420px; touch-action: pan-y; cursor: grab; }
        #track.grabbing { cursor: grabbing; }
        @media (max-width: 560px) { #track { height: 300px; } }
        /* Buttons as well as gestures: a phone has no scroll wheel, and not
           everyone thinks to try pinching a picture of a racetrack. */
        .map-zoom { display: flex; align-items: center; gap: 0.3rem; }
        .map-zoom button { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 700; line-height: 1;
            width: 26px; height: 26px; padding: 0; display: grid; place-items: center;
            color: var(--muted); background: var(--bg-1); border: 1px solid var(--border);
            border-radius: 6px; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
        .map-zoom button:hover:not(:disabled) { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .map-zoom button:disabled { opacity: 0.35; cursor: default; }
        .map-zoom .reset { width: auto; padding: 0 0.5rem; font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; }

        /* A split header is a button: it collapses its table and filters the
           map. Both from one control, because they are the same intent. */
        .split-head { cursor: pointer; user-select: none; border: none; width: 100%; text-align: left; font: inherit; color: inherit; }
        .split-head:hover { background: rgba(255,255,255,0.03); }
        .split-head:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
        .split-chev { flex: 0 0 auto; color: var(--muted); font-size: 0.8rem; line-height: 1; transition: transform 0.15s; cursor: pointer; padding: 0.2rem 0.3rem; margin: -0.2rem -0.1rem -0.2rem -0.3rem; border-radius: 4px; }
        .split-chev:hover { color: var(--text); background: rgba(255,255,255,0.06); }
        .split.collapsed .split-chev { transform: rotate(-90deg); }
        .split.collapsed table { display: none; }
        .split.collapsed .split-head { border-bottom-color: transparent; }
        /* The focused split is the one the map is showing. */
        .split.focused { border-color: rgba(255,209,102,0.45); }
        .split.focused .split-name { color: var(--gold); }

        .splits { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 1.25rem; margin-top: 2rem; align-items: start; }

        .split { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .split-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1.1rem; background: var(--bg-2); border-bottom: 1px solid var(--border); }
        .split-head .split-meta { margin-left: auto; }
        .split-name { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
        .split-meta { font-size: 0.7rem; color: var(--muted); }

        /* Fixed layout so a long team name truncates instead of forcing the
           table wider than its card, which silently clipped the Best column. */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th:nth-child(1), td:nth-child(1) { width: 26px; }
        th:nth-child(3), td:nth-child(3) { width: 46px; }
        th:nth-child(6), td:nth-child(6) { width: 82px; }
        /* Sized in pixels, not ch: a Nordschleife lap reads 7:54.471, and ch
           units under-measured it once cell padding was counted, which clipped
           the Best column on the narrowest cards. */
        th:nth-child(4), td:nth-child(4) { width: 66px; }
        th:nth-child(5), td:nth-child(5) { width: 66px; }
        th { font-family: 'Orbitron', sans-serif; font-size: 0.52rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
        td { padding: 0.5rem 0.6rem; font-size: 0.82rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-size: 0.78rem; padding-left: 0.25rem; padding-right: 0.45rem; }
        th:nth-child(n+3) { text-align: right; }
        .pos { font-family: 'Anton', sans-serif; font-size: 0.95rem; color: var(--gold); width: 2.2ch; }
        .car { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.75rem; }
        /* Fuel as a bar rather than a bare number: across a split, "who is
           about to stop" reads from the shape of a column of bars far faster
           than from a column of percentages. */
        .fuel-wrap { display: flex; align-items: center; gap: 0.35rem; justify-content: flex-end; }
        .fuel-bar { width: 34px; height: 7px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; flex: 0 0 auto; }
        .fuel-fill { display: block; height: 100%; background: var(--green); }
        .fuel-low .fuel-fill  { background: #fb923c; }
        .fuel-crit .fuel-fill { background: var(--red); }
        .fuel-pct { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .fuel-low .fuel-pct  { color: #fdba74; }
        .fuel-crit .fuel-pct { color: #fca5a5; font-weight: 600; }
        /* Second lines under Last and Best: current lap time and speed. They
           use vertical space the rows already have rather than two more
           columns, which these cards cannot spare. */
        .sub2 { display: block; font-variant-numeric: tabular-nums; font-size: 0.66rem; color: var(--muted); }
        .dr { display: flex; align-items: center; min-width: 0; }
        .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; cursor: help; }
        /* Quiet: it is a detail, not a status. Never shrinks, so a long name
           truncates around it rather than squashing it. */
        .client { flex: 0 0 auto; display: inline-flex; color: var(--muted); opacity: 0.65; }
        /* Ties the row to its dot on the map. Small and dim: it is a key, not
           a status light. */
        .team-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
            margin-right: 0.35rem; vertical-align: 0.5px; opacity: 0.85; }
        .client svg { width: 12px; height: 12px; display: block; }
        .who:hover, .who:focus-visible { color: var(--gold); outline: none; }

        /* Driver card. Fixed, and appended outside the splits container, so
           the 1.5s poll that rewrites the tables cannot pull it out from
           under the pointer. */
        .dcard { position: fixed; z-index: 60; width: 248px; padding: 0.85rem 0.95rem;
            background: rgba(10,14,21,0.97); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            opacity: 0; transform: translateY(4px); pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease; }
        .dcard.on { opacity: 1; transform: translateY(0); }
        .dcard .dc-top { display: flex; align-items: baseline; gap: 0.45rem; border-left: 3px solid var(--gold);
            padding-left: 0.55rem; margin-bottom: 0.6rem; }
        .dcard .dc-name { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dcard .dc-num { font-family: 'Anton', sans-serif; font-size: 0.92rem; color: var(--muted); margin-left: auto; }
        .dcard .dc-team { font-size: 0.7rem; color: var(--muted); margin: -0.35rem 0 0.65rem 0.6rem; }
        .dcard .dc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.75rem; }
        .dcard .dc-k { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--muted); font-family: 'Orbitron', sans-serif; }
        .dcard .dc-v { font-size: 0.95rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
        .dcard .dc-v small { font-size: 0.62rem; font-weight: 500; color: var(--muted); margin-left: 0.2rem; }
        .dcard .dc-up { color: var(--green); } .dcard .dc-down { color: var(--red); }
        .dcard .dc-foot { margin-top: 0.7rem; padding-top: 0.55rem; border-top: 1px solid var(--border);
            font-size: 0.66rem; color: var(--muted); display: flex; justify-content: space-between; gap: 0.5rem; }
        @media (prefers-reduced-motion: reduce) { .dcard { transition: none; } }
        /* On a phone it docks to the bottom rather than chasing a finger. */
        @media (max-width: 560px) {
            .dcard { left: 12px !important; right: 12px; width: auto;
                top: auto !important; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
        }
        .team { display: block; font-size: 0.7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Liveness. A dot that vanishes reads as a bug and one frozen in a
           corner reads as a crash, so a car fades through these instead. */
        .s-live     { }
        .s-drifting { opacity: 0.75; }
        .s-lost     { opacity: 0.45; }
        .s-offline  { opacity: 0.3; }
        /* Shrinkable: at phone width "Signal lost" is wider than the whole
           driver cell, and a non-shrinking flag was simply being clipped by
           the card, which loses it entirely rather than shortening it. */
        .flag { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: 'Orbitron', sans-serif; font-size: 0.5rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.1rem 0.35rem; border-radius: 4px; margin-left: 0.35rem; white-space: nowrap; }
        .flag-lost    { background: rgba(251,146,60,0.15); color: #fdba74; }
        .flag-offline { background: rgba(255,255,255,0.06); color: var(--muted); }
        .flag-menus   { background: rgba(148,163,184,0.12); color: var(--muted); }

        .state { text-align: center; padding: 4.5rem 2rem; }
        .state h3 { font-family: 'Anton', sans-serif; font-size: 1.3rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.6rem; }
        .state p { color: var(--muted); font-size: 0.88rem; line-height: 1.7; max-width: 46ch; margin: 0 auto; }
        .state .cta { display: inline-block; margin-top: 1.5rem; font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); text-decoration: none; border: 1px solid rgba(255,209,102,0.3); padding: 0.6rem 1.1rem; border-radius: 999px; }
        .loading { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: 'Orbitron', sans-serif; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; }

        .foot-note { margin-top: 2.5rem; font-size: 0.74rem; color: var(--muted); line-height: 1.7; text-align: center; }
        .foot-note a { color: var(--gold); text-decoration: none; }

        /* Phone: drop Best so the driver name and status flag stay readable.
           Last lap and fuel are what matter while a race is running. */
        @media (max-width: 560px) {
            th:nth-child(5), td:nth-child(5) { display: none; }
            th:nth-child(6), td:nth-child(6) { width: 70px; }
            .flag { font-size: 0.46rem; letter-spacing: 0.06em; }
        }

        @media (max-width: 860px) {
            .gtec-nav { padding: 1rem; flex-wrap: wrap; }
            .gtec-nav-toggle { display: block; }
            .gtec-nav .nav-links { display: none; width: 100%; flex-direction: column; align-items: flex-start; gap: 0.85rem; padding-top: 1rem; }
            .gtec-nav .nav-links.open { display: flex; }
            .page-wrap { padding: 1.75rem 1rem 3rem; }
            .splits { grid-template-columns: 1fr; }
        }
    </style>
    <!-- Loaded after the inline styles, as on every other page: it is what
         centres the links and pins the logo, overriding the space-between
         layout above. Without it this page's nav sits right of every other. -->
    <link rel="stylesheet" href="/endurance/assets/gtec-nav.css">
</head>
