<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Timing | GTEC Gran Turismo 7 Endurance Championship</title>
    <meta name="description" content="Live timing for the GTEC Gran Turismo 7 endurance championship. Every split running at once, lap by lap, while the race is on.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://sparkstheory.co.uk/endurance/live/">
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="manifest" href="/endurance/assets/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/endurance/assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta property="og:type"        content="website">

    <meta name="twitter:image"       content="https://sparkstheory.co.uk/endurance/assets/og-card.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --green: #22c55e;
            --red: #ef4444;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

        /* Nav — shared with every other GTEC page */
        .gtec-nav { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; background: rgba(5,6,8,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .gtec-nav .brand { font-family: 'Anton', sans-serif; font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); text-decoration: none; text-indent: 0.32em; }
        .gtec-nav .brand-logo { height: 26px; width: auto; display: block; }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
        .gtec-nav .nav-links a { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #111; background: var(--gold); text-decoration: none; padding: 0.5rem 1rem; border-radius: 999px; box-shadow: 0 2px 10px rgba(255,209,102,0.35); }
        .gtec-nav .back { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 0.45rem 0.85rem; border: 1px solid var(--border); border-radius: 999px; }
        .gtec-nav-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; }
        .gtec-nav-toggle svg { width: 24px; height: 24px; }
        .nav-badge { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: 0.3rem; vertical-align: top; }

        .page-wrap { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

        .eyebrow { font-family: 'Orbitron', sans-serif; font-size: 0.55rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.6rem; }
        .title { font-family: 'Anton', sans-serif; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: 0.04em; text-transform: uppercase; }
        .subtitle { color: var(--muted); font-size: 0.88rem; margin-top: 0.5rem; }

        /* The pulsing dot is the only moving thing on the page when nothing
           is happening, which is what tells a viewer it is still connected. */
        .live-pill { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.3rem 0.75rem; border-radius: 999px; font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        /* A test must never be mistakeable for a race, so it loses the
           pulsing dot and the red entirely. */
        .test-pill { background: rgba(251,146,60,0.12); color: #fdba74; border-color: rgba(251,146,60,0.35); }
        /* An open practice evening is a real session, not a warning, so it
           reads as green rather than borrowing the amber of a test. */
        .practice-pill { background: rgba(34,197,94,0.12); color: #86efac; border-color: rgba(34,197,94,0.35); }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

        /* Track map. No circuit artwork anywhere: the cars' own positions
           trace the lap, so this works on any track from the first beacon
           without calibration. */
        .map-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; margin-top: 2rem; overflow: hidden; }
        .map-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 0.9rem 1.1rem; background: var(--bg-2); border-bottom: 1px solid var(--border); }
        .map-title { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); flex: 0 0 auto; }
        /* The note rotates through facts, so it fades rather than snapping.
           Width is reserved by the flex row, not by the text, so a longer
           fact cannot shuffle the title next to it. */
        .map-note { font-size: 0.7rem; color: var(--muted); transition: opacity 0.45s ease; text-align: right; }
        .map-note.fading { opacity: 0; }
        @media (prefers-reduced-motion: reduce) {
            .map-note { transition: none; }
            .map-note.fading { opacity: 1; }
        }
        /* On a phone the title now carries the split as well, which leaves
           the rotating note too little room to sit beside it. It drops to a
           line of its own instead of squeezing the two things that matter. */
        @media (max-width: 560px) {
            .map-head { flex-wrap: wrap; }
            .map-note { order: 3; flex-basis: 100%; text-align: left; }
        }
        /* pan-y leaves one-finger vertical scrolling to the page, so the map
           cannot trap a reader halfway down it. Two fingers come to us. */
        #track { display: block; width: 100%; height: 420px; touch-action: pan-y; cursor: grab; }
        #track.grabbing { cursor: grabbing; }
        @media (max-width: 560px) { #track { height: 300px; } }
        /* The canvas needs a positioned parent for the hint to sit over it.
           No padding or background of its own: it is the canvas's frame. */
        .map-stage { position: relative; }
        /* How to turn the map, for somebody who has never tried. Sits over
           the top left of the circuit, which is the emptiest part of a map
           fitted to a wide box, and goes away for good once they have done
           it once. Not a button, so it takes no pointer events and cannot
           swallow the first drag it is asking for. */
        .map-hint { position: absolute; top: 0.7rem; left: 0.9rem; pointer-events: none;
                    font-size: 0.66rem; color: var(--muted); letter-spacing: 0.04em;
                    opacity: 0.85; transition: opacity 0.5s ease; }
        .map-hint.gone { opacity: 0; }
        .map-hint kbd { font: inherit; color: var(--text); background: none; border: none; padding: 0; }
        @media (prefers-reduced-motion: reduce) { .map-hint { transition: none; } }
        /* Buttons as well as gestures: a phone has no scroll wheel, and not
           everyone thinks to try pinching a picture of a racetrack. */
        .map-zoom { display: flex; align-items: center; gap: 0.3rem; }
        .map-zoom button { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 700; line-height: 1;
            width: 26px; height: 26px; padding: 0; display: grid; place-items: center;
            color: var(--muted); background: var(--bg-1); border: 1px solid var(--border);
            border-radius: 6px; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
        .map-zoom button:hover:not(:disabled) { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .map-zoom button:disabled { opacity: 0.35; cursor: default; }
        .map-zoom .reset { width: auto; padding: 0 0.5rem; font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; }

        /* The lap chart, under the map and built from the same parts, so the
           two read as one instrument rather than two widgets. */
        #lap-chart { display: block; width: 100%; height: 300px; }
        @media (max-width: 560px) { #lap-chart { height: 240px; } }
        .chart-cars { display: flex; flex-wrap: wrap; gap: 0.4rem;
            padding: 0 1.1rem 1rem; }
        /* display:block and display:flex both beat the browser's own rule for
           [hidden], so the empty card kept a 300px hole where the chart was. */
        #lap-chart[hidden], .chart-cars[hidden] { display: none; }
        .chart-chip { display: inline-flex; align-items: center; gap: 0.4rem;
            font-family: 'Inter', system-ui, sans-serif; font-size: 0.72rem;
            color: var(--text); background: var(--bg-2); cursor: pointer;
            border: 1px solid var(--border); border-radius: 999px;
            padding: 0.28rem 0.7rem; transition: opacity 0.15s, border-color 0.15s; }
        .chart-chip .dot { width: 8px; height: 8px; border-radius: 50%;
            background: currentColor; flex: 0 0 auto; }
        .chart-chip .chip-n { color: var(--muted); font-size: 0.66rem;
            font-variant-numeric: tabular-nums; }
        .chart-chip.off { opacity: 0.4; }
        .chart-chip:hover { border-color: rgba(255,255,255,0.25); }
        .chart-empty { padding: 2.2rem 1.1rem; text-align: center;
            font-size: 0.8rem; color: var(--muted); }

        /* The lap log, alongside the round it belongs to. It used to be a
           sentence in the footnote under the map, which is the last place
           anybody looks on a page whose top half moves. */
        .head-link { margin-left: auto; display: inline-flex; align-items: center; gap: 0.4rem;
            font-family: 'Orbitron', sans-serif; font-size: 0.56rem; font-weight: 700;
            letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none;
            color: var(--gold); background: rgba(255,209,102,0.08);
            border: 1px solid rgba(255,209,102,0.3); border-radius: 999px;
            padding: 0.4rem 0.8rem; transition: background 0.15s, border-color 0.15s; }
        .head-link:hover { background: rgba(255,209,102,0.16); border-color: rgba(255,209,102,0.55); }
        .head-link svg { width: 11px; height: 11px; }
        @media (max-width: 560px) { .head-link { margin-left: 0; } }

        /* A split header is a button: it collapses its table and filters the
           map. Both from one control, because they are the same intent. */
        .split-head { cursor: pointer; user-select: none; border: none; width: 100%; text-align: left; font: inherit; color: inherit; }
        .split-head:hover { background: rgba(255,255,255,0.03); }
        .split-head:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
        .split-chev { flex: 0 0 auto; color: var(--muted); font-size: 0.8rem; line-height: 1; transition: transform 0.15s; cursor: pointer; padding: 0.2rem 0.3rem; margin: -0.2rem -0.1rem -0.2rem -0.3rem; border-radius: 4px; }
        .split-chev:hover { color: var(--text); background: rgba(255,255,255,0.06); }
        .split.collapsed .split-chev { transform: rotate(-90deg); }
        .split.collapsed table { display: none; }
        .split.collapsed .split-head { border-bottom-color: transparent; }
        /* The focused split is the one the map is showing. */
        .split.focused { border-color: rgba(255,209,102,0.45); }
        .split.focused .split-name { color: var(--gold); }

        .splits { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 1.25rem; margin-top: 2rem; align-items: start; }

        .split { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .split-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1.1rem; background: var(--bg-2); border-bottom: 1px solid var(--border); }
        .split-head .split-meta { margin-left: auto; }
        .split-name { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
        .split-meta { font-size: 0.7rem; color: var(--muted); }

        /* Fixed layout so a long team name truncates instead of forcing the
           table wider than its card, which silently clipped the Best column. */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        /* Hovering a row picks that car out on the map, so the row says so
           too. Faint on purpose: the answer is over on the map, and a row
           that lights up competes with it. */
        tbody tr:hover { background: rgba(255,255,255,0.035); }
        @media (hover: none) { tbody tr:hover { background: none; } }
        th:nth-child(1), td:nth-child(1) { width: 26px; }
        th:nth-child(3), td:nth-child(3) { width: 46px; }
        th:nth-child(6), td:nth-child(6) { width: 82px; }
        /* Sized in pixels, not ch: a Nordschleife lap reads 7:54.471, and ch
           units under-measured it once cell padding was counted, which clipped
           the Best column on the narrowest cards. */
        th:nth-child(4), td:nth-child(4) { width: 66px; }
        th:nth-child(5), td:nth-child(5) { width: 66px; }
        th { font-family: 'Orbitron', sans-serif; font-size: 0.52rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
        td { padding: 0.5rem 0.6rem; font-size: 0.82rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-size: 0.78rem; padding-left: 0.25rem; padding-right: 0.45rem; }
        th:nth-child(n+3) { text-align: right; }
        .pos { font-family: 'Anton', sans-serif; font-size: 0.95rem; color: var(--gold); width: 2.2ch; }
        .car { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.75rem; }
        /* Fuel as a bar rather than a bare number: across a split, "who is
           about to stop" reads from the shape of a column of bars far faster
           than from a column of percentages. */
        .fuel-wrap { display: flex; align-items: center; gap: 0.35rem; justify-content: flex-end; }
        .fuel-bar { width: 34px; height: 7px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; flex: 0 0 auto; }
        .fuel-fill { display: block; height: 100%; background: var(--green); }
        .fuel-low .fuel-fill  { background: #fb923c; }
        .fuel-crit .fuel-fill { background: var(--red); }
        .fuel-pct { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .fuel-low .fuel-pct  { color: #fdba74; }
        .fuel-crit .fuel-pct { color: #fca5a5; font-weight: 600; }
        /* Second lines under Last and Best: current lap time and speed. They
           use vertical space the rows already have rather than two more
           columns, which these cards cannot spare. */
        .sub2 { display: block; font-variant-numeric: tabular-nums; font-size: 0.66rem; color: var(--muted); }
        .dr { display: flex; align-items: center; min-width: 0; }
        .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; cursor: help; }
        /* Quiet: it is a detail, not a status. Never shrinks, so a long name
           truncates around it rather than squashing it. */
        .client { flex: 0 0 auto; display: inline-flex; color: var(--muted); opacity: 0.65; }
        /* Ties the row to its dot on the map. Small and dim: it is a key, not
           a status light. */
        .team-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
            margin-right: 0.35rem; vertical-align: 0.5px; opacity: 0.85; }
        .client svg { width: 12px; height: 12px; display: block; }
        .who:hover, .who:focus-visible { color: var(--gold); outline: none; }

        /* Driver card. Fixed, and appended outside the splits container, so
           the 1.5s poll that rewrites the tables cannot pull it out from
           under the pointer. */
        .dcard { position: fixed; z-index: 60; width: 248px; padding: 0.85rem 0.95rem;
            background: rgba(10,14,21,0.97); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            opacity: 0; transform: translateY(4px); pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease; }
        .dcard.on { opacity: 1; transform: translateY(0); }
        .dcard .dc-top { display: flex; align-items: baseline; gap: 0.45rem; border-left: 3px solid var(--gold);
            padding-left: 0.55rem; margin-bottom: 0.6rem; }
        .dcard .dc-name { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dcard .dc-num { font-family: 'Anton', sans-serif; font-size: 0.92rem; color: var(--muted); margin-left: auto; }
        .dcard .dc-team { font-size: 0.7rem; color: var(--muted); margin: -0.35rem 0 0.65rem 0.6rem; }
        .dcard .dc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.75rem; }
        .dcard .dc-k { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--muted); font-family: 'Orbitron', sans-serif; }
        .dcard .dc-v { font-size: 0.95rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
        .dcard .dc-v small { font-size: 0.62rem; font-weight: 500; color: var(--muted); margin-left: 0.2rem; }
        .dcard .dc-up { color: var(--green); } .dcard .dc-down { color: var(--red); }
        .dcard .dc-foot { margin-top: 0.7rem; padding-top: 0.55rem; border-top: 1px solid var(--border);
            font-size: 0.66rem; color: var(--muted); display: flex; justify-content: space-between; gap: 0.5rem; }
        @media (prefers-reduced-motion: reduce) { .dcard { transition: none; } }
        /* On a phone it docks to the bottom rather than chasing a finger. */
        @media (max-width: 560px) {
            .dcard { left: 12px !important; right: 12px; width: auto;
                top: auto !important; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
        }
        .team { display: block; font-size: 0.7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Liveness. A dot that vanishes reads as a bug and one frozen in a
           corner reads as a crash, so a car fades through these instead. */
        .s-live     { }
        .s-drifting { opacity: 0.75; }
        .s-lost     { opacity: 0.45; }
        .s-offline  { opacity: 0.3; }
        /* Shrinkable: at phone width "Signal lost" is wider than the whole
           driver cell, and a non-shrinking flag was simply being clipped by
           the card, which loses it entirely rather than shortening it. */
        .flag { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: 'Orbitron', sans-serif; font-size: 0.5rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.1rem 0.35rem; border-radius: 4px; margin-left: 0.35rem; white-space: nowrap; }
        .flag-lost    { background: rgba(251,146,60,0.15); color: #fdba74; }
        .flag-offline { background: rgba(255,255,255,0.06); color: var(--muted); }
        .flag-menus   { background: rgba(148,163,184,0.12); color: var(--muted); }

        .state { text-align: center; padding: 4.5rem 2rem; }
        .state h3 { font-family: 'Anton', sans-serif; font-size: 1.3rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.6rem; }
        .state p { color: var(--muted); font-size: 0.88rem; line-height: 1.7; max-width: 46ch; margin: 0 auto; }
        .state .cta { display: inline-block; margin-top: 1.5rem; font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); text-decoration: none; border: 1px solid rgba(255,209,102,0.3); padding: 0.6rem 1.1rem; border-radius: 999px; }
        .loading { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: 'Orbitron', sans-serif; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; }

        .foot-note { margin-top: 2.5rem; font-size: 0.74rem; color: var(--muted); line-height: 1.7; text-align: center; }
        .foot-note a { color: var(--gold); text-decoration: none; }

        /* Phone: drop Best so the driver name and status flag stay readable.
           Last lap and fuel are what matter while a race is running. */
        @media (max-width: 560px) {
            th:nth-child(5), td:nth-child(5) { display: none; }
            th:nth-child(6), td:nth-child(6) { width: 70px; }
            .flag { font-size: 0.46rem; letter-spacing: 0.06em; }
        }

        @media (max-width: 860px) {
            .gtec-nav { padding: 1rem; flex-wrap: wrap; }
            .gtec-nav-toggle { display: block; }
            .gtec-nav .nav-links { display: none; width: 100%; flex-direction: column; align-items: flex-start; gap: 0.85rem; padding-top: 1rem; }
            .gtec-nav .nav-links.open { display: flex; }
            .page-wrap { padding: 1.75rem 1rem 3rem; }
            .splits { grid-template-columns: 1fr; }
        }
    </style>
    <!-- Loaded after the inline styles, as on every other page: it is what
         centres the links and pins the logo, overriding the space-between
         layout above. Without it this page's nav sits right of every other. -->
    <link rel="stylesheet" href="/endurance/assets/gtec-nav.css">
</head>
<body>

    <button class="gtec-nav-toggle" aria-label="Toggle menu" type="button">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>

        <a class="back" href="/" title="SparksTheory" aria-label="Back to SparksTheory"><img src="/sparks_logo.jpg" alt="SparksTheory" style="height:20px;width:20px;border-radius:50%;display:block"></a>
    </div>

<div id="app"><div class="loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
const app = document.getElementById('app');

sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data?.session) { if (portal) portal.style.display = ''; }
    else if (signin) signin.style.display = '';
});

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Lap times arrive as milliseconds. */
function lapTime(ms) {
    if (ms == null || ms <= 0) return '—';
    const m = Math.floor(ms / 60000);
    const s = ((ms % 60000) / 1000).toFixed(3).padStart(6, '0');
    return m > 0 ? `${m}:${s}` : s;
}

/**
 * How much to trust a car's position, from the age of its last beacon.
 *
 * Deliberately slow to alarm and quick to recover. A three-second cadence
 * over home WiFi skips beacons constantly, so six seconds of silence is
 * normal and thirty is worth showing. One good beacon returns a car
 * straight to live, with no smoothing.
 *
 * Nothing here ever contradicts the race: a driver whose phone dies on lap
 * 37 still reads lap 37, because losing the reporter is not losing the car.
 */
function liveness(ageMs, onTrack, elsewhere) {
    // Whether anything is arriving at all comes first. "In menus" and
    // "Another track" describe what a car that is REPORTING is doing, and
    // they used to be tested before the age, so a driver who closed their
    // reporter while sitting in the menus was described as being in the
    // menus for as long as the row survived. They are not in the menus. They
    // are not there at all, and that is the more useful thing to say.
    if (ageMs >= 300000) return { cls: 's-offline', flag: 'Offline', flagCls: 'flag-offline' };
    if (ageMs >= 30000)  return { cls: 's-lost', flag: 'Signal lost', flagCls: 'flag-lost' };
    // Said before the rest, because it explains why a car that is plainly
    // reporting is nowhere on the map.
    if (elsewhere) return { cls: 's-drifting', flag: 'Another track', flagCls: 'flag-menus' };
    if (!onTrack) return { cls: 's-drifting', flag: 'In menus', flagCls: 'flag-menus' };
    if (ageMs < 6000)   return { cls: 's-live', flag: '', flagCls: '' };
    return { cls: 's-drifting', flag: '', flagCls: '' };
}

/**
 * Fuel as a bar with the figure beside it. Thresholds are deliberately
 * blunt: under 25% is worth noticing, under 10% means a stop within a lap
 * or two. Turning that into "laps remaining" needs each driver's own
 * consumption, which is a later job and not worth faking from one reading.
 */
function fuelHtml(r) {
    const pct = r.fuel_pct;
    if (pct == null) return '<span class="fuel-pct">&mdash;</span>';
    const v = Math.max(0, Math.min(100, pct));
    const cls = v < 10 ? 'fuel-crit' : v < 25 ? 'fuel-low' : '';
    // How many laps that is worth, from this car's own measured burn. The
    // thresholds above are about the tank; this is about the race, and it is
    // the thing a team actually wants: a bar at 25% means nothing until you
    // know whether that is two laps or ten.
    //
    // Deliberately absent rather than guessed when the burn is not known
    // yet, which is the first lap or two of a stint, or a race with fuel
    // consumption switched off.
    const burn = r.burn_per_lap;
    const laps = burn > 0 ? Math.floor(v / burn) : null;
    const note = laps != null
        ? `<span class="sub2" style="display:inline">${laps} lap${laps === 1 ? '' : 's'}</span>`
        : '';
    const title = laps != null
        ? `${v.toFixed(1)}% of tank, about ${laps} more lap${laps === 1 ? '' : 's'} at ${burn.toFixed(1)}% a lap`
        : `${v.toFixed(1)}% of tank`;
    return `<div class="fuel-wrap ${cls}" title="${title}">
        <span class="fuel-pct">${Math.round(v)}%</span>
        <span class="fuel-bar"><span class="fuel-fill" style="width:${v}%"></span></span>
    </div>${note}`;
}

/**
 * What is tracking this car. Looked up from a fixed table rather than
 * printed, because the value arrives from a client and must never reach the
 * page verbatim; anything unrecognised simply gets no badge.
 *
 * Worth showing because it is the most surprising thing on the page: some of
 * these cars are being tracked by a phone on the sofa next to the driver.
 */
const CLIENT_BADGE = {
    android: ['Phone', 'M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm3 18h4'],
    windows: ['PC', 'M3 5l8-1v7H3V5zm0 8h8v7l-8-1v-6zm10-9.2L21 3v8h-8V3.8zM13 13h8v8l-8-1.2V13z'],
    mac:     ['Mac', 'M3 5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5zM2 19h20'],
    linux:   ['Linux', 'M12 2a5 5 0 0 1 5 5v4l2 5a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3l2-5V7a5 5 0 0 1 5-5z'],
};

function clientBadge(client) {
    const b = CLIENT_BADGE[client];
    if (!b) return '';
    return `<span class="client" title="Reporting from ${b[0]}" aria-label="Reporting from ${b[0]}">`
        + `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"`
        + ` stroke-linecap="round" stroke-linejoin="round"><path d="${b[1]}"/></svg></span>`;
}

// A best lap cannot be slower than a lap that was actually driven. GT7 has
// been seen reporting a best of 8:07.307 alongside a completed lap of
// 8:03.379, and the screen showed both, which cannot be true of anything.
// The same rule the beacon applies, applied here to whatever this page has
// been given, so a row that is already wrong in the database stops reading
// as impossible.
function bestLap(r) {
    const best = r.best_lap_ms, last = r.last_lap_ms;
    if (best == null) return last;
    if (last == null || last < 20000) return best;
    return Math.min(best, last);
}

// How far a car is round the lap in total, laps included, in metres. Null
// until the round has a measured outline, which is what makes a gap possible
// at all.
function runDistance(r) {
    if (r.progress_m == null || !r.lap_length_m) return null;
    return (r.lap ?? 0) * r.lap_length_m + r.progress_m;
}

// The gap to the car in front, shown as time rather than distance because
// that is what a driver thinks in. The conversion is the leader's own best
// lap pace, which is an assumption and is said to be one in the column's
// tooltip: a gap of 400 m means a different number of seconds down the
// Döttinger Höhe than through the Karussell.
function gapHtml(r, ahead) {
    const mine = runDistance(r), theirs = ahead ? runDistance(ahead) : null;
    if (mine == null) return '<span class="sub2" style="display:inline">&mdash;</span>';
    if (!ahead) return '<span class="sub2" style="display:inline">leader</span>';
    if (theirs == null) return '<span class="sub2" style="display:inline">&mdash;</span>';
    const m = theirs - mine;
    if (m < 0) return '<span class="sub2" style="display:inline">&mdash;</span>';
    const laps = Math.floor(m / r.lap_length_m);
    if (laps >= 1) return `+${laps} lap${laps === 1 ? '' : 's'}`;
    const pace = bestLap(ahead) || bestLap(r);             // ms for a whole lap
    if (!pace) return `+${Math.round(m)} m`;
    const s = (m / r.lap_length_m) * (pace / 1000);
    // Minutes and seconds past a minute, the way a timing screen reads. "+270s"
    // is arithmetic; "+4:30" is a gap.
    const shown = s < 10 ? `${s.toFixed(1)}s`
                : s < 60 ? `${Math.round(s)}s`
                : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
    return `<span title="${Math.round(m)} m round the lap">+${shown}</span>`;
}

function rowHtml(r, idx, showFuel, isRace, ahead) {
    const st = liveness(r.age_ms ?? 0, r.on_track, strays.has(r.driver_id));
    const live = st.cls === 's-live' && r.on_track;
    // Order within a split is laps completed and then distance round the lap
    // in a race, and best lap in practice.
    // Car number sits on the team line rather than in its own column. A
    // Nordschleife lap is over seven minutes, so Last and Best are wide, and
    // a sixth column pushed Best off the edge of the card. The fifth column
    // is therefore Best in practice, where it is the ranking, and Gap in a
    // race, where it is the question everybody is asking.
    const num = carNumber(r, r.mode);
    const swatch = `<span class="team-dot" style="background:${carColour(r)}"></span>`;
    const sub = [
        num != null ? '#' + num : null,
        r.team_name ? esc(r.team_name) : null,
    ].filter(Boolean).join(' · ');

    return `<tr class="${st.cls}" data-driver="${r.driver_id}">
        <td class="pos">${idx + 1}</td>
        <td>
            <div class="dr"><span class="who" data-driver="${r.driver_id}" tabindex="0">${esc(r.display_name)}</span>${clientBadge(r.client)}${st.flag ? `<span class="flag ${st.flagCls}">${st.flag}</span>` : ''}</div>
            ${sub ? `<span class="team">${swatch}${sub}</span>` : ''}
        </td>
        <td class="num">${r.lap ?? 0}${r.laps_in_race ? `<span class="sub2" style="display:inline">/${r.laps_in_race}</span>` : ''}</td>
        <td class="num">${lapTime(r.last_lap_ms)}<span class="sub2">${live ? lapTime(r.lap_ms) : ''}</span></td>
        <td class="num">${isRace ? gapHtml(r, ahead) : lapTime(bestLap(r))}<span class="sub2">${live && r.speed_kph != null ? r.speed_kph + ' kph' : ''}</span></td>
        ${showFuel ? `<td>${fuelHtml(r)}</td>` : ''}
    </tr>`;
}

function splitHtml(lobby, rows, showFuel) {
    // The same order the server sends, applied again here because the page
    // regroups the rows. A race is laps completed then how far into the
    // current lap; practice is the best lap, fastest first, because laps
    // completed in a practice session ranks nothing and rearranges itself
    // every time anybody crosses the line.
    const isRace = rows[0]?.mode === 'race';
    if (isRace) {
        rows.sort((a, b) => (b.lap ?? 0) - (a.lap ?? 0)
                         || (runDistance(b) ?? -1) - (runDistance(a) ?? -1)
                         || (b.lap_ms ?? 0) - (a.lap_ms ?? 0));
    } else {
        rows.sort((a, b) => (bestLap(a) ?? Infinity) - (bestLap(b) ?? Infinity));
    }
    const reporting = rows.filter(r => (r.age_ms ?? 0) < 30000 && r.on_track).length;
    // Whether this number is a position or merely a place in a list. Only
    // drivers who have paired a reporter are here at all, so with four of a
    // split's sixteen cars reporting, the car at the top is first of four and
    // might be eighth on the road. Calling that P1 on race day would have
    // somebody's family cheering the wrong car.
    const cov = coverage.get(lobby ?? 0);
    const covered = isRace && cov && cov.entered > 0 && cov.reporting >= cov.entered;
    const posHead = covered
        ? `<th title="Position in this split. Every car entered for it is reporting, so this is the order on the road.">Pos</th>`
        : `<th title="${isRace
            ? `Place in this list, not position in the race. ${cov ? `${cov.reporting} of the ${cov.entered} cars` : 'Not every car'} in this split ${cov && cov.reporting === 1 ? 'is' : 'are'} reporting, so cars that are not here are not counted.`
            : 'Place in this list, by best lap.'}">#</th>`;
    const key = String(lobby ?? 0);
    const collapsed = collapsedSplits.has(key);
    const focused = focusedSplit === key;
    return `<div class="split${collapsed ? ' collapsed' : ''}${focused ? ' focused' : ''}" data-split="${key}">
        <button class="split-head" type="button" aria-expanded="${collapsed ? 'false' : 'true'}"
                onclick="onSplitClick('${key}')"
                title="Show only this split on the map">
            <span class="split-chev" role="button" tabindex="0"
                  aria-label="${collapsed ? 'Expand' : 'Collapse'} this split"
                  onclick="onSplitToggle(event, '${key}')"
                  onkeydown="if(event.key==='Enter'||event.key===' '){onSplitToggle(event,'${key}');event.preventDefault();}">▾</span>
            <span class="split-name">${lobby ? 'Split ' + lobby : 'Unassigned'}</span>
            <span class="split-meta">${rows.length} car${rows.length === 1 ? '' : 's'} reporting${reporting !== rows.length ? ` · ${reporting} live` : ''}${focused ? ' · on map' : ''}</span>
        </button>
        <table>
            <thead><tr>${posHead}<th>Driver</th><th>Lap</th><th>Last</th>${isRace
                ? '<th title="Gap to the car above, worked out from how far round the lap each of them is and shown at the leading car\'s best-lap pace. A gap in metres is exact; the seconds it becomes depend on where on the circuit it is being covered.">Gap</th>'
                : '<th>Best</th>'}${showFuel ? '<th>Fuel</th>' : ''}</tr></thead>
            <tbody>${rows.map((r, i) => rowHtml(r, i, showFuel, isRace, rows[i - 1])).join('')}</tbody>
        </table>
    </div>`;
}

// The idle page polls on the same 1.5 second cadence as a live race, and
// neither the next round nor a nightly schedule changes on that timescale.
// Cached for a minute so an empty page is not asking twice a second.
let idleCache = null;
async function idleFacts() {
    // Dropped early when the moment it was waiting for has arrived, so six
    // o'clock is not up to a minute late in saying practice is open.
    const due = idleCache?.prac?.enabled && new Date(idleCache.prac.at).getTime() <= Date.now();
    if (idleCache && !due && Date.now() - idleCache.at < 60000) return idleCache;
    const [nextRes, pracRes] = await Promise.all([
        sb.from('events')
            .select('name, round, starts_at, circuit_name')
            .eq('status', 'scheduled')
            .gte('starts_at', new Date().toISOString())
            .order('starts_at')
            .limit(1)
            .maybeSingle(),
        sb.rpc('live_practice_window'),
    ]);
    idleCache = { at: Date.now(), next: nextRes.data, prac: pracRes.data };
    return idleCache;
}

/** Shown when no race is running, so the page is never a blank map. */
async function renderIdle() {
    // A practice window that is open but has nobody out yet lands here too,
    // which is the one moment the page can actually recruit the first car.
    const { next, prac } = await idleFacts();
    const practiceOpen = !!(prac?.enabled && prac.open);

    const when = next?.starts_at
        ? new Date(next.starts_at).toLocaleString('en-GB',
            { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })
        : null;

    app.innerHTML = `
    <div class="page-wrap">
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
            <div class="eyebrow" style="margin:0">Live Timing</div>
            <a class="head-link" href="/endurance/laps/">Lap Log
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="title" style="margin-top:0.4rem">Live</div>
        <div class="state">
            <h3>${practiceOpen ? 'Practice is open' : 'No race running'}</h3>
            <p>${practiceOpen
                ? `Live timing is open for practice ${prac.always ? 'right up to race day' : `until ${esc(prac.to)} UK time`} and nothing is reporting yet. Grab the connector or the Android app from your profile, follow the instructions there, and yours is the first car on the map.`
                : next
                    ? `Timing goes live for <strong>Round ${next.round}</strong> at ${esc(next.circuit_name || next.name)}, ${esc(when)}. Every split appears here at once, lap by lap, for as long as the race is on.`
                    : 'Timing appears here while a round is running, with every split shown at once.'}</p>
            ${!practiceOpen && prac?.enabled
                ? prac.race_day
                    // Stood down for the day, so promising a time would be a
                    // lie. Said as a rule rather than a one-off.
                    ? (prac.always
                        // "Paused on race days, so you can try it before you
                        // race" does not follow. Said plainly instead.
                        ? '<p style="margin-top:0.9rem">Practice live timing is paused today because there is a race on.</p>'
                        : `<p style="margin-top:0.9rem">Practice live timing is paused on race days. It is open ${esc(prac.from)} to ${esc(prac.to)} UK time every other evening, so you can try it out before you race.</p>`)
                    : `<p style="margin-top:0.9rem">Want to try it before race day? Practice live timing is open every evening, ${esc(prac.from)} to ${esc(prac.to)} UK time. Next open ${esc(opensIn(prac.at))}.</p>`
                : ''}
            <a class="cta" href="${practiceOpen ? '/endurance/profile/#account' : '/endurance/calendar/'}">${practiceOpen ? 'Pair your reporter' : 'Full calendar'}</a>
        </div>
        <div class="foot-note">
            Racing in GTEC? You can put your own car on here.
            <a href="/endurance/profile/#account">Pair live timing in your portal</a>.
        </div>
    </div>`;
}

/** "in about 2 hours", from the server's next-opening timestamp. Phrased
 *  loosely on purpose: the exact minute is on the line above it. */
function opensIn(iso) {
    const mins = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
    if (!Number.isFinite(mins) || mins <= 0) return 'shortly';
    if (mins < 60) return `in about ${mins} min`;
    const hrs = Math.round(mins / 60);
    return `in about ${hrs} hour${hrs === 1 ? '' : 's'}`;
}

function renderField(rows) {
    const ev = rows[0];
    const byLobby = new Map();
    rows.forEach(r => {
        const k = r.lobby_number ?? 0;
        if (!byLobby.has(k)) byLobby.set(k, []);
        byLobby.get(k).push(r);
    });
    const lobbies = [...byLobby.keys()].sort((a, b) => a - b);
    // Only show Fuel when something is actually reporting it. A connector
    // that predates fuel would otherwise give every car a dash, and the
    // column reappears by itself once one does.
    const showFuel = rows.some(r => r.fuel_pct != null);

    // The shell is built once and then only its volatile parts are updated.
    // Rebuilding it every poll would destroy and recreate the canvas twice a
    // second, which costs nothing visually but makes a drag impossible: the
    // element being dragged stops existing mid-gesture.
    if (!document.getElementById('live-shell')) {
        // A fresh shell means the page was idle and has come back, so any zoom
        // from the previous session points at a circuit that may not even be
        // the same one.
        view = { scale: 1, x: 0, y: 0 };
        app.innerHTML = `
    <div class="page-wrap" id="live-shell">
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
            <div class="eyebrow" style="margin:0">Live Timing</div>
            <span id="live-pill"></span>
            <a class="head-link" id="lap-log-link" href="/endurance/laps/">Lap Log
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="title" style="margin-top:0.4rem" id="live-round"></div>
        <div class="subtitle" id="live-sub"></div>
        <div class="subtitle" id="live-mode-note"></div>
        <div class="splits" id="live-splits"></div>
        <div class="map-card">
            <div class="map-head">
                <span class="map-title" id="map-title">Track Map</span>
                <span class="map-note" id="map-note"></span>
                <span class="map-zoom">
                    <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">&minus;</button>
                    <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
                    <button type="button" class="reset" id="zoom-reset" aria-label="Reset the view" title="Fit the whole circuit">Fit</button>
                    <button type="button" class="reset" id="view-3d" aria-pressed="false" aria-label="Tilt the map">3D</button>
                </span>
            </div>
            <div class="map-stage">
                <canvas id="track"></canvas>
                <div class="map-hint" id="map-hint" hidden></div>
            </div>
        </div>
        <div class="map-card" id="lap-card">
            <div class="map-head">
                <span class="map-title" id="lap-title">Lap Times</span>
                <span class="map-note" id="lap-note"></span>
            </div>
            <div class="map-stage"><canvas id="lap-chart"></canvas></div>
            <div class="chart-cars" id="lap-cars"></div>
            <div class="chart-empty" id="lap-empty" hidden></div>
        </div>
        <div class="foot-note">
            Only drivers who have paired a reporter appear here, so this is part of the grid rather than all of it.
            ${ev?.mode === 'race' ? 'Order is by laps completed.' : 'Order is by best lap.'}<br>
            Racing in GTEC? <a href="/endurance/profile/#account">Pair live timing in your portal</a>.
            <span id="terrain-credit" hidden><br>Terrain from SRTM via
            <a href="https://registry.opendata.aws/terrain-tiles/">AWS Open Data</a>;
            the circuit's position on the map was fitted against
            <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> (ODbL).</span>
        </div>
    </div>`;
    }

    // ---- the parts that change ----
    const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

    set('live-pill', ev.mode === 'practice'
        ? '<span class="live-pill practice-pill"><span class="live-dot"></span>Practice</span>'
        : ev.is_test
            ? '<span class="live-pill test-pill">Test</span>'
            : '<span class="live-pill"><span class="live-dot"></span>Live</span>');

    set('live-round', `Round ${ev.round}`);
    // Straight to this round rather than to whichever the log opens on, so
    // the link lands where the person was already looking.
    const logLink = document.getElementById('lap-log-link');
    if (logLink && ev.round != null) logLink.href = `/endurance/laps/?round=${encodeURIComponent(ev.round)}`;
    set('live-sub', `${esc(ev.event_name)} · ${rows.length} car${rows.length === 1 ? '' : 's'} reporting across ${lobbies.length} split${lobbies.length === 1 ? '' : 's'}`);

    const modeNote = document.getElementById('live-mode-note');
    if (modeNote) {
        if (ev.mode === 'practice') {
            modeNote.style.cssText = 'color:#86efac';
            modeNote.textContent = 'Open practice, not a race. Everyone here is out on their own, so laps and gaps mean nothing yet.';
        } else if (ev.is_test) {
            modeNote.style.cssText = 'color:#fdba74';
            modeNote.textContent = 'This is a test of live timing, not a live race.';
        } else {
            modeNote.textContent = '';
        }
        modeNote.hidden = !modeNote.textContent;
    }

    set('live-splits', lobbies.map(l => splitHtml(l, byLobby.get(l), showFuel)).join(''));
    bindDriverCards();
    setMapTitle();
    setMapHint();
    // Here as well as when laps arrive, because focusing a split comes
    // through this and changes which cars the chart is about.
    drawLapChart();
}

/** Which split the map is showing, in the map's own title.
 *
 *  It used to be one of the facts rotating beside the title, which meant a
 *  viewer who picked a split and then watched for five minutes had to wait
 *  for it to come round again to remember which one they were watching. The
 *  title holds still, so that is where it belongs. The tooltip says how to
 *  get back, because somebody who has forgotten what they clicked has also
 *  forgotten how to unclick it. */
function setMapTitle() {
    const el = document.getElementById('map-title');
    if (!el) return;
    if (focusedSplit === null) {
        el.textContent = 'Track Map';
        el.removeAttribute('title');
        return;
    }
    const name = focusedSplit === '0' ? 'Unassigned' : 'Split ' + focusedSplit;
    el.innerHTML = `Track Map <span class="map-only">&middot; ${esc(name)}</span>`;
    el.title = `The map is showing ${focusedSplit === '0' ? 'unassigned cars' : name} only. `
             + `Click that heading in the list above to put every split back on the map.`;
}

// ---------------------------------------------------------------
// Track map
//
// There is no circuit outline and nothing to calibrate per track. Every
// position a car reports is kept, and the accumulated cloud of points IS
// the lap: after a few minutes of running the shape of the circuit is
// simply there, on any track, including one nobody has mapped.
//
// Points live for the life of the page, so a viewer arriving mid-race
// builds the shape up over their first few minutes rather than being shown
// a map that was drawn for them.
// ---------------------------------------------------------------
// Which splits are collapsed, and which one the map is showing. Remembered
// per viewer, because someone following one split will want it that way
// every time they open the page, not just this once.
const collapsedSplits = new Set();
let focusedSplit = null;        // null means every split
// Declared here rather than beside the rest of the map's state further down,
// because the stored preferences are read just below and a `let` cannot be
// assigned before its declaration. It was down there, the assignment threw a
// reference error, the catch below swallowed it, and the upshot was that the
// 3D choice silently reset to flat on every reload for everybody.
let view3d = true;              // the tilted map is the one worth seeing first
let viewChosen = false;         // whether the viewer has pressed the button
let mapTurned = false;          // whether they have worked out how to turn it
// The driver the pointer is over in the list, so the map can say which dot
// that is. Pointer only: there is no hover on a phone, and the card that
// opens on a tap already answers "who is this".
let hoveredDriver = null;
try {
    const raw = localStorage.getItem('gtecLiveSplits');
    if (raw) {
        const v = JSON.parse(raw);
        (v.collapsed || []).forEach(k => collapsedSplits.add(String(k)));
        focusedSplit = v.focused != null ? String(v.focused) : null;
        // Absent means they have never pressed the button, which is not the
        // same as having chosen the flat map. Plenty of viewers have a stored
        // preference only because they collapsed a split, and reading that as
        // a decision would leave every one of them on the old default for
        // good. Only a real press is honoured.
        if (v.view3d != null) { view3d = !!v.view3d; viewChosen = true; }
        mapTurned = !!v.turned;
    }
} catch (e) { /* private window, blocked storage: defaults are fine */ }

function saveSplitPrefs() {
    try {
        localStorage.setItem('gtecLiveSplits', JSON.stringify({
            collapsed: [...collapsedSplits], focused: focusedSplit,
            // Which way up the map was. Not the angle: coming back to a
            // circuit turned to a strange angle you do not remember choosing
            // is worse than coming back to the default one. Left out
            // altogether until the viewer presses the button, so that the
            // default can change without overriding anybody's choice.
            view3d: viewChosen ? view3d : undefined,
            // Whether they have worked out how to turn it, so the hint stops
            // appearing once they have.
            turned: mapTurned || undefined,
        }));
    } catch (e) { /* nothing to do, and nothing depends on it */ }
}

/**
 * Two separate controls, because they are two separate intentions and
 * cramming both onto one click made the second press do two things at once.
 *
 *   the header   -> show this split on the map, or go back to all of them
 *   the chevron  -> collapse or expand this split's table
 */
function onSplitClick(key) {
    focusedSplit = (focusedSplit === key) ? null : key;
    // Focusing a collapsed split should show it, or the click appears to
    // have done nothing.
    if (focusedSplit === key) collapsedSplits.delete(key);
    // The map reframes around a different set of cars, so a zoom held from
    // the previous framing would point at nothing in particular.
    view = { scale: 1, x: 0, y: 0 };
    syncZoomButtons();
    redrawSplits();
}

function onSplitToggle(ev, key) {
    ev.stopPropagation();     // the chevron is inside the header button
    if (collapsedSplits.has(key)) collapsedSplits.delete(key);
    else collapsedSplits.add(key);
    redrawSplits();
}

function redrawSplits() {
    saveSplitPrefs();
    if (lastRows) { renderField(lastRows); drawTrack(lastRows); }
}

const SPLIT_COLOURS = ['#ffd166', '#38bdf8', '#4ade80', '#f472b6', '#fb923c', '#a78bfa', '#2dd4bf', '#f87171'];
// driver_id -> every point that car has reported, in order. Per car rather
// than one shared cloud, because consecutive points from the same car are
// consecutive in time and can therefore be joined into a line. A single
// mixed cloud can only ever be drawn as dots.
const carPaths = new Map();
// The outline captured server side, so a refresh or a viewer arriving an
// hour into a race gets the circuit straight away instead of an empty box.
let basePath = [];
// The same points with the first repeated at the end, once the lap is
// finished, so the circuit draws as the loop it is.
let baseLoop = [];
let baseFetchedAt = 0;
// How many points the server reported at the last fetch, so a poll can tell
// whether the stored outline has grown, shrunk or finished without asking
// for the whole thing.
let baseServerPoints = 0;
let baseArmed = false;
// Per car. Only needed in full while the cars ARE the map, which is before
// the server's outline has been captured. Once there is an outline nothing of
// a car's history is drawn at all, so it is trimmed to a short tail: enough to
// keep the car inside the frame and to tell a drive from a teleport, and no
// more. Sixty cars holding 4,000 points each is 240,000 points of browser
// memory earning nothing.
const PATH_MAX = 4000;
const PATH_KEEP_WITH_OUTLINE = 48;
// Two points further apart than this are not consecutive track: a car has
// been reset to the pits, or its reporter dropped out for a while. Joining
// them would draw a line straight across the infield.
const MAX_SEGMENT_M = 600;
// Faster than any car in GT7 goes, so a move that implies more than this is
// a car being put back somewhere rather than driven there.
const TELEPORT_KPH = 400;

function splitColour(lobby) {
    return SPLIT_COLOURS[((lobby || 1) - 1) % SPLIT_COLOURS.length];
}

/**
 * A colour per team, so teammates match and no two teams on track look the
 * same.
 *
 * Not the manufacturer's colour: several teams run the same manufacturer and
 * would be indistinguishable, which defeats the point of colouring the map at
 * all. The manufacturer's own colour still appears on the hover card, where
 * brand identity belongs and telling cars apart does not.
 *
 * Seeded from the team's id so a team keeps its colour across a session and a
 * refresh, then any clash is resolved against the teams actually on track.
 * Twelve colours and fifteen teams makes a clash a certainty, and two teams
 * drawn identically is the one outcome worth ruling out.
 */
const TEAM_COLOURS = [
    '#f87171', '#60a5fa', '#4ade80', '#f472b6', '#fb923c', '#22d3ee',
    '#a78bfa', '#facc15', '#2dd4bf', '#e879f9', '#a3e635', '#fca5a5',
];

function hashId(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
    return h;
}

let teamColours = new Map();     // team or driver id -> hex

function assignTeamColours(rows) {
    // One key per car on track: its team, or itself when it has no team, so a
    // solo driver is as distinguishable as any team.
    const keys = [...new Set(rows.map(r => r.team_id || r.driver_id).filter(Boolean))].sort();
    const taken = new Set();
    const next = new Map();
    for (const key of keys) {
        let i = hashId(key) % TEAM_COLOURS.length;
        // Walk to the next free slot. Deterministic because the keys are
        // sorted, so the same field always produces the same assignment.
        for (let n = 0; n < TEAM_COLOURS.length && taken.has(i); n++) {
            i = (i + 1) % TEAM_COLOURS.length;
        }
        taken.add(i);
        next.set(key, TEAM_COLOURS[i]);
    }
    teamColours = next;
}

function carColour(r) {
    return teamColours.get(r.team_id || r.driver_id) || splitColour(r.lobby_number);
}

/**
 * The number to put on a car.
 *
 * During a race the entry's number, because a team fields one car carrying
 * one number and that is what every other timing screen shows. Otherwise the
 * driver's own career number, because in practice both teammates can be out
 * at once and they would both be labelled with the number their car will
 * carry on race day, which is normally the team leader's.
 */
function carNumber(r, mode) {
    return mode === 'race'
        ? (r.car_number ?? r.career_number)
        : (r.career_number ?? r.car_number);
}

async function loadBasePath(state) {
    // The state is three numbers and comes with every poll. The outline
    // itself can be two thousand points, so it is only refetched when those
    // numbers say something happened to it.
    //
    // An outline that merely GREW can wait: the page is accumulating its own
    // points meanwhile, so the picture is right either way, and refetching
    // two thousand rows every poll for one new point would be absurd.
    //
    // An outline that SHRANK cannot wait. That is an admin clearing it, or
    // the trace restarting at the line, and until the page notices it is
    // drawing a circuit the server no longer has. Waiting 45 seconds to find
    // that out is what made clearing look as though it had not worked.
    const pts = state?.points;
    const known = pts != null;
    const shrank   = known && pts < baseServerPoints;
    const finished = known && (!!state.closed !== baseClosed || !!state.armed !== baseArmed);
    const grew     = known && pts > baseServerPoints;
    // The server has an outline and this page does not, which is the first
    // poll or a fetch that failed. Keep asking.
    const missing  = known && pts > 0 && basePath.length === 0;
    if (!shrank && !finished && !missing
        && !(grew && Date.now() - baseFetchedAt > 45000)
        && baseFetchedAt) return;

    baseFetchedAt = Date.now();
    const { data, error } = await sb.rpc('live_track');
    if (error || !data) return;
    const baseClosedNext = !!state?.closed;
    baseClosed = baseClosedNext;
    basePath = data.map(p => [p.x, p.z, p.y]).filter(p => p[0] != null && p[1] != null);
    // A finished outline is a loop, and was being drawn as a line, so it had
    // a gap at the start/finish straight the width of whatever the car
    // covered between its last beacon and its first. Joining the ends closes
    // it. Only once the server says the lap is finished: before that the two
    // ends are nowhere near each other and a line between them would be a
    // chord straight across the circuit.
    baseLoop = (baseClosedNext && basePath.length > 2)
        ? [...basePath, basePath[0]]
        : basePath;
    // What the SERVER said, not what survived filtering here, or a single
    // point with no coordinates would leave the two permanently unequal and
    // refetch on every poll forever.
    baseServerPoints = known ? pts : data.length;
    baseArmed  = !!state?.armed;
}

// ---------------------------------------------------------------
// Cars that are not at this circuit.
//
// A driver who leaves the connector running and goes off to hotlap somewhere
// else on a Tuesday is still sending valid beacons, and practice is open. The
// server already refuses their positions for the saved outline; the page has
// to keep them out of the picture too, because the map frames whatever it is
// given and one car at another venue stretches the view across both until the
// real circuit is a squiggle in the corner.
//
// Judged against the saved outline rather than against each other: the
// outline is the one thing on the page that is known to be this circuit.
// ---------------------------------------------------------------
let strays = new Set();

// How many of each split's entered cars are reporting, which is the whole
// difference between a position and a place in a list. Entries do not change
// during a session and reporters come and go slowly, so this is asked for
// every ten seconds rather than every poll.
let coverage = new Map();
let coverageAt = 0;
async function loadCoverage(eventId) {
    if (Date.now() - coverageAt < 10000) return;
    coverageAt = Date.now();
    const { data, error } = await sb.rpc('live_split_coverage', { p_event_id: eventId });
    if (error || !data) return;
    coverage = new Map(data.map(c => [c.lobby_number ?? 0,
                                      { entered: c.entered, reporting: c.reporting }]));
}

// How far off the traced line a car can be and still be on this circuit.
// A track is maybe 15m wide and racing lines vary, so 80m is generous.
const MATCH_M = 80;

// Whether the outline is a finished lap, as the server records it.
//
// Not computed here any more. A geometric test on the client has exactly the
// flaw it had on the server: the Nordschleife crosses under itself, so no
// radius separates "back where I was" from "passing beneath where I was",
// and the outline froze mid-lap. The lap counter is the authority and only
// the server sees it.
let baseClosed = false;

function outlineClosed() { return baseClosed; }

function findStrays(rows) {
    const out = new Set();
    // Only a FINISHED outline can say where this circuit is. Judging against
    // a partial one brands the very car that is tracing it: it drives on into
    // track nothing has covered yet, measures far from every point captured so
    // far, and gets called a stray, which then stops it being drawn. Exactly
    // what happened the first time anyone drove a freshly cleared round.
    if (!outlineClosed()) return out;

    // Distance to the nearest traced point, NOT to a bounding box. GT7's
    // coordinates are per-circuit and roughly centred on each track's own
    // origin, so circuits overlap in space: the Nordschleife's bounding box
    // contains the whole of Sugo. Only proximity to the line itself tells
    // one apart from the other, which a driver on Sugo proved by being drawn
    // through the middle of the Nordschleife.
    // Measured to the line, not to the nearest recorded point. At racing
    // speed the points are 80 to 170m apart, so a car squarely on the track
    // but midway between two of them is further from either than the match
    // radius, and would be called a stray.
    const lim = MATCH_M * MATCH_M;
    const maxSeg = MAX_SEGMENT_M * MAX_SEGMENT_M;
    rows.forEach(r => {
        if (r.x == null || r.z == null) return;
        let best = Infinity;
        for (let i = 0; i < baseLoop.length - 1; i++) {
            const ax = baseLoop[i][0], az = baseLoop[i][1];
            const bx = baseLoop[i + 1][0], bz = baseLoop[i + 1][1];
            const dx = bx - ax, dz = bz - az;
            const l2 = dx * dx + dz * dz;
            // A gap too big to be track: where the shape job changed hands.
            if (l2 > maxSeg) continue;
            let t = l2 > 0 ? ((r.x - ax) * dx + (r.z - az) * dz) / l2 : 0;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const px = r.x - (ax + t * dx), pz = r.z - (az + t * dz);
            const d = px * px + pz * pz;
            if (d < best) {
                best = d;
                if (best <= lim) break;          // on the line, stop looking
            }
        }
        if (best > lim) out.add(r.driver_id);
    });
    return out;
}

// Drivers whose next recorded point must start a new run rather than join
// the last one. See below.
const trailBreak = new Set();

function recordPositions(rows) {
    rows.forEach(r => {
        if (r.x == null || r.z == null) return;
        // Their trail belongs to a different circuit, so it is not drawn and
        // not kept.
        if (strays.has(r.driver_id)) { carPaths.delete(r.driver_id); return; }
        // Only cars actually circulating. A car in the menus or long gone
        // sits at one spot and would drag the whole map toward it.
        if (!r.on_track || (r.age_ms ?? 0) > 30000) { trailBreak.add(r.driver_id); return; }
        const path = carPaths.get(r.driver_id) || [];
        const last = path[path.length - 1];
        // Skip a repeat of the same position, which is a throttled or
        // stationary car rather than movement.
        if (last && last[0] === r.x && last[1] === r.z) return;
        // A car that was in the menus has been somewhere this page did not
        // watch, and in GT7 that somewhere is the pit box. Nothing is recorded
        // while it is away, so the point before and the point after end up
        // next to each other in the trail and get joined: a line straight
        // across the infield to the pits, which is the one part of the map
        // that is not true. The fourth value says not to join this one.
        let brk = trailBreak.delete(r.driver_id);
        // When the car was HERE, not when this page got round to asking. The
        // page can poll a little early or late, and timing the gap by the
        // poll would make a normal lap look like a teleport now and then.
        const now = Date.now() - (r.age_ms ?? 0);
        // The flag above only catches a car the page SAW leave the track, and
        // GT7 does not always drop its in-race flag the moment a car is put
        // back in its box: a driver quitting can report one or two perfectly
        // ordinary-looking positions from the pit lane. Those are a teleport,
        // not driving, and the distance guard cannot see it because a pit box
        // is a few hundred metres away, not kilometres. So judge it by the
        // speed the move implies over the time it actually took. Nothing in
        // GT7 covers ground at 400 km/h, so anything that claims to did not
        // drive there.
        if (!brk && last && last[4]) {
            const dt = (now - last[4]) / 1000;
            const m  = Math.hypot(r.x - last[0], r.z - last[1]);
            if (dt > 0 && (m / dt) * 3.6 > TELEPORT_KPH) brk = true;
        }
        path.push([r.x, r.z, r.y, brk, now]);
        const keep = basePath.length ? PATH_KEEP_WITH_OUTLINE : PATH_MAX;
        while (path.length > keep) path.shift();
        carPaths.set(r.driver_id, path);
    });
}

/** Draws one car's path as a line, breaking it wherever two points are too
 *  far apart to be consecutive track, or wherever the car left the track
 *  between them. */
function strokePath(g, path, S, from, to) {
    let started = false;
    for (let i = from; i < to; i++) {
        const a = path[i], b = path[i + 1];
        if (!b) break;
        const gap = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (b[3] || gap > MAX_SEGMENT_M) { started = false; continue; }
        if (!started) {
            const p = S(a[0], a[1], a[2]);
            g.beginPath(); g.moveTo(p[0], p[1]); started = true;
        }
        const q = S(b[0], b[1], b[2]);
        g.lineTo(q[0], q[1]);
    }
    if (started) g.stroke();
}

// ---------------------------------------------------------------
// Zoom and pan.
//
// The view is an overlay on the auto-fit rather than a replacement for it:
// scale 1 with no offset is "the whole circuit, framed". That way the map
// keeps reframing itself as more of the track is traced, and a reader who
// has zoomed into the Karussell stays there across the 1.5 second redraw.
//
// Flat by default, tilted on request. The tilt was left out originally
// because the map was whatever the cars had traced since the page opened,
// which carried no useful height. Now the stored outline is a finished lap
// with an elevation on every point, so the data is there.
//
// Perspective, with the cars exempt from it. The first cut was
// orthographic, on the reasoning that perspective makes a car's dot change
// size with where it is on the circuit and this is a timing page before it
// is a picture. The reasoning was half right and the conclusion was wrong:
// without convergence a tilted map reads as a squashed flat map rather than
// a circuit sitting in space.
//
// The dots do not have to obey the projection. The track converges, which is
// what gives the depth; the cars are placed by the projection but drawn at a
// constant size, which is what keeps them readable. Nothing had to be traded
// after all.
//
// The height is exaggerated because it has to be. The 24h layout climbs
// about 300 m across 20 km, which is one and a half percent: at true scale a
// tilt shows nothing at all. The factor is stated on the map rather than
// applied quietly.
// ---------------------------------------------------------------
const ZOOM_MIN = 1, ZOOM_MAX = 14;
const TILT_MIN = 0.12, TILT_MAX = 1.25;
const HEIGHT_EXAGGERATION = 6;
// Sorting every segment by depth would cost a stroke each; bucketing keeps
// the colour batching from 1168 and still draws the Nordschleife's underpass
// the right way round, because two bits of track that cross are far apart in
// depth and land in different buckets.
const DEPTH_BUCKETS = 16;
// How far the eye sits from the circuit, as a multiple of its longest side.
// Lower is more dramatic and more distorted; this is about the strength of a
// long camera lens.
// 2.6 was a long lens and the result read as a squashed flat map. Closer
// than this and the near side of the circuit bows unpleasantly.
const EYE_DISTANCE = 1.5;
// Near track thicker than far, which turns out to be the strongest depth cue
// of the three and the cheapest: the segments are already stroked a depth
// bucket at a time, so a width per bucket costs nothing at all.
const DEPTH_WIDTH = [0.55, 1.45];
// How many steps the terrain's fade is quantised into. Eight is invisible on
// a hairline and turns thousands of strokes into dozens.
const FADE_STEPS = 8;
// And how many levels of brightness the hills are lit in. Height and light are
// folded into this one number, so shading the landscape costs no strokes at
// all: six tones is fewer buckets than the colour-per-contour-level it
// replaced.
const TONE_STEPS = 6;
// Quantisation of the uphill direction stored per point, which has to agree
// with the tool that wrote the file.
const ASPECT_STEPS = 64;
// Where the light comes from, as a bearing in the file's own frame: aspect 0
// is uphill due east, counting round towards south. This is the north-west,
// which is where cartographers have put the sun since the nineteenth century,
// because a relief lit from anywhere below the horizontal reads inside out.
// Fixed to the world rather than to the viewer, so turning the map swings the
// lit slopes round and the hills look like hills rather than like a pattern.
const LIGHT_FROM = -Math.PI * 0.75;
let view = { scale: 1, x: 0, y: 0 };
// Where the tilted map sits when nobody has turned it: a three-quarter view,
// far enough round to show the circuit has a shape and far enough over to
// show it has a hillside. Named because three other things have to agree
// with it, including the opening move below.
const VIEW_YAW = 0.6, VIEW_TILT = 0.8;
// view3d lives up with the stored preferences, which are read before this.
let yaw = VIEW_YAW, tilt = VIEW_TILT;

function resetView() {
    view = { scale: 1, x: 0, y: 0 };
    yaw = VIEW_YAW; tilt = VIEW_TILT;
    endIntro();
    syncZoomButtons();
    if (lastRows) drawTrack(lastRows);
}

function setView3d(on) {
    if (view3d === on) return;
    view3d = on;
    // Now it IS a choice, and gets stored as one. Until this, the absence of
    // a stored value is what lets the default change under a viewer who has
    // never expressed an opinion either way.
    viewChosen = true;
    // The fit is computed from the projected shape, which changes completely
    // between flat and tilted, so a pan carried across would point at
    // somewhere else entirely.
    view = { scale: 1, x: 0, y: 0 };
    syncZoomButtons();
    saveSplitPrefs();
    setMapHint();
    if (lastRows) drawTrack(lastRows);
}

/** Keeps the circuit from being dragged off the edge: panning is bounded by
 *  how far the zoomed content actually overflows the canvas. */
function clampView(w, h, contentW, contentH) {
    view.scale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, view.scale));
    const maxX = Math.max(0, (contentW * view.scale - w) / 2 + 26);
    const maxY = Math.max(0, (contentH * view.scale - h) / 2 + 26);
    view.x = Math.min(maxX, Math.max(-maxX, view.x));
    view.y = Math.min(maxY, Math.max(-maxY, view.y));
}

/** Zoom about a fixed screen point, so what is under the cursor or the
 *  midpoint of a pinch stays under it. */
function zoomAt(sx, sy, factor) {
    const cv = document.getElementById('track');
    if (!cv) return;
    const cx = cv.clientWidth / 2, cy = cv.clientHeight / 2;
    const next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, view.scale * factor));
    const k = next / view.scale;
    view.x = sx - cx - (sx - cx - view.x) * k;
    view.y = sy - cy - (sy - cy - view.y) * k;
    view.scale = next;
    syncZoomButtons();
    if (lastRows) drawTrack(lastRows);
}

// ---------------------------------------------------------------
// The opening move.
//
// The map arrives flat, as a plan of the circuit, and over five seconds
// turns and tips itself into the three-quarter view. It is the one gesture
// that explains the whole map: the first second says "this is the
// Nordschleife", the last says "and it is draped over a mountain range".
// Nothing else on the page can say the second part, and a viewer who never
// thinks to drag never finds out.
//
// Time-based rather than frame-based, so it takes five seconds on anything:
// a redraw of the real terrain costs ten milliseconds on a desktop and
// fifteen on a phone, and the phone simply draws fewer frames of the same
// five seconds rather than a slower animation.
//
// It gets out of the way instantly. Any drag, pinch, zoom, Fit or 2D press
// ends it where it stands, because somebody reaching for the map wants the
// map, not the end of an animation. It is skipped for anyone who asks for
// reduced motion, and it never runs twice in a page's life.
// ---------------------------------------------------------------
const INTRO_MS = 5000;
let introAt = 0, introRaf = 0, introDone = false;

function endIntro() {
    if (introRaf) cancelAnimationFrame(introRaf);
    introRaf = 0;
    introAt = 0;
    introDone = true;
}

function startIntro() {
    if (introDone || introAt || !view3d) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { introDone = true; return; }
    introAt = performance.now();
    yaw = 0; tilt = 0;
    const frame = () => {
        introRaf = 0;
        if (!introAt) return;
        // Eased at both ends: it leans into the move and settles out of it,
        // which is what makes five seconds read as deliberate rather than as
        // the page still loading.
        const t = Math.min(1, (performance.now() - introAt) / INTRO_MS);
        const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        yaw  = VIEW_YAW  * e;
        tilt = VIEW_TILT * e;
        if (lastRows) drawTrack(lastRows);
        if (t >= 1) { endIntro(); syncZoomButtons(); return; }
        introRaf = requestAnimationFrame(frame);
    };
    introRaf = requestAnimationFrame(frame);
}

function syncZoomButtons() {
    const out = document.getElementById('zoom-out');
    const inn = document.getElementById('zoom-in');
    const rst = document.getElementById('zoom-reset');
    if (out) out.disabled = view.scale <= ZOOM_MIN + 0.001;
    if (inn) inn.disabled = view.scale >= ZOOM_MAX - 0.001;
    if (rst) rst.disabled = view.scale <= ZOOM_MIN + 0.001 && !view.x && !view.y
                            && (!view3d || (Math.abs(yaw - VIEW_YAW) < 0.001
                                         && Math.abs(tilt - VIEW_TILT) < 0.001));
    const btn = document.getElementById('view-3d');
    if (btn) {
        btn.textContent = view3d ? '2D' : '3D';
        btn.title = view3d
            ? 'Back to the flat map, which is the easier one to read'
            : `Tilt the circuit and show its elevation, exaggerated ${HEIGHT_EXAGGERATION} times. Drag to turn it.`;
        btn.setAttribute('aria-pressed', String(view3d));
    }
}

function bindMapControls() {
    const cv = document.getElementById('track');
    if (!cv || cv.dataset.bound) return;
    cv.dataset.bound = '1';

    // Anything at all aimed at the map ends the opening move where it
    // stands. Bound here, before the handlers that do the actual work, and
    // deliberately blunter than they are: a wheel does not dismiss the hint
    // because scrolling past the map is not learning to turn it, but it is
    // still somebody touching the map, and the animation must get out of the
    // way of that.
    ['pointerdown', 'wheel', 'touchstart'].forEach(ev =>
        cv.addEventListener(ev, endIntro, { passive: true }));

    const at = e => {
        const r = cv.getBoundingClientRect();
        return [e.clientX - r.left, e.clientY - r.top];
    };

    cv.addEventListener('wheel', e => {
        e.preventDefault();
        const [sx, sy] = at(e);
        // deltaMode 1 is lines rather than pixels, which a few mice still use.
        const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
        zoomAt(sx, sy, Math.exp(-d * 0.0022));
        // Deliberately does NOT dismiss the hint. The map swallows the wheel,
        // so somebody scrolling the page with the cursor over it zooms by
        // accident, and counting that as "they have worked out how to turn
        // it" retires the hint for good without them having learned anything.
        // Only turning it counts, or a pinch, which is the gesture the hint
        // asks for on a touchscreen.
    }, { passive: false });

    // Mouse drag to pan. Pointer capture so a drag that leaves the canvas
    // still finishes cleanly rather than sticking.
    let dragging = false, lastPt = null;
    cv.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;      // touch is handled below
        dragging = true; lastPt = at(e);
        cv.classList.add('grabbing');
        cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
        if (!dragging) return;
        const p = at(e);
        if (view3d) {
            // Turning and tipping, which is what a drag means once the map is
