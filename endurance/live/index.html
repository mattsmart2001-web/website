<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
const app = document.getElementById('app');

sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data?.session) { if (portal) portal.style.display = ''; }
    else if (signin) signin.style.display = '';
});

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Lap times arrive as milliseconds. */
function lapTime(ms) {
    if (ms == null || ms <= 0) return '—';
    const m = Math.floor(ms / 60000);
    const s = ((ms % 60000) / 1000).toFixed(3).padStart(6, '0');
    return m > 0 ? `${m}:${s}` : s;
}

/**
 * How much to trust a car's position, from the age of its last beacon.
 *
 * Deliberately slow to alarm and quick to recover. A three-second cadence
 * over home WiFi skips beacons constantly, so six seconds of silence is
 * normal and thirty is worth showing. One good beacon returns a car
 * straight to live, with no smoothing.
 *
 * Nothing here ever contradicts the race: a driver whose phone dies on lap
 * 37 still reads lap 37, because losing the reporter is not losing the car.
 */
function liveness(ageMs, onTrack, elsewhere) {
    // Whether anything is arriving at all comes first. "In menus" and
    // "Another track" describe what a car that is REPORTING is doing, and
    // they used to be tested before the age, so a driver who closed their
    // reporter while sitting in the menus was described as being in the
    // menus for as long as the row survived. They are not in the menus. They
    // are not there at all, and that is the more useful thing to say.
    if (ageMs >= 300000) return { cls: 's-offline', flag: 'Offline', flagCls: 'flag-offline' };
    if (ageMs >= 30000)  return { cls: 's-lost', flag: 'Signal lost', flagCls: 'flag-lost' };
    // Said before the rest, because it explains why a car that is plainly
    // reporting is nowhere on the map.
    if (elsewhere) return { cls: 's-drifting', flag: 'Another track', flagCls: 'flag-menus' };
    if (!onTrack) return { cls: 's-drifting', flag: 'In menus', flagCls: 'flag-menus' };
    if (ageMs < 6000)   return { cls: 's-live', flag: '', flagCls: '' };
    return { cls: 's-drifting', flag: '', flagCls: '' };
}

/**
 * Fuel as a bar with the figure beside it. Thresholds are deliberately
 * blunt: under 25% is worth noticing, under 10% means a stop within a lap
 * or two. Turning that into "laps remaining" needs each driver's own
 * consumption, which is a later job and not worth faking from one reading.
 */
function fuelHtml(pct) {
    if (pct == null) return '<span class="fuel-pct">&mdash;</span>';
    const v = Math.max(0, Math.min(100, pct));
    const cls = v < 10 ? 'fuel-crit' : v < 25 ? 'fuel-low' : '';
    return `<div class="fuel-wrap ${cls}" title="${v.toFixed(1)}% of tank">
        <span class="fuel-pct">${Math.round(v)}%</span>
        <span class="fuel-bar"><span class="fuel-fill" style="width:${v}%"></span></span>
    </div>`;
}

/**
 * What is tracking this car. Looked up from a fixed table rather than
 * printed, because the value arrives from a client and must never reach the
 * page verbatim; anything unrecognised simply gets no badge.
 *
 * Worth showing because it is the most surprising thing on the page: some of
 * these cars are being tracked by a phone on the sofa next to the driver.
 */
const CLIENT_BADGE = {
    android: ['Phone', 'M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm3 18h4'],
    windows: ['PC', 'M3 5l8-1v7H3V5zm0 8h8v7l-8-1v-6zm10-9.2L21 3v8h-8V3.8zM13 13h8v8l-8-1.2V13z'],
    mac:     ['Mac', 'M3 5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5zM2 19h20'],
    linux:   ['Linux', 'M12 2a5 5 0 0 1 5 5v4l2 5a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3l2-5V7a5 5 0 0 1 5-5z'],
};

function clientBadge(client) {
    const b = CLIENT_BADGE[client];
    if (!b) return '';
    return `<span class="client" title="Reporting from ${b[0]}" aria-label="Reporting from ${b[0]}">`
        + `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"`
        + ` stroke-linecap="round" stroke-linejoin="round"><path d="${b[1]}"/></svg></span>`;
}

// A best lap cannot be slower than a lap that was actually driven. GT7 has
// been seen reporting a best of 8:07.307 alongside a completed lap of
// 8:03.379, and the screen showed both, which cannot be true of anything.
// The same rule the beacon applies, applied here to whatever this page has
// been given, so a row that is already wrong in the database stops reading
// as impossible.
function bestLap(r) {
    const best = r.best_lap_ms, last = r.last_lap_ms;
    if (best == null) return last;
    if (last == null || last < 20000) return best;
    return Math.min(best, last);
}

// How far a car is round the lap in total, laps included, in metres. Null
// until the round has a measured outline, which is what makes a gap possible
// at all.
function runDistance(r) {
    if (r.progress_m == null || !r.lap_length_m) return null;
    return (r.lap ?? 0) * r.lap_length_m + r.progress_m;
}

// The gap to the car in front, shown as time rather than distance because
// that is what a driver thinks in. The conversion is the leader's own best
// lap pace, which is an assumption and is said to be one in the column's
// tooltip: a gap of 400 m means a different number of seconds down the
// Döttinger Höhe than through the Karussell.
function gapHtml(r, ahead) {
    const mine = runDistance(r), theirs = ahead ? runDistance(ahead) : null;
    if (mine == null) return '<span class="sub2" style="display:inline">&mdash;</span>';
    if (!ahead) return '<span class="sub2" style="display:inline">leader</span>';
    if (theirs == null) return '<span class="sub2" style="display:inline">&mdash;</span>';
    const m = theirs - mine;
    if (m < 0) return '<span class="sub2" style="display:inline">&mdash;</span>';
    const laps = Math.floor(m / r.lap_length_m);
    if (laps >= 1) return `+${laps} lap${laps === 1 ? '' : 's'}`;
    const pace = bestLap(ahead) || bestLap(r);             // ms for a whole lap
    if (!pace) return `+${Math.round(m)} m`;
    const s = (m / r.lap_length_m) * (pace / 1000);
    // Minutes and seconds past a minute, the way a timing screen reads. "+270s"
    // is arithmetic; "+4:30" is a gap.
    const shown = s < 10 ? `${s.toFixed(1)}s`
                : s < 60 ? `${Math.round(s)}s`
                : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
    return `<span title="${Math.round(m)} m round the lap">+${shown}</span>`;
}

function rowHtml(r, idx, showFuel, isRace, ahead) {
    const st = liveness(r.age_ms ?? 0, r.on_track, strays.has(r.driver_id));
    const live = st.cls === 's-live' && r.on_track;
    // Order within a split is laps completed and then distance round the lap
    // in a race, and best lap in practice.
    // Car number sits on the team line rather than in its own column. A
    // Nordschleife lap is over seven minutes, so Last and Best are wide, and
    // a sixth column pushed Best off the edge of the card. The fifth column
    // is therefore Best in practice, where it is the ranking, and Gap in a
    // race, where it is the question everybody is asking.
    const num = carNumber(r, r.mode);
    const swatch = `<span class="team-dot" style="background:${carColour(r)}"></span>`;
    const sub = [
        num != null ? '#' + num : null,
        r.team_name ? esc(r.team_name) : null,
    ].filter(Boolean).join(' · ');

    return `<tr class="${st.cls}">
        <td class="pos">${idx + 1}</td>
        <td>
            <div class="dr"><span class="who" data-driver="${r.driver_id}" tabindex="0">${esc(r.display_name)}</span>${clientBadge(r.client)}${st.flag ? `<span class="flag ${st.flagCls}">${st.flag}</span>` : ''}</div>
            ${sub ? `<span class="team">${swatch}${sub}</span>` : ''}
        </td>
        <td class="num">${r.lap ?? 0}${r.laps_in_race ? `<span class="sub2" style="display:inline">/${r.laps_in_race}</span>` : ''}</td>
        <td class="num">${lapTime(r.last_lap_ms)}<span class="sub2">${live ? lapTime(r.lap_ms) : ''}</span></td>
        <td class="num">${isRace ? gapHtml(r, ahead) : lapTime(bestLap(r))}<span class="sub2">${live && r.speed_kph != null ? r.speed_kph + ' kph' : ''}</span></td>
        ${showFuel ? `<td>${fuelHtml(r.fuel_pct)}</td>` : ''}
    </tr>`;
}

function splitHtml(lobby, rows, showFuel) {
    // The same order the server sends, applied again here because the page
    // regroups the rows. A race is laps completed then how far into the
    // current lap; practice is the best lap, fastest first, because laps
    // completed in a practice session ranks nothing and rearranges itself
    // every time anybody crosses the line.
    const isRace = rows[0]?.mode === 'race';
    if (isRace) {
        rows.sort((a, b) => (b.lap ?? 0) - (a.lap ?? 0)
                         || (runDistance(b) ?? -1) - (runDistance(a) ?? -1)
                         || (b.lap_ms ?? 0) - (a.lap_ms ?? 0));
    } else {
        rows.sort((a, b) => (bestLap(a) ?? Infinity) - (bestLap(b) ?? Infinity));
    }
    const reporting = rows.filter(r => (r.age_ms ?? 0) < 30000 && r.on_track).length;
    // Whether this number is a position or merely a place in a list. Only
    // drivers who have paired a reporter are here at all, so with four of a
    // split's sixteen cars reporting, the car at the top is first of four and
    // might be eighth on the road. Calling that P1 on race day would have
    // somebody's family cheering the wrong car.
    const cov = coverage.get(lobby ?? 0);
    const covered = isRace && cov && cov.entered > 0 && cov.reporting >= cov.entered;
    const posHead = covered
        ? `<th title="Position in this split. Every car entered for it is reporting, so this is the order on the road.">Pos</th>`
        : `<th title="${isRace
            ? `Place in this list, not position in the race. ${cov ? `${cov.reporting} of the ${cov.entered} cars` : 'Not every car'} in this split ${cov && cov.reporting === 1 ? 'is' : 'are'} reporting, so cars that are not here are not counted.`
            : 'Place in this list, by best lap.'}">#</th>`;
    const key = String(lobby ?? 0);
    const collapsed = collapsedSplits.has(key);
    const focused = focusedSplit === key;
    return `<div class="split${collapsed ? ' collapsed' : ''}${focused ? ' focused' : ''}" data-split="${key}">
        <button class="split-head" type="button" aria-expanded="${collapsed ? 'false' : 'true'}"
                onclick="onSplitClick('${key}')"
                title="Show only this split on the map">
            <span class="split-chev" role="button" tabindex="0"
                  aria-label="${collapsed ? 'Expand' : 'Collapse'} this split"
                  onclick="onSplitToggle(event, '${key}')"
                  onkeydown="if(event.key==='Enter'||event.key===' '){onSplitToggle(event,'${key}');event.preventDefault();}">▾</span>
            <span class="split-name">${lobby ? 'Split ' + lobby : 'Unassigned'}</span>
            <span class="split-meta">${rows.length} car${rows.length === 1 ? '' : 's'} reporting${reporting !== rows.length ? ` · ${reporting} live` : ''}${focused ? ' · on map' : ''}</span>
        </button>
        <table>
            <thead><tr>${posHead}<th>Driver</th><th>Lap</th><th>Last</th>${isRace
                ? '<th title="Gap to the car above, worked out from how far round the lap each of them is and shown at the leading car\'s best-lap pace. A gap in metres is exact; the seconds it becomes depend on where on the circuit it is being covered.">Gap</th>'
                : '<th>Best</th>'}${showFuel ? '<th>Fuel</th>' : ''}</tr></thead>
            <tbody>${rows.map((r, i) => rowHtml(r, i, showFuel, isRace, rows[i - 1])).join('')}</tbody>
        </table>
    </div>`;
}

// The idle page polls on the same 1.5 second cadence as a live race, and
// neither the next round nor a nightly schedule changes on that timescale.
// Cached for a minute so an empty page is not asking twice a second.
let idleCache = null;
async function idleFacts() {
    // Dropped early when the moment it was waiting for has arrived, so six
    // o'clock is not up to a minute late in saying practice is open.
    const due = idleCache?.prac?.enabled && new Date(idleCache.prac.at).getTime() <= Date.now();
    if (idleCache && !due && Date.now() - idleCache.at < 60000) return idleCache;
    const [nextRes, pracRes] = await Promise.all([
        sb.from('events')
            .select('name, round, starts_at, circuit_name')
            .eq('status', 'scheduled')
            .gte('starts_at', new Date().toISOString())
            .order('starts_at')
            .limit(1)
            .maybeSingle(),
        sb.rpc('live_practice_window'),
    ]);
    idleCache = { at: Date.now(), next: nextRes.data, prac: pracRes.data };
    return idleCache;
}

/** Shown when no race is running, so the page is never a blank map. */
async function renderIdle() {
    // A practice window that is open but has nobody out yet lands here too,
    // which is the one moment the page can actually recruit the first car.
    const { next, prac } = await idleFacts();
    const practiceOpen = !!(prac?.enabled && prac.open);

    const when = next?.starts_at
        ? new Date(next.starts_at).toLocaleString('en-GB',
            { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })
        : null;

    app.innerHTML = `
    <div class="page-wrap">
        <div class="eyebrow">Live Timing</div>
        <div class="title">Live</div>
        <div class="state">
            <h3>${practiceOpen ? 'Practice is open' : 'No race running'}</h3>
            <p>${practiceOpen
                ? `Live timing is open for practice ${prac.always ? 'right up to race day' : `until ${esc(prac.to)} UK time`} and nothing is reporting yet. Grab the connector or the Android app from your profile, follow the instructions there, and yours is the first car on the map.`
                : next
                    ? `Timing goes live for <strong>Round ${next.round}</strong> at ${esc(next.circuit_name || next.name)}, ${esc(when)}. Every split appears here at once, lap by lap, for as long as the race is on.`
                    : 'Timing appears here while a round is running, with every split shown at once.'}</p>
            ${!practiceOpen && prac?.enabled
                ? prac.race_day
                    // Stood down for the day, so promising a time would be a
                    // lie. Said as a rule rather than a one-off.
                    ? (prac.always
                        // "Paused on race days, so you can try it before you
                        // race" does not follow. Said plainly instead.
                        ? '<p style="margin-top:0.9rem">Practice live timing is paused today because there is a race on.</p>'
                        : `<p style="margin-top:0.9rem">Practice live timing is paused on race days. It is open ${esc(prac.from)} to ${esc(prac.to)} UK time every other evening, so you can try it out before you race.</p>`)
                    : `<p style="margin-top:0.9rem">Want to try it before race day? Practice live timing is open every evening, ${esc(prac.from)} to ${esc(prac.to)} UK time. Next open ${esc(opensIn(prac.at))}.</p>`
                : ''}
            <a class="cta" href="${practiceOpen ? '/endurance/profile/#account' : '/endurance/calendar/'}">${practiceOpen ? 'Pair your reporter' : 'Full calendar'}</a>
        </div>
        <div class="foot-note">
            Racing in GTEC? You can put your own car on here.
            <a href="/endurance/profile/#account">Pair live timing in your portal</a>.
        </div>
    </div>`;
}

/** "in about 2 hours", from the server's next-opening timestamp. Phrased
 *  loosely on purpose: the exact minute is on the line above it. */
function opensIn(iso) {
    const mins = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
    if (!Number.isFinite(mins) || mins <= 0) return 'shortly';
    if (mins < 60) return `in about ${mins} min`;
    const hrs = Math.round(mins / 60);
    return `in about ${hrs} hour${hrs === 1 ? '' : 's'}`;
}

function renderField(rows) {
    const ev = rows[0];
    const byLobby = new Map();
    rows.forEach(r => {
        const k = r.lobby_number ?? 0;
        if (!byLobby.has(k)) byLobby.set(k, []);
        byLobby.get(k).push(r);
    });
    const lobbies = [...byLobby.keys()].sort((a, b) => a - b);
    // Only show Fuel when something is actually reporting it. A connector
    // that predates fuel would otherwise give every car a dash, and the
    // column reappears by itself once one does.
    const showFuel = rows.some(r => r.fuel_pct != null);

    // The shell is built once and then only its volatile parts are updated.
    // Rebuilding it every poll would destroy and recreate the canvas twice a
    // second, which costs nothing visually but makes a drag impossible: the
    // element being dragged stops existing mid-gesture.
    if (!document.getElementById('live-shell')) {
        // A fresh shell means the page was idle and has come back, so any zoom
        // from the previous session points at a circuit that may not even be
        // the same one.
        view = { scale: 1, x: 0, y: 0 };
        app.innerHTML = `
    <div class="page-wrap" id="live-shell">
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
            <div class="eyebrow" style="margin:0">Live Timing</div>
            <span id="live-pill"></span>
        </div>
        <div class="title" style="margin-top:0.4rem" id="live-round"></div>
        <div class="subtitle" id="live-sub"></div>
        <div class="subtitle" id="live-mode-note"></div>
        <div class="splits" id="live-splits"></div>
        <div class="map-card">
            <div class="map-head">
                <span class="map-title">Track Map</span>
                <span class="map-note" id="map-note"></span>
                <span class="map-zoom">
                    <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">&minus;</button>
                    <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
                    <button type="button" class="reset" id="zoom-reset" aria-label="Reset the view" title="Fit the whole circuit">Fit</button>
                </span>
            </div>
            <canvas id="track"></canvas>
        </div>
        <div class="foot-note">
            Only drivers who have paired a reporter appear here, so this is part of the grid rather than all of it.
            ${ev?.mode === 'race' ? 'Order is by laps completed.' : 'Order is by best lap.'}<br>
            Racing in GTEC? <a href="/endurance/profile/#account">Pair live timing in your portal</a>.
        </div>
    </div>`;
    }

    // ---- the parts that change ----
    const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

    set('live-pill', ev.mode === 'practice'
        ? '<span class="live-pill practice-pill"><span class="live-dot"></span>Practice</span>'
        : ev.is_test
            ? '<span class="live-pill test-pill">Test</span>'
            : '<span class="live-pill"><span class="live-dot"></span>Live</span>');

    set('live-round', `Round ${ev.round}`);
    set('live-sub', `${esc(ev.event_name)} · ${rows.length} car${rows.length === 1 ? '' : 's'} reporting across ${lobbies.length} split${lobbies.length === 1 ? '' : 's'}`);

    const modeNote = document.getElementById('live-mode-note');
    if (modeNote) {
        if (ev.mode === 'practice') {
            modeNote.style.cssText = 'color:#86efac';
            modeNote.textContent = 'Open practice, not a race. Everyone here is out on their own, so laps and gaps mean nothing yet.';
        } else if (ev.is_test) {
            modeNote.style.cssText = 'color:#fdba74';
            modeNote.textContent = 'This is a test of live timing, not a live race.';
        } else {
            modeNote.textContent = '';
        }
        modeNote.hidden = !modeNote.textContent;
    }

    set('live-splits', lobbies.map(l => splitHtml(l, byLobby.get(l), showFuel)).join(''));
    bindDriverCards();
}

// ---------------------------------------------------------------
// Track map
//
// There is no circuit outline and nothing to calibrate per track. Every
// position a car reports is kept, and the accumulated cloud of points IS
// the lap: after a few minutes of running the shape of the circuit is
// simply there, on any track, including one nobody has mapped.
//
// Points live for the life of the page, so a viewer arriving mid-race
// builds the shape up over their first few minutes rather than being shown
// a map that was drawn for them.
// ---------------------------------------------------------------
// Which splits are collapsed, and which one the map is showing. Remembered
// per viewer, because someone following one split will want it that way
// every time they open the page, not just this once.
const collapsedSplits = new Set();
let focusedSplit = null;        // null means every split
try {
    const raw = localStorage.getItem('gtecLiveSplits');
    if (raw) {
        const v = JSON.parse(raw);
        (v.collapsed || []).forEach(k => collapsedSplits.add(String(k)));
        focusedSplit = v.focused != null ? String(v.focused) : null;
    }
} catch (e) { /* private window, blocked storage: defaults are fine */ }

function saveSplitPrefs() {
    try {
        localStorage.setItem('gtecLiveSplits', JSON.stringify({
            collapsed: [...collapsedSplits], focused: focusedSplit,
        }));
    } catch (e) { /* nothing to do, and nothing depends on it */ }
}

/**
 * Two separate controls, because they are two separate intentions and
 * cramming both onto one click made the second press do two things at once.
 *
 *   the header   -> show this split on the map, or go back to all of them
 *   the chevron  -> collapse or expand this split's table
 */
function onSplitClick(key) {
    focusedSplit = (focusedSplit === key) ? null : key;
    // Focusing a collapsed split should show it, or the click appears to
    // have done nothing.
    if (focusedSplit === key) collapsedSplits.delete(key);
    // The map reframes around a different set of cars, so a zoom held from
    // the previous framing would point at nothing in particular.
    view = { scale: 1, x: 0, y: 0 };
    syncZoomButtons();
    redrawSplits();
}

function onSplitToggle(ev, key) {
    ev.stopPropagation();     // the chevron is inside the header button
    if (collapsedSplits.has(key)) collapsedSplits.delete(key);
    else collapsedSplits.add(key);
    redrawSplits();
}

function redrawSplits() {
    saveSplitPrefs();
    if (lastRows) { renderField(lastRows); drawTrack(lastRows); }
}

const SPLIT_COLOURS = ['#ffd166', '#38bdf8', '#4ade80', '#f472b6', '#fb923c', '#a78bfa', '#2dd4bf', '#f87171'];
// driver_id -> every point that car has reported, in order. Per car rather
// than one shared cloud, because consecutive points from the same car are
// consecutive in time and can therefore be joined into a line. A single
// mixed cloud can only ever be drawn as dots.
const carPaths = new Map();
// The outline captured server side, so a refresh or a viewer arriving an
// hour into a race gets the circuit straight away instead of an empty box.
let basePath = [];
// The same points with the first repeated at the end, once the lap is
// finished, so the circuit draws as the loop it is.
let baseLoop = [];
let baseFetchedAt = 0;
// How many points the server reported at the last fetch, so a poll can tell
// whether the stored outline has grown, shrunk or finished without asking
// for the whole thing.
let baseServerPoints = 0;
let baseArmed = false;
// Per car. Only needed in full while the cars ARE the map, which is before
// the server's outline has been captured. Once there is an outline the trail
// is all that gets drawn, so the history is trimmed to just over it: sixty
// cars holding 4,000 points each is 240,000 points of browser memory earning
// nothing.
const PATH_MAX = 4000;
const PATH_KEEP_WITH_OUTLINE = 48;
const RELIEF_BANDS = 12;          // height bands; see the banded shading below
const TRAIL_LEN = 14;             // how much of the tail is drawn bright
const TRAIL_STEPS = 4;            // alpha steps along it; see the trail drawing
// Two points further apart than this are not consecutive track: a car has
// been reset to the pits, or its reporter dropped out for a while. Joining
// them would draw a line straight across the infield.
const MAX_SEGMENT_M = 600;
// Faster than any car in GT7 goes, so a move that implies more than this is
// a car being put back somewhere rather than driven there.
const TELEPORT_KPH = 400;

function splitColour(lobby) {
    return SPLIT_COLOURS[((lobby || 1) - 1) % SPLIT_COLOURS.length];
}

/**
 * A colour per team, so teammates match and no two teams on track look the
 * same.
 *
 * Not the manufacturer's colour: several teams run the same manufacturer and
 * would be indistinguishable, which defeats the point of colouring the map at
 * all. The manufacturer's own colour still appears on the hover card, where
 * brand identity belongs and telling cars apart does not.
 *
 * Seeded from the team's id so a team keeps its colour across a session and a
 * refresh, then any clash is resolved against the teams actually on track.
 * Twelve colours and fifteen teams makes a clash a certainty, and two teams
 * drawn identically is the one outcome worth ruling out.
 */
const TEAM_COLOURS = [
    '#f87171', '#60a5fa', '#4ade80', '#f472b6', '#fb923c', '#22d3ee',
    '#a78bfa', '#facc15', '#2dd4bf', '#e879f9', '#a3e635', '#fca5a5',
];

function hashId(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
    return h;
}

let teamColours = new Map();     // team or driver id -> hex

function assignTeamColours(rows) {
    // One key per car on track: its team, or itself when it has no team, so a
    // solo driver is as distinguishable as any team.
    const keys = [...new Set(rows.map(r => r.team_id || r.driver_id).filter(Boolean))].sort();
    const taken = new Set();
    const next = new Map();
    for (const key of keys) {
        let i = hashId(key) % TEAM_COLOURS.length;
        // Walk to the next free slot. Deterministic because the keys are
        // sorted, so the same field always produces the same assignment.
        for (let n = 0; n < TEAM_COLOURS.length && taken.has(i); n++) {
            i = (i + 1) % TEAM_COLOURS.length;
        }
        taken.add(i);
        next.set(key, TEAM_COLOURS[i]);
    }
    teamColours = next;
}

function carColour(r) {
    return teamColours.get(r.team_id || r.driver_id) || splitColour(r.lobby_number);
}

/**
 * The number to put on a car.
 *
 * During a race the entry's number, because a team fields one car carrying
 * one number and that is what every other timing screen shows. Otherwise the
 * driver's own career number, because in practice both teammates can be out
 * at once and they would both be labelled with the number their car will
 * carry on race day, which is normally the team leader's.
 */
function carNumber(r, mode) {
    return mode === 'race'
        ? (r.car_number ?? r.career_number)
        : (r.career_number ?? r.car_number);
}

async function loadBasePath(state) {
    // The state is three numbers and comes with every poll. The outline
    // itself can be two thousand points, so it is only refetched when those
    // numbers say something happened to it.
    //
    // An outline that merely GREW can wait: the page is accumulating its own
    // points meanwhile, so the picture is right either way, and refetching
    // two thousand rows every poll for one new point would be absurd.
    //
    // An outline that SHRANK cannot wait. That is an admin clearing it, or
    // the trace restarting at the line, and until the page notices it is
    // drawing a circuit the server no longer has. Waiting 45 seconds to find
    // that out is what made clearing look as though it had not worked.
    const pts = state?.points;
    const known = pts != null;
    const shrank   = known && pts < baseServerPoints;
    const finished = known && (!!state.closed !== baseClosed || !!state.armed !== baseArmed);
    const grew     = known && pts > baseServerPoints;
    // The server has an outline and this page does not, which is the first
    // poll or a fetch that failed. Keep asking.
    const missing  = known && pts > 0 && basePath.length === 0;
    if (!shrank && !finished && !missing
        && !(grew && Date.now() - baseFetchedAt > 45000)
        && baseFetchedAt) return;

    baseFetchedAt = Date.now();
    const { data, error } = await sb.rpc('live_track');
    if (error || !data) return;
    const baseClosedNext = !!state?.closed;
    baseClosed = baseClosedNext;
    basePath = data.map(p => [p.x, p.z, p.y]).filter(p => p[0] != null && p[1] != null);
    // A finished outline is a loop, and was being drawn as a line, so it had
    // a gap at the start/finish straight the width of whatever the car
    // covered between its last beacon and its first. Joining the ends closes
    // it. Only once the server says the lap is finished: before that the two
    // ends are nowhere near each other and a line between them would be a
    // chord straight across the circuit.
    baseLoop = (baseClosedNext && basePath.length > 2)
        ? [...basePath, basePath[0]]
        : basePath;
    // What the SERVER said, not what survived filtering here, or a single
    // point with no coordinates would leave the two permanently unequal and
    // refetch on every poll forever.
    baseServerPoints = known ? pts : data.length;
    baseArmed  = !!state?.armed;
}

// ---------------------------------------------------------------
// Cars that are not at this circuit.
//
// A driver who leaves the connector running and goes off to hotlap somewhere
// else on a Tuesday is still sending valid beacons, and practice is open. The
// server already refuses their positions for the saved outline; the page has
// to keep them out of the picture too, because the map frames whatever it is
// given and one car at another venue stretches the view across both until the
// real circuit is a squiggle in the corner.
//
// Judged against the saved outline rather than against each other: the
// outline is the one thing on the page that is known to be this circuit.
// ---------------------------------------------------------------
let strays = new Set();

// How many of each split's entered cars are reporting, which is the whole
// difference between a position and a place in a list. Entries do not change
// during a session and reporters come and go slowly, so this is asked for
// every ten seconds rather than every poll.
let coverage = new Map();
let coverageAt = 0;
async function loadCoverage(eventId) {
    if (Date.now() - coverageAt < 10000) return;
    coverageAt = Date.now();
    const { data, error } = await sb.rpc('live_split_coverage', { p_event_id: eventId });
    if (error || !data) return;
    coverage = new Map(data.map(c => [c.lobby_number ?? 0,
                                      { entered: c.entered, reporting: c.reporting }]));
}

// How far off the traced line a car can be and still be on this circuit.
// A track is maybe 15m wide and racing lines vary, so 80m is generous.
const MATCH_M = 80;

// Whether the outline is a finished lap, as the server records it.
//
// Not computed here any more. A geometric test on the client has exactly the
// flaw it had on the server: the Nordschleife crosses under itself, so no
// radius separates "back where I was" from "passing beneath where I was",
// and the outline froze mid-lap. The lap counter is the authority and only
// the server sees it.
let baseClosed = false;

function outlineClosed() { return baseClosed; }

function findStrays(rows) {
    const out = new Set();
    // Only a FINISHED outline can say where this circuit is. Judging against
    // a partial one brands the very car that is tracing it: it drives on into
    // track nothing has covered yet, measures far from every point captured so
    // far, and gets called a stray, which then stops it being drawn. Exactly
    // what happened the first time anyone drove a freshly cleared round.
    if (!outlineClosed()) return out;

    // Distance to the nearest traced point, NOT to a bounding box. GT7's
    // coordinates are per-circuit and roughly centred on each track's own
    // origin, so circuits overlap in space: the Nordschleife's bounding box
    // contains the whole of Sugo. Only proximity to the line itself tells
    // one apart from the other, which a driver on Sugo proved by being drawn
    // through the middle of the Nordschleife.
    // Measured to the line, not to the nearest recorded point. At racing
    // speed the points are 80 to 170m apart, so a car squarely on the track
    // but midway between two of them is further from either than the match
    // radius, and would be called a stray.
    const lim = MATCH_M * MATCH_M;
    const maxSeg = MAX_SEGMENT_M * MAX_SEGMENT_M;
    rows.forEach(r => {
        if (r.x == null || r.z == null) return;
        let best = Infinity;
        for (let i = 0; i < baseLoop.length - 1; i++) {
            const ax = baseLoop[i][0], az = baseLoop[i][1];
            const bx = baseLoop[i + 1][0], bz = baseLoop[i + 1][1];
            const dx = bx - ax, dz = bz - az;
            const l2 = dx * dx + dz * dz;
            // A gap too big to be track: where the shape job changed hands.
            if (l2 > maxSeg) continue;
            let t = l2 > 0 ? ((r.x - ax) * dx + (r.z - az) * dz) / l2 : 0;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const px = r.x - (ax + t * dx), pz = r.z - (az + t * dz);
            const d = px * px + pz * pz;
            if (d < best) {
                best = d;
                if (best <= lim) break;          // on the line, stop looking
            }
        }
        if (best > lim) out.add(r.driver_id);
    });
    return out;
}

// Drivers whose next recorded point must start a new run rather than join
// the last one. See below.
const trailBreak = new Set();

function recordPositions(rows) {
    rows.forEach(r => {
        if (r.x == null || r.z == null) return;
        // Their trail belongs to a different circuit, so it is not drawn and
        // not kept.
        if (strays.has(r.driver_id)) { carPaths.delete(r.driver_id); return; }
        // Only cars actually circulating. A car in the menus or long gone
        // sits at one spot and would drag the whole map toward it.
        if (!r.on_track || (r.age_ms ?? 0) > 30000) { trailBreak.add(r.driver_id); return; }
        const path = carPaths.get(r.driver_id) || [];
        const last = path[path.length - 1];
        // Skip a repeat of the same position, which is a throttled or
        // stationary car rather than movement.
        if (last && last[0] === r.x && last[1] === r.z) return;
        // A car that was in the menus has been somewhere this page did not
        // watch, and in GT7 that somewhere is the pit box. Nothing is recorded
        // while it is away, so the point before and the point after end up
        // next to each other in the trail and get joined: a line straight
        // across the infield to the pits, which is the one part of the map
        // that is not true. The fourth value says not to join this one.
        let brk = trailBreak.delete(r.driver_id);
        // When the car was HERE, not when this page got round to asking. The
        // page can poll a little early or late, and timing the gap by the
        // poll would make a normal lap look like a teleport now and then.
        const now = Date.now() - (r.age_ms ?? 0);
        // The flag above only catches a car the page SAW leave the track, and
        // GT7 does not always drop its in-race flag the moment a car is put
        // back in its box: a driver quitting can report one or two perfectly
        // ordinary-looking positions from the pit lane. Those are a teleport,
        // not driving, and the distance guard cannot see it because a pit box
        // is a few hundred metres away, not kilometres. So judge it by the
        // speed the move implies over the time it actually took. Nothing in
        // GT7 covers ground at 400 km/h, so anything that claims to did not
        // drive there.
        if (!brk && last && last[4]) {
            const dt = (now - last[4]) / 1000;
            const m  = Math.hypot(r.x - last[0], r.z - last[1]);
            if (dt > 0 && (m / dt) * 3.6 > TELEPORT_KPH) brk = true;
        }
        path.push([r.x, r.z, r.y, brk, now]);
        const keep = basePath.length ? PATH_KEEP_WITH_OUTLINE : PATH_MAX;
        while (path.length > keep) path.shift();
        carPaths.set(r.driver_id, path);
    });
}

/** Draws one car's path as a line, breaking it wherever two points are too
 *  far apart to be consecutive track, or wherever the car left the track
 *  between them. */
function strokePath(g, path, px, pz, from, to) {
    let started = false;
    for (let i = from; i < to; i++) {
        const a = path[i], b = path[i + 1];
        if (!b) break;
        const gap = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (b[3] || gap > MAX_SEGMENT_M) { started = false; continue; }
        if (!started) { g.beginPath(); g.moveTo(px(a[0]), pz(a[1])); started = true; }
        g.lineTo(px(b[0]), pz(b[1]));
    }
    if (started) g.stroke();
}

// ---------------------------------------------------------------
// Zoom and pan.
//
// The view is an overlay on the auto-fit rather than a replacement for it:
// scale 1 with no offset is "the whole circuit, framed". That way the map
// keeps reframing itself as more of the track is traced, and a reader who
// has zoomed into the Karussell stays there across the 1.5 second redraw.
//
// Deliberately 2D. Rotation and a real elevation ribbon want a denser path
// than a beacon every 1.5 seconds can give, which is a separate job.
// ---------------------------------------------------------------
const ZOOM_MIN = 1, ZOOM_MAX = 14;
let view = { scale: 1, x: 0, y: 0 };

function resetView() {
    view = { scale: 1, x: 0, y: 0 };
    syncZoomButtons();
    if (lastRows) drawTrack(lastRows);
}

/** Keeps the circuit from being dragged off the edge: panning is bounded by
 *  how far the zoomed content actually overflows the canvas. */
function clampView(w, h, contentW, contentH) {
    view.scale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, view.scale));
    const maxX = Math.max(0, (contentW * view.scale - w) / 2 + 26);
    const maxY = Math.max(0, (contentH * view.scale - h) / 2 + 26);
    view.x = Math.min(maxX, Math.max(-maxX, view.x));
    view.y = Math.min(maxY, Math.max(-maxY, view.y));
}

/** Zoom about a fixed screen point, so what is under the cursor or the
 *  midpoint of a pinch stays under it. */
function zoomAt(sx, sy, factor) {
    const cv = document.getElementById('track');
    if (!cv) return;
    const cx = cv.clientWidth / 2, cy = cv.clientHeight / 2;
    const next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, view.scale * factor));
    const k = next / view.scale;
    view.x = sx - cx - (sx - cx - view.x) * k;
    view.y = sy - cy - (sy - cy - view.y) * k;
    view.scale = next;
    syncZoomButtons();
    if (lastRows) drawTrack(lastRows);
}

function syncZoomButtons() {
    const out = document.getElementById('zoom-out');
    const inn = document.getElementById('zoom-in');
    const rst = document.getElementById('zoom-reset');
    if (out) out.disabled = view.scale <= ZOOM_MIN + 0.001;
    if (inn) inn.disabled = view.scale >= ZOOM_MAX - 0.001;
    if (rst) rst.disabled = view.scale <= ZOOM_MIN + 0.001 && !view.x && !view.y;
}

function bindMapControls() {
    const cv = document.getElementById('track');
    if (!cv || cv.dataset.bound) return;
    cv.dataset.bound = '1';

    const at = e => {
        const r = cv.getBoundingClientRect();
        return [e.clientX - r.left, e.clientY - r.top];
    };

    cv.addEventListener('wheel', e => {
        e.preventDefault();
        const [sx, sy] = at(e);
        // deltaMode 1 is lines rather than pixels, which a few mice still use.
        const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
        zoomAt(sx, sy, Math.exp(-d * 0.0022));
    }, { passive: false });

    // Mouse drag to pan. Pointer capture so a drag that leaves the canvas
    // still finishes cleanly rather than sticking.
    let dragging = false, lastPt = null;
    cv.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;      // touch is handled below
        dragging = true; lastPt = at(e);
        cv.classList.add('grabbing');
        cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
        if (!dragging) return;
        const p = at(e);
        view.x += p[0] - lastPt[0];
        view.y += p[1] - lastPt[1];
        lastPt = p;
        syncZoomButtons();
        if (lastRows) drawTrack(lastRows);
    });
    const endDrag = e => {
        if (!dragging) return;
        dragging = false;
        cv.classList.remove('grabbing');
        try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);

    // Touch: two fingers pinch and pan together. One finger is left alone so
    // the page still scrolls, which matters more than one-finger panning on
    // a map sat halfway down a long page.
    let pinch = null;
    const spread = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const mid = t => {
        const r = cv.getBoundingClientRect();
        return [(t[0].clientX + t[1].clientX) / 2 - r.left,
                (t[0].clientY + t[1].clientY) / 2 - r.top];
    };
    cv.addEventListener('touchstart', e => {
        if (e.touches.length !== 2) { pinch = null; return; }
        pinch = { d: spread(e.touches), m: mid(e.touches) };
    }, { passive: true });
    cv.addEventListener('touchmove', e => {
        if (e.touches.length !== 2 || !pinch) return;
        e.preventDefault();
        const d = spread(e.touches), m = mid(e.touches);
        view.x += m[0] - pinch.m[0];
        view.y += m[1] - pinch.m[1];
        if (pinch.d > 0) zoomAt(m[0], m[1], d / pinch.d);
        else { syncZoomButtons(); if (lastRows) drawTrack(lastRows); }
        pinch = { d, m };
    }, { passive: false });
    cv.addEventListener('touchend', () => { pinch = null; }, { passive: true });

    // Double click or double tap to fit, the usual way out of a lost view.
    cv.addEventListener('dblclick', e => { e.preventDefault(); resetView(); });

    document.getElementById('zoom-in')?.addEventListener('click',
        () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.6));
    document.getElementById('zoom-out')?.addEventListener('click',
        () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1 / 1.6));
    document.getElementById('zoom-reset')?.addEventListener('click', resetView);

    syncZoomButtons();
}

function drawTrack(rows) {
    const cv = document.getElementById('track');
    if (!cv) return;
    bindMapControls();
    const note = document.getElementById('map-note');

    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
    }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    // Once the outline exists it IS the circuit, and the cars' own histories
    // add nothing to it but work. Drawing every car's full trail as track cost
    // one stroke per segment per car: fine at three cars, roughly 240,000
    // strokes per redraw at sixty, which no canvas survives. Before an outline
    // has been captured the cars are still the only map there is, so they draw
    // it then.
    const allPaths = baseLoop.length ? [baseLoop] : [...carPaths.values()];
    const total = basePath.length
        ? basePath.length + [...carPaths.values()].reduce((n, p) => n + Math.min(p.length, TRAIL_LEN + 1), 0)
        : allPaths.reduce((n, p) => n + p.length, 0);

    if (total < 2) {
        // Nothing to say yet, and the cycle must not paint over it.
        if (factTimer) { clearInterval(factTimer); factTimer = null; }
        factList = [];
        if (note) { note.classList.remove('fading'); note.textContent = 'Waiting for positions'; note.title = ''; }
        g.fillStyle = '#94a3b8';
        g.font = "11px 'Inter', system-ui, sans-serif";
        g.textAlign = 'center';
        g.fillText('The circuit draws itself as cars report their position.', w / 2, h / 2);
        return;
    }

    // Fit whatever has been seen, keeping the aspect ratio so the shape of
    // the circuit is true rather than stretched to the box.
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    let minY = Infinity, maxY = -Infinity;
    for (const path of [...allPaths, ...(basePath.length ? carPaths.values() : [])])
    for (const pt of path) {
        if (pt[0] < minX) minX = pt[0]; if (pt[0] > maxX) maxX = pt[0];
        if (pt[1] < minZ) minZ = pt[1]; if (pt[1] > maxZ) maxZ = pt[1];
        if (pt[2] != null) {
            if (pt[2] < minY) minY = pt[2];
            if (pt[2] > maxY) maxY = pt[2];
        }
    }
    const pad = 26;
    const spanX = Math.max(1, maxX - minX), spanZ = Math.max(1, maxZ - minZ);
    const scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanZ);
    const offX = (w - spanX * scale) / 2, offZ = (h - spanZ * scale) / 2;

    // The fitted projection above is the baseline; the reader's zoom and pan
    // ride on top of it, about the middle of the canvas. Keeping the fit
    // separate means the view survives the 1.5s redraw and the circuit still
    // reframes itself as more of it is traced.
    clampView(w, h, spanX * scale, spanZ * scale);
    const vs = view.scale, cx = w / 2, cy = h / 2;
    const px = x => cx + (offX + (x - minX) * scale - cx) * vs + view.x;
    const pz = z => cy + (offZ + (z - minZ) * scale - cy) * vs + view.y;
    // Line weights and markers are drawn in screen pixels, so they would
    // bloat with the zoom. Held roughly constant instead, which is what a
    // map should do, while still thickening a little so it does not look
    // spindly when zoomed right in.
    const zw = Math.max(0.6, Math.min(1.8, Math.pow(vs, 0.35)));

    // Only shade when there is a real climb to show. A circuit with ten
    // metres of elevation would otherwise be painted as dramatically as the
    // Nordschleife, which says something untrue about it.
    const relief = (maxY - minY) >= 15;

    g.lineJoin = 'round';
    g.lineCap = 'round';

    // The track itself: every car's whole path, joined into lines. Drawn
    // segment by segment when there is elevation to colour by, and in one
    // pass when there is not.
    g.lineWidth = 2.5 * zw;
    if (relief) {
        // Sorted into height bands and drawn one band at a time. A stroke per
        // segment gave a smooth gradient and cost a canvas call for every
        // point on the map; a dozen bands are indistinguishable by eye on a
        // 2.5px line and cost twelve calls however long the path is.
        const bands = Array.from({ length: RELIEF_BANDS }, () => []);
        const flat = [];
        const span = Math.max(1, maxY - minY);
        for (const path of allPaths) {
            for (let i = 0; i < path.length - 1; i++) {
                const a = path[i], b = path[i + 1];
                if (b[3] || Math.hypot(b[0] - a[0], b[1] - a[1]) > MAX_SEGMENT_M) continue;
                const h2 = (a[2] != null && b[2] != null) ? (a[2] + b[2]) / 2 : null;
                if (h2 == null) { flat.push(a, b); continue; }
                const bi = Math.min(RELIEF_BANDS - 1,
                                    Math.max(0, Math.floor(((h2 - minY) / span) * RELIEF_BANDS)));
                bands[bi].push(a, b);
            }
        }
        bands.forEach((segs, bi) => {
            if (!segs.length) return;
            // Low ground cool and dark, high ground warm and bright, which
            // reads as height without needing a legend.
            const t = (bi + 0.5) / RELIEF_BANDS;
            g.strokeStyle = `rgba(${Math.round(80 + 175 * t)},${Math.round(110 + 90 * t)},${Math.round(170 - 80 * t)},0.75)`;
            g.beginPath();
            for (let i = 0; i < segs.length; i += 2) {
                g.moveTo(px(segs[i][0]), pz(segs[i][1]));
                g.lineTo(px(segs[i + 1][0]), pz(segs[i + 1][1]));
            }
            g.stroke();
        });
        if (flat.length) {
            g.strokeStyle = 'rgba(148,163,184,0.5)';
            g.beginPath();
            for (let i = 0; i < flat.length; i += 2) {
                g.moveTo(px(flat[i][0]), pz(flat[i][1]));
                g.lineTo(px(flat[i + 1][0]), pz(flat[i + 1][1]));
            }
            g.stroke();
        }
    } else {
        g.strokeStyle = 'rgba(148,163,184,0.5)';
        for (const path of allPaths) strokePath(g, path, px, pz, 0, path.length - 1);
    }

    // Each car: a fading tail, then the car, then its number. A focused
    // split dims the rest rather than removing them, so you can still see
    // where the others are relative to the ones you are watching.
    g.font = "bold 10px 'Inter', system-ui, sans-serif";
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    rows.forEach(r => {
        if (r.x == null || r.z == null) return;
        // At a different circuit entirely: listed in the table, but drawing
        // it here would put a marker in the middle of nowhere and drag the
        // frame out to reach it.
        if (strays.has(r.driver_id)) return;
        const stale = (r.age_ms ?? 0) > 30000;
        if (stale) return;
        const dim = focusedSplit !== null && String(r.lobby_number ?? 0) !== focusedSplit;
        const col = carColour(r);
        // The tail fades, which needs a different alpha along its length, but
        // not a different alpha per segment: a stroke each cost 14 canvas
        // calls per car, 840 across a full grid, and the map is redrawn on
        // every pointer move while dragging. Four steps are indistinguishable
        // on a 3px line and cost four.
        // A car in the menus keeps beaconing, so it is still a live row and
        // its dot moves to the pit box, but nothing is recorded for its trail
        // while it is away. The trail therefore sat on the circuit, bright,
        // at the last place the car actually was, while the car itself was
        // somewhere else: a tail with no car on the end of it. It comes back
        // when the driver does.
        const path = r.on_track ? (carPaths.get(r.driver_id) || []) : [];
        const from = Math.max(0, path.length - 1 - TRAIL_LEN);
        const n = path.length - 1 - from;
        if (n > 0) {
            g.strokeStyle = col;
            g.lineWidth = 3 * zw;
            const per = Math.ceil(n / TRAIL_STEPS);
            for (let step = 0; step < TRAIL_STEPS; step++) {
                const lo = from + step * per;
                const hi = Math.min(path.length - 1, lo + per);
                if (lo >= hi) break;
                g.globalAlpha = dim ? 0.08
                    : 0.15 + 0.7 * ((step + 0.5) / TRAIL_STEPS);
                g.beginPath();
                let drew = false;
                for (let i = lo; i < hi; i++) {
                    const a = path[i], b = path[i + 1];
                    if (b[3] || Math.hypot(b[0] - a[0], b[1] - a[1]) > MAX_SEGMENT_M) continue;
                    g.moveTo(px(a[0]), pz(a[1]));
                    g.lineTo(px(b[0]), pz(b[1]));
                    drew = true;
                }
                if (drew) g.stroke();
            }
        }
        g.globalAlpha = 1;
        g.globalAlpha = dim ? 0.3 : (r.on_track ? 1 : 0.35);
        g.fillStyle = col;
        g.beginPath();
        g.arc(px(r.x), pz(r.z), 7, 0, Math.PI * 2);
        g.fill();
        const num = carNumber(r, rows[0]?.mode);
        if (num != null) {
            // Font and alignment are set once before the loop: assigning them
            // per car forces a style recalculation each time, sixty times a
            // redraw, and they never change.
            g.fillStyle = '#050608';
            g.fillText(String(num), px(r.x), pz(r.z) + 0.5);
        }
        g.globalAlpha = 1;
    });

    if (note) {
        const km = (Math.max(maxX - minX, maxZ - minZ) / 1000).toFixed(1);
        // The old readout was a diagnostic, useful while building this and
        // not interesting to a spectator. Kept on hover, where it costs
        // nobody anything and still answers "is the outline saved".
        note.title = `${total.toLocaleString()} positions`
            + `${basePath.length ? ' (outline saved)' : ''} · about ${km} km across`
            + (relief ? ` · ${Math.round(maxY - minY)} m of climb` : '');
        setFacts(buildFacts(rows, { km, relief, climb: Math.round(maxY - minY), total }));
    }
}

// ---------------------------------------------------------------
// The line beside Track Map, cycling through things worth knowing.
//
// Everything here is either measured from the outline the cars have just
// drawn, or taken from GTEC's own history. Nothing is hand-written per
// circuit, so a track nobody has raced before still has something to say
// the first time a car goes round it.
// ---------------------------------------------------------------
let factList = [];
let factIndex = 0;
let factTimer = null;
let circuitRecord = null;      // { best_lap_ms, driver_name, event_name }
let circuitAsked = null;       // event id we already looked the record up for

function buildFacts(rows, geo) {
    const f = [];

    if (focusedSplit !== null) {
        f.push(`Showing ${focusedSplit === '0' ? 'unassigned' : 'Split ' + focusedSplit} only`);
    }

    // The point most people miss: this is not a stock graphic. The drivers
    // drew it, tonight, by driving round it.
    if (geo.total > 2) {
        f.push(`Nobody drew this map. The cars traced it themselves, ${geo.total.toLocaleString()} positions so far`);
    }
    if (geo.relief && geo.climb >= 15) {
        f.push(`${geo.climb} m between its highest and lowest points, shaded by height`);
    }
    if (Number(geo.km) > 0) f.push(`About ${geo.km} km from end to end`);

    // GTEC's own record at this circuit, which GT7 has no way of knowing.
    if (circuitRecord && circuitRecord.best_lap_ms) {
        f.push(`GTEC lap record here: ${lapTime(circuitRecord.best_lap_ms)}`
            + (circuitRecord.driver_name ? ` by ${esc(circuitRecord.driver_name)}` : ''));
    }

    // Best of whoever is actually out, and how it stands against the record.
    const bests = rows.map(bestLap).filter(v => v != null && v > 0);
    if (bests.length) {
        const best = Math.min(...bests);
        const who = rows.find(r => bestLap(r) === best);
        // One line, not two: a standalone "that is 3.3s off the record" can
        // surface on its own in the cycle, with nothing to say what "that" was.
        const delta = circuitRecord?.best_lap_ms ? best - circuitRecord.best_lap_ms : null;
        f.push(`Best out there right now: ${lapTime(best)}`
            + (who?.display_name ? ` by ${esc(who.display_name)}` : '')
            + (delta === null ? ''
               : delta > 0 ? `, ${(delta / 1000).toFixed(1)}s off the GTEC record`
                           : `, under the GTEC record`));
    }

    return f;
}

function setFacts(list) {
    // Rebuilt on every poll, so only restart the cycle when the content
    // actually changed. Otherwise a 1.5s poll would reset the fade forever
    // and nothing would ever be readable.
    if (list.join('|') === factList.join('|')) return;
    factList = list;
    if (factIndex >= list.length) factIndex = 0;
    paintFact();
    if (factTimer) clearInterval(factTimer);
    if (list.length > 1) factTimer = setInterval(nextFact, 7000);
}

function paintFact() {
    const note = document.getElementById('map-note');
    if (!note) return;
    note.innerHTML = factList[factIndex] || '';
}

function nextFact() {
    const note = document.getElementById('map-note');
    if (!note || factList.length < 2) return;
    factIndex = (factIndex + 1) % factList.length;
    note.classList.add('fading');
    // Swap while invisible, then fade back in.
    setTimeout(() => { paintFact(); note.classList.remove('fading'); }, 450);
}

/** The circuit's GTEC record and this season's form, looked up once per
 *  round. Both are public views, so this needs no migration and no sign-in. */
async function loadCircuitRecord(eventId) {
    if (!eventId || circuitAsked === eventId) return;
    circuitAsked = eventId;
    try {
        const { data: ev } = await sb.from('events')
            .select('circuit_name, season_id').eq('id', eventId).maybeSingle();
        if (ev?.circuit_name) {
            const { data: rec } = await sb.from('circuit_records')
                .select('best_lap_ms, driver_name, event_name')
                .eq('circuit_name', ev.circuit_name)
                .maybeSingle();
            if (rec) circuitRecord = rec;
        }
        if (ev?.season_id) await loadDriverCards(ev.season_id);
    } catch (_) {
        // A missing record is not worth a broken map.
    }
}

// ---------------------------------------------------------------
// Driver card on hover.
//
// What the timing table cannot show without becoming a spreadsheet: where
// this driver stands in the championship, what their rating is, and how
// their season has gone. All of it from public views, fetched once per round
// rather than per hover, so pointing at a name costs nothing.
// ---------------------------------------------------------------
const driverCards = new Map();   // driver_id -> facts

async function loadDriverCards(seasonId) {
    // The whole season's standings, because a championship position is a
    // rank among everyone, not a property of one driver.
    const [stand, rate] = await Promise.all([
        sb.from('driver_standings')
          .select('driver_id, points, races, wins, podiums, poles, fastest_laps, team_name, manufacturer_name, brand_color, career_number')
          .eq('season_id', seasonId),
        sb.from('driver_current_ratings')
          .select('driver_id, rating, peak_rating, last_delta, nationality, team_name, manufacturer_name, brand_color, career_number'),
    ]);

    const rows = (stand.data || []).slice()
        .sort((a, b) => Number(b.points ?? 0) - Number(a.points ?? 0));
    const leader = rows.length ? Number(rows[0].points ?? 0) : null;

    driverCards.clear();
    rows.forEach((r, i) => driverCards.set(r.driver_id, {
        pos: i + 1,
        of: rows.length,
        points: Number(r.points ?? 0),
        behind: leader == null ? null : leader - Number(r.points ?? 0),
        races: r.races, wins: r.wins, podiums: r.podiums,
        poles: r.poles, fastest_laps: r.fastest_laps,
        team_name: r.team_name, manufacturer_name: r.manufacturer_name,
        brand_color: r.brand_color, career_number: r.career_number,
    }));

    (rate.data || []).forEach(r => {
        const e = driverCards.get(r.driver_id) || {};
        // A driver with a rating but no points yet still deserves a card.
        driverCards.set(r.driver_id, Object.assign(e, {
            rating: r.rating == null ? null : Math.round(r.rating),
            peak: r.peak_rating == null ? null : Math.round(r.peak_rating),
            delta: r.last_delta == null ? null : Math.round(r.last_delta),
            nationality: r.nationality,
            team_name: e.team_name || r.team_name,
            manufacturer_name: e.manufacturer_name || r.manufacturer_name,
            brand_color: e.brand_color || r.brand_color,
            career_number: e.career_number ?? r.career_number,
        }));
    });
}

function cardHtml(row) {
    const c = driverCards.get(row.driver_id);
    const num = row.car_number ?? c?.career_number;
    const line = [c?.team_name, c?.manufacturer_name].filter(Boolean).join(' · ');

    // Nothing loaded yet, or a driver with no season history at all. Say so
    // rather than showing a card full of dashes.
    if (!c || (c.points == null && c.rating == null)) {
        return `<div class="dc-top"><span class="dc-name">${esc(row.display_name)}</span>
            ${num != null ? `<span class="dc-num">#${num}</span>` : ''}</div>
            ${line ? `<div class="dc-team">${esc(line)}</div>` : ''}
            <div class="dc-foot"><span>No championship record yet</span></div>`;
    }

    const d = c.delta;
    const deltaHtml = d == null || d === 0 ? ''
        : `<small class="${d > 0 ? 'dc-up' : 'dc-down'}">${d > 0 ? '+' : ''}${d}</small>`;

    const cells = [];
    if (c.points != null) {
        cells.push(['Championship', `P${c.pos}<small>of ${c.of}</small>`]);
        // "86 -18" reads as a subtraction. Spelled out instead, and left off
        // entirely for whoever is leading.
        cells.push(['Points', `${c.points}${c.behind ? `<small>${c.behind} behind</small>` : ''}`]);
    }
    if (c.rating != null) {
        cells.push(['Elo', `${c.rating}${deltaHtml}`]);
        if (c.peak != null && c.peak > c.rating) cells.push(['Peak', `${c.peak}`]);
    }

    const season = [
        c.races ? `${c.races} race${c.races === 1 ? '' : 's'}` : null,
        c.wins ? `${c.wins} win${c.wins === 1 ? '' : 's'}` : null,
        c.podiums ? `${c.podiums} podium${c.podiums === 1 ? '' : 's'}` : null,
    ].filter(Boolean).join(' · ');

    return `<div class="dc-top">
            <span class="dc-name">${esc(row.display_name)}</span>
            ${num != null ? `<span class="dc-num">#${num}</span>` : ''}
        </div>
        ${line ? `<div class="dc-team">${esc(line)}</div>` : ''}
        <div class="dc-grid">${cells.map(([k, v]) =>
            `<div><div class="dc-k">${k}</div><div class="dc-v">${v}</div></div>`).join('')}</div>
        <div class="dc-foot">
            <span>${season || 'No races yet'}</span>
            ${c.nationality ? `<span>${esc(c.nationality)}</span>` : ''}
        </div>`;
}

let cardEl = null;
function showCard(target, driverId) {
    if (!cardEl) return;
    const row = (lastRows || []).find(r => r.driver_id === driverId);
    if (!row) return;
    cardEl.innerHTML = cardHtml(row);

    const c = driverCards.get(driverId);
    // Borrow the manufacturer's colour for the accent, so a card for a Porsche
    // driver does not look identical to one for a Ferrari driver.
    cardEl.querySelector('.dc-top').style.borderLeftColor = c?.brand_color || 'var(--gold)';

    // Measure after filling: the card's height depends on how many cells it has.
    cardEl.classList.add('on');
    const r = target.getBoundingClientRect();
    const box = cardEl.getBoundingClientRect();
    const gap = 10;
    let left = r.left;
    let top = r.bottom + gap;
    if (left + box.width > window.innerWidth - 12) left = window.innerWidth - box.width - 12;
    if (left < 12) left = 12;
    // Flip above when there is no room below.
    if (top + box.height > window.innerHeight - 12) top = Math.max(12, r.top - box.height - gap);
    cardEl.style.left = left + 'px';
    cardEl.style.top = top + 'px';
}

function hideCard() { if (cardEl) cardEl.classList.remove('on'); }

function bindDriverCards() {
    const shell = document.getElementById('live-shell');
    const splits = document.getElementById('live-splits');
    if (!shell || !splits || splits.dataset.carded) return;
    splits.dataset.carded = '1';

    if (!cardEl) {
        cardEl = document.createElement('div');
        cardEl.className = 'dcard';
        cardEl.setAttribute('role', 'tooltip');
        shell.appendChild(cardEl);
    }

    // Delegated, so it survives the tables being rewritten every poll.
    const nameAt = e => e.target.closest?.('.who[data-driver]');
    splits.addEventListener('mouseover', e => {
        const el = nameAt(e);
        if (el) showCard(el, el.dataset.driver);
    });
    splits.addEventListener('mouseout', e => {
        const el = nameAt(e);
        if (el && !el.contains(e.relatedTarget)) hideCard();
    });
    splits.addEventListener('focusin', e => {
        const el = nameAt(e);
        if (el) showCard(el, el.dataset.driver);
    });
    splits.addEventListener('focusout', hideCard);

    // Touch: a tap opens the card without following anything, and the next
    // tap anywhere closes it.
    splits.addEventListener('click', e => {
        const el = nameAt(e);
        if (!el) return;
        e.stopPropagation();
        if (cardEl.classList.contains('on') && cardEl.dataset.for === el.dataset.driver) { hideCard(); return; }
        cardEl.dataset.for = el.dataset.driver;
        showCard(el, el.dataset.driver);
    });
    document.addEventListener('click', hideCard);
    window.addEventListener('scroll', hideCard, { passive: true });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });
}

let failures = 0;
let lastRows = null;       // so a click redraws at once rather than at the next poll

async function tick() {
    // Asked together, in one round trip's worth of waiting. The outline state
    // is three numbers; fetching it every poll is what lets the map notice an
    // outline being cleared or restarted straight away.
    const [{ data, error }, trackState] = await Promise.all([
        sb.rpc('live_field'),
        sb.rpc('live_track_state'),
    ]);

    if (error) {
        // Two consecutive failures before saying anything: one dropped poll
        // on a phone changing cell is not worth replacing the page over.
        if (++failures >= 2 && !document.querySelector('.split')) {
            app.innerHTML = `<div class="page-wrap"><div class="state">
                <h3>Can't reach live timing</h3>
                <p>${esc(error.message)}</p></div></div>`;
        }
        return;
    }

    failures = 0;
    if (!data || data.length === 0) { await renderIdle(); return; }
    await loadBasePath(trackState?.error ? null : trackState?.data);
    loadCoverage(data[0].event_id);        // cached, not awaited
    loadCircuitRecord(data[0].event_id);   // once per round, not awaited
    lastRows = data;
    // Worked out before anything uses it: the table labels these cars, the
    // map leaves them out, and their trails are not kept.
    strays = findStrays(data);
    assignTeamColours(data);
    recordPositions(data);
    renderField(data);
    drawTrack(data);
}

// Polling rather than Realtime: the table is a handful of rows, there is no
// connection ceiling, and a dropped poll is invisible where a dropped socket
// needs reconnection logic. Worth revisiting once the field is much larger.
tick();
setInterval(tick, 1500);
</script>
