    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: inherit; }

        .gtec-nav { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; background: rgba(5,6,8,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .gtec-nav .brand { font-family: 'Anton', sans-serif; font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); text-decoration: none; text-indent: 0.32em; }
        .gtec-nav .brand-logo { height: 26px; width: auto; display: block; }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
        .gtec-nav .nav-links a { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #111; background: var(--gold); text-decoration: none; padding: 0.5rem 1rem; border-radius: 999px; box-shadow: 0 2px 10px rgba(255,209,102,0.35); }
        .gtec-nav-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 0.35rem; }
        .gtec-nav-toggle svg { width: 24px; height: 24px; display: block; }
        .gtec-nav-toggle .icon-close { display: none; }
        .gtec-nav-toggle.open .icon-open { display: none; }
        .gtec-nav-toggle.open .icon-close { display: block; }
        .nav-badge { display: inline-block; width: 7px; height: 7px; margin-left: 0.3rem; border-radius: 50%; background: var(--gold); }

        .page-wrap { max-width: 1180px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
        .eyebrow { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
        .title { font-family: 'Anton', sans-serif; font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.02; letter-spacing: 0.01em; text-transform: uppercase; margin: 0.5rem 0 0; }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
        .state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
        .state h3 { font-family: 'Anton', sans-serif; font-size: 1.4rem; text-transform: uppercase; color: var(--text); margin: 0 0 0.6rem; }
        .loading { text-align: center; padding: 4rem; color: var(--muted); }

        /* Controls: which round, which session, which cars. */
        .controls { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; margin: 2rem 0 1.5rem; }
        .control { display: flex; flex-direction: column; gap: 0.35rem; }
        .control label { font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
        .control select { padding: 0.5rem 0.7rem; background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit; font-size: 0.85rem; }

        .card-note { font-size: 0.7rem; color: var(--muted); }
        .chart-wrap { padding: 0.6rem 0.4rem 0.2rem; position: relative; }
        /* What a point on the chart is. The chart drew shapes and withheld
           every number on it: the only way to read a lap was to squint at
           the axis. */
        .chart-tip { position: absolute; pointer-events: none; z-index: 5;
            background: rgba(5,6,8,0.94); border: 1px solid var(--border);
            border-radius: 8px; padding: 0.45rem 0.6rem; min-width: 7.5rem;
            font-size: 0.72rem; line-height: 1.45; color: var(--text);
            box-shadow: 0 8px 24px rgba(0,0,0,0.55); }
        .chart-tip[hidden] { display: none; }
        .chart-tip .t-name { font-weight: 700; display: flex; align-items: center; gap: 0.35rem; }
        .chart-tip .t-name .dot { width: 8px; height: 8px; border-radius: 50%;
            background: currentColor; flex: 0 0 auto; }
        .chart-tip .t-lap { font-family: 'Orbitron', sans-serif; font-size: 0.95rem;
            font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
        .chart-tip .t-sub { color: var(--muted); font-variant-numeric: tabular-nums; }
        .chart-tip .t-stop { color: #fb923c; }
        /* The row and the chip for the car being pointed at, wherever the
           pointer is. Faint, because the answer is on the chart. */
        tbody tr.hot { background: rgba(255,255,255,0.05); }
        .car-chip.hot { border-color: rgba(255,255,255,0.3); }
        canvas { display: block; width: 100%; height: 360px; }
        @media (max-width: 560px) { canvas { height: 260px; } }

        /* One chip per car, in its own colour, click to show or hide. */
        .cars { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.9rem 1.1rem; border-top: 1px solid var(--border); }
        .car-chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.28rem 0.6rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-2); color: var(--muted); font-size: 0.74rem; cursor: pointer; font-family: inherit; }
        .car-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
        .car-chip.on { color: var(--text); border-color: rgba(255,255,255,0.22); }
        .car-chip.off .dot { opacity: 0.25; }
        .chip-actions { display: flex; gap: 0.4rem; padding: 0 1.1rem 0.9rem; }
        .chip-actions button { font-family: 'Orbitron', sans-serif; font-size: 0.56rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 999px; padding: 0.3rem 0.7rem; cursor: pointer; }
        .chip-actions button:hover { color: var(--text); }

        /* Six columns of numbers will not fit a phone, and squeezing them

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 520px; }
        thead th { font-family: 'Orbitron', sans-serif; font-size: 0.56rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody td { padding: 0.65rem 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
        tbody tr:last-child td { border-bottom: none; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        th.num { text-align: right; }
        .who { display: flex; align-items: center; gap: 0.5rem; }
        .who .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
        .sub2 { display: block; font-size: 0.68rem; color: var(--muted); }

        .foot-note { margin-top: 2.5rem; font-size: 0.74rem; color: var(--muted); line-height: 1.7; text-align: center; }
        .foot-note a { color: var(--gold); text-decoration: none; }

        @media (max-width: 860px) {
            .gtec-nav { padding: 1rem; flex-wrap: wrap; }
            .gtec-nav-toggle { display: block; }
            .gtec-nav .nav-links { display: none; width: 100%; flex-direction: column; align-items: flex-start; gap: 0.85rem; padding-top: 1rem; }
            .gtec-nav .nav-links.open { display: flex; }
            .page-wrap { padding: 1.75rem 1rem 3rem; }
        }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
const app = document.getElementById('app');

sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data?.session) { if (portal) portal.style.display = ''; }
    else if (signin) signin.style.display = '';
});

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Lap times arrive as milliseconds. */
function lapTime(ms) {
    if (ms == null || ms <= 0) return '—';
    const t = Math.round(ms / 10) / 100;
    const m = Math.floor(t / 60);
    const s = (t - m * 60).toFixed(2).padStart(5, '0');
    return m > 0 ? `${m}:${s}` : s;
}
/** A gap or a spread, where minutes would be noise. */
function secs(ms) {
    if (ms == null) return '—';
    return (ms / 1000).toFixed(3) + 's';
}

// One colour per car, from the same set the live map uses, so a driver who
// was blue on the live timing is blue here.
const COLOURS = ['#1ab4ff', '#ff6b6b', '#4ade80', '#f472b6', '#fbbf24',
                 '#a78bfa', '#34d399', '#fb923c', '#60a5fa', '#e879f9',
                 '#2dd4bf', '#f87171', '#a3e635', '#c084fc', '#38bdf8',
                 '#fdba74'];

/**
 * Where a lap sits along the bottom.
 *
 * A race is plotted against the lap number, which is shared: everybody's lap
 * 30 is the same point in the race. Practice has no such clock. Each driver
 * is out on their own across as many evenings as they like, and GT7 hands
 * back a lap one every time one of those evenings starts, so tomorrow's laps
 * would land on top of tonight's. There it is plotted against the driver's
 * own count of laps for the round, which 191 records with each lap.
 */
function lapX(l) {
    return l.mode === 'race' ? l.lap : (l.seq ?? l.lap);
}

// A stop, as the log records it: the fuel figure going back up. More than
// two points, so a reading that wobbles by a tenth is not a splash of fuel.
const STOP_RISE_PCT = 2;

// Where every drawn point ended up, so the pointer can be told what it is
// over, and which car is being looked at. Both rebuilt on each redraw,
// because switching a car off moves the scale and every point with it.
let lapMarks = [];
let hoveredDriver = null;

let rounds = [], laps = [], summary = [], shown = new Set();
let eventId = null, mode = 'race', metric = 'lap';
// Whether the session showing is the viewer's choice or ours. Until it is
// theirs, the page opens on whichever session the round actually has.
let modeChosen = false;

// ---------------------------------------------------------------
// A line chart, drawn by hand.
//
// No charting library: the page needs one kind of chart, the site inlines
// everything else, and a library would be more bytes than the whole page
// for the privilege of drawing a polyline.
// ---------------------------------------------------------------
function drawChart() {
    const cv = document.getElementById('chart');
    if (!cv) return;
    bindChart();
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    // Each car's laps in the order they were driven, which is not the same
    // as lap number order: a restart repeats lap numbers, so the x axis is
    // "this car's nth logged lap" and the lap number is in the tooltip.
    const series = [];
    for (const row of summary) {
        if (!shown.has(row.driver_id)) continue;
        const mine = laps.filter(l => l.driver_id === row.driver_id);
        if (mine.length) series.push({ row, pts: mine });
    }
    if (!series.length) {
        g.fillStyle = '#94a3b8';
        g.font = "12px 'Inter', system-ui, sans-serif";
        g.textAlign = 'center';
        g.fillText('Pick a car below.', w / 2, h / 2);
        return;
    }

    const val = l => metric === 'fuel' ? l.fuel_pct : l.lap_ms;
    // Against the lap number, not against each car's own count of laps. A
    // car that joined on lap 30 has to sit at lap 30, or it is drawn from
    // the left edge alongside somebody's opening laps and the two look
    // simultaneous when they are half a race apart.
    let x0 = Infinity, x1 = -Infinity, lo = Infinity, hi = -Infinity;
    for (const s of series) {
        for (const l of s.pts) {
            const lx = lapX(l);
            if (lx < x0) x0 = lx; if (lx > x1) x1 = lx;
            const v = val(l);
            if (v == null) continue;
            if (v < lo) lo = v; if (v > hi) hi = v;
        }
    }
    if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
    if (!Number.isFinite(x0)) { x0 = 1; x1 = 1; }

    // Lap times: the scale stops at the slowest CLEAN lap, meaning the
    // slowest lap still within 107% of its own driver's best, which is the
    // same definition the table uses for clean laps. Everything above it is
    // a stop, an off or a lift for traffic, and those laps are three quarters
    // of a minute clear of the racing: scaled to include them, the racing
    // pace the chart exists to show is squashed into the bottom third.
    // They are still drawn, off the top, so the chart does not pretend
    // they did not happen.
    // Every lap drawn where it was driven.
    //
    // The scale used to stop at the slowest lap within 107% of its own
    // driver's best, so a stop or a spin sat on the ceiling instead of
    // stretching the axis. It worked, and it cost more than it was worth: a
    // lap on the ceiling is not where it says it is, so its marks had to be
    // rings rather than dots, the line either side of it had to be dashed,
    // and its real time had to be printed next to it. Three devices, all of
    // them explaining the chart's machinery rather than the racing. A tall
    // spike explains itself.
    if (metric === 'lap') {
        const pad = Math.max(500, (hi - lo) * 0.08);
        lo -= pad; hi += pad;
    } else { lo = 0; hi = 100; }

    const padL = 58, padR = 14, padT = 14, padB = 28;
    const px = lap => padL + (x1 === x0 ? 0 : ((lap - x0) / (x1 - x0)) * (w - padL - padR));
    const py = v => padT + (1 - (v - lo) / Math.max(1, hi - lo)) * (h - padT - padB);

    // Gridlines and the axis, drawn first and faintly.
    g.strokeStyle = 'rgba(255,255,255,0.06)';
    g.lineWidth = 1;
    g.fillStyle = '#94a3b8';
    g.font = "10px 'Inter', system-ui, sans-serif";
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (let k = 0; k <= 4; k++) {
        const v = lo + (hi - lo) * k / 4;
        const y = Math.round(py(v)) + 0.5;
        g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
        g.fillText(metric === 'fuel' ? Math.round(v) + '%' : lapTime(v), padL - 8, y);
    }
    g.textAlign = 'center';
    g.textBaseline = 'top';
    const step = Math.max(1, Math.ceil((x1 - x0 + 1) / 12));
    for (let lap = x0; lap <= x1; lap += step) {
        g.fillText(String(lap), px(lap), h - padB + 7);
    }
    g.fillText(series[0].pts[0].mode === 'race' ? 'lap' : 'laps driven',
               w / 2, h - padB + 19);

    lapMarks = [];
    for (const s of series) {
        // The same dimming the live page does, from the same hover: point at
        // a car anywhere and the rest get out of its way.
        const hot = hoveredDriver === s.row.driver_id;
        g.globalAlpha = (hoveredDriver !== null && !hot) ? 0.25 : 1;
        g.strokeStyle = s.row.colour;
        g.lineWidth = hot ? 3 : 2;
        // Every lap joined to the next, including the ones that run off the
        // top. A driver reads their own run as one line, and a break in it
        // looks like laps that were never recorded, which is the one thing a
        // log must never suggest. A lap above the scale is drawn at the
        // ceiling and the segments reaching it are faded, so the line stays
        // continuous while being plain that the real time is higher than the
        // chart goes.
        g.beginPath();
        let started = false;
        for (const l of s.pts) {
            const v = val(l);
            if (v == null) { started = false; continue; }
            const x = px(lapX(l)), y = py(v);
            if (!started) { g.moveTo(x, y); started = true; } else { g.lineTo(x, y); }
        }
        g.stroke();
        // A dot per lap, so a single-lap car is visible at all. Laps off the
        // top keep a hollow mark at the ceiling: something happened on that
        // lap, and it is not being hidden.
        // A dot per lap, and a ring round one that has no line either side
        // of it, so a single lap reads as a lap rather than a speck.
        g.fillStyle = s.row.colour;
        for (let i = 0; i < s.pts.length; i++) {
            const v = val(s.pts[i]);
            if (v == null) continue;
            const before = s.pts[i - 1] && val(s.pts[i - 1]);
            const after  = s.pts[i + 1] && val(s.pts[i + 1]);
            const lone = before == null && after == null;
            const x = px(lapX(s.pts[i])), y = py(v);
            g.beginPath(); g.arc(x, y, lone ? 3.2 : 2.5, 0, Math.PI * 2); g.fill();
            if (lone) {
                const a = g.globalAlpha;
                g.globalAlpha = a * 0.45; g.lineWidth = 1.2;
                g.beginPath(); g.arc(x, y, 6.5, 0, Math.PI * 2); g.stroke();
                g.globalAlpha = a; g.lineWidth = 2;
            }
            // A stop, marked on the baseline where nothing else lives. A
            // tick under the lap itself is invisible, because a stop sits at
            // the top of a spike and the pixels below it are the line coming
            // back down.
            const prev = s.pts[i - 1];
            const stop = !!(prev && s.pts[i].fuel_pct != null && prev.fuel_pct != null
                            && s.pts[i].fuel_pct - prev.fuel_pct > STOP_RISE_PCT);
            if (stop) {
                g.lineWidth = 2;
                g.beginPath();
                g.moveTo(x, h - padB - 1); g.lineTo(x, h - padB - 9);
                g.stroke();
            }
            lapMarks.push({ driver_id: s.row.driver_id, name: s.row.display_name,
                            colour: s.row.colour, x, y, lap: lapX(s.pts[i]),
                            lap_ms: s.pts[i].lap_ms, fuel_pct: s.pts[i].fuel_pct,
                            mode: s.pts[i].mode, stop });
        }
        g.globalAlpha = 1;
        g.lineWidth = 2;
    }

    // The heading belongs to the chart, not to the page it was rendered on:
    // switching between lap times and fuel redraws the canvas and nothing
    // else, so it was still saying LAP TIMES over a fuel chart.
    const head = document.getElementById('chart-title');
    if (head) head.textContent = metric === 'fuel' ? 'Fuel' : 'Lap Times';
    const note = document.getElementById('chart-note');
    if (note) {
        note.textContent = metric === 'fuel'
            ? 'Fuel as each car crossed the line. A stop is the step back up.'
            : 'Lap time as driven. A spike is a stop, an off, or a lap spent in the barriers.';
    }
}

/**
 * The car being looked at, wherever the pointer happens to be.
 *
 * The chart, the chips and the table all show the same cars, so pointing at
 * one anywhere should pick it out everywhere. The chart redraws, dimming
 * the rest; the row and the chip take a faint highlight.
 */
function hoverDriver(id) {
    if (hoveredDriver === id) return;
    hoveredDriver = id;
    document.querySelectorAll('tbody tr[data-driver], .car-chip').forEach(el =>
        el.classList.toggle('hot', id !== null && el.dataset.driver === id));
    drawChart();
}

/**
 * What the pointer is over on the chart: nearest point within a dozen
 * pixels, which is forgiving enough to hit a 2.5px dot without a steady
 * hand and tight enough not to claim one it is nowhere near.
 */
function bindChart() {
    const cv = document.getElementById('chart');
    const tip = document.getElementById('chart-tip');
    if (!cv || !tip || cv.dataset.bound) return;
    cv.dataset.bound = '1';

    const HIT = 12;
    cv.addEventListener('mousemove', e => {
        const b = cv.getBoundingClientRect();
        const mx = e.clientX - b.left, my = e.clientY - b.top;
        let hit = null, best = HIT * HIT;
        for (const m of lapMarks) {
            const d = (mx - m.x) ** 2 + (my - m.y) ** 2;
            if (d <= best) { best = d; hit = m; }
        }
        if (!hit) { tip.hidden = true; hoverDriver(null); return; }
        hoverDriver(hit.driver_id);
        tip.innerHTML = `
            <div class="t-name" style="color:${hit.colour}"><span class="dot"></span>
                <span style="color:var(--text)">${esc(hit.name)}</span></div>
            <div class="t-lap">${lapTime(hit.lap_ms)}</div>
            <div class="t-sub">${hit.mode === 'race' ? 'lap' : 'their lap'} ${hit.lap}${
                hit.fuel_pct != null ? ` &middot; ${Math.round(hit.fuel_pct)}% fuel` : ''}</div>
            ${hit.stop ? '<div class="t-stop">came in this lap</div>' : ''}`;
        tip.hidden = false;
        // Above and to the right of the point, flipped at either edge so it
        // never leaves the card.
        const box = tip.getBoundingClientRect();
        const wrap = cv.parentElement.getBoundingClientRect();
        let left = (b.left - wrap.left) + hit.x + 12;
        let top  = (b.top - wrap.top) + hit.y - box.height - 10;
        if (left + box.width > wrap.width - 6) left = (b.left - wrap.left) + hit.x - box.width - 12;
        if (left < 6) left = 6;
        if (top < 6) top = (b.top - wrap.top) + hit.y + 14;
        tip.style.left = Math.round(left) + 'px';
        tip.style.top = Math.round(top) + 'px';
    });
    cv.addEventListener('mouseleave', () => { tip.hidden = true; hoverDriver(null); });
}

// ---------------------------------------------------------------
function chips() {
    return summary.map(r => `<button type="button" class="car-chip ${shown.has(r.driver_id) ? 'on' : 'off'}"
            style="color:${r.colour}" data-driver="${r.driver_id}">
            <span class="dot"></span><span style="color:var(--text)">${esc(r.display_name)}</span>
        </button>`).join('');
}

function table() {
    if (!summary.length) return '';
    return `<div class="table-wrap"><table>
        <thead><tr>
            <th>Driver</th>
            <th class="num" title="Every lap we recorded, in-laps and out-laps included.">Laps</th>
            <th class="num" title="Laps within 107% of that driver's own best: a genuine attempt at a lap, rather than a stop, an off or a lift for traffic.">Clean</th>
            <th class="num">Best</th>
            <th class="num" title="The middle of their clean laps.">Median</th>
            <th class="num" title="How tightly the clean laps cluster, as a standard deviation. Over six hours this says more than one quick lap does.">Spread</th>
        </tr></thead>
        <tbody>${summary.map(r => `<tr data-driver="${r.driver_id}">
            <td><div class="who"><span class="dot" style="background:${r.colour}"></span>
                <span>${esc(r.display_name)}${r.car_number != null
                    ? `<span class="sub2">#${r.car_number}</span>` : ''}</span></div></td>
            <td class="num">${r.laps}</td>
            <td class="num">${r.clean_laps}</td>
            <td class="num">${lapTime(r.best_ms)}</td>
            <td class="num">${lapTime(r.median_ms)}</td>
            <td class="num">${secs(r.spread_ms)}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
}

function render() {
    const ev = rounds.find(r => r.event_id === eventId);
    app.innerHTML = `<div class="page-wrap">
        <div class="eyebrow">GTEC</div>
        <h1 class="title">Lap Log</h1>
        <p class="subtitle">Every lap the cars reported, kept after the race rather than overwritten by the next one.</p>

        <div class="controls">
            <div class="control">
                <label for="pick-round">Round</label>
                <select id="pick-round">${rounds.map(r =>
                    `<option value="${r.event_id}" ${r.event_id === eventId ? 'selected' : ''}>Round ${r.round} &middot; ${esc(r.name)}</option>`).join('')}</select>
            </div>
            <div class="control">
                <label for="pick-mode">Session</label>
                <select id="pick-mode">
                    <option value="race"     ${mode === 'race' ? 'selected' : ''}>Race</option>
                    <option value="practice" ${mode === 'practice' ? 'selected' : ''}>Practice</option>
                    <option value="test"     ${mode === 'test' ? 'selected' : ''}>Test</option>
                    <option value=""          ${mode === '' ? 'selected' : ''}>Everything</option>
                </select>
            </div>
            <div class="control">
                <label for="pick-metric">Showing</label>
                <select id="pick-metric">
                    <option value="lap"  ${metric === 'lap' ? 'selected' : ''}>Lap time</option>
                    <option value="fuel" ${metric === 'fuel' ? 'selected' : ''}>Fuel</option>
                </select>
            </div>
        </div>

        ${!laps.length ? `<div class="state">
            <h3>Nothing recorded for this session</h3>
            <p>${ev ? esc(ev.name) : 'This round'} has no ${mode ? esc(mode) : ''} laps in the log.
            Laps are only kept from rounds run since the log was switched on.</p>
        </div>` : `
        <div class="card">
            <div class="card-head">
                <span class="card-title" id="chart-title"></span>
                <span class="card-note" id="chart-note"></span>
            </div>
            <div class="chart-wrap">
                <canvas id="chart"></canvas>
                <div class="chart-tip" id="chart-tip" hidden></div>
            </div>
            <div class="cars" id="cars">${chips()}</div>
            <div class="chip-actions">
                <button type="button" id="all-on">Show all</button>
                <button type="button" id="all-off">Show none</button>
            </div>
        </div>

        <div class="card">
            <div class="card-head"><span class="card-title">By Driver</span>
                <span class="card-note">Sorted by best lap</span></div>
            ${table()}
        </div>`}

        <div class="foot-note">
            Only drivers running a paired reporter appear here, so this is part of the grid rather than all of it.
            Each car's first lap is missing by design: a lap is only recorded once we have watched it from one
            crossing of the line to the next, which is what keeps a part lap out of the record.<br>
            <a href="/endurance/live/">Live timing</a> &middot;
            Racing in GTEC? <a href="/endurance/profile/#account">Pair live timing in your portal</a>.
        </div>
    </div>`;

    const onRound = document.getElementById('pick-round');
    if (onRound) onRound.onchange = e => { eventId = e.target.value; load(); };
    const onMode = document.getElementById('pick-mode');
    if (onMode) onMode.onchange = e => { mode = e.target.value; modeChosen = true; load(); };
    const onMetric = document.getElementById('pick-metric');
    if (onMetric) onMetric.onchange = e => { metric = e.target.value; drawChart(); };

    const cars = document.getElementById('cars');
    if (cars) cars.onclick = e => {
        const chip = e.target.closest('.car-chip');
        if (!chip) return;
        const id = chip.dataset.driver;
        if (shown.has(id)) shown.delete(id); else shown.add(id);
        chip.classList.toggle('on', shown.has(id));
        chip.classList.toggle('off', !shown.has(id));
        drawChart();
    };
    // The other direction: point at a car in the list or at its chip and the
    // chart picks it out. Delegated, because both are rewritten on a redraw.
    const hoverFrom = el => hoverDriver(el?.dataset.driver ?? null);
    const tbl = document.querySelector('.table-wrap');
    if (tbl) {
        tbl.addEventListener('mouseover', e => hoverFrom(e.target.closest('tr[data-driver]')));
        tbl.addEventListener('mouseleave', () => hoverDriver(null));
    }
    if (cars) {
        cars.addEventListener('mouseover', e => hoverFrom(e.target.closest('.car-chip')));
        cars.addEventListener('mouseleave', () => hoverDriver(null));
    }

    const allOn = document.getElementById('all-on');
    if (allOn) allOn.onclick = () => { summary.forEach(r => shown.add(r.driver_id)); render(); };
    const allOff = document.getElementById('all-off');
    if (allOff) allOff.onclick = () => { shown.clear(); render(); };

    drawChart();
}

async function load() {
    // Open on a session that has laps in it. A round's practice window runs
    // for days before the race, and a page that opens on Race told everyone
    // who came to look during that week that there was nothing in the log.
    const picked = rounds.find(r => r.event_id === eventId);
    if (!modeChosen && picked) mode = picked.race_laps > 0 ? 'race' : 'practice';

    const [{ data: lg, error: e1 }, { data: sm, error: e2 }] = await Promise.all([
        sb.rpc('live_lap_log',     { p_event_id: eventId, p_mode: mode || null }),
        sb.rpc('live_lap_summary', { p_event_id: eventId, p_mode: mode || null }),
    ]);
    if (e1 || e2) {
        app.innerHTML = `<div class="page-wrap"><div class="state">
            <h3>Can't read the lap log</h3><p>${esc((e1 || e2).message)}</p></div></div>`;
        return;
    }
    laps = lg || [];
    summary = (sm || []).map((r, i) => ({ ...r, colour: COLOURS[i % COLOURS.length] }));
    // Car numbers live on the laps rather than the summary, so carry one over.
    for (const r of summary) {
        const l = laps.find(x => x.driver_id === r.driver_id);
        r.car_number = l ? l.car_number : null;
    }
    // Opening with sixteen lines on top of each other reads as noise, so the
    // first few are shown and the rest are a click away.
    shown = new Set(summary.slice(0, 6).map(r => r.driver_id));
    render();
}

(async () => {
    const { data, error } = await sb.rpc('live_lap_rounds');
    if (error) {
        app.innerHTML = `<div class="page-wrap"><div class="state">
            <h3>Can't read the lap log</h3><p>${esc(error.message)}</p></div></div>`;
        return;
    }
    rounds = data || [];
    if (!rounds.length) {
        app.innerHTML = `<div class="page-wrap">
            <div class="eyebrow">GTEC</div><h1 class="title">Lap Log</h1>
            <div class="state"><h3>Nothing in the log yet</h3>
            <p>Laps are kept from the first session driven after the log was switched on,
            practice included. Nothing before that was recorded.</p>
            <p>A car has to cross the line twice before its first lap is kept, since a lap
            only counts once it has been watched from one crossing to the next.</p>
            <p><a href="/endurance/live/" style="color:var(--gold)">Live timing</a></p></div></div>`;
        return;
    }
    // Deep link to a round, so a result page or a Discord post can point at one.
    const want = new URLSearchParams(location.search).get('round');
    const picked = want && rounds.find(r => String(r.round) === want);
    eventId = (picked || rounds[0]).event_id;
    await load();
})();

addEventListener('resize', drawChart);
</script>
