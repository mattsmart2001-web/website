<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Teams — GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608; --bg-1: #0a0e15; --bg-2: #11161f;
            --text: #f1f5f9; --muted: #94a3b8;
            --gold: #ffd166; --gold-deep: #c79a3a; --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

        /* Nav */
        .gtec-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(5,6,8,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .gtec-nav .brand {
            font-family: 'Anton', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            text-indent: 0.32em;
        }
        .gtec-nav .brand .accent { color: var(--gold); }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .gtec-nav .nav-links a {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bg); background: var(--gold); text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 999px; transition: opacity 0.2s; }
        .gtec-nav .apply:hover { opacity: 0.85; }
        .gtec-nav .back {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: color 0.2s, border-color 0.2s;
        }
        .gtec-nav .back:hover {
            color: var(--text);
            border-color: rgba(255,255,255,0.25);
        }

        /* Hero */
        .hero { padding: 3rem 2rem 1.5rem; max-width: 1100px; margin: 0 auto; }
        .hero-eyebrow { font-family: 'Orbitron', sans-serif; font-size: 0.58rem; letter-spacing: 0.45em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; }
        .hero-title { font-family: 'Anton', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; margin-bottom: 0.4rem; }
        .hero-sub { color: var(--muted); font-size: 0.88rem; }

        .content { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }

        /* ===== LISTING ===== */
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
        .team-card {
            background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px;
            padding: 1.5rem; cursor: pointer; text-decoration: none; color: var(--text);
            transition: border-color 0.2s, transform 0.15s;
            display: flex; flex-direction: column; gap: 0.75rem;
        }
        .team-card:hover { border-color: rgba(255,209,102,0.35); transform: translateY(-2px); }
        .team-card-mfr { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; color: var(--muted); }
        .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
        .team-card-name { font-family: 'Anton', sans-serif; font-size: 1.35rem; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; }
        .team-card-meta { font-size: 0.76rem; color: var(--muted); }

        /* ===== PROFILE ===== */
        .profile-header { margin-bottom: 1.75rem; }
        .profile-eyebrow { font-family: 'Orbitron', sans-serif; font-size: 0.58rem; letter-spacing: 0.45em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
        .profile-name { font-family: 'Anton', sans-serif; font-size: clamp(2.2rem, 6vw, 3.5rem); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; margin-bottom: 0.75rem; }
        .profile-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .profile-tag { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.75rem; background: var(--bg-2); border: 1px solid var(--border); border-radius: 999px; font-size: 0.76rem; color: var(--muted); }
        .leader-pill { display: inline-block; padding: 0.1rem 0.45rem; background: rgba(255,209,102,0.15); color: var(--gold); border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-right: 0.25rem; }

        /* Stat bar */
        .stat-bar { display: flex; background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 2rem; }
        .stat-item { flex: 1; padding: 1rem 0.75rem; text-align: center; border-right: 1px solid var(--border); }
        .stat-item:last-child { border-right: none; }
        .stat-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
        .stat-value { font-family: 'Anton', sans-serif; font-size: 1.6rem; line-height: 1; }
        .stat-value.gold { background: linear-gradient(180deg, #fff 0%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* Driver roster */
        .driver-roster { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .driver-chip {
            display: flex; align-items: center; gap: 0.65rem;
            background: var(--bg-1); border: 1px solid var(--border); border-radius: 999px;
            padding: 0.4rem 1rem 0.4rem 0.4rem;
            text-decoration: none; color: var(--text);
            transition: border-color 0.2s;
        }
        .driver-chip:hover { border-color: rgba(255,209,102,0.35); }
        .driver-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--bg-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .driver-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .driver-avatar-init { font-family: 'Anton', sans-serif; font-size: 0.9rem; color: var(--muted); opacity: 0.6; }
        .driver-chip-name { font-size: 0.88rem; font-weight: 500; }
        .driver-chip-num { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; color: var(--gold); }

        /* Section */
        .section { margin-bottom: 2rem; }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; text-indent: 0.35em; }
        .bio-text { color: var(--muted); line-height: 1.7; font-size: 0.9rem; }

        /* Table */
        .data-table { background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th { padding: 0.7rem 1.1rem; text-align: left; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); background: var(--bg-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
        .data-table th.right { text-align: right; }
        .data-table td { padding: 0.75rem 1.1rem; border-bottom: 1px solid var(--border); font-size: 0.87rem; vertical-align: middle; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: rgba(255,255,255,0.02); }
        .data-table td.right { text-align: right; }
        .data-table td.muted { color: var(--muted); }
        .pts { font-weight: 700; color: var(--gold); }

        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--muted); font-size: 0.82rem; text-decoration: none; margin-bottom: 1.5rem; }
        .back-link:hover { color: var(--text); }
        .loading { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: 'Orbitron', sans-serif; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; }
        .empty-msg { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }

        @media (max-width: 600px) {
            .nav { padding: 1rem; }
            .hero, .content { padding: 1.5rem 1rem; }
            .stat-bar { flex-wrap: wrap; }
            .stat-item { min-width: 33%; border-bottom: 1px solid var(--border); }
            .hide-mob { display: none; }
        }
    </style>
    <link rel="stylesheet" href="/endurance/assets/gtec-nav.css">
</head>
<body>

<nav class="gtec-nav">
    <a class="brand" href="/endurance/"><img class="brand-logo" src="/endurance/assets/gtec-logo.png" alt="GTEC"></a>
    <button class="gtec-nav-toggle" aria-label="Toggle menu" type="button">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
    <div class="nav-links">
        <a href="/endurance/calendar/">Calendar</a>
        <a href="/endurance/news/">News</a>
        <a href="/endurance/media/">Media</a>
        <a href="/endurance/standings/">Standings</a>
        <a href="/endurance/results/">Results</a>
        <a href="/endurance/drivers/">Drivers</a>
        <a href="/endurance/teams/" class="active">Teams</a>
        <a href="/endurance/stats/">Stats</a>
        <a href="/endurance/rules/">Rules</a>
        <a href="/endurance/profile/login/" id="nav-signin" style="display:none">Sign In</a>
        <a href="/endurance/profile/" id="nav-portal" style="display:none">My Profile<span id="nav-portal-badge" class="nav-badge" aria-label="Unread messages"></span></a>
        <a class="apply" href="/endurance/apply/">Apply</a>
        <a class="back" href="/" title="SparksTheory" aria-label="Back to SparksTheory"><img src="/sparks_logo.jpg" alt="SparksTheory" style="height:20px;width:20px;border-radius:50%;display:block"></a>
    </div>
</nav>

<div id="app"><div class="loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb  = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data.session) { if (portal) portal.style.display = ''; }
    else              { if (signin) signin.style.display = ''; }
});
const app = document.getElementById('app');
const slug = new URLSearchParams(location.search).get('slug');

const FLAGS = { AD:'🇦🇩',AE:'🇦🇪',AT:'🇦🇹',AU:'🇦🇺',BE:'🇧🇪',BH:'🇧🇭',BR:'🇧🇷',CA:'🇨🇦',CN:'🇨🇳',CZ:'🇨🇿',DE:'🇩🇪',ES:'🇪🇸',FR:'🇫🇷',GB:'🇬🇧',HU:'🇭🇺',IT:'🇮🇹',JP:'🇯🇵',MX:'🇲🇽',NL:'🇳🇱',PL:'🇵🇱',PT:'🇵🇹',SA:'🇸🇦',SE:'🇸🇪',SG:'🇸🇬',US:'🇺🇸' };
function flag(c) { return FLAGS[c?.toUpperCase()] || ''; }
function esc(s) { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(name) { return (name || '??').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2); }

function driverAvatarHTML(url, name) {
    if (url) return `<img src="${esc(url)}" alt="${esc(name)}" loading="lazy">`;
    return `<span class="driver-avatar-init">${initials(name)}</span>`;
}

function mfrBadge(logoUrl, brandColor, name) {
    if (logoUrl) return `<img src="${esc(logoUrl)}" alt="${esc(name || '')}" loading="lazy" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;display:inline-block">`;
    if (brandColor) return `<span class="swatch" style="background:${esc(brandColor)}"></span>`;
    return '';
}

// ============================================================
// LISTING
// ============================================================
async function showListing() {
    document.title = 'Teams — GTEC';
    const { data, error } = await sb.from('teams')
        .select('id, name, slug, home_country, bio, manufacturers(name,brand_color,logo_url)')
        .order('name');

    if (error) { app.innerHTML = `<div class="loading">${esc(error.message)}</div>`; return; }

    // Get driver counts per team
    const { data: dCounts } = await sb.from('drivers')
        .select('current_team_id');
    const countMap = {};
    (dCounts || []).forEach(r => {
        if (r.current_team_id) countMap[r.current_team_id] = (countMap[r.current_team_id] || 0) + 1;
    });

    const cards = (data || []).map(t => {
        const mfr = t.manufacturers;
        const dCount = countMap[t.id] || 0;
        return `
        <div class="team-card" onclick="location.href='/endurance/teams/?slug=${esc(t.slug)}'">
            ${mfr ? `<div class="team-card-mfr">${mfrBadge(mfr.logo_url, mfr.brand_color, mfr.name)}${esc(mfr.name)}</div>` : ''}
            <div class="team-card-name">${esc(t.name)}</div>
            <div class="team-card-meta">
                ${t.home_country ? flag(t.home_country) + ' ' + esc(t.home_country) + ' &nbsp;·&nbsp; ' : ''}
                ${dCount} driver${dCount !== 1 ? 's' : ''}
            </div>
        </div>`;
    }).join('');

    app.innerHTML = `
        <div class="hero">
            <div class="hero-eyebrow">Championship</div>
            <div class="hero-title">Teams</div>
            <div class="hero-sub">${data.length} registered team${data.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="content">
            ${data.length ? `<div class="team-grid">${cards}</div>` : `<div class="empty-msg">No teams registered yet.</div>`}
        </div>`;
}

// ============================================================
// PROFILE
// ============================================================
async function showProfile() {
    const { data: team, error } = await sb.from('teams')
        .select('*, manufacturers(name,brand_color,logo_url), leader:drivers!leader_driver_id(id, display_name, slug)')
        .eq('slug', slug)
        .maybeSingle();

    if (error || !team) {
        app.innerHTML = `<div class="hero"><div class="hero-title">Team not found</div></div>
            <div class="content"><a class="back-link" href="/endurance/teams/">← All Teams</a></div>`;
        return;
    }
    document.title = `${team.name} — GTEC`;

    // Current drivers + season standings in parallel
    const [driversRes, standingsRes] = await Promise.all([
        sb.from('drivers')
            .select('id, display_name, slug, nationality, career_number, photo_url')
            .eq('current_team_id', team.id)
            .order('display_name'),
        sb.from('team_standings')
            .select('*')
            .eq('team_id', team.id)
            .order('season_year', { ascending: false }),
    ]);

    const drivers  = driversRes.data  || [];
    const standings = standingsRes.data || [];

    // Career totals
    const totals = standings.reduce((acc, s) => {
        acc.points  += Number(s.points || 0);
        acc.wins    += Number(s.wins || 0);
        acc.podiums += Number(s.podiums || 0);
        acc.poles   += Number(s.poles || 0);
        acc.races   += Number(s.races || 0);
        return acc;
    }, { points: 0, wins: 0, podiums: 0, poles: 0, races: 0 });

    // Tags
    const tags = [];
    if (team.manufacturers?.name) {
        const badge = mfrBadge(team.manufacturers.logo_url, team.manufacturers.brand_color, team.manufacturers.name);
        tags.push(`${badge}${esc(team.manufacturers.name)}`);
    }
    if (team.home_country) tags.push(`${flag(team.home_country)} ${esc(team.home_country)}`);
    if (team.founded_on)   tags.push(`Est. ${esc(team.founded_on.slice(0,4))}`);
    if (team.leader?.display_name) {
        const slugAttr = team.leader.slug ? esc(team.leader.slug) : '';
        const linkOpen = team.leader.slug ? `<a href="/endurance/drivers/?slug=${slugAttr}" style="color:inherit;text-decoration:none">` : '';
        const linkClose = team.leader.slug ? '</a>' : '';
        tags.push(`<span class="leader-pill">★ Team Leader</span> ${linkOpen}${esc(team.leader.display_name)}${linkClose}`);
    }

    // Roster HTML
    const rosterHTML = drivers.length ? `
        <div class="section">
            <div class="section-title">Current Drivers</div>
            <div class="driver-roster">
                ${drivers.map(d => `
                    <a class="driver-chip" href="/endurance/drivers/?slug=${esc(d.slug)}">
                        <div class="driver-avatar">${driverAvatarHTML(d.photo_url, d.display_name)}</div>
                        <div>
                            ${d.career_number ? `<div class="driver-chip-num">#${d.career_number}</div>` : ''}
                            <div class="driver-chip-name">${esc(d.display_name)}</div>
                        </div>
                    </a>`).join('')}
            </div>
        </div>` : '';

    // Season history table
    const historyHTML = standings.length ? `
        <div class="section">
            <div class="section-title">Season History</div>
            <div class="data-table">
                <table>
                    <thead><tr>
                        <th>Season</th><th>Manufacturer</th>
                        <th class="right">Pts</th><th class="right">Races</th>
                        <th class="right">Wins</th><th class="right">Pod</th>
                        <th class="right hide-mob">Poles</th>
                    </tr></thead>
                    <tbody>
                        ${standings.map(s => `<tr>
                            <td>${s.season_year}</td>
                            <td class="muted">${s.manufacturer_name ? `${mfrBadge(s.manufacturer_logo_url, s.brand_color, s.manufacturer_name)} ${esc(s.manufacturer_name)}` : '—'}</td>
                            <td class="right pts">${s.points}</td>
                            <td class="right muted">${s.races}</td>
                            <td class="right muted">${s.wins}</td>
                            <td class="right muted">${s.podiums}</td>
                            <td class="right muted hide-mob">${s.poles}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>` : '';

    app.innerHTML = `
        <div class="hero">
            <div class="hero-eyebrow">Team Profile</div>
        </div>
        <div class="content">
            <a class="back-link" href="/endurance/teams/">← All Teams</a>

            <div class="profile-header">
                <div class="profile-name">${esc(team.name)}</div>
                <div class="profile-tags">${tags.map(t => `<span class="profile-tag">${t}</span>`).join('')}</div>
            </div>

            ${standings.length ? `
            <div class="stat-bar">
                <div class="stat-item"><div class="stat-label">Points</div><div class="stat-value gold">${totals.points}</div></div>
                <div class="stat-item"><div class="stat-label">Races</div><div class="stat-value">${totals.races}</div></div>
                <div class="stat-item"><div class="stat-label">Wins</div><div class="stat-value">${totals.wins}</div></div>
                <div class="stat-item"><div class="stat-label">Podiums</div><div class="stat-value">${totals.podiums}</div></div>
                <div class="stat-item hide-mob"><div class="stat-label">Poles</div><div class="stat-value">${totals.poles}</div></div>
                <div class="stat-item hide-mob"><div class="stat-label">Seasons</div><div class="stat-value">${standings.length}</div></div>
            </div>` : ''}

            ${team.bio ? `<div class="section"><div class="section-title">About</div><div class="bio-text">${esc(team.bio)}</div></div>` : ''}

            ${rosterHTML}
            ${historyHTML}

            ${!standings.length && !drivers.length ? `<div class="empty-msg">No data yet — check back after the first race.</div>` : ''}
        </div>`;
}

// ============================================================
// Init
// ============================================================
if (slug) showProfile();
else showListing();
</script>
<script src="/endurance/assets/gtec-stars.js" defer></script>
<script src="/endurance/assets/gtec-sponsors.js" defer></script>
<script src="/endurance/assets/gtec-nav.js" defer></script>
</body>
</html>
