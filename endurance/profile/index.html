<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Driver Portal — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --gold-deep: #c79a3a;
            --green: #22c55e;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

        /* Nav */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 2rem;
            background: rgba(5,6,8,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .nav-brand { font-family: 'Anton', sans-serif; font-size: 0.95rem; letter-spacing: 0.3em; text-transform: uppercase; text-decoration: none; color: var(--text); }
        .nav-brand span { color: var(--gold); }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .nav-user { font-size: 0.78rem; color: var(--muted); }
        .btn-sm {
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-sm:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* Layout */
        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        /* Profile header */
        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 1.75rem;
            margin-bottom: 2.5rem;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg-2);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            color: var(--muted);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-meta h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 0.4rem;
        }
        .profile-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
        .tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--muted);
            text-indent: 0.2em;
        }

        /* Cards */
        .card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.75rem;
            margin-bottom: 1.25rem;
        }
        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1.25rem;
            text-indent: 0.35em;
        }

        /* Read-only stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.85rem;
        }
        .stat-item { }
        .stat-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.2rem;
        }
        .stat-value { font-size: 0.95rem; font-weight: 600; }

        /* Form */
        .form-group { margin-bottom: 1.25rem; }
        .form-group:last-child { margin-bottom: 0; }
        label.field-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        textarea, input[type="url"], input[type="text"] {
            display: block;
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea { resize: vertical; min-height: 100px; }
        textarea:focus, input:focus { border-color: rgba(255,209,102,0.5); }
        textarea::placeholder, input::placeholder { color: var(--muted); opacity: 0.6; }
        .form-hint { font-size: 0.73rem; color: var(--muted); margin-top: 0.3rem; }

        /* Photo preview */
        .photo-preview {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-2);
            overflow: hidden;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.75rem;
        }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }

        /* Save button */
        .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.7rem 1.6rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep));
            color: #1a1300;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-save:hover { filter: brightness(1.08); }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Toast */
        .toast-container { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 200; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
        .toast { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; pointer-events: auto; animation: toast-in 0.2s ease; max-width: 320px; }
        @keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .toast.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

        #auth-loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
    </style>
</head>
<body>

<div id="auth-loading">Loading…</div>

<nav class="nav">
    <a class="nav-brand" href="/endurance/">Gran Turismo<span> GTEC</span></a>
    <div class="nav-right">
        <span class="nav-user" id="nav-user"></span>
        <button class="btn-sm" id="btn-logout">Sign out</button>
    </div>
</nav>

<div class="page" id="page" style="display:none">
    <div class="profile-header">
        <div class="avatar" id="avatar-el">?</div>
        <div class="profile-meta">
            <h1 id="driver-name">—</h1>
            <div class="profile-tags" id="profile-tags"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Championship Details</div>
        <div class="stats-grid" id="stats-grid"></div>
    </div>

    <div class="card">
        <div class="card-title">Edit Your Profile</div>
        <div class="form-group">
            <label class="field-label">Photo</label>
            <div class="photo-preview" id="photo-preview">No photo</div>
            <input type="url" id="photo-url" placeholder="https://…" oninput="previewPhoto(this.value)">
            <div class="form-hint">Paste a direct image URL. Supabase Storage upload coming in a future update.</div>
        </div>
        <div class="form-group">
            <label class="field-label">Bio</label>
            <textarea id="bio" placeholder="Tell the championship a bit about yourself…"></textarea>
        </div>
        <div style="margin-top:1.5rem">
            <button class="btn-save" id="btn-save" onclick="saveProfile()">Save Changes</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../assets/gtec-config.js"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);

let driverId = null;

function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function previewPhoto(url) {
    const el = document.getElementById('photo-preview');
    if (!url) { el.innerHTML = 'No photo'; return; }
    el.innerHTML = `<img src="${esc(url)}" onerror="this.parentElement.innerHTML='Invalid URL'" alt="">`;
    // Also update avatar
    const avatar = document.getElementById('avatar-el');
    avatar.innerHTML = `<img src="${esc(url)}" onerror="this.innerHTML='?'" alt="">`;
}

async function saveProfile() {
    const btn = document.getElementById('btn-save');
    const bio = document.getElementById('bio').value;
    const photo_url = document.getElementById('photo-url').value.trim() || null;

    btn.disabled = true;
    btn.textContent = 'Saving…';

    const { error } = await sb.from('drivers')
        .update({ bio, photo_url })
        .eq('id', driverId);

    btn.disabled = false;
    btn.textContent = 'Save Changes';

    if (error) { toast(error.message, 'error'); return; }
    toast('Profile saved.', 'success');
    previewPhoto(photo_url);
}

async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.replace('./claim/?redirect=1'); return; }

    // Check driver role
    const { data: role } = await sb.from('user_roles')
        .select('role')
        .eq('user_id', session.user.id)
        .eq('role', 'driver')
        .maybeSingle();

    if (!role) {
        document.getElementById('auth-loading').innerHTML =
            '<div style="text-align:center;max-width:360px;padding:2rem"><p style="font-family:Orbitron,sans-serif;font-size:0.7rem;letter-spacing:0.3em;color:#94a3b8;text-transform:uppercase;margin-bottom:1rem">Access Denied</p><p style="color:#94a3b8;font-size:0.88rem">Your account hasn\'t been linked to a driver profile yet. Ask your admin for a claim link.</p><a href="/endurance/" style="display:block;margin-top:1.5rem;color:#ffd166;font-size:0.82rem">← Gran Turismo GTEC</a></div>';
        return;
    }

    // Load driver record
    const { data: driver, error } = await sb.from('drivers')
        .select('*, teams(name), manufacturers(name)')
        .eq('user_id', session.user.id)
        .single();

    if (error || !driver) {
        document.getElementById('auth-loading').textContent = 'Could not load driver profile.';
        return;
    }

    driverId = driver.id;

    // Populate UI
    document.getElementById('nav-user').textContent = session.user.email;
    document.getElementById('driver-name').textContent = driver.display_name;

    // Avatar
    const avatar = document.getElementById('avatar-el');
    if (driver.photo_url) {
        avatar.innerHTML = `<img src="${esc(driver.photo_url)}" alt="">`;
    } else {
        avatar.textContent = driver.display_name.charAt(0).toUpperCase();
    }

    // Tags
    const tags = [];
    if (driver.career_number) tags.push(`#${driver.career_number}`);
    if (driver.nationality)   tags.push(driver.nationality);
    if (driver.teams?.name)   tags.push(driver.teams.name);
    if (driver.manufacturers?.name) tags.push(driver.manufacturers.name);
    document.getElementById('profile-tags').innerHTML = tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');

    // Stats grid (read-only)
    const stats = [
        { label: 'PSN ID',       value: driver.psn_id      || '—' },
        { label: 'Nationality',  value: driver.nationality  || '—' },
        { label: 'Team',         value: driver.teams?.name  || '—' },
        { label: 'Manufacturer', value: driver.manufacturers?.name || '—' },
        { label: 'Joined',       value: driver.joined_at ? driver.joined_at.slice(0,7) : '—' },
    ];
    document.getElementById('stats-grid').innerHTML = stats.map(s =>
        `<div class="stat-item"><div class="stat-label">${esc(s.label)}</div><div class="stat-value">${esc(s.value)}</div></div>`
    ).join('');

    // Editable fields
    if (driver.bio)       document.getElementById('bio').value = driver.bio;
    if (driver.photo_url) {
        document.getElementById('photo-url').value = driver.photo_url;
        previewPhoto(driver.photo_url);
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.replace('/endurance/');
    });

    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('page').style.display = '';
}

init();
</script>
</body>
</html>
