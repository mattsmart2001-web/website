<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Driver Portal — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608; --bg-1: #0a0e15; --bg-2: #11161f;
            --text: #f1f5f9; --muted: #94a3b8; --gold: #ffd166;
            --gold-deep: #c79a3a; --green: #22c55e; --red: #ef4444;
            --silver: #c0c0c0; --bronze: #cd7f32;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

        /* Nav — standard gtec-nav (matches site-wide) with portal user chip */
        .gtec-nav {
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(5,6,8,0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .gtec-nav .brand { font-family: 'Anton', sans-serif; font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); text-decoration: none; text-indent: 0.32em; }
        .gtec-nav .brand .accent { color: var(--gold); }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
        .gtec-nav .nav-links a { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bg); background: var(--gold); text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 999px; transition: opacity 0.2s; }
        .gtec-nav .apply:hover { opacity: 0.85; }
        .gtec-nav .back { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 0.45rem 0.85rem; border: 1px solid var(--border); border-radius: 999px; transition: color 0.2s, border-color 0.2s; }
        .gtec-nav .back:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
        .nav-user { font-size: 0.72rem; color: var(--muted); }
        .btn-sm { padding: 0.4rem 0.85rem; border-radius: 6px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Inter', sans-serif; transition: color 0.15s, border-color 0.15s; }
        .btn-sm:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* Layout */
        .page { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

        /* Profile header */
        .profile-header { display: flex; align-items: flex-start; gap: 1.75rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
        .avatar { width: 88px; height: 88px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg-2); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; font-size: 2.2rem; color: var(--muted); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-meta { flex: 1; min-width: 200px; }
        .profile-meta h1 { font-family: 'Anton', sans-serif; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.05; margin-bottom: 0.4rem; }
        .profile-link { font-size: 0.78rem; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; margin-bottom: 0.6rem; transition: color 0.15s; }
        .profile-link:hover { color: var(--gold); }
        .profile-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .tag { font-family: 'Orbitron', sans-serif; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.22rem 0.6rem; border-radius: 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }

        /* Cards */
        .card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem 1.75rem; margin-bottom: 1.25rem; }
        .card-title { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.25rem; text-indent: 0.35em; }

        /* Season standing card */
        .standing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 1rem; }
        .standing-item .si-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.25rem; }
        .standing-item .si-value { font-family: 'Anton', sans-serif; font-size: 1.6rem; letter-spacing: 0.04em; line-height: 1; }
        .si-pos { color: var(--gold); }
        .elo-bar-wrap { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; }
        .elo-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
        .elo-value { font-family: 'Anton', sans-serif; font-size: 1.3rem; color: var(--gold); }
        .elo-delta { font-size: 0.75rem; font-weight: 600; }
        .elo-up { color: var(--green); }
        .elo-dn { color: var(--red); }

        /* Recent results */
        .results-list { display: flex; flex-direction: column; gap: 0.6rem; }
        .result-row { display: flex; align-items: center; gap: 0.85rem; padding: 0.65rem 0.85rem; background: var(--bg-2); border-radius: 8px; text-decoration: none; color: var(--text); transition: background 0.15s; }
        .result-row:hover { background: rgba(255,255,255,0.04); }
        .result-pos { font-family: 'Anton', sans-serif; font-size: 1.2rem; width: 28px; text-align: center; flex-shrink: 0; }
        .pos-1-c { color: var(--gold); } .pos-2-c { color: var(--silver); } .pos-3-c { color: var(--bronze); }
        .result-info { flex: 1; min-width: 0; }
        .result-name { font-size: 0.84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
        .result-pts { font-family: 'Anton', sans-serif; font-size: 1rem; color: var(--gold); white-space: nowrap; }
        .result-dnf { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; color: var(--red); }

        /* Upcoming events */
        .upcoming-list { display: flex; flex-direction: column; gap: 0.6rem; }
        .upcoming-row { display: flex; align-items: center; gap: 0.85rem; padding: 0.75rem 0.85rem; background: var(--bg-2); border-radius: 8px; border-left: 3px solid var(--gold); }
        .upcoming-round { font-family: 'Anton', sans-serif; font-size: 1.4rem; color: var(--gold); min-width: 28px; text-align: center; }
        .upcoming-info { flex: 1; }
        .upcoming-name { font-size: 0.86rem; font-weight: 600; }
        .upcoming-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }

        /* Edit form */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group.full { grid-column: 1 / -1; }
        .field-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
        input[type="text"], input[type="url"], input[type="date"], textarea, select {
            background: var(--bg-2); border: 1px solid var(--border); border-radius: 7px;
            color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.88rem;
            padding: 0.65rem 0.85rem; width: 100%; outline: none; transition: border-color 0.15s;
        }
        input:focus, textarea:focus, select:focus { border-color: rgba(255,209,102,0.5); }
        input::placeholder, textarea::placeholder { color: rgba(148,163,184,0.45); }
        textarea { resize: vertical; min-height: 90px; }
        .form-hint { font-size: 0.72rem; color: var(--muted); }

        /* Photo upload */
        .photo-row { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.25rem; }
        .avatar-upload { position: relative; width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0; cursor: pointer; overflow: hidden; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar-upload .placeholder { width: 100%; height: 100%; background: var(--bg-2); border: 2px dashed rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.6rem; font-family: 'Anton', sans-serif; }
        .avatar-upload .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .avatar-upload:hover .overlay { opacity: 1; }
        .upload-info { flex: 1; }
        .btn-upload { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.5rem 1rem; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: border-color 0.15s; }
        .btn-upload:hover { border-color: rgba(255,209,102,0.4); }
        .btn-upload:disabled { opacity: 0.45; cursor: not-allowed; }
        .upload-progress { height: 3px; background: var(--border); border-radius: 2px; margin-top: 0.5rem; overflow: hidden; display: none; }
        .upload-progress-bar { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius: 2px; width: 0; transition: width 0.3s; }

        /* Save */
        .btn-save { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.7rem 1.75rem; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #1a1300; border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; transition: filter 0.2s; }
        .btn-save:hover { filter: brightness(1.08); }
        .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Toast */
        .toast-container { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 200; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
        .toast { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.84rem; pointer-events: auto; animation: toast-in 0.2s ease; max-width: 320px; }
        @keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .toast.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

        /* Auth loading screen */
        #auth-loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }

        .empty-note { color: var(--muted); font-size: 0.84rem; padding: 0.75rem 0; }

        @media (max-width: 580px) {
            .portal-nav { padding: 1rem; }
            .page { padding: 1.5rem 1rem 3rem; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: 1; }
            .standing-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
    <link rel="stylesheet" href="/endurance/assets/gtec-nav.css">
</head>
<body>

<div id="auth-loading">Loading…</div>

<nav class="gtec-nav">
    <a class="brand" href="/endurance/">Gran Turismo<span class="accent"> GTEC</span></a>
    <button class="gtec-nav-toggle" aria-label="Toggle menu" type="button">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
    <div class="nav-links">
        <a href="/endurance/calendar/">Calendar</a>
        <a href="/endurance/news/">News</a>
        <a href="/endurance/standings/">Standings</a>
        <a href="/endurance/drivers/">Drivers</a>
        <a href="/endurance/teams/">Teams</a>
        <a href="/endurance/stats/">Stats</a>
        <a href="/endurance/rules/">Rules</a>

</nav>

<div class="page" id="page" style="display:none">

    <!-- Profile header -->
    <div class="profile-header">
        <div class="avatar" id="avatar-el">?</div>
        <div class="profile-meta">
            <h1 id="driver-name">—</h1>
            <a class="profile-link" id="public-link" href="#">View public profile →</a>
            <div class="profile-tags" id="profile-tags"></div>
        </div>
    </div>

    <!-- Season standing + Elo -->
    <div class="card" id="card-standing" style="display:none">
        <div class="card-title" id="standing-season-label">Current Season</div>
        <div class="standing-grid" id="standing-grid"></div>
        <div class="elo-bar-wrap">
            <div class="elo-label">Elo Rating</div>
            <div class="elo-value" id="elo-value">—</div>
            <div id="elo-delta-el"></div>
        </div>
    </div>

    <!-- Upcoming events -->
    <div class="card" id="card-upcoming" style="display:none">
        <div class="card-title">Upcoming Events</div>
        <div class="upcoming-list" id="upcoming-list"></div>
    </div>

    <!-- Recent results -->
    <div class="card" id="card-results" style="display:none">
        <div class="card-title">Recent Results</div>
        <div class="results-list" id="results-list"></div>
    </div>

    <!-- Edit profile -->
    <div class="card">
        <div class="card-title">Edit Your Profile</div>
        <div class="photo-row">
            <div class="avatar-upload" id="avatar-upload" onclick="document.getElementById('photo-file').click()">
                <div class="placeholder" id="upload-placeholder">?</div>
                <div class="overlay">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </div>
            </div>
            <div class="upload-info">
                <button class="btn-upload" id="btn-upload" onclick="document.getElementById('photo-file').click()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>

                </button>
                <div class="upload-progress" id="upload-progress">
                    <div class="upload-progress-bar" id="upload-bar"></div>

            </div>

        <input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadPhoto(this)">

        <div class="form-grid">

                <label class="field-label">PSN ID</label>

                <label class="field-label">Nationality</label>

                <label class="field-label">Date of Birth</label>

</div>

<div class="toast-container" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);

const FLAGS = { AD:'🇦🇩',AE:'🇦🇪',AT:'🇦🇹',AU:'🇦🇺',BE:'🇧🇪',BR:'🇧🇷',CA:'🇨🇦',CN:'🇨🇳',CZ:'🇨🇿',DE:'🇩🇪',ES:'🇪🇸',FR:'🇫🇷',GB:'🇬🇧',HU:'🇭🇺',IT:'🇮🇹',JP:'🇯🇵',MX:'🇲🇽',NL:'🇳🇱',PL:'🇵🇱',PT:'🇵🇹',SA:'🇸🇦',SE:'🇸🇪',SG:'🇸🇬',US:'🇺🇸' };
function flag(c) { return FLAGS[c?.toUpperCase()] || ''; }

let driverId = null;

function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}

function setPhotoUI(url, initial = '?') {
    const wrap = document.getElementById('avatar-upload');
    const placeholder = document.getElementById('upload-placeholder');
    if (url) {
        let img = wrap.querySelector('img');
        if (!img) {
            img = document.createElement('img'); img.alt = '';
            wrap.insertBefore(img, wrap.firstChild);
        }
        img.src = url;
        placeholder.style.display = 'none';
        const hdr = document.getElementById('avatar-el');
        hdr.innerHTML = `<img src="${esc(url)}" alt="">`;
    } else {
        placeholder.textContent = initial;
        placeholder.style.display = '';
    }
}

async function uploadPhoto(input) {
    const file = input.files[0]; input.value = '';
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast('Image must be under 2 MB.', 'error'); return; }
    const btn = document.getElementById('btn-upload');
    const prog = document.getElementById('upload-progress');
    const bar  = document.getElementById('upload-bar');
    btn.disabled = true; btn.textContent = 'Uploading…';
    prog.style.display = 'block'; bar.style.width = '30%';
    const ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
    const { error: upErr } = await sb.storage.from('gtec-drivers').upload(`${driverId}.${ext}`, file, { upsert: true, contentType: file.type });
    if (upErr) { toast(upErr.message, 'error'); btn.disabled = false; btn.textContent = 'Upload Photo'; prog.style.display = 'none'; return; }
    bar.style.width = '75%';
    const { data: { publicUrl } } = sb.storage.from('gtec-drivers').getPublicUrl(`${driverId}.${ext}`);
    const { error: upd } = await sb.from('drivers').update({ photo_url: publicUrl }).eq('id', driverId);
    bar.style.width = '100%';
    setTimeout(() => { prog.style.display = 'none'; bar.style.width = '0'; }, 600);
    btn.disabled = false; btn.textContent = 'Upload Photo';
    if (upd) { toast(upd.message, 'error'); return; }
    setPhotoUI(publicUrl);
    toast('Photo updated!', 'success');
}

async function saveProfile() {
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Saving…';
    const payload = {
        bio:          document.getElementById('field-bio').value || null,
        psn_id:       document.getElementById('field-psn').value.trim() || null,
        nationality:  document.getElementById('field-nationality').value.trim().toUpperCase() || null,
        date_of_birth: document.getElementById('field-dob').value || null,
    };
    const { error } = await sb.from('drivers').update(payload).eq('id', driverId);
    btn.disabled = false; btn.textContent = 'Save Changes';
    if (error) { toast(error.message, 'error'); return; }
    toast('Profile saved.', 'success');
    // Update nationality tag live
    if (payload.nationality) {
        const tags = document.getElementById('profile-tags');
        const natTag = tags.querySelector('[data-nat]');
        if (natTag) natTag.textContent = `${flag(payload.nationality)} ${payload.nationality}`;
    }
}

// ── Load dashboard data ────────────────────────────────────────
async function loadStanding(driverId) {
    const { data: season } = await sb.from('seasons').select('id,name,year').eq('is_active', true).maybeSingle();
    if (!season) return;

    const [stRes, ratingRes] = await Promise.all([
        sb.from('driver_standings').select('*').eq('driver_id', driverId).eq('season_id', season.id).maybeSingle(),
        sb.from('driver_current_ratings').select('*').eq('driver_id', driverId).maybeSingle(),
    ]);

    const st = stRes.data;
    const rt = ratingRes.data;

    if (!st && !rt) return;

    const card = document.getElementById('card-standing');
    document.getElementById('standing-season-label').textContent = `${season.name} — Season Standing`;

    if (st) {
        const items = [
            { label: 'Position', value: st.points > 0 ? `P${st.driver_rank ?? '—'}` : '—', cls: 'si-pos' },
            { label: 'Points',   value: st.points ?? 0 },
            { label: 'Races',    value: st.races  ?? 0 },
            { label: 'Wins',     value: st.wins   ?? 0 },
            { label: 'Podiums',  value: st.podiums ?? 0 },
            { label: 'Fastest Laps', value: st.fastest_laps ?? 0 },
        ];
        document.getElementById('standing-grid').innerHTML = items.map(i =>
            `<div class="standing-item"><div class="si-label">${i.label}</div><div class="si-value ${i.cls||''}">${i.value}</div></div>`
        ).join('');
    }

    if (rt) {
        document.getElementById('elo-value').textContent = Math.round(rt.current_rating);
        const delta = rt.last_delta;
        if (delta != null) {
            const sign = delta >= 0 ? '+' : '';
            document.getElementById('elo-delta-el').innerHTML = `<span class="elo-delta ${delta >= 0 ? 'elo-up' : 'elo-dn'}">(${sign}${delta})</span>`;
        }
    }

    card.style.display = '';
}

async function loadUpcoming(driverId) {
    const { data: season } = await sb.from('seasons').select('id').eq('is_active', true).maybeSingle();
    if (!season) return;
    const { data: events } = await sb.from('events')
        .select('id,name,slug,round,circuit_name,circuit_country,starts_at,duration_hours')
        .eq('season_id', season.id)
        .eq('status', 'scheduled')
        .gte('starts_at', new Date().toISOString())
        .order('starts_at').limit(3);
    if (!events?.length) return;
    document.getElementById('card-upcoming').style.display = '';
    document.getElementById('upcoming-list').innerHTML = events.map(e => `
        <div class="upcoming-row">
            <div class="upcoming-round">${e.round}</div>
            <div class="upcoming-info">
                <div class="upcoming-name">${esc(e.name)}</div>
                <div class="upcoming-meta">${flag(e.circuit_country)} ${esc(e.circuit_name)} · ${fmtDate(e.starts_at)} · ${e.duration_hours}h</div>
            </div>
        </div>`).join('');
}

async function loadRecentResults(driverId) {
    const { data: eds } = await sb.from('entry_drivers')
        .select('entry_id')
        .eq('driver_id', driverId);
    if (!eds?.length) return;

    const entryIds = eds.map(e => e.entry_id);
    const { data: results } = await sb.from('results')
        .select('finish_position, classified, points_awarded, entries(car_number, event_id, events(name, slug, starts_at, round))')
        .in('entry_id', entryIds)
        .order('entries(events(starts_at))', { ascending: false })
        .limit(5);

    if (!results?.length) return;
    document.getElementById('card-results').style.display = '';

    const posCls = pos => pos === 1 ? 'pos-1-c' : pos === 2 ? 'pos-2-c' : pos === 3 ? 'pos-3-c' : '';

    document.getElementById('results-list').innerHTML = results.map(r => {
        const ev = r.entries?.events;
        const pos = r.finish_position;
        const posDisplay = r.classified
            ? `<span class="result-pos ${posCls(pos)}">${pos ?? '—'}</span>`
            : `<span class="result-pos result-dnf">DNF</span>`;
        const pts = r.points_awarded ? `<span class="result-pts">${r.points_awarded} pts</span>` : '';
        const href = ev?.slug ? `/endurance/results/?slug=${encodeURIComponent(ev.slug)}` : '#';
        return `
        <a class="result-row" href="${esc(href)}">
            ${posDisplay}
            <div class="result-info">
                <div class="result-name">${esc(ev?.name || '—')}</div>
                <div class="result-meta">Round ${ev?.round ?? '—'} · ${fmtDate(ev?.starts_at)} · Car #${r.entries?.car_number ?? '—'}</div>
            </div>
            ${pts}
        </a>`;
    }).join('');
}

// ── Main init ─────────────────────────────────────────────────
async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.replace('./login/'); return; }

    const { data: role } = await sb.from('user_roles')
        .select('role').eq('user_id', session.user.id).eq('role', 'driver').maybeSingle();

    if (!role) {
        document.getElementById('auth-loading').innerHTML = `
        <div style="text-align:center;max-width:380px;padding:2rem">
            <p style="font-family:'Orbitron',sans-serif;font-size:0.65rem;letter-spacing:0.35em;color:var(--muted);text-transform:uppercase;margin-bottom:1rem">No Driver Profile</p>
            <p style="color:var(--muted);font-size:0.88rem;line-height:1.6;margin-bottom:1.5rem">Your account isn't linked to a driver profile yet. You need a claim link from an admin.</p>
            <a href="/endurance/" style="color:var(--gold);font-size:0.82rem">← Gran Turismo GTEC</a>
        </div>`;
        return;
    }

    const { data: driver, error } = await sb.from('drivers')
        .select('*, teams(name,slug), manufacturers(name)')
        .eq('user_id', session.user.id).single();

    if (error || !driver) { document.getElementById('auth-loading').textContent = 'Could not load driver profile.'; return; }

    driverId = driver.id;

    // Nav
    document.getElementById('nav-user').textContent = session.user.email;
    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.replace('/endurance/');
    });

    // Header
    document.getElementById('driver-name').textContent = driver.display_name;
    const initial = driver.display_name.charAt(0).toUpperCase();
    const avatar = document.getElementById('avatar-el');
    if (driver.photo_url) {
        avatar.innerHTML = `<img src="${esc(driver.photo_url)}" alt="">`;
    } else {
        avatar.textContent = initial;
    }
    setPhotoUI(driver.photo_url || null, initial);

    // Public profile link
    if (driver.slug) {
        const link = document.getElementById('public-link');
        link.href = `/endurance/drivers/?slug=${encodeURIComponent(driver.slug)}`;
        link.style.display = '';
    }

    // Tags
    const tagData = [
        driver.career_number ? { text: `#${driver.career_number}`, key: 'num' } : null,
        driver.nationality   ? { text: `${flag(driver.nationality)} ${driver.nationality}`, key: 'nat', attr: 'data-nat' } : null,
        driver.teams?.name   ? { text: driver.teams.name, key: 'team' } : null,
        driver.manufacturers?.name ? { text: driver.manufacturers.name, key: 'mfr' } : null,
    ].filter(Boolean);
    document.getElementById('profile-tags').innerHTML = tagData.map(t =>
        `<span class="tag" ${t.attr ? t.attr + '=""' : ''}>${esc(t.text)}</span>`
    ).join('');

    // Editable fields
    if (driver.bio)           document.getElementById('field-bio').value = driver.bio;
    if (driver.psn_id)        document.getElementById('field-psn').value = driver.psn_id;
    if (driver.nationality)   document.getElementById('field-nationality').value = driver.nationality;
    if (driver.date_of_birth) document.getElementById('field-dob').value = driver.date_of_birth;

    // Show page
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('page').style.display = '';

    // Load async sections (don't block page display)
    loadStanding(driver.id);
    loadUpcoming(driver.id);
    loadRecentResults(driver.id);
}

init();
</script>
<script src="/endurance/assets/gtec-nav.js" defer></script>
</body>
</html>
