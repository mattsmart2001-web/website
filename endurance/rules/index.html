<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Rules — Gran Turismo GTEC</title>
    <link rel="icon" type="image/jpeg" href="/sparks_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --bg-1: #0a0e15;
            --bg-2: #11161f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #ffd166;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

        /* Nav */
        .gtec-nav {
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(5,6,8,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .gtec-nav .brand { font-family: 'Anton', sans-serif; font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); text-decoration: none; text-indent: 0.32em; }
        .gtec-nav .brand .accent { color: var(--gold); }
        .gtec-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
        .gtec-nav .nav-links a { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
        .gtec-nav .nav-links a:hover { color: var(--text); }
        .gtec-nav .nav-links a.active { color: var(--gold); }
        .gtec-nav .apply { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bg); background: var(--gold); text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 999px; transition: opacity 0.2s; }
        .gtec-nav .apply:hover { opacity: 0.85; }
        .gtec-nav .back { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 0.45rem 0.85rem; border: 1px solid var(--border); border-radius: 999px; transition: color 0.2s, border-color 0.2s; }
        .gtec-nav .back:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

        /* Hero */
        .hero { padding: 3.5rem 2rem 2rem; max-width: 860px; margin: 0 auto; }
        .hero-eyebrow { font-family: 'Orbitron', sans-serif; font-size: 0.58rem; letter-spacing: 0.45em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; text-indent: 0.45em; }
        .hero-title { font-family: 'Anton', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; margin-bottom: 0.5rem; }
        .hero-sub { color: var(--muted); font-size: 0.88rem; }

        /* Rules content */
        .content { max-width: 860px; margin: 0 auto; padding: 1.5rem 2rem 5rem; }
        .rules-body { line-height: 1.8; font-size: 0.95rem; }
        .rules-body h1 { font-family: 'Anton', sans-serif; font-size: 1.6rem; letter-spacing: 0.04em; text-transform: uppercase; margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
        .rules-body h2 { font-family: 'Anton', sans-serif; font-size: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; margin: 2rem 0 0.75rem; color: var(--gold); }
        .rules-body h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
        .rules-body p { margin-bottom: 1rem; }
        .rules-body ul, .rules-body ol { padding-left: 1.5rem; margin-bottom: 1rem; }
        .rules-body li { margin-bottom: 0.5rem; }
        .rules-body strong { color: var(--text); }
        .rules-body a { color: var(--gold); text-underline-offset: 3px; }
        .rules-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.88rem; }
        .rules-body th { background: var(--bg-2); color: var(--muted); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        .rules-body td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
        .rules-body blockquote { border-left: 3px solid var(--gold); padding: 0.5rem 1rem; color: var(--muted); font-style: italic; margin: 1.5rem 0; background: var(--bg-1); border-radius: 0 6px 6px 0; }
        .rules-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

        /* Updated stamp */
        .updated-stamp { font-size: 0.75rem; color: var(--muted); margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

        /* States */
        .state-msg { text-align: center; padding: 4rem 2rem; }
        .state-msg h3 { font-family: 'Anton', sans-serif; font-size: 1.3rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.5rem; }
        .state-msg p { color: var(--muted); font-size: 0.88rem; }
        .loading { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: 'Orbitron', sans-serif; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; }

        @media (max-width: 580px) {
            .gtec-nav { padding: 1rem; }
            .hero { padding: 2rem 1rem 1.5rem; }
            .content { padding: 1rem 1rem 3rem; }
        }
    </style>
</head>
<body>

<nav class="gtec-nav">
    <a class="brand" href="/endurance/">Gran Turismo<span class="accent"> GTEC</span></a>
    <div class="nav-links">
        <a href="/endurance/calendar/">Calendar</a>
        <a href="/endurance/news/">News</a>
        <a href="/endurance/standings/">Standings</a>
        <a href="/endurance/drivers/">Drivers</a>
        <a href="/endurance/teams/">Teams</a>
        <a href="/endurance/stats/">Stats</a>
        <a href="/endurance/rules/" class="active">Rules</a>
        <a href="/endurance/profile/login/" id="nav-signin" style="display:none">Sign In</a>
        <a href="/endurance/profile/" id="nav-portal" style="display:none">My Profile</a>
        <a class="apply" href="/endurance/apply/">Apply</a>
        <a class="back" href="/">← SparksTheory</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-eyebrow">Championship</div>
    <div class="hero-title" id="page-title">Rules</div>
    <div class="hero-sub" id="page-sub">Gran Turismo GTEC Sporting Regulations</div>
</div>

<div class="content">
    <div id="rules-content"><div class="loading">Loading…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/gtec-config.js"></script>
<script>
'use strict';
const { createClient } = window.supabase;
const sb = createClient(window.GTEC_CONFIG.supabaseUrl, window.GTEC_CONFIG.supabaseAnonKey);
sb.auth.getSession().then(({ data }) => {
    const portal = document.getElementById('nav-portal');
    const signin = document.getElementById('nav-signin');
    if (data.session) { if (portal) portal.style.display = ''; }
    else              { if (signin) signin.style.display = ''; }
});

async function load() {
    const el = document.getElementById('rules-content');
    const { data, error } = await sb.from('pages').select('*').eq('slug', 'rules').maybeSingle();

    if (error || !data) {
        el.innerHTML = `<div class="state-msg"><h3>Not Available</h3><p>The sporting regulations have not been published yet.</p></div>`;
        return;
    }

    document.getElementById('page-title').textContent = data.title;
    document.title = `${data.title} — Gran Turismo GTEC`;

    const updatedStr = data.updated_at
        ? new Date(data.updated_at).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })
        : null;

    el.innerHTML = `
        <div class="rules-body">${data.body || '<p style="color:var(--muted)">No content published yet.</p>'}</div>
        ${updatedStr ? `<div class="updated-stamp">Last updated: ${updatedStr}</div>` : ''}`;
}

load();
</script>
</body>
</html>
