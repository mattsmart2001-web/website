[build]
  publish = "."
  command = "echo 'No build needed - static site'"

[build.environment]
  # gtec-config.js intentionally contains the public Supabase anon key and URL.
  # These are client-side credentials by design - not secrets.
  SECRETS_SCAN_OMIT_PATHS = "endurance/assets/gtec-config.js"

# Legacy Shopify URLs. The site previously ran a store under these paths
# and Google still has them in its index. Return HTTP 410 (Gone) so Google
# drops them rather than treating them as soft duplicates of the homepage,
# which is what the catch-all below would otherwise do.
[[redirects]]
  from = "/products/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/collections/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/pages/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/policies/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/supporters/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/en-eur"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/en-eur/*"
  to = "/gone"
  status = 410
  force = true

# Clean URL for the season calendar ICS feed - calendar apps subscribe to
# this directly, so it needs a stable path rather than the raw function URL.
[[redirects]]
  from = "/endurance/calendar.ics"
  to = "/.netlify/functions/calendar-feed"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Serve the TWA Digital Asset Links file as JSON. Google's verification service
# is lenient about content type, but on-device Chrome/Android TWA verification
# can reject the file unless it is served as application/json, which leaves the
# address bar showing even though the file is correct.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Security headers scoped to /endurance/* only so the main SparksTheory
# site isn't affected. 'unsafe-inline' on script/style is required because
# the pages use inline onclick handlers and <style> blocks throughout.
# The meaningful protection here is locking down connect-src, frame-src,
# and blocking object embeds and base-tag hijacking.
[[headers]]
  for = "/endurance/*"
  [headers.values]
    # connect-src also allows the connector on the reader's own machine, for
    # the portal's coaching tab. That tab reads GT7 telemetry from
    # ws://localhost:8765, which the driver is already running for live
    # timing, and without this the browser refuses the socket before it is
    # opened: the WebSocket constructor throws, and the tab sits on "Looking
    # for the connector" for ever while the connector is running perfectly
    # well a few inches away.
    #
    # This is why the lap coach on the main site has always worked and the
    # portal's did not. These headers are scoped to /endurance/* on purpose,
    # so the main site never had the restriction to run into.
    #
    # localhost only. It grants the page nothing beyond the machine it is
    # being read on, and both spellings are listed because which one a
    # browser matches depends on how it resolves the name.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net unpkg.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com unpkg.com cdnjs.cloudflare.com; font-src 'self' fonts.gstatic.com cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://wtryzoabpkqtucfpmbnn.supabase.co wss://wtryzoabpkqtucfpmbnn.supabase.co ws://localhost:8765 ws://127.0.0.1:8765; frame-src www.youtube.com player.vimeo.com clips.twitch.tv player.twitch.tv; worker-src 'self'; object-src 'none'; base-uri 'self';"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[functions]
