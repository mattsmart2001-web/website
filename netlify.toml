[build]
  publish = "."
  command = "echo 'No build needed - static site'"

[build.environment]
  # gtec-config.js intentionally contains the public Supabase anon key and URL.
  # These are client-side credentials by design — not secrets.
  SECRETS_SCAN_OMIT_PATHS = "endurance/assets/gtec-config.js"

# Legacy Shopify URLs. The site previously ran a store under these paths
# and Google still has them in its index. Return HTTP 410 (Gone) so Google
# drops them rather than treating them as soft duplicates of the homepage,
# which is what the catch-all below would otherwise do.
[[redirects]]
  from = "/products/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/collections/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/pages/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/policies/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/supporters/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/en-eur"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/en-eur/*"
  to = "/gone"
  status = 410
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers — scoped to /endurance/* only so the main SparksTheory
# site isn't affected. 'unsafe-inline' on script/style is required because
# the pages use inline onclick handlers and <style> blocks throughout.
# The meaningful protection here is locking down connect-src, frame-src,
# and blocking object embeds and base-tag hijacking.
[[headers]]
  for = "/endurance/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net unpkg.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com unpkg.com cdnjs.cloudflare.com; font-src 'self' fonts.gstatic.com cdnjs.cloudflare.com; img-src 'self' data: blob: img.youtube.com https://wtryzoabpkqtucfpmbnn.supabase.co; connect-src 'self' https://wtryzoabpkqtucfpmbnn.supabase.co wss://wtryzoabpkqtucfpmbnn.supabase.co; frame-src www.youtube.com player.vimeo.com clips.twitch.tv player.twitch.tv; worker-src 'self'; object-src 'none'; base-uri 'self';"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

