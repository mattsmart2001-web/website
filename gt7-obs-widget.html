<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT7 Stats OBS Widget - Leaderboard Row</title>
    <style>
        /* ===== CONFIGURATION ===== */
        :root {
            --primary-color: #0ea5e9;
            --secondary-color: #38bdf8;
            --bg-color: rgba(10, 14, 18, 0.95);
            --border-color: rgba(96, 197, 255, 0.3);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: transparent;
            color: var(--text-color);
            overflow: hidden;
        }

        .widget-container {
            width: 1400px;
            height: 60px;
            background: linear-gradient(180deg, rgba(96,197,255,0.08) 0%, rgba(14,165,233,0.08) 50%, rgba(96,197,255,0.08) 100%);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Accent bar at top */
        .widget-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .psn-name {
            min-width: 180px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .dr-stat {
            min-width: 120px;
        }

        .dr-stat .stat-value {
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .trend-graph {
            min-width: 100px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rank-stat .stat-value {
            color: var(--primary-color);
            font-size: 1.4rem;
            font-weight: 800;
        }

        .sr-stat .stat-value {
            color: var(--secondary-color);
            font-size: 1.3rem;
            font-weight: 800;
        }

        .percentage {
            color: var(--primary-color);
        }

        .percentage.alt {
            color: var(--secondary-color);
        }

        /* Loading state */
        .loading {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <!-- PSN Name -->
        <div class="psn-name" id="psnName">
            <div class="stat-label">PSN ID</div>
            <div class="loading">Loading...</div>
        </div>

        <!-- DR -->
        <div class="stat-item dr-stat">
            <div class="stat-label">DR</div>
            <div class="stat-value" id="drValue">-</div>
        </div>

        <!-- Trend Graph -->
        <div class="trend-graph" id="trendGraph">
            <div class="stat-label">Trend</div>
        </div>

        <!-- Rank -->
        <div class="stat-item rank-stat">
            <div class="stat-label">Rank</div>
            <div class="stat-value" id="rankValue">-</div>
        </div>

        <!-- SR -->
        <div class="stat-item sr-stat">
            <div class="stat-label">SR</div>
            <div class="stat-value" id="srValue">-</div>
        </div>

        <!-- Races -->
        <div class="stat-item">
            <div class="stat-label">Races</div>
            <div class="stat-value" id="racesValue">-</div>
        </div>

        <!-- Win % -->
        <div class="stat-item">
            <div class="stat-label">Win %</div>
            <div class="stat-value percentage" id="winValue">-</div>
        </div>

        <!-- Pole % -->
        <div class="stat-item">
            <div class="stat-label">Pole %</div>
            <div class="stat-value percentage alt" id="poleValue">-</div>
        </div>

        <!-- FL % -->
        <div class="stat-item">
            <div class="stat-label">FL %</div>
            <div class="stat-value percentage" id="flValue">-</div>
        </div>
    </div>

    <script>
        // ===== USER CONFIGURATION =====
        const CONFIG = {
            PSN_ID: 'SparksTheory',
            USER_ID: '85596fe8-f2f8-45c1-9474-f3357e8d9446',
            COUNTRY_CODE: 'GB',
            REFRESH_INTERVAL: 300000, // 5 minutes
            USE_CORS_PROXY: true
        };

        // DR History Cache
        let drHistoryCache = null;

        // Create sparkline SVG for DR trend
        function createSparkline(historyData, width = 100, height = 40) {
            if (!historyData || typeof historyData !== 'object') {
                return '<svg width="100" height="40"></svg>';
            }

            const dataPoints = Object.values(historyData)
                .map(entry => entry.dr || 0)
                .filter(dr => dr > 0)
                .slice(-30)
                .reverse();

            if (dataPoints.length < 2) {
                return '<svg width="100" height="40"></svg>';
            }

            const minDR = Math.min(...dataPoints);
            const maxDR = Math.max(...dataPoints);
            const range = maxDR - minDR || 1;

            const stepX = width / (dataPoints.length - 1);
            const points = dataPoints.map((dr, i) => {
                const x = i * stepX;
                const y = height - ((dr - minDR) / range * (height - 4)) - 2;
                return `${x},${y}`;
            }).join(' ');

            const trend = dataPoints[dataPoints.length - 1] - dataPoints[0];
            const color = trend >= 0 ? '#00ff88' : '#ff4444';

            return `<svg width="${width}" height="${height}" style="display: block;">
                <polyline
                    points="${points}"
                    fill="none"
                    stroke="${color}"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    opacity="0.8"
                />
            </svg>`;
        }

        async function fetchDRHistory() {
            if (drHistoryCache) return drHistoryCache;

            try {
                const apiUrl = `https://gtstats.live/api/getDriverStatsHistory?user_id=${CONFIG.USER_ID}&psn=${encodeURIComponent(CONFIG.PSN_ID)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

                const response = await fetch(proxyUrl);
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);

                drHistoryCache = data;
                return data;
            } catch (error) {
                console.error('Error fetching DR history:', error);
                return null;
            }
        }

        async function fetchGT7Stats() {
            try {
                const apiUrl = `https://gtstats.live/api/getDriverRatingPSN?psn=${encodeURIComponent(CONFIG.PSN_ID)}`;
                const url = CONFIG.USE_CORS_PROXY
                    ? `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`
                    : apiUrl;

                const response = await fetch(url);
                const data = CONFIG.USE_CORS_PROXY
                    ? JSON.parse((await response.json()).contents)
                    : await response.json();

                return data;
            } catch (error) {
                console.error('Error fetching GT7 stats:', error);
                throw error;
            }
        }

        function getSRGrade(sr) {
            const grades = ['E', 'E', 'D', 'C', 'B', 'A', 'S'];
            return grades[sr] || 'E';
        }

        async function displayStats(data) {
            const drPoints = data.dr || 0;
            const driverRating = data.rank || 'E';
            const srValue = data.sr || 0;
            const sportsmanship = getSRGrade(srValue);
            const totalRaces = data.raceCount || 0;
            const wins = data.winCount || 0;
            const poles = data.polePositionCount || 0;
            const fastestLaps = data.fastestLapCount || 0;

            const winPercentage = totalRaces > 0 ? ((wins / totalRaces) * 100).toFixed(1) : '0.0';
            const polePercentage = totalRaces > 0 ? ((poles / totalRaces) * 100).toFixed(1) : '0.0';
            const flPercentage = totalRaces > 0 ? ((fastestLaps / totalRaces) * 100).toFixed(1) : '0.0';

            // Update PSN name
            document.getElementById('psnName').innerHTML = `
                <div class="stat-label">PSN ID</div>
                <div class="stat-value">${CONFIG.PSN_ID}</div>
            `;

            // Update DR
            document.getElementById('drValue').textContent = drPoints.toLocaleString();

            // Update Rank
            document.getElementById('rankValue').textContent = driverRating;

            // Update SR
            document.getElementById('srValue').textContent = sportsmanship;

            // Update Races
            document.getElementById('racesValue').textContent = totalRaces.toLocaleString();

            // Update Win %
            document.getElementById('winValue').textContent = winPercentage + '%';

            // Update Pole %
            document.getElementById('poleValue').textContent = polePercentage + '%';

            // Update FL %
            document.getElementById('flValue').textContent = flPercentage + '%';

            // Fetch and display trend graph
            const historyData = await fetchDRHistory();
            if (historyData) {
                document.getElementById('trendGraph').innerHTML = createSparkline(historyData, 100, 40);
            }
        }

        async function updateStats() {
            try {
                const data = await fetchGT7Stats();
                await displayStats(data);
            } catch (error) {
                console.error('Failed to update stats:', error);
            }
        }

        // Initial load
        updateStats();

        // Auto-refresh every 5 minutes
        setInterval(updateStats, CONFIG.REFRESH_INTERVAL);
    </script>
</body>
</html>
