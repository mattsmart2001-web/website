<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT7 Stats OBS Widget - Horizontal</title>
    <style>
        /* ===== CONFIGURATION ===== */
        :root {
            --primary-color: #00ff88;
            --secondary-color: #0ea5e9;
            --bg-color: rgba(10, 14, 18, 0.95);
            --border-color: rgba(0, 255, 136, 0.3);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background: transparent;
            color: var(--text-color);
            overflow: hidden;
        }

        .widget-container {
            width: 1000px;
            height: 100px;
            position: relative;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2);
        }

        /* Accent bar at top */
        .widget-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            z-index: 10;
        }

        /* Static left section - DR and Rank */
        .static-section {
            position: absolute;
            left: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: linear-gradient(90deg, var(--bg-color) 0%, var(--bg-color) 85%, transparent 100%);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 20px;
            gap: 6px;
            z-index: 5;
        }

        .flag-psn {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flag-container {
            font-size: 2.5rem;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.3));
        }

        .psn-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dr-display {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .dr-rank {
            font-size: 5rem;
            font-weight: 900;
            color: var(--primary-color);
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            letter-spacing: -2px;
        }

        .dr-points {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1;
        }

        /* Scrolling section - Stats ticker */
        .scrolling-section {
            position: absolute;
            left: 280px;
            top: 0;
            right: 0;
            height: 100%;
            overflow: hidden;
        }

        .stats-ticker {
            display: flex;
            align-items: center;
            height: 100%;
            gap: 40px;
            padding: 0 20px;
            animation: scroll-left 20s linear infinite;
            white-space: nowrap;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 100px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--secondary-color);
            line-height: 1;
            text-shadow: 0 0 10px rgba(14, 165, 233, 0.4);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .stat-separator {
            width: 2px;
            height: 50px;
            background: linear-gradient(180deg, transparent, var(--border-color), transparent);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .error {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="widget-container" id="widget">
        <div class="loading">Loading GT7 stats...</div>
    </div>

    <script>
        // ===== CONFIGURATION - EDIT THESE VALUES =====
        const CONFIG = {
            PSN_ID: 'SparksTheory',              // Your PSN ID
            USER_ID: '85596fe8-f2f8-45c1-9474-f3357e8d9446', // Your GT7 User ID (get from gtstats.live)
            COUNTRY_CODE: 'GB',                  // Your country code (e.g., 'US', 'GB', 'JP')
            REFRESH_INTERVAL: 180000,             // Refresh every 3 minutes (180000ms)
            USE_CORS_PROXY: true                  // Use CORS proxy (required for OBS)
        };
        // =============================================

        function getCountryFlag(countryCode) {
            if (!countryCode) return '';
            const codePoints = countryCode
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        async function fetchGT7Stats() {
            try {
                const apiUrl = `https://gtstats.live/api/getDriverStatsHistory?user_id=${CONFIG.USER_ID}&psn=${encodeURIComponent(CONFIG.PSN_ID)}`;

                let response, data;

                if (CONFIG.USE_CORS_PROXY) {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
                    response = await fetch(proxyUrl);
                    const proxyData = await response.json();
                    data = JSON.parse(proxyData.contents);
                } else {
                    response = await fetch(apiUrl);
                    data = await response.json();
                }

                return data;
            } catch (error) {
                console.error('Error fetching GT7 stats:', error);
                throw error;
            }
        }

        function getSRGrade(sr) {
            const grades = ['E', 'E', 'D', 'C', 'B', 'A', 'S'];
            return grades[sr] || 'E';
        }

        function displayStats(data) {
            const widget = document.getElementById('widget');

            if (!data || (Array.isArray(data) && data.length === 0)) {
                widget.innerHTML = `
                    <div class="error">
                        No stats found for ${CONFIG.PSN_ID}
                    </div>
                `;
                return;
            }

            const latestStats = data["0"] || data[0] || data;

            const drPoints = latestStats.dr || 0;
            const driverRating = latestStats.rank || 'E';
            const srValue = latestStats.sr || 0;
            const sportsmanship = getSRGrade(srValue);
            const totalRaces = latestStats.raceCount || 0;
            const wins = latestStats.winCount || 0;
            const poles = latestStats.polePositionCount || 0;
            const fastestLaps = latestStats.fastestLapCount || 0;

            const winRate = totalRaces > 0 ? ((wins / totalRaces) * 100).toFixed(1) : '0.0';
            const poleRate = totalRaces > 0 ? ((poles / totalRaces) * 100).toFixed(1) : '0.0';
            const flRate = totalRaces > 0 ? ((fastestLaps / totalRaces) * 100).toFixed(1) : '0.0';

            const flag = getCountryFlag(CONFIG.COUNTRY_CODE);

            widget.innerHTML = `
                <!-- Static DR/Rank Section -->
                <div class="static-section">
                    <div class="dr-display">
                        <div class="dr-rank">${driverRating}</div>
                        <div class="dr-points">${drPoints.toLocaleString()}</div>
                    </div>
                    <div class="flag-psn">
                        <div class="flag-container">${flag}</div>
                        <div class="psn-name">${CONFIG.PSN_ID}</div>
                    </div>
                </div>

                <!-- Scrolling Stats Section -->
                <div class="scrolling-section">
                    <div class="stats-ticker">
                        <!-- First set of stats -->
                        <div class="stat-item sr">
                            <div class="stat-value">${sportsmanship}</div>
                            <div class="stat-label">SR ${srValue}</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${totalRaces}</div>
                            <div class="stat-label">Races</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${wins}</div>
                            <div class="stat-label">Wins</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${winRate}%</div>
                            <div class="stat-label">Win Rate</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${poles}</div>
                            <div class="stat-label">Poles</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${poleRate}%</div>
                            <div class="stat-label">Pole Rate</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${fastestLaps}</div>
                            <div class="stat-label">Fast Laps</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${flRate}%</div>
                            <div class="stat-label">FL Rate</div>
                        </div>

                        <!-- Duplicate set for seamless loop -->
                        <div class="stat-separator"></div>
                        <div class="stat-item sr">
                            <div class="stat-value">${sportsmanship}</div>
                            <div class="stat-label">SR ${srValue}</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${totalRaces}</div>
                            <div class="stat-label">Races</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${wins}</div>
                            <div class="stat-label">Wins</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${winRate}%</div>
                            <div class="stat-label">Win Rate</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${poles}</div>
                            <div class="stat-label">Poles</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${poleRate}%</div>
                            <div class="stat-label">Pole Rate</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${fastestLaps}</div>
                            <div class="stat-label">Fast Laps</div>
                        </div>
                        <div class="stat-separator"></div>
                        <div class="stat-item">
                            <div class="stat-value">${flRate}%</div>
                            <div class="stat-label">FL Rate</div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function updateStats() {
            try {
                const data = await fetchGT7Stats();
                displayStats(data);
            } catch (error) {
                const widget = document.getElementById('widget');
                widget.innerHTML = `
                    <div class="error">
                        Error loading stats - Retrying in ${CONFIG.REFRESH_INTERVAL / 1000}s...
                    </div>
                `;
            }
        }

        // Initial load
        updateStats();

        // Auto-refresh
        setInterval(updateStats, CONFIG.REFRESH_INTERVAL);

        console.log('GT7 Horizontal OBS Widget loaded - PSN:', CONFIG.PSN_ID);
    </script>
</body>
</html>
