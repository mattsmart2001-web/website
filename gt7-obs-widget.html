<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT7 Stats OBS Widget</title>
    <style>
        /* ===== CONFIGURATION ===== */
        :root {
            --primary-color: #00ff88;
            --secondary-color: #0ea5e9;
            --bg-color: rgba(10, 14, 18, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: var(--text-color);
            padding: 20px;
        }

        .widget-container {
            max-width: 600px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .stat-card.dr {
            border-color: var(--primary-color);
        }

        .stat-card.sr {
            border-color: var(--secondary-color);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        .dr .stat-value {
            color: var(--primary-color);
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .sr .stat-value {
            color: var(--secondary-color);
            text-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .stat-points {
            font-size: 1.1rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-points span {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .race-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .race-stat {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .race-stat:hover {
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        .race-stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .race-stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .psn-badge {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .psn-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .psn-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #fca5a5;
        }

        .last-updated {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* Glowing animation on update */
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px var(--primary-color); }
            50% { box-shadow: 0 0 20px var(--primary-color); }
        }

        .updated {
            animation: glow 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="widget-container" id="widget">
        <div class="loading">Loading GT7 stats...</div>
    </div>

    <script>
        // ===== CONFIGURATION - EDIT THESE VALUES =====
        const CONFIG = {
            PSN_ID: 'SparksTheory',              // Your PSN ID
            USER_ID: '85596fe8-f2f8-45c1-9474-f3357e8d9446', // Your GT7 User ID (get from gtstats.live)
            REFRESH_INTERVAL: 30000,              // Refresh every 30 seconds (30000ms)
            USE_CORS_PROXY: true                  // Use CORS proxy (required for OBS)
        };
        // =============================================

        let lastData = null;

        async function fetchGT7Stats() {
            try {
                const apiUrl = `https://gtstats.live/api/getDriverStatsHistory?user_id=${CONFIG.USER_ID}&psn=${encodeURIComponent(CONFIG.PSN_ID)}`;

                let response, data;

                if (CONFIG.USE_CORS_PROXY) {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
                    response = await fetch(proxyUrl);
                    const proxyData = await response.json();
                    data = JSON.parse(proxyData.contents);
                } else {
                    response = await fetch(apiUrl);
                    data = await response.json();
                }

                return data;
            } catch (error) {
                console.error('Error fetching GT7 stats:', error);
                throw error;
            }
        }

        function getSRGrade(sr) {
            const grades = ['E', 'E', 'D', 'C', 'B', 'A', 'S'];
            return grades[sr] || 'E';
        }

        function displayStats(data) {
            const widget = document.getElementById('widget');

            if (!data || (Array.isArray(data) && data.length === 0)) {
                widget.innerHTML = `
                    <div class="error">
                        <h2>No Stats Found</h2>
                        <p>Unable to load stats for ${CONFIG.PSN_ID}</p>
                    </div>
                `;
                return;
            }

            const latestStats = data["0"] || data[0] || data;

            const drPoints = latestStats.dr || 0;
            const driverRating = latestStats.rank || 'E';
            const srValue = latestStats.sr || 0;
            const sportsmanship = getSRGrade(srValue);
            const totalRaces = latestStats.raceCount || 0;
            const wins = latestStats.winCount || 0;
            const poles = latestStats.polePositionCount || 0;
            const fastestLaps = latestStats.fastestLapCount || 0;

            const now = new Date().toLocaleTimeString();

            widget.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card dr ${lastData ? 'updated' : ''}">
                        <div class="stat-label">Driver Rating</div>
                        <div class="stat-value">${driverRating}</div>
                        <div class="stat-points">${drPoints.toLocaleString()} <span>points</span></div>
                    </div>
                    <div class="stat-card sr ${lastData ? 'updated' : ''}">
                        <div class="stat-label">Sportsmanship</div>
                        <div class="stat-value">${sportsmanship}</div>
                        <div class="stat-points">${srValue} <span>rating</span></div>
                    </div>
                </div>

                <div class="race-stats">
                    <div class="race-stat">
                        <div class="race-stat-value">${totalRaces}</div>
                        <div class="race-stat-label">Races</div>
                    </div>
                    <div class="race-stat">
                        <div class="race-stat-value">${wins}</div>
                        <div class="race-stat-label">Wins</div>
                    </div>
                    <div class="race-stat">
                        <div class="race-stat-value">${poles}</div>
                        <div class="race-stat-label">Poles</div>
                    </div>
                    <div class="race-stat">
                        <div class="race-stat-value">${fastestLaps}</div>
                        <div class="race-stat-label">Fast Laps</div>
                    </div>
                </div>

                <div class="psn-badge">
                    <div class="psn-name">${CONFIG.PSN_ID}</div>
                    <div class="psn-label">PSN ID • GT7 Sport Mode</div>
                </div>

                <div class="last-updated">Last updated: ${now}</div>
            `;

            lastData = data;
        }

        async function updateStats() {
            try {
                const data = await fetchGT7Stats();
                displayStats(data);
            } catch (error) {
                const widget = document.getElementById('widget');
                widget.innerHTML = `
                    <div class="error">
                        <h2>Error Loading Stats</h2>
                        <p>${error.message}</p>
                        <p style="font-size: 0.8rem; margin-top: 10px;">Retrying in ${CONFIG.REFRESH_INTERVAL / 1000} seconds...</p>
                    </div>
                `;
            }
        }

        // Initial load
        updateStats();

        // Auto-refresh
        setInterval(updateStats, CONFIG.REFRESH_INTERVAL);

        console.log('GT7 OBS Widget loaded - PSN:', CONFIG.PSN_ID);
    </script>
</body>
</html>
