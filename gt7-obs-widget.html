<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT7 Stats OBS Widget - Horizontal</title>
    <style>
        /* ===== CONFIGURATION ===== */
        :root {
            --primary-color: #00ff88;
            --secondary-color: #0ea5e9;
            --bg-color: rgba(10, 14, 18, 0.95);
            --border-color: rgba(0, 255, 136, 0.3);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background: transparent;
            color: var(--text-color);
            overflow: hidden;
        }

        .widget-container {
            width: 1000px;
            height: 100px;
            position: relative;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2);
        }

        /* Accent bar at top */
        .widget-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            z-index: 10;
        }

        /* Static left section - DR and Rank */
        .static-section {
            position: absolute;
            left: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: linear-gradient(90deg, var(--bg-color) 0%, var(--bg-color) 85%, transparent 100%);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 20px;
            gap: 2px;
            z-index: 5;
        }

        .psn-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1;
            margin-top: 8px;
            margin-bottom: -6px;
        }

        .dr-display {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 12px;
        }

        .dr-rank {
            font-size: 5rem;
            font-weight: 900;
            color: var(--primary-color);
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            letter-spacing: -2px;
        }

        .dr-points {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1;
        }

        /* Stats display section */
        .stats-section {
            position: absolute;
            left: 280px;
            top: 0;
            right: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
        }

        .stat-display {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .stat-display.active {
            opacity: 1;
        }

        .stat-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-divider {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: 900;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 900;
            color: var(--secondary-color);
            line-height: 1;
            text-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .error {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="widget-container" id="widget">
        <div class="loading">Loading GT7 stats...</div>
    </div>

    <script>
        // ===== CONFIGURATION - EDIT THESE VALUES =====
        const CONFIG = {
            PSN_ID: 'SparksTheory',              // Your PSN ID
            USER_ID: '85596fe8-f2f8-45c1-9474-f3357e8d9446', // Your GT7 User ID (get from gtstats.live)
            COUNTRY_CODE: 'GB',                  // Your country code (e.g., 'US', 'GB', 'JP')
            REFRESH_INTERVAL: 600000,             // Refresh every 10 minutes (600000ms)
            USE_CORS_PROXY: true                  // Use CORS proxy (required for OBS)
        };
        // =============================================

        function getCountryFlag(countryCode) {
            if (!countryCode) return '';
            const codePoints = countryCode
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        async function fetchGT7Stats() {
            try {
                const apiUrl = `https://gtstats.live/api/getDriverStatsHistory?user_id=${CONFIG.USER_ID}&psn=${encodeURIComponent(CONFIG.PSN_ID)}`;

                let response, data;

                if (CONFIG.USE_CORS_PROXY) {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
                    response = await fetch(proxyUrl);
                    const proxyData = await response.json();
                    data = JSON.parse(proxyData.contents);
                } else {
                    response = await fetch(apiUrl);
                    data = await response.json();
                }

                return data;
            } catch (error) {
                console.error('Error fetching GT7 stats:', error);
                throw error;
            }
        }

        function getSRGrade(sr) {
            const grades = ['E', 'E', 'D', 'C', 'B', 'A', 'S'];
            return grades[sr] || 'E';
        }

        function displayStats(data) {
            const widget = document.getElementById('widget');

            if (!data || (Array.isArray(data) && data.length === 0)) {
                widget.innerHTML = `
                    <div class="error">
                        No stats found for ${CONFIG.PSN_ID}
                    </div>
                `;
                return;
            }

            const latestStats = data["0"] || data[0] || data;

            const drPoints = latestStats.dr || 0;
            const driverRating = latestStats.rank || 'E';
            const srValue = latestStats.sr || 0;
            const sportsmanship = getSRGrade(srValue);
            const totalRaces = latestStats.raceCount || 0;
            const wins = latestStats.winCount || 0;
            const poles = latestStats.polePositionCount || 0;
            const fastestLaps = latestStats.fastestLapCount || 0;

            const winRate = totalRaces > 0 ? ((wins / totalRaces) * 100).toFixed(1) : '0.0';
            const poleRate = totalRaces > 0 ? ((poles / totalRaces) * 100).toFixed(1) : '0.0';
            const flRate = totalRaces > 0 ? ((fastestLaps / totalRaces) * 100).toFixed(1) : '0.0';

            const flag = getCountryFlag(CONFIG.COUNTRY_CODE);

            widget.innerHTML = `
                <!-- Static DR/Rank Section -->
                <div class="static-section">
                    <div class="psn-name">${CONFIG.PSN_ID}</div>
                    <div class="dr-display">
                        <div class="dr-rank">${driverRating}</div>
                        <div class="dr-points">${drPoints.toLocaleString()}</div>
                    </div>
                </div>

                <!-- Fading Stats Section -->
                <div class="stats-section" id="stats-container">
                    <div class="stat-display" data-stat="sr">
                        <div class="stat-name">SPORTSMANSHIP</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${sportsmanship}</div>
                    </div>
                    <div class="stat-display" data-stat="races">
                        <div class="stat-name">RACES</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${totalRaces.toLocaleString()}</div>
                    </div>
                    <div class="stat-display" data-stat="wins">
                        <div class="stat-name">WINS</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${wins.toLocaleString()}</div>
                    </div>
                    <div class="stat-display" data-stat="winrate">
                        <div class="stat-name">WIN RATE</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${winRate}%</div>
                    </div>
                    <div class="stat-display" data-stat="poles">
                        <div class="stat-name">POLES</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${poles.toLocaleString()}</div>
                    </div>
                    <div class="stat-display" data-stat="polerate">
                        <div class="stat-name">POLE RATE</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${poleRate}%</div>
                    </div>
                    <div class="stat-display" data-stat="fastlaps">
                        <div class="stat-name">FAST LAPS</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${fastestLaps.toLocaleString()}</div>
                    </div>
                    <div class="stat-display" data-stat="flrate">
                        <div class="stat-name">FL RATE</div>
                        <div class="stat-divider">-</div>
                        <div class="stat-number">${flRate}%</div>
                    </div>
                </div>
            `;
        }

        async function updateStats() {
            try {
                const data = await fetchGT7Stats();
                displayStats(data);
            } catch (error) {
                const widget = document.getElementById('widget');
                widget.innerHTML = `
                    <div class="error">
                        Error loading stats - Retrying in ${CONFIG.REFRESH_INTERVAL / 1000}s...
                    </div>
                `;
            }
        }

        // Fade stat cycling
        let currentStatIndex = 0;
        const statDisplayTime = 8000; // 8 seconds per stat

        function cycleStats() {
            const allStats = document.querySelectorAll('.stat-display');
            if (allStats.length === 0) return;

            // Remove active from all
            allStats.forEach(stat => stat.classList.remove('active'));

            // Add active to current
            allStats[currentStatIndex].classList.add('active');

            // Move to next stat
            currentStatIndex = (currentStatIndex + 1) % allStats.length;
        }

        // Initial load
        updateStats();

        // Start cycling stats after a brief delay
        setTimeout(() => {
            cycleStats(); // Show first stat immediately
            setInterval(cycleStats, statDisplayTime);
        }, 500);

        // Auto-refresh
        setInterval(updateStats, CONFIG.REFRESH_INTERVAL);

        console.log('GT7 Horizontal OBS Widget loaded - PSN:', CONFIG.PSN_ID);
    </script>
</body>
</html>
